name: Platform live user QA

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN-LIVE-USER-QA to run the destructive automated production contour"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: platform-live-user-qa
  cancel-in-progress: false

jobs:
  validate-live-user-inputs:
    name: Validate live-user QA handoff
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      handoff_artifact_id: ${{ steps.upload_handoff.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
    env:
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Require exact dev live-user QA dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/dev
          test "$TARGET_SHA" = "$GITHUB_SHA"
          test "$QA_CONFIRMATION" = "RUN-LIVE-USER-QA"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout reviewed live-user QA source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact checked-out live-user QA source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          /usr/bin/python3 platform/tools/platform_workflow_input_guard.py confirmation \
            --value "$QA_CONFIRMATION" --expected "RUN-LIVE-USER-QA"
          /usr/bin/python3 platform/tools/platform_workflow_input_guard.py sha --value "$TARGET_SHA"
      - name: Resolve authenticated app source binding
        id: resolve-source-binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 platform/tools/platform_noop_source_binding.py \
            resolve-workflow-source-binding "$TARGET_SHA" "$GITHUB_REPOSITORY" \
            "${GITHUB_API_URL:-https://api.github.com}" \
            "$RUNNER_TEMP/live-source-binding" "$GITHUB_OUTPUT"
      - name: Validate and serialize live-user QA handoff
        id: create_handoff
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 platform/tools/platform_noop_source_binding.py \
            create-live-handoff "$TARGET_SHA" "https://old-sparky.com" \
            "false" "" "$RUNNER_TEMP/live-source-binding/source-binding.json" \
            "$RUNNER_TEMP/live-user-qa-input.json"
          test "$(stat -c '%a' "$RUNNER_TEMP/live-user-qa-input.json")" = 600
      - name: Upload closed live-user QA handoff
        id: upload_handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-live-user-qa-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-user-qa-input.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove validator source handoffs
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/live-user-qa-input.json"
          source_binding_dir="$RUNNER_TEMP/live-source-binding"
          if [[ -e "$source_binding_dir" || -L "$source_binding_dir" ]]; then
            test -d "$source_binding_dir" && test ! -L "$source_binding_dir"
            rm -f -- "$source_binding_dir/source-binding.json"
            rmdir -- "$source_binding_dir"
          fi
          test ! -e "$source_binding_dir" && test ! -L "$source_binding_dir"

  live-user-qa:
    needs: validate-live-user-inputs
    name: Automated live-user QA on production server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      contents: none
    env:
      TARGET_SHA: ${{ github.sha }}
      HANDOFF_ARTIFACT_ID: ${{ needs.validate-live-user-inputs.outputs.handoff_artifact_id }}
      HANDOFF_ARTIFACT_NAME: platform-live-user-qa-input-${{ github.run_id }}-${{ github.run_attempt }}
      HANDOFF_MEMBER_NAME: live-user-qa-input.json
    steps:
      - name: Authenticate and install closed live-user QA handoff
        id: authenticate_live_user_handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          SHA = re.compile(r"[0-9a-f]{40}\Z")
          DIGEST = re.compile(r"sha256:[0-9a-f]{64}\Z")
          MAX_API = 8 * 1024 * 1024
          MAX_ZIP = 2 * 1024 * 1024
          MAX_MEMBER = 20 * 1024
          MAX_BINDING = 16 * 1024
          SENSITIVE = {"authorization", "proxy-authorization", "cookie", "cookie2"}

          def fail():
              raise SystemExit("live QA handoff validation failed closed")

          def pairs(rows):
              result = {}
              for key, value in rows:
                  if key in result:
                      fail()
                  result[key] = value
              return result

          def canonical(value):
              return json.dumps(value, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("ascii")

          class SameOriginHTTPS(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  old = urllib.parse.urlsplit(req.full_url)
                  new = urllib.parse.urlsplit(newurl)
                  if (old.scheme != "https" or new.scheme != "https" or not new.netloc
                          or new.username is not None or new.password is not None
                          or (old.scheme, old.hostname, old.port) != (new.scheme, new.hostname, new.port)):
                      return None
                  return super().redirect_request(req, fp, code, msg, headers, newurl)

          class SafeArtifactHTTPS(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  old = urllib.parse.urlsplit(req.full_url)
                  new = urllib.parse.urlsplit(newurl)
                  if new.scheme != "https" or not new.netloc or new.username is not None or new.password is not None:
                      return None
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if redirected is not None and old.netloc.casefold() != new.netloc.casefold():
                      for collection in (redirected.headers, redirected.unredirected_hdrs):
                          for key in tuple(collection):
                              if key.casefold() in SENSITIVE:
                                  collection.pop(key, None)
                  return redirected

          def read_response(opener, request, limit):
              try:
                  with opener.open(request, timeout=30) as response:
                      if response.status != 200:
                          fail()
                      data = response.read(limit + 1)
              except (OSError, urllib.error.URLError, urllib.error.HTTPError, ValueError):
                  fail()
              if len(data) > limit:
                  fail()
              return data

          def strict_json(raw):
              value = json.loads(raw.decode("ascii"), object_pairs_hook=pairs,
                                 parse_constant=lambda _value: fail())
              return value

          env = os.environ
          runner = env.get("TARGET_SHA", "")
          if not SHA.fullmatch(runner) or runner != env.get("GITHUB_SHA"):
              fail()
          api_root = env.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          api_parts = urllib.parse.urlsplit(api_root)
          if api_parts.scheme != "https" or not api_parts.netloc or api_parts.username or api_parts.password:
              fail()
          repo = env.get("GITHUB_REPOSITORY", "")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              fail()
          run_id = env.get("GITHUB_RUN_ID", "")
          attempt = env.get("GITHUB_RUN_ATTEMPT", "")
          if not re.fullmatch(r"[1-9][0-9]{0,31}", run_id) or not re.fullmatch(r"[1-9][0-9]{0,31}", attempt):
              fail()
          workflow_path = ".github/workflows/platform-live-user-qa.yml"
          artifact_name = f"platform-live-user-qa-input-{run_id}-{attempt}"
          if env.get("HANDOFF_ARTIFACT_NAME") != artifact_name or env.get("HANDOFF_MEMBER_NAME") != "live-user-qa-input.json":
              fail()
          try:
              expected_id = int(env.get("HANDOFF_ARTIFACT_ID", ""), 10)
          except ValueError:
              fail()
          if expected_id <= 0 or str(expected_id) != env.get("HANDOFF_ARTIFACT_ID"):
              fail()
          token = env.get("GH_TOKEN", "")
          if not token:
              fail()
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "OldSparky-live-user-handoff"}
          api_opener = urllib.request.build_opener(SameOriginHTTPS())
          zip_opener = urllib.request.build_opener(SafeArtifactHTTPS())

          def api(path):
              request = urllib.request.Request(api_root + "/repos/" + repo + path, headers=headers)
              return strict_json(read_response(api_opener, request, MAX_API))

          workflow = api("/actions/workflows/platform-live-user-qa.yml")
          workflow_id = workflow.get("id") if isinstance(workflow, dict) else None
          if (not isinstance(workflow, dict) or workflow.get("path") != workflow_path
                  or type(workflow_id) is not int or workflow_id <= 0 or workflow.get("state") != "active"):
              fail()
          run = api(f"/actions/runs/{run_id}")
          if (not isinstance(run, dict) or type(run.get("id")) is not int or run["id"] != int(run_id)
                  or type(run.get("run_attempt")) is not int or run["run_attempt"] != int(attempt)
                  or type(run.get("workflow_id")) is not int or run["workflow_id"] != workflow_id
                  or run.get("head_sha") != runner or run.get("head_branch") != "dev"
                  or run.get("event") != "workflow_dispatch" or run.get("status") != "in_progress"):
              fail()
          listing = api(f"/actions/runs/{run_id}/artifacts?per_page=100&page=1")
          artifacts = listing.get("artifacts") if isinstance(listing, dict) else None
          total = listing.get("total_count") if isinstance(listing, dict) else None
          if not isinstance(artifacts, list) or type(total) is not int or total != len(artifacts):
              fail()
          matches = [item for item in artifacts if isinstance(item, dict) and item.get("name") == artifact_name]
          if len(matches) != 1 or type(matches[0].get("id")) is not int or matches[0]["id"] != expected_id:
              fail()
          metadata = api(f"/actions/artifacts/{expected_id}")
          size = metadata.get("size_in_bytes") if isinstance(metadata, dict) else None
          digest = metadata.get("digest") if isinstance(metadata, dict) else None
          if (not isinstance(metadata, dict) or type(metadata.get("id")) is not int or metadata["id"] != expected_id
                  or metadata.get("name") != artifact_name or metadata.get("expired") is not False
                  or type(size) is not int or not 0 < size <= MAX_ZIP
                  or not isinstance(digest, str) or not DIGEST.fullmatch(digest)
                  or ("size_in_bytes" in matches[0] and matches[0]["size_in_bytes"] != size)
                  or ("digest" in matches[0] and matches[0]["digest"] != digest)
                  or ("expired" in matches[0] and matches[0]["expired"] is not False)):
              fail()
          metadata_run = metadata.get("workflow_run")
          if (not isinstance(metadata_run, dict) or type(metadata_run.get("id")) is not int
                  or metadata_run["id"] != int(run_id) or metadata_run.get("head_sha") != runner
                  or ("run_attempt" in metadata_run and
                      (type(metadata_run["run_attempt"]) is not int or metadata_run["run_attempt"] != int(attempt)))):
              fail()
          zip_request = urllib.request.Request(api_root + "/repos/" + repo + f"/actions/artifacts/{expected_id}/zip", headers=headers)
          archive_bytes = read_response(zip_opener, zip_request, MAX_ZIP)
          if len(archive_bytes) != size or hashlib.sha256(archive_bytes).hexdigest() != digest.removeprefix("sha256:"):
              fail()
          try:
              with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                  entries = archive.infolist()
                  if len(entries) != 1 or entries[0].filename != "live-user-qa-input.json" or entries[0].is_dir():
                      fail()
                  info = entries[0]
                  if (info.file_size < 1 or info.file_size > MAX_MEMBER
                          or (info.external_attr >> 16) & 0o170000 == 0o120000):
                      fail()
                  with archive.open(info) as member:
                      raw = member.read(MAX_MEMBER + 1)
          except (OSError, EOFError, ValueError, zipfile.BadZipFile):
              fail()
          if len(raw) > MAX_MEMBER or len(raw) != info.file_size or not raw.endswith(b"\n") or raw.endswith(b"\n\n"):
              fail()
          payload = strict_json(raw[:-1])
          if not isinstance(payload, dict) or raw[:-1] != canonical(payload):
              fail()
          base_keys = {"schema", "base_url", "provision", "marker", "target_sha"}
          schema = payload.get("schema")
          if type(schema) is not str or schema not in ("1", "2"):
              fail()
          if schema == "1":
              if set(payload) != base_keys:
                  fail()
              app = runner
              binding_digest = ""
          else:
              if set(payload) != base_keys | {"source_binding"}:
                  fail()
              binding = payload.get("source_binding")
              binding_keys = {"schema", "binding_mode", "runner_sha", "app_target_sha", "baseline_identity",
                              "receipt_document_sha256", "receipt_artifact_id", "receipt_artifact_name",
                              "receipt_artifact_digest", "receipt_archive_sha256", "cumulative_manifest_sha256",
                              "source_security_run_id", "source_security_run_attempt", "autodeploy_run_id",
                              "autodeploy_run_attempt", "production_deploy_run_id", "production_deploy_run_attempt"}
              if not isinstance(binding, dict) or set(binding) != binding_keys or type(binding.get("schema")) is not int or binding["schema"] != 1:
                  fail()
              binding_bytes = canonical(binding)
              binding_digest = hashlib.sha256(binding_bytes).hexdigest()
              app = binding.get("app_target_sha")
              if (len(binding_bytes) > MAX_BINDING or binding.get("binding_mode") != "verified-noop"
                      or binding.get("runner_sha") != runner or not isinstance(app, str)
                      or not SHA.fullmatch(app) or app == runner):
                  fail()
              baseline = binding.get("baseline_identity")
              baseline_keys = {"schema", "source_sha", "release_slug", "release_json_sha256",
                               "current_link_dev", "current_link_ino", "release_dev", "release_ino",
                               "pending_operation"}
              release_slug = baseline.get("release_slug") if isinstance(baseline, dict) else None
              release_digest = baseline.get("release_json_sha256") if isinstance(baseline, dict) else None
              if (not isinstance(baseline, dict) or set(baseline) != baseline_keys
                      or type(baseline.get("schema")) is not int or baseline["schema"] != 1
                      or baseline.get("source_sha") != app or baseline.get("pending_operation") is not False
                      or not isinstance(release_slug, str)
                      or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,179}", release_slug)
                      or not isinstance(release_digest, str)
                      or not re.fullmatch(r"[0-9a-f]{64}", release_digest)
                      or any(type(baseline.get(field)) is not int or baseline[field] < 0
                             for field in ("current_link_dev", "release_dev"))
                      or any(type(baseline.get(field)) is not int or baseline[field] <= 0
                             for field in ("current_link_ino", "release_ino"))):
                  fail()
              for field in ("receipt_document_sha256", "receipt_archive_sha256", "cumulative_manifest_sha256"):
                  if not isinstance(binding.get(field), str) or not re.fullmatch(r"[0-9a-f]{64}", binding[field]):
                      fail()
              receipt_artifact_digest = binding.get("receipt_artifact_digest")
              if (not isinstance(receipt_artifact_digest, str)
                      or not DIGEST.fullmatch(receipt_artifact_digest)
                      or binding["receipt_artifact_digest"].removeprefix("sha256:") != binding["receipt_archive_sha256"]):
                  fail()
              for field in ("receipt_artifact_id", "source_security_run_id", "source_security_run_attempt",
                            "autodeploy_run_id", "autodeploy_run_attempt", "production_deploy_run_id",
                            "production_deploy_run_attempt"):
                  if type(binding.get(field)) is not str or not re.fullmatch(r"[1-9][0-9]{0,31}", binding[field]):
                      fail()
              deploy_id = binding["production_deploy_run_id"]
              deploy_attempt = binding["production_deploy_run_attempt"]
              if binding.get("receipt_artifact_name") != f"platform-production-noop-source-receipt-{deploy_id}-{deploy_attempt}":
                  fail()
          if (payload.get("target_sha") != runner or payload.get("base_url") != "https://old-sparky.com"
                  or payload.get("provision") != "false" or payload.get("marker") != ""):
              fail()
          output = Path(env["RUNNER_TEMP"]) / "live-user-qa-input.json"
          parent = output.parent
          parent_meta = parent.lstat()
          if not stat.S_ISDIR(parent_meta.st_mode) or stat.S_ISLNK(parent_meta.st_mode) or parent.resolve(strict=True) != parent:
              fail()
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0) | getattr(os, "O_CLOEXEC", 0)
          fd = os.open(output, flags, 0o600)
          try:
              opened = os.fstat(fd)
              if not stat.S_ISREG(opened.st_mode) or opened.st_uid != os.geteuid() or opened.st_nlink != 1:
                  fail()
              os.fchmod(fd, 0o600)
              remaining = memoryview(raw)
              while remaining:
                  written = os.write(fd, remaining)
                  if written <= 0:
                      fail()
                  remaining = remaining[written:]
              os.fsync(fd)
              completed = os.fstat(fd)
              if completed.st_size != len(raw) or stat.S_IMODE(completed.st_mode) != 0o600:
                  fail()
          finally:
              os.close(fd)
          if stat.S_IMODE(output.stat().st_mode) != 0o600:
              fail()
          with open(env["GITHUB_OUTPUT"], "a", encoding="ascii") as stream:
              stream.write(f"source_binding_sha256={binding_digest}\n")
          with open(env["GITHUB_ENV"], "a", encoding="ascii") as stream:
              stream.write(f"APP_TARGET_SHA={app}\n")
              stream.write(f"SOURCE_BINDING_SHA256={binding_digest}\n")
          print("LIVE_USER_HANDOFF_VERIFIED")
          PY
          test "$(stat -c '%a' "$RUNNER_TEMP/live-user-qa-input.json")" = 600

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-live-user-qa-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-live-user-qa-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 0600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          chmod 600 "$ssh_dir/known_hosts"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run live-user QA on the production server
        id: run_live_user_qa
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          raw_report="$RUNNER_TEMP/live-user-qa-raw.log"
          umask 077
          : > "$raw_report"
          chmod 600 "$raw_report"
          set +e
          input_path="$RUNNER_TEMP/live-user-qa-input.json"
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -F "$SSH_DIR/config" \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B \
            /root/.oldsparky/liveqa/platform_workflow_remote_dispatch.py \
            live-user-qa < "$input_path" > "$raw_report" 2>/dev/null
          ssh_status="$?"
          set -e
          echo "ssh_status=$ssh_status" >> "$GITHUB_OUTPUT"
          exit "$ssh_status"

      - name: Sanitize live-user QA report
        id: sanitize_live_user_report
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          raw_report="$RUNNER_TEMP/live-user-qa-raw.log"
          report="$RUNNER_TEMP/live-user-qa-report.json"
          test -e "$raw_report" || : > "$raw_report"
          chmod 600 "$raw_report"
          ssh_status="${{ steps.run_live_user_qa.outputs.ssh_status || '1' }}"
          binding_digest="${SOURCE_BINDING_SHA256:-}"
          set +e
          /usr/bin/python3 - "$raw_report" "$report" "$ssh_status" \
            "$TARGET_SHA" "$APP_TARGET_SHA" \
            "$binding_digest" <<'PY'
          import json
          import re
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          try:
              exit_code = int(sys.argv[3], 10)
          except ValueError:
              exit_code = 1
          runner_sha, app_sha, binding_digest = sys.argv[4:]
          if (
              re.fullmatch(r"[0-9a-f]{40}", runner_sha) is None
              or re.fullmatch(r"[0-9a-f]{40}", app_sha) is None
              or (app_sha == runner_sha and binding_digest != "")
              or (app_sha != runner_sha and re.fullmatch(r"[0-9a-f]{64}", binding_digest) is None)
          ):
              raise SystemExit("verified live-user source identity is incomplete")
          try:
              raw = source.read_bytes()
          except OSError:
              raw = b""
          bounded = raw[:262144]
          lines = bounded.splitlines()[:1000]
          text = b"\n".join(lines).decode("utf-8", errors="replace").casefold()
          passed = exit_code == 0 and (
              "live_user_qa_success" in text
              or '"status": "passed"' in text
              or '"success": true' in text
              or '"passed": true' in text
          )
          report = {
              "schema": 1,
              "source_git_sha": runner_sha,
              "app_target_sha": app_sha,
              "source_binding_sha256": binding_digest or None,
              "status": "passed" if passed else ("failed" if exit_code else "unavailable"),
              "success": passed,
              "process_exit_code": exit_code if 0 <= exit_code <= 255 else 1,
              "line_count": len(lines),
              "retained_line_count": len(lines),
              "truncated": len(raw) > len(bounded) or len(bounded.splitlines()) > len(lines),
              "test_count": 1 if lines else 0,
              "failed_test_count": 0 if passed else (1 if lines or exit_code else 0),
              "error_class_counts": {} if passed else {"transport" if exit_code else "other": 1},
          }
          destination.write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          raise SystemExit(0)
          PY
          report_status="$?"
          set -e
          rm -f -- "$raw_report"
          test ! -e "$raw_report"
          test -s "$report" || {
            echo "Live-user fixed report was not produced." >&2
            exit "$report_status"
          }

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-live-user-qa-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-live-user-qa-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- "$RUNNER_TEMP/live-user-qa-input.json"
          test ! -e "$RUNNER_TEMP/live-user-qa-input.json"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Reject incomplete live-user QA report
        id: validate_live_user_report
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          binding_digest="${SOURCE_BINDING_SHA256:-}"
          /usr/bin/python3 - "$RUNNER_TEMP/live-user-qa-report.json" \
            "$TARGET_SHA" "$APP_TARGET_SHA" \
            "$binding_digest" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          try:
              report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("required live-user QA report is not valid JSON")
          runner_sha, app_sha, binding_digest = sys.argv[2:]
          if (
              not isinstance(report, dict)
              or report.get("truncated") is not False
              or report.get("status") in {"truncated", "error", "unavailable"}
              or report.get("source_git_sha") != runner_sha
              or report.get("app_target_sha") != app_sha
              or report.get("source_binding_sha256") != (binding_digest or None)
              or re.fullmatch(r"[0-9a-f]{40}", runner_sha) is None
              or re.fullmatch(r"[0-9a-f]{40}", app_sha) is None
              or (app_sha == runner_sha and binding_digest != "")
              or (app_sha != runner_sha and re.fullmatch(r"[0-9a-f]{64}", binding_digest) is None)
          ):
              raise SystemExit("required live-user QA report is incomplete")
          PY

      - name: QA summary
        if: ${{ always() }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/live-user-qa-report.json"
          {
            echo "### Platform live-user QA"
            echo
            echo "- Runner SHA: \`$TARGET_SHA\`"
            echo "- App SHA: \`$APP_TARGET_SHA\`"
            if [[ -s "$report" ]]; then
              /usr/bin/python3 - "$report" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"- Status: **{payload.get('status')}**")
          print(f"- Tests observed: {payload.get('test_count', 0)}; failed: {payload.get('failed_test_count', 0)}")
          print(f"- Error classes: `{payload.get('error_class_counts', {})}`")
          PY
            else
              echo "- Status: **unavailable**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live-user QA report
        if: ${{ !cancelled() && steps.cleanup_ssh.outcome == 'success' && steps.sanitize_live_user_report.outcome == 'success' && steps.validate_live_user_report.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-live-user-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-user-qa-report.json
          if-no-files-found: error
          retention-days: 14
