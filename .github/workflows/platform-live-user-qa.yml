name: Platform live user QA

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN-LIVE-USER-QA to run the destructive automated production contour"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-live-user-qa
  cancel-in-progress: false

jobs:
  validate-live-user-inputs:
    name: Validate live-user QA handoff
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout reviewed live-user QA source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate and serialize live-user QA handoff
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dev \
            || { echo "Live-user QA must run from the reviewed dev branch." >&2; exit 1; }
          test "$TARGET_SHA" = "$GITHUB_SHA"
          /usr/bin/python3 platform/tools/platform_workflow_input_guard.py confirmation \
            --value "$QA_CONFIRMATION" \
            --expected "RUN-LIVE-USER-QA"
          /usr/bin/python3 platform/tools/platform_workflow_input_guard.py sha \
            --value "$TARGET_SHA"
          umask 077
          /usr/bin/python3 - "$TARGET_SHA" > "$RUNNER_TEMP/live-user-qa-input.json" <<'PY'
          import json
          import sys

          print(json.dumps(
              {
                  "schema": 1,
                  "base_url": "https://old-sparky.com",
                  "provision": "false",
                  "marker": "",
                  "target_sha": sys.argv[1],
              },
              separators=(",", ":"),
          ))
          PY
          chmod 600 "$RUNNER_TEMP/live-user-qa-input.json"
      - name: Upload closed live-user QA handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-live-user-qa-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-user-qa-input.json
          if-no-files-found: error
          retention-days: 1

  live-user-qa:
    needs: validate-live-user-inputs
    name: Automated live-user QA on production server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Download closed live-user QA handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-live-user-qa-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-user-qa-input
      - name: Install and validate closed live-user QA handoff
        shell: bash
        run: |
          set -euo pipefail
          handoff_dir="$RUNNER_TEMP/live-user-qa-input"
          handoff="$handoff_dir/live-user-qa-input.json"
          test -d "$handoff_dir" && test ! -L "$handoff_dir"
          test -f "$handoff" && test ! -L "$handoff"
          test "$(find "$handoff_dir" -mindepth 1 -maxdepth 1 -type l -print -quit)" = ""
          install -m 600 "$handoff" "$RUNNER_TEMP/live-user-qa-input.json"
          /usr/bin/python3 - "$RUNNER_TEMP/live-user-qa-input.json" "$GITHUB_SHA" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if set(payload) != {"schema", "base_url", "provision", "marker", "target_sha"}:
              raise SystemExit("live-user QA handoff schema is invalid")
          if payload.get("schema") != 1:
              raise SystemExit("live-user QA handoff identity is invalid")
          if payload.get("base_url") != "https://old-sparky.com" or payload.get("provision") != "false" or payload.get("marker") != "":
              raise SystemExit("live-user QA handoff mode is invalid")
          if re.fullmatch(r"[0-9a-f]{40}", payload.get("target_sha", "")) is None:
              raise SystemExit("live-user QA handoff SHA is invalid")
          if payload["target_sha"] != sys.argv[2]:
              raise SystemExit("live-user QA handoff SHA does not match this run")
          PY
          {
            printf 'TARGET_SHA=%s\n' "$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["target_sha"])' "$RUNNER_TEMP/live-user-qa-input.json")"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-live-user-qa-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-live-user-qa-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 0600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          chmod 600 "$ssh_dir/known_hosts"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run live-user QA on the production server
        id: run_live_user_qa
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          raw_report="$RUNNER_TEMP/live-user-qa-raw.log"
          capture_state="$RUNNER_TEMP/live-user-qa-capture.json"
          report_nonce="$(/usr/bin/python3 -c 'import secrets; print(secrets.token_hex(32))')"
          [[ "$report_nonce" =~ ^[0-9a-f]{64}$ ]]
          printf 'LIVE_USER_QA_REPORT_NONCE=%s\n' "$report_nonce" >> "$GITHUB_ENV"
          umask 077
          rm -f -- "$raw_report" "$capture_state"
          install -m 600 /dev/null "$raw_report"
          set +e
          # Keep the SSH pipe draining after the 256 KiB evidence budget is
          # full.  This is trusted workflow code, not candidate code: the
          # command is fixed below and the helper never parses remote output.
          /usr/bin/python3 - "$raw_report" "$capture_state" -- \
            /usr/bin/ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              -F "$SSH_DIR/config" \
              -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              /usr/bin/env \
              "PLATFORM_LIVE_QA_TARGET_SHA=$TARGET_SHA" \
              "PLATFORM_LIVE_QA_REPORT_NONCE=$report_nonce" \
              PLATFORM_APP_DIR=/opt/oldsparky/platform \
              PLATFORM_LIVE_CSP_QA_BUNDLE=/root/.oldsparky/liveqa/csp-live-qa.json \
              /root/.oldsparky/liveqa/platform_live_user_qa_trusted.sh \
            <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          MAX_CAPTURE_BYTES = 262144
          CHUNK_BYTES = 65536
          CAPTURE_ERRORS = {"", "command", "spawn", "open", "read", "write", "drain", "wait", "state"}

          raw_path = Path(sys.argv[1])
          state_path = Path(sys.argv[2])
          try:
              separator = sys.argv.index("--", 3)
              command = sys.argv[separator + 1 :]
          except ValueError:
              command = []

          observed = 0
          retained = 0
          truncated = False
          capture_error = ""
          process = None
          ssh_exit_code = 127
          read_failed = False

          def record_error(value):
              global capture_error
              if not capture_error:
                  capture_error = value

          def drain(sink, chunk):
              if sink is None or not chunk:
                  return
              try:
                  sink.write(chunk)
              except OSError:
                  record_error("drain")

          if not command:
              record_error("command")
          else:
              try:
                  process = subprocess.Popen(
                      command,
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      bufsize=0,
                      close_fds=True,
                  )
              except OSError:
                  record_error("spawn")

          try:
              sink = open(os.devnull, "wb", buffering=0)
          except OSError:
              sink = None
              record_error("drain")

          raw_file = None
          if process is not None:
              descriptor = None
              try:
                  flags = os.O_WRONLY | os.O_CREAT | os.O_TRUNC | getattr(os, "O_NOFOLLOW", 0)
                  descriptor = os.open(raw_path, flags, 0o600)
                  os.fchmod(descriptor, 0o600)
                  raw_file = os.fdopen(descriptor, "wb", buffering=0, closefd=True)
                  descriptor = None
              except OSError:
                  if descriptor is not None:
                      os.close(descriptor)
                  record_error("open")

              try:
                  while process.stdout is not None:
                      try:
                          chunk = process.stdout.read(CHUNK_BYTES)
                      except InterruptedError:
                          continue
                      except OSError:
                          record_error("read")
                          read_failed = True
                          break
                      if not chunk:
                          break
                      observed += len(chunk)
                      if observed > MAX_CAPTURE_BYTES:
                          truncated = True
                      keep = max(0, min(len(chunk), MAX_CAPTURE_BYTES - retained))
                      if keep:
                          prefix = chunk[:keep]
                          if raw_file is None:
                              drain(sink, prefix)
                          else:
                              try:
                                  offset = 0
                                  while offset < len(prefix):
                                      written = raw_file.write(prefix[offset:])
                                      if not written:
                                          raise OSError("short capture write")
                                      offset += written
                                  retained += offset
                              except OSError:
                                  record_error("write")
                                  drain(sink, prefix[offset:] if "offset" in locals() else prefix)
                      extra = chunk[keep:]
                      if extra:
                          truncated = True
                          drain(sink, extra)
              finally:
                  if process.stdout is not None:
                      try:
                          process.stdout.close()
                      except OSError:
                          record_error("read")
                  if raw_file is not None:
                      try:
                          raw_file.close()
                      except OSError:
                          record_error("write")
          if sink is not None:
              try:
                  sink.close()
              except OSError:
                  record_error("drain")

          if process is not None:
              try:
                  if read_failed:
                      process.terminate()
                      ssh_exit_code = process.wait(timeout=5)
                  else:
                      ssh_exit_code = process.wait()
              except subprocess.TimeoutExpired:
                  process.kill()
                  ssh_exit_code = process.wait()
              except OSError:
                  record_error("wait")
                  ssh_exit_code = 127

          payload = {
              "schema": 1,
              "ssh_exit_code": ssh_exit_code,
              "truncated": truncated,
              "bytes_observed": observed,
              "retained_bytes": retained,
              "capture_error": capture_error if capture_error in CAPTURE_ERRORS else "state",
          }
          state_error = False
          try:
              flags = os.O_WRONLY | os.O_CREAT | os.O_TRUNC | getattr(os, "O_NOFOLLOW", 0)
              descriptor = os.open(state_path, flags, 0o600)
              os.fchmod(descriptor, 0o600)
              with os.fdopen(descriptor, "wb", closefd=True) as destination:
                  destination.write((json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii"))
                  destination.flush()
                  os.fsync(destination.fileno())
          except OSError:
              state_error = True
          if state_error:
              raise SystemExit(1)
          raise SystemExit(0 if not capture_error else 1)
          PY
          capture_status="$?"
          set -e
          set +e
          ssh_status="$(/usr/bin/python3 - "$capture_state" <<'PY'
          import json
          from pathlib import Path
          import sys

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError
                  result[key] = value
              return result

          try:
              with Path(sys.argv[1]).open("rb") as source:
                  raw = source.read(4097)
              payload = json.loads(raw.decode("ascii"), object_pairs_hook=strict_object)
              if (
                  len(raw) > 4096
                  or not isinstance(payload, dict)
                  or set(payload) != {"schema", "ssh_exit_code", "truncated", "bytes_observed", "retained_bytes", "capture_error"}
                  or payload.get("schema") != 1
                  or type(payload.get("ssh_exit_code")) is not int
                  or type(payload.get("truncated")) is not bool
                  or type(payload.get("bytes_observed")) is not int
                  or type(payload.get("retained_bytes")) is not int
                  or payload.get("capture_error") not in {"", "command", "spawn", "open", "read", "write", "drain", "wait", "state"}
                  or payload.get("ssh_exit_code") < -255
                  or payload.get("ssh_exit_code") > 255
                  or payload.get("bytes_observed") < 0
                  or payload.get("retained_bytes") < 0
                  or payload.get("retained_bytes") > 262144
              ):
                  raise ValueError
              print(payload["ssh_exit_code"])
          except (OSError, UnicodeError, ValueError, json.JSONDecodeError):
              raise SystemExit(1)
          PY
          )"
          state_status="$?"
          set -e
          if [[ "$state_status" != 0 || ! "$ssh_status" =~ ^-?[0-9]+$ ]]; then
            ssh_status=127
          fi
          echo "ssh_status=$ssh_status" >> "$GITHUB_OUTPUT"
          echo "capture_status=$capture_status" >> "$GITHUB_OUTPUT"
          if [[ "$capture_status" != 0 ]]; then
            exit 1
          fi
          if [[ "$ssh_status" == 0 ]]; then
            exit 0
          fi
          if [[ "$ssh_status" =~ ^[0-9]+$ ]] && (( ssh_status <= 255 )); then
            exit "$ssh_status"
          fi
          exit 1

      - name: Sanitize live-user QA report
        id: sanitize_live_user_report
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          raw_report="$RUNNER_TEMP/live-user-qa-raw.log"
          capture_state="$RUNNER_TEMP/live-user-qa-capture.json"
          report="$RUNNER_TEMP/live-user-qa-report.json"
          test -e "$raw_report" || : > "$raw_report"
          chmod 600 "$raw_report"
          ssh_status="${{ steps.run_live_user_qa.outputs.ssh_status || '1' }}"
          set +e
          /usr/bin/python3 - "$raw_report" "$report" "$ssh_status" "${LIVE_USER_QA_REPORT_NONCE:-}" "$TARGET_SHA" "$capture_state" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          MAX_CAPTURE_BYTES = 262144
          MAX_LINE_BYTES = 65536
          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          try:
              exit_code = int(sys.argv[3], 10)
          except ValueError:
              exit_code = 1
          expected_nonce = sys.argv[4]
          target_sha = sys.argv[5]
          capture_state = Path(sys.argv[6])

          capture_fields = {
              "schema",
              "ssh_exit_code",
              "truncated",
              "bytes_observed",
              "retained_bytes",
              "capture_error",
          }
          capture_errors = {"", "command", "spawn", "open", "read", "write", "drain", "wait", "state"}

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate object key")
                  result[key] = value
              return result

          try:
              with capture_state.open("rb") as state_source:
                  state_raw = state_source.read(4097)
              capture = json.loads(
                  state_raw.decode("ascii"),
                  object_pairs_hook=strict_object,
              )
              if (
                  len(state_raw) > 4096
                  or not isinstance(capture, dict)
                  or set(capture) != capture_fields
                  or capture.get("schema") != 1
                  or type(capture.get("ssh_exit_code")) is not int
                  or type(capture.get("truncated")) is not bool
                  or type(capture.get("bytes_observed")) is not int
                  or type(capture.get("retained_bytes")) is not int
                  or capture.get("capture_error") not in capture_errors
                  or capture.get("ssh_exit_code") < -255
                  or capture.get("ssh_exit_code") > 255
                  or capture.get("bytes_observed") < 0
                  or capture.get("retained_bytes") < 0
                  or capture.get("retained_bytes") > MAX_CAPTURE_BYTES
              ):
                  raise ValueError("capture state is invalid")
          except (OSError, UnicodeError, ValueError, json.JSONDecodeError):
              capture = {
                  "schema": 0,
                  "ssh_exit_code": 127,
                  "truncated": True,
                  "bytes_observed": 0,
                  "retained_bytes": 0,
                  "capture_error": "state",
              }

          retained = bytearray()
          raw_overflow = False
          try:
              with source.open("rb") as source_file:
                  while len(retained) <= MAX_CAPTURE_BYTES:
                      chunk = source_file.read(min(65536, MAX_CAPTURE_BYTES + 1 - len(retained)))
                      if not chunk:
                          break
                      retained.extend(chunk)
                      if len(retained) > MAX_CAPTURE_BYTES:
                          raw_overflow = True
                          del retained[MAX_CAPTURE_BYTES:]
                          break
          except OSError:
              raw_overflow = True
          bounded_lines = bytes(retained).splitlines()
          lines = bounded_lines[:1000]
          long_line = any(len(line) > MAX_LINE_BYTES for line in bounded_lines)
          truncated = (
              capture.get("truncated") is True
              or raw_overflow
              or len(bounded_lines) > len(lines)
              or long_line
          )
          marker_prefix = "live_user_qa_success "
          valid_markers = []

          expected_fields = {
              "cleanup",
              "kind",
              "playwright",
              "report_nonce",
              "schema",
              "source_sha",
              "status",
              "success",
              "test_count",
          }
          for line in lines:
              if len(line) > MAX_LINE_BYTES:
                  continue
              text_line = line.decode("utf-8", errors="replace") if isinstance(line, bytes) else line
              if not text_line.startswith(marker_prefix):
                  continue
              try:
                  marker = json.loads(
                      text_line[len(marker_prefix):],
                      object_pairs_hook=strict_object,
                  )
              except (UnicodeError, ValueError, json.JSONDecodeError):
                  continue
              if (
                  isinstance(marker, dict)
                  and set(marker) == expected_fields
                  and marker.get("schema") == 1
                  and marker.get("kind") == "live_user_qa_success"
                  and marker.get("status") == "passed"
                  and marker.get("success") is True
                  and marker.get("playwright") == "passed"
                  and marker.get("cleanup") == "verified"
                  and marker.get("report_nonce") == expected_nonce
                  and marker.get("source_sha") == target_sha
                  and marker.get("test_count") == 1
              ):
                  valid_markers.append(marker)
          passed = (
              exit_code == 0
              and capture.get("ssh_exit_code") == exit_code
              and capture.get("capture_error") == ""
              and truncated is False
              and re.fullmatch(r"[0-9a-f]{64}", expected_nonce) is not None
              and re.fullmatch(r"[0-9a-f]{40}", target_sha) is not None
              and len(valid_markers) == 1
          )
          marker = valid_markers[0] if passed else None
          if passed:
              status = "passed"
              error_classes = {}
          elif exit_code:
              status = "failed"
              error_classes = {"transport": 1}
          elif truncated or capture.get("capture_error") or capture.get("ssh_exit_code") != 0:
              status = "failed"
              error_classes = {"transport": 1}
          else:
              status = "failed"
              error_classes = {"protocol": 1}
          report = {
              "schema": 1,
              "status": status,
              "success": passed,
              "ssh_exit_code": capture.get("ssh_exit_code", 127),
              "process_exit_code": exit_code if 0 <= exit_code <= 255 else 1,
              "line_count": len(lines),
              "retained_line_count": len(lines),
              "truncated": truncated,
              "capture_error": capture.get("capture_error", "state"),
              "capture_bytes_observed": capture.get("bytes_observed", 0),
              "capture_bytes_retained": capture.get("retained_bytes", 0),
              "marker_count": len(valid_markers),
              "source_sha": marker["source_sha"] if marker else "",
              "test_count": 1 if passed else 0,
              "failed_test_count": 0 if passed else (1 if lines or exit_code else 0),
              "error_class_counts": error_classes,
          }
          destination.write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          raise SystemExit(0)
          PY
          report_status="$?"
          set -e
          rm -f -- "$raw_report"
          test ! -e "$raw_report"
          test -s "$report" || {
            echo "Live-user fixed report was not produced." >&2
            exit "$report_status"
          }

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-live-user-qa-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-live-user-qa-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          handoff_dir="$RUNNER_TEMP/live-user-qa-input"
          if [[ -e "$handoff_dir" || -L "$handoff_dir" ]]; then
            test -d "$handoff_dir" && test ! -L "$handoff_dir"
            rm -f -- "$handoff_dir/live-user-qa-input.json"
            test ! -e "$handoff_dir/live-user-qa-input.json"
            rmdir -- "$handoff_dir"
          fi
          test ! -e "$handoff_dir" && test ! -L "$handoff_dir"
          rm -f -- "$RUNNER_TEMP/live-user-qa-input.json"
          test ! -e "$RUNNER_TEMP/live-user-qa-input.json"
          rm -f -- "$RUNNER_TEMP/live-user-qa-capture.json"
          test ! -e "$RUNNER_TEMP/live-user-qa-capture.json"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"
          printf '%s\n' 'LIVE_USER_QA_REPORT_NONCE=' >> "$GITHUB_ENV"
          unset LIVE_USER_QA_REPORT_NONCE
          test -z "${LIVE_USER_QA_REPORT_NONCE:-}"

      - name: Reject incomplete live-user QA report
        id: validate_live_user_report
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP/live-user-qa-report.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          try:
              report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("required live-user QA report is not valid JSON")
          if (
              not isinstance(report, dict)
              or set(report) != {
                  "schema",
                  "status",
                  "success",
                  "ssh_exit_code",
                  "process_exit_code",
                  "line_count",
                  "retained_line_count",
                  "truncated",
                  "capture_error",
                  "capture_bytes_observed",
                  "capture_bytes_retained",
                  "marker_count",
                  "source_sha",
                  "test_count",
                  "failed_test_count",
                  "error_class_counts",
              }
              or report.get("schema") != 1
              or report.get("truncated") is not False
              or report.get("capture_error") != ""
              or report.get("status") != "passed"
              or report.get("success") is not True
              or report.get("ssh_exit_code") != 0
              or report.get("process_exit_code") != 0
              or report.get("marker_count") != 1
              or report.get("source_sha") != os.environ.get("TARGET_SHA")
              or report.get("test_count") != 1
              or report.get("failed_test_count") != 0
              or report.get("error_class_counts") != {}
          ):
              raise SystemExit("required live-user QA report is incomplete")
          PY

      - name: QA summary
        if: ${{ always() }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/live-user-qa-report.json"
          {
            echo "### Platform live-user QA"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            if [[ -s "$report" ]]; then
              /usr/bin/python3 - "$report" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(f"- Status: **{payload.get('status')}**")
          print(f"- Tests observed: {payload.get('test_count', 0)}; failed: {payload.get('failed_test_count', 0)}")
          print(f"- Error classes: `{payload.get('error_class_counts', {})}`")
          PY
            else
              echo "- Status: **unavailable**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live-user QA report
        if: ${{ !cancelled() && steps.cleanup_ssh.outcome == 'success' && steps.sanitize_live_user_report.outcome == 'success' && steps.validate_live_user_report.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-live-user-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-user-qa-report.json
          if-no-files-found: error
          retention-days: 14
