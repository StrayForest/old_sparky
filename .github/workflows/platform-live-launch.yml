name: Platform live launch sanity

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Canonical deployed platform origin (must be https://old-sparky.com)"
        required: true
        type: string
      provision:
        description: "Provision or safely rotate the root-only CSP QA bundle before the run"
        required: true
        default: false
        type: boolean
      marker:
        description: "Fresh liveqa marker, required when provision is true"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  validate-live-inputs:
    name: Validate live-launch handoff
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      handoff_artifact_id: ${{ steps.upload_live_handoff.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
    env:
      LIVE_BASE_URL: ${{ inputs.base_url }}
      LIVE_PROVISION: ${{ inputs.provision }}
      LIVE_MARKER: ${{ inputs.marker }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Reject invalid live-launch dispatch before mode branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch || { echo "Live launch accepts workflow_dispatch only." >&2; exit 1; }
          test "$GITHUB_REF" = refs/heads/dev || { echo "Live launch accepts the reviewed dev ref only." >&2; exit 1; }
          test "$LIVE_BASE_URL" = "https://old-sparky.com" || { echo "Live launch requires the canonical origin." >&2; exit 1; }
          case "$LIVE_PROVISION" in true|false) ;; *) echo "Live provision mode is invalid." >&2; exit 1 ;; esac
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Live launch requires an exact target SHA." >&2; exit 1; }
      - name: Checkout live-launch validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require the exact checked-out live validator SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Resolve authenticated app source binding
        id: resolve-source-binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          /usr/bin/python3 platform/tools/platform_noop_source_binding.py \
            resolve-workflow-source-binding "$TARGET_SHA" "$GITHUB_REPOSITORY" \
            "${GITHUB_API_URL:-https://api.github.com}" \
            "$RUNNER_TEMP/live-source-binding" "$GITHUB_OUTPUT"
      - name: Validate live-launch dispatch and publish handoff
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 platform/tools/platform_noop_source_binding.py \
            create-live-handoff "$TARGET_SHA" "$LIVE_BASE_URL" \
            "$LIVE_PROVISION" "$LIVE_MARKER" \
            "$RUNNER_TEMP/live-source-binding/source-binding.json" \
            "$RUNNER_TEMP/live-launch-input.json"
          test "$(stat -c '%a' "$RUNNER_TEMP/live-launch-input.json")" = 600
      - name: Upload closed live-launch handoff
        id: upload_live_handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-live-launch-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-launch-input.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove validator handoff
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/live-launch-input.json"
          source_binding_dir="$RUNNER_TEMP/live-source-binding"
          if [[ -e "$source_binding_dir" || -L "$source_binding_dir" ]]; then
            test -d "$source_binding_dir" && test ! -L "$source_binding_dir"
            rm -f -- "$source_binding_dir/source-binding.json"
            rmdir -- "$source_binding_dir"
          fi
          test ! -e "$source_binding_dir" && test ! -L "$source_binding_dir"

  live-sanity:
    needs: validate-live-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      contents: none
    env:
      LIVE_BASE_URL: ${{ inputs.base_url }}
      LIVE_PROVISION: ${{ inputs.provision }}
      LIVE_MARKER: ${{ inputs.marker }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Authenticate and validate live-launch handoff artifact
        id: authenticate_live_launch_handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_ARTIFACT_ID: ${{ needs.validate-live-inputs.outputs.handoff_artifact_id }}
          HANDOFF_ARTIFACT_NAME: platform-live-launch-input-${{ github.run_id }}-${{ github.run_attempt }}
          HANDOFF_MEMBER_NAME: live-launch-input.json
          HANDOFF_OUTPUT_PATH: ${{ runner.temp }}/live-launch-input.json
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          SHA_RE = re.compile(r"[0-9a-f]{40}\Z")
          HEX_RE = re.compile(r"[0-9a-f]{64}\Z")
          RUN_RE = re.compile(r"[1-9][0-9]{0,31}\Z")
          MAX_API_BYTES = 8 * 1024 * 1024
          MAX_ARCHIVE_BYTES = 2 * 1024 * 1024
          MAX_HANDOFF_BYTES = 20 * 1024
          EXPECTED_WORKFLOW = ".github/workflows/platform-live-launch.yml"
          EXPECTED_ORIGIN = "https://old-sparky.com"
          BASE_KEYS = {"schema", "base_url", "provision", "marker", "target_sha"}
          BINDING_KEYS = {
              "schema", "binding_mode", "runner_sha", "app_target_sha", "baseline_identity",
              "receipt_document_sha256", "receipt_artifact_id", "receipt_artifact_name",
              "receipt_artifact_digest", "receipt_archive_sha256", "cumulative_manifest_sha256",
              "source_security_run_id", "source_security_run_attempt", "autodeploy_run_id",
              "autodeploy_run_attempt", "production_deploy_run_id", "production_deploy_run_attempt",
          }
          BASELINE_KEYS = {
              "schema", "source_sha", "release_slug", "release_json_sha256", "current_link_dev",
              "current_link_ino", "release_dev", "release_ino", "pending_operation",
          }

          def fail():
              raise SystemExit("live handoff artifact is invalid")

          def no_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail()
                  result[key] = value
              return result

          def canonical(value):
              return json.dumps(value, ensure_ascii=True, allow_nan=False, sort_keys=True,
                                separators=(",", ":")).encode("ascii")

          class SameOriginRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, new_url):
                  old = urllib.parse.urlsplit(request.full_url)
                  new = urllib.parse.urlsplit(new_url)
                  if (old.scheme != "https" or new.scheme != "https" or
                      old.hostname != new.hostname or old.port != new.port or
                      new.username is not None or new.password is not None):
                      return None
                  return super().redirect_request(request, fp, code, msg, headers, new_url)

          class ArtifactRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, new_url):
                  old = urllib.parse.urlsplit(request.full_url)
                  new = urllib.parse.urlsplit(new_url)
                  if new.scheme != "https" or not new.netloc or new.username is not None or new.password is not None:
                      return None
                  redirected = super().redirect_request(request, fp, code, msg, headers, new_url)
                  if redirected is None:
                      return None
                  if (old.scheme, old.hostname, old.port) != (new.scheme, new.hostname, new.port):
                      sensitive = {"authorization", "proxy-authorization", "cookie", "cookie2"}
                      for collection in (redirected.headers, redirected.unredirected_hdrs):
                          for key in tuple(collection):
                              if key.casefold() in sensitive:
                                  collection.pop(key, None)
                  return redirected

          def exact_origin(url):
              parsed = urllib.parse.urlsplit(url)
              if (parsed.scheme != "https" or not parsed.hostname or parsed.username is not None or
                  parsed.password is not None or parsed.fragment):
                  fail()
              return parsed

          def api_json(opener, url, headers):
              exact_origin(url)
              request = urllib.request.Request(url, headers=headers)
              try:
                  with opener.open(request, timeout=30) as response:
                      if response.status != 200:
                          fail()
                      raw = response.read(MAX_API_BYTES + 1)
              except (OSError, urllib.error.URLError, urllib.error.HTTPError):
                  fail()
              if not raw or len(raw) > MAX_API_BYTES:
                  fail()
              try:
                  value = json.loads(raw.decode("utf-8"), object_pairs_hook=no_duplicates)
              except (UnicodeError, json.JSONDecodeError, ValueError):
                  fail()
              if not isinstance(value, dict):
                  fail()
              return value

          def positive_int(value):
              if type(value) is not int or value <= 0 or value > 2**63 - 1:
                  fail()
              return value

          def read_bounded_member(archive, entry):
              if (entry.file_size < 0 or entry.file_size > MAX_HANDOFF_BYTES or
                  entry.flag_bits & 1 or entry.is_dir()):
                  fail()
              chunks = []
              total = 0
              with archive.open(entry, "r") as member:
                  while True:
                      chunk = member.read(min(32768, MAX_HANDOFF_BYTES + 1 - total))
                      if not chunk:
                          break
                      chunks.append(chunk)
                      total += len(chunk)
                      if total > MAX_HANDOFF_BYTES:
                          fail()
              raw = b"".join(chunks)
              if len(raw) != entry.file_size:
                  fail()
              return raw

          def validate_binding(binding, runner_sha):
              if (not isinstance(binding, dict) or set(binding) != BINDING_KEYS or
                  type(binding.get("schema")) is not int or binding["schema"] != 1 or
                  binding.get("binding_mode") != "verified-noop" or
                  binding.get("runner_sha") != runner_sha or
                  not isinstance(binding.get("app_target_sha"), str) or
                  SHA_RE.fullmatch(binding["app_target_sha"]) is None):
                  fail()
              bound_app_sha = binding["app_target_sha"]
              baseline = binding.get("baseline_identity")
              if (not isinstance(baseline, dict) or set(baseline) != BASELINE_KEYS or
                  type(baseline.get("schema")) is not int or baseline["schema"] != 1 or
                  baseline.get("source_sha") != bound_app_sha or baseline.get("pending_operation") is not False or
                  not isinstance(baseline.get("release_slug"), str) or
                  re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,179}", baseline["release_slug"]) is None or
                  not isinstance(baseline.get("release_json_sha256"), str) or
                  HEX_RE.fullmatch(baseline["release_json_sha256"]) is None):
                  fail()
              for field in ("current_link_dev", "release_dev"):
                  if type(baseline.get(field)) is not int or baseline[field] < 0 or baseline[field] > 2**63 - 1:
                      fail()
              for field in ("current_link_ino", "release_ino"):
                  if type(baseline.get(field)) is not int or baseline[field] <= 0 or baseline[field] > 2**63 - 1:
                      fail()
              for field in ("receipt_document_sha256", "receipt_archive_sha256", "cumulative_manifest_sha256"):
                  if not isinstance(binding.get(field), str) or HEX_RE.fullmatch(binding[field]) is None:
                      fail()
              for field in ("receipt_artifact_id", "source_security_run_id", "source_security_run_attempt",
                            "autodeploy_run_id", "autodeploy_run_attempt", "production_deploy_run_id",
                            "production_deploy_run_attempt"):
                  if not isinstance(binding.get(field), str) or RUN_RE.fullmatch(binding[field]) is None:
                      fail()
              if (binding.get("receipt_artifact_name") !=
                  f"platform-production-noop-source-receipt-{binding['production_deploy_run_id']}-{binding['production_deploy_run_attempt']}"):
                  fail()
              artifact_digest = binding.get("receipt_artifact_digest")
              if (not isinstance(artifact_digest, str) or
                  re.fullmatch(r"sha256:[0-9a-f]{64}", artifact_digest) is None or
                  artifact_digest.removeprefix("sha256:") != binding["receipt_archive_sha256"]):
                  fail()
              digest = hashlib.sha256(canonical(binding)).hexdigest()
              return digest

          try:
              runner_sha = os.environ["TARGET_SHA"]
              run_id = os.environ["GITHUB_RUN_ID"]
              attempt = os.environ["GITHUB_RUN_ATTEMPT"]
              repository = os.environ["GITHUB_REPOSITORY"]
              api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              artifact_id_text = os.environ["HANDOFF_ARTIFACT_ID"]
              artifact_name = os.environ["HANDOFF_ARTIFACT_NAME"]
              member_name = os.environ["HANDOFF_MEMBER_NAME"]
              output_path = Path(os.environ["HANDOFF_OUTPUT_PATH"])
              if (SHA_RE.fullmatch(runner_sha) is None or
                  RUN_RE.fullmatch(run_id) is None or RUN_RE.fullmatch(attempt) is None or
                  not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) or
                  not re.fullmatch(r"[1-9][0-9]{0,31}", artifact_id_text) or
                  os.environ.get("GITHUB_REF") != "refs/heads/dev" or
                  os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch" or
                  artifact_name != f"platform-live-launch-input-{run_id}-{attempt}" or
                  member_name != "live-launch-input.json"):
                  fail()
              api = urllib.parse.urljoin(api_base + "/", f"repos/{repository}/")
              api_parts = exact_origin(api)
              token = os.environ["GH_TOKEN"]
              if not token or not api_parts.hostname:
                  fail()
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "OldSparky-live-handoff-inline-verifier",
              }
              api_opener = urllib.request.build_opener(SameOriginRedirect())
              zip_opener = urllib.request.build_opener(ArtifactRedirect())
              workflow = api_json(api_opener, api + "actions/workflows/platform-live-launch.yml", headers)
              workflow_id = positive_int(workflow.get("id"))
              if workflow.get("path") != EXPECTED_WORKFLOW or workflow.get("state") != "active":
                  fail()
              run = api_json(api_opener, api + f"actions/runs/{run_id}", headers)
              if (type(run.get("id")) is not int or run["id"] != int(run_id) or
                  type(run.get("run_attempt")) is not int or run["run_attempt"] != int(attempt) or
                  type(run.get("workflow_id")) is not int or run["workflow_id"] != workflow_id or
                  run.get("head_sha") != runner_sha or run.get("head_branch") != "dev" or
                  run.get("event") != "workflow_dispatch" or run.get("status") != "in_progress"):
                  fail()
              listed = api_json(api_opener, api + f"actions/runs/{run_id}/artifacts?per_page=100&page=1", headers)
              rows, total = listed.get("artifacts"), listed.get("total_count")
              if not isinstance(rows, list) or type(total) is not int or total != len(rows) or any(not isinstance(row, dict) for row in rows):
                  fail()
              matches = [row for row in rows if row.get("name") == artifact_name]
              if len(matches) != 1 or type(matches[0].get("id")) is not int or matches[0]["id"] != int(artifact_id_text):
                  fail()
              metadata = api_json(api_opener, api + f"actions/artifacts/{artifact_id_text}", headers)
              size = metadata.get("size_in_bytes")
              expected_artifact_digest = metadata.get("digest")
              if (type(metadata.get("id")) is not int or metadata["id"] != int(artifact_id_text) or
                  metadata.get("name") != artifact_name or metadata.get("expired") is not False or
                  type(size) is not int or size <= 0 or size > MAX_ARCHIVE_BYTES or
                  not isinstance(expected_artifact_digest, str) or
                  re.fullmatch(r"sha256:[0-9a-f]{64}", expected_artifact_digest) is None or
                  ("size_in_bytes" in matches[0] and matches[0]["size_in_bytes"] != size) or
                  ("digest" in matches[0] and matches[0]["digest"] != expected_artifact_digest) or
                  ("expired" in matches[0] and matches[0]["expired"] is not False)):
                  fail()
              metadata_run = metadata.get("workflow_run")
              if (not isinstance(metadata_run, dict) or type(metadata_run.get("id")) is not int or
                  metadata_run["id"] != int(run_id) or metadata_run.get("head_sha") != runner_sha or
                  ("run_attempt" in metadata_run and
                   (type(metadata_run.get("run_attempt")) is not int or metadata_run["run_attempt"] != int(attempt)))):
                  fail()
              archive_request = urllib.request.Request(api + f"actions/artifacts/{artifact_id_text}/zip", headers=headers)
              try:
                  with zip_opener.open(archive_request, timeout=30) as response:
                      if response.status != 200:
                          fail()
                      archive_bytes = response.read(MAX_ARCHIVE_BYTES + 1)
              except (OSError, urllib.error.URLError, urllib.error.HTTPError):
                  fail()
              if (not archive_bytes or len(archive_bytes) > MAX_ARCHIVE_BYTES or len(archive_bytes) != size or
                  hashlib.sha256(archive_bytes).hexdigest() != expected_artifact_digest.removeprefix("sha256:")):
                  fail()
              try:
                  with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                      entries = archive.infolist()
                      if len(entries) != 1 or entries[0].filename != member_name:
                          fail()
                      raw = read_bounded_member(archive, entries[0])
              except (OSError, EOFError, ValueError, zipfile.BadZipFile):
                  fail()
              if not raw.endswith(b"\n") or raw.endswith(b"\n\n"):
                  fail()
              try:
                  payload = json.loads(raw[:-1].decode("ascii"), object_pairs_hook=no_duplicates)
              except (UnicodeError, json.JSONDecodeError, ValueError):
                  fail()
              if not isinstance(payload, dict) or raw != canonical(payload) + b"\n":
                  fail()
              schema = payload.get("schema")
              expected_keys = BASE_KEYS if schema == "1" else BASE_KEYS | {"source_binding"} if schema == "2" else set()
              if (type(schema) is not str or set(payload) != expected_keys or payload.get("target_sha") != runner_sha or
                  not SHA_RE.fullmatch(runner_sha) or payload.get("base_url") != EXPECTED_ORIGIN or
                  payload.get("provision") not in {"true", "false"} or not isinstance(payload.get("marker"), str) or
                  len(payload["marker"]) > 63 or payload["marker"] != payload["marker"].strip() or
                  (payload["provision"] == "true" and re.fullmatch(r"liveqa-[a-z0-9-]{6,56}", payload["marker"]) is None) or
                  (payload["marker"] and re.fullmatch(r"liveqa-[a-z0-9-]{6,56}", payload["marker"]) is None)):
                  fail()
              if schema == "1":
                  app_sha = runner_sha
                  binding_digest = ""
              else:
                  binding = payload.get("source_binding")
                  binding_digest = validate_binding(binding, runner_sha)
                  app_sha = binding["app_target_sha"]
                  if app_sha == runner_sha:
                      fail()
              if not SHA_RE.fullmatch(app_sha):
                  fail()
              parent = output_path.parent
              parent_meta = parent.lstat()
              if (not stat.S_ISDIR(parent_meta.st_mode) or stat.S_ISLNK(parent_meta.st_mode) or
                  parent.resolve(strict=True) != parent):
                  fail()
              fd = os.open(output_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o600)
              try:
                  opened = os.fstat(fd)
                  if not stat.S_ISREG(opened.st_mode) or opened.st_nlink != 1 or stat.S_IMODE(opened.st_mode) != 0o600:
                      fail()
                  view = memoryview(raw)
                  while view:
                      written = os.write(fd, view)
                      view = view[written:]
                  os.fsync(fd)
              finally:
                  os.close(fd)
              with open(os.environ["GITHUB_ENV"], "a", encoding="ascii") as output:
                  output.write(f"APP_TARGET_SHA={app_sha}\nSOURCE_BINDING_SHA256={binding_digest}\n")
          except SystemExit:
              print("LIVE_HANDOFF status=failed", file=__import__("sys").stderr)
              raise
          except Exception:
              print("LIVE_HANDOFF status=failed", file=__import__("sys").stderr)
              raise SystemExit(1)
          print("LIVE_HANDOFF status=verified")
          PY


      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/live-launch-input.json" \
            || { echo "Live workflow handoff is missing; refusing SSH setup" >&2; exit 1; }
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/platform-live-launch-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-live-launch-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 0600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          chmod 600 "$ssh_dir/known_hosts"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run the dedicated production browser supervisor
        id: run_live_supervisor
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/live-launch-input.json"
          raw_report="$RUNNER_TEMP/live-launch-raw.log"
          umask 077
          : > "$raw_report"
          chmod 600 "$raw_report"
          set +e
          # The remote command has a fixed argv.  Dispatch values are supplied
          # as the validated JSON document on stdin, never as SSH command text.
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B \
            /root/.oldsparky/liveqa/platform_workflow_remote_dispatch.py \
            live-launch < "$input_path" > "$raw_report" 2>/dev/null
          ssh_status="$?"
          set -e
          echo "ssh_status=$ssh_status" >> "$GITHUB_OUTPUT"
          exit "$ssh_status"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/live-launch-input.json"
          rm -f -- "$input_path"
          test ! -e "$input_path"
          ssh_dir="$RUNNER_TEMP/platform-live-launch-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-live-launch-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Sanitize live-launch output before artifact publication
        if: ${{ always() && steps.authenticate_live_launch_handoff.outcome == 'success' && steps.cleanup_ssh.outcome == 'success' }}
        shell: bash
        env:
          SUPERVISOR_STATUS: ${{ steps.run_live_supervisor.outputs.ssh_status || '1' }}
          LIVE_MARKER: ${{ inputs.marker }}
        run: |
          set -euo pipefail
          raw_report="$RUNNER_TEMP/live-launch-raw.log"
          safe_report="$RUNNER_TEMP/live-launch-sanitized.json"
          cleanup_raw_report() {
            rm -f -- "$raw_report"
          }
          trap cleanup_raw_report EXIT
          /usr/bin/python3 - "$raw_report" "$safe_report" "$SUPERVISOR_STATUS" \
            "$GITHUB_SHA" "$APP_TARGET_SHA" "$SOURCE_BINDING_SHA256" "$LIVE_MARKER" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          try:
              process_status = int(sys.argv[3])
          except ValueError:
              process_status = 1
          expected_sha, app_sha, binding_digest, marker_value = sys.argv[4:]
          marker_sha256 = hashlib.sha256(marker_value.encode("ascii")).hexdigest()
          raw_size = source.stat().st_size
          raw = source.read_bytes() if raw_size <= 1024 else b""
          marker_pattern = re.compile(
              rb"LIVE_LAUNCH_STATUS schema=2 status=(passed|failed) "
              rb"stage=(validation|trusted_generation|identity|account_install|"
              rb"provision|browser_qa|dispatch|trusted_entry|timeout|complete) "
              rb"check=(none|input_shape|input_validation|source_binding|"
              rb"source_binding_io|source_binding_schema|source_binding_recheck|root_uid|"
              rb"source_identity|install_root_format|origin|install_root_target|"
              rb"provision_mode|provision_marker|marker_absent|marker_digest|"
              rb"generation_members|generation_supervisor_path|"
              rb"generation_supervisor_metadata|generation_manifest|identity|"
              rb"account_install|provision|browser_qa|release_lock|trusted_entry|"
              rb"supervisor_exec|dispatch|timeout|stream_limit|protocol) "
              rb"child_exit=(0|[1-9][0-9]{0,2}) "
              rb"source_sha=([0-9a-f]{40})\n"
          )
          count_fields = (
              "logical_total", "logical_pass", "logical_fail", "logical_expected_fail",
              "logical_flaky", "logical_skip", "logical_interrupted", "attempt_total",
              "attempt_pass", "attempt_fail", "attempt_skip", "attempt_interrupted",
              "attempt_timedout",
          )
          count_pattern = re.compile(
              rb"LIVE_BROWSER_COUNTS schema=1 run_status=(passed|failed|timedout|interrupted) "
              + b" ".join(
                  rf"({field}=(?:0|[1-9][0-9]{{0,4}}))".encode("ascii")
                  for field in count_fields
              )
              + rb" source_sha=([0-9a-f]{40}) app_sha=([0-9a-f]{40}) "
              + rb"marker_sha256=([0-9a-f]{64})\n"
          )
          child_diagnostic_pattern = re.compile(
              rb"LIVE_QA_CHILD_DIAGNOSTIC schema=1 kind="
              rb"(none|playwright_cli_usage|node_module_missing|browser_executable_missing|"
              rb"browser_launch_error|child_timeout|cleanup_failure|unclassified) "
              rb"stdout_bytes=([0-9]{1,16}) stderr_bytes=([0-9]{1,16}) "
              rb"truncated=(true|false) child_exit=([0-9]{1,3})\n"
          )
          lines = raw.splitlines(keepends=True) if raw_size <= 1024 else []
          diagnostic_lines = [line for line in lines if line.startswith(b"LIVE_QA_CHILD_DIAGNOSTIC ")]
          child_diagnostic = None
          if len(diagnostic_lines) == 1:
              diagnostic_match = child_diagnostic_pattern.fullmatch(diagnostic_lines[0])
              if diagnostic_match is not None:
                  child_diagnostic = {
                      "kind": diagnostic_match.group(1).decode("ascii"),
                      "stdout_bytes": int(diagnostic_match.group(2)),
                      "stderr_bytes": int(diagnostic_match.group(3)),
                      "truncated": diagnostic_match.group(4) == b"true",
                      "child_exit_code": int(diagnostic_match.group(5)),
                  }
          diagnostic_valid = not diagnostic_lines or (
              len(diagnostic_lines) == 1
              and child_diagnostic is not None
              and child_diagnostic["child_exit_code"] == process_status
          )
          protocol_lines = [line for line in lines if not line.startswith(b"LIVE_QA_CHILD_DIAGNOSTIC ")]
          count_values = None
          if len(protocol_lines) == 2:
              count_match = count_pattern.fullmatch(protocol_lines[0])
              if count_match is not None:
                  values = {
                      "run_status": count_match.group(1).decode("ascii"),
                      **{
                          field: int(count_match.group(index + 2).split(b"=", 1)[1])
                          for index, field in enumerate(count_fields)
                      },
                  }
                  count_bindings_match = (
                      count_match.group(15).decode("ascii") == expected_sha
                      and count_match.group(16).decode("ascii") == app_sha
                      and count_match.group(17).decode("ascii") == marker_sha256
                  )
                  logical_sum = sum(values[field] for field in count_fields[1:7])
                  attempt_sum = sum(values[field] for field in count_fields[8:])
                  if (
                      count_bindings_match
                      and all(0 <= values[field] <= 32768 for field in count_fields)
                      and values["logical_total"] <= 4096
                      and logical_sum == values["logical_total"]
                      and attempt_sum == values["attempt_total"]
                  ):
                      count_values = values
          status_line = protocol_lines[-1] if protocol_lines else b""
          match = marker_pattern.fullmatch(status_line)
          marker = None
          if match is not None and match.group(5).decode("ascii") == expected_sha:
              marker = (
                  match.group(1).decode("ascii"),
                  match.group(2).decode("ascii"),
                  match.group(3).decode("ascii"),
                  int(match.group(4)),
              )
          marker_ok = False
          if marker is not None and diagnostic_valid:
              marker_status, stage, check_id, child_status = marker
              if marker_status == "passed":
                  marker_ok = (
                      stage == "complete"
                      and check_id == "none"
                      and child_status == 0
                      and process_status == 0
                  )
              else:
                  marker_ok = (
                      stage in {
                          "validation", "trusted_generation", "identity",
                          "account_install", "provision", "browser_qa",
                          "dispatch", "trusted_entry", "timeout",
                      }
                      and child_status > 0
                      and process_status == child_status
                  )
          success = bool(
              marker_ok
              and marker is not None
              and marker[0] == "passed"
              and count_values is not None
              and count_values["run_status"] == "passed"
              and count_values["logical_total"] > 0
              and count_values["logical_pass"] > 0
              and count_values["logical_fail"] == 0
              and count_values["logical_flaky"] == 0
              and count_values["logical_interrupted"] == 0
          )
          rejected_completed_run = bool(
              marker_ok
              and marker is not None
              and marker[0] == "passed"
              and count_values is not None
          )
          status = "passed" if success else (
              "failed"
              if marker_ok and marker is not None and (
                  marker[0] == "failed" or rejected_completed_run
              )
              else "unavailable"
          )
          errors = {"none": 1} if success else (
              {"browser_child_" + child_diagnostic["kind"]: 1}
              if marker_ok and child_diagnostic is not None
              else ({"other": 1} if marker_ok else {"transport": 1})
          )
          stage = marker[1] if marker_ok and marker is not None else "unknown"
          check_id = marker[2] if marker_ok and marker is not None else "unknown"
          child_status = marker[3] if marker_ok and marker is not None else 1
          logical_counts = None if count_values is None else {
              field: count_values[field]
              for field in count_fields[:7]
          }
          attempt_counts = None if count_values is None else {
              field: count_values[field]
              for field in count_fields[7:]
          }
          status_counts = None if count_values is None else {
              "passed": count_values["logical_pass"],
              "failed": count_values["logical_fail"],
              "expected_failed": count_values["logical_expected_fail"],
              "flaky": count_values["logical_flaky"],
              "skipped": count_values["logical_skip"],
              "interrupted": count_values["logical_interrupted"],
          }
          report = {
              "schema": 1,
              "source_git_sha": expected_sha,
              "app_target_sha": app_sha,
              "source_binding_sha256": binding_digest or None,
              "status": status,
              "success": success,
              "process_exit_code": process_status if 0 <= process_status <= 255 else 1,
              "stage": stage,
              "check_id": check_id,
              "child_exit_code": child_status,
              "source_sha": expected_sha,
              "line_count": ((2 if count_values is not None else 1) + (1 if child_diagnostic is not None else 0)) if marker_ok else 0,
              "retained_line_count": ((2 if count_values is not None else 1) + (1 if child_diagnostic is not None else 0)) if marker_ok else 0,
              "truncated": False,
              "test_count": None if count_values is None else count_values["logical_total"],
              "failed_test_count": None if count_values is None else count_values["logical_fail"],
              "flaky_test_count": None if count_values is None else count_values["logical_flaky"],
              "skipped_test_count": None if count_values is None else count_values["logical_skip"],
              "interrupted_test_count": None if count_values is None else count_values["logical_interrupted"],
              "logical_counts": logical_counts,
              "attempt_counts": attempt_counts,
              "tests": [],
              "class_counts": logical_counts or ({"failure": 1} if marker_ok else {}),
              "route_class_counts": {},
              "status_counts": status_counts or {},
              "error_class_counts": errors,
              "child_diagnostic": child_diagnostic,
          }
          destination.write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          PY
          chmod 600 "$safe_report"
          rm -f -- "$raw_report"
          test ! -e "$raw_report"
      - name: Upload sanitized live-launch report
        if: ${{ always() && steps.authenticate_live_launch_handoff.outcome == 'success' && steps.cleanup_ssh.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-live-launch-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-launch-sanitized.json
          if-no-files-found: error
          retention-days: 1

  sanitize-live-report:
    name: Sanitize live-launch report
    needs: live-sanity
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: none
    steps:
      - name: Download sanitized live-launch report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-live-launch-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-launch-sanitized
      - name: Validate sanitized live-launch report
        shell: bash
        run: |
          set -euo pipefail
          install -m 600 \
            "$RUNNER_TEMP/live-launch-sanitized/live-launch-sanitized.json" \
            "$RUNNER_TEMP/live-launch-report.json"
          /usr/bin/python3 - "$RUNNER_TEMP/live-launch-report.json" \
            "$GITHUB_SHA" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          runner_sha = sys.argv[2]
          app_sha = report.get("app_target_sha") if isinstance(report, dict) else None
          binding_digest = report.get("source_binding_sha256") if isinstance(report, dict) else None
          if report.get("truncated") is not False or report.get("status") in {"truncated", "error", "unavailable"}:
              raise SystemExit("required live-launch report is incomplete")
          if (
              report.get("source_git_sha") != runner_sha
              or re.fullmatch(r"[0-9a-f]{40}", runner_sha) is None
              or re.fullmatch(r"[0-9a-f]{40}", app_sha) is None
              or (app_sha == runner_sha and binding_digest is not None)
              or (app_sha != runner_sha and
                  (not isinstance(binding_digest, str) or re.fullmatch(r"[0-9a-f]{64}", binding_digest) is None))
          ):
              raise SystemExit("required live-launch source binding is invalid")
          if report.get("success") is not True:
              raise SystemExit("Live browser QA did not pass; see fixed report classes.")
          logical_fields = (
              "logical_total", "logical_pass", "logical_fail", "logical_expected_fail",
              "logical_flaky", "logical_skip", "logical_interrupted",
          )
          attempt_fields = (
              "attempt_total", "attempt_pass", "attempt_fail", "attempt_skip",
              "attempt_interrupted", "attempt_timedout",
          )
          logical = report.get("logical_counts")
          attempts = report.get("attempt_counts")
          if (
              not isinstance(logical, dict)
              or set(logical) != set(logical_fields)
              or not isinstance(attempts, dict)
              or set(attempts) != set(attempt_fields)
              or any(type(logical.get(key)) is not int or logical[key] < 0 for key in logical_fields)
              or any(type(attempts.get(key)) is not int or attempts[key] < 0 for key in attempt_fields)
              or logical["logical_total"] <= 0
              or logical["logical_pass"] <= 0
              or logical["logical_total"] != report.get("test_count")
              or sum(logical[key] for key in logical_fields[1:]) != logical["logical_total"]
              or sum(attempts[key] for key in attempt_fields[1:]) != attempts["attempt_total"]
              or logical["logical_fail"] != report.get("failed_test_count")
              or logical["logical_flaky"] != report.get("flaky_test_count")
              or logical["logical_skip"] != report.get("skipped_test_count")
              or logical["logical_interrupted"] != report.get("interrupted_test_count")
              or report.get("tests") != []
          ):
              raise SystemExit("Live browser QA case-count report is incomplete.")
          PY
      - name: Upload browser gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-live-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-launch-report.json
          if-no-files-found: error
          retention-days: 14
