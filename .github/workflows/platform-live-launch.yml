name: Platform live launch sanity

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed platform origin, including scheme"
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-sanity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/apps/platform_web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: platform/apps/platform_web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:live
        env:
          CI: "true"
          PLAYWRIGHT_LIVE_BASE_URL: ${{ inputs.base_url }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-live-playwright-report
          path: platform/apps/platform_web/playwright-report-live
          if-no-files-found: ignore
          retention-days: 14
