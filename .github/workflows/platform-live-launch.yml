name: Platform live launch sanity

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Canonical deployed platform origin (must be https://old-sparky.com)"
        required: true
        type: string
      provision:
        description: "Provision or safely rotate the root-only CSP QA bundle before the run"
        required: true
        default: false
        type: boolean
      marker:
        description: "Fresh liveqa marker, required when provision is true"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate-live-inputs:
    name: Validate live-launch handoff
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LIVE_BASE_URL: ${{ inputs.base_url }}
      LIVE_PROVISION: ${{ inputs.provision }}
      LIVE_MARKER: ${{ inputs.marker }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Reject invalid live-launch dispatch before mode branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch || { echo "Live launch accepts workflow_dispatch only." >&2; exit 1; }
          test "$LIVE_BASE_URL" = "https://old-sparky.com" || { echo "Live launch requires the canonical origin." >&2; exit 1; }
          case "$LIVE_PROVISION" in true|false) ;; *) echo "Live provision mode is invalid." >&2; exit 1 ;; esac
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Live launch requires an exact target SHA." >&2; exit 1; }
      - name: Checkout live-launch validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require the exact checked-out live validator SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Validate live-launch dispatch and publish handoff
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 platform/tools/platform_workflow_input_guard.py live \
            --output "$RUNNER_TEMP/live-launch-input.json" \
            --base-url "$LIVE_BASE_URL" \
            --provision "$LIVE_PROVISION" \
            --marker "$LIVE_MARKER" \
            --target-sha "$TARGET_SHA"
          test "$(stat -c '%a' "$RUNNER_TEMP/live-launch-input.json")" = 600
      - name: Upload closed live-launch handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-live-launch-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-launch-input.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove validator handoff
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/live-launch-input.json"

  live-sanity:
    needs: validate-live-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      LIVE_BASE_URL: ${{ inputs.base_url }}
      LIVE_PROVISION: ${{ inputs.provision }}
      LIVE_MARKER: ${{ inputs.marker }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Download validated live-launch handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-live-launch-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-launch-input
      - name: Install private live-launch handoff
        shell: bash
        run: |
          set -euo pipefail
          source_path="$RUNNER_TEMP/live-launch-input/live-launch-input.json"
          test -f "$source_path" && test ! -L "$source_path"
          install -m 600 "$source_path" "$RUNNER_TEMP/live-launch-input.json"
          test "$(stat -c '%a' "$RUNNER_TEMP/live-launch-input.json")" = 600

      - name: Revalidate closed live handoff and exact target SHA
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP/live-launch-input.json" "$TARGET_SHA" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {"schema", "base_url", "provision", "marker", "target_sha"}
          if set(payload) != expected:
              raise SystemExit("live handoff schema is not closed")
          if payload.get("schema") not in (1, "1") or payload.get("base_url") != "https://old-sparky.com":
              raise SystemExit("live handoff origin is invalid")
          if payload.get("provision") not in {"true", "false"}:
              raise SystemExit("live handoff provision mode is invalid")
          if payload.get("target_sha") != sys.argv[2] or re.fullmatch(r"[0-9a-f]{40}", sys.argv[2]) is None:
              raise SystemExit("live handoff exact target SHA mismatch")
          marker = payload.get("marker")
          if payload["provision"] == "true" and re.fullmatch(r"liveqa-[a-z0-9-]{6,56}", str(marker)) is None:
              raise SystemExit("live handoff marker is invalid")
          if payload["provision"] == "false" and marker != "":
              raise SystemExit("live handoff marker must be empty without provisioning")
          print("closed live handoff accepted for exact target SHA")
          PY

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/live-launch-input.json" \
            || { echo "Live workflow handoff is missing; refusing SSH setup" >&2; exit 1; }
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/platform-live-launch-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-live-launch-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" || { echo "Production SSH host exposed no ED25519 key" >&2; exit 1; }
          ssh_key_count="$(wc -l < "$ssh_scan" | tr -d ' ')"
          test "$ssh_key_count" = "1" || { echo "Expected exactly one production ED25519 host key" >&2; exit 1; }
          ssh_fingerprint="$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$ssh_fingerprint" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" || {
            echo "Production SSH host fingerprint mismatch" >&2
            exit 1
          }
          install -m 0600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          chmod 600 "$ssh_dir/known_hosts"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run the dedicated production browser supervisor
        id: run_live_supervisor
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/live-launch-input.json"
          raw_report="$RUNNER_TEMP/live-launch-raw.log"
          umask 077
          : > "$raw_report"
          chmod 600 "$raw_report"
          set +e
          # The remote command has a fixed argv.  Dispatch values are supplied
          # as the validated JSON document on stdin, never as SSH command text.
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 \
            /root/.oldsparky/liveqa/platform_workflow_remote_dispatch.py \
            live-launch < "$input_path" > "$raw_report" 2>&1
          ssh_status="$?"
          set -e
          echo "ssh_status=$ssh_status" >> "$GITHUB_OUTPUT"
          exit "$ssh_status"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/live-launch-input.json"
          rm -f -- "$input_path"
          test ! -e "$input_path"
          handoff_dir="$RUNNER_TEMP/live-launch-input"
          if [[ -e "$handoff_dir" || -L "$handoff_dir" ]]; then
            test -d "$handoff_dir" && test ! -L "$handoff_dir"
            handoff_file="$handoff_dir/live-launch-input.json"
            if [[ -e "$handoff_file" || -L "$handoff_file" ]]; then
              test -f "$handoff_file" && test ! -L "$handoff_file"
              rm -f -- "$handoff_file"
              test ! -e "$handoff_file" && test ! -L "$handoff_file"
            fi
            rmdir -- "$handoff_dir"
          fi
          test ! -e "$handoff_dir" && test ! -L "$handoff_dir"
          ssh_dir="$RUNNER_TEMP/platform-live-launch-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-live-launch-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Sanitize live-launch output before artifact publication
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' }}
        shell: bash
        env:
          SUPERVISOR_STATUS: ${{ steps.run_live_supervisor.outputs.ssh_status || '1' }}
        run: |
          set -euo pipefail
          raw_report="$RUNNER_TEMP/live-launch-raw.log"
          safe_report="$RUNNER_TEMP/live-launch-sanitized.json"
          cleanup_raw_report() {
            rm -f -- "$raw_report"
          }
          trap cleanup_raw_report EXIT
          /usr/bin/python3 - "$raw_report" "$safe_report" "$SUPERVISOR_STATUS" <<'PY'
          import json
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          try:
              process_status = int(sys.argv[3])
          except ValueError:
              process_status = 1
          raw = source.read_bytes()[:262144]
          truncated = len(raw) == 262144
          text = raw.decode("utf-8", errors="replace")
          lines = text.splitlines()[:1000]
          lower = text.lower()
          if process_status != 0:
              status = "failed"
              success = False
              errors = {"transport": 1}
          elif "live_browser_qa_success" in lower:
              status = "passed"
              success = True
              errors = {"none": 1}
          elif any(word in lower for word in ("error", "failed", "failure", "timeout")):
              status = "failed"
              success = False
              errors = {"other": 1}
          elif lines:
              status = "unknown"
              success = False
              errors = {"none": 1}
          else:
              status = "unavailable"
              success = False
              errors = {"none": 1}
          report = {
              "schema": 1,
              "status": status,
              "success": success,
              "process_exit_code": process_status if 0 <= process_status <= 255 else 1,
              "line_count": len(lines),
              "retained_line_count": len(lines),
              "truncated": truncated,
              "test_count": 1 if "live_browser_qa_success" in lower else 0,
              "failed_test_count": 0 if success else (1 if lines else 0),
              "tests": ([{"name": "browser_public", "status": "passed", "route_class": "other", "http_status": 0, "error_class": "none"}] if success else []),
              "class_counts": {"success": 1} if success else {"failure": 1},
              "route_class_counts": {"other": len(lines)},
              "status_counts": {},
              "error_class_counts": errors,
          }
          destination.write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          PY
          chmod 600 "$safe_report"
          rm -f -- "$raw_report"
          test ! -e "$raw_report"
      - name: Upload sanitized live-launch report
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-live-launch-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-launch-sanitized.json
          if-no-files-found: error
          retention-days: 1

  sanitize-live-report:
    name: Sanitize live-launch report
    needs: live-sanity
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download sanitized live-launch report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-live-launch-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-launch-sanitized
      - name: Validate sanitized live-launch report
        shell: bash
        run: |
          set -euo pipefail
          install -m 600 \
            "$RUNNER_TEMP/live-launch-sanitized/live-launch-sanitized.json" \
            "$RUNNER_TEMP/live-launch-report.json"
          /usr/bin/python3 - "$RUNNER_TEMP/live-launch-report.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("truncated") is not False or report.get("status") in {"truncated", "error", "unavailable"}:
              raise SystemExit("required live-launch report is incomplete")
          if report.get("success") is not True:
              raise SystemExit("Live browser QA did not pass; see fixed report classes.")
          PY
      - name: Upload browser gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-live-playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-launch-report.json
          if-no-files-found: error
          retention-days: 14
