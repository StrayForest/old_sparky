name: Platform live launch sanity

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Canonical deployed platform origin (must be https://old-sparky.com)"
        required: true
        type: string
      provision:
        description: "Provision the one-time root-only CSP QA bundle before the run"
        required: true
        default: false
        type: boolean
      marker:
        description: "Fresh liveqa marker, required when provision is true"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  live-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      LIVE_BASE_URL: ${{ inputs.base_url }}
      LIVE_PROVISION: ${{ inputs.provision }}
      LIVE_MARKER: ${{ inputs.marker }}
    steps:
      - name: Validate production browser gate inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$LIVE_BASE_URL" = "https://old-sparky.com" \
            || { echo "Production browser QA requires the canonical origin" >&2; exit 1; }
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/old_sparky_prod
          chmod 600 ~/.ssh/old_sparky_prod
          ssh-keyscan -T 10 -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run the dedicated production browser supervisor
        shell: bash
        run: |
          set -o pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            bash -s -- live-launch-supervisor "$LIVE_BASE_URL" "$LIVE_PROVISION" "$LIVE_MARKER" <<'REMOTE' | tee live-launch-report.txt
          set -Eeuo pipefail
          base_url="$1"
          provision="$2"
          marker="$3"
          test "$(id -u)" -eq 0 || { echo "Live browser supervisor must run as root" >&2; exit 1; }
          test "$base_url" = "https://old-sparky.com" \
            || { echo "Unexpected production origin" >&2; exit 1; }
          case "$provision" in
            true)
              [[ "$marker" =~ ^liveqa-[a-z0-9-]{6,56}$ ]] \
                || { echo "Provisioning requires a fresh liveqa marker" >&2; exit 2; }
              test ! -e /root/.oldsparky/liveqa/csp-live-qa.json \
                || { echo "Refusing to replace the existing live QA bundle" >&2; exit 2; }
              install -d -o root -g root -m 0700 /root/.oldsparky/liveqa
              for path in \
                /opt/oldsparky \
                /opt/oldsparky/platform \
                /opt/oldsparky/platform/shared \
                /opt/oldsparky/platform/shared/.env.platform; do
                if [[ -e "$path" || -L "$path" ]]; then
                  /usr/bin/stat -c \
                    'LIVE_QA_ENV_PATH path=%n uid=%u gid=%g mode=%a type=%F' \
                    "$path"
                else
                  echo "LIVE_QA_ENV_PATH path=$path status=missing"
                fi
              done
              /usr/bin/python3.12 - <<'PY'
          import grp
          import json
          import pwd

          names = (
              "oldsparky",
              "oldsparky-platform",
              "oldsparky-api",
              "oldsparky-web",
              "oldsparky-worker",
              "oldsparky-liveqa",
          )
          users = {}
          groups = {}
          for name in names:
              try:
                  entry = pwd.getpwnam(name)
              except KeyError:
                  users[name] = None
              else:
                  users[name] = {
                      "uid": entry.pw_uid,
                      "gid": entry.pw_gid,
                      "home": entry.pw_dir,
                      "shell": entry.pw_shell,
                  }
              try:
                  entry = grp.getgrnam(name)
              except KeyError:
                  groups[name] = None
              else:
                  groups[name] = {"gid": entry.gr_gid}
          failures = []
          qa_user = users.get("oldsparky-liveqa")
          qa_group = groups.get("oldsparky-liveqa")
          if qa_user is None:
              failures.append("user_missing")
          if qa_group is None:
              failures.append("group_missing")
          required = ("oldsparky", "oldsparky-platform")
          for name in required:
              if users.get(name) is None:
                  failures.append(f"{name}_user_missing")
              if groups.get(name) is None:
                  failures.append(f"{name}_group_missing")
          if qa_user is not None and qa_group is not None:
              if qa_user["uid"] == 0 or any(
                  name != "oldsparky-liveqa"
                  and value is not None
                  and value["uid"] == qa_user["uid"]
                  for name, value in users.items()
              ):
                  failures.append("uid_collision")
              if qa_user["gid"] == 0 or any(
                  name != "oldsparky-liveqa"
                  and value is not None
                  and value["gid"] == qa_user["gid"]
                  for name, value in users.items()
              ) or any(
                  name != "oldsparky-liveqa"
                  and value is not None
                  and value["gid"] == qa_user["gid"]
                  for name, value in groups.items()
              ):
                  failures.append("gid_collision")
              if qa_user["gid"] != qa_group["gid"]:
                  failures.append("user_group_gid_mismatch")
              if qa_user["home"] != "/nonexistent":
                  failures.append("home_mismatch")
              if qa_user["shell"] != "/usr/sbin/nologin":
                  failures.append("shell_mismatch")
              passwd_matches = [
                  entry.pw_name
                  for entry in pwd.getpwall()
                  if entry.pw_uid == qa_user["uid"]
              ]
              if passwd_matches != ["oldsparky-liveqa"]:
                  failures.append("uid_duplicate")
              group_matches = [
                  entry.gr_name
                  for entry in grp.getgrall()
                  if entry.gr_gid == qa_user["gid"]
              ]
              if group_matches != ["oldsparky-liveqa"]:
                  failures.append("gid_duplicate")
              supplementary = [
                  entry.gr_name
                  for entry in grp.getgrall()
                  if entry.gr_gid != qa_user["gid"]
                  and "oldsparky-liveqa" in entry.gr_mem
              ]
              if supplementary:
                  failures.append("supplementary_groups")
          print(
              "LIVE_QA_IDENTITY "
              + json.dumps(
                  {
                      "status": "invalid" if failures else "valid",
                      "reasons": failures,
                      "qa_user": qa_user,
                      "qa_group": qa_group,
                      "required_identities_present": all(
                          users.get(name) is not None and groups.get(name) is not None
                          for name in required
                      ),
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY
              /root/old_sparky/platform/tools/platform_install_live_qa_user.sh --apply
              install -o root -g root -m 0500 \
                /root/old_sparky/platform/tools/platform_live_qa_mailbox_helper.py \
                /root/.oldsparky/liveqa/platform_live_qa_mailbox_helper.py
              PLATFORM_APP_DIR=/opt/oldsparky/platform \
              /root/old_sparky/platform/tools/platform_provision_live_csp_qa.sh \
                --marker "$marker" \
                --bundle-path /root/.oldsparky/liveqa/csp-live-qa.json \
                --primary-email liveqa@auth.old-sparky.com \
                --mailbox-helper /root/.oldsparky/liveqa/platform_live_qa_mailbox_helper.py
              ;;
            false)
              test -z "$marker" \
                || { echo "marker is allowed only with provision=true" >&2; exit 2; }
              ;;
            *)
              echo "provision must be true or false" >&2
              exit 2
              ;;
          esac
          PLATFORM_APP_DIR=/opt/oldsparky/platform \
          PLATFORM_LIVE_CSP_QA_BUNDLE=/root/.oldsparky/liveqa/csp-live-qa.json \
          PLAYWRIGHT_LIVE_BASE_URL="$base_url" \
          /root/old_sparky/platform/tools/platform_live_browser_qa.sh public
          REMOTE
          grep -Eq '^LIVE_BROWSER_QA_SUCCESS source_commit=[0-9a-f]{40}$' live-launch-report.txt

      - name: Upload browser gate report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-live-playwright-report
          path: live-launch-report.txt
          if-no-files-found: error
          retention-days: 14
