name: Platform production external load

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN-PRODUCTION-EXTERNAL-LOAD to create a temporary production fixture"
        required: true
        type: string
      control_email:
        description: "Existing account preserved by exact cleanup"
        required: true
        type: string
      profile_id:
        description: "Reviewed canonical load profile ID"
        required: true
        default: "ready-vote-slo-v2"
        type: choice
        options:
          - ready-vote-slo-v2
          - ready-vote-capacity-ramp-v2
          - ready-vote-saturation-ramp-v4
          - ready-vote-stress-15k-v2
          - ready-vote-stress-20k-v2
          - ready-vote-spike-v1
          - read-mix-human-v2
          - read-mix-stress-v2
          - read-mix-concurrency-ramp-v1
          - authenticated-page-load-v1
          - authenticated-page-load-v2
      timeout_diagnostics:
        description: "Enable bounded per-timeout client/edge/Next/API evidence (diagnostic-only)"
        required: false
        default: false
        type: boolean
      cpu_diagnostic_pair:
        description: "After the governed authenticated-page-load-v1 run, add a separate zero-credit SSR CPU off/on diagnostic"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: platform-production-external-load
  cancel-in-progress: false

jobs:
  # Candidate validation and profile code run without the production
  # environment.  The only value crossing to an approved job is the closed
  # mode-600 JSON handoff; the approved job validates it again inline.
  validate-external-inputs:
    name: Validate external-load dispatch
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      input_artifact_id: ${{ steps.publish-input.outputs.artifact-id }}
      app_target_sha: ${{ steps.resolve-source-binding.outputs.app_target_sha }}
    env:
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      PROFILE_ID: ${{ inputs.profile_id }}
      TIMEOUT_DIAGNOSTICS: ${{ inputs.timeout_diagnostics }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Mask and stage the control identity from the event file
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          try:
              descriptor = os.open(
                  os.environ["GITHUB_EVENT_PATH"], os.O_RDONLY | os.O_NOFOLLOW
              )
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or metadata.st_size > 65536
                      or stat.S_IMODE(metadata.st_mode) & 0o022
                  ):
                      raise ValueError
                  raw_event = os.read(descriptor, 65537)
              finally:
                  os.close(descriptor)
              if len(raw_event) > 65536:
                  raise ValueError

              def reject_duplicate_keys(pairs):
                  values = {}
                  for key, value in pairs:
                      if key in values:
                          raise ValueError
                      values[key] = value
                  return values

              event = json.loads(
                  raw_event.decode("utf-8"), object_pairs_hook=reject_duplicate_keys
              )
              if not isinstance(event, dict):
                  raise ValueError
              inputs = event.get("inputs")
              if not isinstance(inputs, dict) or set(inputs) != {
                  "confirmation", "control_email", "profile_id", "timeout_diagnostics", "cpu_diagnostic_pair"
              }:
                  raise ValueError
              email = inputs.get("control_email") if isinstance(inputs, dict) else None
              if not isinstance(email, str) or not email.isascii() or not 3 <= len(email) <= 254 or email != email.strip() or email.count("@") != 1:
                  raise ValueError
              local, domain = email.split("@", 1)
              local_pattern = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9._%+\-]{0,62}[A-Za-z0-9])?$")
              label_pattern = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?$")
              labels = domain.split(".")
              if not 1 <= len(local) <= 64 or not 1 <= len(domain) <= 253 or "." not in domain or local_pattern.fullmatch(local) is None or any(label_pattern.fullmatch(label) is None for label in labels):
                  raise ValueError
              if any(ord(character) < 0x21 or ord(character) == 0x7F for character in email):
                  raise ValueError
              canonical_email = email.lower()
              if len(canonical_email) > 254:
                  raise ValueError
          except (OSError, ValueError, TypeError, json.JSONDecodeError):
              raise SystemExit("control identity input is invalid")

          # Register both accepted input casing and its canonical form before
          # persisting the value for any later step.
          for value in dict.fromkeys((email, canonical_email)):
              escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              sys.stdout.write(f"::add-mask::{escaped}\n")
          sys.stdout.flush()

          destination = Path(os.environ["RUNNER_TEMP"]) / "platform-production-control-email"
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
          try:
              descriptor = os.open(destination, flags, 0o600)
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or stat.S_IMODE(metadata.st_mode) != 0o600
                  ):
                      raise OSError
                  with os.fdopen(descriptor, "w", encoding="ascii", closefd=False) as handle:
                      handle.write(canonical_email + "\n")
                      handle.flush()
                      os.fsync(handle.fileno())
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or stat.S_IMODE(metadata.st_mode) != 0o600
                  ):
                      raise OSError
              finally:
                  os.close(descriptor)
          except OSError:
              raise SystemExit("control identity handoff could not be created safely")
          PY

      - name: Reject invalid external-load dispatch before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch || { echo "External load accepts workflow_dispatch only." >&2; exit 1; }
          test "$GITHUB_REF" = refs/heads/dev || { echo "External production load must run from dev." >&2; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "External load requires an exact target SHA." >&2; exit 1; }
          CPU_DIAGNOSTIC_PAIR='${{ inputs.cpu_diagnostic_pair }}'
          case "$TIMEOUT_DIAGNOSTICS:$PROFILE_ID:$QA_CONFIRMATION:$CPU_DIAGNOSTIC_PAIR" in
            true:authenticated-page-load-v1:RUN-PRODUCTION-TIMEOUT-DIAGNOSTICS:false|false:*:RUN-PRODUCTION-EXTERNAL-LOAD:false|false:authenticated-page-load-v1:RUN-PRODUCTION-EXTERNAL-LOAD:true) ;;
            *) echo "External load confirmation/profile combination is invalid." >&2; exit 1 ;;
          esac

      - name: Checkout reviewed load client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Probe mandatory load PID-namespace containment before fixture setup
        shell: bash
        run: |
          set -euo pipefail
          cd platform
          # The runtime probe enforces the exact absolute chain:
          # /usr/bin/sudo -n /usr/bin/setpriv --pdeathsig SIGKILL --
          # /usr/bin/unshare --pid --fork --mount-proc --kill-child=SIGKILL,
          # followed by inner setpriv --no-new-privs --inh-caps=-all
          # --ambient-caps=-all --bounding-set=-all.
          env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            /usr/bin/python3 - <<'PY'
          from tools.platform_load_runtime import probe_pid_namespace_capability

          result = probe_pid_namespace_capability(timeout_seconds=5)
          if result.get("available") is not True:
              raise SystemExit(f"mandatory load containment probe failed: {result.get('reason', 'unknown')}")
          if (
              result.get("sudo") != "/usr/bin/sudo"
              or result.get("setpriv") != "/usr/bin/setpriv"
              or result.get("unshare") != "/usr/bin/unshare"
              or result.get("protocol") != "stdio"
              or not isinstance(result.get("runner_uid"), int)
              or result.get("runner_uid") == 0
              or not isinstance(result.get("runner_gid"), int)
              or result.get("runner_gid") == 0
          ):
              raise SystemExit("mandatory load containment probe did not prove the exact non-root system chain")
          print("mandatory load PID namespace containment: available")
          PY

      - name: Resolve exact no-op receipt or same-source binding
        id: resolve-source-binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/platform"
          binding_dir="$RUNNER_TEMP/platform-production-source-binding"
          /usr/bin/python3 tools/platform_noop_source_binding.py \
            resolve-workflow-source-binding \
            "$TARGET_SHA" "$GITHUB_REPOSITORY" "$GITHUB_API_URL" \
            "$binding_dir" "$GITHUB_OUTPUT"
          test "$(stat -c '%F:%a:%u' -- "$binding_dir")" = "directory:700:$(id -u)"
          test "$(stat -c '%F:%h:%a:%u' -- "$binding_dir/source-binding.json")" = "regular file:1:600:$(id -u)"

      - name: Validate explicit external production load
        shell: bash
        env:
          APP_TARGET_SHA: ${{ steps.resolve-source-binding.outputs.app_target_sha }}
        run: |
          set -euo pipefail
          profile_env="$RUNNER_TEMP/profile.env"
          run_checked_out_client() {
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" SOURCE_GIT_SHA="$TARGET_SHA" APP_TARGET_SHA="$APP_TARGET_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" "$@"
          }
          run_checked_out_client /usr/bin/python3 platform/tools/platform_load.py validate --profile "$PROFILE_ID" --dispatchable
          run_checked_out_client /usr/bin/python3 platform/tools/platform_load.py export-env --profile "$PROFILE_ID" > "$profile_env"
          /usr/bin/python3 - "$profile_env" <<'PY'
          from pathlib import Path
          import re
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          required = {"SETUP_CONCURRENCY", "TOURNAMENT_COUNT", "USERS_PER_TOURNAMENT"}
          seen = set()
          for line in lines:
              if not re.fullmatch(r"[A-Z0-9_]{1,80}=[A-Za-z0-9._:/+-]{1,160}", line):
                  raise SystemExit("profile export is not a closed environment schema")
              key, value = line.split("=", 1)
              seen.add(key)
              if key in required and not re.fullmatch(r"[1-9][0-9]{0,8}", value):
                  raise SystemExit("profile export numeric value is malformed")
          if not required <= seen:
              raise SystemExit("profile export is missing fixture controls")
          PY
          while IFS='=' read -r key value; do
            case "$key" in
              SETUP_CONCURRENCY|TOURNAMENT_COUNT|USERS_PER_TOURNAMENT) export "$key=$value" ;;
            esac
          done < "$profile_env"
          run_checked_out_client /usr/bin/python3 - \
            "$RUNNER_TEMP/platform-production-external-load-input.json" \
            "$RUNNER_TEMP/platform-production-source-binding/source-binding.json" \
            "$QA_CONFIRMATION" "$TARGET_SHA" "$APP_TARGET_SHA" "$SETUP_CONCURRENCY" \
            "$GITHUB_RUN_ID" "$TOURNAMENT_COUNT" "$USERS_PER_TOURNAMENT" \
            "$TIMEOUT_DIAGNOSTICS" <<'PY'
          import os
          import json
          from pathlib import Path
          import re
          import stat
          import sys
          sys.path.insert(0, str(Path("platform").resolve()))
          from tools.platform_workflow_input_guard import (
              _write_private_json,
              validate_external_payload,
          )

          output_path, binding_path_value, confirmation, target_sha, app_target_sha, setup_concurrency, run_id, tournaments, users, timeout_diagnostics = sys.argv[1:]
          binding_path = Path(binding_path_value)
          control_email_path = Path(os.environ["RUNNER_TEMP"]) / "platform-production-control-email"
          metadata = control_email_path.lstat()
          if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode) or metadata.st_mode & 0o077:
              raise SystemExit("control identity handoff permissions are unsafe")
          control_email = control_email_path.read_text(encoding="ascii")
          if not control_email.endswith("\n") or control_email.count("\n") != 1:
              raise SystemExit("control identity handoff is malformed")
          binding_metadata = binding_path.lstat()
          if not stat.S_ISREG(binding_metadata.st_mode) or stat.S_ISLNK(binding_metadata.st_mode) or binding_metadata.st_nlink != 1 or stat.S_IMODE(binding_metadata.st_mode) != 0o600:
              raise SystemExit("source-binding handoff permissions are unsafe")
          handoff = json.loads(binding_path.read_text(encoding="ascii"))
          if (
              not isinstance(handoff, dict)
              or set(handoff) != {"schema", "runner_sha", "app_target_sha", "source_binding"}
              or type(handoff.get("schema")) is not int
              or handoff.get("schema") != 1
              or handoff.get("runner_sha") != target_sha
              or handoff.get("app_target_sha") != app_target_sha
              or re.fullmatch(r"[0-9a-f]{40}", app_target_sha) is None
          ):
              raise SystemExit("source-binding handoff is malformed")
          binding = handoff.get("source_binding")
          if binding is None:
              if app_target_sha != target_sha:
                  raise SystemExit("same-source handoff identities differ")
          elif (
              not isinstance(binding, dict)
              or binding.get("runner_sha") != target_sha
              or binding.get("app_target_sha") != app_target_sha
              or app_target_sha == target_sha
          ):
              raise SystemExit("verified-noop source binding is malformed")
          payload = {
              "schema": 2 if binding is not None else 1,
              "confirmation": confirmation,
              "target_sha": target_sha,
              "control_email": control_email[:-1],
              "setup_concurrency": setup_concurrency,
              "run_id": run_id,
              "profile": "external-vote",
              "tournament_count": tournaments,
              "users_per_tournament": users,
              "timeout_diagnostics": timeout_diagnostics,
          }
          if binding is not None:
              payload["source_binding"] = binding
          _write_private_json(Path(output_path), validate_external_payload(payload))
          PY
          test "$(stat -c '%a' "$RUNNER_TEMP/platform-production-external-load-input.json")" = 600

      - name: Publish closed external-load handoff
        id: publish-input
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-production-external-load-input.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove external-load validator handoff
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- \
            "$RUNNER_TEMP/platform-production-external-load-input.json" \
            "$RUNNER_TEMP/profile.env" \
            "$RUNNER_TEMP/platform-production-control-email"
          rm -rf -- "$RUNNER_TEMP/platform-production-source-binding"
          test ! -e "$RUNNER_TEMP/platform-production-control-email" && test ! -L "$RUNNER_TEMP/platform-production-control-email"

  resolve-host-tools-pin:
    name: Resolve retained-load host-tools pin without production secrets
    needs: validate-external-inputs
    if: needs.validate-external-inputs.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      host_tools_sha: ${{ steps.resolve.outputs.host_tools_sha }}
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact target as untrusted source data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact retained-load host-tools generation
        id: resolve
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$EXPECTED_REPOSITORY" = "StrayForest/old_sparky"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- platform)"
          pin_output="$RUNNER_TEMP/retained-load-host-tools-pin"
          trap 'rm -f -- "$pin_output"' EXIT
          /usr/bin/python3 platform/tools/platform_host_tools_pin.py resolve \
            --source-root "$GITHUB_WORKSPACE" --target-sha "$TARGET_SHA" \
            --expected-repository "$EXPECTED_REPOSITORY" > "$pin_output"
          test "$(stat -c '%F:%h:%a' -- "$pin_output")" = "regular file:1:600"
          test "$(wc -l < "$pin_output" | tr -d '[:space:]')" = 1
          IFS= read -r host_tools_sha < "$pin_output"
          [[ "$host_tools_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'host_tools_sha=%s\n' "$host_tools_sha" >> "$GITHUB_OUTPUT"

  # This job owns SSH only for trusted fixture setup.  It does not checkout or
  # execute candidate code and publishes the manifest as data for a fresh
  # external load runner.
  fixture-setup:
    name: Prepare external fixture with ephemeral SSH
    needs: validate-external-inputs
    if: needs.validate-external-inputs.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      setup_status: ${{ steps.fixture-setup.outputs.setup_status }}
      manifest_ready: ${{ steps.fixture-setup.outputs.manifest_ready }}
      manifest_artifact_id: ${{ steps.publish-manifest.outputs.artifact-id }}
      ssh_cleanup_status: ${{ steps.cleanup-setup-ssh.outputs.ssh_cleanup_status }}
    env:
      TARGET_SHA: ${{ github.sha }}
      APP_TARGET_SHA: ${{ needs.validate-external-inputs.outputs.app_target_sha }}
      RUN_ID: ${{ github.run_id }}
      INPUT_ARTIFACT_ID: ${{ needs.validate-external-inputs.outputs.input_artifact_id }}
    steps:
      - name: Mask the control identity before reading the handoff
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          try:
              descriptor = os.open(
                  os.environ["GITHUB_EVENT_PATH"], os.O_RDONLY | os.O_NOFOLLOW
              )
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or metadata.st_size > 65536
                      or stat.S_IMODE(metadata.st_mode) & 0o022
                  ):
                      raise ValueError
                  raw_event = os.read(descriptor, 65537)
              finally:
                  os.close(descriptor)
              if len(raw_event) > 65536:
                  raise ValueError

              def reject_duplicate_keys(pairs):
                  values = {}
                  for key, value in pairs:
                      if key in values:
                          raise ValueError
                      values[key] = value
                  return values

              event = json.loads(
                  raw_event.decode("utf-8"), object_pairs_hook=reject_duplicate_keys
              )
              if not isinstance(event, dict):
                  raise ValueError
              inputs = event.get("inputs")
              if not isinstance(inputs, dict) or set(inputs) != {
                  "confirmation", "control_email", "profile_id", "timeout_diagnostics", "cpu_diagnostic_pair"
              }:
                  raise ValueError
              email = inputs.get("control_email") if isinstance(inputs, dict) else None
              if not isinstance(email, str) or not email.isascii() or not 3 <= len(email) <= 254 or email != email.strip() or email.count("@") != 1:
                  raise ValueError
              local, domain = email.split("@", 1)
              local_pattern = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9._%+\-]{0,62}[A-Za-z0-9])?$")
              label_pattern = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?$")
              labels = domain.split(".")
              if not 1 <= len(local) <= 64 or not 1 <= len(domain) <= 253 or "." not in domain or local_pattern.fullmatch(local) is None or any(label_pattern.fullmatch(label) is None for label in labels):
                  raise ValueError
              if any(ord(character) < 0x21 or ord(character) == 0x7F for character in email):
                  raise ValueError
              canonical_email = email.lower()
          except (OSError, ValueError, TypeError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("control identity input is invalid")
          for value in dict.fromkeys((email, canonical_email)):
              escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              sys.stdout.write(f"::add-mask::{escaped}\n")
          sys.stdout.flush()
          PY

      - name: Download closed external-load handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-input

      - name: Verify exact external-load handoff artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$INPUT_ARTIFACT_ID"
          [[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          metadata="$RUNNER_TEMP/external-input-artifact-metadata.json"
          archive="$RUNNER_TEMP/external-input-artifact.zip"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID" \
            --output "$metadata"
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID/zip" \
            --output "$archive"
          /usr/bin/python3 - "$metadata" "$archive" "$INPUT_ARTIFACT_ID" "platform-production-external-load-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ID" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          metadata_path, archive_path, artifact_id, artifact_name, run_id, target_sha = sys.argv[1:]
          payload = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          if type(payload.get("id")) is not int or payload.get("id") != int(artifact_id) or payload.get("name") != artifact_name or payload.get("expired") is not False:
              raise SystemExit("external-load handoff artifact metadata is not exact")
          workflow_run = payload.get("workflow_run")
          if not isinstance(workflow_run, dict) or type(workflow_run.get("id")) is not int or workflow_run.get("id") != int(run_id) or workflow_run.get("head_sha") != target_sha:
              raise SystemExit("external-load handoff artifact is not bound to this run and SHA")
          expected_digest = payload.get("digest")
          if not isinstance(expected_digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest) is None:
              raise SystemExit("external-load handoff artifact digest metadata is invalid")
          flags = os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW
          try:
              descriptor = os.open(archive_path, flags)
          except OSError:
              raise SystemExit("external-load handoff archive is unavailable")
          try:
              if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                  raise SystemExit("external-load handoff archive is not a regular file")
              with os.fdopen(descriptor, "rb", closefd=False) as archive:
                  digest = hashlib.sha256()
                  while chunk := archive.read(1024 * 1024):
                      digest.update(chunk)
                  actual_digest = digest.hexdigest()
          finally:
              os.close(descriptor)
          if actual_digest != expected_digest.removeprefix("sha256:"):
              raise SystemExit("external-load handoff archive digest does not match metadata")
          PY

      - name: Revalidate external handoff and exact target SHA
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" && test ! -L "$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          /usr/bin/python3 - "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" "$TARGET_SHA" "$RUN_ID" "$APP_TARGET_SHA" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, target_sha, run_id, app_target_sha = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          base_keys = {"schema", "confirmation", "target_sha", "control_email", "setup_concurrency", "run_id", "profile", "tournament_count", "users_per_tournament", "timeout_diagnostics"}
          binding_keys = {"schema", "binding_mode", "runner_sha", "app_target_sha", "baseline_identity", "receipt_document_sha256", "receipt_artifact_id", "receipt_artifact_name", "receipt_artifact_digest", "receipt_archive_sha256", "cumulative_manifest_sha256", "source_security_run_id", "source_security_run_attempt", "autodeploy_run_id", "autodeploy_run_attempt", "production_deploy_run_id", "production_deploy_run_attempt"}
          schema = payload.get("schema")
          binding = payload.get("source_binding")
          expected = base_keys | ({"source_binding"} if schema in (2, "2") else set())
          if set(payload) != expected:
              raise SystemExit("external handoff schema is not closed")
          if schema not in (1, "1", 2, "2") or payload.get("target_sha") != target_sha or payload.get("run_id") != run_id:
              raise SystemExit("external handoff exact target SHA or run identity mismatch")
          if schema in (1, "1"):
              if app_target_sha != target_sha or binding is not None:
                  raise SystemExit("same-source handoff has a mismatched app SHA")
          elif (
              not isinstance(binding, dict)
              or set(binding) != binding_keys
              or binding.get("binding_mode") != "verified-noop"
              or binding.get("runner_sha") != target_sha
              or binding.get("app_target_sha") != app_target_sha
          ):
              raise SystemExit("external source binding is invalid")
          if payload.get("profile") != "external-vote" or payload.get("timeout_diagnostics") not in {"true", "false"}:
              raise SystemExit("external handoff profile is invalid")
          if re.fullmatch(r"[0-9a-f]{40}", target_sha) is None or re.fullmatch(r"[1-9][0-9]{0,31}", run_id) is None:
              raise SystemExit("external handoff exact target SHA is malformed")
          for key, maximum in (("setup_concurrency", 256), ("tournament_count", 40), ("users_per_tournament", 500)):
              value = payload.get(key)
              if not isinstance(value, str) or re.fullmatch(r"[1-9][0-9]*", value) is None or int(value) > maximum:
                  raise SystemExit(f"external handoff {key} is malformed")
          if int(payload["users_per_tournament"]) < 14:
              raise SystemExit("external handoff users-per-tournament is below the floor")
          print("external handoff accepted for exact target SHA")
          PY

      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/production-external-load-ssh-setup"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
            printf '%s\n' '  ControlMaster no'
            printf '%s\n' '  ControlPersist no'
            printf '%s\n' '  ControlPath none'
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Prepare external fixture with ephemeral SSH
        id: fixture-setup
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -u
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          artifact_dir="$RUNNER_TEMP/external-fixture"
          export_dir="/tmp/old-sparky-production-retained-load-$GITHUB_RUN_ID"
          manifest_path="$artifact_dir/manifest.json"
          mkdir -p "$artifact_dir"; chmod 700 "$artifact_dir"
          manifest_ready=0; setup_status=1
          set +e
          ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" /usr/bin/python3.12 -I -B /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py external-fixture < "$input_path" >/dev/null 2>&1
          launch_status="$?"
          if [[ "$launch_status" == 0 ]]; then
            for _ in $(seq 1 900); do
              if scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/ready" "$artifact_dir/ready" >/dev/null 2>&1 \
                && scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/manifest.json" "$manifest_path" >/dev/null 2>&1; then
                chmod 600 "$manifest_path"; manifest_ready=1; setup_status=0; break
              fi
              sleep 2
            done
          fi
          echo "manifest_ready=$manifest_ready" >> "$GITHUB_OUTPUT"
          echo "setup_status=$setup_status" >> "$GITHUB_OUTPUT"
          exit "$setup_status"

      - name: Validate closed fixture manifest
        if: ${{ steps.fixture-setup.outputs.manifest_ready == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/external-fixture/manifest.json" && test ! -L "$RUNNER_TEMP/external-fixture/manifest.json"
          /usr/bin/python3 - "$RUNNER_TEMP/external-fixture/manifest.json" "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" "$TARGET_SHA" "$APP_TARGET_SHA" <<'PY'
          import json
          import hashlib
          from pathlib import Path
          import re
          import sys

          manifest_path, input_path, target_sha, app_target_sha = sys.argv[1:]
          handoff = json.loads(Path(input_path).read_text(encoding="ascii"))
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          keys = {"schema", "purpose", "origin", "session_cookie_name", "csrf_cookie_name", "marker", "created_at", "tournaments", "users", "runner_sha", "app_target_sha", "source_binding", "source_binding_sha256"}
          if set(manifest) != keys or type(manifest.get("schema")) is not int or manifest.get("schema") != 2 or manifest.get("purpose") != "external_ready_vote" or manifest.get("origin") != "https://old-sparky.com":
              raise SystemExit("fixture manifest schema is not closed")
          expected_binding = handoff.get("source_binding")
          if (
              manifest.get("runner_sha") != target_sha
              or manifest.get("app_target_sha") != app_target_sha
              or manifest.get("source_binding") != expected_binding
          ):
              raise SystemExit("fixture manifest source identities do not match the checked handoff")
          if expected_binding is None:
              if app_target_sha != target_sha or manifest.get("source_binding_sha256") is not None:
                  raise SystemExit("same-source fixture manifest identity is invalid")
          else:
              canonical = json.dumps(expected_binding, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("ascii")
              if manifest.get("source_binding_sha256") != hashlib.sha256(canonical).hexdigest():
                  raise SystemExit("fixture source-binding digest does not match")
          if not isinstance(manifest.get("created_at"), str) or re.fullmatch(r"preprod[0-9]{12}[0-9a-f]{4}", str(manifest.get("marker"))) is None:
              raise SystemExit("fixture manifest marker is invalid")
          tournaments = manifest.get("tournaments")
          users = manifest.get("users")
          if not isinstance(tournaments, list) or not isinstance(users, list) or not tournaments or len(tournaments) > 40 or len(users) > 20000:
              raise SystemExit("fixture manifest population is invalid")
          for row in tournaments:
              if set(row) != {"id", "slug", "user_count"} or not re.fullmatch(r"[A-Za-z0-9_-]{1,128}", str(row["id"])) or not re.fullmatch(r"[A-Za-z0-9_-]{1,128}", str(row["slug"])) or not isinstance(row["user_count"], int) or row["user_count"] < 14:
                  raise SystemExit("fixture tournament row is invalid")
          for row in users:
              if set(row) != {"user_id", "tournament_slug", "session_token", "csrf_token"}:
                  raise SystemExit("fixture user row schema is not closed")
              for field in ("user_id", "tournament_slug", "session_token", "csrf_token"):
                  if not isinstance(row[field], str) or re.fullmatch(r"[A-Za-z0-9._~+/=-]{1,1024}", row[field]) is None:
                      raise SystemExit("fixture user field is unsafe")
          PY

      - name: Publish closed fixture manifest
        id: publish-manifest
        if: ${{ success() && steps.fixture-setup.outputs.setup_status == '0' && steps.fixture-setup.outputs.manifest_ready == '1' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-fixture/manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove fixture-setup SSH material
        id: cleanup-setup-ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_dir="$RUNNER_TEMP/production-external-load-ssh-setup"
          handoff="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"

          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- "$handoff"
          test ! -e "$handoff" && test ! -L "$handoff"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"
          printf '%s\n' 'ssh_cleanup_status=0' >> "$GITHUB_OUTPUT"

  # The measurement runner may execute the candidate load client, but it is a
  # fresh runner with no production SSH environment or key material.
  load-client:
    name: Run checked-out external HTTP load client
    needs:
      - validate-external-inputs
      - fixture-setup
    if: >-
      needs.validate-external-inputs.result == 'success' &&
      needs.fixture-setup.result == 'success' &&
      needs.fixture-setup.outputs.setup_status == '0' &&
      needs.fixture-setup.outputs.manifest_ready == '1'
    runs-on: ubuntu-24.04
    # The largest canonical worker budget is 240 minutes.  Keep a 30-minute
    # runner margin for the mandatory namespace probe, teardown/reap and
    # atomic report publication before Actions enforces its outer deadline.
    timeout-minutes: 270
    permissions:
      actions: read
      contents: read
    outputs:
      load_status: ${{ steps.external-evaluate.outputs.load_status }}
      candidate_state: ${{ steps.external-evaluate.outputs.candidate_state }}
      report_ready: ${{ steps.external-evaluate.outputs.report_ready }}
      candidate_artifact_id: ${{ steps.publish-candidate.outputs.artifact-id }}
    env:
      TARGET_SHA: ${{ github.sha }}
      APP_TARGET_SHA: ${{ needs.validate-external-inputs.outputs.app_target_sha }}
      PROFILE_ID: ${{ inputs.profile_id }}
      TIMEOUT_DIAGNOSTICS: ${{ inputs.timeout_diagnostics }}
      SOURCE_GIT_SHA: ${{ github.sha }}
      INPUT_ARTIFACT_ID: ${{ needs.validate-external-inputs.outputs.input_artifact_id }}
      MANIFEST_ARTIFACT_ID: ${{ needs.fixture-setup.outputs.manifest_artifact_id }}
    steps:
      - name: Mask the control identity before reading the handoff
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          try:
              descriptor = os.open(
                  os.environ["GITHUB_EVENT_PATH"], os.O_RDONLY | os.O_NOFOLLOW
              )
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or metadata.st_size > 65536
                      or stat.S_IMODE(metadata.st_mode) & 0o022
                  ):
                      raise ValueError
                  raw_event = os.read(descriptor, 65537)
              finally:
                  os.close(descriptor)
              if len(raw_event) > 65536:
                  raise ValueError

              def reject_duplicate_keys(pairs):
                  values = {}
                  for key, value in pairs:
                      if key in values:
                          raise ValueError
                      values[key] = value
                  return values

              event = json.loads(
                  raw_event.decode("utf-8"), object_pairs_hook=reject_duplicate_keys
              )
              if not isinstance(event, dict):
                  raise ValueError
              inputs = event.get("inputs")
              if not isinstance(inputs, dict) or set(inputs) != {
                  "confirmation", "control_email", "profile_id", "timeout_diagnostics", "cpu_diagnostic_pair"
              }:
                  raise ValueError
              email = inputs.get("control_email") if isinstance(inputs, dict) else None
              if not isinstance(email, str) or not email.isascii() or not 3 <= len(email) <= 254 or email != email.strip() or email.count("@") != 1:
                  raise ValueError
              local, domain = email.split("@", 1)
              local_pattern = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9._%+\-]{0,62}[A-Za-z0-9])?$")
              label_pattern = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?$")
              labels = domain.split(".")
              if not 1 <= len(local) <= 64 or not 1 <= len(domain) <= 253 or "." not in domain or local_pattern.fullmatch(local) is None or any(label_pattern.fullmatch(label) is None for label in labels):
                  raise ValueError
              if any(ord(character) < 0x21 or ord(character) == 0x7F for character in email):
                  raise ValueError
              canonical_email = email.lower()
          except (OSError, ValueError, TypeError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("control identity input is invalid")
          for value in dict.fromkeys((email, canonical_email)):
              escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              sys.stdout.write(f"::add-mask::{escaped}\n")
          sys.stdout.flush()
          PY

      - name: Download external-load handoffs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-input
      - name: Download closed fixture manifest
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-manifest

      - name: Verify exact load handoff artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_artifact() {
            local artifact_id="$1" artifact_name="$2" prefix="$3"
            test -n "$artifact_id"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            local metadata="$RUNNER_TEMP/${prefix}-metadata.json" archive="$RUNNER_TEMP/${prefix}.zip"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --output "$metadata"
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$archive"
            /usr/bin/python3 - "$metadata" "$archive" "$artifact_id" "$artifact_name" "$GITHUB_RUN_ID" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          metadata_path, archive_path, artifact_id, artifact_name, run_id, target_sha = sys.argv[1:]
          payload = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          if type(payload.get("id")) is not int or payload.get("id") != int(artifact_id) or payload.get("name") != artifact_name or payload.get("expired") is not False:
              raise SystemExit("load handoff artifact metadata is not exact")
          workflow_run = payload.get("workflow_run")
          if not isinstance(workflow_run, dict) or type(workflow_run.get("id")) is not int or workflow_run.get("id") != int(run_id) or workflow_run.get("head_sha") != target_sha:
              raise SystemExit("load handoff artifact is not bound to this run and SHA")
          expected_digest = payload.get("digest")
          if not isinstance(expected_digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest) is None:
              raise SystemExit("load handoff artifact digest metadata is invalid")
          try:
              descriptor = os.open(archive_path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
          except OSError:
              raise SystemExit("load handoff archive is unavailable")
          try:
              if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                  raise SystemExit("load handoff archive is not a regular file")
              with os.fdopen(descriptor, "rb", closefd=False) as archive:
                  digest = hashlib.sha256()
                  while chunk := archive.read(1024 * 1024):
                      digest.update(chunk)
                  actual_digest = digest.hexdigest()
          finally:
              os.close(descriptor)
          if actual_digest != expected_digest.removeprefix("sha256:"):
              raise SystemExit("load handoff archive digest does not match metadata")
          PY
          }
          verify_artifact "$INPUT_ARTIFACT_ID" "platform-production-external-load-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" external-input
          verify_artifact "$MANIFEST_ARTIFACT_ID" "platform-production-external-load-manifest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" external-manifest
      - name: Checkout reviewed load client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require the exact checked-out load-client SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Probe mandatory load PID-namespace containment
        shell: bash
        run: |
          set -euo pipefail
          cd platform
          # Repeat the exact sudo/setpriv/unshare capability probe immediately
          # before candidate execution; there is no unsafe fallback.
          env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            /usr/bin/python3 - <<'PY'
          from tools.platform_load_runtime import probe_pid_namespace_capability

          result = probe_pid_namespace_capability(timeout_seconds=5)
          if result.get("available") is not True:
              raise SystemExit(f"mandatory load containment probe failed: {result.get('reason', 'unknown')}")
          if (
              result.get("sudo") != "/usr/bin/sudo"
              or result.get("setpriv") != "/usr/bin/setpriv"
              or result.get("unshare") != "/usr/bin/unshare"
              or result.get("protocol") != "stdio"
              or not isinstance(result.get("runner_uid"), int)
              or result.get("runner_uid") == 0
              or not isinstance(result.get("runner_gid"), int)
              or result.get("runner_gid") == 0
          ):
              raise SystemExit("mandatory load containment probe did not prove the exact non-root system chain")
          print("mandatory load PID namespace containment: available")
          PY
      - name: Validate load manifest before candidate execution
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" && test ! -L "$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          test -f "$RUNNER_TEMP/external-manifest/manifest.json" && test ! -L "$RUNNER_TEMP/external-manifest/manifest.json"
          /usr/bin/python3 - "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" "$RUNNER_TEMP/external-manifest/manifest.json" "$TARGET_SHA" "$GITHUB_RUN_ID" "$APP_TARGET_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          input_path, manifest_path, target_sha, run_id, app_target_sha = sys.argv[1:]
          payload = json.loads(Path(input_path).read_text(encoding="utf-8"))
          base_input_keys = {"schema", "confirmation", "target_sha", "control_email", "setup_concurrency", "run_id", "profile", "tournament_count", "users_per_tournament", "timeout_diagnostics"}
          schema = payload.get("schema")
          source_binding = payload.get("source_binding")
          expected_input_keys = base_input_keys | ({"source_binding"} if schema in (2, "2") else set())
          if set(payload) != expected_input_keys or schema not in (1, "1", 2, "2") or payload.get("target_sha") != target_sha or payload.get("run_id") != run_id:
              raise SystemExit("external handoff schema or exact target SHA mismatch")
          manifest = json.loads(Path(manifest_path).read_text(encoding="utf-8"))
          keys = {"schema", "purpose", "origin", "session_cookie_name", "csrf_cookie_name", "marker", "created_at", "tournaments", "users", "runner_sha", "app_target_sha", "source_binding", "source_binding_sha256"}
          if set(manifest) != keys or type(manifest.get("schema")) is not int or manifest.get("schema") != 2 or manifest.get("origin") != "https://old-sparky.com" or re.fullmatch(r"preprod[0-9]{12}[0-9a-f]{4}", str(manifest.get("marker"))) is None:
              raise SystemExit("fixture manifest is not a closed schema")
          if manifest.get("runner_sha") != target_sha or manifest.get("app_target_sha") != app_target_sha or manifest.get("source_binding") != source_binding:
              raise SystemExit("fixture source binding differs from the exact workflow handoff")
          if source_binding is None:
              if schema not in (1, "1") or app_target_sha != target_sha or manifest.get("source_binding_sha256") is not None:
                  raise SystemExit("same-source fixture source binding is invalid")
          else:
              if schema not in (2, "2") or not isinstance(source_binding, dict) or source_binding.get("runner_sha") != target_sha or source_binding.get("app_target_sha") != app_target_sha:
                  raise SystemExit("verified no-op source binding is invalid")
              canonical = json.dumps(source_binding, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("ascii")
              if manifest.get("source_binding_sha256") != hashlib.sha256(canonical).hexdigest():
                  raise SystemExit("fixture source-binding digest does not match")
          if not isinstance(manifest.get("users"), list) or not manifest["users"]:
              raise SystemExit("fixture manifest has no users")
          print("closed external handoff accepted for exact target SHA")
          PY
      - name: Run checked-out external HTTP load client
        id: external-evaluate
        shell: bash
        run: |
          set -u
          artifact_dir="$RUNNER_TEMP/external-client"
          mkdir -p "$artifact_dir"; chmod 700 "$artifact_dir"
          profile_env="$artifact_dir/profile.env"
          IFS=$'\t' read -r SOURCE_BINDING_BASE64 SOURCE_BINDING_SHA256 < <(
            /usr/bin/python3 - "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" "$APP_TARGET_SHA" <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          payload_path, expected_app_sha = sys.argv[1:]
          payload = json.loads(Path(payload_path).read_text(encoding="ascii"))
          if not isinstance(payload, dict) or payload.get("target_sha") != os.environ.get("TARGET_SHA"):
              raise SystemExit("external source handoff runner SHA is invalid")
          binding = payload.get("source_binding")
          if binding is None:
              if expected_app_sha != payload["target_sha"]:
                  raise SystemExit("mismatched app source lacks a verified binding")
              print("-\t-")
          else:
              if not isinstance(binding, dict) or binding.get("runner_sha") != payload["target_sha"] or binding.get("app_target_sha") != expected_app_sha:
                  raise SystemExit("external source handoff binding is inconsistent")
              raw = json.dumps(binding, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("ascii")
              print(base64.b64encode(raw).decode("ascii") + "\t" + hashlib.sha256(raw).hexdigest())
          PY
          )
          [[ "$SOURCE_BINDING_BASE64" == "-" ]] && SOURCE_BINDING_BASE64=""
          [[ "$SOURCE_BINDING_SHA256" == "-" ]] && SOURCE_BINDING_SHA256=""
          run_checked_out_client() {
            env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 SOURCE_GIT_SHA="$SOURCE_GIT_SHA" APP_TARGET_SHA="$APP_TARGET_SHA" SOURCE_BINDING_BASE64="$SOURCE_BINDING_BASE64" SOURCE_BINDING_SHA256="$SOURCE_BINDING_SHA256" GITHUB_RUN_ID="$GITHUB_RUN_ID" "$@"
          }
          load_status=1
          report_ready=0
          if run_checked_out_client /usr/bin/python3 platform/tools/platform_load.py validate --profile "$PROFILE_ID" --dispatchable >/dev/null \
            && run_checked_out_client /usr/bin/python3 platform/tools/platform_load.py export-env --profile "$PROFILE_ID" > "$profile_env"; then
            profile_status=0
          else
            profile_status=$?
          fi
          load_report="$artifact_dir/external-load.json"
          load_log="$artifact_dir/client-raw.log"
          load_args=(/usr/bin/python3 platform/tools/platform_load.py run --profile "$PROFILE_ID" --manifest "$RUNNER_TEMP/external-manifest/manifest.json" --report-path "$load_report")
          if [[ "$TIMEOUT_DIAGNOSTICS" == true ]]; then load_args+=(--timeout-diagnostics-run-id "$GITHUB_RUN_ID"); fi
          if [[ "$TIMEOUT_DIAGNOSTICS" != true ]]; then load_args+=(--defer-pending-origin); fi
          if [[ "$profile_status" == 0 ]]; then
            set +e
            run_checked_out_client "${load_args[@]}" > "$load_log" 2>&1
            load_status="$?"
            set -e
          else
            printf '%s\n' 'load-client profile validation failed' > "$load_log"
          fi
          # A bounded failed measurement is still a closed candidate artifact;
          # the independent finalizer must receive it so fixture cleanup is
          # never coupled to the client exit code.
          if [[ -s "$load_report" ]]; then report_ready=1; fi
          chmod 600 "$load_report" "$load_log" 2>/dev/null || true
          client_exit_status="$load_status"
          candidate_state=failed
          if [[ "$TIMEOUT_DIAGNOSTICS" == true && "$load_status" == 0 ]]; then
            candidate_state=timeout_diagnostics
          elif [[ "$load_status" == 0 ]]; then
            candidate_state=produced
          elif [[ "$TIMEOUT_DIAGNOSTICS" != true && "$load_status" == 3 && "$report_ready" == 1 ]]; then
            candidate_state=pending_origin
            load_status=0
          fi
          if [[ "$TIMEOUT_DIAGNOSTICS" == true ]]; then
            if [[ ! -s "$load_report" ]]; then
              load_status=1
            else
              set +e
              /usr/bin/python3 - "$load_report" "$artifact_dir/timeout-diagnostic-ids.json" "$TARGET_SHA" "$GITHUB_RUN_ID" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = report.get("overall") or report.get("raw_http") or {}
          rows = summary.get("timeout_diagnostics") if isinstance(summary, dict) else []
          ids = sorted({row.get("diagnostic_id") for row in rows or [] if isinstance(row, dict) and isinstance(row.get("diagnostic_id"), str) and re.fullmatch(r"[A-Za-z0-9._:-]{1,128}", row["diagnostic_id"])})
          Path(sys.argv[2]).write_text(json.dumps({
              "schema": 1,
              "target_sha": sys.argv[3],
              "run_id": sys.argv[4],
              "ids": ids,
          }, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
              diagnostic_ids_status="$?"
              set -e
              if [[ "$diagnostic_ids_status" != 0 ]]; then load_status=1; fi
            fi
          else
            printf '%s\n' "{\"schema\":1,\"target_sha\":\"$TARGET_SHA\",\"run_id\":\"$GITHUB_RUN_ID\",\"ids\":[]}" > "$artifact_dir/timeout-diagnostic-ids.json"
          fi
          /usr/bin/python3 - "$artifact_dir/load-status.json" "$load_status" "$client_exit_status" "$candidate_state" "$report_ready" "$TARGET_SHA" "$APP_TARGET_SHA" "$SOURCE_BINDING_SHA256" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PROFILE_ID" "$load_report" "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" <<'PY'
          import json
          import hashlib
          from pathlib import Path
          import sys

          destination, status, client_exit, state, report_ready, target_sha, app_target_sha, binding_sha, run_id, attempt, profile_id, report_path, input_path = sys.argv[1:]
          handoff = json.loads(Path(input_path).read_text(encoding="ascii"))
          source_binding = handoff.get("source_binding")
          report = Path(report_path)
          report_digest = hashlib.sha256(report.read_bytes()).hexdigest() if report_ready == "1" and report.is_file() and not report.is_symlink() else None
          binding_digest = binding_sha or None
          if handoff.get("target_sha") != target_sha or handoff.get("source_binding") != source_binding:
              raise SystemExit("load-status source binding differs from the validated input")
          if (source_binding is None and app_target_sha != target_sha) or (source_binding is not None and (source_binding.get("app_target_sha") != app_target_sha or source_binding.get("runner_sha") != target_sha)):
              raise SystemExit("load-status runner/app SHA binding is inconsistent")
          if source_binding is None:
              if binding_digest is not None:
                  raise SystemExit("same-source load status carries an unexpected source-binding digest")
          else:
              canonical = json.dumps(source_binding, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("ascii")
              if binding_digest != hashlib.sha256(canonical).hexdigest():
                  raise SystemExit("load-status source-binding digest does not match")
          Path(destination).write_text(
              json.dumps(
                  {
                      "schema": 3,
                      "status": int(status),
                      "client_exit_status": int(client_exit),
                      "candidate_state": state,
                      "report_ready": report_ready == "1",
                      "target_sha": target_sha,
                      "runner_sha": target_sha,
                      "app_target_sha": app_target_sha,
                      "source_binding": source_binding,
                      "source_binding_sha256": binding_digest,
                      "run_id": run_id,
                      "run_attempt": attempt,
                      "profile_id": profile_id,
                      "report_sha256": report_digest,
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          chmod 600 "$artifact_dir/load-status.json"
          echo "load_status=$load_status" >> "$GITHUB_OUTPUT"
          echo "candidate_state=$candidate_state" >> "$GITHUB_OUTPUT"
          echo "report_ready=$report_ready" >> "$GITHUB_OUTPUT"
          exit "$load_status"
      - name: Publish candidate load data
        id: publish-candidate
        if: ${{ always() && steps.external-evaluate.outputs.report_ready == '1' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-client/*
          if-no-files-found: error
          retention-days: 1

  # Finalization and cleanup use a new approved runner.  They consume only the
  # exact input and a bounded diagnostic-id list; no candidate script runs in
  # this secret-bearing job.
  namespace-containment-barrier:
    name: Verify closed external-load namespace boundary
    needs:
      - validate-external-inputs
      - fixture-setup
      - load-client
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      namespace_closed_status: ${{ steps.namespace-barrier.outputs.namespace_closed_status }}
      manual_required: ${{ steps.namespace-barrier.outputs.manual_required }}
    steps:
      - name: Download candidate report for closure barrier
        if: ${{ always() && needs.load-client.outputs.candidate_artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-client
      - name: Enforce mandatory namespace closure before finalizer
        id: namespace-barrier
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          status=1
          report="$RUNNER_TEMP/external-client/external-load.json"
          if /usr/bin/python3 - "$report" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          if path.is_symlink() or not path.is_file() or path.stat().st_size <= 0:
              raise SystemExit("candidate report is missing or unsafe")
          payload = json.loads(path.read_text(encoding="utf-8"))
          supervisor = payload.get("runtime_supervisor")
          if (
              not isinstance(payload, dict)
              or payload.get("worker_report_schema") != 2
              or payload.get("report_complete") is not True
              or type(payload.get("namespace_closed")) is not bool
              or payload.get("namespace_closed") is not True
              or not isinstance(supervisor, dict)
              or supervisor.get("isolation") != "pid_namespace"
              or supervisor.get("namespace_closed") is not True
          ):
              raise SystemExit("candidate report does not prove namespace closure")
          PY
          then status=0; fi
          echo "namespace_closed_status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" == 0 ]]; then
            echo 'manual_required=0' >> "$GITHUB_OUTPUT"
            echo 'mandatory namespace closure barrier: PASS'
          else
            echo 'manual_required=1' >> "$GITHUB_OUTPUT"
            echo 'mandatory namespace closure barrier: FAIL; cleanup is blocked and manual emergency handling is required' >&2
          fi
          exit 0

  namespace-containment-manual-barrier:
    name: Expose namespace containment manual barrier
    needs: namespace-containment-barrier
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      manual_required: ${{ steps.manual-barrier.outputs.manual_required }}
    steps:
      - name: Fail visibly when namespace closure is not proven
        id: manual-barrier
        shell: bash
        run: |
          set -u
          required='${{ needs.namespace-containment-barrier.outputs.manual_required }}'
          if [[ "$required" == 0 ]]; then
            echo 'manual_required=0' >> "$GITHUB_OUTPUT"
            echo 'namespace containment manual barrier: clear'
            exit 0
          fi
          echo 'manual_required=1' >> "$GITHUB_OUTPUT"
          echo 'BLOCKED: namespace_closed is missing/false; do not begin or assume fixture cleanup. Follow the emergency/manual retained-fixture abort runbook.' >&2
          exit 1

  cpu-diagnostic-pair:
    name: Run isolated zero-credit authenticated SSR CPU pair
    needs:
      - validate-external-inputs
      - resolve-host-tools-pin
      - fixture-setup
      - load-client
      - namespace-containment-barrier
      - namespace-containment-manual-barrier
    if: >-
      always() &&
      inputs.cpu_diagnostic_pair == true &&
      needs.validate-external-inputs.result == 'success' &&
      needs.resolve-host-tools-pin.result == 'success' &&
      needs.fixture-setup.result == 'success' &&
      needs.fixture-setup.outputs.setup_status == '0' &&
      needs.fixture-setup.outputs.manifest_ready == '1' &&
      needs.namespace-containment-barrier.result == 'success' &&
      needs.namespace-containment-manual-barrier.result == 'success' &&
      needs.namespace-containment-barrier.outputs.namespace_closed_status == '0' &&
      (needs.load-client.result == 'success' || needs.load-client.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      APP_TARGET_SHA: ${{ needs.validate-external-inputs.outputs.app_target_sha }}
      INPUT_ARTIFACT_ID: ${{ needs.validate-external-inputs.outputs.input_artifact_id }}
      MANIFEST_ARTIFACT_ID: ${{ needs.fixture-setup.outputs.manifest_artifact_id }}
    steps:
      - name: Checkout exact diagnostic runner source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact same-run input and fixture manifest
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpu-diagnostic-input
      - name: Download the exact same-run fixture manifest
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpu-diagnostic-manifest

      - name: Check out the bounded handoff files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -f "$RUNNER_TEMP/cpu-diagnostic-input/platform-production-external-load-input.json"
          test ! -L "$RUNNER_TEMP/cpu-diagnostic-input/platform-production-external-load-input.json"
          test -f "$RUNNER_TEMP/cpu-diagnostic-manifest/manifest.json"
          test ! -L "$RUNNER_TEMP/cpu-diagnostic-manifest/manifest.json"
          chmod 600 \
            "$RUNNER_TEMP/cpu-diagnostic-input/platform-production-external-load-input.json" \
            "$RUNNER_TEMP/cpu-diagnostic-manifest/manifest.json"

      - name: Configure pinned production SSH for the trusted parent
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/external-ssh"
          control_path="/tmp/old-sparky-external-load-ssh-cpudiag-$GITHUB_RUN_ID"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
            printf '%s\n' '  ControlMaster auto' '  ControlPersist 15m'
            printf '  ControlPath %s\n' "$control_path"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"

      - name: Run the fixed authenticated workspace CPU pair
        id: cpu-pair
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/cpu-diagnostic-report"
          install -d -m 700 "$report_dir"
          report_path="$report_dir/report.json"
          set +e
          /usr/bin/python3 platform/tools/platform_cpu_diagnostic_pair.py parent \
            --manifest "$RUNNER_TEMP/cpu-diagnostic-manifest/manifest.json" \
            --input-handoff "$RUNNER_TEMP/cpu-diagnostic-input/platform-production-external-load-input.json" \
            --report "$report_path" \
            --source-sha "$TARGET_SHA" \
            --app-target-sha "$APP_TARGET_SHA" \
            --external-run-id "$GITHUB_RUN_ID" \
            --external-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --ssh-config "$RUNNER_TEMP/external-ssh/config" \
            --ssh-key "$RUNNER_TEMP/external-ssh/id_ed25519"
          pair_status="$?"
          set -e
          echo "pair_status=$pair_status" >> "$GITHUB_OUTPUT"
          exit "$pair_status"

      - name: Publish only the bounded diagnostic summary
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-cpu-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpu-diagnostic-report/report.json
          if-no-files-found: warn
          retention-days: 1

      - name: Remove diagnostic SSH material
        if: ${{ always() }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set +e
          ssh_dir="$RUNNER_TEMP/external-ssh"
          control_path="/tmp/old-sparky-external-load-ssh-cpudiag-$GITHUB_RUN_ID"
          cleanup_status=0
          if [[ -L "$control_path" ]]; then
            cleanup_status=1
          elif [[ -S "$control_path" ]]; then
            ssh -F "$ssh_dir/config" -O exit "$PROD_SSH_USER@$PROD_SSH_HOST" >/dev/null 2>&1 \
              || cleanup_status=$?
            [[ ! -e "$control_path" && ! -L "$control_path" ]] || cleanup_status=1
          elif [[ -e "$control_path" ]]; then
            cleanup_status=1
          fi
          if [[ -L "$ssh_dir" ]]; then
            cleanup_status=1
          elif [[ -d "$ssh_dir" ]]; then
            expected_dir_owner="$(id -u):700"
            observed_dir_owner="$(stat -c '%u:%a' -- "$ssh_dir" 2>/dev/null)" \
              || cleanup_status=1
            if [[ "$observed_dir_owner" == "$expected_dir_owner" ]]; then
              rm -rf -- "$ssh_dir" || cleanup_status=$?
            else
              cleanup_status=1
            fi
          elif [[ -e "$ssh_dir" ]]; then
            cleanup_status=1
          fi
          test ! -e "$control_path" && test ! -L "$control_path" || cleanup_status=1
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir" || cleanup_status=1
          if [[ ! -e "$control_path" && ! -L "$control_path" \
              && ! -e "$ssh_dir" && ! -L "$ssh_dir" && "$cleanup_status" == 0 ]]; then
            exit 0
          fi
          exit 1

  fixture-finalize:
    name: Signal fixture completion and collect origin evidence
    needs:
      - validate-external-inputs
      - resolve-host-tools-pin
      - fixture-setup
      - load-client
      - namespace-containment-barrier
      - namespace-containment-manual-barrier
      - cpu-diagnostic-pair
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      remote_status: ${{ steps.external-finalize.outputs.remote_status }}
      observer_ready: ${{ steps.external-finalize.outputs.observer_ready }}
      finalize_status: ${{ steps.external-finalize.outputs.finalize_status }}
      cleanup_status: ${{ steps.cleanup.outputs.cleanup_status }}
      cleanup_remote_ssh_exit_code: ${{ steps.cleanup.outputs.cleanup_remote_ssh_exit_code }}
      cleanup_remote_stage: ${{ steps.cleanup.outputs.cleanup_remote_stage }}
      cleanup_remote_child_exit: ${{ steps.cleanup.outputs.cleanup_remote_child_exit }}
      cleanup_exports_status: ${{ steps.cleanup.outputs.cleanup_exports_status }}
      cleanup_export_status: ${{ steps.cleanup.outputs.cleanup_export_status }}
      ssh_cleanup_status: ${{ steps.cleanup_ssh.outputs.ssh_cleanup_status }}
      cleanup_identity_status: ${{ steps.revalidate-finalizer.outputs.cleanup_identity_status }}
      handoff_status: ${{ steps.revalidate-finalizer.outputs.handoff_status }}
      candidate_artifact_status: ${{ steps.revalidate-finalizer.outputs.candidate_artifact_status }}
      namespace_closed_status: ${{ needs.namespace-containment-barrier.outputs.namespace_closed_status }}
      origin_artifact_id: ${{ steps.publish-origin.outputs.artifact-id }}
    env:
      TARGET_SHA: ${{ github.sha }}
      APP_TARGET_SHA: ${{ needs.validate-external-inputs.outputs.app_target_sha }}
      TIMEOUT_DIAGNOSTICS: ${{ inputs.timeout_diagnostics }}
      INPUT_ARTIFACT_ID: ${{ needs.validate-external-inputs.outputs.input_artifact_id }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.load-client.outputs.candidate_artifact_id }}
      HOST_TOOLS_SHA: ${{ needs.resolve-host-tools-pin.outputs.host_tools_sha }}
    steps:
      - name: Mask and stage the control identity from the event file
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          try:
              descriptor = os.open(
                  os.environ["GITHUB_EVENT_PATH"], os.O_RDONLY | os.O_NOFOLLOW
              )
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or metadata.st_size > 65536
                      or stat.S_IMODE(metadata.st_mode) & 0o022
                  ):
                      raise ValueError
                  raw_event = os.read(descriptor, 65537)
              finally:
                  os.close(descriptor)
              if len(raw_event) > 65536:
                  raise ValueError

              def reject_duplicate_keys(pairs):
                  values = {}
                  for key, value in pairs:
                      if key in values:
                          raise ValueError
                      values[key] = value
                  return values

              event = json.loads(
                  raw_event.decode("utf-8"), object_pairs_hook=reject_duplicate_keys
              )
              if not isinstance(event, dict):
                  raise ValueError
              inputs = event.get("inputs")
              if not isinstance(inputs, dict) or set(inputs) != {
                  "confirmation", "control_email", "profile_id", "timeout_diagnostics", "cpu_diagnostic_pair"
              }:
                  raise ValueError
              email = inputs.get("control_email") if isinstance(inputs, dict) else None
              if not isinstance(email, str) or not email.isascii() or not 3 <= len(email) <= 254 or email != email.strip() or email.count("@") != 1:
                  raise ValueError
              local, domain = email.split("@", 1)
              local_pattern = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9._%+\-]{0,62}[A-Za-z0-9])?$")
              label_pattern = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9\-]{0,61}[A-Za-z0-9])?$")
              labels = domain.split(".")
              if not 1 <= len(local) <= 64 or not 1 <= len(domain) <= 253 or "." not in domain or local_pattern.fullmatch(local) is None or any(label_pattern.fullmatch(label) is None for label in labels):
                  raise ValueError
              if any(ord(character) < 0x21 or ord(character) == 0x7F for character in email):
                  raise ValueError
              canonical_email = email.lower()
              if len(canonical_email) > 254:
                  raise ValueError
          except (OSError, ValueError, TypeError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("control identity input is invalid")
          for value in dict.fromkeys((email, canonical_email)):
              escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              sys.stdout.write(f"::add-mask::{escaped}\n")
          sys.stdout.flush()

          destination = Path(os.environ["RUNNER_TEMP"]) / "platform-production-control-email"
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
          try:
              descriptor = os.open(destination, flags, 0o600)
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or stat.S_IMODE(metadata.st_mode) != 0o600
                  ):
                      raise OSError
                  with os.fdopen(descriptor, "w", encoding="ascii", closefd=False) as handle:
                      handle.write(canonical_email + "\n")
                      handle.flush()
                      os.fsync(handle.fileno())
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or stat.S_IMODE(metadata.st_mode) != 0o600
                  ):
                      raise OSError
              finally:
                  os.close(descriptor)
          except OSError:
              raise SystemExit("control identity handoff could not be created safely")
          PY

      - name: Download exact external-load handoff
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-input
      - name: Download candidate diagnostic data
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-client
      - name: Revalidate finalizer handoffs
        id: revalidate-finalizer
        if: ${{ always() && needs.namespace-containment-barrier.outputs.namespace_closed_status == '0' && needs.namespace-containment-manual-barrier.outputs.manual_required == '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          cleanup_input_path="$RUNNER_TEMP/external-input/platform-production-external-load-cleanup.json"
          candidate_dir="$RUNNER_TEMP/external-client"
          handoff_status=0
          candidate_artifact_status=0
          cleanup_identity_status=1
          install -d -m 700 "$RUNNER_TEMP/external-input"
          # The cleanup identity is deliberately independent of the load and
          # candidate handoffs.  Setup may already have committed a fixture
          # when a later artifact/handoff check fails, so cleanup must still
          # have a machine-validated run/SHA/control-account document.
          if /usr/bin/python3 - "$cleanup_input_path" "$input_path" "$TARGET_SHA" "$APP_TARGET_SHA" "$GITHUB_RUN_ID" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import tempfile

          destination, handoff_path, target_sha, app_target_sha, run_id = sys.argv[1:]
          handoff = json.loads(Path(handoff_path).read_text(encoding="ascii"))
          source_binding = handoff.get("source_binding")
          base_handoff_keys = {"schema", "confirmation", "target_sha", "control_email", "setup_concurrency", "run_id", "profile", "tournament_count", "users_per_tournament", "timeout_diagnostics"}
          if (
              not isinstance(handoff, dict)
              or handoff.get("schema") not in (1, "1", 2, "2")
              or handoff.get("target_sha") != target_sha
              or handoff.get("run_id") != run_id
              or set(handoff) != base_handoff_keys | ({"source_binding"} if source_binding is not None else set())
          ):
              raise SystemExit("cleanup source handoff is not bound to this run")
          if source_binding is None:
              if app_target_sha != target_sha or handoff.get("schema") not in (1, "1"):
                  raise SystemExit("same-source cleanup binding is invalid")
          else:
              expected_binding_keys = {"schema", "binding_mode", "runner_sha", "app_target_sha", "baseline_identity", "receipt_document_sha256", "receipt_artifact_id", "receipt_artifact_name", "receipt_artifact_digest", "receipt_archive_sha256", "cumulative_manifest_sha256", "source_security_run_id", "source_security_run_attempt", "autodeploy_run_id", "autodeploy_run_attempt", "production_deploy_run_id", "production_deploy_run_attempt"}
              if (
                  handoff.get("schema") not in (2, "2")
                  or not isinstance(source_binding, dict)
                  or set(source_binding) != expected_binding_keys
                  or source_binding.get("binding_mode") != "verified-noop"
                  or source_binding.get("runner_sha") != target_sha
                  or source_binding.get("app_target_sha") != app_target_sha
              ):
                  raise SystemExit("cleanup no-op source binding is invalid")
              canonical_binding = json.dumps(source_binding, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("ascii")
              if source_binding.get("baseline_identity", {}).get("source_sha") != app_target_sha or len(canonical_binding) > 16 * 1024:
                  raise SystemExit("cleanup no-op source binding is inconsistent")
          control_email_path = Path(os.environ["RUNNER_TEMP"]) / "platform-production-control-email"
          try:
              control_metadata = control_email_path.lstat()
              if not stat.S_ISREG(control_metadata.st_mode) or stat.S_ISLNK(control_metadata.st_mode) or control_metadata.st_mode & 0o077:
                  raise ValueError
              control_email = control_email_path.read_text(encoding="ascii")
          except (OSError, ValueError):
              raise SystemExit("cleanup control identity is unavailable")
          if not control_email.endswith("\n") or control_email.count("\n") != 1:
              raise SystemExit("cleanup control identity is malformed")
          control_email = control_email[:-1]
          email_local = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9._%+\\-]{0,62}[A-Za-z0-9])?$")
          email_label = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9\\-]{0,61}[A-Za-z0-9])?$")
          if re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("cleanup target SHA is malformed")
          if re.fullmatch(r"[1-9][0-9]{0,31}", run_id) is None:
              raise SystemExit("cleanup run id is malformed")
          if (
              not control_email.isascii()
              or not 3 <= len(control_email) <= 254
              or control_email != control_email.strip()
              or control_email.count("@") != 1
          ):
              raise SystemExit("cleanup control email is malformed")
          local, domain = control_email.split("@", 1)
          labels = domain.split(".")
          if (
              not 1 <= len(local) <= 64
              or not 1 <= len(domain) <= 253
              or "." not in domain
              or email_local.fullmatch(local) is None
              or any(email_label.fullmatch(label) is None for label in labels)
          ):
              raise SystemExit("cleanup control email is malformed")
          payload = {
              "schema": "2" if source_binding is not None else "1",
              "target_sha": target_sha,
              "control_email": control_email.lower(),
              "load_run_id": run_id,
              "cleanup_run_id": run_id,
          }
          if source_binding is not None:
              payload["source_binding"] = source_binding
          destination_path = Path(destination)
          if destination_path.is_symlink() or destination_path.exists():
              raise SystemExit("cleanup identity destination already exists")
          destination_path.parent.mkdir(mode=0o700, exist_ok=True)
          encoded = (json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          descriptor, temporary = tempfile.mkstemp(
              prefix=".external-cleanup-", dir=destination_path.parent
          )
          try:
              os.fchmod(descriptor, 0o600)
              os.write(descriptor, encoded)
              os.fsync(descriptor)
              os.close(descriptor)
              descriptor = -1
              os.replace(temporary, destination_path)
          finally:
              if descriptor >= 0:
                  os.close(descriptor)
              try:
                  os.unlink(temporary)
              except FileNotFoundError:
                  pass
          if destination_path.is_symlink() or destination_path.stat().st_mode & 0o077:
              raise SystemExit("cleanup identity permissions are unsafe")
          PY
          then
            cleanup_identity_status=0
          fi
          verify_artifact() {
            local artifact_id="$1" artifact_name="$2" prefix="$3"
            test -n "$artifact_id" || return 1
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || return 1
            local metadata="$RUNNER_TEMP/${prefix}-metadata.json" archive="$RUNNER_TEMP/${prefix}.zip"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --output "$metadata" || return 1
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$archive" || return 1
            /usr/bin/python3 - "$metadata" "$archive" "$artifact_id" "$artifact_name" "$GITHUB_RUN_ID" "$TARGET_SHA" <<'PY' || return 1
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          metadata_path, archive_path, artifact_id, artifact_name, run_id, target_sha = sys.argv[1:]
          payload = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          if type(payload.get("id")) is not int or payload.get("id") != int(artifact_id) or payload.get("name") != artifact_name or payload.get("expired") is not False:
              raise SystemExit("finalizer artifact metadata is not exact")
          workflow_run = payload.get("workflow_run")
          if not isinstance(workflow_run, dict) or type(workflow_run.get("id")) is not int or workflow_run.get("id") != int(run_id) or workflow_run.get("head_sha") != target_sha:
              raise SystemExit("finalizer artifact is not bound to this run and SHA")
          expected_digest = payload.get("digest")
          if not isinstance(expected_digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest) is None:
              raise SystemExit("finalizer artifact digest metadata is invalid")
          try:
              descriptor = os.open(archive_path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
          except OSError:
              raise SystemExit("finalizer archive is unavailable")
          try:
              if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                  raise SystemExit("finalizer archive is not a regular file")
              with os.fdopen(descriptor, "rb", closefd=False) as archive:
                  digest = hashlib.sha256()
                  while chunk := archive.read(1024 * 1024):
                      digest.update(chunk)
                  actual_digest = digest.hexdigest()
          finally:
              os.close(descriptor)
          if actual_digest != expected_digest.removeprefix("sha256:"):
              raise SystemExit("finalizer archive digest does not match metadata")
          PY
          }
          if [[ ! -s "$input_path" || -L "$input_path" ]]; then
            handoff_status=1
          elif ! verify_artifact "$INPUT_ARTIFACT_ID" "platform-production-external-load-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" external-finalizer-input; then
            handoff_status=1
          fi
          install -d -m 700 "$candidate_dir"
          if [[ -z "$CANDIDATE_ARTIFACT_ID" ]] \
            || ! verify_artifact "$CANDIDATE_ARTIFACT_ID" "platform-production-external-load-client-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" external-finalizer-candidate; then
            candidate_artifact_status=1
          fi
          if [[ "$handoff_status" == 0 ]]; then
            set +e
            /usr/bin/python3 - "$input_path" "$TARGET_SHA" "$APP_TARGET_SHA" "$GITHUB_RUN_ID" "$RUNNER_TEMP/external-client/timeout-diagnostic-ids.json" "$RUNNER_TEMP/external-client/timeout-diagnostic-ids.remote.json" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          path, target_sha, app_target_sha, run_id, ids_path, remote_ids_path = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          base_keys = {"schema", "confirmation", "target_sha", "control_email", "setup_concurrency", "run_id", "profile", "tournament_count", "users_per_tournament", "timeout_diagnostics"}
          binding = payload.get("source_binding")
          expected = base_keys | ({"source_binding"} if binding is not None else set())
          if set(payload) != expected or payload.get("schema") not in (1, "1", 2, "2") or payload.get("target_sha") != target_sha or payload.get("run_id") != run_id:
              raise SystemExit("external finalizer handoff schema or exact target SHA mismatch")
          if binding is None:
              if payload.get("schema") not in (1, "1") or app_target_sha != target_sha:
                  raise SystemExit("same-source finalizer handoff SHA mismatch")
          elif payload.get("schema") not in (2, "2") or not isinstance(binding, dict) or binding.get("runner_sha") != target_sha or binding.get("app_target_sha") != app_target_sha:
              raise SystemExit("finalizer source binding is invalid")
          ids_file = Path(ids_path)
          if ids_file.exists() and ids_file.is_symlink():
              raise SystemExit("diagnostic id handoff must not be a symlink")
          if not ids_file.exists():
              ids_file.write_text(json.dumps({"schema": 1, "target_sha": target_sha, "run_id": run_id, "ids": []}) + "\n", encoding="utf-8")
          ids_payload = json.loads(ids_file.read_text(encoding="utf-8"))
          if set(ids_payload) != {"schema", "target_sha", "run_id", "ids"} or ids_payload.get("schema") != 1 or ids_payload.get("target_sha") != target_sha or ids_payload.get("run_id") != run_id:
              raise SystemExit("diagnostic id handoff schema or exact target SHA is invalid")
          ids = ids_payload.get("ids")
          if not isinstance(ids, list) or len(ids) > 100000 or any(not isinstance(item, str) or re.fullmatch(r"[A-Za-z0-9._:-]{1,128}", item) is None for item in ids):
              raise SystemExit("diagnostic id handoff is not closed")
          Path(remote_ids_path).write_text(json.dumps(ids, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
            handoff_status="$?"
            set -e
          fi
          echo "handoff_status=$handoff_status" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_status=$candidate_artifact_status" >> "$GITHUB_OUTPUT"
          echo "cleanup_identity_status=$cleanup_identity_status" >> "$GITHUB_OUTPUT"
          # This status-bearing step must not prevent the always-run cleanup
          # from executing.  The final gate consumes the explicit status and
          # reports handoff failure only after checking cleanup first.
          exit 0

      - name: Configure finalizer SSH
        if: ${{ always() && needs.namespace-containment-barrier.outputs.namespace_closed_status == '0' && needs.namespace-containment-manual-barrier.outputs.manual_required == '0' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/production-external-load-ssh-finalize"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"; chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          { printf '%s\n' 'Host *' '  StrictHostKeyChecking yes'; printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"; printf '%s\n' '  ControlMaster no' '  ControlPersist no' '  ControlPath none'; } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"; printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Signal fixture completion and collect origin evidence
        id: external-finalize
        if: ${{ always() && needs.namespace-containment-barrier.outputs.namespace_closed_status == '0' && needs.namespace-containment-manual-barrier.outputs.manual_required == '0' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          HANDOFF_STATUS: ${{ steps.revalidate-finalizer.outputs.handoff_status }}
        run: |
          set -u
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          export_dir="/tmp/old-sparky-production-retained-load-$GITHUB_RUN_ID"
          artifact_dir="$RUNNER_TEMP/external-evidence"; mkdir -p "$artifact_dir"; chmod 700 "$artifact_dir"
          remote_status=1; observer_ready=0; finalize_status=1
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0
          retained_load_dispatcher="/opt/oldsparky/platform/shared/host-tools/$HOST_TOOLS_SHA/platform_workflow_remote_dispatch.py"
          ssh_dir="${SSH_DIR:-$RUNNER_TEMP/production-external-load-ssh-finalize}"
          if [[ "$HANDOFF_STATUS" == 0 && -s "$input_path" && -s "$ssh_dir/config" && -s "$ssh_dir/id_ed25519" ]]; then
            if [[ "$TIMEOUT_DIAGNOSTICS" == true ]]; then
              scp -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -i "$ssh_dir/id_ed25519" "$RUNNER_TEMP/external-client/timeout-diagnostic-ids.remote.json" "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/timeout-diagnostic-ids.json" >/dev/null 2>&1 || true
            fi
            set +e
            ssh -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" /usr/bin/python3.12 -I -B "$retained_load_dispatcher" external-finalize < "$input_path" >/dev/null 2>&1
            complete_status="$?"
            set -e
            if [[ "$complete_status" == 0 ]]; then
              deadline=$(( $(date +%s) + 10800 ))
              while (( $(date +%s) < deadline )); do
                if scp -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/matrix-summary.json" "$artifact_dir/matrix-summary.json" >/dev/null 2>&1 \
                  && scp -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/supervisor.exit" "$artifact_dir/supervisor.exit" >/dev/null 2>&1; then
                  remote_status="$(tr -d '[:space:]' < "$artifact_dir/supervisor.exit")"; observer_ready=1; break
                fi
                sleep 2
              done
              for file in canonical.log server-observability.json timeout-diagnostics.json; do
                scp -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/$file" "$artifact_dir/$file" >/dev/null 2>&1 || true
              done
              [[ "$observer_ready" == 1 && "$remote_status" == 0 && -s "$artifact_dir/matrix-summary.json" && -s "$artifact_dir/canonical.log" && -s "$artifact_dir/server-observability.json" ]] && finalize_status=0
            fi
          fi
          echo "remote_status=$remote_status" >> "$GITHUB_OUTPUT"
          echo "observer_ready=$observer_ready" >> "$GITHUB_OUTPUT"
          echo "finalize_status=$finalize_status" >> "$GITHUB_OUTPUT"
          # Keep the finalizer job alive so the explicit cleanup status can be
          # observed and enforced even when completion/observer handoff fails.
          exit 0

      - name: Exact cleanup of external fixture
        id: cleanup
        if: ${{ always() && needs.namespace-containment-barrier.outputs.namespace_closed_status == '0' && needs.namespace-containment-manual-barrier.outputs.manual_required == '0' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          CLEANUP_IDENTITY_STATUS: ${{ steps.revalidate-finalizer.outputs.cleanup_identity_status }}
        run: |
          set -u
          umask 077
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-cleanup.json"
          export_dir="/tmp/old-sparky-production-retained-cleanup-$GITHUB_RUN_ID"
          artifact_dir="$RUNNER_TEMP/external-evidence"
          ssh_dir="${SSH_DIR:-$RUNNER_TEMP/production-external-load-ssh-finalize}"
          cleanup_status=1
          cleanup_remote_ssh_exit_code=255
          cleanup_remote_stage=unknown
          cleanup_remote_child_exit=unknown
          cleanup_exports_status=1
          cleanup_export_status=1
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]] || HOST_TOOLS_SHA=""
          retained_load_dispatcher="/opt/oldsparky/platform/shared/host-tools/$HOST_TOOLS_SHA/platform_workflow_remote_dispatch.py"
          cleanup_artifact_status=1
          summary_copy_status=1
          canonical_copy_status=1
          projection_status=1
          install -d -m 700 "$artifact_dir"
          cleanup_summary="$artifact_dir/cleanup-summary.json"
          cleanup_canonical="$artifact_dir/cleanup-canonical.log"
          ssh_output_file="$artifact_dir/cleanup-ssh-output"

          project_cleanup_summary() {
            local source="$1" destination="$2"
            /usr/bin/python3 - "$source" "$destination" <<'PY'
          import json
          from pathlib import Path
          import sys

          source_path, destination_path = (Path(value) for value in sys.argv[1:])
          fallback = {
              "schema": 1,
              "ok": False,
              "markers": 0,
              "users_deleted": 0,
              "tournaments_deleted": 0,
              "control_account_preserved": False,
              "error_class": "cleanup_summary_invalid",
          }

          def write_fallback() -> None:
              destination_path.write_text(json.dumps(fallback, sort_keys=True) + chr(10), encoding="utf-8")

          try:
              source = json.loads(source_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              write_fallback()
              raise SystemExit("cleanup summary projection input is invalid")
          if not isinstance(source, dict) or source.get("ok") is not True or source.get("control_account_preserved") is not True:
              write_fallback()
              raise SystemExit("cleanup summary projection input is invalid")

          try:
              counts = {}
              for name in ("markers", "users_deleted", "tournaments_deleted"):
                  value = source.get(name)
                  if isinstance(value, bool) or not isinstance(value, int) or not 0 <= value <= 10_000_000:
                      raise ValueError(name)
                  counts[name] = value
              projection = {
                  "schema": 1,
                  "ok": True,
                  **counts,
                  "control_account_preserved": True,
              }
              if "partial_run_root_removed" in source:
                  if not isinstance(source["partial_run_root_removed"], bool):
                      raise ValueError("partial_run_root_removed")
                  projection["partial_run_root_removed"] = source["partial_run_root_removed"]
          except (KeyError, ValueError, TypeError):
              write_fallback()
              raise SystemExit("cleanup summary projection input is invalid")
          destination_path.write_text(json.dumps(projection, sort_keys=True) + chr(10), encoding="utf-8")
          PY
          }

          # The reduced cleanup identity is independently validated from the
          # workflow inputs.  Do not gate this attempt on load/candidate
          # handoff validation: setup may have committed state already.
          if [[ "$CLEANUP_IDENTITY_STATUS" == 0 && -s "$input_path" \
            && -s "$ssh_dir/config" && -s "$ssh_dir/id_ed25519" ]]; then
            set +e
            ssh -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
              /usr/bin/python3.12 -I -B /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py \
              external-cleanup < "$input_path" > "$ssh_output_file" 2>&1
            cleanup_status="$?"
            cleanup_remote_ssh_exit_code="$cleanup_status"
            if [[ -f "$ssh_output_file" && ! -L "$ssh_output_file" ]] \
              && [[ "$(stat -c '%s' -- "$ssh_output_file" 2>/dev/null || echo 999999)" =~ ^[0-9]+$ ]] \
              && (( $(stat -c '%s' -- "$ssh_output_file" 2>/dev/null || echo 999999) <= 512 )); then
              diagnostic_count=0
              while IFS= read -r diagnostic_line; do
                if [[ "$diagnostic_line" =~ ^RETAINED_CLEANUP_DIAGNOSTIC\ schema=1\ stage=(lock|input|identity|release_binding|run_root|external_vote_recovery|orphan_cleanup|matrix_cleanup|export_cleanup|complete|dispatcher|timeout|unknown)\ child_exit=([0-9]{1,3})$ ]]; then
                  diagnostic_count=$((diagnostic_count + 1))
                  if (( diagnostic_count == 1 )); then
                    cleanup_remote_stage="${BASH_REMATCH[1]}"
                    cleanup_remote_child_exit="${BASH_REMATCH[2]}"
                  fi
                fi
              done < "$ssh_output_file"
              if (( diagnostic_count != 1 )); then
                cleanup_remote_stage=unknown
                cleanup_remote_child_exit=unknown
              fi
            fi
            rm -f -- "$ssh_output_file"
            test ! -e "$ssh_output_file"

            # Project the remote result before deleting the private export.
            # A missing, stale, false or malformed summary is a cleanup
            # failure even if the helper returned zero.
            rm -f -- "$cleanup_summary"
            scp -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$ssh_dir/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/cleanup-summary.json" \
              "$cleanup_summary" >/dev/null 2>&1
            summary_copy_status="$?"
            if [[ "$summary_copy_status" == 0 ]]; then
              public_summary="$cleanup_summary.public"
              project_cleanup_summary "$cleanup_summary" "$public_summary"
              projection_status="$?"
              if [[ "$projection_status" == 0 && -s "$public_summary" && ! -L "$public_summary" ]]; then
                chmod 600 "$public_summary"
                mv -- "$public_summary" "$cleanup_summary"
              else
                rm -f -- "$cleanup_summary" "$public_summary"
                printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_summary_invalid"}' > "$cleanup_summary"
                chmod 600 "$cleanup_summary"
              fi
            else
              rm -f -- "$cleanup_summary"
              printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_summary_unavailable"}' > "$cleanup_summary"
              chmod 600 "$cleanup_summary"
            fi

            rm -f -- "$cleanup_canonical"
            scp -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$ssh_dir/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/canonical.log" \
              "$cleanup_canonical" >/dev/null 2>&1
            canonical_copy_status="$?"
            [[ "$canonical_copy_status" == 0 && -s "$cleanup_canonical" ]] || canonical_copy_status=1
            if [[ "$summary_copy_status" == 0 && "$projection_status" == 0 \
              && "$canonical_copy_status" == 0 && -s "$cleanup_summary" ]]; then
              cleanup_artifact_status=0
            fi

            # Always attempt private export deletion after the primary cleanup
            # attempt.  Its status is independent and never hidden.
            ssh -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
              /usr/bin/python3.12 -I -B "$retained_load_dispatcher" \
              external-cleanup-exports < "$input_path" >/dev/null 2>&1
            cleanup_export_status="$?"
            cleanup_exports_status="$cleanup_export_status"
            if [[ "$cleanup_status" == 0 ]] \
              && { [[ "$cleanup_artifact_status" != 0 ]] || [[ "$cleanup_exports_status" != 0 ]]; }; then
              cleanup_status=1
            fi
            if [[ "$cleanup_status" != 0 || "$cleanup_exports_status" != 0 ]]; then
              cleanup_status=1
            fi
            set -e
          fi
          echo "cleanup_status=$cleanup_status" >> "$GITHUB_OUTPUT"
          echo "cleanup_remote_ssh_exit_code=$cleanup_remote_ssh_exit_code" >> "$GITHUB_OUTPUT"
          echo "cleanup_remote_stage=$cleanup_remote_stage" >> "$GITHUB_OUTPUT"
          echo "cleanup_remote_child_exit=$cleanup_remote_child_exit" >> "$GITHUB_OUTPUT"
          echo "cleanup_exports_status=$cleanup_exports_status" >> "$GITHUB_OUTPUT"
          echo "cleanup_export_status=$cleanup_export_status" >> "$GITHUB_OUTPUT"
          printf 'External cleanup diagnostic: ssh_exit=%s stage=%s child_exit=%s\n' \
            "$cleanup_remote_ssh_exit_code" "$cleanup_remote_stage" "$cleanup_remote_child_exit" >> "$GITHUB_STEP_SUMMARY"
          # Keep status-bearing cleanup observable to the final gate.  The
          # gate consumes these explicit values before handoff diagnostics.
          exit 0

      - name: Remove untrusted origin transport logs
        if: ${{ always() && needs.namespace-containment-barrier.outputs.namespace_closed_status == '0' && needs.namespace-containment-manual-barrier.outputs.manual_required == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/external-evidence"
          rm -f -- "$artifact_dir/cleanup-raw.log"
          test ! -e "$artifact_dir/cleanup-raw.log"
          for file in matrix-summary.json canonical.log server-observability.json timeout-diagnostics.json cleanup-summary.json cleanup-canonical.log; do
            if [[ -e "$artifact_dir/$file" ]]; then
              test ! -L "$artifact_dir/$file"
            fi
          done

      - name: Remove finalizer SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_dir="$RUNNER_TEMP/production-external-load-ssh-finalize"
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          cleanup_input_path="$RUNNER_TEMP/external-input/platform-production-external-load-cleanup.json"
          control_email_path="$RUNNER_TEMP/platform-production-control-email"

          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- "$input_path" "$cleanup_input_path" "$control_email_path"
          test ! -e "$input_path" && test ! -L "$input_path"
          test ! -e "$cleanup_input_path" && test ! -L "$cleanup_input_path"
          test ! -e "$control_email_path" && test ! -L "$control_email_path"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"
          printf '%s\n' 'ssh_cleanup_status=0' >> "$GITHUB_OUTPUT"

      - name: Diagnose origin evidence publication gate
        id: diagnose-origin
        if: ${{ always() }}
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          ORIGIN_NAMESPACE_CLOSED: ${{ needs.namespace-containment-barrier.outputs.namespace_closed_status }}
          ORIGIN_MANUAL_REQUIRED: ${{ needs.namespace-containment-manual-barrier.outputs.manual_required }}
          ORIGIN_CLEANUP_SSH_OUTCOME: ${{ steps.cleanup_ssh.outcome }}
          ORIGIN_REMOTE_STATUS: ${{ steps.external-finalize.outputs.remote_status }}
          ORIGIN_OBSERVER_READY: ${{ steps.external-finalize.outputs.observer_ready }}
          ORIGIN_FINALIZE_STATUS: ${{ steps.external-finalize.outputs.finalize_status }}
          ORIGIN_CLEANUP_STATUS: ${{ steps.cleanup.outputs.cleanup_status }}
          ORIGIN_CLEANUP_REMOTE_SSH_EXIT: ${{ steps.cleanup.outputs.cleanup_remote_ssh_exit_code }}
          ORIGIN_CLEANUP_REMOTE_STAGE: ${{ steps.cleanup.outputs.cleanup_remote_stage }}
          ORIGIN_CLEANUP_REMOTE_CHILD_EXIT: ${{ steps.cleanup.outputs.cleanup_remote_child_exit }}
          ORIGIN_CLEANUP_EXPORTS_STATUS: ${{ steps.cleanup.outputs.cleanup_exports_status }}
          ORIGIN_SSH_CLEANUP_STATUS: ${{ steps.cleanup_ssh.outputs.ssh_cleanup_status }}
          ORIGIN_CLEANUP_IDENTITY_STATUS: ${{ steps.revalidate-finalizer.outputs.cleanup_identity_status }}
        run: |
          set +e
          /usr/bin/python3 - <<'PY'
          import os

          def classify(name: str, allowed: dict[str, str]) -> str:
              value = os.environ.get(name)
              if value is None or value == "":
                  return "missing"
              return allowed.get(value, "invalid")

          fields = {
              "namespace": classify("ORIGIN_NAMESPACE_CLOSED", {"0": "closed", "1": "open"}),
              "manual": classify("ORIGIN_MANUAL_REQUIRED", {"0": "none", "1": "required"}),
              "ssh_step": classify(
                  "ORIGIN_CLEANUP_SSH_OUTCOME",
                  {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"},
              ),
              "remote": classify("ORIGIN_REMOTE_STATUS", {"0": "ok", "1": "failed"}),
              "observer": classify("ORIGIN_OBSERVER_READY", {"0": "not_ready", "1": "ready"}),
              "finalize": classify("ORIGIN_FINALIZE_STATUS", {"0": "ok", "1": "failed"}),
              "cleanup": classify("ORIGIN_CLEANUP_STATUS", {"0": "ok", "1": "failed"}),
              "cleanup_ssh_exit": classify(
                  "ORIGIN_CLEANUP_REMOTE_SSH_EXIT",
                  {str(value): str(value) for value in range(256)},
              ),
              "cleanup_stage": classify(
                  "ORIGIN_CLEANUP_REMOTE_STAGE",
                  {
                      "lock": "lock", "input": "input", "identity": "identity",
                      "release_binding": "release_binding", "run_root": "run_root",
                      "external_vote_recovery": "external_vote_recovery",
                      "orphan_cleanup": "orphan_cleanup", "matrix_cleanup": "matrix_cleanup",
                      "export_cleanup": "export_cleanup", "complete": "complete",
                      "dispatcher": "dispatcher", "timeout": "timeout", "unknown": "unknown",
                  },
              ),
              "cleanup_child_exit": classify(
                  "ORIGIN_CLEANUP_REMOTE_CHILD_EXIT",
                  {str(value): str(value) for value in range(256)},
              ),
              "exports": classify("ORIGIN_CLEANUP_EXPORTS_STATUS", {"0": "ok", "1": "failed"}),
              "ssh_cleanup": classify("ORIGIN_SSH_CLEANUP_STATUS", {"0": "ok", "1": "failed"}),
              "identity": classify("ORIGIN_CLEANUP_IDENTITY_STATUS", {"0": "ok", "1": "failed"}),
          }
          explicit_conditions_met = all(
              fields[name] == expected
              for name, expected in (
                  ("namespace", "closed"),
                  ("manual", "none"),
                  ("ssh_step", "ok"),
                  ("remote", "ok"),
                  ("observer", "ready"),
                  ("finalize", "ok"),
                  ("cleanup", "ok"),
                  ("cleanup_ssh_exit", "0"),
                  ("cleanup_stage", "complete"),
                  ("cleanup_child_exit", "0"),
                  ("exports", "ok"),
                  ("ssh_cleanup", "ok"),
                  ("identity", "ok"),
              )
          )
          summary = " ".join(f"{name}={value}" for name, value in fields.items())
          explicit_value = "yes" if explicit_conditions_met else "no"
          print(
              "ORIGIN_PUBLISH_GATE "
              f"{summary} explicit_conditions_met={explicit_value}"
          )
          if os.environ.get("RUNNER_TEMP") and os.environ.get("GITHUB_OUTPUT"):
              import json
              import os
              import stat
              from pathlib import Path

              evidence_root = Path(os.environ["RUNNER_TEMP"]) / "external-evidence"
              try:
                  os.mkdir(evidence_root, 0o700)
              except FileExistsError:
                  pass
              root_stat = evidence_root.lstat()
              if (
                  not stat.S_ISDIR(root_stat.st_mode)
                  or root_stat.st_uid != os.geteuid()
                  or root_stat.st_mode & 0o077
              ):
                  raise RuntimeError("cleanup diagnostic directory is unsafe")
              diagnostic_path = evidence_root / "cleanup-diagnostic.json"
              payload = json.dumps(
                  {"schema": 1, "conditions": fields, "explicit_conditions_met": explicit_value},
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("ascii") + b"\n"
              descriptor = os.open(
                  diagnostic_path,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                  0o600,
              )
              try:
                  file_stat = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(file_stat.st_mode)
                      or file_stat.st_uid != os.geteuid()
                      or file_stat.st_nlink != 1
                      or file_stat.st_mode & 0o077
                  ):
                      raise RuntimeError("cleanup diagnostic file is unsafe")
                  with os.fdopen(descriptor, "wb", closefd=False) as output:
                      output.write(payload)
                      output.flush()
                      os.fsync(output.fileno())
              finally:
                  os.close(descriptor)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="ascii") as output:
                  output.write(f"explicit_conditions_met={explicit_value}\n")
          PY
          diagnostic_status="$?"
          if [[ "$diagnostic_status" != 0 ]]; then
            printf '%s\n' 'ORIGIN_PUBLISH_GATE diagnostic=unavailable'
          fi
          exit 0

      - name: Publish origin evidence
        id: publish-origin
        if: ${{ always() && needs.namespace-containment-barrier.outputs.namespace_closed_status == '0' && needs.namespace-containment-manual-barrier.outputs.manual_required == '0' && steps.cleanup_ssh.outcome == 'success' && steps.external-finalize.outputs.remote_status == '0' && steps.external-finalize.outputs.observer_ready == '1' && steps.external-finalize.outputs.finalize_status == '0' && steps.cleanup.outputs.cleanup_status == '0' && steps.cleanup.outputs.cleanup_remote_ssh_exit_code == '0' && steps.cleanup.outputs.cleanup_remote_stage == 'complete' && steps.cleanup.outputs.cleanup_remote_child_exit == '0' && steps.cleanup.outputs.cleanup_exports_status == '0' && steps.cleanup_ssh.outputs.ssh_cleanup_status != '' && steps.cleanup_ssh.outputs.ssh_cleanup_status == '0' && steps.revalidate-finalizer.outputs.cleanup_identity_status == '0' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-origin-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/external-evidence/matrix-summary.json
            ${{ runner.temp }}/external-evidence/canonical.log
            ${{ runner.temp }}/external-evidence/server-observability.json
            ${{ runner.temp }}/external-evidence/timeout-diagnostics.json
            ${{ runner.temp }}/external-evidence/cleanup-summary.json
            ${{ runner.temp }}/external-evidence/cleanup-canonical.log
          if-no-files-found: error
          retention-days: 1

      - name: Publish closed cleanup failure diagnostic
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' && steps.diagnose-origin.outcome == 'success' && steps.diagnose-origin.outputs.explicit_conditions_met == 'no' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-cleanup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-evidence/cleanup-diagnostic.json
          if-no-files-found: error
          retention-days: 1

  # Evaluation/sanitization happens on another secret-free checkout runner.
  evaluate-load:
    name: Evaluate checked-out load report
    needs:
      - validate-external-inputs
      - fixture-setup
      - fixture-finalize
      - load-client
      - namespace-containment-barrier
      - namespace-containment-manual-barrier
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      PROFILE_ID: ${{ inputs.profile_id }}
      TIMEOUT_DIAGNOSTICS: ${{ inputs.timeout_diagnostics }}
      SOURCE_GIT_SHA: ${{ github.sha }}
      APP_TARGET_SHA: ${{ needs.validate-external-inputs.outputs.app_target_sha }}
      INPUT_ARTIFACT_ID: ${{ needs.validate-external-inputs.outputs.input_artifact_id }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.load-client.outputs.candidate_artifact_id }}
      ORIGIN_ARTIFACT_ID: ${{ needs.fixture-finalize.outputs.origin_artifact_id }}
    steps:
      - name: Checkout reviewed load evaluator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require the exact checked-out evaluator SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_GIT_SHA"
      - name: Download candidate load data
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-client
      - name: Download exact source-binding handoff
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-input
      - name: Download fixed origin evidence
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-origin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-evidence
      - name: Verify evaluator artifact identity and digest
        id: verify-evaluator-artifacts
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          verify_artifact() {
            local artifact_id="$1" artifact_name="$2" prefix="$3"
            test -n "$artifact_id" || return 1
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || return 1
            local metadata="$RUNNER_TEMP/${prefix}-metadata.json" archive="$RUNNER_TEMP/${prefix}.zip"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --output "$metadata" || return 1
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$archive" || return 1
            /usr/bin/python3 - "$metadata" "$archive" "$artifact_id" "$artifact_name" "$GITHUB_RUN_ID" "$SOURCE_GIT_SHA" <<'PY' || return 1
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          metadata_path, archive_path, artifact_id, artifact_name, run_id, target_sha = sys.argv[1:]
          payload = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          if type(payload.get("id")) is not int or payload.get("id") != int(artifact_id) or payload.get("name") != artifact_name or payload.get("expired") is not False:
              raise SystemExit("evaluator artifact metadata is not exact")
          workflow_run = payload.get("workflow_run")
          if not isinstance(workflow_run, dict) or type(workflow_run.get("id")) is not int or workflow_run.get("id") != int(run_id) or workflow_run.get("head_sha") != target_sha:
              raise SystemExit("evaluator artifact is not bound to this run and SHA")
          expected_digest = payload.get("digest")
          if not isinstance(expected_digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", expected_digest) is None:
              raise SystemExit("evaluator artifact digest metadata is invalid")
          try:
              descriptor = os.open(archive_path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
          except OSError:
              raise SystemExit("evaluator archive is unavailable")
          try:
              if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                  raise SystemExit("evaluator archive is not a regular file")
              with os.fdopen(descriptor, "rb", closefd=False) as archive:
                  digest = hashlib.sha256()
                  while chunk := archive.read(1024 * 1024):
                      digest.update(chunk)
                  actual_digest = digest.hexdigest()
          finally:
              os.close(descriptor)
          if actual_digest != expected_digest.removeprefix("sha256:"):
              raise SystemExit("evaluator archive digest does not match metadata")
          PY
          }
          candidate_status=0
          origin_status=0
          input_status=0
          verify_artifact "$INPUT_ARTIFACT_ID" "platform-production-external-load-input-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" evaluator-input || input_status=1
          verify_artifact "$CANDIDATE_ARTIFACT_ID" "platform-production-external-load-client-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" evaluator-candidate || candidate_status=1
          verify_artifact "$ORIGIN_ARTIFACT_ID" "platform-production-external-load-origin-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" evaluator-origin || origin_status=1
          echo "candidate_artifact_status=$candidate_status" >> "$GITHUB_OUTPUT"
          echo "origin_artifact_status=$origin_status" >> "$GITHUB_OUTPUT"
          echo "input_artifact_status=$input_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Evaluate checked-out load report
        id: evaluate-load
        shell: bash
        run: |
          set -u
          report="$RUNNER_TEMP/external-client/external-load.json"
          load_status_file="$RUNNER_TEMP/external-client/load-status.json"
          observer="$RUNNER_TEMP/external-evidence/server-observability.json"
          source_input="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          if [[ -s "$source_input" && ! -L "$source_input" ]]; then
            IFS=$'\t' read -r SOURCE_BINDING_BASE64 SOURCE_BINDING_SHA256 < <(
              /usr/bin/python3 - "$source_input" "$SOURCE_GIT_SHA" "$APP_TARGET_SHA" <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          import sys
          path, runner_sha, app_sha = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="ascii"))
          if not isinstance(payload, dict) or payload.get("target_sha") != runner_sha:
              raise SystemExit("evaluator source handoff runner SHA is invalid")
          binding = payload.get("source_binding")
          if binding is None:
              if app_sha != runner_sha:
                  raise SystemExit("evaluator source handoff is missing a no-op binding")
              print("-\t-")
          else:
              if not isinstance(binding, dict) or binding.get("runner_sha") != runner_sha or binding.get("app_target_sha") != app_sha:
                  raise SystemExit("evaluator source handoff binding is invalid")
              raw = json.dumps(binding, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("ascii")
              print(base64.b64encode(raw).decode("ascii") + "\t" + hashlib.sha256(raw).hexdigest())
          PY
            )
            [[ "$SOURCE_BINDING_BASE64" == "-" ]] && SOURCE_BINDING_BASE64=""
            [[ "$SOURCE_BINDING_SHA256" == "-" ]] && SOURCE_BINDING_SHA256=""
            export SOURCE_BINDING_BASE64 SOURCE_BINDING_SHA256
          else
            echo "source-binding handoff is unavailable to the evaluator" >&2
            exit 1
          fi
          status=1
          acceptance_status=invalid
          upstream_ready=0
          failed_worker_report_ready=0
          if [[ "${{ needs.validate-external-inputs.result }}" == success \
            && "${{ needs.fixture-setup.result }}" == success \
            && "${{ needs.fixture-setup.outputs.setup_status }}" == 0 \
            && "${{ needs.fixture-setup.outputs.ssh_cleanup_status }}" == 0 \
            && "${{ needs.load-client.outputs.report_ready }}" == 1 \
            && "${{ needs.namespace-containment-barrier.result }}" == success \
            && "${{ needs.namespace-containment-barrier.outputs.namespace_closed_status }}" == 0 \
            && "${{ needs.namespace-containment-manual-barrier.result }}" == success \
            && "${{ needs.namespace-containment-manual-barrier.outputs.manual_required }}" == 0 \
            && "${{ needs.fixture-finalize.result }}" == success \
            && "${{ needs.fixture-finalize.outputs.remote_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.observer_ready }}" == 1 \
            && "${{ needs.fixture-finalize.outputs.finalize_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.cleanup_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.cleanup_exports_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.ssh_cleanup_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.cleanup_identity_status }}" == 0 \
            && "${{ steps.verify-evaluator-artifacts.outputs.candidate_artifact_status }}" == 0 \
            && "${{ steps.verify-evaluator-artifacts.outputs.origin_artifact_status }}" == 0 \
            && "${{ steps.verify-evaluator-artifacts.outputs.input_artifact_status }}" == 0 \
            && -s "$report" && -s "$load_status_file" && -s "$observer" ]]; then
          validation_kind="$(/usr/bin/python3 - "$load_status_file" "$report" "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" "$SOURCE_GIT_SHA" "$APP_TARGET_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PROFILE_ID" "$TIMEOUT_DIAGNOSTICS" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys

          class DuplicateKey(ValueError):
              pass
          def closed_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise DuplicateKey("duplicate receipt field")
                  result[key] = value
              return result

          path, report_path, input_path, target_sha, app_target_sha, run_id, attempt, profile_id, timeout_diagnostics = sys.argv[1:]
          receipt_path = Path(path)
          report_file = Path(report_path)
          receipt_stat = receipt_path.lstat()
          report_stat = report_file.lstat()
          if not os.path.isfile(receipt_path) or receipt_path.is_symlink() or not os.path.isfile(report_file) or report_file.is_symlink():
              raise SystemExit("candidate receipt or report is not a regular file")
          if receipt_stat.st_nlink != 1 or report_stat.st_nlink != 1:
              raise SystemExit("candidate receipt or report link count is invalid")
          payload = json.loads(receipt_path.read_text(encoding="utf-8"), object_pairs_hook=closed_object)
          input_payload = json.loads(Path(input_path).read_text(encoding="ascii"), object_pairs_hook=closed_object)
          binding = input_payload.get("source_binding")
          binding_digest = None
          if binding is not None:
              canonical_binding = json.dumps(binding, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")).encode("ascii")
              binding_digest = hashlib.sha256(canonical_binding).hexdigest()
          expected = {"schema", "status", "client_exit_status", "candidate_state", "report_ready", "target_sha", "runner_sha", "app_target_sha", "source_binding", "source_binding_sha256", "run_id", "run_attempt", "profile_id", "report_sha256"}
          if (
              not isinstance(payload, dict)
              or set(payload) != expected
              or type(payload.get("schema")) is not int or payload.get("schema") != 3
              or type(payload.get("status")) is not int or payload.get("status") != 0
              or type(payload.get("client_exit_status")) is not int
              or payload.get("report_ready") is not True
              or payload.get("target_sha") != target_sha
              or payload.get("runner_sha") != target_sha
              or payload.get("app_target_sha") != app_target_sha
              or payload.get("source_binding") != binding
              or payload.get("source_binding_sha256") != binding_digest
              or input_payload.get("target_sha") != target_sha
              or payload.get("run_id") != run_id
              or payload.get("run_attempt") != attempt
              or payload.get("profile_id") != profile_id
              or not isinstance(payload.get("report_sha256"), str)
              or re.fullmatch(r"[0-9a-f]{64}", payload["report_sha256"]) is None
          ):
              raise SystemExit("authoritative load-status is not bound to this run")
          if hashlib.sha256(report_file.read_bytes()).hexdigest() != payload["report_sha256"]:
              raise SystemExit("candidate report digest does not match its receipt")
          report_payload = json.loads(report_file.read_text(encoding="utf-8"), object_pairs_hook=closed_object)
          if not isinstance(report_payload, dict):
              raise SystemExit("candidate report is not a closed object")
          if (
              report_payload.get("source_git_sha") != target_sha
              or report_payload.get("app_target_sha") != app_target_sha
              or report_payload.get("source_binding") != binding
              or report_payload.get("source_binding_sha256") != binding_digest
          ):
              raise SystemExit("candidate report runner/app source binding is inconsistent")
          state, raw_status = payload["candidate_state"], payload["client_exit_status"]
          worker_failure = report_payload.get("worker_failure")
          worker_failure_keys = {
              "schema", "stage", "exception_class", "module", "line", "traceback_truncated"
          }
          valid_worker_failure = (
              isinstance(worker_failure, dict)
              and set(worker_failure) == worker_failure_keys
              and type(worker_failure.get("schema")) is int
              and worker_failure.get("schema") == 1
              and isinstance(worker_failure.get("stage"), str)
              and worker_failure.get("stage") in {
                  "worker_config_read", "worker_config_validate",
                  "worker_identity", "worker_callback", "worker_report_write", "other"
              }
              and isinstance(worker_failure.get("exception_class"), str)
              and worker_failure.get("exception_class") in {
                  "assertion_error", "json_decode_error", "key_error",
                  "namespace_integrity_error", "os_error", "other", "overflow_error",
                  "runtime_error", "timeout_error", "type_error", "unicode_decode_error",
                  "value_error"
              }
              and isinstance(worker_failure.get("module"), str)
              and worker_failure.get("module") in {
                  "external_load", "load", "load_acceptance", "load_runtime", "load_worker", "other"
              }
              and type(worker_failure.get("traceback_truncated")) is bool
              and (
                  worker_failure.get("line") is None
                  or (type(worker_failure.get("line")) is int and 1 <= worker_failure["line"] <= 1000000)
              )
              and not (
                  worker_failure.get("module") == "other" and worker_failure.get("line") is not None
              )
              and not (
                  worker_failure.get("module") != "other" and worker_failure.get("line") is None
              )
              and not (
                  worker_failure.get("traceback_truncated") is True
                  and (worker_failure.get("module") != "other" or worker_failure.get("line") is not None)
              )
          )
          supervisor = report_payload.get("runtime_supervisor")
          valid_failed_worker = (
              state == "failed"
              and raw_status == 1
              and timeout_diagnostics == "false"
              and report_payload.get("worker_report_schema") == 2
              and report_payload.get("report_complete") is True
              and report_payload.get("passed") is False
              and report_payload.get("authoritative") is False
              and report_payload.get("dispatchable") is False
              and report_payload.get("namespace_closed") is True
              and report_payload.get("partial_work") is True
              and report_payload.get("inflight_unknown") is True
              and report_payload.get("isolation") == "pid_namespace"
              and isinstance(report_payload.get("acceptance"), dict)
              and report_payload["acceptance"].get("passed") is False
              and report_payload["acceptance"].get("contract_ok") is False
              and report_payload["acceptance"].get("decision") == "LOAD RUN FAILED"
              and isinstance(supervisor, dict)
              and type(supervisor.get("protocol")) is int
              and supervisor.get("protocol") == 1
              and supervisor.get("isolation") == "pid_namespace"
              and supervisor.get("reason") == "none"
              and supervisor.get("signal") is None
              and supervisor.get("namespace_closed") is True
              and supervisor.get("descendants_reaped") is True
              and type(supervisor.get("returncode")) is int
              and supervisor.get("returncode") == 1
              and supervisor.get("partial_work") is True
              and supervisor.get("inflight_unknown") is True
              and supervisor.get("report_error") is None
              and valid_worker_failure
          )
          valid_state = (
              (state == "pending_origin" and raw_status == 3 and timeout_diagnostics == "false")
              or (state == "produced" and raw_status == 0 and timeout_diagnostics == "false")
              or (state == "timeout_diagnostics" and raw_status == 0 and timeout_diagnostics == "true")
          )
          if valid_failed_worker:
              print("worker_failure")
          elif valid_state:
              print("normal")
          else:
              raise SystemExit("authoritative load-status is not bound to this run")
          PY
          )" || validation_kind=""
          case "$validation_kind" in
            normal) upstream_ready=1 ;;
            worker_failure) failed_worker_report_ready=1 ;;
            *) ;;
          esac
          fi
          if [[ "$upstream_ready" == 1 ]]; then
            set +e
            if [[ "$TIMEOUT_DIAGNOSTICS" == true ]]; then
              /usr/bin/python3 platform/tools/platform_timeout_diagnostics.py --client-report "$report" --server-observability "$observer" --output "$RUNNER_TEMP/external-evidence/timeout-diagnostics.json"
              status="$?"
            else
              /usr/bin/python3 platform/tools/platform_load.py evaluate --profile "$PROFILE_ID" --report "$report" --server-observability "$observer" --defer-completed-slo-failure
              status="$?"
            fi
            set -e
            if [[ "$TIMEOUT_DIAGNOSTICS" == true && "$status" == 0 ]]; then
              acceptance_status=diagnostic_complete
            elif [[ "$TIMEOUT_DIAGNOSTICS" != true && "$status" == 0 ]]; then
              acceptance_status=accepted
            elif [[ "$TIMEOUT_DIAGNOSTICS" != true && "$status" == 3 ]]; then
              status=0
              acceptance_status=slo_failed
            fi
          fi
          if [[ "$upstream_ready" != 1 ]]; then acceptance_status=invalid; fi
          echo "evaluation_status=$status" >> "$GITHUB_OUTPUT"
          echo "acceptance_status=$acceptance_status" >> "$GITHUB_OUTPUT"
          echo "failed_worker_report_ready=$failed_worker_report_ready" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Sanitize external evidence
        id: sanitize
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          public_dir="$RUNNER_TEMP/external-public"
          install -d -m 700 "$public_dir"
          sanitizer_status=0
          # Closed artifact schemas: --artifact-type external_load,
          # --artifact-type server_observability,
          # --artifact-type timeout_diagnostics.
          sanitize_json() {
            local source="$1" destination="$2" artifact_type="$3"
            if [[ ! -s "$source" || -L "$source" ]]; then sanitizer_status=1; return; fi
            /usr/bin/python3 platform/tools/platform_evidence_sanitizer.py \
              --json --artifact-type "$artifact_type" --input "$source" --output "$destination"
            local status="$?"
            if [[ "$status" != 0 || ! -s "$destination" || -L "$destination" ]]; then sanitizer_status=1; fi
          }
          sanitize_log() {
            local source="$1" destination="$2"
            if [[ ! -s "$source" || -L "$source" ]]; then sanitizer_status=1; return; fi
            /usr/bin/python3 platform/tools/platform_evidence_sanitizer.py \
              --input "$source" --output "$destination"
            local status="$?"
            if [[ "$status" != 0 || ! -s "$destination" || -L "$destination" ]]; then sanitizer_status=1; fi
          }
          sanitize_json "$RUNNER_TEMP/external-client/external-load.json" "$public_dir/external-load.json" external_load
          sanitize_json "$RUNNER_TEMP/external-evidence/server-observability.json" "$public_dir/server-observability.json" server_observability
          if [[ "$TIMEOUT_DIAGNOSTICS" == true ]]; then
            sanitize_json "$RUNNER_TEMP/external-evidence/timeout-diagnostics.json" "$public_dir/timeout-diagnostics.json" timeout_diagnostics
          else
            printf '%s\n' '{"schema":1,"enabled":false,"public_projection":true,"authoritative":false}' > "$public_dir/timeout-diagnostics.json"
          fi
          sanitize_log "$RUNNER_TEMP/external-client/client-raw.log" "$public_dir/client-raw.log"
          sanitize_log "$RUNNER_TEMP/external-evidence/canonical.log" "$public_dir/canonical.log"
          sanitize_log "$RUNNER_TEMP/external-evidence/cleanup-canonical.log" "$public_dir/cleanup-canonical.log"
          /usr/bin/python3 - "$RUNNER_TEMP/external-evidence/matrix-summary.json" "$RUNNER_TEMP/external-evidence/cleanup-summary.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          matrix_path, cleanup_path = (Path(value) for value in sys.argv[1:])
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          cleanup = json.loads(cleanup_path.read_text(encoding="utf-8"))
          if not isinstance(matrix, dict) or matrix.get("passed") is not True:
              raise SystemExit("matrix summary is not a passing closed record")
          if not isinstance(cleanup, dict) or cleanup.get("ok") is not True:
              raise SystemExit("cleanup summary is not a passing closed record")
          PY
          if [[ "$?" != 0 ]]; then sanitizer_status=1; fi
          rm -f -- \
            "$RUNNER_TEMP/external-client/external-load.json" \
            "$RUNNER_TEMP/external-client/client-raw.log" \
            "$RUNNER_TEMP/external-evidence/server-observability.json" \
            "$RUNNER_TEMP/external-evidence/timeout-diagnostics.json" \
            "$RUNNER_TEMP/external-evidence/canonical.log" \
            "$RUNNER_TEMP/external-evidence/cleanup-canonical.log"
          mv -- "$public_dir/external-load.json" "$RUNNER_TEMP/external-client/external-load.json"
          mv -- "$public_dir/client-raw.log" "$RUNNER_TEMP/external-client/client-raw.log"
          mv -- "$public_dir/server-observability.json" "$RUNNER_TEMP/external-evidence/server-observability.json"
          mv -- "$public_dir/timeout-diagnostics.json" "$RUNNER_TEMP/external-evidence/timeout-diagnostics.json"
          mv -- "$public_dir/canonical.log" "$RUNNER_TEMP/external-evidence/canonical.log"
          mv -- "$public_dir/cleanup-canonical.log" "$RUNNER_TEMP/external-evidence/cleanup-canonical.log"
          rm -rf -- "$public_dir"
          test ! -e "$public_dir"
          echo "sanitizer_status=$sanitizer_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish external load evidence
        if: >-
          success() &&
          needs.validate-external-inputs.result == 'success' &&
          needs.fixture-setup.result == 'success' &&
          needs.fixture-setup.outputs.setup_status == '0' &&
          needs.fixture-setup.outputs.ssh_cleanup_status != '' &&
          needs.fixture-setup.outputs.ssh_cleanup_status == '0' &&
          needs.load-client.result == 'success' &&
          needs.load-client.outputs.report_ready == '1' &&
          needs.namespace-containment-barrier.result == 'success' &&
          needs.namespace-containment-barrier.outputs.namespace_closed_status == '0' &&
          needs.namespace-containment-manual-barrier.result == 'success' &&
          needs.namespace-containment-manual-barrier.outputs.manual_required == '0' &&
          needs.fixture-finalize.result == 'success' &&
          needs.fixture-finalize.outputs.remote_status == '0' &&
          needs.fixture-finalize.outputs.observer_ready == '1' &&
          needs.fixture-finalize.outputs.finalize_status == '0' &&
          needs.fixture-finalize.outputs.cleanup_status == '0' &&
          needs.fixture-finalize.outputs.cleanup_exports_status == '0' &&
          needs.fixture-finalize.outputs.ssh_cleanup_status != '' &&
          needs.fixture-finalize.outputs.ssh_cleanup_status == '0' &&
          needs.fixture-finalize.outputs.cleanup_identity_status == '0' &&
          steps.verify-evaluator-artifacts.outputs.candidate_artifact_status == '0' &&
          steps.verify-evaluator-artifacts.outputs.origin_artifact_status == '0' &&
          (
            (
              steps.evaluate-load.outputs.evaluation_status == '0' &&
              (steps.evaluate-load.outputs.acceptance_status == 'accepted' || steps.evaluate-load.outputs.acceptance_status == 'slo_failed' || steps.evaluate-load.outputs.acceptance_status == 'diagnostic_complete')
            ) ||
            steps.evaluate-load.outputs.failed_worker_report_ready == '1'
          ) &&
          steps.sanitize.outputs.sanitizer_status == '0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/external-client/external-load.json
            ${{ runner.temp }}/external-evidence/matrix-summary.json
            ${{ runner.temp }}/external-evidence/canonical.log
            ${{ runner.temp }}/external-evidence/server-observability.json
            ${{ runner.temp }}/external-evidence/timeout-diagnostics.json
            ${{ runner.temp }}/external-evidence/cleanup-summary.json
            ${{ runner.temp }}/external-evidence/cleanup-canonical.log
            ${{ runner.temp }}/external-client/client-raw.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce external load and exact cleanup gates
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.validate-external-inputs.result }}" = success || { echo "External-load dispatch validation failed." >&2; exit 1; }
          test "${{ needs.fixture-setup.result }}" = success || { echo "External fixture setup job failed." >&2; exit 1; }
          test "${{ needs.fixture-setup.outputs.setup_status }}" = 0 || { echo "External fixture setup status failed." >&2; exit 1; }
          test "${{ needs.fixture-setup.outputs.ssh_cleanup_status }}" = 0 || { echo "Fixture-setup SSH cleanup failed." >&2; exit 1; }
          test "${{ needs.load-client.result }}" = success || { echo "External load-client job failed." >&2; exit 1; }
          test "${{ needs.load-client.outputs.load_status }}" = 0 || { echo "Authoritative external load-status failed." >&2; exit 1; }
          candidate_state="${{ needs.load-client.outputs.candidate_state }}"
          case "$candidate_state" in produced|pending_origin|timeout_diagnostics) ;; *) echo "Candidate-production state is invalid." >&2; exit 1 ;; esac
          test "${{ needs.load-client.outputs.report_ready }}" = 1 || { echo "External load report is missing." >&2; exit 1; }
          test "${{ needs.namespace-containment-barrier.result }}" = success || { echo "Namespace containment barrier job failed." >&2; exit 1; }
          test "${{ needs.namespace-containment-barrier.outputs.namespace_closed_status }}" = 0 || { echo "namespace_closed is not proven; cleanup is blocked and manual emergency handling is required." >&2; exit 1; }
          test "${{ needs.namespace-containment-manual-barrier.result }}" = success || { echo "Namespace containment manual barrier is active." >&2; exit 1; }
          test "${{ needs.namespace-containment-manual-barrier.outputs.manual_required }}" = 0 || { echo "Namespace containment manual barrier requires operator action." >&2; exit 1; }
          test "${{ needs.fixture-finalize.result }}" = success || { echo "External fixture-finalize job failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.remote_status }}" = 0 || { echo "Origin external-load supervisor failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.observer_ready }}" = 1 || { echo "Origin observer barrier was not reached." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.finalize_status }}" = 0 || { echo "External fixture finalization failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.cleanup_status }}" = 0 || { echo "Exact external-load cleanup failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.cleanup_exports_status }}" = 0 || { echo "External-load private export cleanup failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.ssh_cleanup_status }}" = 0 || { echo "Finalizer SSH cleanup failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.cleanup_identity_status }}" = 0 || { echo "Cleanup identity validation failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.handoff_status }}" = 0 || { echo "Finalizer handoff validation failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.candidate_artifact_status }}" = 0 || { echo "Candidate load artifact identity/digest failed." >&2; exit 1; }
          test "${{ steps.verify-evaluator-artifacts.outputs.candidate_artifact_status }}" = 0 || { echo "Evaluator candidate artifact identity/digest failed." >&2; exit 1; }
          test "${{ steps.verify-evaluator-artifacts.outputs.origin_artifact_status }}" = 0 || { echo "Evaluator origin artifact identity/digest failed." >&2; exit 1; }
          test "${{ steps.verify-evaluator-artifacts.outputs.input_artifact_status }}" = 0 || { echo "Evaluator source-binding handoff identity/digest failed." >&2; exit 1; }
          test "${{ steps.evaluate-load.outputs.evaluation_status }}" = 0 || { echo "External load acceptance failed." >&2; exit 1; }
          test "${{ steps.sanitize.outputs.sanitizer_status }}" = 0 || { echo "External evidence projection/sanitizer failed." >&2; exit 1; }
          acceptance_status="${{ steps.evaluate-load.outputs.acceptance_status }}"
          if [[ "$acceptance_status" == slo_failed ]]; then
            echo "External load completed with a profile-budget SLO miss; sanitized evidence was published." >&2
            exit 1
          fi
          case "$acceptance_status" in accepted|diagnostic_complete) ;; *) echo "External-load final acceptance state is invalid." >&2; exit 1 ;; esac
