name: Platform production external load

# Public E-owned dispatch surface.  It intentionally contains no checkout,
# runner, production environment, secret, SSH, curl, or load-generator step.
# The implementation is a reusable workflow pinned to an immutable T commit;
# E contributes only explicit inputs and the trusted workflow fetches the
# allowlisted profile JSON from this exact target SHA.
#
# Bootstrap contract: this pin is the reviewed base T SHA used while the
# reusable file is introduced.  The first T commit that adds
# platform-production-external-load-trusted.yml must be followed by a second
# T commit updating this pin to that first commit's full SHA.  The contract
# test rejects a moving ref and the runbook treats the interval as NO-GO.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN-PRODUCTION-EXTERNAL-LOAD to create a temporary production fixture"
        required: true
        type: string
      control_email:
        description: "Existing account preserved by exact cleanup"
        required: true
        type: string
      profile_id:
        description: "Reviewed canonical load profile ID"
        required: true
        default: "ready-vote-slo-v2"
        type: string
      timeout_diagnostics:
        description: "Enable bounded per-timeout client/edge/Next/API evidence (diagnostic-only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: platform-production-external-load
  cancel-in-progress: false

jobs:
  trusted-external-load:
    uses: StrayForest/old_sparky/.github/workflows/platform-production-external-load-trusted.yml@fe99fe0c6f16b0a879a26a4701086fdd6fcb5940
    with:
      confirmation: ${{ inputs.confirmation }}
      control_email: ${{ inputs.control_email }}
      profile_id: ${{ inputs.profile_id }}
      timeout_diagnostics: ${{ inputs.timeout_diagnostics }}
      target_sha: ${{ github.sha }}
      source_run_id: ${{ github.run_id }}
      source_run_attempt: ${{ github.run_attempt }}
