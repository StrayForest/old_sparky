name: Platform production retained load cleanup

on:
  workflow_call:
    inputs:
      confirmation:
        description: "Type DELETE-PRODUCTION-RETAINED-LOAD to remove one exact retained load run"
        required: true
        type: string
      load_run_id:
        description: "GitHub run ID of the production retained-load workflow to clean"
        required: true
        type: string
      target_sha:
        description: "Exact source SHA recorded by the retained-load run"
        required: true
        type: string
      control_email:
        description: "The same control account email used by the retained-load run"
        required: true
        type: string


permissions:
  contents: read

concurrency:
  group: platform-production-retained-load-cleanup
  cancel-in-progress: false

jobs:
  # A reusable workflow can be called directly, so the production job is
  # eligible only after this non-secret gate proves the exact public dispatch
  # workflow, repository, protected ref, and API workflow identity.
  validate-caller-identity:
    name: Validate exact public cleanup caller
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      caller_identity_validated: ${{ steps.identity.outputs.caller_identity_validated }}
      caller_workflow_id: ${{ steps.identity.outputs.caller_workflow_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_REPOSITORY: StrayForest/old_sparky
      EXPECTED_WORKFLOW_PATH: .github/workflows/platform-production-retained-load-cleanup.yml
      EXPECTED_WORKFLOW_NAME: Platform production retained load cleanup
      EXPECTED_DEFAULT_REF: refs/heads/dev
      CALLER_REPOSITORY: ${{ github.repository }}
      CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CALLER_EVENT_NAME: ${{ github.event_name }}
      CALLER_REF: ${{ github.ref }}
      CALLER_HEAD_REF: ${{ github.head_ref }}
      CALLER_REF_PROTECTED: ${{ github.ref_protected }}
      CALLER_RUN_ID: ${{ github.run_id }}
      CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
      CALLER_SHA: ${{ github.sha }}
    steps:
      - name: Verify context and exact caller workflow through GitHub API
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CALLER_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$CALLER_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$CALLER_REF" == "$EXPECTED_DEFAULT_REF" ]]
          [[ -z "$CALLER_HEAD_REF" ]]
          [[ "$CALLER_REF_PROTECTED" == "true" ]]
          [[ "$CALLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CALLER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CALLER_WORKFLOW_REF" == "$EXPECTED_REPOSITORY/$EXPECTED_WORKFLOW_PATH@$EXPECTED_DEFAULT_REF" ]]
          run_metadata="$RUNNER_TEMP/retained-cleanup-caller-run.json"
          workflow_metadata="$RUNNER_TEMP/retained-cleanup-caller-workflow.json"
          workflow_commit_metadata="$RUNNER_TEMP/retained-cleanup-caller-workflow-commit.json"
          branch_metadata="$RUNNER_TEMP/retained-cleanup-caller-branch.json"
          repository_metadata="$RUNNER_TEMP/retained-cleanup-caller-repository.json"
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY/actions/runs/$CALLER_RUN_ID" \
            --output "$run_metadata"
          workflow_id="$(/usr/bin/python3 - "$run_metadata" "$CALLER_RUN_ID" "$CALLER_RUN_ATTEMPT" "$CALLER_SHA" "$EXPECTED_REPOSITORY" "$EXPECTED_WORKFLOW_PATH" "$EXPECTED_WORKFLOW_NAME" <<'PY'
          import json
          from pathlib import Path
          import sys

          path, run_id, attempt, caller_sha, repository, workflow_path, workflow_name = sys.argv[1:]

          def closed_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("caller run API response contains duplicate keys")
                  result[key] = value
              return result

          payload = json.loads(Path(path).read_text(encoding="utf-8"), object_pairs_hook=closed_object)
          if not isinstance(payload, dict):
              raise SystemExit("caller run API response is not an object")
          if payload.get("id") != int(run_id) or payload.get("run_attempt") != int(attempt):
              raise SystemExit("caller run identity does not match context")
          if payload.get("event") != "workflow_dispatch" or payload.get("path") != workflow_path or payload.get("name") != workflow_name:
              raise SystemExit("caller run is not the exact public cleanup workflow")
          if payload.get("head_branch") != "dev" or payload.get("head_sha") != caller_sha:
              raise SystemExit("caller run is not the protected dev source")
          for key in ("repository", "head_repository"):
              value = payload.get(key)
              if not isinstance(value, dict) or value.get("full_name") != repository:
                  raise SystemExit("caller run repository identity is not exact")
          workflow_id = payload.get("workflow_id")
          if isinstance(workflow_id, bool) or not isinstance(workflow_id, int) or not 1 <= workflow_id <= 2**63 - 1:
              raise SystemExit("caller workflow id is malformed")
          print(workflow_id)
          PY
          )"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY/actions/workflows/$workflow_id" \
            --output "$workflow_metadata"
          /usr/bin/python3 - "$workflow_metadata" "$EXPECTED_WORKFLOW_PATH" "$EXPECTED_WORKFLOW_NAME" <<'PY'
          import json
          from pathlib import Path
          import sys

          path, expected_path, expected_name = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or payload.get("path") != expected_path or payload.get("name") != expected_name or payload.get("state") != "active":
              raise SystemExit("caller workflow id/path/name is not the reviewed active workflow")
          PY
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY/commits/$CALLER_WORKFLOW_SHA" \
            --output "$workflow_commit_metadata"
          /usr/bin/python3 - "$workflow_commit_metadata" "$CALLER_WORKFLOW_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or payload.get("sha") != sys.argv[2]:
              raise SystemExit("caller workflow SHA is not an exact API commit")
          PY
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY/branches/dev" \
            --output "$branch_metadata"
          /usr/bin/python3 - "$branch_metadata" "$CALLER_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          commit = payload.get("commit") if isinstance(payload, dict) else None
          if (
              not isinstance(payload, dict)
              or payload.get("name") != "dev"
              or payload.get("protected") is not True
              or not isinstance(commit, dict)
              or commit.get("sha") != sys.argv[2]
          ):
              raise SystemExit("caller ref is not the protected dev commit")
          PY
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY" \
            --output "$repository_metadata"
          /usr/bin/python3 - "$repository_metadata" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or payload.get("default_branch") != "dev":
              raise SystemExit("repository default branch is not protected dev")
          PY
          printf 'caller_identity_validated=true\n' >> "$GITHUB_OUTPUT"
          printf 'caller_workflow_id=%s\n' "$workflow_id" >> "$GITHUB_OUTPUT"

  cleanup:
    name: Exact cleanup of one production retained-load run
    needs: validate-caller-identity
    if: >-
      needs.validate-caller-identity.result == 'success' &&
      needs.validate-caller-identity.outputs.caller_identity_validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      LOAD_RUN_ID: ${{ inputs.load_run_id }}
      CONTROL_EMAIL: ${{ inputs.control_email }}
      TARGET_SHA: ${{ inputs.target_sha }}
    outputs:
      ssh_cleanup_status: ${{ steps.cleanup_ssh.outputs.ssh_cleanup_status }}

    steps:
      - name: Validate explicit cleanup confirmation
        id: validate_cleanup_inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production cleanup must run from the reviewed dev branch." >&2; exit 1; }
          test "$QA_CONFIRMATION" = "DELETE-PRODUCTION-RETAINED-LOAD" \
            || { echo "Refusing cleanup without exact confirmation." >&2; exit 1; }
          [[ "$LOAD_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "load_run_id must be a positive decimal identifier." >&2; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "target_sha must be a lowercase 40-character commit SHA." >&2; exit 1; }
          # Validate and serialize operator-controlled identity before any
          # SSH key file, keyscan or remote command is reached.  This is a
          # data-only handoff; the secret job never loads repository code.
          /usr/bin/python3 - "$TARGET_SHA" "$CONTROL_EMAIL" "$LOAD_RUN_ID" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/platform-retained-cleanup-input.json" <<'PY'
          import json
          import re
          import sys

          target_sha, email, load_run_id, cleanup_run_id = sys.argv[1:]
          if (
              re.fullmatch(r"[0-9a-f]{40}", target_sha) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", load_run_id) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", cleanup_run_id) is None
              or not re.fullmatch(r"[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]{1,64}@[A-Za-z0-9.-]{1,253}", email)
              or any(ord(character) < 0x21 or ord(character) > 0x7E for character in email)
          ):
              raise SystemExit("cleanup handoff is invalid")
          print(json.dumps({
              "schema": 1,
              "confirmation": "DELETE-PRODUCTION-RETAINED-LOAD",
              "target_sha": target_sha,
              "control_email": email,
              "load_run_id": load_run_id,
              "cleanup_run_id": cleanup_run_id,
          }, separators=(",", ":")))
          PY
          chmod 600 "$RUNNER_TEMP/platform-retained-cleanup-input.json"
          test "$(stat -c '%a' "$RUNNER_TEMP/platform-retained-cleanup-input.json")" = "600"

      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/platform-retained-cleanup-input.json" \
            || { echo "Cleanup workflow handoff is missing; refusing SSH setup" >&2; exit 1; }
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/production-retained-cleanup-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" 2>/dev/null | /usr/bin/head -c 65536 >"$ssh_scan_attempt" \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Clean the exact retained load run on production
        id: run-cleanup
        if: ${{ success() && steps.validate_cleanup_inputs.outcome == 'success' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -u
          set -o pipefail
          umask 077
          remote_status=1
          cleanup_artifact_status=1
          cleanup_export_status=1
          input_path="$RUNNER_TEMP/platform-retained-cleanup-input.json"
          ssh_output_file="$RUNNER_TEMP/production-retained-cleanup-ssh-output"
          canonical_raw="$RUNNER_TEMP/production-retained-cleanup-canonical.raw"
          artifact_dir="$RUNNER_TEMP/production-retained-cleanup-artifacts"
          cleanup_summary="$artifact_dir/cleanup-summary.json"
          canonical_log="$artifact_dir/canonical.log"
          export_dir="/tmp/old-sparky-production-retained-cleanup-$GITHUB_RUN_ID"
          test -s "$input_path" \
            || { echo "Cleanup workflow handoff is missing; refusing remote cleanup" >&2; exit 1; }
          install -d -m 700 "$artifact_dir"
          trap 'rm -f -- "$ssh_output_file" "$input_path"; test ! -e "$input_path"; ssh_dir="$RUNNER_TEMP/production-retained-cleanup-ssh"; if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then test -d "$ssh_dir" && test ! -L "$ssh_dir"; rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$ssh_dir/known_hosts.scan" "$ssh_dir/known_hosts.scan.1" "$ssh_dir/known_hosts.scan.2" "$ssh_dir/config" "$ssh_dir/control.sock" "$ssh_dir/control-master" "$ssh_dir/control-master.sock"; rmdir -- "$ssh_dir"; fi; test ! -e "$ssh_dir" && test ! -L "$ssh_dir"' EXIT

          bounded_download() {
            local remote_path="$1" destination="$2" max_bytes="$3"
            local remote_size
            remote_size="$(timeout --foreground 20s ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "stat -c '%s' -- '$remote_path'" 2>/dev/null | /usr/bin/head -c 32)" || return 1
            [[ "$remote_size" =~ ^[0-9]+$ ]] && (( remote_size <= max_bytes )) || return 1
            scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST:$remote_path" "$destination" >/dev/null 2>&1 || return 1
            local local_size
            local_size="$(stat -c '%s' "$destination" 2>/dev/null)" || return 1
            [[ "$local_size" =~ ^[0-9]+$ ]] && (( local_size <= max_bytes )) && [[ "$local_size" == "$remote_size" ]]
          }

          project_cleanup_summary() {
            local source="$1"
            local destination="$2"
            /usr/bin/python3 - "$source" "$destination" <<'PY'
          import json
          from pathlib import Path
          import sys

          source_path, destination_path = (Path(value) for value in sys.argv[1:])
          fallback = {
              "schema": 1,
              "ok": False,
              "markers": 0,
              "users_deleted": 0,
              "tournaments_deleted": 0,
              "control_account_preserved": False,
              "error_class": "cleanup_summary_invalid",
          }

          def write_fallback() -> None:
              destination_path.write_text(json.dumps(fallback, sort_keys=True) + chr(10), encoding="utf-8")

          try:
              source = json.loads(source_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              write_fallback()
              raise SystemExit(1)
          if not isinstance(source, dict) or not isinstance(source.get("ok"), bool):
              write_fallback()
              raise SystemExit(1)

          def bounded_count(name: str) -> int:
              value = source.get(name)
              if isinstance(value, bool) or not isinstance(value, int) or not 0 <= value <= 10_000_000:
                  raise ValueError(name)
              return value

          try:
              projection = {
                  "schema": 1,
                  "ok": source["ok"],
                  "markers": bounded_count("markers"),
                  "users_deleted": bounded_count("users_deleted"),
                  "tournaments_deleted": bounded_count("tournaments_deleted"),
                  "control_account_preserved": source["control_account_preserved"] is True,
              }
              if "partial_run_root_removed" in source:
                  if not isinstance(source["partial_run_root_removed"], bool):
                      raise ValueError("partial_run_root_removed")
                  projection["partial_run_root_removed"] = source["partial_run_root_removed"]
          except (KeyError, ValueError, TypeError):
              write_fallback()
              raise SystemExit(1)
          destination_path.write_text(json.dumps(projection, sort_keys=True) + chr(10), encoding="utf-8")
          PY
          }

          set +e
          # The remote command is fixed; all cleanup identity is in the
          # validated mode-600 JSON stdin document.
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B \
            /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py \
            retained-cleanup < "$input_path" 2>&1 | /usr/bin/head -c 1048576 > "$ssh_output_file"
          remote_status="$?"
          set -e
          rm -f -- "$ssh_output_file"
          test ! -e "$ssh_output_file"

          # Project the public summary before asking the host to delete its
          # private export inventory.  The projection has a closed schema and
          # cannot carry the control email or arbitrary remote error text.
          rm -f -- "$cleanup_summary"
          set +e
          bounded_download "$export_dir/cleanup-summary.json" "$cleanup_summary" 1048576
          summary_copy_status="$?"
          set -e
          projection_status=1
          if [[ "$summary_copy_status" == "0" ]]; then
            public_summary="$cleanup_summary.public"
            set +e
            project_cleanup_summary "$cleanup_summary" "$public_summary"
            projection_status="$?"
            set -e
            if [[ "$projection_status" == "0" && -s "$public_summary" ]]; then
              chmod 600 "$public_summary"
              mv -- "$public_summary" "$cleanup_summary"
              test ! -e "$public_summary"
            else
              # Never leave a copied remote response in the artifact path when
              # the closed-schema projection rejects it.  Replace it with a
              # fixed failure record so later always-run evidence steps cannot
              # publish provider text or the control identity.
              rm -f -- "$cleanup_summary" "$public_summary"
              printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_summary_invalid"}' > "$cleanup_summary"
              chmod 600 "$cleanup_summary"
              projection_status=1
            fi
          else
            rm -f -- "$cleanup_summary"
            printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_summary_unavailable"}' > "$cleanup_summary"
            chmod 600 "$cleanup_summary"
          fi

          # Copy the canonical log while the private export still exists.  A
          # later secret-free step reduces it to the public aggregate.
          rm -f -- "$canonical_raw"
          set +e
          bounded_download "$export_dir/canonical.log" "$canonical_raw" 16777216
          canonical_copy_status="$?"
          set -e
          canonical_status=1
          if [[ "$canonical_copy_status" == "0" && -s "$canonical_raw" ]]; then
            canonical_status=0
          fi
          if [[ "$summary_copy_status" == "0" && "$projection_status" == "0" \
            && "$canonical_status" == "0" && -s "$cleanup_summary" ]]; then
            cleanup_artifact_status=0
          fi

          # Exact closed-inventory removal is attempted even when the primary
          # cleanup failed, but its status can never be hidden.
          set +e
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B \
            /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py \
            retained-cleanup-exports < "$input_path" 2>&1 | /usr/bin/head -c 1048576 >/dev/null
          cleanup_export_status="$?"
          set -e
          if [[ "$remote_status" == "0" ]] \
            && { [[ "$cleanup_artifact_status" != "0" ]] || [[ "$cleanup_export_status" != "0" ]]; }; then
            remote_status=1
          fi
          echo "remote_exit_code=$remote_status" >> "$GITHUB_OUTPUT"
          echo "cleanup_artifact_status=$cleanup_artifact_status" >> "$GITHUB_OUTPUT"
          echo "cleanup_export_status=$cleanup_export_status" >> "$GITHUB_OUTPUT"
          # The final always-run gate reports the preserved primary status and
          # rejects any incomplete artifact projection or export deletion.
          exit 0

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          input_path="$RUNNER_TEMP/platform-retained-cleanup-input.json"
          ssh_dir="$RUNNER_TEMP/production-retained-cleanup-ssh"
          ssh_cleanup_status=0
          rm -f -- "$input_path" || ssh_cleanup_status=1
          [[ ! -e "$input_path" && ! -L "$input_path" ]] || ssh_cleanup_status=1
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            if [[ -L "$ssh_dir" || ! -d "$ssh_dir" ]]; then
              ssh_cleanup_status=1
            else
              rm -f -- \
                "$ssh_dir/id_ed25519" \
                "$ssh_dir/known_hosts" \
                "$ssh_dir/known_hosts.scan" \
                "$ssh_dir/known_hosts.scan.1" \
                "$ssh_dir/known_hosts.scan.2" \
                "$ssh_dir/config" \
                "$ssh_dir/control.sock" \
                "$ssh_dir/control-master" \
                "$ssh_dir/control-master.sock" || ssh_cleanup_status=1
              for path in \
                "$ssh_dir/id_ed25519" \
                "$ssh_dir/known_hosts" \
                "$ssh_dir/known_hosts.scan" \
                "$ssh_dir/config" \
                "$ssh_dir/control.sock" \
                "$ssh_dir/control-master" \
                "$ssh_dir/control-master.sock"; do
                [[ ! -e "$path" && ! -L "$path" ]] || ssh_cleanup_status=1
              done
              test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519" || ssh_cleanup_status=1
              rmdir -- "$ssh_dir" || ssh_cleanup_status=1
            fi
          fi
          [[ ! -e "$ssh_dir" && ! -L "$ssh_dir" ]] || ssh_cleanup_status=1
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV" || ssh_cleanup_status=1
          unset SSH_DIR
          [[ -z "${SSH_DIR:-}" ]] || ssh_cleanup_status=1
          echo "ssh_cleanup_status=$ssh_cleanup_status" >> "$GITHUB_OUTPUT" || exit 1
          exit 0

      - name: Normalize cleanup evidence
        id: normalize_cleanup_evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/production-retained-cleanup-artifacts"
          install -d -m 700 "$artifact_dir"
          canonical_raw="$RUNNER_TEMP/production-retained-cleanup-canonical.raw"
          sanitation_status=0
          if [[ -s "$canonical_raw" ]]; then
            # Keep this projection in the secret consumer.  It intentionally
            # accepts only a bounded, fixed schema and never executes a
            # sanitizer from the candidate checkout.
            /usr/bin/python3 - "$canonical_raw" "$artifact_dir/canonical.log" <<'PY' || sanitation_status=1
          import json
          from pathlib import Path
          import sys

          source, destination = (Path(value) for value in sys.argv[1:])
          try:
              raw = source.read_bytes()
              if len(raw) > 256 * 1024:
                  raise ValueError
              payload = json.loads(raw.decode("utf-8"))
              if not isinstance(payload, dict):
                  raise ValueError
              status = payload.get("status")
              if status not in {"passed", "failed", "unavailable", "unknown"}:
                  raise ValueError
              result = {
                  "schema": 1,
                  "status": status,
                  "line_count": min(max(int(payload.get("line_count", 0)), 0), 100000),
                  "retained_line_count": min(max(int(payload.get("retained_line_count", 0)), 0), 100000),
                  "truncated": payload.get("truncated") is True,
                  "class_counts": {"other": 1},
                  "route_class_counts": {"other": 1},
                  "status_counts": {},
              }
          except (OSError, UnicodeError, ValueError, TypeError, json.JSONDecodeError):
              raise SystemExit(1)
          destination.write_text(json.dumps(result, sort_keys=True) + "\n", encoding="utf-8")
          PY
          else
            sanitation_status=1
          fi
          rm -f -- "$canonical_raw"
          test ! -e "$canonical_raw"
          echo "sanitation_status=$sanitation_status" >> "$GITHUB_OUTPUT"
          if [[ ! -s "$artifact_dir/cleanup-summary.json" ]]; then
            printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_unavailable"}' > "$artifact_dir/cleanup-summary.json"
          fi
          if [[ ! -s "$artifact_dir/canonical.log" ]]; then
            printf '%s\n' '{"schema":1,"status":"unavailable","line_count":0,"retained_line_count":0,"truncated":false,"class_counts":{"other":1},"route_class_counts":{"other":1},"status_counts":{}}' > "$artifact_dir/canonical.log"
          fi
          chmod 600 "$artifact_dir/cleanup-summary.json" "$artifact_dir/canonical.log"
          rm -f -- "$RUNNER_TEMP/production-retained-cleanup-remote.log"
          test ! -e "$RUNNER_TEMP/production-retained-cleanup-remote.log"

      - name: Reject incomplete cleanup log evidence
        id: validate_cleanup_evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP/production-retained-cleanup-artifacts/canonical.log" <<'PY'
          import json
          from pathlib import Path
          import sys

          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("required cleanup log evidence is not valid JSON")
          if (
              not isinstance(payload, dict)
              or payload.get("truncated") is not False
              or payload.get("status") in {"truncated", "error", "unavailable"}
          ):
              raise SystemExit("required cleanup log evidence is incomplete")
          PY

      - name: Publish cleanup artifacts
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' && steps.cleanup_ssh.outputs.ssh_cleanup_status == '0' && steps.validate_cleanup_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-retained-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-retained-cleanup-artifacts/cleanup-summary.json
            ${{ runner.temp }}/production-retained-cleanup-artifacts/canonical.log
          if-no-files-found: error
          retention-days: 14

      - name: Write cleanup summary
        if: ${{ always() }}
        shell: bash
        run: |
          summary="$RUNNER_TEMP/production-retained-cleanup-artifacts/cleanup-summary.json"
          if [[ ! -s "$summary" ]]; then
            {
              echo "### Production retained-load cleanup"
              echo
              echo "No cleanup summary was exported from the production server."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          /usr/bin/python3 - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("### Production retained-load cleanup")
          print()
          print(f"- Status: **{'passed' if payload.get('ok') else 'failed'}**")
          print(f"- Markers cleaned: {payload.get('markers', 0)}")
          print(f"- Synthetic users deleted: {payload.get('users_deleted', 0)}")
          print(f"- Tournaments deleted: {payload.get('tournaments_deleted', 0)}")
          print(f"- Control account preserved: `{payload.get('control_account_preserved')}`")
          PY

      - name: Fail if cleanup was not verified
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.run-cleanup.outputs.remote_exit_code }}" = "0" \
            || { echo "Production retained-load cleanup failed; retained data was not removed by the supervisor." >&2; exit 1; }
          test "${{ steps.run-cleanup.outputs.cleanup_artifact_status }}" = "0" \
            || { echo "Retained-load cleanup public projection or evidence copy failed." >&2; exit 1; }
          test "${{ steps.run-cleanup.outputs.cleanup_export_status }}" = "0" \
            || { echo "Retained-load private export cleanup is incomplete." >&2; exit 1; }
          test "${{ steps.normalize_cleanup_evidence.outputs.sanitation_status }}" = "0" \
            || { echo "Retained-load cleanup evidence sanitation failed." >&2; exit 1; }
          test "${{ steps.cleanup_ssh.outputs.ssh_cleanup_status }}" = "0" \
            || { echo "Retained-load SSH cleanup failed." >&2; exit 1; }
          /usr/bin/python3 - "$RUNNER_TEMP/production-retained-cleanup-artifacts/cleanup-summary.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("ok") is not True:
              raise SystemExit("cleanup-summary.json does not report ok=true")
          PY
