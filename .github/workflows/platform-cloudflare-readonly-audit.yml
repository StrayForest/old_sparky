name: Platform Cloudflare read-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-cloudflare-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Query Cloudflare production evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ALL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Require Cloudflare audit credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not configured" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured" >&2; exit 1; }

      - name: Run read-only Cloudflare audit
        shell: bash
        run: |
          set -euo pipefail
          python3 platform/tools/cloudflare_readonly_audit.py \
            --output "$RUNNER_TEMP/cloudflare-audit-report.json"

      - name: Upload redacted Cloudflare audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-readonly-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-audit-report.json
          if-no-files-found: error
          retention-days: 30
