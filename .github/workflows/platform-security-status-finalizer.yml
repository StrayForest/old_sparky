name: Platform security status finalizer

on:
  workflow_run:
    workflows: [Platform security and build]
    types: [completed]

# This workflow has no source checkout, candidate data, or repository secret inputs.
# It exists outside the cancellable security workflow so a cancelled/skipped
# run still receives a terminal commit status whenever GitHub starts workflow_run.
jobs:
  finalize-status:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SOURCE_RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
    steps:
      - name: Resolve the exact completed run to a terminal status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$SOURCE_RUN_UPDATED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          attempt_url="$(/usr/bin/python3 - "$SOURCE_RUN_URL" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$GITHUB_REPOSITORY" <<'PY'
          import re
          import sys
          from urllib.parse import urlsplit

          base, run_id, attempt, repository = sys.argv[1:]
          expected = f"https://github.com/{repository}/actions/runs/{run_id}"
          parsed = urlsplit(base)
          if (
              base != expected
              or parsed.scheme != "https"
              or parsed.netloc != "github.com"
              or parsed.query
              or parsed.fragment
              or not re.fullmatch(r"[1-9][0-9]{0,31}", attempt)
          ):
              raise SystemExit("workflow run URL is not canonical")
          print(f"{expected}/attempts/{attempt}")
          PY
          )"
          status_rows="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100")"
          preserve_success="$(/usr/bin/python3 - "$status_rows" "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_CONCLUSION" "$SOURCE_RUN_UPDATED_AT" <<'PY'
          from datetime import datetime
          import json
          import re
          import sys

          rows = json.loads(sys.argv[1])
          repository, source_run_id, source_attempt, source_conclusion, source_updated_at = sys.argv[2:]
          if not isinstance(rows, list):
              raise SystemExit("commit status response is not a list")
          pattern = re.compile(
              rf"^https://github\.com/{re.escape(repository)}/actions/runs/"
              rf"([1-9][0-9]{{0,31}})/attempts/([1-9][0-9]{{0,31}})$"
          )
          for row in rows:
              if (
                  not isinstance(row, dict)
                  or row.get("context") != "platform-security-build"
                  or row.get("state") != "success"
                  or (row.get("creator") or {}).get("login") != "github-actions[bot]"
                  or (row.get("creator") or {}).get("type") != "Bot"
              ):
                  continue
              match = pattern.fullmatch(str(row.get("target_url", "")))
              if match is None or match.group(1) != source_run_id:
                  attempt_is_current = False
              else:
                  attempt_is_current = int(match.group(2)) >= int(source_attempt)
              status_updated_at = row.get("updated_at")
              newer_status = False
              if isinstance(status_updated_at, str):
                  try:
                      newer_status = datetime.strptime(status_updated_at, "%Y-%m-%dT%H:%M:%SZ") > datetime.strptime(source_updated_at, "%Y-%m-%dT%H:%M:%SZ")
                  except ValueError:
                      newer_status = False
              status_attempt = int(match.group(2)) if match is not None else 0
              current_attempt = attempt_is_current and status_attempt == int(source_attempt)
              newer_attempt = attempt_is_current and status_attempt > int(source_attempt)
              if (newer_attempt or (current_attempt and source_conclusion == "success") or newer_status):
                  print("true")
                  raise SystemExit(0)
          print("false")
          PY
          )"
          if [[ "$preserve_success" == "true" ]]; then
            exit 0
          fi
          case "$SOURCE_CONCLUSION" in
            success)
              state=success
              description="Platform security and build passed"
              ;;
            cancelled|failure|skipped|timed_out|action_required|neutral|stale|startup_failure)
              state=failure
              description="Platform security and build did not complete successfully"
              ;;
            *)
              state=failure
              description="Platform security and build returned an unknown conclusion"
              ;;
          esac
          payload="$(/usr/bin/python3 - "$state" "$description" "$attempt_url" <<'PY'
          import json
          import sys

          print(json.dumps({
              "state": sys.argv[1],
              "context": "platform-security-build",
              "description": sys.argv[2],
              "target_url": sys.argv[3],
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "$payload"
