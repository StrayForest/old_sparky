          def count(path, certificate_policy):
              values = json.loads(Path(path).read_text(encoding="utf-8"))
              if not isinstance(values, list) or not values:
                  raise SystemExit("failed release attestation output is malformed")
              matches = 0
              for item in values:
                  result = item.get("verificationResult") if isinstance(item, dict) else None
                  signature = result.get("signature") if isinstance(result, dict) else None
                  certificate = signature.get("certificate") if isinstance(signature, dict) else None
                  claims = certificate.get("extensions", certificate) if isinstance(certificate, dict) else None
                  statement = result.get("statement") if isinstance(result, dict) else None
                  if not isinstance(claims, dict) or not isinstance(statement, dict):
                      continue
