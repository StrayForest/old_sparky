      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
