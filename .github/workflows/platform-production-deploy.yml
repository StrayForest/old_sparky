          chmod 600 "$ssh_dir/config"
          printf '%s\n' "PREFLIGHT_SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run production preflight
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          remote_log="$RUNNER_TEMP/platform-production-preflight-remote.log"
          remote_error="$RUNNER_TEMP/platform-production-preflight-remote-error.log"
          umask 077
          : > "$remote_log"; : > "$remote_error"; chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$PREFLIGHT_SSH_DIR/config" -i "$PREFLIGHT_SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py \
            production-deploy < "$input_path" > "$remote_log" 2> "$remote_error"
