          PY
          curl --fail-with-body --silent --show-error --location --max-filesize 8388608 \
            "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOST_TOOLS_ARTIFACT_ID}/zip" \
            --output "$outer_zip"
          printf '%s  %s\n' "$HOST_TOOLS_ARTIFACT_DIGEST" "$outer_zip" | sha256sum -c - >/dev/null 2>/dev/null
          /usr/bin/python3 - "$outer_zip" "$outer_dir" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys
          import zipfile

          archive_path, output_path = map(Path, sys.argv[1:])
          allowed = {
              "platform-host-tools-bundle.zip",
              "contract/source_sha",
              "contract/toolset_version",
              "contract/manifest.sha256",
              "contract/capabilities.sha256",
              "contract/files.sha256",
              "contract/files.modes",
