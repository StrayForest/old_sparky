              raise SystemExit("recovery checkout does not match the exact target")
          first_parent_raw = subprocess.run(
              ["git", "rev-list", "--first-parent", target], check=True, capture_output=True, timeout=20,
          ).stdout.splitlines()
          if len(first_parent_raw) > 8192:
