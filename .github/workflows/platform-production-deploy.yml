                  raise SystemExit("host-tools outer archive changed before read")
              stream = os.fdopen(descriptor, "rb", closefd=False)
              with zipfile.ZipFile(stream, "r", allowZip64=False) as archive:
                  members = {}
                  for info in archive.infolist():
                      if info.filename == "contract/" and info.is_dir():
                          continue
                      mode = (info.external_attr >> 16) & 0o170000
                      if info.filename not in allowed or info.is_dir() or mode not in {0, stat.S_IFREG} or info.filename in members or info.file_size > 4 * 1024 * 1024:
                          raise SystemExit("host-tools outer archive inventory is invalid")
                      data = archive.read(info)
