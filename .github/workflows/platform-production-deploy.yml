                  # either exact certificate identity or signer workflow.
                  subjects = statement.get("subject")
                  digest = subjects[0].get("digest") if isinstance(subjects, list) and len(subjects) == 1 and isinstance(subjects[0], dict) else None
                  if base_match and isinstance(digest, dict) and set(digest) == {"sha256"} and digest.get("sha256") == bundle_sha:
                      matches += 1
