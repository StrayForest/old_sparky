name: Platform production deploy

run-name: >-
  ${{ inputs.mode == 'baseline-reconcile' && format('Platform production deploy mode=baseline-reconcile target={0} source={1}.{2} auto={3}.{4}', github.sha, inputs.classifier_run_id, inputs.classifier_run_attempt, inputs.autodeploy_run_id, inputs.autodeploy_run_attempt) || 'Platform production deploy' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run preflight, a normal deployment, baseline reconciliation, or report-only recovery deployment"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy
          - baseline-reconcile
          - recovery-deploy
      runtime_profile:
        description: "Reviewed runtime capacity profile to apply after deployment"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - ready-vote-static-4
          - ready-vote-static-6
          - ready-vote-static-8
          - ready-vote-cprofile
          - ready-vote-static-12
          - ready-vote-static-16
          - ready-vote-adaptive-v2
          - api-3x16
          - api-1x48
          - read-mix-cprofile
          - authenticated-read-admission-32
          - authenticated-read-admission-24x8
          - pool-pre-ping-off
          - web-ssr-diagnostics
          - web-ssr-native-transport
          - web-ssr-workers-2
          - uvicorn-classic
          - uvicorn-optimized
          - api-pool-12
          - api-pool-16
          - api-pool-20
          - api-pool-24
      web_compression:
        description: "Build the Next.js artifact with response compression enabled or disabled"
        required: true
        default: enabled
        type: choice
        options:
          - enabled
          - disabled
      classifier_run_id:
        description: "Exact successful security workflow run supplying the classifier artifact"
        required: false
        default: ""
        type: string
      classifier_run_attempt:
        description: "Exact attempt number for the classifier workflow run"
        required: false
        default: ""
        type: string
      autodeploy_run_id:
        description: "Exact automatic deployment dispatcher run ID (baseline reconciliation only)"
        required: false
        default: ""
        type: string
      autodeploy_run_attempt:
        description: "Exact automatic deployment dispatcher attempt (baseline reconciliation only)"
        required: false
        default: ""
        type: string
      failed_deploy_run_id:
        description: "Exact failed production deployment run to reconcile (recovery-deploy only)"
        required: false
        default: ""
        type: string
      failed_deploy_run_attempt:
        description: "Exact failed production deployment attempt (recovery-deploy only)"
        required: false
        default: ""
        type: string
      report_only_confirmation:
        description: "Typed confirmation after verifying the exact report-only invalid-marker diagnostic"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  # This job may execute the candidate checkout.  It has no production
  # environment and no deployment secret.  It is deliberately always
  # scheduled: an invalid mode must fail here before either mode branch can
  # become a successful skipped no-op.
  validate-dispatch:
    name: Validate deployment dispatch
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: ${{ inputs.mode }}
      DISPATCH_ACTOR: ${{ github.actor }}
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      AUTODEPLOY_RUN_ID: ${{ inputs.autodeploy_run_id }}
      AUTODEPLOY_RUN_ATTEMPT: ${{ inputs.autodeploy_run_attempt }}
      FAILED_DEPLOY_RUN_ID: ${{ inputs.failed_deploy_run_id }}
      FAILED_DEPLOY_RUN_ATTEMPT: ${{ inputs.failed_deploy_run_attempt }}
      REPORT_ONLY_CONFIRMATION: ${{ inputs.report_only_confirmation }}
      RELEASE_SLUG_BASE: gha-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Reject invalid dispatch values before mode branches
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE" in
            preflight|deploy|baseline-reconcile|recovery-deploy) ;;
            *) echo "Unsupported deployment mode; refusing a green no-op." >&2; exit 1 ;;
          esac
          if [[ "$DEPLOY_MODE" == "baseline-reconcile" ]]; then
            [[ "$DISPATCH_ACTOR" == "github-actions[bot]" ]] || {
              echo "Baseline reconciliation is restricted to the automatic deployment chain." >&2
              exit 1
            }
            [[ "$CLASSIFIER_RUN_ID" != "$GITHUB_RUN_ID" ]] || {
              echo "Baseline reconciliation requires a distinct successful security run." >&2
              exit 1
            }
            [[ "$AUTODEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ \
              && "$AUTODEPLOY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ \
              && "$AUTODEPLOY_RUN_ID" != "$GITHUB_RUN_ID" ]] || {
              echo "Baseline reconciliation requires the exact automatic caller attempt." >&2
              exit 1
            }
          fi
          if [[ "$DEPLOY_MODE" == "recovery-deploy" ]]; then
            [[ "$DISPATCH_ACTOR" != "github-actions[bot]" ]] || {
              echo "Report-only recovery requires an authorized operator dispatch." >&2
              exit 1
            }
            [[ "$FAILED_DEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ \
              && "$FAILED_DEPLOY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ \
              && "$FAILED_DEPLOY_RUN_ID" != "$GITHUB_RUN_ID" ]] || {
              echo "Recovery requires the exact prior failed deployment attempt." >&2
              exit 1
            }
            [[ "$CLASSIFIER_RUN_ID" =~ ^[1-9][0-9]{0,31}$ \
              && "$CLASSIFIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ \
              && "$CLASSIFIER_RUN_ID" != "$GITHUB_RUN_ID" \
              && -z "$AUTODEPLOY_RUN_ID" && -z "$AUTODEPLOY_RUN_ATTEMPT" ]] || {
              echo "Recovery requires a distinct exact security run and no automatic caller." >&2
              exit 1
            }
            [[ "$REPORT_ONLY_CONFIRMATION" == "RECOVERY_DEPLOY_REPORT_ONLY_INVALID_MARKER" ]] || {
              echo "Recovery confirmation does not match the closed report-only case." >&2
              exit 1
            }
          elif [[ -n "$FAILED_DEPLOY_RUN_ID" || -n "$FAILED_DEPLOY_RUN_ATTEMPT" || -n "$REPORT_ONLY_CONFIRMATION" ]]; then
            echo "Report-only recovery inputs are only valid for recovery-deploy." >&2
            exit 1
          fi
          case "$RUNTIME_PROFILE" in
            baseline|ready-vote-static-4|ready-vote-static-6|ready-vote-static-8|ready-vote-cprofile|ready-vote-static-12|ready-vote-static-16|ready-vote-adaptive-v2|api-3x16|api-1x48|read-mix-cprofile|authenticated-read-admission-32|authenticated-read-admission-24x8|pool-pre-ping-off|web-ssr-diagnostics|web-ssr-native-transport|web-ssr-workers-2|uvicorn-classic|uvicorn-optimized|api-pool-12|api-pool-16|api-pool-20|api-pool-24) ;;
            *) echo "Unsupported runtime profile." >&2; exit 1 ;;
          esac
          case "$WEB_COMPRESSION" in enabled|disabled) ;; *) echo "Unsupported web compression mode." >&2; exit 1 ;; esac
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Deployment requires an exact target SHA." >&2; exit 1; }
          [[ "$CLASSIFIER_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] || { echo "Classifier run ID is malformed." >&2; exit 1; }
          [[ "$CLASSIFIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]] || { echo "Classifier run attempt is malformed." >&2; exit 1; }

      - name: Checkout dispatch validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate and create closed deployment handoff
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:12}"
          candidate_release_slug="${RELEASE_SLUG_BASE}-${short_sha}"
          [[ "$candidate_release_slug" =~ ^gha-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}-[0-9a-f]{12}$ ]] || {
            echo "Canonical deployment release slug is malformed." >&2
            exit 1
          }
          # The candidate parser is used only on this secret-free runner.  All
          # secret-bearing consumers independently validate the JSON schema.
          handoff_mode="$DEPLOY_MODE"
          [[ "$handoff_mode" != "baseline-reconcile" && "$handoff_mode" != "recovery-deploy" ]] || handoff_mode=deploy
          /usr/bin/python3 platform/tools/platform_workflow_input_guard.py deployment \
            --output "$RUNNER_TEMP/platform-production-deploy-input.json" \
            --mode "$handoff_mode" \
            --runtime-profile "$RUNTIME_PROFILE" \
            --release-slug "$candidate_release_slug" \
            --target-sha "$TARGET_SHA" \
            --artifact-remote-dir "$ARTIFACT_REMOTE_DIR" \
            --classifier-run-id "$CLASSIFIER_RUN_ID" \
            --classifier-run-attempt "$CLASSIFIER_RUN_ATTEMPT" \
            --web-compression "$WEB_COMPRESSION"
          test "$(stat -c '%a' "$RUNNER_TEMP/platform-production-deploy-input.json")" = 600

      - name: Publish closed deployment handoff
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-deploy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-production-deploy-input.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove validator handoff
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/platform-production-deploy-input.json"
          test ! -e "$RUNNER_TEMP/platform-production-deploy-input.json"

  # Validate the exact classifier data on a fresh, secret-free runner before
  # the expensive candidate build.  The trusted validator is checked out from
  # the immutable default-branch commit; the deployment candidate is never run.
  validate-classifier:
    name: Validate exact classifier artifact before build
    outputs:
      incremental_manifest_b64: ${{ steps.validate_manifest.outputs.manifest_b64 }}
      trusted_classifier_sha: ${{ steps.trusted_classifier_default.outputs.sha }}
    needs: validate-dispatch
    if: >-
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'deploy' || inputs.mode == 'baseline-reconcile' || inputs.mode == 'recovery-deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      # The closed input handoff remains mode=deploy for both deploy routes;
      # baseline-reconcile selects the extra proof gates above, not a new
      # release-builder mode.
      DEPLOY_MODE: deploy
      RECONCILE_MODE: ${{ inputs.mode == 'baseline-reconcile' && 'true' || 'false' }}
      RECOVERY_DEPLOY_MODE: ${{ inputs.mode == 'recovery-deploy' && 'true' || 'false' }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      AUTODEPLOY_RUN_ID: ${{ inputs.autodeploy_run_id }}
      AUTODEPLOY_RUN_ATTEMPT: ${{ inputs.autodeploy_run_attempt }}
    steps:
      - name: Resolve immutable default-branch classifier source
        id: trusted_classifier_default
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: dev
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_REF" = "refs/heads/dev"
          trusted_ref="$RUNNER_TEMP/platform-trusted-classifier-ref.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRUSTED_BRANCH}" \
            --output "$trusted_ref"
          /usr/bin/python3 - "$trusted_ref" "$GITHUB_OUTPUT" "$TRUSTED_BRANCH" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branch = sys.argv[3]
          obj = payload.get("object") if isinstance(payload, dict) else None
          sha = obj.get("sha") if isinstance(obj, dict) else None
          if (
              payload.get("ref") != f"refs/heads/{branch}"
              or not isinstance(obj, dict)
              or obj.get("type") != "commit"
              or not isinstance(sha, str)
              or re.fullmatch(r"[0-9a-f]{40}", sha) is None
          ):
              raise SystemExit("trusted classifier source is not an immutable commit")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
          rm -f -- "$trusted_ref"
      - name: Checkout trusted classifier validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.trusted_classifier_default.outputs.sha }}
          path: trusted-classifier
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate automatic reconciliation caller
        if: ${{ inputs.mode == 'baseline-reconcile' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$AUTODEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$AUTODEPLOY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          baseline_tool="$trusted_root/platform/tools/platform_deploy_baseline.py"
          provenance_tool="$trusted_root/platform/tools/platform_workflow_provenance.py"
          test -f "$baseline_tool" && test ! -L "$baseline_tool"
          test -f "$provenance_tool" && test ! -L "$provenance_tool"
          proof_dir="$(mktemp -d "$RUNNER_TEMP/platform-autodeploy-proof.XXXXXX")"
          trap 'rm -rf -- "$proof_dir"' EXIT
          workflow_path="$proof_dir/workflow.json"
          curl --fail-with-body --silent --show-error --max-filesize 262144 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/platform-production-autodeploy.yml" \
            --output "$workflow_path"
          chmod 600 "$workflow_path"
          run_path="$proof_dir/run.json"
          /usr/bin/python3 - "$trusted_root/platform" "$workflow_path" "$run_path" \
            "$AUTODEPLOY_RUN_ID" "$AUTODEPLOY_RUN_ATTEMPT" "$TARGET_SHA" "$GH_TOKEN" "$GITHUB_API_URL" "$GITHUB_REPOSITORY" <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import sys
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          trusted_platform, workflow_path, run_path, run_id, attempt, target_sha, token, api_url, repository = sys.argv[1:]
          sys.path.insert(0, trusted_platform)
          from tools.platform_workflow_provenance import (  # noqa: E402
              AUTODEPLOY_WORKFLOW_NAME,
              AUTODEPLOY_WORKFLOW_PATH,
              ProvenanceError,
          )
          from tools.platform_deploy_baseline import wait_for_autodeploy_completion  # noqa: E402

          class RejectRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  raise URLError("GitHub API redirects are disabled for authenticated metadata requests")

          api_opener = build_opener(RejectRedirect())

          def unique_object(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON key")
                  result[key] = value
              return result

          def read_json(path: str) -> object:
              return json.loads(
                  Path(path).read_text(encoding="utf-8"),
                  object_pairs_hook=unique_object,
              )

          workflow = read_json(workflow_path)
          if (
              not isinstance(workflow, dict)
              or workflow.get("path") != AUTODEPLOY_WORKFLOW_PATH
              or workflow.get("name") != AUTODEPLOY_WORKFLOW_NAME
              or type(workflow.get("id")) is not int
              or workflow["id"] <= 0
          ):
              raise SystemExit("automatic caller workflow identity is not canonical")

          def fetch_attempt() -> dict[str, object]:
              url = f"{api_url}/repos/{repository}/actions/runs/{run_id}/attempts/{attempt}"
              request = Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with api_opener.open(request, timeout=10) as response:
                      final_url = urlsplit(response.geturl())
                      if (
                          response.geturl() != url
                          or final_url.scheme != "https"
                          or final_url.hostname != "api.github.com"
                          or final_url.username is not None
                          or final_url.password is not None
                      ):
                          raise ProvenanceError("auto-deploy attempt response URL is not canonical")
                      raw = response.read(1_048_577)
              except (HTTPError, URLError, TimeoutError, OSError):
                  raise ProvenanceError("auto-deploy attempt request failed") from None
              if len(raw) > 1_048_576:
                  raise ProvenanceError("auto-deploy attempt response exceeds its bound")
              payload = json.loads(raw, object_pairs_hook=unique_object)
              if not isinstance(payload, dict):
                  raise ProvenanceError("auto-deploy attempt response is malformed")
              return payload

          completed = wait_for_autodeploy_completion(
              fetch_attempt,
              expected_workflow_id=workflow["id"],
              expected_run_id=int(run_id),
              expected_attempt=int(attempt),
              expected_target_sha=target_sha,
              timeout_seconds=120,
              poll_interval_seconds=5,
          )
          descriptor = os.open(run_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
              json.dump(completed, handle, sort_keys=True, separators=(",", ":"))
              handle.write("\n")
          PY
          jobs_dir="$proof_dir/jobs"
          install -d -m 700 "$jobs_dir"
          page=1
          fetched_rows=0
          expected_total=""
          while :; do
            page_path="$jobs_dir/page-${page}.json"
            curl --fail-with-body --silent --show-error --max-filesize 1048576 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${AUTODEPLOY_RUN_ID}/attempts/${AUTODEPLOY_RUN_ATTEMPT}/jobs?per_page=100&page=${page}" \
              --output "$page_path"
            chmod 600 "$page_path"
            summary="$(/usr/bin/python3 - "$page_path" "$expected_total" <<'PY'
          import json
          from pathlib import Path
          import sys
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = payload.get("jobs") if isinstance(payload, dict) else None
          total = payload.get("total_count") if isinstance(payload, dict) else None
          if not isinstance(rows, list) or type(total) is not int or total < 0 or len(rows) > 100:
              raise SystemExit("automatic caller job page is malformed")
          prior = sys.argv[2]
          if prior and prior != str(total):
              raise SystemExit("automatic caller job total changed during pagination")
          print(f"{len(rows)} {total}")
          PY
            )"
            [[ "$summary" =~ ^([0-9]+)\ ([0-9]+)$ ]]
            count="${BASH_REMATCH[1]}"
            total="${BASH_REMATCH[2]}"
            fetched_rows=$((fetched_rows + count))
            (( fetched_rows <= 10000 )) || { echo "automatic caller job snapshot exceeds its bound" >&2; exit 1; }
            (( total <= 10000 )) || { echo "automatic caller job total exceeds its bound" >&2; exit 1; }
            if [[ -n "$expected_total" ]]; then
              test "$expected_total" = "$total"
            else
              expected_total="$total"
            fi
            if (( count < 100 )); then break; fi
            ((page += 1))
            (( page <= 100 )) || { echo "automatic caller job pagination exceeded its bound" >&2; exit 1; }
          done
          test "$fetched_rows" = "$expected_total" || {
            echo "automatic caller job pagination is incomplete." >&2
            exit 1
          }
          /usr/bin/python3 - "$trusted_root/platform" "$workflow_path" "$run_path" "$jobs_dir" \
            "$AUTODEPLOY_RUN_ID" "$AUTODEPLOY_RUN_ATTEMPT" "$TARGET_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, sys.argv[1])
          from tools.platform_workflow_provenance import validate_autodeploy_dispatch  # noqa: E402
          workflow = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          run = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          job_dir = Path(sys.argv[4])
          jobs = []
          for path in sorted(job_dir.glob("page-*.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              jobs.extend(payload["jobs"])
          if len(jobs) > 10000 or len({row.get("id") for row in jobs if isinstance(row, dict)}) != len(jobs):
              raise SystemExit("automatic caller job pages are ambiguous or too large")
          validate_autodeploy_dispatch(
              workflow,
              run,
              jobs,
              expected_run_id=int(sys.argv[5]),
              expected_attempt=int(sys.argv[6]),
              expected_target_sha=sys.argv[7],
          )
          PY
          current_sha="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev" \
            | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')"
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ && "$current_sha" == "$TARGET_SHA" ]] || {
            echo "dev changed while authenticating the automatic caller; refusing reconciliation." >&2
            exit 1
          }
          echo "Authenticated exact automatic deployment caller attempt after bounded completion wait."
      - name: Validate exact classifier artifact before candidate build
        id: validate_manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          trusted_tool="$trusted_root/platform/tools/platform_production_classifier_artifact.py"
          test -f "$trusted_tool" && test ! -L "$trusted_tool"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "${{ steps.trusted_classifier_default.outputs.sha }}"
          expected_name="platform-ci-route-${CLASSIFIER_RUN_ID}-${CLASSIFIER_RUN_ATTEMPT}"
          route_dir="$(mktemp -d "$RUNNER_TEMP/platform-ci-route.XXXXXX")"
          trap 'rm -rf -- "$route_dir"' EXIT
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          fetch_classifier_artifacts() {
            local pages_dir="$1" page=1 summary count total expected_total=""
            install -d -m 700 "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail --silent --show-error --location \
                --max-filesize 4194304 \
                "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CLASSIFIER_RUN_ID}/artifacts?per_page=100&page=${page}" \
                --output "$page_path"
              chmod 600 "$page_path"
              summary="$(/usr/bin/python3 "$trusted_tool" page "$page_path")"
              [[ "$summary" =~ ^count=([0-9]+)\ total=([0-9]+)$ ]] || {
                echo "classifier artifact pagination summary is malformed" >&2
                exit 1
              }
              count="${BASH_REMATCH[1]}"
              total="${BASH_REMATCH[2]}"
              if [[ -n "$expected_total" ]]; then
                test "$total" = "$expected_total" || {
                  echo "classifier artifact total changed during pagination" >&2
                  exit 1
                }
              else
                expected_total="$total"
              fi
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 100 )) || {
                echo "classifier artifact pagination exceeded its bound" >&2
                exit 1
              }
            done
          }
          first_pages="$route_dir/artifacts-first"
          second_pages="$route_dir/artifacts-second"
          fetch_classifier_artifacts "$first_pages"
          fetch_classifier_artifacts "$second_pages"
          artifact_id="$(
            /usr/bin/python3 "$trusted_tool" metadata \
              "$first_pages" "$second_pages" \
              --expected-name "$expected_name" \
              --run-id "$CLASSIFIER_RUN_ID" \
              --run-attempt "$CLASSIFIER_RUN_ATTEMPT" \
              --target-sha "$TARGET_SHA"
          )"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "classifier artifact id is malformed" >&2
            exit 1
          }
          curl --fail --silent --show-error --location \
            --max-filesize 4194304 \
            "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$route_dir/artifact.zip"
          manifest_args=(--target-sha "$TARGET_SHA" --emit-manifest-base64)
          if [[ "$RECONCILE_MODE" == "true" ]]; then
            manifest_args+=(--require-reconcile-source)
          fi
          if [[ "$RECOVERY_DEPLOY_MODE" == "true" ]]; then
            manifest_args+=(--require-recovery-bootstrap --require-runtime-sensitive)
          fi
          manifest_b64="$(/usr/bin/python3 "$trusted_tool" manifest "$route_dir/artifact.zip" "${manifest_args[@]}")"
          (( ${#manifest_b64} > 0 && ${#manifest_b64} <= 350000 ))
          [[ "$manifest_b64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          printf 'manifest_b64=%s\n' "$manifest_b64" >> "$GITHUB_OUTPUT"
      - name: Remove trusted classifier validator
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          if [[ -d "$trusted_root" && ! -L "$trusted_root" ]]; then
            rm -rf -- "$trusted_root"
          fi
          test ! -e "$trusted_root" && test ! -L "$trusted_root"

  # Build only the release-independent host-control data on a secret-free
  # runner.  This job never installs or executes anything on production.
  build-host-tools:
    name: Build deterministic host-tools bundle in CI
    needs: validate-dispatch
    if: >-
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'deploy' || inputs.mode == 'preflight' || inputs.mode == 'baseline-reconcile' || inputs.mode == 'recovery-deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET_SHA: ${{ github.sha }}
    outputs:
      artifact_id: ${{ steps.publish-host-tools.outputs.artifact-id }}
      artifact_digest: ${{ steps.publish-host-tools.outputs.artifact-digest }}
      host_tools_sha: ${{ steps.resolve_host_tools_pin.outputs.host_tools_sha }}
    steps:
      - name: Checkout target source as pin metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          path: target-source
          persist-credentials: false

      - name: Require reviewed dev source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          target_source="$GITHUB_WORKSPACE/target-source"
          test "$(git -C "$target_source" rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C "$target_source" status --porcelain=v1 --untracked-files=all -- platform)"

      - name: Resolve reviewed host-tools generation pin
        id: resolve_host_tools_pin
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          test "$EXPECTED_REPOSITORY" = "StrayForest/old_sparky"
          target_source="$GITHUB_WORKSPACE/target-source"
          pin_output="$RUNNER_TEMP/host-tools-pin-output"
          /usr/bin/python3 "$target_source/platform/tools/platform_host_tools_pin.py" resolve \
            --source-root "$target_source" \
            --target-sha "$TARGET_SHA" \
            --expected-repository "$EXPECTED_REPOSITORY" > "$pin_output"
          test "$(stat -c '%F:%h:%a' -- "$pin_output")" = "regular file:1:600"
          test "$(wc -l < "$pin_output" | tr -d ' ')" = 1
          IFS= read -r host_tools_sha < "$pin_output"
          [[ "$host_tools_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'host_tools_sha=%s\n' "$host_tools_sha" >> "$GITHUB_OUTPUT"
          rm -f -- "$pin_output"
          test ! -e "$pin_output" && test ! -L "$pin_output"

      - name: Checkout pinned host-tools source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.resolve_host_tools_pin.outputs.host_tools_sha }}
          fetch-depth: 1
          path: host-tools-source
          persist-credentials: false

      - name: Require exact pinned host-tools source
        shell: bash
        env:
          HOST_TOOLS_SHA: ${{ steps.resolve_host_tools_pin.outputs.host_tools_sha }}
        run: |
          set -euo pipefail
          host_tools_source="$GITHUB_WORKSPACE/host-tools-source"
          test "$(git -C "$host_tools_source" rev-parse HEAD)" = "$HOST_TOOLS_SHA"
          test -z "$(git -C "$host_tools_source" status --porcelain=v1 --untracked-files=all -- platform/tools)"

      - name: Build and verify deterministic host-tools bundle
        shell: bash
        env:
          HOST_TOOLS_SHA: ${{ steps.resolve_host_tools_pin.outputs.host_tools_sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/host-tools-artifact"
          host_tools_source="$GITHUB_WORKSPACE/host-tools-source"
          /usr/bin/python3 "$host_tools_source/platform/tools/platform_host_tools_bundle.py" build \
            --source-root "$host_tools_source" \
            --source-sha "$HOST_TOOLS_SHA" \
            --output "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip"
          /usr/bin/python3 "$host_tools_source/platform/tools/platform_host_tools_bundle.py" verify \
            --bundle "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip" \
            --expected-source-sha "$HOST_TOOLS_SHA" \
            --contract-dir "$RUNNER_TEMP/host-tools-artifact/contract"
          test -f "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip"
          test ! -L "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip"
          test "$(stat -c '%F:%a' "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip")" = "regular file:600"
          test "$(stat -c '%s' "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip")" -le 4194304
          for contract_file in source_sha toolset_version manifest.sha256 capabilities.sha256 files.sha256 files.modes; do
            test -f "$RUNNER_TEMP/host-tools-artifact/contract/$contract_file"
            test ! -L "$RUNNER_TEMP/host-tools-artifact/contract/$contract_file"
          done

      - name: Publish exact host-tools bundle
        id: publish-host-tools
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-host-tools-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-tools-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact host-tools artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_TOOLS_ARTIFACT_ID: ${{ steps.publish-host-tools.outputs.artifact-id }}
          HOST_TOOLS_ARTIFACT_DIGEST: ${{ steps.publish-host-tools.outputs.artifact-digest }}
          HOST_TOOLS_ARTIFACT_NAME: platform-host-tools-bundle-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$HOST_TOOLS_ARTIFACT_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_REF" = "refs/heads/dev"
          HOST_TOOLS_ARTIFACT_DIGEST="${HOST_TOOLS_ARTIFACT_DIGEST#sha256:}"
          [[ "$HOST_TOOLS_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          metadata_path="$RUNNER_TEMP/host-tools-artifact-metadata.json"
          metadata_error="$RUNNER_TEMP/host-tools-artifact-metadata.error"
          if ! curl --fail --silent --show-error --location --max-filesize 524288 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOST_TOOLS_ARTIFACT_ID}" \
            --output "$metadata_path" 2> "$metadata_error"; then
            rm -f -- "$metadata_path" "$metadata_error"
            echo "host-tools artifact metadata request failed" >&2
            exit 1
          fi
          rm -f -- "$metadata_error"
          test "$(stat -c '%F:%a:%h' -- "$metadata_path")" = "regular file:600:1"
          api_zip="$RUNNER_TEMP/platform-host-tools-artifact.zip"
          curl --fail-with-body --silent --show-error --location --max-filesize 8388608 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOST_TOOLS_ARTIFACT_ID}/zip" \
            --output "$api_zip"
          host_tools_source="$GITHUB_WORKSPACE/host-tools-source"
          /usr/bin/python3 "$host_tools_source/platform/tools/platform_host_tools_bundle.py" verify-artifact-metadata \
            --metadata "$metadata_path" \
            --artifact-id "$HOST_TOOLS_ARTIFACT_ID" \
            --artifact-name "$HOST_TOOLS_ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$TARGET_SHA" \
            --expected-branch dev \
            --artifact-digest "sha256:${HOST_TOOLS_ARTIFACT_DIGEST}" \
            --archive "$api_zip"
          printf '%s  %s\n' "$HOST_TOOLS_ARTIFACT_DIGEST" "$api_zip" | sha256sum -c - >/dev/null 2>/dev/null
          attempt_json="$RUNNER_TEMP/host-tools-workflow-attempt.json"
          attempt_error="$RUNNER_TEMP/host-tools-workflow-attempt.error"
          if ! curl --fail --silent --show-error --location --max-filesize 524288 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --output "$attempt_json" 2> "$attempt_error"; then
            rm -f -- "$attempt_json" "$attempt_error"
            echo "host-tools workflow attempt metadata request failed" >&2
            exit 1
          fi
          rm -f -- "$attempt_error"
          /usr/bin/python3 "$host_tools_source/platform/tools/platform_host_tools_bundle.py" verify-workflow-attempt \
            --metadata "$attempt_json" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$TARGET_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-branch dev \
            --expected-event workflow_dispatch

      - name: Attest exact host-tools bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/host-tools-artifact/platform-host-tools-bundle.zip

      - name: Remove host-tools build data
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/target-source" "$GITHUB_WORKSPACE/host-tools-source"
          rm -rf -- "$RUNNER_TEMP/host-tools-artifact"
          rm -f -- "$RUNNER_TEMP/platform-host-tools-artifact.zip" \
            "$RUNNER_TEMP/host-tools-artifact-metadata.json" \
            "$RUNNER_TEMP/host-tools-artifact-metadata.error" \
            "$RUNNER_TEMP/host-tools-workflow-attempt.json" \
            "$RUNNER_TEMP/host-tools-workflow-attempt.error"

  # This is a read-only capability gate. It consumes the attested bundle as
  # data, checks the already provisioned immutable generation, and then invokes
  # only that generation's fixed capability command. It never uploads,
  # installs, or executes candidate/repository source on production.
  host-capability-preflight:
    name: Verify immutable production host capabilities
    needs:
      - validate-dispatch
      - build-host-tools
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.build-host-tools.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'deploy' || inputs.mode == 'preflight' || inputs.mode == 'baseline-reconcile' || inputs.mode == 'recovery-deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      host_tools_sha: ${{ needs.build-host-tools.outputs.host_tools_sha }}
      host_tools_artifact_id: ${{ steps.host-tools-handoff.outputs.artifact_id }}
      host_tools_artifact_name: ${{ steps.host-tools-handoff.outputs.artifact_name }}
      host_tools_artifact_size: ${{ steps.host-tools-handoff.outputs.artifact_size }}
      host_tools_artifact_digest: ${{ steps.host-tools-handoff.outputs.artifact_digest }}
      host_tools_bundle_sha256: ${{ steps.host-tools-handoff.outputs.bundle_sha256 }}
      host_tools_manifest_sha256: ${{ steps.host-tools-handoff.outputs.manifest_sha256 }}
      host_tools_capabilities_sha256: ${{ steps.host-tools-handoff.outputs.capabilities_sha256 }}
      host_tools_files_contract_sha256: ${{ steps.host-tools-handoff.outputs.files_contract_sha256 }}
      host_tools_modes_contract_sha256: ${{ steps.host-tools-handoff.outputs.modes_contract_sha256 }}
      host_tools_signer_workflow: ${{ steps.host-tools-handoff.outputs.signer_workflow }}
      host_tools_source_ref: ${{ steps.host-tools-handoff.outputs.source_ref }}
      host_tools_source_digest: ${{ steps.host-tools-handoff.outputs.source_digest }}
      host_tools_attestation_run_id: ${{ steps.host-tools-handoff.outputs.attestation_run_id }}
      host_tools_attestation_run_attempt: ${{ steps.host-tools-handoff.outputs.attestation_run_attempt }}
      host_tools_attestation_job_id: ${{ steps.host-tools-handoff.outputs.attestation_job_id }}
      baseline_identity: ${{ steps.active-baseline.outputs.identity }}
      host_tools_handoff_artifact_id: ${{ steps.publish-host-tools-handoff.outputs.artifact-id }}
      host_tools_handoff_artifact_digest: ${{ steps.publish-host-tools-handoff.outputs.artifact-digest }}
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      HOST_TOOLS_SHA: ${{ needs.build-host-tools.outputs.host_tools_sha }}
      HOST_TOOLS_ARTIFACT_ID: ${{ needs.build-host-tools.outputs.artifact_id }}
      HOST_TOOLS_ARTIFACT_DIGEST: ${{ needs.build-host-tools.outputs.artifact_digest }}
      HOST_TOOLS_ARTIFACT_NAME: platform-host-tools-bundle-${{ github.run_id }}-${{ github.run_attempt }}
      HOST_TOOLS_DISPATCHER: /opt/oldsparky/platform/shared/host-tools/${{ needs.build-host-tools.outputs.host_tools_sha }}/platform_workflow_remote_dispatch.py
    steps:
      - name: Download and verify exact host-tools artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          artifact-ids: ${{ env.HOST_TOOLS_ARTIFACT_ID }}
          path: ${{ runner.temp }}/host-tools-download

      - name: Rebind outer artifact and attest exact inner bundle before extraction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$HOST_TOOLS_ARTIFACT_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_REF" = "refs/heads/dev"
          outer_digest="${HOST_TOOLS_ARTIFACT_DIGEST#sha256:}"
          [[ "$outer_digest" =~ ^[0-9a-f]{64}$ ]]
          metadata_path="$RUNNER_TEMP/host-tools-final-artifact-metadata.json"
          outer_path="$RUNNER_TEMP/host-tools-final-artifact.zip"
          curl --fail-with-body --silent --show-error --location --max-filesize 524288 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOST_TOOLS_ARTIFACT_ID}" \
            --output "$metadata_path"
          /usr/bin/python3 - "$metadata_path" "$HOST_TOOLS_ARTIFACT_ID" "$HOST_TOOLS_ARTIFACT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TARGET_SHA" "sha256:${outer_digest}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path, artifact_id, artifact_name, run_id, attempt, source_sha, digest = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          workflow_run = payload.get("workflow_run")
          if (
              type(payload.get("id")) is not int
              or payload.get("id") != int(artifact_id)
              or payload.get("name") != artifact_name
              or payload.get("expired") is not False
              or type(payload.get("size_in_bytes")) is not int
              or payload.get("size_in_bytes") <= 0
              or payload.get("digest") != digest
              or not isinstance(workflow_run, dict)
              or workflow_run.get("id") != int(run_id)
              or workflow_run.get("head_sha") != source_sha
          ):
              raise SystemExit("host-tools outer artifact API binding is invalid")
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("host-tools outer artifact digest is invalid")
          PY
          curl --fail-with-body --silent --show-error --location --max-filesize 8388608 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOST_TOOLS_ARTIFACT_ID}/zip" \
            --output "$outer_path"
          printf '%s  %s\n' "$outer_digest" "$outer_path" | sha256sum -c - >/dev/null 2>/dev/null
          /usr/bin/python3 - "$outer_path" "$RUNNER_TEMP/host-tools-download" "sha256:${outer_digest}" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import stat
          import sys
          import zipfile

          archive_path, output_path, expected_digest = map(Path, sys.argv[1:])
          expected_digest = str(expected_digest)
          allowed = {
              "platform-host-tools-bundle.zip",
              "contract/source_sha",
              "contract/toolset_version",
              "contract/manifest.sha256",
              "contract/capabilities.sha256",
              "contract/files.sha256",
              "contract/files.modes",
          }
          before = archive_path.lstat()
          if (
              stat.S_ISLNK(before.st_mode) or not stat.S_ISREG(before.st_mode)
              or before.st_nlink != 1 or before.st_size > 8 * 1024 * 1024
          ):
              raise SystemExit("host-tools outer artifact metadata is unsafe")
          descriptor = os.open(archive_path, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
          stream = None
          try:
              opened = os.fstat(descriptor)
              if (opened.st_dev, opened.st_ino, opened.st_size) != (before.st_dev, before.st_ino, before.st_size):
                  raise SystemExit("host-tools outer artifact changed before read")
              stream = os.fdopen(descriptor, "rb", closefd=False)
              members = {}
              with zipfile.ZipFile(stream, "r", allowZip64=False) as archive:
                  total = 0
                  for info in archive.infolist():
                      name = info.filename
                      if name == "contract/" and info.is_dir():
                          continue
                      mode = (info.external_attr >> 16) & 0o170000
                      if name not in allowed or info.is_dir() or mode not in {0, stat.S_IFREG}:
                          raise SystemExit("host-tools outer artifact member set is invalid")
                      if name in members or info.file_size > 4 * 1024 * 1024 or total + info.file_size > 8 * 1024 * 1024:
                          raise SystemExit("host-tools outer artifact member bound is invalid")
                      data = archive.read(info)
                      if len(data) != info.file_size:
                          raise SystemExit("host-tools outer artifact member changed")
                      members[name] = data
                      total += len(data)
              if set(members) != allowed:
                  raise SystemExit("host-tools outer artifact inventory is incomplete")
              os.lseek(descriptor, 0, os.SEEK_SET)
              digest = hashlib.sha256()
              size = 0
              while size <= 8 * 1024 * 1024:
                  chunk = os.read(descriptor, 1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
                  size += len(chunk)
              after = os.fstat(descriptor)
              if (
                  size != after.st_size
                  or digest.hexdigest() != expected_digest.removeprefix("sha256:")
                  or (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                  != (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns, opened.st_ctime_ns)
              ):
                  raise SystemExit("host-tools outer artifact changed during read")
          finally:
              if stream is not None:
                  stream.close()
              try:
                  os.close(descriptor)
              except OSError:
                  pass
          output = Path(output_path)
          staging = output.with_name(output.name + ".verified")
          if staging.exists() or staging.is_symlink():
              raise SystemExit("host-tools verified staging path already exists")
          staging.mkdir(mode=0o700)
          try:
              (staging / "contract").mkdir(mode=0o700)
              for name, data in members.items():
                  destination = staging / name
                  descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  try:
                      view = memoryview(data)
                      while view:
                          written = os.write(descriptor, view)
                          if written <= 0:
                              raise SystemExit("host-tools verified member write failed")
                          view = view[written:]
                      os.fchmod(descriptor, 0o600)
                  finally:
                      os.close(descriptor)
              if output.exists() or output.is_symlink():
                  if output.is_symlink() or not output.is_dir():
                      raise SystemExit("host-tools download path is unsafe")
                  shutil.rmtree(output)
              os.replace(staging, output)
          except BaseException:
              if staging.exists() and not staging.is_symlink():
                  shutil.rmtree(staging)
              raise
          PY
          bundle_path="$RUNNER_TEMP/host-tools-download/platform-host-tools-bundle.zip"
          attestation_json="$RUNNER_TEMP/host-tools-attestation.json"
          gh attestation verify "$bundle_path" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow StrayForest/old_sparky/.github/workflows/platform-production-deploy.yml \
            --source-ref refs/heads/dev \
            --source-digest "$TARGET_SHA" \
            --format json > "$attestation_json"
          test -s "$attestation_json"

      - name: Validate host-tools artifact envelope and bundle
        shell: bash
        run: |
          set -euo pipefail
          # This step validates the downloaded bundle as data. The installed
          # generation is probed only by the separate final step below, after
          # the complete remote integrity inventory succeeds.
          umask 077
          [[ "$HOST_TOOLS_ARTIFACT_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_REF" = "refs/heads/dev"
          HOST_TOOLS_ARTIFACT_DIGEST="${HOST_TOOLS_ARTIFACT_DIGEST#sha256:}"
          [[ "$HOST_TOOLS_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          bundle_path="$RUNNER_TEMP/host-tools-download/platform-host-tools-bundle.zip"
          test -f "$bundle_path" && test ! -L "$bundle_path"
          test "$(stat -c '%F:%h:%s' -- "$bundle_path")" = "regular file:1:$(stat -c '%s' -- "$bundle_path")"
          chmod 600 "$bundle_path"
          test "$(stat -c '%s' -- "$bundle_path")" -le 4194304
          contract_dir="$RUNNER_TEMP/host-tools-download/contract"
          test -d "$contract_dir" && test ! -L "$contract_dir"
          chmod 700 "$contract_dir"
          for contract_file in source_sha toolset_version manifest.sha256 capabilities.sha256 files.sha256 files.modes; do
            contract_path="$contract_dir/$contract_file"
            test -f "$contract_path" && test ! -L "$contract_path"
            test "$(stat -c '%F:%h:%s' -- "$contract_path")" = "regular file:1:$(stat -c '%s' -- "$contract_path")"
            chmod 600 "$contract_path"
          done
          IFS= read -r source_sha < "$contract_dir/source_sha"
          IFS= read -r toolset_version < "$contract_dir/toolset_version"
          test "$source_sha" = "$HOST_TOOLS_SHA"
          test "$toolset_version" = "production-host-tools-v2"
          IFS= read -r manifest_hash < "$contract_dir/manifest.sha256"
          IFS= read -r capabilities_hash < "$contract_dir/capabilities.sha256"
          [[ "$manifest_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$capabilities_hash" =~ ^[0-9a-f]{64}$ ]]
          bundle_stat="$(stat -c '%s' -- "$bundle_path")"
          test "$bundle_stat" -gt 0
          inner_dir="$RUNNER_TEMP/platform-host-tools-inner"
          install -d -m 700 "$inner_dir"
          /usr/bin/unzip -qq -n "$bundle_path" -d "$inner_dir"
          test "$(find "$inner_dir" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = 1
          inner_root="$inner_dir/platform-host-tools"
          test -d "$inner_root" && test ! -L "$inner_root"
          expected_members_file="$RUNNER_TEMP/platform-host-tools-expected-members"
          /usr/bin/python3 - "$inner_root/manifest.json" "$contract_dir/files.sha256" "$expected_members_file" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          manifest_path, contract_path, output_path = map(Path, sys.argv[1:])
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          safe_member = re.compile(r"^platform_[A-Za-z0-9_.-]+\.(?:py|sh)$")
          records = payload.get("files")
          if (
              type(payload.get("schema")) is not int
              or payload.get("schema") != 1
              or not isinstance(records, list)
          ):
              raise SystemExit("host-tools manifest schema is invalid")
          manifest_paths = []
          for record in records:
              if not isinstance(record, dict) or set(record) != {"path", "sha256", "mode"}:
                  raise SystemExit("host-tools manifest record is invalid")
              path = record.get("path")
              if path != "capabilities.txt" and (not isinstance(path, str) or safe_member.fullmatch(path) is None):
                  raise SystemExit("host-tools manifest path is unsafe")
              if path in manifest_paths:
                  raise SystemExit("host-tools manifest has duplicate paths")
              manifest_paths.append(path)
          if "capabilities.txt" not in manifest_paths:
              raise SystemExit("host-tools capabilities member is missing")
          contract_paths = []
          for line in contract_path.read_text(encoding="ascii").splitlines():
              digest, path = line.split("  ", 1)
              if path in contract_paths:
                  raise SystemExit("host-tools contract has duplicate paths")
              contract_paths.append(path)
          if sorted(manifest_paths) != sorted(contract_paths):
              raise SystemExit("host-tools manifest and contract sets differ")
          expected = sorted(
              [f"platform-host-tools/{path}" for path in manifest_paths]
              + ["platform-host-tools/manifest.json"]
          )
          output_path.write_text("\n".join(expected) + "\n", encoding="ascii")
          PY
          mapfile -t actual_members < <(/usr/bin/zipinfo -Z1 "$bundle_path")
          for member in "${actual_members[@]}"; do
            [[ "$member" =~ ^platform-host-tools/(platform_[A-Za-z0-9_.-]+\.(py|sh)|capabilities\.txt|manifest\.json)$ ]]
          done
          printf '%s\n' "${actual_members[@]}" | /usr/bin/sort -u > "$RUNNER_TEMP/platform-host-tools-actual-members"
          test "$(wc -l < "$RUNNER_TEMP/platform-host-tools-actual-members" | tr -d ' ')" = "${#actual_members[@]}"
          cmp -s "$expected_members_file" "$RUNNER_TEMP/platform-host-tools-actual-members"
          mapfile -t expected_members < "$expected_members_file"
          test "$(/usr/bin/sha256sum "$inner_root/manifest.json" | cut -d' ' -f1)" = "$manifest_hash"
          test "$(/usr/bin/sha256sum "$inner_root/capabilities.txt" | cut -d' ' -f1)" = "$capabilities_hash"
          grep -Fqx "schema=1" "$inner_root/capabilities.txt"
          grep -Fqx "toolset_version=production-host-tools-v2" "$inner_root/capabilities.txt"
          grep -Fqx "source_sha=$HOST_TOOLS_SHA" "$inner_root/capabilities.txt"
          grep -Fqx "capability=production_deploy_control" "$inner_root/capabilities.txt"
          grep -Fqx "capability=python_isolated" "$inner_root/capabilities.txt"
          grep -Fqx "capability=python_bytecode_disabled" "$inner_root/capabilities.txt"
          grep -Fqx '"schema":1,' "$inner_root/manifest.json" || grep -Fq '"schema":1' "$inner_root/manifest.json"
          grep -Fq "\"source_sha\":\"$HOST_TOOLS_SHA\"" "$inner_root/manifest.json"
          grep -Fq "\"generation\":\"$HOST_TOOLS_SHA\"" "$inner_root/manifest.json"
          grep -Fq '"toolset_version":"production-host-tools-v2"' "$inner_root/manifest.json"
          expected_count=0
          while read -r expected_hash expected_path; do
            [[ "$expected_hash" =~ ^[0-9a-f]{64}$ ]]
            [[ "$expected_path" =~ ^platform_[A-Za-z0-9_.-]+\.(py|sh)$|^capabilities\.txt$ ]]
            test -f "$inner_root/$expected_path" && test ! -L "$inner_root/$expected_path"
            test "$(stat -c '%F:%h:%a' -- "$inner_root/$expected_path")" = "regular file:1:$(case "$expected_path" in capabilities.txt) echo 444 ;; *) echo 555 ;; esac)"
            test "$(/usr/bin/sha256sum "$inner_root/$expected_path" | cut -d' ' -f1)" = "$expected_hash"
            expected_count=$((expected_count + 1))
          done < "$contract_dir/files.sha256"
          test "$expected_count" -eq $(( ${#expected_members[@]} - 1 ))
          test "$(wc -l < "$contract_dir/files.modes" | tr -d ' ')" = "$(( ${#expected_members[@]} - 1 ))"
          while read -r expected_mode expected_path; do
            case "$expected_path" in
              capabilities.txt) test "$expected_mode" = 444 ;;
              platform_[A-Za-z0-9_.-]*.py|platform_[A-Za-z0-9_.-]*.sh) test "$expected_mode" = 555 ;;
              *) echo "host-tools contract path is invalid" >&2; exit 1 ;;
            esac
          done < "$contract_dir/files.modes"

      - name: Validate root SSH identity and installed generation
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PROD_SSH_HOST:-}" || -z "${PROD_SSH_USER:-}" || -z "${PROD_SSH_KEY:-}" ]]; then
            echo "Production SSH configuration is incomplete." >&2
            exit 1
          fi
          ssh_dir="$RUNNER_TEMP/platform-host-capability-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          generation="/opt/oldsparky/platform/shared/host-tools/$HOST_TOOLS_SHA"
          # Every call through this array is read-only; keep runner-side
          # sidecars on the runner instead of allowing SSH to consume stdin.
          remote=(ssh -n -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$ssh_dir/config" -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST")
          run_remote_readonly() {
            /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 60s \
              "${remote[@]}" "$@"
          }
          test "$(run_remote_readonly /usr/bin/id -u | tr -d '\r\n')" = 0
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$generation" = "/opt/oldsparky/platform/shared/host-tools/$HOST_TOOLS_SHA" ]]
          run_remote_readonly /usr/bin/test -d "$generation"
          run_remote_readonly /usr/bin/test ! -L "$generation"
          test "$(run_remote_readonly /usr/bin/stat -c '%F:%u:%g:%h:%a' -- "$generation")" = "directory:0:0:2:555"
          contract_dir="$RUNNER_TEMP/host-tools-download/contract"
          expected_payload_count="$(wc -l < "$contract_dir/files.sha256" | tr -d ' ')"
          expected_mode_payload_count="$(wc -l < "$contract_dir/files.modes" | tr -d ' ')"
          test "$expected_payload_count" -gt 0
          test "$expected_mode_payload_count" -eq "$expected_payload_count"
          digest_count=0
          while read -r expected_hash expected_path; do
            [[ "$expected_hash" =~ ^[0-9a-f]{64}$ ]]
            [[ "$expected_path" =~ ^platform_[A-Za-z0-9_.-]+\.(py|sh)$|^capabilities\.txt$|^manifest\.json$ ]]
            remote_path="$generation/$expected_path"
            run_remote_readonly /usr/bin/test -f "$remote_path"
            run_remote_readonly /usr/bin/test ! -L "$remote_path"
            case "$expected_path" in
              capabilities.txt|manifest.json) expected_mode=444 ;;
              *) expected_mode=555 ;;
            esac
            test "$(run_remote_readonly /usr/bin/stat -c '%F:%u:%g:%h:%a' -- "$remote_path")" = "regular file:0:0:1:$expected_mode"
            remote_digest="$(run_remote_readonly /usr/bin/sha256sum -- "$remote_path")"
            test "${remote_digest%% *}" = "$expected_hash"
            digest_count=$((digest_count + 1))
          done < "$contract_dir/files.sha256"
          test "$digest_count" -eq "$expected_payload_count"
          IFS= read -r expected_manifest_hash < "$contract_dir/manifest.sha256"
          IFS= read -r expected_capabilities_hash < "$contract_dir/capabilities.sha256"
          test "$(run_remote_readonly /usr/bin/sha256sum -- "$generation/manifest.json")" = "$expected_manifest_hash  $generation/manifest.json"
          test "$(run_remote_readonly /usr/bin/stat -c '%F:%u:%g:%h:%a' -- "$generation/manifest.json")" = "regular file:0:0:1:444"
          test "$(run_remote_readonly /usr/bin/sha256sum -- "$generation/capabilities.txt")" = "$expected_capabilities_hash  $generation/capabilities.txt"
          test "$(run_remote_readonly /usr/bin/stat -c '%F:%u:%g:%h:%a' -- "$generation/capabilities.txt")" = "regular file:0:0:1:444"
          declare -A expected_entries=([capabilities.txt]=1 [manifest.json]=1)
          mode_count=0
          while read -r expected_mode expected_path; do
            remote_path="$generation/$expected_path"
            remote_mode="$(run_remote_readonly /usr/bin/stat -c '%a' -- "$remote_path")"
            test "$remote_mode" = "$expected_mode"
            expected_entries["$expected_path"]=1
            mode_count=$((mode_count + 1))
          done < "$contract_dir/files.modes"
          test "$mode_count" -eq "$expected_payload_count"
          printf '%s\n' "Verified host-tools remote digest entries: $digest_count"
          printf '%s\n' "Verified host-tools remote mode entries: $mode_count"
          expected_entry_count="${#expected_entries[@]}"
          inventory_encoded="$RUNNER_TEMP/host-tools-remote-entries.b64"
          inventory_file="$RUNNER_TEMP/host-tools-remote-entries"
          # NUL-delimited find output is base64-wrapped before it crosses the
          # SSH boundary.  This preserves dotfiles and makes newline/control
          # names observable instead of allowing line-oriented ambiguity.
          run_remote_readonly /usr/bin/find -- "$generation" -mindepth 1 -maxdepth 1 -print0 \
            | /usr/bin/base64 -w 0 > "$inventory_encoded"
          test "$(stat -c '%F:%h' -- "$inventory_encoded")" = "regular file:1"
          test "$(stat -c '%s' -- "$inventory_encoded")" -le 16384
          /usr/bin/base64 --decode "$inventory_encoded" > "$inventory_file"
          test "$(stat -c '%F:%h' -- "$inventory_file")" = "regular file:1"
          mapfile -d '' -t remote_names < "$inventory_file"
          test "${#remote_names[@]}" -eq "$expected_entry_count"
          declare -A seen_entries=()
          for remote_path in "${remote_names[@]}"; do
            [[ "$remote_path" == "$generation/"* ]]
            relative_path="${remote_path#"$generation/"}"
            [[ "$relative_path" =~ ^[A-Za-z0-9_.-]+$ ]]
            [[ -n "${expected_entries[$relative_path]+present}" ]]
            [[ -z "${seen_entries[$relative_path]+present}" ]]
            seen_entries["$relative_path"]=1
            unset "expected_entries[$relative_path]"
          done
          test "${#expected_entries[@]}" -eq 0
          printf '%s\n' "HOST_TOOLS_GENERATION=$generation" >> "$GITHUB_ENV"
          printf '%s\n' "HOST_TOOLS_SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Create closed host-tools handoff after final verification
        id: host-tools-handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle_path="$RUNNER_TEMP/host-tools-download/platform-host-tools-bundle.zip"
          contract_dir="$RUNNER_TEMP/host-tools-download/contract"
          inner_root="$RUNNER_TEMP/platform-host-tools-inner/platform-host-tools"
          attestation_json="$RUNNER_TEMP/host-tools-attestation.json"
          jobs_json="$RUNNER_TEMP/host-tools-build-jobs.json"
          curl --fail-with-body --silent --show-error --location --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --output "$jobs_json"
          build_job_id="$(/usr/bin/python3 - "$jobs_json" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TARGET_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path
          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("jobs")
          if not isinstance(rows, list):
              raise SystemExit("host-tools workflow jobs response is malformed")
          run_id, attempt, source = int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          matches = [
              row for row in rows
              if isinstance(row, dict)
              and type(row.get("id")) is int
              and row.get("name") == "Build deterministic host-tools bundle in CI"
              and row.get("run_id") == run_id
              and row.get("run_attempt") == attempt
              and row.get("status") == "completed"
              and row.get("conclusion") == "success"
              and row.get("head_sha") == source
          ]
          if len(matches) != 1:
              raise SystemExit("exact successful host-tools build job is missing")
          print(matches[0]["id"])
          PY
          )"
          bundle_sha256="$(sha256sum "$bundle_path" | awk '{print $1}')"
          outer_digest="${HOST_TOOLS_ARTIFACT_DIGEST#sha256:}"
          [[ "$outer_digest" =~ ^[0-9a-f]{64}$ ]]
          artifact_size="$(/usr/bin/python3 - "$RUNNER_TEMP/host-tools-final-artifact-metadata.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("size_in_bytes")
          if type(value) is not int or value <= 0 or value > 8 * 1024 * 1024:
              raise SystemExit("host-tools artifact size is invalid")
          print(value)
          PY
          )"
          IFS= read -r manifest_sha256 < "$contract_dir/manifest.sha256"
          IFS= read -r capabilities_sha256 < "$contract_dir/capabilities.sha256"
          files_contract_sha256="$(sha256sum "$contract_dir/files.sha256" | awk '{print $1}')"
          modes_contract_sha256="$(sha256sum "$contract_dir/files.modes" | awk '{print $1}')"
          /usr/bin/python3 - "$attestation_json" "$bundle_sha256" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TARGET_SHA" "$HOST_TOOLS_ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          values = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_bundle, run_id, attempt, source, artifact_name = sys.argv[2:]
          if not isinstance(values, list) or not values:
              raise SystemExit("host-tools attestation JSON is not a non-empty array")
          build = "https://github.com/StrayForest/old_sparky/.github/workflows/platform-production-deploy.yml@refs/heads/dev"
          repo = "https://github.com/StrayForest/old_sparky"
          runner = f"https://github.com/StrayForest/old_sparky/actions/runs/{run_id}/attempts/{attempt}"
          matches = 0
          for item in values:
              if not isinstance(item, dict):
                  continue
              result = item.get("verificationResult")
              signature = result.get("signature") if isinstance(result, dict) else None
              certificate = signature.get("certificate") if isinstance(signature, dict) else None
              claims = (
                  certificate.get("extensions", certificate)
                  if isinstance(certificate, dict)
                  else None
              )
              statement = result.get("statement") if isinstance(result, dict) else None
              if not isinstance(claims, dict) or not isinstance(statement, dict):
                  continue
              if (
                  claims.get("issuer") != "https://token.actions.githubusercontent.com"
                  or claims.get("sourceRepositoryURI") != repo
                  or claims.get("sourceRepositoryRef") != "refs/heads/dev"
                  or claims.get("sourceRepositoryDigest") != source
                  or claims.get("buildConfigURI") != build
                  or claims.get("buildSignerURI") != build
                  or claims.get("runInvocationURI") != runner
              ):
                  continue
              subjects = statement.get("subject")
              if not isinstance(subjects, list) or len(subjects) != 1 or not isinstance(subjects[0], dict):
                  continue
              digest = subjects[0].get("digest")
              if isinstance(digest, dict) and set(digest) == {"sha256"} and digest.get("sha256") == expected_bundle:
                  matches += 1
          if matches != 1:
              raise SystemExit("host-tools attestation certificate/source/run/subject policy failed")
          PY
          handoff="$RUNNER_TEMP/platform-host-tools-handoff.json"
          /usr/bin/python3 -I -B "$inner_root/platform_workflow_input_guard.py" host-tools \
            --output "$handoff" \
            --target-sha "$TARGET_SHA" \
            --host-tools-sha "$HOST_TOOLS_SHA" \
            --artifact-id "$HOST_TOOLS_ARTIFACT_ID" \
            --artifact-name "$HOST_TOOLS_ARTIFACT_NAME" \
            --artifact-size "$artifact_size" \
            --artifact-digest "$outer_digest" \
            --bundle-sha256 "$bundle_sha256" \
            --manifest-sha256 "$manifest_sha256" \
            --capabilities-sha256 "$capabilities_sha256" \
            --files-contract-sha256 "$files_contract_sha256" \
            --modes-contract-sha256 "$modes_contract_sha256" \
            --signer-workflow "StrayForest/old_sparky/.github/workflows/platform-production-deploy.yml" \
            --source-ref refs/heads/dev \
            --source-digest "$TARGET_SHA" \
            --attestation-run-id "$GITHUB_RUN_ID" \
            --attestation-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --attestation-job-id "$build_job_id"
          expected_owner="$(id -u)"
          test "$(stat -c '%F:%u:%h:%a' -- "$handoff")" = "regular file:${expected_owner}:1:600"
          /usr/bin/python3 -I -B "$inner_root/platform_workflow_input_guard.py" host-tools \
            --input "$handoff" >/dev/null
          /usr/bin/python3 - "$handoff" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="ascii"))
          with Path(sys.argv[2]).open("a", encoding="ascii") as output:
              for key in (
                  "artifact_id", "artifact_name", "artifact_size", "artifact_digest",
                  "bundle_sha256", "manifest_sha256", "capabilities_sha256",
                  "files_contract_sha256", "modes_contract_sha256", "signer_workflow",
                  "source_ref", "source_digest", "attestation_run_id",
                  "attestation_run_attempt", "attestation_job_id",
              ):
                  output.write(f"{key}={payload[key]}\n")
          PY

      - name: Publish closed host-tools handoff
        id: publish-host-tools-handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-host-tools-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-host-tools-handoff.json
          if-no-files-found: error
          retention-days: 14

      - name: Probe immutable host dispatcher capabilities
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${PROD_SSH_HOST:-}" && test -n "${PROD_SSH_USER:-}" && test -n "${PROD_SSH_KEY:-}"
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          expected_generation="/opt/oldsparky/platform/shared/host-tools/$HOST_TOOLS_SHA"
          expected_dispatcher="$expected_generation/platform_workflow_remote_dispatch.py"
          test "$HOST_TOOLS_GENERATION" = "$expected_generation"
          test "$HOST_TOOLS_DISPATCHER" = "$expected_dispatcher"
          test -d "$HOST_TOOLS_SSH_DIR" && test ! -L "$HOST_TOOLS_SSH_DIR"
          test "$(stat -c '%F:%a' -- "$HOST_TOOLS_SSH_DIR")" = "directory:700"
          test "$(stat -c '%u:%g' -- "$HOST_TOOLS_SSH_DIR")" = "$(id -u):$(id -g)"
          test -f "$HOST_TOOLS_SSH_DIR/config" && test ! -L "$HOST_TOOLS_SSH_DIR/config"
          test -f "$HOST_TOOLS_SSH_DIR/known_hosts" && test ! -L "$HOST_TOOLS_SSH_DIR/known_hosts"
          test -f "$HOST_TOOLS_SSH_DIR/id_ed25519" && test ! -L "$HOST_TOOLS_SSH_DIR/id_ed25519"
          test "$(stat -c '%F:%h:%a' -- "$HOST_TOOLS_SSH_DIR/config")" = "regular file:1:600"
          test "$(stat -c '%F:%h:%a' -- "$HOST_TOOLS_SSH_DIR/known_hosts")" = "regular file:1:600"
          test "$(stat -c '%F:%h:%a' -- "$HOST_TOOLS_SSH_DIR/id_ed25519")" = "regular file:1:600"
          remote=(ssh -n -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$HOST_TOOLS_SSH_DIR/config" -i "$HOST_TOOLS_SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST")
          probe_output="$RUNNER_TEMP/platform-host-capabilities-output"
          expected_output="HOST_TOOLS schema=1 source_sha=$HOST_TOOLS_SHA generation=$HOST_TOOLS_SHA dispatcher=3 artifact_prepare=2 supervisor=3 input_guard=1 release_baseline=1 python_isolated=1 python_bytecode_disabled=1"
          expected_bytes="$(printf '%s\n' "$expected_output" | wc -c | tr -d '[:space:]')"
          expected_sha256="$(printf '%s\n' "$expected_output" | sha256sum | cut -d' ' -f1)"
          # The file-size limit bounds the remote process, while ``head`` caps
          # retained stdout at 512 bytes. The dispatcher emits one short, fixed
          # line; anything larger fails closed instead of being retained or
          # projected to logs.
          probe_rc=0
          if (
            ulimit -f 1
            exec /usr/bin/timeout --signal=TERM --kill-after=2s 15s \
              "${remote[@]}" /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" host-capabilities
          ) 2>/dev/null < /dev/null | /usr/bin/head -c 512 > "$probe_output"; then
            :
          else
            probe_rc="$?"
          fi
          probe_file_ok=0
          if [[ -f "$probe_output" && ! -L "$probe_output" ]] \
            && [[ "$(stat -c '%F:%h' -- "$probe_output")" == "regular file:1" ]]; then
            probe_file_ok=1
          fi
          if [[ "$probe_file_ok" -eq 1 ]]; then
            actual_bytes="$(LC_ALL=C wc -c < "$probe_output" | tr -d '[:space:]')"
            actual_sha256="$(sha256sum -- "$probe_output" | cut -d' ' -f1)"
            actual_cr_count="$(LC_ALL=C tr -cd '\r' < "$probe_output" | wc -c | tr -d '[:space:]')"
            actual_lf_count="$(LC_ALL=C tr -cd '\n' < "$probe_output" | wc -c | tr -d '[:space:]')"
          else
            actual_bytes=0
            actual_sha256="$(printf '' | sha256sum | cut -d' ' -f1)"
            actual_cr_count=0
            actual_lf_count=0
          fi
          exact_one_line=0
          if [[ "$actual_cr_count" -eq 0 && "$actual_lf_count" -eq 1 ]]; then
            exact_one_line=1
          fi
          probe_match=0
          if [[ "$probe_file_ok" -eq 1 && "$actual_bytes" -le 512 ]] \
            && printf '%s\n' "$expected_output" | cmp -s - "$probe_output"; then
            probe_match=1
          fi
          if [[ "$probe_rc" -ne 0 || "$probe_file_ok" -ne 1 || "$actual_bytes" -gt 512 || "$probe_match" -ne 1 ]]; then
            printf 'immutable host capability probe diagnostics: command_rc=%s expected_bytes=%s actual_bytes=%s expected_sha256=%s actual_sha256=%s expected_cr_count=0 actual_cr_count=%s expected_lf_count=1 actual_lf_count=%s exact_one_line=%s\n' \
              "$probe_rc" "$expected_bytes" "$actual_bytes" "$expected_sha256" \
              "$actual_sha256" "$actual_cr_count" "$actual_lf_count" "$exact_one_line" >&2
            exit 1
          fi

      - name: Read active production baseline for reconciliation
        id: active-baseline
        if: ${{ inputs.mode == 'baseline-reconcile' || inputs.mode == 'recovery-deploy' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${PROD_SSH_HOST:-}" && test -n "${PROD_SSH_USER:-}" && test -n "${PROD_SSH_KEY:-}"
          remote=(ssh -n -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$HOST_TOOLS_SSH_DIR/config" -i "$HOST_TOOLS_SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST")
          baseline_output="$RUNNER_TEMP/platform-active-release-baseline.json"
          remote_status=0
          if (
            ulimit -f 16
            exec /usr/bin/timeout --signal=TERM --kill-after=2s 15s \
              "${remote[@]}" /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" host-release-baseline
          ) 2>/dev/null < /dev/null | /usr/bin/head -c 4097 > "$baseline_output"; then
            :
          else
            remote_status="$?"
          fi
          test "$remote_status" = 0 || { echo "Immutable host baseline query failed." >&2; exit 1; }
          test "$(stat -c '%F:%h:%a' -- "$baseline_output")" = "regular file:1:600" || {
            echo "Immutable host baseline output file is unsafe." >&2; exit 1;
          }
          /usr/bin/python3 - "$baseline_output" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          source, output = map(Path, sys.argv[1:])
          raw = source.read_bytes()
          keys = {
              "schema", "source_sha", "release_slug", "release_json_sha256",
              "current_link_dev", "current_link_ino", "release_dev", "release_ino",
              "pending_operation",
          }
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate key")
                  result[key] = value
              return result
          if len(raw) > 4096 or not raw.endswith(b"\n"):
              raise SystemExit("immutable host baseline response is oversized or malformed")
          try:
              value = json.loads(raw.decode("ascii"), object_pairs_hook=unique_object)
          except (UnicodeError, json.JSONDecodeError, ValueError):
              raise SystemExit("immutable host baseline response is malformed") from None
          if (
              not isinstance(value, dict) or set(value) != keys
              or type(value.get("schema")) is not int or value["schema"] != 1
              or not isinstance(value.get("source_sha"), str)
              or re.fullmatch(r"[0-9a-f]{40}", value["source_sha"]) is None
              or not isinstance(value.get("release_slug"), str)
              or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,179}", value["release_slug"]) is None
              or not isinstance(value.get("release_json_sha256"), str)
              or re.fullmatch(r"[0-9a-f]{64}", value["release_json_sha256"]) is None
              or any(type(value.get(field)) is not int or value[field] < 0 for field in (
                  "current_link_dev", "release_dev"
              ))
              or any(type(value.get(field)) is not int or value[field] <= 0 for field in (
                  "current_link_ino", "release_ino"
              ))
              or value.get("pending_operation") is not False
          ):
              raise SystemExit("immutable host baseline response does not match the closed contract")
          compact = json.dumps(value, sort_keys=True, separators=(",", ":"))
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"identity={compact}\n")
          source.unlink()
          PY

      - name: Remove host capability verifier material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/platform-host-tools-artifact.zip" \
            "$RUNNER_TEMP/host-tools-final-artifact.zip" \
            "$RUNNER_TEMP/host-tools-final-artifact-metadata.json" \
            "$RUNNER_TEMP/host-tools-attestation.json" \
            "$RUNNER_TEMP/host-tools-build-jobs.json" \
            "$RUNNER_TEMP/platform-host-tools-handoff.json" \
            "$RUNNER_TEMP/platform-host-capabilities-output"
          rm -f -- "$RUNNER_TEMP/host-tools-remote-entries.b64" "$RUNNER_TEMP/host-tools-remote-entries" \
            "$RUNNER_TEMP/platform-host-tools-expected-members" "$RUNNER_TEMP/platform-host-tools-actual-members"
          rm -rf -- "$RUNNER_TEMP/host-tools-download" "$RUNNER_TEMP/platform-host-tools-inner"
          ssh_dir="$RUNNER_TEMP/platform-host-capability-ssh"
          if [[ -d "$ssh_dir" && ! -L "$ssh_dir" ]]; then
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$ssh_dir/known_hosts.scan" "$ssh_dir/known_hosts.scan.1" "$ssh_dir/known_hosts.scan.2" "$ssh_dir/config" "$ssh_dir/control.sock" "$ssh_dir/control-master" "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'HOST_TOOLS_SSH_DIR=' >> "$GITHUB_ENV"
  # Candidate checkout and release construction are isolated from the
  # environment-approved deployment jobs.  This job never receives SSH
  # material and only publishes an immutable archive plus provenance.
  validate-active-baseline:
    name: Authenticate active production baseline and cumulative route
    needs:
      - validate-dispatch
      - validate-classifier
      - host-capability-preflight
    if: >-
      !cancelled() &&
      needs.validate-dispatch.result == 'success' &&
      needs.validate-classifier.result == 'success' &&
      needs.host-capability-preflight.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'baseline-reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      statuses: read
    outputs:
      runtime_required: ${{ steps.cumulative.outputs.runtime_required }}
      cumulative_no_op: ${{ steps.cumulative.outputs.cumulative_no_op }}
      cumulative_manifest_sha256: ${{ steps.cumulative.outputs.manifest_sha256 }}
      active_baseline_sha: ${{ steps.cumulative.outputs.active_baseline_sha }}
    env:
      TARGET_SHA: ${{ github.sha }}
      ACTIVE_BASELINE_JSON: ${{ needs.host-capability-preflight.outputs.baseline_identity }}
      INCREMENTAL_MANIFEST_B64: ${{ needs.validate-classifier.outputs.incremental_manifest_b64 }}
      SOURCE_SECURITY_RUN_ID: ${{ inputs.classifier_run_id }}
      SOURCE_SECURITY_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt }}
      AUTODEPLOY_RUN_ID: ${{ inputs.autodeploy_run_id }}
      AUTODEPLOY_RUN_ATTEMPT: ${{ inputs.autodeploy_run_attempt }}
    steps:
      - name: Checkout exact reviewed target for bounded first-parent diff
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate live baseline and reclassify all undelivered paths
        id: cumulative
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- platform)"
          /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class RejectRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  raise URLError("GitHub API redirects are disabled for authenticated metadata requests")

          api_opener = build_opener(RejectRedirect())

          sys.path.insert(0, str(Path.cwd() / "platform"))
          from tools.platform_deploy_baseline import (  # noqa: E402
              DEPLOY_STATUS_CONTEXT,
              active_deployment_status_identity,
              classify_cumulative_baseline,
              validate_active_baseline,
              validate_cumulative_reconcile_route,
          )
          from tools.platform_workflow_provenance import (  # noqa: E402
              ProvenanceError,
              latest_context_status,
              validate_autodeploy_dispatch,
              validate_security_marker,
          )

          api_url = os.environ.get("GITHUB_API_URL", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GH_TOKEN", "")
          target = os.environ.get("TARGET_SHA", "")
          if (api_url != "https://api.github.com" or repository != "StrayForest/old_sparky"
                  or re.fullmatch(r"[0-9a-f]{40}", target) is None or not token):
              raise SystemExit("baseline reconciliation identity is malformed")
          source_run_id = os.environ.get("SOURCE_SECURITY_RUN_ID", "")
          source_attempt = os.environ.get("SOURCE_SECURITY_RUN_ATTEMPT", "")
          auto_run_id = os.environ.get("AUTODEPLOY_RUN_ID", "")
          auto_attempt = os.environ.get("AUTODEPLOY_RUN_ATTEMPT", "")
          decimal_pattern = re.compile(r"[1-9][0-9]{0,31}\Z")
          if any(decimal_pattern.fullmatch(value) is None for value in (
              source_run_id, source_attempt, auto_run_id, auto_attempt
          )):
              raise SystemExit("baseline caller attempt identity is malformed")

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate JSON key")
                  result[key] = value
              return result

          def fetch_json(path, *, limit=4 * 1024 * 1024):
              if not path.startswith("/") or ".." in path.split("/"):
                  raise SystemExit("baseline API path is invalid")
              request = Request(
                  api_url + "/repos/" + repository + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with api_opener.open(request, timeout=20) as response:
                      final_url = urlsplit(response.geturl())
                      if (
                          response.geturl() != request.full_url
                          or final_url.scheme != "https"
                          or final_url.hostname != "api.github.com"
                          or final_url.username is not None
                          or final_url.password is not None
                      ):
                          raise SystemExit("baseline API response URL is not canonical")
                      raw = response.read(limit + 1)
              except (HTTPError, URLError, TimeoutError, OSError):
                  raise SystemExit("baseline GitHub API request failed") from None
              if len(raw) > limit:
                  raise SystemExit("baseline API response exceeded its bound")
              try:
                  return json.loads(raw.decode("utf-8"), object_pairs_hook=unique_object)
              except (UnicodeError, json.JSONDecodeError, ValueError):
                  raise SystemExit("baseline API response is malformed") from None

          def fetch_statuses(commit_sha):
              rows = []
              ids = set()
              for page in range(1, 101):
                  payload = fetch_json(f"/commits/{commit_sha}/statuses?per_page=100&page={page}")
                  if not isinstance(payload, list) or len(payload) > 100:
                      raise SystemExit("baseline deployment statuses are malformed")
                  for row in payload:
                      if not isinstance(row, dict) or type(row.get("id")) is not int or row["id"] <= 0 or row["id"] in ids:
                          raise SystemExit("baseline deployment status identity is duplicated or invalid")
                      ids.add(row["id"])
                      rows.append(row)
                      if len(rows) > 10000:
                          raise SystemExit("baseline deployment status snapshot exceeded its bound")
                  if len(payload) < 100:
                      return rows, True
              raise SystemExit("baseline deployment status pagination exceeded its bound")

          def fetch_jobs(run_id, attempt):
              rows = []
              ids = set()
              expected_total = None
              for page in range(1, 101):
                  payload = fetch_json(
                      f"/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100&page={page}"
                  )
                  if not isinstance(payload, dict) or not isinstance(payload.get("jobs"), list):
                      raise SystemExit("baseline deployment jobs are malformed")
                  page_rows = payload["jobs"]
                  total = payload.get("total_count")
                  if type(total) is not int or not 0 <= total <= 10000 or len(page_rows) > 100:
                      raise SystemExit("baseline deployment job page is malformed")
                  if expected_total is not None and total != expected_total:
                      raise SystemExit("baseline deployment job total changed during pagination")
                  expected_total = total
                  for row in page_rows:
                      if not isinstance(row, dict) or type(row.get("id")) is not int or row["id"] <= 0 or row["id"] in ids:
                          raise SystemExit("baseline deployment job identity is duplicated or invalid")
                      ids.add(row["id"])
                      rows.append(row)
                  if len(page_rows) < 100:
                      break
              else:
                  raise SystemExit("baseline deployment job pagination exceeded its bound")
              if len(rows) != expected_total:
                  raise SystemExit("baseline deployment job pagination is incomplete")
              return rows, True

          try:
              baseline = json.loads(os.environ["ACTIVE_BASELINE_JSON"], object_pairs_hook=unique_object)
              incremental = json.loads(base64.b64decode(
                  os.environ["INCREMENTAL_MANIFEST_B64"], validate=True
              ).decode("utf-8"), object_pairs_hook=unique_object)
          except (KeyError, UnicodeError, json.JSONDecodeError, ValueError):
              raise SystemExit("baseline handoff is malformed") from None
          if not isinstance(baseline, dict) or not isinstance(incremental, dict):
              raise SystemExit("baseline handoff is malformed")

          branch = fetch_json("/branches/dev")
          commit = branch.get("commit") if isinstance(branch, dict) else None
          current_dev = commit.get("sha") if isinstance(commit, dict) else None
          if (branch.get("name") != "dev" if isinstance(branch, dict) else True) or current_dev != target:
              raise SystemExit("target is no longer the exact current dev head")

          first_parent = subprocess.run(
              ["git", "rev-list", "--first-parent", "--max-count=8193", target],
              check=True, capture_output=True, text=True, encoding="ascii",
          ).stdout.splitlines()
          if len(first_parent) > 8192:
              raise SystemExit("baseline first-parent ancestry exceeds its bound")
          baseline_sha = baseline.get("source_sha")
          if not isinstance(baseline_sha, str) or baseline_sha not in first_parent:
              raise SystemExit("active production source is not a bounded first-parent ancestor")

          status_rows, statuses_complete = fetch_statuses(baseline_sha)
          deployment_marker = latest_context_status(
              status_rows, context=DEPLOY_STATUS_CONTEXT, max_age=None
          )
          target_url = deployment_marker.get("target_url")
          try:
              deployment_id, deployment_attempt, _legacy_bare_url = active_deployment_status_identity(
                  target_url, baseline.get("release_slug")
              )
          except ProvenanceError as exc:
              raise SystemExit("active deployment status target is not authenticated") from exc
          workflow = fetch_json("/actions/workflows/platform-production-deploy.yml")
          latest_run = (
              fetch_json(f"/actions/runs/{deployment_id}")
              if _legacy_bare_url else None
          )
          run = fetch_json(f"/actions/runs/{deployment_id}/attempts/{deployment_attempt}")
          jobs, jobs_complete = fetch_jobs(deployment_id, deployment_attempt)
          validate_active_baseline(
              baseline,
              workflow,
              run,
              jobs,
              status_rows,
              expected_target_sha=target,
              current_dev_sha=current_dev,
              first_parent_shas=first_parent,
              statuses_complete=statuses_complete,
              jobs_complete=jobs_complete,
              latest_run=latest_run,
          )

          # Authenticate the original exact push CI marker and its successful
          # automatic dispatch attempt even when cumulative paths do not need
          # the extra runtime-only proof lane.
          security_workflow = fetch_json("/actions/workflows/platform-security.yml")
          source_run = fetch_json(
              f"/actions/runs/{source_run_id}/attempts/{source_attempt}"
          )
          source_status_rows, source_statuses_complete = fetch_statuses(target)
          if not source_statuses_complete:
              raise SystemExit("source security status snapshot is incomplete")
          validate_security_marker(
              security_workflow,
              source_run,
              source_status_rows,
              expected_run_id=int(source_run_id),
              expected_attempt=int(source_attempt),
              expected_target_sha=target,
              expected_run_url=f"https://github.com/{repository}/actions/runs/{source_run_id}",
          )
          auto_workflow = fetch_json("/actions/workflows/platform-production-autodeploy.yml")
          auto_run = fetch_json(
              f"/actions/runs/{auto_run_id}/attempts/{auto_attempt}"
          )
          auto_jobs, auto_jobs_complete = fetch_jobs(auto_run_id, auto_attempt)
          if not auto_jobs_complete:
              raise SystemExit("auto-deploy job snapshot is incomplete")
          validate_autodeploy_dispatch(
              auto_workflow,
              auto_run,
              auto_jobs,
              expected_run_id=int(auto_run_id),
              expected_attempt=int(auto_attempt),
              expected_target_sha=target,
          )

          cumulative_raw = subprocess.run(
              ["git", "diff", "--name-only", "-z", "--no-renames", baseline_sha, target],
              check=True, capture_output=True,
          ).stdout
          try:
              cumulative_paths = [item.decode("utf-8", "strict") for item in cumulative_raw.split(b"\0") if item]
          except UnicodeDecodeError:
              raise SystemExit("cumulative path list contains invalid UTF-8") from None
          cumulative_result = classify_cumulative_baseline(
              incremental, cumulative_paths, expected_target_sha=target
          )
          if not isinstance(cumulative_result, dict) or set(cumulative_result) != {"manifest", "no_op"}:
              raise SystemExit("cumulative classifier result is malformed")
          cumulative = cumulative_result["manifest"]
          cumulative_no_op = cumulative_result["no_op"]
          try:
              reconcile_route = validate_cumulative_reconcile_route(cumulative_result)
          except ProvenanceError as exc:
              raise SystemExit(f"cumulative baseline route is not authorized: {exc}") from exc
          manifest_bytes = json.dumps(
              cumulative, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              runtime_required = reconcile_route["runtime_required"]
              output.write(f"runtime_required={str(runtime_required).lower()}\n")
              output.write(f"cumulative_no_op={str(cumulative_no_op).lower()}\n")
              output.write(f"manifest_sha256={hashlib.sha256(manifest_bytes).hexdigest()}\n")
              output.write(f"active_baseline_sha={baseline_sha}\n")
          print("Authenticated exact source CI, auto-dispatch, live baseline, and cumulative classifier route.")
          PY

      - name: Remove target checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          target_source="$GITHUB_WORKSPACE"
          test "$(git -C "$target_source" rev-parse HEAD)" = "$TARGET_SHA"
          git -C "$target_source" status --porcelain=v1 --untracked-files=all -- platform

  validate-recovery-baseline:
    name: Authenticate exact report-only failed release and active baseline
    needs:
      - validate-dispatch
      - validate-classifier
      - host-capability-preflight
    if: >-
      !cancelled() &&
      needs.validate-dispatch.result == 'success' &&
      needs.validate-classifier.result == 'success' &&
      needs.host-capability-preflight.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'recovery-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
      statuses: read
    outputs:
      active_baseline_sha: ${{ steps.verify_recovery.outputs.active_baseline_sha }}
      failed_release_json_sha256: ${{ steps.verify_recovery.outputs.failed_release_json_sha256 }}
      cumulative_manifest_sha256: ${{ steps.verify_recovery.outputs.cumulative_manifest_sha256 }}
      cumulative_no_op: ${{ steps.verify_recovery.outputs.cumulative_no_op }}
      runtime_required: ${{ steps.verify_recovery.outputs.runtime_required }}
      source_security_attempt_url: ${{ steps.verify_recovery.outputs.source_security_attempt_url }}
    env:
      TARGET_SHA: ${{ github.sha }}
      FAILED_RUN_ID: ${{ inputs.failed_deploy_run_id }}
      FAILED_RUN_ATTEMPT: ${{ inputs.failed_deploy_run_attempt }}
      CONFIRMATION: ${{ inputs.report_only_confirmation }}
      ACTIVE_BASELINE_JSON: ${{ needs.host-capability-preflight.outputs.baseline_identity }}
      INCREMENTAL_MANIFEST_B64: ${{ needs.validate-classifier.outputs.incremental_manifest_b64 }}
    steps:
      - name: Checkout exact reviewed recovery target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect bounded exact failed-attempt API evidence
        id: failed_attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SECURITY_RUN_ID: ${{ inputs.classifier_run_id }}
          SOURCE_SECURITY_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 - "$RUNNER_TEMP/recovery-proof" "$GH_TOKEN" "$GITHUB_API_URL" "$GITHUB_REPOSITORY" "$FAILED_RUN_ID" "$FAILED_RUN_ATTEMPT" "$TARGET_SHA" "$SOURCE_SECURITY_RUN_ID" "$SOURCE_SECURITY_RUN_ATTEMPT" <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          output, token, api, repo, run_id, attempt, target, security_id, security_attempt = sys.argv[1:]
          sys.path.insert(0, str(Path.cwd() / "platform"))
          from tools.platform_workflow_provenance import collect_github_api_pages
          if (api != "https://api.github.com" or repo != "StrayForest/old_sparky"
              or re.fullmatch(r"[1-9][0-9]{0,31}", run_id) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", attempt) is None
              or re.fullmatch(r"[0-9a-f]{40}", target) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", security_id) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", security_attempt) is None or not token):
              raise SystemExit("recovery evidence identity is malformed")
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  raise URLError("redirect rejected")
          opener = build_opener(NoRedirect())
          root = Path(output)
          root.mkdir(mode=0o700)
          def fetch(path: str, limit: int = 8 * 1024 * 1024) -> dict:
              if not path.startswith("/") or ".." in path.split("/"):
                  raise SystemExit("recovery API path is invalid")
              request = Request(api + "/repos/" + repo + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with opener.open(request, timeout=20) as response:
                      if response.geturl() != request.full_url:
                          raise SystemExit("recovery API URL changed")
                      raw = response.read(limit + 1)
              except (HTTPError, URLError, TimeoutError, OSError):
                  raise SystemExit("recovery API request failed") from None
              if len(raw) > limit:
                  raise SystemExit("recovery API response exceeded its bound")
              try:
                  value = json.loads(raw)
              except (UnicodeError, json.JSONDecodeError):
                  raise SystemExit("recovery API response is malformed") from None
              if not isinstance(value, dict):
                  raise SystemExit("recovery API object is malformed")
              return value
          def pages(path: str, key: str, *, rows_limit: int = 10000) -> list[dict]:
              def fetch_page(page: int):
                  separator = "&" if "?" in path else "?"
                  return fetch_raw(f"{path}{separator}per_page=100&page={page}")
              try:
                  return list(collect_github_api_pages(
                      fetch_page, collection_key=key, rows_limit=rows_limit,
                  ))
              except ValueError as exc:
                  raise SystemExit("recovery API pagination failed closed") from exc
          def fetch_raw(path: str, limit: int = 8 * 1024 * 1024):
              if not path.startswith("/") or ".." in path.split("/"):
                  raise SystemExit("recovery API path is invalid")
              request = Request(api + "/repos/" + repo + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with opener.open(request, timeout=20) as response:
                      if response.geturl() != request.full_url:
                          raise SystemExit("recovery API URL changed")
                      raw = response.read(limit + 1)
              except (HTTPError, URLError, TimeoutError, OSError):
                  raise SystemExit("recovery API request failed") from None
              if len(raw) > limit:
                  raise SystemExit("recovery API response exceeded its bound")
              try:
                  return json.loads(raw)
              except (UnicodeError, json.JSONDecodeError):
                  raise SystemExit("recovery API response is malformed") from None
          workflow = fetch("/actions/workflows/platform-production-deploy.yml")
          run = fetch(f"/actions/runs/{run_id}/attempts/{attempt}")
          jobs = pages(f"/actions/runs/{run_id}/attempts/{attempt}/jobs", "jobs")
          source = run.get("head_sha")
          if not isinstance(source, str) or re.fullmatch(r"[0-9a-f]{40}", source) is None:
              raise SystemExit("failed deployment source is malformed")
          statuses = pages(f"/commits/{source}/statuses", "statuses")
          security_workflow = fetch("/actions/workflows/platform-security.yml")
          security_run = fetch(f"/actions/runs/{security_id}/attempts/{security_attempt}")
          security_source = security_run.get("head_sha")
          if not isinstance(security_source, str):
              raise SystemExit("source security target is malformed")
          security_jobs = pages(f"/actions/runs/{security_id}/attempts/{security_attempt}/jobs", "jobs")
          security_statuses = pages(f"/commits/{security_source}/statuses", "statuses")
          current_dev = fetch("/git/ref/heads/dev")
          artifacts = pages(f"/actions/runs/{run_id}/artifacts", "artifacts")
          expected_name = f"platform-release-artifact-{run_id}-{attempt}"
          matches = [row for row in artifacts if isinstance(row, dict) and row.get("name") == expected_name]
          if len(matches) != 1:
              raise SystemExit("failed deployment release artifact is missing or ambiguous")
          artifact = matches[0]
          artifact_run = artifact.get("workflow_run")
          artifact_list_id = artifact.get("id")
          artifact_list_digest = artifact.get("digest")
          artifact_list_size = artifact.get("size_in_bytes")
          if (not isinstance(artifact_run, dict)
              or type(artifact_list_id) is not int or artifact_list_id <= 0
              or not isinstance(artifact_list_digest, str)
              or re.fullmatch(r"sha256:[0-9a-f]{64}", artifact_list_digest) is None
              or type(artifact_list_size) is not int or not 0 < artifact_list_size <= 2 * 1024 * 1024 * 1024
              or ("run_attempt" in artifact_run and artifact_run.get("run_attempt") != int(attempt))):
              raise SystemExit("failed deployment artifact run binding is malformed")
          if (artifact.get("expired") is not False or artifact_run.get("id") != int(run_id)
              or artifact_run.get("head_sha") != source):
              raise SystemExit("failed deployment release artifact is not run-bound")
          metadata = fetch(f"/actions/artifacts/{artifact.get('id')}")
          artifact_id = metadata.get("id")
          artifact_digest = metadata.get("digest")
          artifact_size = metadata.get("size_in_bytes")
          if (type(artifact_id) is not int or artifact_id <= 0 or artifact_id > 10**32 - 1
              or not isinstance(artifact_digest, str)
              or re.fullmatch(r"sha256:[0-9a-f]{64}", artifact_digest) is None
              or type(artifact_size) is not int or not 0 < artifact_size <= 2 * 1024 * 1024 * 1024):
              raise SystemExit("failed deployment artifact output fields are malformed")
          if (metadata.get("id") != artifact.get("id") or metadata.get("name") != expected_name
              or metadata.get("expired") is not False or metadata.get("digest") != artifact.get("digest")
              or ("run_attempt" in metadata.get("workflow_run", {})
                  and metadata["workflow_run"].get("run_attempt") != int(attempt))
              or metadata.get("workflow_run", {}).get("id") != int(run_id)
              or metadata.get("workflow_run", {}).get("head_sha") != source
              or metadata.get("size_in_bytes") != artifact.get("size_in_bytes")):
              raise SystemExit("failed deployment artifact metadata changed")
          for name, value in (("workflow.json", workflow), ("run.json", run),
                              ("jobs.json", {"jobs": jobs}), ("statuses.json", {"statuses": statuses}),
                              ("artifact.json", metadata), ("security-workflow.json", security_workflow),
                              ("security-run.json", security_run), ("security-jobs.json", {"jobs": security_jobs}),
                              ("security-statuses.json", {"statuses": security_statuses}),
                              ("dev-ref.json", current_dev)):
              path = root / name
              path.write_text(json.dumps(value, sort_keys=True, separators=(",", ":")), encoding="utf-8")
              os.chmod(path, 0o600)
          job_matches = [job for job in jobs if isinstance(job, dict) and job.get("name") == "Deploy production"]
          if len(job_matches) != 1:
            raise SystemExit("failed production job identity is missing or ambiguous")
          failed_job = job_matches[0]
          if (type(failed_job.get("id")) is not int or failed_job["id"] <= 0
              or type(failed_job.get("run_id")) is not int or failed_job["run_id"] != int(run_id)
              or failed_job.get("head_sha") != source
              or ("run_attempt" in failed_job
                  and (type(failed_job.get("run_attempt")) is not int
                       or failed_job.get("run_attempt") != int(attempt)))):
              raise SystemExit("failed production job is not bound to the exact failed attempt")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="ascii") as stream:
              stream.write(f"source_sha={source}\n")
              stream.write(f"artifact_id={artifact_id}\n")
              stream.write(f"artifact_digest={artifact_digest}\n")
              stream.write(f"artifact_size={artifact_size}\n")
              stream.write(f"deploy_job_id={failed_job['id']}\n")
          PY

      - name: Download authenticated failed-job and release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ "${{ steps.failed_attempt.outputs.artifact_id }}" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "${{ steps.failed_attempt.outputs.artifact_size }}" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "${{ steps.failed_attempt.outputs.deploy_job_id }}" =~ ^[1-9][0-9]{0,31}$ ]]
          curl --fail-with-body --silent --show-error --location --max-filesize 16777216 \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/jobs/${{ steps.failed_attempt.outputs.deploy_job_id }}/logs" \
            --output "$RUNNER_TEMP/recovery-proof/failed-job-logs.txt"
          curl --fail-with-body --silent --show-error --location --max-filesize 2147483648 \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ steps.failed_attempt.outputs.artifact_id }}/zip" \
            --output "$RUNNER_TEMP/recovery-proof/release-artifact.zip"

      - name: Validate failed marker, report-only diagnostic, signed release, and live baseline
        id: verify_recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_SOURCE_SHA: ${{ steps.failed_attempt.outputs.source_sha }}
          FAILED_ARTIFACT_ID: ${{ steps.failed_attempt.outputs.artifact_id }}
          FAILED_ARTIFACT_DIGEST: ${{ steps.failed_attempt.outputs.artifact_digest }}
          FAILED_ARTIFACT_SIZE: ${{ steps.failed_attempt.outputs.artifact_size }}
          SOURCE_SECURITY_RUN_ID: ${{ inputs.classifier_run_id }}
          SOURCE_SECURITY_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          proof="$RUNNER_TEMP/recovery-proof"
          /usr/bin/python3 platform/tools/platform_workflow_provenance.py failed-deployment \
            --workflow "$proof/workflow.json" --run "$proof/run.json" \
            --status "$proof/statuses.json" --jobs "$proof/jobs.json" \
            --expected-run-id "$FAILED_RUN_ID" --expected-attempt "$FAILED_RUN_ATTEMPT" \
            --expected-target-sha "$FAILED_SOURCE_SHA" \
            --remote-log-text "$proof/failed-job-logs.txt" >/dev/null
          failed_slug="gha-${FAILED_RUN_ID}-${FAILED_RUN_ATTEMPT}-${FAILED_SOURCE_SHA:0:12}"
          outer="$proof/release-artifact.zip"
          artifact_meta="$proof/artifact.json"
          /usr/bin/python3 - "$outer" "$artifact_meta" "$FAILED_ARTIFACT_DIGEST" "$FAILED_ARTIFACT_SIZE" "$failed_slug" "$FAILED_SOURCE_SHA" "$proof" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import zipfile

          outer, metadata_path, digest, size, slug, source, destination = sys.argv[1:]
          outer_path = Path(outer)
          before = outer_path.lstat()
          metadata = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          expected = str(metadata.get("digest", ""))
          if not expected.startswith("sha256:") or digest != expected or re.fullmatch(r"sha256:[0-9a-f]{64}", expected) is None:
              raise SystemExit("failed artifact digest metadata is invalid")
          if type(metadata.get("size_in_bytes")) is not int or str(metadata["size_in_bytes"]) != size or before.st_size != metadata["size_in_bytes"]:
              raise SystemExit("failed artifact size does not match GitHub metadata")
          if not stat.S_ISREG(before.st_mode) or stat.S_ISLNK(before.st_mode) or before.st_nlink != 1:
              raise SystemExit("failed artifact archive metadata is unsafe")
          outer_digest = hashlib.sha256()
          with outer_path.open("rb") as outer_stream:
              for chunk in iter(lambda: outer_stream.read(1024 * 1024), b""):
                  outer_digest.update(chunk)
          if outer_digest.hexdigest() != expected.removeprefix("sha256:"):
              raise SystemExit("failed artifact archive digest mismatch")
          expected_names = {f"{slug}.tar.gz", f"{slug}.tar.gz.sha256", "RELEASE.provenance.json"}
          try:
              with zipfile.ZipFile(outer_path, "r", allowZip64=False) as archive:
                  infos = archive.infolist()
                  if {item.filename for item in infos} != expected_names or len(infos) != 3:
                      raise SystemExit("failed release artifact inventory is not exact")
                  members = {}
                  for info in infos:
                      kind = (info.external_attr >> 16) & 0o170000
                      if info.is_dir() or kind not in {0, stat.S_IFREG} or info.file_size > 2 * 1024 * 1024 * 1024:
                          raise SystemExit("failed release artifact member is unsafe")
                      if info.filename != f"{slug}.tar.gz":
                          members[info.filename] = archive.read(info)
                      else:
                          tar_path = Path(destination) / info.filename
                          fd = os.open(tar_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                          member_digest = hashlib.sha256()
                          written = 0
                          try:
                              with archive.open(info, "r") as member_stream:
                                  while True:
                                      chunk = member_stream.read(1024 * 1024)
                                      if not chunk:
                                          break
                                      written += len(chunk)
                                      if written > info.file_size:
                                          raise SystemExit("failed release artifact member exceeded its size")
                                      member_digest.update(chunk)
                                      view = memoryview(chunk)
                                      while view:
                                          count = os.write(fd, view)
                                          if count <= 0:
                                              raise SystemExit("failed release artifact staging failed")
                                          view = view[count:]
                              if written != info.file_size:
                                  raise SystemExit("failed release artifact member was truncated")
                              os.fsync(fd)
                          finally:
                              os.close(fd)
                          members[info.filename] = (member_digest.hexdigest(), written)
          except (OSError, zipfile.BadZipFile, zipfile.LargeZipFile):
              raise SystemExit("failed release artifact archive is invalid") from None
          tar_name = f"{slug}.tar.gz"
          tar_sha, tar_size = members[tar_name]
          if members[f"{tar_name}.sha256"].decode("ascii", "strict") != f"{tar_sha}  {tar_name}\n":
              raise SystemExit("failed release artifact checksum contract is invalid")
          provenance = json.loads(members["RELEASE.provenance.json"])
          if set(provenance) != {"schema", "artifact_file", "artifact_sha256", "source_git_commit"} or provenance.get("schema") != 1 or provenance.get("artifact_file") != tar_name or provenance.get("artifact_sha256") != tar_sha or provenance.get("source_git_commit") != source:
              raise SystemExit("failed release provenance does not bind the exact run")
          tar_path = Path(destination) / tar_name
          if not tar_path.is_file() or tar_path.is_symlink() or tar_path.stat().st_size != tar_size:
              raise SystemExit("failed release artifact tar staging is unsafe")
          checksum_path = Path(destination) / f"{tar_name}.sha256"
          checksum_path.write_bytes(members[f"{tar_name}.sha256"])
          os.chmod(checksum_path, 0o600)
          print(f"release_archive={tar_path}")
          PY
          release_archive="$proof/$failed_slug.tar.gz"
          FAILED_RELEASE_JSON_SHA256="$(/usr/bin/python3 - "$release_archive" "$failed_slug" "$FAILED_SOURCE_SHA" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import tarfile
          sys.path.insert(0, str(Path.cwd() / "platform"))
          from tools.platform_validate_release_artifact import validate_archive
          archive_path, slug, source = sys.argv[1:]
          release = validate_archive(Path(archive_path), release_slug=slug)
          if release.get("source_git_commit") != source:
              raise SystemExit("signed failed release archive source mismatch")
          with tarfile.open(archive_path, "r:gz") as archive:
              member = archive.getmember(f"{slug}/RELEASE.json")
