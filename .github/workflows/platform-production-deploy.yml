name: Platform production deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run production preflight only or perform the full immutable deployment"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy
      runtime_profile:
        description: "Reviewed runtime capacity profile to apply after deployment"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - ready-vote-static-4
          - ready-vote-static-6
          - ready-vote-static-8
          - ready-vote-cprofile
          - ready-vote-static-12
          - ready-vote-static-16
          - ready-vote-adaptive-v2
          - api-3x16
          - api-1x48
          - read-mix-cprofile
          - authenticated-read-admission-32
          - authenticated-read-admission-24x8
          - pool-pre-ping-off
          - web-ssr-diagnostics
          - web-ssr-native-transport
          - web-ssr-workers-2
          - uvicorn-classic
          - uvicorn-optimized
          - api-pool-12
          - api-pool-16
          - api-pool-20
          - api-pool-24
      web_compression:
        description: "Build the Next.js artifact with response compression enabled or disabled"
        required: true
        default: enabled
        type: choice
        options:
          - enabled
          - disabled
      classifier_run_id:
        description: "Exact successful security workflow run supplying the classifier artifact"
        required: false
        default: ""
        type: string
      classifier_run_attempt:
        description: "Exact attempt number for the classifier workflow run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  # This job may execute the candidate checkout.  It has no production
  # environment and no deployment secret.  It is deliberately always
  # scheduled: an invalid mode must fail here before either mode branch can
  # become a successful skipped no-op.
  validate-dispatch:
    name: Validate deployment dispatch
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: ${{ inputs.mode }}
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      RELEASE_SLUG: gha-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Reject invalid dispatch values before mode branches
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE" in
            preflight|deploy) ;;
            *) echo "Unsupported deployment mode; refusing a green no-op." >&2; exit 1 ;;
          esac
          case "$RUNTIME_PROFILE" in
            baseline|ready-vote-static-4|ready-vote-static-6|ready-vote-static-8|ready-vote-cprofile|ready-vote-static-12|ready-vote-static-16|ready-vote-adaptive-v2|api-3x16|api-1x48|read-mix-cprofile|authenticated-read-admission-32|authenticated-read-admission-24x8|pool-pre-ping-off|web-ssr-diagnostics|web-ssr-native-transport|web-ssr-workers-2|uvicorn-classic|uvicorn-optimized|api-pool-12|api-pool-16|api-pool-20|api-pool-24) ;;
            *) echo "Unsupported runtime profile." >&2; exit 1 ;;
          esac
          case "$WEB_COMPRESSION" in enabled|disabled) ;; *) echo "Unsupported web compression mode." >&2; exit 1 ;; esac
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Deployment requires an exact target SHA." >&2; exit 1; }
          [[ "$CLASSIFIER_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] || { echo "Classifier run ID is malformed." >&2; exit 1; }
          [[ "$CLASSIFIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]] || { echo "Classifier run attempt is malformed." >&2; exit 1; }

      - name: Checkout dispatch validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate and create closed deployment handoff
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:12}"
          candidate_release_slug="${RELEASE_SLUG:0:32}-${short_sha}"
          # The candidate parser is used only on this secret-free runner.  All
          # secret-bearing consumers independently validate the JSON schema.
          /usr/bin/python3 platform/tools/platform_workflow_input_guard.py deployment \
            --output "$RUNNER_TEMP/platform-production-deploy-input.json" \
            --mode "$DEPLOY_MODE" \
            --runtime-profile "$RUNTIME_PROFILE" \
            --release-slug "$candidate_release_slug" \
            --target-sha "$TARGET_SHA" \
            --artifact-remote-dir "$ARTIFACT_REMOTE_DIR" \
            --classifier-run-id "$CLASSIFIER_RUN_ID" \
            --classifier-run-attempt "$CLASSIFIER_RUN_ATTEMPT" \
            --web-compression "$WEB_COMPRESSION"
          test "$(stat -c '%a' "$RUNNER_TEMP/platform-production-deploy-input.json")" = 600

      - name: Publish closed deployment handoff
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-deploy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-production-deploy-input.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove validator handoff
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/platform-production-deploy-input.json"
          test ! -e "$RUNNER_TEMP/platform-production-deploy-input.json"

  # Validate the exact classifier data on a fresh, secret-free runner before
  # the expensive candidate build.  The trusted validator is checked out from
  # the immutable default-branch commit; the deployment candidate is never run.
  validate-classifier:
    name: Validate exact classifier artifact before build
    needs: validate-dispatch
    if: >-
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
    steps:
      - name: Resolve immutable default-branch classifier source
        id: trusted_classifier_default
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: dev
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_REF" = "refs/heads/dev"
          trusted_ref="$RUNNER_TEMP/platform-trusted-classifier-ref.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRUSTED_BRANCH}" \
            --output "$trusted_ref"
          /usr/bin/python3 - "$trusted_ref" "$GITHUB_OUTPUT" "$TRUSTED_BRANCH" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branch = sys.argv[3]
          obj = payload.get("object") if isinstance(payload, dict) else None
          sha = obj.get("sha") if isinstance(obj, dict) else None
          if (
              payload.get("ref") != f"refs/heads/{branch}"
              or not isinstance(obj, dict)
              or obj.get("type") != "commit"
              or not isinstance(sha, str)
              or re.fullmatch(r"[0-9a-f]{40}", sha) is None
          ):
              raise SystemExit("trusted classifier source is not an immutable commit")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
          rm -f -- "$trusted_ref"
      - name: Checkout trusted classifier validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.trusted_classifier_default.outputs.sha }}
          path: trusted-classifier
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact classifier artifact before candidate build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          trusted_tool="$trusted_root/platform/tools/platform_production_classifier_artifact.py"
          test -f "$trusted_tool" && test ! -L "$trusted_tool"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "${{ steps.trusted_classifier_default.outputs.sha }}"
          expected_name="platform-ci-route-${CLASSIFIER_RUN_ID}-${CLASSIFIER_RUN_ATTEMPT}"
          route_dir="$(mktemp -d "$RUNNER_TEMP/platform-ci-route.XXXXXX")"
          trap 'rm -rf -- "$route_dir"' EXIT
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          fetch_classifier_artifacts() {
            local pages_dir="$1" page=1 summary count total expected_total=""
            install -d -m 700 "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail --silent --show-error --location \
                --max-filesize 4194304 \
                "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CLASSIFIER_RUN_ID}/artifacts?per_page=100&page=${page}" \
                --output "$page_path"
              chmod 600 "$page_path"
              summary="$(/usr/bin/python3 "$trusted_tool" page "$page_path")"
              [[ "$summary" =~ ^count=([0-9]+)\ total=([0-9]+)$ ]] || {
                echo "classifier artifact pagination summary is malformed" >&2
                exit 1
              }
              count="${BASH_REMATCH[1]}"
              total="${BASH_REMATCH[2]}"
              if [[ -n "$expected_total" ]]; then
                test "$total" = "$expected_total" || {
                  echo "classifier artifact total changed during pagination" >&2
                  exit 1
                }
              else
                expected_total="$total"
              fi
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 100 )) || {
                echo "classifier artifact pagination exceeded its bound" >&2
                exit 1
              }
            done
          }
          first_pages="$route_dir/artifacts-first"
          second_pages="$route_dir/artifacts-second"
          fetch_classifier_artifacts "$first_pages"
          fetch_classifier_artifacts "$second_pages"
          artifact_id="$(
            /usr/bin/python3 "$trusted_tool" metadata \
              "$first_pages" "$second_pages" \
              --expected-name "$expected_name" \
              --run-id "$CLASSIFIER_RUN_ID" \
              --run-attempt "$CLASSIFIER_RUN_ATTEMPT" \
              --target-sha "$TARGET_SHA"
          )"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "classifier artifact id is malformed" >&2
            exit 1
          }
          curl --fail --silent --show-error --location \
            --max-filesize 4194304 \
            "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$route_dir/artifact.zip"
          /usr/bin/python3 "$trusted_tool" manifest "$route_dir/artifact.zip" --target-sha "$TARGET_SHA"
      - name: Remove trusted classifier validator
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          if [[ -d "$trusted_root" && ! -L "$trusted_root" ]]; then
            rm -rf -- "$trusted_root"
          fi
          test ! -e "$trusted_root" && test ! -L "$trusted_root"
  # Candidate checkout and release construction are isolated from the
  # environment-approved deployment jobs.  This job never receives SSH
  # material and only publishes an immutable archive plus provenance.
  build-release:
    name: Build immutable release artifact in CI
    needs:
      - validate-dispatch
      - validate-classifier
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.validate-classifier.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: ${{ inputs.mode }}
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      PLATFORM_WEB_NEXT_COMPRESSION: ${{ inputs.web_compression == 'disabled' && 'false' || 'true' }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      RELEASE_SLUG: gha-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact_id: ${{ steps.publish-release-artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.publish-release-artifact.outputs.artifact-digest }}
    steps:
      - name: Download closed deployment handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-deploy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-input

      - name: Revalidate deployment handoff before candidate build
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" && test ! -L "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          /usr/bin/python3 - "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$TARGET_SHA" "$DEPLOY_MODE" "$RUNTIME_PROFILE" "$WEB_COMPRESSION" "$CLASSIFIER_RUN_ID" "$CLASSIFIER_RUN_ATTEMPT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, target_sha, mode, runtime_profile, web_compression, run_id, attempt = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          expected = {
              "schema", "mode", "runtime_profile", "release_slug", "target_sha",
              "artifact_remote_dir", "classifier_run_id", "classifier_run_attempt",
              "web_compression",
          }
          if set(payload) != expected:
              raise SystemExit("deployment handoff schema is not closed")
          if payload.get("schema") not in (1, "1"):
              raise SystemExit("deployment handoff schema version is invalid")
          if payload.get("mode") != mode or payload.get("mode") != "deploy":
              raise SystemExit("deployment handoff mode is not deploy")
          if payload.get("runtime_profile") != runtime_profile:
              raise SystemExit("deployment handoff runtime profile mismatch")
          if payload.get("web_compression") != web_compression:
              raise SystemExit("deployment handoff compression mismatch")
          if payload.get("target_sha") != target_sha or re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("deployment handoff exact target SHA mismatch")
          if re.fullmatch(r"[1-9][0-9]{0,31}", str(payload.get("classifier_run_id"))) is None or payload.get("classifier_run_id") != run_id:
              raise SystemExit("deployment handoff classifier run mismatch")
          if re.fullmatch(r"[1-9][0-9]{0,31}", str(payload.get("classifier_run_attempt"))) is None or payload.get("classifier_run_attempt") != attempt:
              raise SystemExit("deployment handoff classifier attempt mismatch")
          if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,179}", str(payload.get("release_slug"))) is None:
              raise SystemExit("deployment handoff release slug is unsafe")
          if re.fullmatch(r"/tmp/old-sparky-platform-artifact-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}", str(payload.get("artifact_remote_dir"))) is None:
              raise SystemExit("deployment handoff artifact path is unsafe")
          print("closed deployment handoff accepted for exact target SHA")
          PY

      - name: Checkout reviewed deployment source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require reviewed dev branch for deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" || { echo "Production deploys must target the reviewed dev branch." >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- platform)"

      - name: Build immutable release artifact in CI
        shell: bash
        run: |
          set -euo pipefail
          ci_build_root=/root/old_sparky
          sudo rm -rf -- "$ci_build_root"
          sudo install -d -o root -g root -m 0755 "$ci_build_root"
          sudo cp -a "$GITHUB_WORKSPACE/." "$ci_build_root/"
          sudo chown -R root:root "$ci_build_root"
          sudo env -i \
            HOME=/root \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/python3 -m venv "$ci_build_root/platform/.venv_platform"
          sudo install -d -o root -g root -m 0755 "$ci_build_root/platform/dist/releases"
          sudo env -i \
            HOME=/root \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            PLATFORM_RELEASE_OUTPUT_DIR="$ci_build_root/platform/dist/releases" \
            PLATFORM_WEB_NEXT_COMPRESSION="$PLATFORM_WEB_NEXT_COMPRESSION" \
            "$ci_build_root/platform/tools/platform_build_release.sh" "$RELEASE_SLUG"
          release_archive="$(sudo find "$ci_build_root/platform/dist/releases" -maxdepth 1 -type f -name "${RELEASE_SLUG}-*.tar.gz" -print -quit)"
          test -n "$release_archive" || { echo "CI release artifact was not produced" >&2; exit 1; }
          release_checksum="${release_archive}.sha256"
          sudo test -f "$release_checksum"
          release_output="$GITHUB_WORKSPACE/ci-release"
          rm -rf -- "$release_output"
          install -d -m 0755 "$release_output"
          sudo install -m 0644 "$release_archive" "$release_output/$(basename "$release_archive")"
          sudo install -m 0644 "$release_checksum" "$release_output/$(basename "$release_checksum")"
          sudo chown "$(id -u):$(id -g)" "$release_output/$(basename "$release_archive")" "$release_output/$(basename "$release_checksum")"
          (cd "$release_output" && sha256sum -c "$(basename "$release_checksum")")
          /usr/bin/python3 - "$release_output/$(basename "$release_archive")" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          archive, target_sha = sys.argv[1:]
          archive_path = Path(archive)
          checksum = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if len(target_sha) != 40 or any(character not in "0123456789abcdef" for character in target_sha):
              raise SystemExit("exact target SHA is malformed")
          Path(archive_path.parent / "RELEASE.provenance.json").write_text(
              json.dumps({
                  "schema": 1,
                  "artifact_file": archive_path.name,
                  "artifact_sha256": checksum,
                  "source_git_commit": target_sha,
              }, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish immutable release artifact
        id: publish-release-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest immutable release artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ci-release/*.tar.gz

      - name: Remove candidate build tree
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/ci-release" "$RUNNER_TEMP/deploy-input"

  validate-security-provenance:
    name: Validate exact security provenance
    needs:
      - validate-dispatch
      - build-release
    outputs:
      security_ready: ${{ steps.security_provenance.outputs.security_ready }}
      security_digest: ${{ steps.security_provenance.outputs.security_digest }}
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.build-release.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      statuses: read
    env:
      TARGET_SHA: ${{ github.sha }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      SOURCE_RUN_URL: ${{ inputs.classifier_run_id && format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, inputs.classifier_run_id) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      # This job has a GitHub API token. Resolve the validator from the
      # immutable default-branch commit before checkout; TARGET_SHA is the
      # deployment candidate and must never select executable code here.
      - name: Resolve immutable default-branch provenance source
        id: trusted_default
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: dev
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_REF" = "refs/heads/dev"
          trusted_ref="$RUNNER_TEMP/platform-trusted-default-ref.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRUSTED_BRANCH}" \
            --output "$trusted_ref"
          /usr/bin/python3 - "$trusted_ref" "$GITHUB_OUTPUT" "$TRUSTED_BRANCH" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branch = sys.argv[3]
          expected_ref = f"refs/heads/{branch}"
          obj = payload.get("object") if isinstance(payload, dict) else None
          sha = obj.get("sha") if isinstance(obj, dict) else None
          if payload.get("ref") != expected_ref or not isinstance(obj, dict) or obj.get("type") != "commit":
              raise SystemExit("trusted default branch ref is not an immutable commit")
          if not isinstance(sha, str) or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("trusted default branch commit SHA is malformed")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
          rm -f -- "$trusted_ref"

      - name: Checkout trusted provenance validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.trusted_default.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact security snapshots
        id: security_provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SOURCE_SHA: ${{ steps.trusted_default.outputs.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$(git rev-parse HEAD)" = "$TRUSTED_SOURCE_SHA"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CLASSIFIER_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$CLASSIFIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          provenance_dir="$(mktemp -d "$RUNNER_TEMP/platform-security-provenance.XXXXXX")"
          trap 'rm -rf -- "$provenance_dir"' EXIT
          chmod 700 "$provenance_dir"
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          fetch_statuses() {
            local output_path="$1" page=1 count page_path
            local pages_dir="$output_path.pages"
            case "$pages_dir" in
              "$provenance_dir"/*) ;;
              *) echo "status page directory escaped the ephemeral provenance root" >&2; exit 1 ;;
            esac
            if [[ -e "$pages_dir" || -L "$pages_dir" ]]; then
              rm -rf -- "$pages_dir"
            fi
            install -d -m 700 "$pages_dir"
            test ! -L "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail-with-body --silent --show-error "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100&page=${page}" \
                --output "$page_path"
              count="$(/usr/bin/python3 - "$page_path" <<'PY'
          import json
          from pathlib import Path
          import sys

          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(rows, list) or any(not isinstance(row, dict) for row in rows):
              raise SystemExit("paginated status response is malformed")
          print(len(rows))
          PY
              )"
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 1000 )) || { echo "status pagination exceeded its bound" >&2; exit 1; }
            done
            /usr/bin/python3 - "$pages_dir" "$output_path" <<'PY'
          import json
          from pathlib import Path
          import sys

          pages_dir, output_path = map(Path, sys.argv[1:])
          rows = []
          for path in sorted(pages_dir.glob("page-*.json"), key=lambda item: int(item.stem.split("-")[-1])):
              page_rows = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(page_rows, list):
                  raise SystemExit("paginated status response is malformed")
              rows.extend(page_rows)
          output_path.write_text(json.dumps(rows, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          PY
          }
          fetch_snapshot() {
            local snapshot_dir="$1"
            install -d -m 700 "$snapshot_dir"
            curl --fail-with-body --silent --show-error "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/platform-security.yml" \
              --output "$snapshot_dir/workflow.json"
            curl --fail-with-body --silent --show-error "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CLASSIFIER_RUN_ID}" \
              --output "$snapshot_dir/run.json"
            fetch_statuses "$snapshot_dir/statuses.json"
          }
          for snapshot in first second; do
            fetch_snapshot "$provenance_dir/$snapshot"
            /usr/bin/python3 platform/tools/platform_workflow_provenance.py security \
              --workflow "$provenance_dir/$snapshot/workflow.json" \
              --run "$provenance_dir/$snapshot/run.json" \
              --status "$provenance_dir/$snapshot/statuses.json" \
              --expected-run-id "$CLASSIFIER_RUN_ID" \
              --expected-attempt "$CLASSIFIER_RUN_ATTEMPT" \
              --expected-target-sha "$TARGET_SHA" \
              --expected-run-url "$SOURCE_RUN_URL" \
              > "$provenance_dir/$snapshot/validated.json"
          done
          /usr/bin/python3 - "$provenance_dir/first/validated.json" "$provenance_dir/second/validated.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          first, second = (json.loads(Path(path).read_text(encoding="utf-8")) for path in sys.argv[1:3])
          if first != second:
              raise SystemExit("security provenance changed between adjacent snapshots")
          if first.get("deploy_ready") is not True:
              raise SystemExit("security provenance did not authorize deployment")
          digest = first.get("snapshot_digest")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("security provenance snapshot digest is malformed")
          with Path(sys.argv[3]).open("a", encoding="utf-8") as output:
              output.write("security_ready=true\n")
              output.write(f"security_digest={digest}\n")
          PY

  # This is the only job that owns the production environment for preflight.
  # It has no checkout and never executes candidate source.
  preflight:
    name: Production preflight
    needs: validate-dispatch
    if: >-
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: preflight
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Download closed preflight handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-deploy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-input

      - name: Revalidate exact target SHA preflight handoff
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" && test ! -L "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          /usr/bin/python3 - "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$TARGET_SHA" "$RUNTIME_PROFILE" "$WEB_COMPRESSION" "$CLASSIFIER_RUN_ID" "$CLASSIFIER_RUN_ATTEMPT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, target_sha, runtime_profile, web_compression, run_id, attempt = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          expected = {"schema", "mode", "runtime_profile", "release_slug", "target_sha", "artifact_remote_dir", "classifier_run_id", "classifier_run_attempt", "web_compression"}
          if set(payload) != expected or payload.get("schema") not in (1, "1"):
              raise SystemExit("preflight handoff schema is not closed")
          if payload.get("mode") != "preflight" or payload.get("runtime_profile") != runtime_profile or payload.get("web_compression") != web_compression:
              raise SystemExit("preflight handoff values do not match dispatch")
          if payload.get("target_sha") != target_sha or re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("preflight handoff exact target SHA mismatch")
          if payload.get("classifier_run_id") != run_id or payload.get("classifier_run_attempt") != attempt:
              raise SystemExit("preflight handoff classifier identity mismatch")
          print("preflight handoff accepted for exact target SHA")
          PY

      - name: Validate deployment secrets
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PROD_SSH_HOST:-}" || -z "${PROD_SSH_USER:-}" || -z "${PROD_SSH_KEY:-}" ]]; then
            echo "Production SSH configuration is incomplete." >&2
            exit 1
          fi

      - name: Configure preflight SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-preflight-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" && test "$(wc -l < "$ssh_scan" | tr -d ' ')" = 1
          test "$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "PREFLIGHT_SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run production preflight
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          remote_log="$RUNNER_TEMP/platform-production-preflight-remote.log"
          remote_error="$RUNNER_TEMP/platform-production-preflight-remote-error.log"
          umask 077
          : > "$remote_log"; : > "$remote_error"; chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$PREFLIGHT_SSH_DIR/config" -i "$PREFLIGHT_SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py \
            production-deploy < "$input_path" > "$remote_log" 2> "$remote_error"
          remote_status="$?"
          set -e
          grep -E '^RELEASE_DEPLOY schema=1 status=(passed|failed|review) ' "$remote_log" | tail -n 1 || true
          rm -f -- "$remote_log" "$remote_error"
          exit "$remote_status"

      - name: Remove preflight SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-preflight-ssh"
          rm -f -- "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$RUNNER_TEMP/platform-production-preflight-remote.log" "$RUNNER_TEMP/platform-production-preflight-remote-error.log"
          if [[ -d "$ssh_dir" && ! -L "$ssh_dir" ]]; then
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$ssh_dir/known_hosts.scan" "$ssh_dir/config" "$ssh_dir/control.sock" "$ssh_dir/control-master" "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -e "$ssh_dir/known_hosts" && test ! -e "$ssh_dir/config"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'PREFLIGHT_SSH_DIR=' >> "$GITHUB_ENV"

  # This environment-approved job consumes only the exact handoff and the
  # immutable archive. It checks out only the exact trusted validator source;
  # candidate code is never executed on the runner that receives PROD_SSH_KEY.
  production:
    name: Deploy production
    needs:
      - validate-dispatch
      - validate-classifier
      - build-release
      - validate-security-provenance
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.validate-classifier.result == 'success' &&
      needs.build-release.result == 'success' &&
      needs.validate-security-provenance.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      contents: read
      statuses: write
    env:
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: deploy
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      PLATFORM_WEB_NEXT_COMPRESSION: ${{ inputs.web_compression == 'disabled' && 'false' || 'true' }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      RELEASE_SLUG: gha-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      PUBLISHED_ARTIFACT_ID: ${{ needs.build-release.outputs.artifact_id }}
      PUBLISHED_ARTIFACT_DIGEST: ${{ needs.build-release.outputs.artifact_digest }}
    steps:
      - name: Download closed deployment handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-deploy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-input

      - name: Validate production deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" && test ! -L "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          test -n "$CLASSIFIER_RUN_ID" || { echo "classifier_run_id is required for production deploy" >&2; exit 1; }
          test -n "$CLASSIFIER_RUN_ATTEMPT" || { echo "classifier_run_attempt is required for production deploy" >&2; exit 1; }
          /usr/bin/python3 - "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$TARGET_SHA" "$RUNTIME_PROFILE" "$WEB_COMPRESSION" "$CLASSIFIER_RUN_ID" "$CLASSIFIER_RUN_ATTEMPT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, target_sha, runtime_profile, web_compression, run_id, attempt = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          expected = {"schema", "mode", "runtime_profile", "release_slug", "target_sha", "artifact_remote_dir", "classifier_run_id", "classifier_run_attempt", "web_compression"}
          if set(payload) != expected or payload.get("schema") not in (1, "1"):
              raise SystemExit("deployment handoff schema is not closed")
          if payload.get("mode") != "deploy" or payload.get("runtime_profile") != runtime_profile or payload.get("web_compression") != web_compression:
              raise SystemExit("deployment handoff values do not match dispatch")
          if payload.get("target_sha") != target_sha or re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("deployment handoff exact target SHA mismatch")
          if payload.get("classifier_run_id") != run_id or payload.get("classifier_run_attempt") != attempt:
              raise SystemExit("deployment handoff classifier identity mismatch")
          if re.fullmatch(r"/tmp/old-sparky-platform-artifact-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}", str(payload.get("artifact_remote_dir"))) is None:
              raise SystemExit("deployment handoff artifact path is unsafe")
          print("deployment handoff accepted for exact target SHA")
          PY

      - name: Require successful platform security build (shared provenance validator)
        shell: bash
        run: |
          set -euo pipefail
          # platform_workflow_provenance.py enforces run.get("workflow_id") != workflow.get("id"),
          # run.get("run_attempt") != int(expected_attempt), and exact
          # "event": "push", "head_branch": "dev", "head_sha": os.environ["TARGET_SHA"],
          # "status": "completed", "conclusion": "success" metadata.  The
          security_digest="${{ needs.validate-security-provenance.outputs.security_digest }}"
          [[ "$security_digest" =~ ^[0-9a-f]{64}$ ]] || { echo "security provenance handoff is malformed" >&2; exit 1; }
          test "${{ needs.validate-security-provenance.outputs.security_ready }}" = "true"
          echo "exact platform security provenance accepted: snapshot=$security_digest"

      - name: Resolve immutable default-branch classifier source
        id: trusted_classifier_default
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: dev
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_REF" = "refs/heads/dev"
          trusted_ref="$RUNNER_TEMP/platform-trusted-classifier-ref.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRUSTED_BRANCH}" \
            --output "$trusted_ref"
          /usr/bin/python3 - "$trusted_ref" "$GITHUB_OUTPUT" "$TRUSTED_BRANCH" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branch = sys.argv[3]
          obj = payload.get("object") if isinstance(payload, dict) else None
          sha = obj.get("sha") if isinstance(obj, dict) else None
          if (
              payload.get("ref") != f"refs/heads/{branch}"
              or not isinstance(obj, dict)
              or obj.get("type") != "commit"
              or not isinstance(sha, str)
              or re.fullmatch(r"[0-9a-f]{40}", sha) is None
          ):
              raise SystemExit("trusted classifier source is not an immutable commit")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
          rm -f -- "$trusted_ref"

      - name: Checkout trusted classifier validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.trusted_classifier_default.outputs.sha }}
          path: trusted-classifier
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate deployable exact classifier artifact immediately before production writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The trusted parser validates classifier-manifest.json as data and
          # never executes the downloaded payload.
          umask 077
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          trusted_tool="$trusted_root/platform/tools/platform_production_classifier_artifact.py"
          test -f "$trusted_tool" && test ! -L "$trusted_tool"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "${{ steps.trusted_classifier_default.outputs.sha }}"
          expected_name="platform-ci-route-${CLASSIFIER_RUN_ID}-${CLASSIFIER_RUN_ATTEMPT}"
          route_dir="$(mktemp -d "$RUNNER_TEMP/platform-ci-route.XXXXXX")"
          trap 'rm -rf -- "$route_dir"' EXIT
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          fetch_classifier_artifacts() {
            local pages_dir="$1" page=1 summary count total expected_total=""
            install -d -m 700 "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail --silent --show-error --location \
                --max-filesize 4194304 \
                "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CLASSIFIER_RUN_ID}/artifacts?per_page=100&page=${page}" \
                --output "$page_path"
              chmod 600 "$page_path"
              summary="$(/usr/bin/python3 "$trusted_tool" page "$page_path")"
              [[ "$summary" =~ ^count=([0-9]+)\ total=([0-9]+)$ ]] || {
                echo "classifier artifact pagination summary is malformed" >&2
                exit 1
              }
              count="${BASH_REMATCH[1]}"
              total="${BASH_REMATCH[2]}"
              if [[ -n "$expected_total" ]]; then
                test "$total" = "$expected_total" || {
                  echo "classifier artifact total changed during pagination" >&2
                  exit 1
                }
              else
                expected_total="$total"
              fi
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 100 )) || {
                echo "classifier artifact pagination exceeded its bound" >&2
                exit 1
              }
            done
          }
          first_pages="$route_dir/artifacts-first"
          second_pages="$route_dir/artifacts-second"
          fetch_classifier_artifacts "$first_pages"
          fetch_classifier_artifacts "$second_pages"
          artifact_id="$(
            /usr/bin/python3 "$trusted_tool" metadata \
              "$first_pages" "$second_pages" \
              --expected-name "$expected_name" \
              --run-id "$CLASSIFIER_RUN_ID" \
              --run-attempt "$CLASSIFIER_RUN_ATTEMPT" \
              --target-sha "$TARGET_SHA"
          )"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "classifier artifact id is malformed" >&2
            exit 1
          }
          curl --fail --silent --show-error --location \
            --max-filesize 4194304 \
            "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$route_dir/artifact.zip"
          /usr/bin/python3 "$trusted_tool" manifest "$route_dir/artifact.zip" --target-sha "$TARGET_SHA"

      - name: Remove trusted classifier validator
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          if [[ -d "$trusted_root" && ! -L "$trusted_root" ]]; then
            rm -rf -- "$trusted_root"
          fi
          test ! -e "$trusted_root" && test ! -L "$trusted_root"

      - name: Mark production deployment pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment is running\",\"target_url\":\"${run_url}\"}"

      - name: Download published release artifact for deployment
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release

      - name: Verify published release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$PUBLISHED_ARTIFACT_ID" && test -n "$PUBLISHED_ARTIFACT_DIGEST"
          PUBLISHED_ARTIFACT_DIGEST="${PUBLISHED_ARTIFACT_DIGEST#sha256:}"
          [[ "$PUBLISHED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Published GitHub artifact ID is invalid" >&2; exit 1; }
          [[ "$PUBLISHED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "Published GitHub artifact digest is invalid" >&2; exit 1; }
          artifact_metadata="$RUNNER_TEMP/platform-release-artifact-metadata.json"
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PUBLISHED_ARTIFACT_ID}" --output "$artifact_metadata"
          /usr/bin/python3 - "$artifact_metadata" "$PUBLISHED_ARTIFACT_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TARGET_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          metadata_path, artifact_id, run_id, attempt, target_sha = sys.argv[1:]
          payload = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          if payload.get("id") != int(artifact_id) or payload.get("name") != f"platform-release-artifact-{run_id}-{attempt}" or payload.get("expired") is not False:
              raise SystemExit("published release artifact metadata is not the exact current-run artifact")
          workflow_run = payload.get("workflow_run")
          if not isinstance(workflow_run, dict) or workflow_run.get("id") != int(run_id) or workflow_run.get("head_sha") != target_sha:
              raise SystemExit("published release artifact is not bound to this exact workflow run and SHA")
          PY
          artifact_zip="$RUNNER_TEMP/platform-release-artifact.zip"
          curl --fail-with-body --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PUBLISHED_ARTIFACT_ID}/zip" --output "$artifact_zip"
          printf '%s  %s\n' "$PUBLISHED_ARTIFACT_DIGEST" "$artifact_zip" | sha256sum -c - >/dev/null 2>/dev/null || { echo "Published GitHub artifact digest verification failed" >&2; exit 1; }
          release_archive="$(find "$RUNNER_TEMP/release" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$release_archive" || { echo "Published release artifact is missing" >&2; exit 1; }
          release_checksum="${release_archive}.sha256"
          release_provenance="$RUNNER_TEMP/release/RELEASE.provenance.json"
          test -f "$release_checksum" && test -f "$release_provenance"
          (cd "$(dirname "$release_archive")" && sha256sum -c "$(basename "$release_checksum")")
          /usr/bin/python3 - "$release_archive" "$release_provenance" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          archive, provenance_path, target_sha = sys.argv[1:]
          provenance = json.loads(Path(provenance_path).read_text(encoding="utf-8"))
          if set(provenance) != {"schema", "artifact_file", "artifact_sha256", "source_git_commit"}:
              raise SystemExit("release provenance schema is not closed")
          if provenance.get("schema") != 1 or provenance.get("artifact_file") != Path(archive).name or provenance.get("source_git_commit") != target_sha or re.fullmatch(r"[0-9a-f]{64}", str(provenance.get("artifact_sha256"))) is None:
              raise SystemExit("release provenance does not bind the exact target SHA")
          if hashlib.sha256(Path(archive).read_bytes()).hexdigest() != provenance["artifact_sha256"]:
              raise SystemExit("release provenance digest mismatch")
          PY
          {
            printf 'RELEASE_ARTIFACT=%s\n' "$release_archive"
            printf 'RELEASE_CHECKSUM=%s\n' "$release_checksum"
            printf 'RELEASE_PROVENANCE=%s\n' "$release_provenance"
          } >> "$GITHUB_ENV"

      - name: Validate deployment secrets
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PROD_SSH_HOST:-}" || -z "${PROD_SSH_USER:-}" || -z "${PROD_SSH_KEY:-}" ]]; then
            echo "Production SSH configuration is incomplete." >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-deploy-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" && test "$(wc -l < "$ssh_scan" | tr -d ' ')" = 1
          test "$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Verify SSH connection
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" true >/dev/null

      - name: Upload verified CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          test -s "$input_path"
          require_current_dev_head() {
            local branch_json dev_sha
            branch_json="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev")"
            dev_sha="$(printf '%s' "$branch_json" | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); sha=payload["commit"]["sha"]; assert isinstance(sha,str) and len(sha)==40 and all(c in "0123456789abcdef" for c in sha), "current dev head SHA is malformed"; print(sha)')"
            test "$dev_sha" = "$TARGET_SHA" || { echo "Refusing production side effects: dev moved from $TARGET_SHA to $dev_sha." >&2; exit 1; }
          }
          require_current_dev_head
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py production-prepare-artifact < "$input_path"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_ARTIFACT" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_PROVENANCE" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_CHECKSUM" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"

      - name: Run production preflight or deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          branch_json="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev")"
          dev_sha="$(printf '%s' "$branch_json" | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); sha=payload["commit"]["sha"]; assert isinstance(sha,str) and len(sha)==40 and all(c in "0123456789abcdef" for c in sha), "current dev head SHA is malformed"; print(sha)')"
          test "$dev_sha" = "$TARGET_SHA" || { echo "Refusing activation: dev moved from $TARGET_SHA to $dev_sha." >&2; exit 1; }
          remote_log="$RUNNER_TEMP/platform-production-deploy-remote.log"
          remote_error="$RUNNER_TEMP/platform-production-deploy-remote-error.log"
          umask 077; : > "$remote_log"; : > "$remote_error"; chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py production-deploy < "$input_path" > "$remote_log" 2> "$remote_error"
          remote_status="$?"
          set -e
          public_line="$(grep -E '^RELEASE_DEPLOY schema=1 status=(passed|failed|review) class=(preflight|deployment|argument|privilege|policy|layout|service_state|readiness|lock|quiesce|recovery|artifact|pending_operation|transaction|abort|remote_or_transport) release_slug=(unavailable|[A-Za-z0-9][A-Za-z0-9._-]{0,179}) source_sha=(unavailable|[0-9a-f]{40,64})$' "$remote_log" | tail -n 1 || true)"
          [[ -n "$public_line" ]] || public_line='RELEASE_DEPLOY schema=1 status=failed class=remote_or_transport release_slug=unavailable source_sha=unavailable'
          printf '%s\n' "$public_line"
          exit "$remote_status"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-deploy-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-deploy-ssh"
          rm -f -- "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$RUNNER_TEMP/platform-production-deploy-remote.log" "$RUNNER_TEMP/platform-production-deploy-remote-error.log" "$RUNNER_TEMP/platform-release-artifact.zip"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Deployment summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "### Platform production deploy"
            echo
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Web compression: \`$PLATFORM_WEB_NEXT_COMPRESSION\`"
            echo "- Status: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark production deployment successful
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" --data "{\"state\":\"success\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment and live smoke passed\",\"target_url\":\"${run_url}\"}"

      - name: Mark production deployment failed
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" --data "{\"state\":\"failure\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment failed\",\"target_url\":\"${run_url}\"}"
