                  raise SystemExit("failed release identity member is invalid")
              stream = archive.extractfile(member)
              if stream is None:
                  raise SystemExit("failed release identity member is unavailable")
              raw = stream.read(1048577)
              if len(raw) != member.size or len(raw) > 1048576:
                  raise SystemExit("failed release identity member is malformed")
          print(hashlib.sha256(raw).hexdigest())
          PY
          )"
          [[ "$FAILED_RELEASE_JSON_SHA256" =~ ^[0-9a-f]{64}$ ]]
          export FAILED_RELEASE_JSON_SHA256
          /usr/bin/gh attestation verify "$release_archive" --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/StrayForest/old_sparky/.github/workflows/platform-production-deploy.yml@refs/heads/dev" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --source-ref refs/heads/dev --source-digest "$FAILED_SOURCE_SHA" --format json \
            > "$proof/attestation-certificate.json"
          /usr/bin/gh attestation verify "$release_archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow StrayForest/old_sparky/.github/workflows/platform-production-deploy.yml \
            --source-ref refs/heads/dev --source-digest "$FAILED_SOURCE_SHA" --format json \
            > "$proof/attestation-signer.json"
          /usr/bin/python3 - "$proof/attestation-certificate.json" "$proof/attestation-signer.json" "$FAILED_RUN_ID" "$FAILED_RUN_ATTEMPT" "$FAILED_SOURCE_SHA" "$release_archive" "$GITHUB_REPOSITORY" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          cert_path, signer_path, run_id, attempt, source, archive_path, repo = sys.argv[1:]
          bundle_hash = hashlib.sha256()
          with Path(archive_path).open("rb") as bundle_stream:
              for chunk in iter(lambda: bundle_stream.read(1024 * 1024), b""):
                  bundle_hash.update(chunk)
