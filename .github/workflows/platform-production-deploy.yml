          if count(cert_path, True) != 1 or count(signer_path, False) != 1:
              raise SystemExit("failed release attestation did not uniquely bind the exact attempt")
          PY
          /usr/bin/python3 - "$ACTIVE_BASELINE_JSON" "$INCREMENTAL_MANIFEST_B64" "$FAILED_SOURCE_SHA" "$TARGET_SHA" "$FAILED_RUN_ID" "$FAILED_RUN_ATTEMPT" "$REPORT_ONLY_CONFIRMATION" "$GITHUB_OUTPUT" "$SOURCE_SECURITY_RUN_ID" "$SOURCE_SECURITY_RUN_ATTEMPT" "$proof" <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          sys.path.insert(0, str(Path.cwd() / "platform"))
          from tools.platform_deploy_baseline import (
              REPORT_ONLY_RECOVERY_CONFIRMATION,
              classify_cumulative_baseline,
              validate_report_only_recovery_baseline,
          )
          from tools.platform_workflow_provenance import validate_recovery_source_security_gates
          baseline_raw, manifest_b64, source, target, run_id, attempt, confirmation, output, security_id, security_attempt, proof = sys.argv[1:]
          baseline = json.loads(baseline_raw)
          if not isinstance(baseline, dict):
              raise SystemExit("active baseline identity is malformed")
          try:
              incremental = json.loads(base64.b64decode(manifest_b64, validate=True))
          except (ValueError, json.JSONDecodeError):
              raise SystemExit("recovery classifier manifest is malformed") from None
          dev_ref = json.loads((Path(proof) / "dev-ref.json").read_text(encoding="utf-8"))
          dev_object = dev_ref.get("object") if isinstance(dev_ref, dict) else None
          current_sha = dev_object.get("sha") if isinstance(dev_object, dict) else None
          if (dev_ref.get("ref") != "refs/heads/dev" or not isinstance(current_sha, str)
