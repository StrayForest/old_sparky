              raise SystemExit("host-tools attestation certificate/source/run/subject policy failed")

          expected_files = {
              "platform_workflow_remote_dispatch.py", "platform_workflow_input_guard.py",
              "platform_prepare_artifact_dir.py", "platform_production_deploy_supervisor.sh",
              "platform_release_lock.sh", "platform_release_preflight.sh",
              "platform_validate_release_artifact.py", "platform_safe_env_exec.py",
              "platform_render_service_envs.py", "platform_validate_edge_policy.py",
              "platform_update_cloudflare_ips.py", "platform_configure_shared_env.py",
              "platform_storage_evidence_summary.py", "capabilities.txt",
          }
          outer = Path(outer_dir)
          if hashlib.sha256((outer / "platform-host-tools-bundle.zip").read_bytes()).hexdigest() != bundle_sha:
              raise SystemExit("host-tools inner bundle digest changed")
          if (outer / "contract/source_sha").read_text(encoding="ascii").strip() != host_tools_sha:
              raise SystemExit("host-tools source contract mismatch")
          if (outer / "contract/toolset_version").read_text(encoding="ascii").strip() != "production-host-tools-v2":
              raise SystemExit("host-tools toolset contract mismatch")
          manifest_contract = (outer / "contract/manifest.sha256").read_text(encoding="ascii").strip()
          capabilities_contract = (outer / "contract/capabilities.sha256").read_text(encoding="ascii").strip()
          if manifest_contract != manifest_sha or capabilities_contract != capabilities_sha:
              raise SystemExit("host-tools manifest contract mismatch")
          if hashlib.sha256((outer / "contract/files.sha256").read_bytes()).hexdigest() != files_contract_sha:
              raise SystemExit("host-tools files contract digest mismatch")
          if hashlib.sha256((outer / "contract/files.modes").read_bytes()).hexdigest() != modes_contract_sha:
              raise SystemExit("host-tools modes contract digest mismatch")
          with zipfile.ZipFile(outer / "platform-host-tools-bundle.zip", "r", allowZip64=False) as archive:
              members = {}
              for info in archive.infolist():
                  mode = (info.external_attr >> 16) & 0o170000
                  if info.is_dir() or mode not in {0, stat.S_IFREG} or info.filename in members:
                      raise SystemExit("host-tools inner bundle member is invalid")
                  members[info.filename] = archive.read(info)
          manifest_member = "platform-host-tools/manifest.json"
          expected_members = {f"platform-host-tools/{name}" for name in expected_files} | {manifest_member}
          if set(members) != expected_members:
              raise SystemExit("host-tools inner bundle inventory is invalid")
          manifest = json.loads(members[manifest_member].decode("utf-8"))
          records = manifest.get("files") if isinstance(manifest, dict) else None
          if manifest.get("schema") != 1 or manifest.get("source_sha") != host_tools_sha or manifest.get("generation") != host_tools_sha or not isinstance(records, list):
              raise SystemExit("host-tools manifest identity is invalid")
          by_path = {}
          for record in records:
              if not isinstance(record, dict) or set(record) != {"path", "sha256", "mode"} or record.get("path") in by_path:
                  raise SystemExit("host-tools manifest records are invalid")
              by_path[record["path"]] = record
          if set(by_path) != expected_files:
              raise SystemExit("host-tools manifest inventory is invalid")
          for name, record in by_path.items():
              expected_mode = 0o444 if name == "capabilities.txt" else 0o555
              data = members[f"platform-host-tools/{name}"]
              if record.get("mode") != expected_mode or hashlib.sha256(data).hexdigest() != record.get("sha256"):
                  raise SystemExit("host-tools manifest member digest or mode mismatch")
          contract_records = {}
          for line in (outer / "contract/files.sha256").read_text(encoding="ascii").splitlines():
              digest, name = line.split("  ", 1)
              if name in contract_records:
                  raise SystemExit("host-tools files contract duplicates a member")
              contract_records[name] = digest
          if contract_records != {name: record["sha256"] for name, record in by_path.items()}:
              raise SystemExit("host-tools files contract does not match manifest")
          mode_records = {}
          for line in (outer / "contract/files.modes").read_text(encoding="ascii").splitlines():
              mode, name = line.split()
              if name in mode_records:
                  raise SystemExit("host-tools modes contract duplicates a member")
              mode_records[name] = int(mode, 8)
          if mode_records != {name: record["mode"] for name, record in by_path.items()}:
              raise SystemExit("host-tools modes contract does not match manifest")
          base = json.loads(Path(input_path).read_text(encoding="ascii"))
          legacy_keys = {
              "schema", "mode", "runtime_profile", "release_slug", "target_sha",
              "artifact_remote_dir", "classifier_run_id", "classifier_run_attempt", "web_compression",
          }
          if set(base) != legacy_keys or base.get("schema") not in (1, "1") or base.get("mode") != "deploy" or base.get("target_sha") != target_sha:
              raise SystemExit("deployment handoff cannot be upgraded safely")
          base["schema"] = "2"
          base["host_tools"] = handoff
          temporary = Path(input_path).with_name(Path(input_path).name + ".host-tools-verified")
          fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          try:
              data = (json.dumps(base, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
              os.write(fd, data)
              os.fchmod(fd, 0o600)
          finally:
              os.close(fd)
          os.replace(temporary, input_path)
          PY
          test "$(stat -c '%F:%h:%a' -- "$input_path")" = "regular file:1:600"
          expected_remote="HOST_TOOLS_CONTRACT source_sha=$HOST_TOOLS_SHA generation=$HOST_TOOLS_SHA manifest_sha256=$HOST_TOOLS_MANIFEST_SHA256 capabilities_sha256=$HOST_TOOLS_CAPABILITIES_SHA256"
          remote=(ssh -n -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST")
          run_remote_readonly() {
            /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 60s \
              "${remote[@]}" "$@"
          }
          run_remote_readonly /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" host-contract \
            "$HOST_TOOLS_SHA" "$HOST_TOOLS_MANIFEST_SHA256" "$HOST_TOOLS_CAPABILITIES_SHA256" \
            | /usr/bin/head -c 512 | cmp -s <(printf '%s\n' "$expected_remote")

      - name: Upload verified CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          test -s "$input_path"
          require_current_dev_head() {
            local branch_json dev_sha
            branch_json="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev")"
            dev_sha="$(printf '%s' "$branch_json" | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); sha=payload["commit"]["sha"]; assert isinstance(sha,str) and len(sha)==40 and all(c in "0123456789abcdef" for c in sha), "current dev head SHA is malformed"; print(sha)')"
            test "$dev_sha" = "$TARGET_SHA" || { echo "Refusing production side effects: dev moved from $TARGET_SHA to $dev_sha." >&2; exit 1; }
          }
          require_current_dev_head
          timeout --foreground 300s ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" production-prepare-artifact < "$input_path"
          timeout --foreground 300s scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_ARTIFACT" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          timeout --foreground 300s scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_PROVENANCE" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          timeout --foreground 300s scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_CHECKSUM" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"

      - name: Run production preflight or deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          branch_json="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev")"
          dev_sha="$(printf '%s' "$branch_json" | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); sha=payload["commit"]["sha"]; assert isinstance(sha,str) and len(sha)==40 and all(c in "0123456789abcdef" for c in sha), "current dev head SHA is malformed"; print(sha)')"
          test "$dev_sha" = "$TARGET_SHA" || { echo "Refusing activation: dev moved from $TARGET_SHA to $dev_sha." >&2; exit 1; }
          remote_log="$RUNNER_TEMP/platform-production-deploy-remote.log"
          remote_error="$RUNNER_TEMP/platform-production-deploy-remote-error.log"
          umask 077; : > "$remote_log"; : > "$remote_error"; chmod 600 "$remote_log" "$remote_error"
          set +e
          timeout --foreground 900s ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" production-deploy < "$input_path" > "$remote_log" 2> "$remote_error"
          remote_status="$?"
          set -e
          public_line="$(grep -E '^RELEASE_DEPLOY schema=1 status=(passed|failed|review) class=(preflight|deployment|argument|privilege|policy|layout|service_state|readiness|lock|quiesce|recovery|artifact|pending_operation|transaction|abort|remote_or_transport)( phase=(artifact|provenance|preflight|candidate|readiness) reason=(internal|host_tools_invalid|lock|environment|service_state|nginx_config|preflight_failed|artifact_missing|artifact_count_invalid|checksum_missing|provenance_missing|artifact_name_invalid|release_slug_mismatch|checksum_mismatch|validation_failed|provenance_invalid|candidate_missing|activation_failed|lock_lost|runtime_profile_failed))? release_slug=(unavailable|[A-Za-z0-9][A-Za-z0-9._-]{0,179}) source_sha=(unavailable|[0-9a-f]{40,64})$' "$remote_log" | tail -n 1 || true)"
          if [[ -z "$public_line" ]]; then
            public_line='RELEASE_DEPLOY schema=1 status=failed class=remote_or_transport release_slug=unavailable source_sha=unavailable'
            printf '%s\n' "$public_line"
            (( remote_status != 0 )) && exit "$remote_status"
            exit 1
          fi
          printf '%s\n' "$public_line"
          exit "$remote_status"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-deploy-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-deploy-ssh"
          rm -f -- "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$RUNNER_TEMP/platform-production-deploy-remote.log" "$RUNNER_TEMP/platform-production-deploy-remote-error.log" "$RUNNER_TEMP/platform-release-artifact.zip" \
            "$RUNNER_TEMP/host-tools-production-attempt.json" \
            "$RUNNER_TEMP/host-tools-handoff-metadata.json" "$RUNNER_TEMP/host-tools-handoff.zip" \
            "$RUNNER_TEMP/host-tools-production-metadata.json" "$RUNNER_TEMP/host-tools-production.zip" \
            "$RUNNER_TEMP/host-tools-production-attestation.json" "$RUNNER_TEMP/host-tools-production-jobs.json"
          rm -rf -- "$RUNNER_TEMP/host-tools-production-envelope" "$RUNNER_TEMP/host-tools-handoff"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Deployment summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "### Platform production deploy"
            echo
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Web compression: \`$PLATFORM_WEB_NEXT_COMPRESSION\`"
            echo "- Status: passed"
          } >> "$GITHUB_STEP_SUMMARY"

  # Status authority is deliberately outside the secret-bearing production
  # job.  It writes the canonical top-level caller attempt URL, so a native
  # reusable call cannot make downstream consumers chase a child URL.
  release-status-pending:
    name: Mark release authority pending
    needs:
      - validate-dispatch
      - validate-security-provenance
    if: >-
      always() &&
      inputs.mode == 'deploy' &&
      needs.validate-dispatch.result == 'success' &&
      needs.validate-security-provenance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.target_sha }}
      STATUS_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && github.run_id || inputs.caller_run_id }}
      STATUS_RUN_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt || inputs.caller_run_attempt }}
      STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event_name == 'workflow_dispatch' && github.run_id || inputs.caller_run_id }}/attempts/${{ github.event_name == 'workflow_dispatch' && github.run_attempt || inputs.caller_run_attempt }}
    steps:
      - name: Mark top-level release pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$STATUS_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$STATUS_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$STATUS_URL" =~ ^https://github\.com/StrayForest/old_sparky/actions/runs/[1-9][0-9]{0,31}/attempts/[1-9][0-9]{0,31}$ ]]
          /usr/bin/python3 - "$STATUS_URL" <<'PY' > "$RUNNER_TEMP/platform-pending-status.json"
          import json
          import sys
          print(json.dumps({
              "state": "pending",
              "context": "platform-production-deploy",
              "description": "Production deployment is pending",
              "target_url": sys.argv[1],
          }, separators=(",", ":")))
          PY
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data-binary @"$RUNNER_TEMP/platform-pending-status.json"
          rm -f -- "$RUNNER_TEMP/platform-pending-status.json"

  # This is the release-authority barrier.  It is always scheduled so a
  # cancelled/failed production job cannot be mistaken for a skipped no-op.
  # A cancelled run may terminate before this job gets a runner; in that case
  # the pending marker remains intentionally visible for recovery.
  release-finalizer:
    name: Release finalizer
    needs:
      - validate-dispatch
      - validate-classifier
      - validate-security-provenance
      - build-release
      - host-capability-preflight
      - preflight
      - production
      - release-status-pending
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      statuses: write
    env:
      DEPLOY_MODE: ${{ inputs.mode }}
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.target_sha }}
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      SECURITY_RUN_ID: ${{ inputs.security_run_id }}
      SECURITY_RUN_ATTEMPT: ${{ inputs.security_run_attempt }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt }}
      CALLER_KIND: ${{ github.event_name == 'workflow_dispatch' && 'manual' || inputs.caller_kind }}
      CALLER_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && github.run_id || inputs.caller_run_id }}
      CALLER_RUN_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt || inputs.caller_run_attempt }}
      CALLER_WORKFLOW_REF: ${{ github.event_name == 'workflow_dispatch' && github.workflow_ref || inputs.caller_workflow_ref }}
      CALLER_WORKFLOW_SHA: ${{ github.event_name == 'workflow_dispatch' && github.workflow_sha || inputs.caller_workflow_sha }}
      EXPECTED_CALLED_WORKFLOW_REF: ${{ github.event_name == 'workflow_dispatch' && github.ref || inputs.expected_called_workflow_ref }}
      EXPECTED_CALLED_WORKFLOW_SHA: ${{ github.event_name == 'workflow_dispatch' && github.workflow_sha || inputs.expected_called_workflow_sha }}
      STATUS_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && github.run_id || inputs.caller_run_id }}
      STATUS_RUN_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt || inputs.caller_run_attempt }}
      STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event_name == 'workflow_dispatch' && github.run_id || inputs.caller_run_id }}/attempts/${{ github.event_name == 'workflow_dispatch' && github.run_attempt || inputs.caller_run_attempt }}
      VALIDATE_RESULT: ${{ needs.validate-dispatch.result }}
      CLASSIFIER_RESULT: ${{ needs.validate-classifier.result }}
      SECURITY_RESULT: ${{ needs.validate-security-provenance.result }}
      BUILD_RESULT: ${{ needs.build-release.result }}
      HOST_RESULT: ${{ needs.host-capability-preflight.result }}
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      PRODUCTION_RESULT: ${{ needs.production.result }}
      PENDING_RESULT: ${{ needs.release-status-pending.result }}
      RECEIPT_CONTENT_NAME: platform-production-release-receipt-content-${{ github.event_name == 'workflow_dispatch' && github.run_id || inputs.caller_run_id }}-${{ github.event_name == 'workflow_dispatch' && github.run_attempt || inputs.caller_run_attempt }}
      RECEIPT_NAME: platform-production-release-receipt-${{ github.event_name == 'workflow_dispatch' && github.run_id || inputs.caller_run_id }}-${{ github.event_name == 'workflow_dispatch' && github.run_attempt || inputs.caller_run_attempt }}
    steps:
      - name: Checkout exact called workflow source
        if: ${{ always() && inputs.mode == 'deploy' && env.CALLER_KIND == 'auto' && needs.production.result == 'success' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed on failed or cancelled deployment
        if: >-
          always() &&
          inputs.mode == 'deploy' &&
          (needs.production.result != 'success' ||
           needs.release-status-pending.result != 'success' ||
           needs.validate-security-provenance.result != 'success')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Deployment target is unavailable; pending status remains recovery-visible." >&2; exit 1; }
          [[ "$STATUS_URL" =~ ^https://github\.com/StrayForest/old_sparky/actions/runs/[1-9][0-9]{0,31}/attempts/[1-9][0-9]{0,31}$ ]]
          if [[ "$PRODUCTION_RESULT" == "cancelled" || "$PENDING_RESULT" == "cancelled" ]]; then
            description="Production deployment was cancelled; pending state requires recovery"
          else
            description="Production deployment failed before release authority closed"
          fi
          /usr/bin/python3 - "$description" "$STATUS_URL" <<'PY' > "$RUNNER_TEMP/platform-failure-status.json"
          import json
          import sys
          print(json.dumps({
              "state": "failure",
              "context": "platform-production-deploy",
              "description": sys.argv[1],
              "target_url": sys.argv[2],
          }, separators=(",", ":")))
          PY
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data-binary @"$RUNNER_TEMP/platform-failure-status.json"
          rm -f -- "$RUNNER_TEMP/platform-failure-status.json"
          {
            echo "### Platform production deploy"
            echo
            echo "- Result: failed or cancelled (`$PRODUCTION_RESULT`)"
            echo "- Status URL: $STATUS_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Preserve read-only preflight distinction
        if: ${{ always() && inputs.mode == 'preflight' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PREFLIGHT_RESULT" = "success" || { echo "Production preflight did not complete successfully: $PREFLIGHT_RESULT" >&2; exit 1; }
          {
            echo "### Platform production deploy"
            echo
            echo "- Mode: `preflight`"
            echo "- Result: read-only preflight; no deployment marker or release receipt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create canonical receipt content
        if: >-
          always() && inputs.mode == 'deploy' && env.CALLER_KIND == 'auto' &&
          needs.production.result == 'success' &&
          needs.release-status-pending.result == 'success' &&
          needs.validate-security-provenance.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 - "$RUNNER_TEMP/platform-release-receipt-content.json" <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "platform/tools")
          from platform_release_receipt import _normalised_digest, write_receipt

          target = os.environ["TARGET_SHA"]
          caller_id = os.environ["CALLER_RUN_ID"]
          caller_attempt = os.environ["CALLER_RUN_ATTEMPT"]
          called_ref = os.environ["EXPECTED_CALLED_WORKFLOW_REF"]
          called_sha = os.environ["EXPECTED_CALLED_WORKFLOW_SHA"]
          content_name = os.environ["RECEIPT_CONTENT_NAME"]
          payload = {
              "schema": 1,
              "kind": "platform-production-release",
              "target_sha": target,
              "mode": "deploy",
              "runtime_profile": os.environ["RUNTIME_PROFILE"],
              "web_compression": os.environ["WEB_COMPRESSION"],
              "security": {
                  "event": "push",
                  "workflow_name": "Platform security and build",
                  "workflow_path": ".github/workflows/platform-security.yml",
                  "workflow_ref": "StrayForest/old_sparky/.github/workflows/platform-security.yml@refs/heads/dev",
                  "workflow_sha": target,
                  "repository": "StrayForest/old_sparky",
                  "run_id": os.environ["SECURITY_RUN_ID"],
                  "run_attempt": os.environ["SECURITY_RUN_ATTEMPT"],
              },
              "classifier": {
                  "event": "push",
                  "workflow_name": "Platform security and build",
                  "workflow_path": ".github/workflows/platform-security.yml",
                  "workflow_ref": "StrayForest/old_sparky/.github/workflows/platform-security.yml@refs/heads/dev",
                  "workflow_sha": target,
                  "repository": "StrayForest/old_sparky",
                  "run_id": os.environ["CLASSIFIER_RUN_ID"],
                  "run_attempt": os.environ["CLASSIFIER_RUN_ATTEMPT"],
              },
              "caller": {
                  "event": "workflow_run",
                  "workflow_name": "Platform production auto-deploy",
                  "workflow_path": ".github/workflows/platform-production-autodeploy.yml",
                  "workflow_ref": os.environ["CALLER_WORKFLOW_REF"],
                  "workflow_sha": os.environ["CALLER_WORKFLOW_SHA"],
                  "repository": "StrayForest/old_sparky",
                  "run_id": caller_id,
                  "run_attempt": caller_attempt,
              },
              "called": {
                  "event": "workflow_run",
                  "workflow_name": "Platform production deploy",
                  "workflow_path": ".github/workflows/platform-production-deploy.yml",
                  "workflow_ref": called_ref,
                  "workflow_sha": called_sha,
                  "repository": "StrayForest/old_sparky",
                  "run_id": caller_id,
                  "run_attempt": caller_attempt,
              },
              "jobs": {
                  "deploy": {"name": "Deploy production", "status": "completed", "conclusion": "success"},
                  "final": {"name": "Release finalizer", "status": "completed", "conclusion": "success"},
              },
              "status": {
                  "context": "platform-production-deploy",
                  "state": "success",
                  "description": "Production deployment and live smoke passed",
                  "target_url": os.environ["STATUS_URL"],
              },
              "status_url": os.environ["STATUS_URL"],
              "artifact": {
                  "id": 1,
                  "name": content_name,
                  "size_bytes": 1,
                  "digest": "sha256:" + "0" * 64,
                  "member": "platform-release-receipt.json",
                  "content_sha256": "0" * 64,
                  "workflow_run_id": caller_id,
                  "workflow_run_attempt": caller_attempt,
              },
          }
          payload["artifact"]["content_sha256"] = _normalised_digest(payload)
          write_receipt(Path(sys.argv[1]), payload)
          PY
          test "$(stat -c '%F:%a:%h' "$RUNNER_TEMP/platform-release-receipt-content.json")" = "regular file:600:1"

      - name: Upload canonical receipt content
        id: upload-receipt-content
        if: >-
          always() && inputs.mode == 'deploy' && env.CALLER_KIND == 'auto' &&
          needs.production.result == 'success' &&
          needs.release-status-pending.result == 'success' &&
          needs.validate-security-provenance.result == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.RECEIPT_CONTENT_NAME }}
          path: ${{ runner.temp }}/platform-release-receipt-content.json
          if-no-files-found: error
          retention-days: 30

      - name: Bind exact receipt content artifact metadata
        id: receipt-metadata
        if: ${{ success() && env.CALLER_KIND == 'auto' && steps.upload-receipt-content.outputs.artifact-id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_ARTIFACT_ID: ${{ steps.upload-receipt-content.outputs.artifact-id }}
          CONTENT_ARTIFACT_DIGEST: ${{ steps.upload-receipt-content.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$CONTENT_ARTIFACT_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$CONTENT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          metadata="$RUNNER_TEMP/platform-release-receipt-content-metadata.json"
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CONTENT_ARTIFACT_ID}" \
            --output "$metadata"
          /usr/bin/python3 - "$metadata" "$CONTENT_ARTIFACT_ID" "$CONTENT_ARTIFACT_DIGEST" "$RECEIPT_CONTENT_NAME" "$CALLER_RUN_ID" "$CALLER_RUN_ATTEMPT" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          artifact_id, digest, name, run_id, attempt, output = sys.argv[2:]
          workflow_run = payload.get("workflow_run")
          if (
              type(payload.get("id")) is not int or str(payload["id"]) != artifact_id
              or payload.get("name") != name or payload.get("expired") is not False
              or type(payload.get("size_in_bytes")) is not int or payload["size_in_bytes"] <= 0
              or payload.get("digest") != digest or not isinstance(workflow_run, dict)
              or str(workflow_run.get("id")) != run_id
              or workflow_run.get("run_attempt") not in (None, int(attempt))
          ):
              raise SystemExit("receipt content artifact metadata is not exact")
          with Path(output).open("a", encoding="utf-8") as stream:
              stream.write(f"artifact_size={payload['size_in_bytes']}\n")
              stream.write(f"artifact_digest={digest}\n")
          PY
          rm -f -- "$metadata"

      - name: Create immutable closed release receipt
        if: ${{ success() && env.CALLER_KIND == 'auto' && steps.receipt-metadata.outputs.artifact_size != '' }}
        shell: bash
        env:
          CONTENT_ARTIFACT_ID: ${{ steps.upload-receipt-content.outputs.artifact-id }}
          CONTENT_ARTIFACT_SIZE: ${{ steps.receipt-metadata.outputs.artifact_size }}
          CONTENT_ARTIFACT_DIGEST: ${{ steps.receipt-metadata.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP/platform-release-receipt-content.json" "$RUNNER_TEMP/platform-release-receipt.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "platform/tools")
          from platform_release_receipt import write_receipt
          source = json.loads(Path(sys.argv[1]).read_text(encoding="ascii"))
          content = Path(sys.argv[1]).read_bytes()
          source["artifact"] = {
              "id": int(os.environ["CONTENT_ARTIFACT_ID"]),
              "name": source["artifact"]["name"],
              "size_bytes": int(os.environ["CONTENT_ARTIFACT_SIZE"]),
              "digest": os.environ["CONTENT_ARTIFACT_DIGEST"],
              "member": "platform-release-receipt.json",
              "content_sha256": hashlib.sha256(content).hexdigest(),
              "workflow_run_id": os.environ["CALLER_RUN_ID"],
              "workflow_run_attempt": os.environ["CALLER_RUN_ATTEMPT"],
          }
          write_receipt(Path(sys.argv[2]), source)
          PY
          test "$(stat -c '%F:%a:%h' "$RUNNER_TEMP/platform-release-receipt.json")" = "regular file:600:1"

      - name: Upload immutable closed release receipt
        if: ${{ success() && env.CALLER_KIND == 'auto' && steps.receipt-metadata.outputs.artifact_size != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.RECEIPT_NAME }}
          path: ${{ runner.temp }}/platform-release-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Mark top-level release successful
        if: ${{ success() && inputs.mode == 'deploy' && needs.production.result == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          /usr/bin/python3 - "$STATUS_URL" <<'PY' > "$RUNNER_TEMP/platform-success-status.json"
          import json
          import sys
          print(json.dumps({
              "state": "success",
              "context": "platform-production-deploy",
              "description": "Production deployment and live smoke passed",
              "target_url": sys.argv[1],
          }, separators=(",", ":")))
          PY
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data-binary @"$RUNNER_TEMP/platform-success-status.json"
          rm -f -- "$RUNNER_TEMP/platform-success-status.json" "$RUNNER_TEMP/platform-release-receipt-content.json" "$RUNNER_TEMP/platform-release-receipt.json"
          {
            echo "### Platform production deploy"
            echo
            echo "- Commit: `$TARGET_SHA`"
            echo "- Mode: `deploy`"
            echo "- Result: closed successfully"
            echo "- Status URL: $STATUS_URL"
            echo "- Release receipt: `$RECEIPT_NAME`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release authority temporary data
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/platform-pending-status.json" "$RUNNER_TEMP/platform-failure-status.json" "$RUNNER_TEMP/platform-release-receipt-content.json" "$RUNNER_TEMP/platform-release-receipt.json" "$RUNNER_TEMP/platform-success-status.json"
