      - name: Upload verified CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          test -s "$input_path"
          require_current_dev_head() {
            local branch_json dev_sha
            branch_json="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev")"
            dev_sha="$(printf '%s' "$branch_json" | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); sha=payload["commit"]["sha"]; assert isinstance(sha,str) and len(sha)==40 and all(c in "0123456789abcdef" for c in sha), "current dev head SHA is malformed"; print(sha)')"
            test "$dev_sha" = "$TARGET_SHA" || { echo "Refusing production side effects: dev moved from $TARGET_SHA to $dev_sha." >&2; exit 1; }
          }
          require_current_dev_head
          timeout --foreground 300s ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" production-prepare-artifact < "$input_path"
          timeout --foreground 300s scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_ARTIFACT" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          timeout --foreground 300s scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_PROVENANCE" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          timeout --foreground 300s scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_CHECKSUM" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"

      - name: Run production preflight or deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          branch_json="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev")"
          dev_sha="$(printf '%s' "$branch_json" | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); sha=payload["commit"]["sha"]; assert isinstance(sha,str) and len(sha)==40 and all(c in "0123456789abcdef" for c in sha), "current dev head SHA is malformed"; print(sha)')"
          test "$dev_sha" = "$TARGET_SHA" || { echo "Refusing activation: dev moved from $TARGET_SHA to $dev_sha." >&2; exit 1; }
          remote_log="$RUNNER_TEMP/platform-production-deploy-remote.log"
          remote_error="$RUNNER_TEMP/platform-production-deploy-remote-error.log"
          umask 077; : > "$remote_log"; : > "$remote_error"; chmod 600 "$remote_log" "$remote_error"
          set +e
          timeout --foreground 2100s ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" production-deploy < "$input_path" > "$remote_log" 2> "$remote_error"
          remote_status="$?"
          set -e
          marker_pattern='^(RELEASE_DEPLOY schema=1 status=(passed|failed|review) class=(preflight|deployment|argument|privilege|policy|layout|service_state|readiness|lock|quiesce|recovery|artifact|pending_operation|transaction|abort|remote_or_transport)( phase=(artifact|provenance|preflight|candidate|readiness) reason=(internal|host_tools_invalid|lock|environment|service_state|nginx_config|preflight_failed|artifact_missing|artifact_count_invalid|checksum_missing|provenance_missing|artifact_name_invalid|release_slug_mismatch|checksum_mismatch|validation_failed|provenance_invalid|candidate_missing|activation_failed|lock_lost|runtime_profile_failed))? release_slug=(unavailable|[A-Za-z0-9][A-Za-z0-9._-]{0,179}) source_sha=(unavailable|[0-9a-f]{40,64})$|^RELEASE_DEPLOY schema=1 status=failed class=preflight phase=preflight reason=baseline_changed release_slug=(unavailable|[A-Za-z0-9][A-Za-z0-9._-]{0,179}) source_sha=(unavailable|[0-9a-f]{40,64})$|^RELEASE_DEPLOY schema=1 status=failed class=preflight phase=preflight reason=lock lock_stage=(helper_metadata|release_supervise|release_open|retained_supervise|retained_open) release_slug=(unavailable|[A-Za-z0-9][A-Za-z0-9._-]{0,179}) source_sha=(unavailable|[0-9a-f]{40,64})$)'
          public_line="$(grep -E "$marker_pattern" "$remote_log" | tail -n 1 || true)"
          if [[ -z "$public_line" ]]; then
            stdout_bytes="$(wc -c < "$remote_log" | tr -d '[:space:]')"
            stderr_bytes="$(wc -c < "$remote_error" | tr -d '[:space:]')"
            remote_line_count="$(wc -l < "$remote_log" | tr -d '[:space:]')"
            remote_diagnostic_pattern='^RELEASE_REMOTE_DIAGNOSTIC schema=1 status=failed reason=(missing_marker|invalid_marker|oversized_marker) child_exit=(0|-?[1-9][0-9]{0,2}) observed_bytes=(0|[1-9][0-9]{0,2}) dispatcher_exit=([1-9][0-9]{0,2})$'
            remote_diagnostic_count="$(grep -Ec "$remote_diagnostic_pattern" "$remote_log" || true)"
            if [[ "$remote_diagnostic_count" == 1 && "$remote_line_count" == 1 \
              && "$stderr_bytes" == 0 && "$stdout_bytes" -le 512 \
              && "$remote_status" =~ ^(0|[1-9][0-9]{0,2})$ ]]; then
              remote_diagnostic_line="$(< "$remote_log")"
              if [[ "$remote_diagnostic_line" =~ $remote_diagnostic_pattern ]]; then
                diagnostic_reason="${BASH_REMATCH[1]}"
                child_exit="${BASH_REMATCH[2]}"
                observed_bytes="${BASH_REMATCH[3]}"
                dispatcher_exit="${BASH_REMATCH[4]}"
                diagnostic_valid=1
                child_magnitude="${child_exit#-}"
                (( child_magnitude <= 255 )) || diagnostic_valid=0
                (( observed_bytes <= 513 )) || diagnostic_valid=0
                (( dispatcher_exit <= 255 )) || diagnostic_valid=0
                (( remote_status <= 255 )) || diagnostic_valid=0
                case "$diagnostic_reason:$observed_bytes" in
                  missing_marker:0) ;;
                  invalid_marker:*)
                    if (( observed_bytes < 1 || observed_bytes > 512 )); then
                      diagnostic_valid=0
                    fi
                    ;;
                  oversized_marker:513) ;;
                  *) diagnostic_valid=0 ;;
                esac
                expected_dispatcher_exit=2
                if (( child_exit > 0 )); then
                  expected_dispatcher_exit="$child_exit"
                elif (( child_exit < 0 )); then
                  expected_dispatcher_exit="$((256 + child_exit))"
                fi
                (( dispatcher_exit == expected_dispatcher_exit )) || diagnostic_valid=0
                (( remote_status == dispatcher_exit && remote_status != 0 )) || diagnostic_valid=0
                if (( diagnostic_valid == 1 )); then
                  printf '%s\n' "$remote_diagnostic_line"
                  exit "$remote_status"
                fi
              fi
            fi
            public_line='RELEASE_DEPLOY schema=1 status=failed class=remote_or_transport release_slug=unavailable source_sha=unavailable'
            printf '%s\n' "$public_line"
            stdout_bytes="$(wc -c < "$remote_log" | tr -d '[:space:]')"
            stderr_bytes="$(wc -c < "$remote_error" | tr -d '[:space:]')"
            diagnostic_reason=unclassified
            if [[ "$remote_status" == 124 || "$remote_status" == 137 ]]; then
              diagnostic_reason=timeout
            elif [[ "$remote_status" == 255 ]]; then
              diagnostic_reason=ssh_or_remote_255
            elif [[ "$stdout_bytes" == 0 && "$stderr_bytes" == 0 ]]; then
              diagnostic_reason=empty_output
            elif [[ "$stdout_bytes" != 0 ]]; then
              diagnostic_reason=unrecognized_stdout
            elif [[ "$stderr_bytes" != 0 ]]; then
              diagnostic_reason=stderr_without_marker
            fi
            printf 'RELEASE_REMOTE_DIAGNOSTIC schema=1 status=failed reason=%s remote_exit=%s stdout_bytes=%s stderr_bytes=%s\n' \
              "$diagnostic_reason" "$remote_status" "$stdout_bytes" "$stderr_bytes"
            (( remote_status != 0 )) && exit "$remote_status"
            exit 1
          fi
          printf '%s\n' "$public_line"
          exit "$remote_status"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-deploy-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-deploy-ssh"
          rm -f -- "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$RUNNER_TEMP/platform-production-deploy-remote.log" "$RUNNER_TEMP/platform-production-deploy-remote-error.log" "$RUNNER_TEMP/platform-release-artifact.zip" \
            "$RUNNER_TEMP/host-tools-production-attempt.json" \
            "$RUNNER_TEMP/host-tools-handoff-metadata.json" "$RUNNER_TEMP/host-tools-handoff.zip" \
            "$RUNNER_TEMP/host-tools-production-metadata.json" "$RUNNER_TEMP/host-tools-production.zip" \
            "$RUNNER_TEMP/host-tools-production-attestation.json" "$RUNNER_TEMP/host-tools-production-jobs.json"
          rm -rf -- "$RUNNER_TEMP/host-tools-production-envelope" "$RUNNER_TEMP/host-tools-handoff"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Deployment summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "### Platform production deploy"
            echo
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Web compression: \`$PLATFORM_WEB_NEXT_COMPRESSION\`"
            echo "- Status: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark production deployment successful
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" --data "{\"state\":\"success\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment and live smoke passed\",\"target_url\":\"${run_url}\"}"

      - name: Mark production deployment failed
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" --data "{\"state\":\"failure\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment failed\",\"target_url\":\"${run_url}\"}"
