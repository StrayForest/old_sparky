name: Platform production deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run production preflight only or perform the full immutable deployment"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy
      runtime_profile:
        description: "Reviewed runtime capacity profile to apply after deployment"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - ready-vote-static-4
          - ready-vote-static-6
          - ready-vote-static-8
          - ready-vote-static-12
          - ready-vote-static-16
          - api-3x16
          - api-1x48

permissions:
  actions: read
  contents: read
  statuses: write
  id-token: write
  attestations: write

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  production:
    if: >-
      github.event_name == 'workflow_dispatch'
    name: ${{ inputs.mode == 'deploy' && 'Deploy production' || 'Production preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: ${{ inputs.mode }}
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      RELEASE_SLUG: gha-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Require successful platform security build
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status_json="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status"
          )"
          security_state="$(
            printf '%s' "$status_json" | /usr/bin/python3 -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          statuses = [
              item for item in payload.get("statuses", [])
              if item.get("context") == "platform-security-build"
          ]
          if not statuses:
              raise SystemExit("platform-security-build status is missing")
          latest = max(
              statuses,
              key=lambda item: item.get("updated_at")
              or item.get("created_at")
              or "",
          )
          print(latest.get("state") or "")
          '
          )"
          test "$security_state" = success || {
            echo "Refusing production deploy: platform-security-build=$security_state for $TARGET_SHA" >&2
            exit 1
          }

      - name: Mark production deployment pending
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment is running\",\"target_url\":\"${run_url}\"}"

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }

      - name: Require reviewed dev branch for deployment
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production deploys must target the reviewed dev branch." >&2; exit 1; }

      - name: Checkout the CI-verified source
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build immutable release artifact in CI
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- platform)"
          ci_build_root=/root/old_sparky
          sudo rm -rf -- "$ci_build_root"
          sudo install -d -o root -g root -m 0755 "$ci_build_root"
          sudo cp -a "$GITHUB_WORKSPACE/." "$ci_build_root/"
          sudo chown -R root:root "$ci_build_root"
          sudo -EH python3 -m venv "$ci_build_root/platform/.venv_platform"
          sudo install -d -o root -g root -m 0755 "$ci_build_root/platform/dist/releases"
          sudo -EH env \
            PLATFORM_RELEASE_OUTPUT_DIR="$ci_build_root/platform/dist/releases" \
            "$ci_build_root/platform/tools/platform_build_release.sh" "$RELEASE_SLUG"
          release_archive="$(sudo find "$ci_build_root/platform/dist/releases" -maxdepth 1 -type f -name "${RELEASE_SLUG}-*.tar.gz" -print -quit)"
          test -n "$release_archive" || { echo "CI release artifact was not produced" >&2; exit 1; }
          release_checksum="${release_archive}.sha256"
          sudo test -f "$release_checksum"
          release_output="$GITHUB_WORKSPACE/ci-release"
          rm -rf -- "$release_output"
          install -d -m 0755 "$release_output"
          sudo install -m 0644 "$release_archive" "$release_output/$(basename "$release_archive")"
          sudo install -m 0644 "$release_checksum" "$release_output/$(basename "$release_checksum")"
          sudo chown "$(id -u):$(id -g)" \
            "$release_output/$(basename "$release_archive")" \
            "$release_output/$(basename "$release_checksum")"
          (cd "$release_output" && sha256sum -c "$(basename "$release_checksum")")

      - name: Publish immutable release artifact
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        id: publish-release-artifact
        uses: actions/upload-artifact@v6
        with:
          name: platform-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest immutable release artifact
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ci-release/*.tar.gz

      - name: Download published release artifact for deployment
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        uses: actions/download-artifact@v6
        with:
          name: platform-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-release-published

      - name: Verify published release artifact
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_ARTIFACT_ID: ${{ steps.publish-release-artifact.outputs.artifact-id }}
          PUBLISHED_ARTIFACT_DIGEST: ${{ steps.publish-release-artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$PUBLISHED_ARTIFACT_ID"
          test -n "$PUBLISHED_ARTIFACT_DIGEST"
          PUBLISHED_ARTIFACT_DIGEST="${PUBLISHED_ARTIFACT_DIGEST#sha256:}"
          [[ "$PUBLISHED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "Published GitHub artifact digest is invalid" >&2; exit 1; }
          artifact_zip="$RUNNER_TEMP/platform-release-artifact.zip"
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PUBLISHED_ARTIFACT_ID}/zip" \
            --output "$artifact_zip"
          printf '%s  %s\n' "$PUBLISHED_ARTIFACT_DIGEST" "$artifact_zip" | sha256sum -c -
          printf 'Published GitHub artifact digest: %s\n' "$PUBLISHED_ARTIFACT_DIGEST"
          release_archive="$(find ci-release-published -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$release_archive" || { echo "Published release artifact is missing" >&2; exit 1; }
          release_checksum="${release_archive}.sha256"
          test -f "$release_checksum" || { echo "Published release checksum is missing" >&2; exit 1; }
          (cd "$(dirname "$release_archive")" && sha256sum -c "$(basename "$release_checksum")")
          /usr/bin/python3 - "$release_archive" "$TARGET_SHA" "$PUBLISHED_ARTIFACT_ID" "$PUBLISHED_ARTIFACT_DIGEST" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          archive, target_sha, artifact_id, artifact_digest = sys.argv[1:]
          archive_path = Path(archive)
          payload = {
              "artifact_id": artifact_id,
              "artifact_digest": artifact_digest,
              "artifact_file": archive_path.name,
              "artifact_sha256": hashlib.sha256(archive_path.read_bytes()).hexdigest(),
              "source_git_commit": target_sha,
          }
          Path("ci-release-published/RELEASE.provenance.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          printf 'RELEASE_ARTIFACT=%s\n' "$GITHUB_WORKSPACE/$release_archive" >> "$GITHUB_ENV"
          printf 'RELEASE_CHECKSUM=%s\n' "$GITHUB_WORKSPACE/$release_checksum" >> "$GITHUB_ENV"
          printf 'RELEASE_PROVENANCE=%s\n' "$GITHUB_WORKSPACE/ci-release-published/RELEASE.provenance.json" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/old_sparky_prod
          chmod 600 ~/.ssh/old_sparky_prod
          ssh_scan="$(mktemp)"
          trap 'rm -f -- "$ssh_scan"' EXIT
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" || { echo "Production SSH host exposed no ED25519 key" >&2; exit 1; }
          ssh_key_count="$(wc -l < "$ssh_scan" | tr -d ' ')"
          test "$ssh_key_count" = "1" || { echo "Expected exactly one production ED25519 host key" >&2; exit 1; }
          ssh_fingerprint="$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$ssh_fingerprint" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" || {
            echo "Production SSH host fingerprint mismatch" >&2
            exit 1
          }
          install -m 0600 "$ssh_scan" ~/.ssh/known_hosts
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s/.ssh/known_hosts\n' "$HOME"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH connection
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            'printf "SSH connection OK\n"'

      - name: Upload verified CI artifact
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "install -d -o root -g root -m 0700 '$ARTIFACT_REMOTE_DIR'"
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod \
            "$RELEASE_ARTIFACT" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod \
            "$RELEASE_PROVENANCE" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod \
            "$RELEASE_CHECKSUM" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"

      - name: Run production preflight or deployment
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:12}"
          release_slug="${RELEASE_SLUG:0:32}-${short_sha}"

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/old_sparky_prod \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA' '$release_slug' '$DEPLOY_MODE' '$ARTIFACT_REMOTE_DIR' '$RUNTIME_PROFILE'" <<'REMOTE'
          set -Eeuo pipefail

          target_sha="$1"
          release_slug="$2"
          deploy_mode="$3"
          artifact_dir="$4"
          runtime_profile="$5"

          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          artifact_path=""
          provenance_path="$artifact_dir/RELEASE.provenance.json"
          bootstrap_dir=""

          fail() {
            printf 'ERROR: %s\n' "$*" >&2
            exit 1
          }

          cleanup() {
            if [[ -n "$artifact_dir" && -d "$artifact_dir" && ! -L "$artifact_dir" ]]; then
              rm -rf -- "$artifact_dir"
            fi
            if [[ -n "$bootstrap_dir" && -d "$bootstrap_dir" && ! -L "$bootstrap_dir" ]]; then
              rm -rf -- "$bootstrap_dir"
            fi
          }
          trap cleanup EXIT

          test "$(id -u)" -eq 0 || fail "deployment user must be root"
          test -L "$current" || fail "current release symlink is missing"
          test -L "$runtime/previous" || fail "previous release symlink is missing"
          test -x "$current/tools/platform_release_preflight.sh" || fail "release preflight tool is missing"
          test -x "$current/tools/platform_deploy_smoke.py" || fail "deploy smoke tool is missing"

          for service in deadlock-api deadlock-worker deadlock-web; do
            systemctl is-active --quiet "$service" || fail "$service is not active before deployment"
          done

          nginx -t >/dev/null

          "$current/tools/platform_release_preflight.sh" \
            --require-previous \
            --require-verified-backup \
            --require-edge-parity \
            --backup-max-age-hours 24

          if [[ "$deploy_mode" == "preflight" ]]; then
            printf 'Production preflight passed.\n'
            exit 0
          fi

          [[ "$deploy_mode" == "deploy" ]] || fail "unsupported deployment mode"
          test -d "$artifact_dir" && test ! -L "$artifact_dir" \
            || fail "CI release artifact directory is missing"

          artifact_path="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$artifact_path" || fail "CI release artifact is missing"
          artifact_checksum="${artifact_path}.sha256"
          test -f "$artifact_checksum" && test ! -L "$artifact_checksum" \
            || fail "CI release checksum is missing"
          test -f "$provenance_path" && test ! -L "$provenance_path" \
            || fail "CI release provenance is missing"
          artifact_name="$(basename "$artifact_path")"
          artifact_slug="${artifact_name%.tar.gz}"
          (cd "$artifact_dir" && sha256sum -c "$(basename "$artifact_checksum")") \
            || fail "CI release artifact digest mismatch"
          bootstrap_dir="$(mktemp -d /tmp/old-sparky-release-bootstrap.XXXXXX)"
          chmod 0700 "$bootstrap_dir"
          "$current/tools/platform_validate_release_artifact.py" \
            --artifact "$artifact_path" \
            --checksum "$artifact_checksum" \
            --release-slug "$artifact_slug" \
            --extract-to "$bootstrap_dir" \
            || fail "CI release artifact provenance is invalid"
          if ! /usr/bin/python3 - "$artifact_path" "$artifact_slug" "$target_sha" "$provenance_path" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys
          import tarfile

          artifact, slug, expected_commit, provenance_path = sys.argv[1:]
          provenance = json.loads(Path(provenance_path).read_text(encoding="utf-8"))
          if not re.fullmatch(r"[0-9a-f]{64}", str(provenance.get("artifact_digest"))):
              raise SystemExit("published artifact digest is invalid")
          if provenance.get("source_git_commit") != expected_commit:
              raise SystemExit("provenance source commit does not match expected commit")
          if provenance.get("artifact_file") != Path(artifact).name:
              raise SystemExit("provenance artifact name does not match uploaded artifact")
          actual_sha256 = hashlib.sha256(Path(artifact).read_bytes()).hexdigest()
          if provenance.get("artifact_sha256") != actual_sha256:
              raise SystemExit("provenance artifact checksum does not match uploaded artifact")
          with tarfile.open(Path(artifact), mode="r:gz") as archive:
              member = archive.getmember(f"{slug}/RELEASE.json")
              handle = archive.extractfile(member)
              if handle is None:
                  raise SystemExit("RELEASE.json is missing")
              payload = json.load(handle)
          if payload.get("source_git_commit") != expected_commit:
              raise SystemExit("release source commit does not match expected commit")
          PY
          then
            fail "CI release source commit does not match target SHA"
          fi

          "$current/tools/platform_release_preflight.sh" \
            --app-dir "$runtime" \
            --require-previous \
            --require-verified-backup \
            --require-edge-parity \
            --backup-max-age-hours 24

          candidate_deploy="$bootstrap_dir/$artifact_slug/tools/platform_release_deploy.sh"
          test -x "$candidate_deploy" || fail "candidate release deploy tool is missing"
          LC_ALL=C.UTF-8 "$candidate_deploy" \
            --artifact "$artifact_path" \
            --app-dir "$runtime" \
            --edge-origin https://127.0.0.1 \
            --edge-host old-sparky.com \
            --expected-csp-mode enforce

          case "$runtime_profile" in
            baseline)
              "$runtime/shared/venv/bin/python" "$current/tools/platform_configure_shared_env.py" \
                --apply \
                --confirm APPLY_PUBLIC_PRODUCTION_BASELINE \
                --profile baseline \
                --only PLATFORM_API_WORKERS \
                --only PLATFORM_DB_POOL_SIZE \
                --only PLATFORM_DB_MAX_OVERFLOW \
                --only PLATFORM_DB_CONNECTION_BUDGET
              systemctl restart deadlock-api
              api_ready=false
              for _ in $(seq 1 30); do
                if systemctl is-active --quiet deadlock-api \
                  && curl --fail --silent --show-error --max-time 2 \
                    http://127.0.0.1:8010/api/v1/health/ready >/dev/null; then
                  api_ready=true
                  break
                fi
                sleep 1
              done
              [[ "$api_ready" == true ]] \
                || fail "API did not recover on baseline runtime profile"
              ;;
            ready-vote-static-4|ready-vote-static-6|ready-vote-static-8|ready-vote-static-12|ready-vote-static-16)
              "$runtime/shared/venv/bin/python" "$current/tools/platform_configure_shared_env.py" \
                --apply \
                --confirm APPLY_PUBLIC_PRODUCTION_BASELINE \
                --profile "$runtime_profile" \
                --only PLATFORM_READY_VOTE_ADMISSION_MIN_CONCURRENCY \
                --only PLATFORM_READY_VOTE_ADMISSION_INITIAL_CONCURRENCY \
                --only PLATFORM_READY_VOTE_ADMISSION_MAX_CONCURRENCY
              systemctl restart deadlock-api
              api_ready=false
              for _ in $(seq 1 30); do
                if systemctl is-active --quiet deadlock-api \
                  && curl --fail --silent --show-error --max-time 2 \
                    http://127.0.0.1:8010/api/v1/health/ready >/dev/null; then
                  api_ready=true
                  break
                fi
                sleep 1
              done
              if [[ "$api_ready" != true ]]; then
                "$runtime/shared/venv/bin/python" "$current/tools/platform_configure_shared_env.py" \
                  --apply \
                  --confirm APPLY_PUBLIC_PRODUCTION_BASELINE \
                  --profile baseline \
                  --only PLATFORM_READY_VOTE_ADMISSION_MIN_CONCURRENCY \
                  --only PLATFORM_READY_VOTE_ADMISSION_INITIAL_CONCURRENCY \
                  --only PLATFORM_READY_VOTE_ADMISSION_MAX_CONCURRENCY
                systemctl restart deadlock-api
                api_ready=false
                for _ in $(seq 1 30); do
                  if systemctl is-active --quiet deadlock-api \
                    && curl --fail --silent --show-error --max-time 2 \
                      http://127.0.0.1:8010/api/v1/health/ready >/dev/null; then
                    api_ready=true
                    break
                  fi
                  sleep 1
                done
                [[ "$api_ready" == true ]] \
                  || fail "static Ready Vote profile health check failed; baseline restore failed"
                fail "static Ready Vote profile health check failed; baseline restored"
              fi
              ;;
            api-3x16)
              "$runtime/shared/venv/bin/python" "$current/tools/platform_configure_shared_env.py" \
                --apply \
                --confirm APPLY_PUBLIC_PRODUCTION_BASELINE \
                --profile api-3x16 \
                --only PLATFORM_API_WORKERS \
                --only PLATFORM_DB_POOL_SIZE \
                --only PLATFORM_DB_MAX_OVERFLOW \
                --only PLATFORM_DB_CONNECTION_BUDGET
              systemctl restart deadlock-api
              api_ready=false
              for _ in $(seq 1 30); do
                if systemctl is-active --quiet deadlock-api \
                  && curl --fail --silent --show-error --max-time 2 \
                    http://127.0.0.1:8010/api/v1/health/ready >/dev/null; then
                  api_ready=true
                  break
                fi
                sleep 1
              done
              if [[ "$api_ready" != true ]]; then
                "$runtime/shared/venv/bin/python" "$current/tools/platform_configure_shared_env.py" \
                  --apply \
                  --confirm APPLY_PUBLIC_PRODUCTION_BASELINE \
                  --profile baseline \
                  --only PLATFORM_API_WORKERS \
                  --only PLATFORM_DB_POOL_SIZE \
                  --only PLATFORM_DB_MAX_OVERFLOW \
                  --only PLATFORM_DB_CONNECTION_BUDGET
                systemctl restart deadlock-api
                api_ready=false
                for _ in $(seq 1 30); do
                  if systemctl is-active --quiet deadlock-api \
                    && curl --fail --silent --show-error --max-time 2 \
                      http://127.0.0.1:8010/api/v1/health/ready >/dev/null; then
                    api_ready=true
                    break
                  fi
                  sleep 1
                done
                [[ "$api_ready" == true ]] \
                  || fail "API did not recover on baseline runtime profile"
                fail "runtime profile health check failed; baseline restored"
              fi
              ;;
            api-1x48)
              "$runtime/shared/venv/bin/python" "$current/tools/platform_configure_shared_env.py" \
                --apply \
                --confirm APPLY_PUBLIC_PRODUCTION_BASELINE \
                --profile api-1x48 \
                --only PLATFORM_API_WORKERS \
                --only PLATFORM_DB_POOL_SIZE \
                --only PLATFORM_DB_MAX_OVERFLOW \
                --only PLATFORM_DB_CONNECTION_BUDGET
              systemctl restart deadlock-api
              api_ready=false
              for _ in $(seq 1 30); do
                if systemctl is-active --quiet deadlock-api \
                  && curl --fail --silent --show-error --max-time 2 \
                    http://127.0.0.1:8010/api/v1/health/ready >/dev/null; then
                  api_ready=true
                  break
                fi
                sleep 1
              done
              if [[ "$api_ready" != true ]]; then
                "$runtime/shared/venv/bin/python" "$current/tools/platform_configure_shared_env.py" \
                  --apply \
                  --confirm APPLY_PUBLIC_PRODUCTION_BASELINE \
                  --profile baseline \
                  --only PLATFORM_API_WORKERS \
                  --only PLATFORM_DB_POOL_SIZE \
                  --only PLATFORM_DB_MAX_OVERFLOW \
                  --only PLATFORM_DB_CONNECTION_BUDGET
                systemctl restart deadlock-api
                api_ready=false
                for _ in $(seq 1 30); do
                  if systemctl is-active --quiet deadlock-api \
                    && curl --fail --silent --show-error --max-time 2 \
                      http://127.0.0.1:8010/api/v1/health/ready >/dev/null; then
                    api_ready=true
                    break
                  fi
                  sleep 1
                done
                [[ "$api_ready" == true ]] \
                  || fail "API did not recover on baseline runtime profile"
                fail "runtime profile health check failed; baseline restored"
              fi
              ;;
            *)
              fail "unsupported runtime profile: $runtime_profile"
              ;;
          esac

          printf 'Production deployment completed for %s.\n' "$target_sha"
          REMOTE

      - name: Deployment summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "### Platform production $DEPLOY_MODE"
            echo
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Mode: \`$DEPLOY_MODE\`"
            echo "- Status: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark production deployment successful
        if: ${{ success() && env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment and live smoke passed\",\"target_url\":\"${run_url}\"}"

      - name: Mark production deployment failed
        if: ${{ failure() && env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment failed\",\"target_url\":\"${run_url}\"}"
