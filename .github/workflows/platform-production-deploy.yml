          expected_values = {
              "schema": "1", "target_sha": target_sha, "host_tools_sha": host_tools_sha,
              "artifact_id": artifact_id, "artifact_name": artifact_name, "artifact_size": artifact_size,
              "artifact_digest": artifact_digest, "bundle_sha256": bundle_sha,
              "manifest_sha256": manifest_sha, "capabilities_sha256": capabilities_sha,
              "files_contract_sha256": files_contract_sha, "modes_contract_sha256": modes_contract_sha,
