                      and claims.get("sourceRepositoryURI") == repo_uri
                      and claims.get("sourceRepositoryRef") == "refs/heads/dev"
                      and claims.get("sourceRepositoryDigest") == source
                      and claims.get("buildConfigURI") == build
                      and claims.get("buildSignerURI") == build
                      and claims.get("runInvocationURI") == invocation)
