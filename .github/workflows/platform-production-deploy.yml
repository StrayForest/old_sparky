          /usr/bin/python3 - "$manifest_path" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          target_sha = sys.argv[2]
