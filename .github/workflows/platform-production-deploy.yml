              "artifact_digest", "bundle_sha256", "manifest_sha256", "capabilities_sha256",
              "files_contract_sha256", "modes_contract_sha256", "signer_workflow", "source_ref",
              "source_digest", "attestation_run_id", "attestation_run_attempt", "attestation_job_id",
          }
