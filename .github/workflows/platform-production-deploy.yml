name: Platform production deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run production preflight only or perform the full immutable deployment"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy

permissions:
  contents: read
  statuses: write

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  production:
    if: >-
      github.event_name == 'workflow_dispatch'
    name: ${{ inputs.mode == 'deploy' && 'Deploy production' || 'Production preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: ${{ inputs.mode }}
      RELEASE_SLUG: gha-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_ARCHIVE: /tmp/old-sparky-source-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz

    steps:
      - name: Mark production deployment pending
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment is running\",\"target_url\":\"${run_url}\"}"

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }

      - name: Checkout the CI-verified source
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Package verified source checkout
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- platform)"
          tar -C "$GITHUB_WORKSPACE" -czf "$SOURCE_ARCHIVE" \
            --exclude='./platform/dist/releases' \
            .

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/old_sparky_prod
          chmod 600 ~/.ssh/old_sparky_prod
          ssh-keyscan -T 10 -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH connection
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            'printf "SSH connection OK\n"'

      - name: Upload verified source
        if: ${{ env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod \
            "$SOURCE_ARCHIVE" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$SOURCE_ARCHIVE"

      - name: Run production preflight or deployment
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:12}"
          release_slug="${RELEASE_SLUG:0:32}-${short_sha}"

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/old_sparky_prod \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA' '$release_slug' '$DEPLOY_MODE' '$SOURCE_ARCHIVE'" <<'REMOTE'
          set -Eeuo pipefail

          target_sha="$1"
          release_slug="$2"
          deploy_mode="$3"
          source_archive="$4"

          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          source_dir="/tmp/old-sparky-source-${release_slug}"

          fail() {
            printf 'ERROR: %s\n' "$*" >&2
            exit 1
          }

          cleanup() {
            rm -rf -- "$source_dir"
            rm -f -- "$source_archive"
          }
          trap cleanup EXIT

          test "$(id -u)" -eq 0 || fail "deployment user must be root"
          test -L "$current" || fail "current release symlink is missing"
          test -L "$runtime/previous" || fail "previous release symlink is missing"
          test -x "$current/tools/platform_release_preflight.sh" || fail "release preflight tool is missing"
          test -x "$current/tools/platform_deploy_smoke.py" || fail "deploy smoke tool is missing"

          for service in deadlock-api deadlock-worker deadlock-web; do
            systemctl is-active --quiet "$service" || fail "$service is not active before deployment"
          done

          nginx -t >/dev/null

          "$current/tools/platform_release_preflight.sh" \
            --require-previous \
            --require-verified-backup \
            --backup-max-age-hours 24

          if [[ "$deploy_mode" == "preflight" ]]; then
            printf 'Production preflight passed.\n'
            exit 0
          fi

          [[ "$deploy_mode" == "deploy" ]] || fail "unsupported deployment mode"
          test -f "$source_archive" && test ! -L "$source_archive" \
            || fail "verified source archive is missing"

          rm -rf -- "$source_dir"
          install -d -o root -g root -m 0755 "$source_dir"
          tar -xzf "$source_archive" -C "$source_dir"
          chown -R root:root "$source_dir"
          install -d -o root -g root -m 0755 "$source_dir/platform/dist"
          test -x "$source_dir/platform/tools/platform_release_deploy.sh" \
            || fail "uploaded source does not contain the release orchestrator"

          cd "$source_dir"
          test "$(git rev-parse --verify HEAD)" = "$target_sha" \
            || fail "uploaded source commit does not match CI-verified commit"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- platform)" \
            || fail "uploaded platform source is not clean"

          python3 -m venv platform/.venv_platform
          platform/.venv_platform/bin/python -m pip install -r platform/requirements-platform.lock.txt
          platform/.venv_platform/bin/python -m pip freeze --all \
            | LC_ALL=C.UTF-8 sort > /tmp/old-sparky-production-freeze.txt
          if ! diff -u platform/requirements-platform.lock.txt /tmp/old-sparky-production-freeze.txt; then
            printf 'Production build runtime freeze differs from the tracked lock; release build will enforce this mismatch.\n' >&2
          fi

          LC_ALL=C.UTF-8 platform/tools/platform_build_release.sh "$release_slug"
          (
            cd platform/dist/releases
            sha256sum -c "${release_slug}"-*.tar.gz.sha256
          )

          "$source_dir/platform/tools/platform_release_preflight.sh" \
            --app-dir "$runtime" \
            --require-previous \
            --require-verified-backup \
            --require-edge-parity \
            --backup-max-age-hours 24

          release_archive="$(find platform/dist/releases -maxdepth 1 -type f -name "${release_slug}-*.tar.gz" -print -quit)"
          test -n "$release_archive" || fail "release archive was not produced"

          LC_ALL=C.UTF-8 "$source_dir/platform/tools/platform_release_deploy.sh" \
            --artifact "$release_archive" \
            --app-dir "$runtime" \
            --edge-origin https://127.0.0.1 \
            --edge-host old-sparky.com \
            --expected-csp-mode enforce

          printf 'Production deployment completed for %s.\n' "$target_sha"
          REMOTE

      - name: Deployment summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "### Platform production $DEPLOY_MODE"
            echo
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Mode: \`$DEPLOY_MODE\`"
            echo "- Status: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark production deployment successful
        if: ${{ success() && env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment and live smoke passed\",\"target_url\":\"${run_url}\"}"

      - name: Mark production deployment failed
        if: ${{ failure() && env.DEPLOY_MODE == 'deploy' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment failed\",\"target_url\":\"${run_url}\"}"
