          import os
          from pathlib import Path
          import shutil
          import stat
          import sys
          import zipfile

          archive_path, destination = map(Path, sys.argv[1:])
          MAX_ARCHIVE_BYTES = 4 * 1024 * 1024
          MAX_ENTRIES = 8
          MAX_MEMBER_BYTES = 256 * 1024
          MAX_TOTAL_BYTES = 512 * 1024
          MAX_COMPRESSION_RATIO = 100

          def reject(condition, message):
