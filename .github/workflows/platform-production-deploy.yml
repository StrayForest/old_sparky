name: Platform production deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run production preflight only or perform the full immutable deployment"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy
      runtime_profile:
        description: "Reviewed runtime capacity profile to apply after deployment"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - ready-vote-static-4
          - ready-vote-static-6
          - ready-vote-static-8
          - ready-vote-cprofile
          - ready-vote-static-12
          - ready-vote-static-16
          - ready-vote-adaptive-v2
          - api-3x16
          - api-1x48
          - read-mix-cprofile
          - authenticated-read-admission-32
          - authenticated-read-admission-24x8
          - pool-pre-ping-off
          - web-ssr-diagnostics
          - web-ssr-native-transport
          - web-ssr-workers-2
          - uvicorn-classic
          - uvicorn-optimized
          - api-pool-12
          - api-pool-16
          - api-pool-20
          - api-pool-24
      web_compression:
        description: "Build the Next.js artifact with response compression enabled or disabled"
        required: true
        default: enabled
        type: choice
        options:
          - enabled
          - disabled
      classifier_run_id:
        description: "Exact successful security workflow run supplying the classifier artifact"
        required: false
        default: ""
        type: string
      classifier_run_attempt:
        description: "Exact attempt number for the classifier workflow run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  # This job may execute the candidate checkout.  It has no production
  # environment and no deployment secret.  It is deliberately always
  # scheduled: an invalid mode must fail here before either mode branch can
  # become a successful skipped no-op.
  validate-dispatch:
    name: Validate deployment dispatch
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: ${{ inputs.mode }}
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      RELEASE_SLUG_BASE: gha-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Reject invalid dispatch values before mode branches
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE" in
            preflight|deploy) ;;
            *) echo "Unsupported deployment mode; refusing a green no-op." >&2; exit 1 ;;
          esac
          case "$RUNTIME_PROFILE" in
            baseline|ready-vote-static-4|ready-vote-static-6|ready-vote-static-8|ready-vote-cprofile|ready-vote-static-12|ready-vote-static-16|ready-vote-adaptive-v2|api-3x16|api-1x48|read-mix-cprofile|authenticated-read-admission-32|authenticated-read-admission-24x8|pool-pre-ping-off|web-ssr-diagnostics|web-ssr-native-transport|web-ssr-workers-2|uvicorn-classic|uvicorn-optimized|api-pool-12|api-pool-16|api-pool-20|api-pool-24) ;;
            *) echo "Unsupported runtime profile." >&2; exit 1 ;;
          esac
          case "$WEB_COMPRESSION" in enabled|disabled) ;; *) echo "Unsupported web compression mode." >&2; exit 1 ;; esac
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Deployment requires an exact target SHA." >&2; exit 1; }
          [[ "$CLASSIFIER_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] || { echo "Classifier run ID is malformed." >&2; exit 1; }
          [[ "$CLASSIFIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]] || { echo "Classifier run attempt is malformed." >&2; exit 1; }

      - name: Checkout dispatch validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate and create closed deployment handoff
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:12}"
          candidate_release_slug="${RELEASE_SLUG_BASE}-${short_sha}"
          [[ "$candidate_release_slug" =~ ^gha-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}-[0-9a-f]{12}$ ]] || {
            echo "Canonical deployment release slug is malformed." >&2
            exit 1
          }
          # The candidate parser is used only on this secret-free runner.  All
          # secret-bearing consumers independently validate the JSON schema.
          /usr/bin/python3 platform/tools/platform_workflow_input_guard.py deployment \
            --output "$RUNNER_TEMP/platform-production-deploy-input.json" \
            --mode "$DEPLOY_MODE" \
            --runtime-profile "$RUNTIME_PROFILE" \
            --release-slug "$candidate_release_slug" \
            --target-sha "$TARGET_SHA" \
            --artifact-remote-dir "$ARTIFACT_REMOTE_DIR" \
            --classifier-run-id "$CLASSIFIER_RUN_ID" \
            --classifier-run-attempt "$CLASSIFIER_RUN_ATTEMPT" \
            --web-compression "$WEB_COMPRESSION"
          test "$(stat -c '%a' "$RUNNER_TEMP/platform-production-deploy-input.json")" = 600

      - name: Publish closed deployment handoff
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-deploy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-production-deploy-input.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove validator handoff
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/platform-production-deploy-input.json"
          test ! -e "$RUNNER_TEMP/platform-production-deploy-input.json"

  # Validate the exact classifier data on a fresh, secret-free runner before
  # the expensive candidate build.  The trusted validator is checked out from
  # the immutable default-branch commit; the deployment candidate is never run.
  validate-classifier:
    name: Validate exact classifier artifact before build
    needs: validate-dispatch
    if: >-
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
    steps:
      - name: Resolve immutable default-branch classifier source
        id: trusted_classifier_default
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: dev
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_REF" = "refs/heads/dev"
          trusted_ref="$RUNNER_TEMP/platform-trusted-classifier-ref.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRUSTED_BRANCH}" \
            --output "$trusted_ref"
          /usr/bin/python3 - "$trusted_ref" "$GITHUB_OUTPUT" "$TRUSTED_BRANCH" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branch = sys.argv[3]
          obj = payload.get("object") if isinstance(payload, dict) else None
          sha = obj.get("sha") if isinstance(obj, dict) else None
          if (
              payload.get("ref") != f"refs/heads/{branch}"
              or not isinstance(obj, dict)
              or obj.get("type") != "commit"
              or not isinstance(sha, str)
              or re.fullmatch(r"[0-9a-f]{40}", sha) is None
          ):
              raise SystemExit("trusted classifier source is not an immutable commit")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
          rm -f -- "$trusted_ref"
      - name: Checkout trusted classifier validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.trusted_classifier_default.outputs.sha }}
          path: trusted-classifier
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact classifier artifact before candidate build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          trusted_tool="$trusted_root/platform/tools/platform_production_classifier_artifact.py"
          test -f "$trusted_tool" && test ! -L "$trusted_tool"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "${{ steps.trusted_classifier_default.outputs.sha }}"
          expected_name="platform-ci-route-${CLASSIFIER_RUN_ID}-${CLASSIFIER_RUN_ATTEMPT}"
          route_dir="$(mktemp -d "$RUNNER_TEMP/platform-ci-route.XXXXXX")"
          trap 'rm -rf -- "$route_dir"' EXIT
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          fetch_classifier_artifacts() {
            local pages_dir="$1" page=1 summary count total expected_total=""
            install -d -m 700 "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail --silent --show-error --location \
                --max-filesize 4194304 \
                "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CLASSIFIER_RUN_ID}/artifacts?per_page=100&page=${page}" \
                --output "$page_path"
              chmod 600 "$page_path"
              summary="$(/usr/bin/python3 "$trusted_tool" page "$page_path")"
              [[ "$summary" =~ ^count=([0-9]+)\ total=([0-9]+)$ ]] || {
                echo "classifier artifact pagination summary is malformed" >&2
                exit 1
              }
              count="${BASH_REMATCH[1]}"
              total="${BASH_REMATCH[2]}"
              if [[ -n "$expected_total" ]]; then
                test "$total" = "$expected_total" || {
                  echo "classifier artifact total changed during pagination" >&2
                  exit 1
                }
              else
                expected_total="$total"
              fi
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 100 )) || {
                echo "classifier artifact pagination exceeded its bound" >&2
                exit 1
              }
            done
          }
          first_pages="$route_dir/artifacts-first"
          second_pages="$route_dir/artifacts-second"
          fetch_classifier_artifacts "$first_pages"
          fetch_classifier_artifacts "$second_pages"
          artifact_id="$(
            /usr/bin/python3 "$trusted_tool" metadata \
              "$first_pages" "$second_pages" \
              --expected-name "$expected_name" \
              --run-id "$CLASSIFIER_RUN_ID" \
              --run-attempt "$CLASSIFIER_RUN_ATTEMPT" \
              --target-sha "$TARGET_SHA"
          )"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "classifier artifact id is malformed" >&2
            exit 1
          }
          curl --fail --silent --show-error --location \
            --max-filesize 4194304 \
            "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$route_dir/artifact.zip"
          /usr/bin/python3 "$trusted_tool" manifest "$route_dir/artifact.zip" --target-sha "$TARGET_SHA"
      - name: Remove trusted classifier validator
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          if [[ -d "$trusted_root" && ! -L "$trusted_root" ]]; then
            rm -rf -- "$trusted_root"
          fi
          test ! -e "$trusted_root" && test ! -L "$trusted_root"

  # Build only the release-independent host-control data on a secret-free
  # runner.  This job never installs or executes anything on production.
  build-host-tools:
    name: Build deterministic host-tools bundle in CI
    needs: validate-dispatch
    if: >-
      needs.validate-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'deploy' || inputs.mode == 'preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET_SHA: ${{ github.sha }}
    outputs:
      artifact_id: ${{ steps.publish-host-tools.outputs.artifact-id }}
      artifact_digest: ${{ steps.publish-host-tools.outputs.artifact-digest }}
      host_tools_sha: ${{ steps.resolve_host_tools_pin.outputs.host_tools_sha }}
    steps:
      - name: Checkout target source as pin metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          path: target-source
          persist-credentials: false

      - name: Require reviewed dev source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          target_source="$GITHUB_WORKSPACE/target-source"
          test "$(git -C "$target_source" rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C "$target_source" status --porcelain=v1 --untracked-files=all -- platform)"

      - name: Resolve reviewed host-tools generation pin
        id: resolve_host_tools_pin
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          test "$EXPECTED_REPOSITORY" = "StrayForest/old_sparky"
          target_source="$GITHUB_WORKSPACE/target-source"
          pin_output="$RUNNER_TEMP/host-tools-pin-output"
          /usr/bin/python3 -I -B "$target_source/platform/tools/platform_host_tools_pin.py" resolve \
            --source-root "$target_source" \
            --target-sha "$TARGET_SHA" \
            --expected-repository "$EXPECTED_REPOSITORY" > "$pin_output"
          test "$(stat -c '%F:%h:%a' -- "$pin_output")" = "regular file:1:600"
          test "$(wc -l < "$pin_output" | tr -d ' ')" = 1
          IFS= read -r host_tools_sha < "$pin_output"
          [[ "$host_tools_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'host_tools_sha=%s\n' "$host_tools_sha" >> "$GITHUB_OUTPUT"
          rm -f -- "$pin_output"
          test ! -e "$pin_output" && test ! -L "$pin_output"

      - name: Checkout pinned host-tools source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.resolve_host_tools_pin.outputs.host_tools_sha }}
          fetch-depth: 1
          path: host-tools-source
          persist-credentials: false

      - name: Require exact pinned host-tools source
        shell: bash
        env:
          HOST_TOOLS_SHA: ${{ steps.resolve_host_tools_pin.outputs.host_tools_sha }}
        run: |
          set -euo pipefail
          host_tools_source="$GITHUB_WORKSPACE/host-tools-source"
          test "$(git -C "$host_tools_source" rev-parse HEAD)" = "$HOST_TOOLS_SHA"
          test -z "$(git -C "$host_tools_source" status --porcelain=v1 --untracked-files=all -- platform/tools)"

      - name: Build and verify deterministic host-tools bundle
        shell: bash
        env:
          HOST_TOOLS_SHA: ${{ steps.resolve_host_tools_pin.outputs.host_tools_sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/host-tools-artifact"
          host_tools_source="$GITHUB_WORKSPACE/host-tools-source"
          /usr/bin/python3 -I -B "$host_tools_source/platform/tools/platform_host_tools_bundle.py" build \
            --source-root "$host_tools_source" \
            --source-sha "$HOST_TOOLS_SHA" \
            --output "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip"
          /usr/bin/python3 -I -B "$host_tools_source/platform/tools/platform_host_tools_bundle.py" verify \
            --bundle "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip" \
            --expected-source-sha "$HOST_TOOLS_SHA" \
            --contract-dir "$RUNNER_TEMP/host-tools-contract"
          test -f "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip"
          test ! -L "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip"
          test "$(stat -c '%F:%a' "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip")" = "regular file:600"
          test "$(stat -c '%s' "$RUNNER_TEMP/host-tools-artifact/platform-host-tools-bundle.zip")" -le 4194304

      - name: Publish exact host-tools bundle
        id: publish-host-tools
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-host-tools-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-tools-artifact/platform-host-tools-bundle.zip
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact host-tools artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_TOOLS_ARTIFACT_ID: ${{ steps.publish-host-tools.outputs.artifact-id }}
          HOST_TOOLS_ARTIFACT_DIGEST: ${{ steps.publish-host-tools.outputs.artifact-digest }}
          HOST_TOOLS_ARTIFACT_NAME: platform-host-tools-bundle-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$HOST_TOOLS_ARTIFACT_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_REF" = "refs/heads/dev"
          HOST_TOOLS_ARTIFACT_DIGEST="${HOST_TOOLS_ARTIFACT_DIGEST#sha256:}"
          [[ "$HOST_TOOLS_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          metadata_path="$RUNNER_TEMP/host-tools-artifact-metadata.json"
          metadata_error="$RUNNER_TEMP/host-tools-artifact-metadata.error"
          if ! curl --fail --silent --show-error --location --max-filesize 524288 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOST_TOOLS_ARTIFACT_ID}" \
            --output "$metadata_path" 2> "$metadata_error"; then
            rm -f -- "$metadata_path" "$metadata_error"
            echo "host-tools artifact metadata request failed" >&2
            exit 1
          fi
          rm -f -- "$metadata_error"
          test "$(stat -c '%F:%a:%h' -- "$metadata_path")" = "regular file:600:1"
          api_zip="$RUNNER_TEMP/platform-host-tools-artifact.zip"
          curl --fail-with-body --silent --show-error --location --max-filesize 8388608 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOST_TOOLS_ARTIFACT_ID}/zip" \
            --output "$api_zip"
          host_tools_source="$GITHUB_WORKSPACE/host-tools-source"
          /usr/bin/python3 -I -B "$host_tools_source/platform/tools/platform_host_tools_bundle.py" verify-artifact-metadata \
            --metadata "$metadata_path" \
            --artifact-id "$HOST_TOOLS_ARTIFACT_ID" \
            --artifact-name "$HOST_TOOLS_ARTIFACT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$TARGET_SHA" \
            --expected-branch dev \
            --artifact-digest "sha256:${HOST_TOOLS_ARTIFACT_DIGEST}" \
            --archive "$api_zip"
          printf '%s  %s\n' "$HOST_TOOLS_ARTIFACT_DIGEST" "$api_zip" | sha256sum -c - >/dev/null 2>/dev/null
          attempt_json="$RUNNER_TEMP/host-tools-workflow-attempt.json"
          attempt_error="$RUNNER_TEMP/host-tools-workflow-attempt.error"
          if ! curl --fail --silent --show-error --location --max-filesize 524288 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --output "$attempt_json" 2> "$attempt_error"; then
            rm -f -- "$attempt_json" "$attempt_error"
            echo "host-tools workflow attempt metadata request failed" >&2
            exit 1
          fi
          rm -f -- "$attempt_error"
          /usr/bin/python3 -I -B "$host_tools_source/platform/tools/platform_host_tools_bundle.py" verify-workflow-attempt \
            --metadata "$attempt_json" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$TARGET_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-branch dev \
            --expected-event workflow_dispatch

      - name: Attest exact host-tools bundle
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/host-tools-artifact/platform-host-tools-bundle.zip

      - name: Remove host-tools build data
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/target-source" "$GITHUB_WORKSPACE/host-tools-source"
          rm -rf -- "$RUNNER_TEMP/host-tools-artifact" "$RUNNER_TEMP/host-tools-contract"
          rm -f -- "$RUNNER_TEMP/platform-host-tools-artifact.zip" \
            "$RUNNER_TEMP/host-tools-artifact-metadata.json" \
            "$RUNNER_TEMP/host-tools-artifact-metadata.error" \
            "$RUNNER_TEMP/host-tools-workflow-attempt.json" \
            "$RUNNER_TEMP/host-tools-workflow-attempt.error"

  # Secret-free verifier: raw artifact validation and external attestation happen
  # before the production environment receives any host-tools claims.
  verify-host-tools:
    name: Verify attested host-tools artifact
    needs:
      - validate-dispatch
      - build-host-tools
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.build-host-tools.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'deploy' || inputs.mode == 'preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      host_tools_sha: ${{ needs.build-host-tools.outputs.host_tools_sha }}
      artifact_id: ${{ steps.verify.outputs.artifact_id }}
      artifact_name: ${{ steps.verify.outputs.artifact_name }}
      artifact_size: ${{ steps.verify.outputs.artifact_size }}
      artifact_digest: ${{ steps.verify.outputs.artifact_digest }}
      bundle_sha256: ${{ steps.verify.outputs.bundle_sha256 }}
      manifest_sha256: ${{ steps.verify.outputs.manifest_sha256 }}
      capabilities_sha256: ${{ steps.verify.outputs.capabilities_sha256 }}
      files_contract_sha256: ${{ steps.verify.outputs.files_contract_sha256 }}
      modes_contract_sha256: ${{ steps.verify.outputs.modes_contract_sha256 }}
      signer_workflow: ${{ steps.verify.outputs.signer_workflow }}
      source_ref: ${{ steps.verify.outputs.source_ref }}
      source_digest: ${{ steps.verify.outputs.source_digest }}
      attestation_run_id: ${{ steps.verify.outputs.attestation_run_id }}
      attestation_run_attempt: ${{ steps.verify.outputs.attestation_run_attempt }}
      attestation_job_id: ${{ steps.verify.outputs.attestation_job_id }}
    steps:
      - name: Checkout pinned host-tools verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build-host-tools.outputs.host_tools_sha }}
          fetch-depth: 1
          path: host-tools-verifier
          persist-credentials: false

      - name: Verify raw artifact and external attestation
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          HOST_TOOLS_SHA: ${{ needs.build-host-tools.outputs.host_tools_sha }}
          HOST_TOOLS_ARTIFACT_ID: ${{ needs.build-host-tools.outputs.artifact_id }}
          HOST_TOOLS_ARTIFACT_DIGEST: ${{ needs.build-host-tools.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HOST_TOOLS_ARTIFACT_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          outer_digest="${HOST_TOOLS_ARTIFACT_DIGEST#sha256:}"
          [[ "$outer_digest" =~ ^[0-9a-f]{64}$ ]]
          artifact_name="platform-host-tools-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          verifier="$GITHUB_WORKSPACE/host-tools-verifier/platform/tools/platform_host_tools_bundle.py"
          metadata="$RUNNER_TEMP/host-tools-metadata.json"
          outer="$RUNNER_TEMP/platform-host-tools-artifact.zip"
          inner="$RUNNER_TEMP/platform-host-tools-bundle.zip"
          contract="$RUNNER_TEMP/host-tools-contract"
          attestation="$RUNNER_TEMP/host-tools-attestation.json"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body --silent --show-error --location --max-filesize 524288 \
            "${headers[@]}" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOST_TOOLS_ARTIFACT_ID}" --output "$metadata"
          curl --fail-with-body --silent --show-error --location --max-filesize 8388608 \
            "${headers[@]}" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HOST_TOOLS_ARTIFACT_ID}/zip" --output "$outer"
          /usr/bin/python3 -I -B "$verifier" verify-artifact-metadata \
            --metadata "$metadata" --artifact-id "$HOST_TOOLS_ARTIFACT_ID" --artifact-name "$artifact_name" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$TARGET_SHA" \
            --expected-branch dev --artifact-digest "sha256:$outer_digest" --archive "$outer"
          printf '%s  %s\n' "$outer_digest" "$outer" | sha256sum -c - >/dev/null 2>/dev/null
          /usr/bin/python3 -I -B "$verifier" verify-outer --outer-bundle "$outer" \
            --expected-outer-sha256 "$outer_digest" --expected-source-sha "$HOST_TOOLS_SHA" \
            --contract-dir "$contract" > "$RUNNER_TEMP/host-tools-verify.txt"
          bundle_sha256="$(sed -n 's/.*inner_sha256=\([0-9a-f]\{64\}\).*/\1/p' "$RUNNER_TEMP/host-tools-verify.txt")"
          [[ "$bundle_sha256" =~ ^[0-9a-f]{64}$ ]]
          /usr/bin/python3 -I -B "$verifier" extract-outer --outer-bundle "$outer" --output "$inner" \
            --expected-outer-sha256 "$outer_digest" --expected-inner-sha256 "$bundle_sha256" >/dev/null
          gh attestation verify "$inner" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/platform-production-deploy.yml" \
            --source-ref refs/heads/dev --source-digest "$TARGET_SHA" \
            --format json > "$attestation"
          /usr/bin/python3 -I -B - "$attestation" "$inner" "$TARGET_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          attestation_path, subject_path, source_digest, run_id, run_attempt = sys.argv[1:]
          values = json.loads(Path(attestation_path).read_text(encoding="utf-8"))
          if not isinstance(values, list) or len(values) != 1 or not isinstance(values[0], dict):
              raise SystemExit("host-tools attestation result is not exactly one record")
          expected_build = "https://github.com/StrayForest/old_sparky/.github/workflows/platform-production-deploy.yml@refs/heads/dev"
          expected_repo = "https://github.com/StrayForest/old_sparky"
          expected_runner = f"https://github.com/StrayForest/old_sparky/actions/runs/{run_id}/attempts/{run_attempt}"
          expected_digest = hashlib.sha256(Path(subject_path).read_bytes()).hexdigest()
          result = values[0].get("verificationResult")
          signature = result.get("signature") if isinstance(result, dict) else None
          certificate = signature.get("certificate") if isinstance(signature, dict) else None
          statement = result.get("statement") if isinstance(result, dict) else None
          timestamps = result.get("verifiedTimestamps") if isinstance(result, dict) else None
          subjects = statement.get("subject") if isinstance(statement, dict) else None
          digest = subjects[0].get("digest") if isinstance(subjects, list) and len(subjects) == 1 and isinstance(subjects[0], dict) else None
          if (
              not isinstance(certificate, dict)
              or not isinstance(statement, dict)
              or not isinstance(timestamps, list)
              or not timestamps
              or certificate.get("issuer") != "https://token.actions.githubusercontent.com"
              or certificate.get("sourceRepositoryURI") != expected_repo
              or certificate.get("sourceRepositoryRef") != "refs/heads/dev"
              or certificate.get("sourceRepositoryDigest") != source_digest
              or certificate.get("buildConfigURI") != expected_build
              or certificate.get("buildSignerURI") != expected_build
              or certificate.get("runInvocationURI") != expected_runner
              or not isinstance(subjects, list)
              or len(subjects) != 1
              or not isinstance(subjects[0], dict)
              or subjects[0].get("name") != "platform-host-tools-bundle.zip"
              or not isinstance(digest, dict)
              or digest.get("sha256") != expected_digest
          ):
              raise SystemExit("host-tools attestation certificate/source/run/subject policy failed")
          PY
          test "$(stat -c '%F:%h:%a' -- "$inner")" = "regular file:1:600"
          test "$(stat -c '%F:%h:%a' -- "$attestation")" = "regular file:1:600"
          attestation_job_id="$(gh run view "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --json jobs --jq '.jobs[] | select(.name == "Build deterministic host-tools bundle in CI" and .conclusion == "success") | .databaseId' | head -n 1)"
          [[ "$attestation_job_id" =~ ^[1-9][0-9]*$ ]]
          artifact_size="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="ascii"))["size_in_bytes"])' "$metadata")"
          manifest_sha256="$(tr -d '[:space:]' < "$contract/manifest.sha256")"
          capabilities_sha256="$(tr -d '[:space:]' < "$contract/capabilities.sha256")"
          files_contract_sha256="$(sha256sum "$contract/files.sha256" | awk '{print $1}')"
          modes_contract_sha256="$(sha256sum "$contract/files.modes" | awk '{print $1}')"
          test "$(wc -l < "$contract/files.sha256" | tr -d '[:space:]')" = 14
          test "$(wc -l < "$contract/files.modes" | tr -d '[:space:]')" = 14
          while read -r expected_digest expected_path; do
            [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
            [[ "$expected_path" =~ ^platform_[A-Za-z0-9_.-]+\.(py|sh)$|^capabilities\.txt$ ]] || {
              echo "host-tools files sidecar path is invalid" >&2
              exit 1
            }
          done < "$contract/files.sha256"
          while read -r expected_mode expected_path; do
            [[ "$expected_mode" =~ ^(444|555)$ ]]
            [[ "$expected_path" =~ ^platform_[A-Za-z0-9_.-]+\.(py|sh)$|^capabilities\.txt$ ]] || {
              echo "host-tools mode sidecar path is invalid" >&2
              exit 1
            }
          done < "$contract/files.modes"
          for value in "$artifact_size" "$manifest_sha256" "$capabilities_sha256" "$files_contract_sha256" "$modes_contract_sha256"; do
            test -n "$value"
          done
          {
            printf 'artifact_id=%s\n' "$HOST_TOOLS_ARTIFACT_ID"
            printf 'artifact_name=%s\n' "$artifact_name"
            printf 'artifact_size=%s\n' "$artifact_size"
            printf 'artifact_digest=%s\n' "$outer_digest"
            printf 'bundle_sha256=%s\n' "$bundle_sha256"
            printf 'manifest_sha256=%s\n' "$manifest_sha256"
            printf 'capabilities_sha256=%s\n' "$capabilities_sha256"
            printf 'files_contract_sha256=%s\n' "$files_contract_sha256"
            printf 'modes_contract_sha256=%s\n' "$modes_contract_sha256"
            printf 'signer_workflow=%s\n' 'StrayForest/old_sparky/.github/workflows/platform-production-deploy.yml'
            printf 'source_ref=%s\n' 'refs/heads/dev'
            printf 'source_digest=%s\n' "$TARGET_SHA"
            printf 'attestation_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'attestation_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'attestation_job_id=%s\n' "$attestation_job_id"
          } >> "$GITHUB_OUTPUT"

      - name: Remove verifier material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/host-tools-verifier" "$RUNNER_TEMP/host-tools-contract"
          rm -f -- "$RUNNER_TEMP/host-tools-metadata.json" "$RUNNER_TEMP/platform-host-tools-artifact.zip" \
            "$RUNNER_TEMP/platform-host-tools-bundle.zip" "$RUNNER_TEMP/host-tools-attestation.json" "$RUNNER_TEMP/host-tools-verify.txt"

  # Environment approval receives scalar claims only and probes the immutable
  # installed generation. It never downloads or executes a bundle.
  host-capability-preflight:
    name: Verify immutable production host capabilities
    needs:
      - validate-dispatch
      - verify-host-tools
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.verify-host-tools.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'deploy' || inputs.mode == 'preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    outputs:
      host_tools_sha: ${{ needs.verify-host-tools.outputs.host_tools_sha }}
      host_tools_artifact_id: ${{ needs.verify-host-tools.outputs.artifact_id }}
      host_tools_artifact_name: ${{ needs.verify-host-tools.outputs.artifact_name }}
      host_tools_artifact_size: ${{ needs.verify-host-tools.outputs.artifact_size }}
      host_tools_artifact_digest: ${{ needs.verify-host-tools.outputs.artifact_digest }}
      host_tools_bundle_sha256: ${{ needs.verify-host-tools.outputs.bundle_sha256 }}
      host_tools_manifest_sha256: ${{ needs.verify-host-tools.outputs.manifest_sha256 }}
      host_tools_capabilities_sha256: ${{ needs.verify-host-tools.outputs.capabilities_sha256 }}
      host_tools_files_contract_sha256: ${{ needs.verify-host-tools.outputs.files_contract_sha256 }}
      host_tools_modes_contract_sha256: ${{ needs.verify-host-tools.outputs.modes_contract_sha256 }}
      host_tools_signer_workflow: ${{ needs.verify-host-tools.outputs.signer_workflow }}
      host_tools_source_ref: ${{ needs.verify-host-tools.outputs.source_ref }}
      host_tools_source_digest: ${{ needs.verify-host-tools.outputs.source_digest }}
      host_tools_attestation_run_id: ${{ needs.verify-host-tools.outputs.attestation_run_id }}
      host_tools_attestation_run_attempt: ${{ needs.verify-host-tools.outputs.attestation_run_attempt }}
      host_tools_attestation_job_id: ${{ needs.verify-host-tools.outputs.attestation_job_id }}
    env:
      TARGET_SHA: ${{ github.sha }}
      HOST_TOOLS_SHA: ${{ needs.verify-host-tools.outputs.host_tools_sha }}
      HOST_TOOLS_BUNDLE_SHA256: ${{ needs.verify-host-tools.outputs.bundle_sha256 }}
      HOST_TOOLS_MANIFEST_SHA256: ${{ needs.verify-host-tools.outputs.manifest_sha256 }}
      HOST_TOOLS_CAPABILITIES_SHA256: ${{ needs.verify-host-tools.outputs.capabilities_sha256 }}
      HOST_TOOLS_FILES_CONTRACT_SHA256: ${{ needs.verify-host-tools.outputs.files_contract_sha256 }}
      HOST_TOOLS_MODES_CONTRACT_SHA256: ${{ needs.verify-host-tools.outputs.modes_contract_sha256 }}
      HOST_TOOLS_SOURCE_REF: ${{ needs.verify-host-tools.outputs.source_ref }}
      HOST_TOOLS_SOURCE_DIGEST: ${{ needs.verify-host-tools.outputs.source_digest }}
      HOST_TOOLS_ATTESTATION_RUN_ID: ${{ needs.verify-host-tools.outputs.attestation_run_id }}
      HOST_TOOLS_ATTESTATION_RUN_ATTEMPT: ${{ needs.verify-host-tools.outputs.attestation_run_attempt }}
      HOST_TOOLS_DISPATCHER: /opt/oldsparky/platform/shared/host-tools/${{ needs.verify-host-tools.outputs.host_tools_sha }}/platform_workflow_remote_dispatch.py
    steps:
      - name: Configure pinned production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_HOST" && test -n "$PROD_SSH_USER" && test -n "$PROD_SSH_KEY"
          ssh_dir="$RUNNER_TEMP/platform-host-capability-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 0600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          test "$(stat -c '%F:%a' -- "$ssh_dir")" = "directory:700"
          test "$(stat -c '%u:%g' -- "$ssh_dir")" = "$(id -u):$(id -g)"
          test "$(stat -c '%F:%h:%a' -- "$ssh_dir/config")" = "regular file:1:600"
          test "$(stat -c '%F:%h:%a' -- "$ssh_dir/known_hosts")" = "regular file:1:600"
          test "$(stat -c '%F:%h:%a' -- "$ssh_dir/id_ed25519")" = "regular file:1:600"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Probe immutable installed generation
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HOST_TOOLS_SOURCE_DIGEST" = "$TARGET_SHA" ]]
          [[ "$HOST_TOOLS_SOURCE_REF" = refs/heads/dev ]]
          [[ "$HOST_TOOLS_ATTESTATION_RUN_ID" = "$GITHUB_RUN_ID" ]]
          [[ "$HOST_TOOLS_ATTESTATION_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT" ]]
          [[ "$HOST_TOOLS_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$HOST_TOOLS_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$HOST_TOOLS_CAPABILITIES_SHA256" =~ ^[0-9a-f]{64}$ ]]
          generation="/opt/oldsparky/platform/shared/host-tools/$HOST_TOOLS_SHA"
          dispatcher="$generation/platform_workflow_remote_dispatch.py"
          remote=(ssh -n -T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST")
          run_remote() { /usr/bin/timeout --foreground --signal=TERM --kill-after=5s 60s "${remote[@]}" "$@"; }
          test "$(run_remote /usr/bin/id -u | tr -d '\r\n')" = 0
          test "$(run_remote /usr/bin/stat -c '%F:%u:%g:%h:%a' -- "$generation")" = "directory:0:0:2:555"
          # This is the canonical aggregate-contract inventory: the 13 host
          # helpers plus capabilities.txt.  manifest.json is the fifteenth
          # generation member, but its digest is separately bound and must
          # not enter the aggregate (that would self-reference the manifest).
          contract_files=(
            capabilities.txt
            platform_workflow_remote_dispatch.py platform_workflow_input_guard.py platform_prepare_artifact_dir.py
            platform_production_deploy_supervisor.sh platform_release_lock.sh platform_release_preflight.sh
            platform_validate_release_artifact.py platform_safe_env_exec.py platform_render_service_envs.py
            platform_validate_edge_policy.py platform_configure_shared_env.py platform_update_cloudflare_ips.py
            platform_storage_evidence_summary.py
          )
          generation_files=("${contract_files[@]}" manifest.json)
          for expected_file in "${contract_files[@]}"; do
            remote_file="$generation/$expected_file"
            expected_mode=555
            [[ "$expected_file" = capabilities.txt ]] && expected_mode=444
            test "$(run_remote /usr/bin/stat -c '%F:%u:%g:%h:%a' -- "$remote_file")" = "regular file:0:0:1:$expected_mode"
          done
          test "$(run_remote /usr/bin/stat -c '%F:%u:%g:%h:%a' -- "$generation/manifest.json")" = "regular file:0:0:1:444"
          inventory="$(run_remote /usr/bin/find -- "$generation" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          expected_inventory="$(printf '%s\n' "${generation_files[@]}" | LC_ALL=C sort)"
          test "$inventory" = "$expected_inventory"
          remote_files=()
          for expected_file in "${contract_files[@]}"; do
            remote_files+=("$generation/$expected_file")
          done
          metadata_digests="$(run_remote /usr/bin/sha256sum -- "$generation/manifest.json" "$generation/capabilities.txt")"
          test "$(printf '%s\n' "$metadata_digests" | awk -v path="$generation/manifest.json" '$2 == path {print $1}')" = "$HOST_TOOLS_MANIFEST_SHA256"
          test "$(printf '%s\n' "$metadata_digests" | awk -v path="$generation/capabilities.txt" '$2 == path {print $1}')" = "$HOST_TOOLS_CAPABILITIES_SHA256"
          actual_files_contract="$(
            run_remote /usr/bin/sha256sum -- "${remote_files[@]}" |
              /usr/bin/awk -v prefix="$generation/" '{sub(prefix, "", $2); print $1 "  " $2}' |
              LC_ALL=C /usr/bin/sort -k2,2 | /usr/bin/sha256sum | /usr/bin/awk '{print $1}'
          )"
          test "$actual_files_contract" = "$HOST_TOOLS_FILES_CONTRACT_SHA256"
          actual_modes_contract="$(
            run_remote /usr/bin/stat -c '%a  %n' -- "${remote_files[@]}" |
              /usr/bin/awk -v prefix="$generation/" '{sub(prefix, "", $2); print $1 "  " $2}' |
              LC_ALL=C /usr/bin/sort -k2,2 | /usr/bin/sha256sum | /usr/bin/awk '{print $1}'
          )"
          test "$actual_modes_contract" = "$HOST_TOOLS_MODES_CONTRACT_SHA256"
          expected_capabilities="HOST_TOOLS schema=1 source_sha=$HOST_TOOLS_SHA generation=$HOST_TOOLS_SHA dispatcher=2 artifact_prepare=2 supervisor=2 input_guard=1 python_isolated=1 python_bytecode_disabled=1"
          expected_contract="HOST_TOOLS_CONTRACT source_sha=$HOST_TOOLS_SHA generation=$HOST_TOOLS_SHA manifest_sha256=$HOST_TOOLS_MANIFEST_SHA256 capabilities_sha256=$HOST_TOOLS_CAPABILITIES_SHA256"
          test "$(run_remote /usr/bin/python3.12 -I -B "$dispatcher" host-capabilities | tr -d '\r')" = "$expected_capabilities"
          test "$(run_remote /usr/bin/python3.12 -I -B "$dispatcher" host-contract "$HOST_TOOLS_SHA" "$HOST_TOOLS_MANIFEST_SHA256" "$HOST_TOOLS_CAPABILITIES_SHA256" | tr -d '\r')" = "$expected_contract"

      - name: Remove capability verifier material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-host-capability-ssh"
          if [[ -d "$ssh_dir" && ! -L "$ssh_dir" ]]; then
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$ssh_dir/known_hosts.scan" "$ssh_dir/known_hosts.scan.1" "$ssh_dir/known_hosts.scan.2" "$ssh_dir/config"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
  # Candidate checkout and release construction are isolated from the
  # environment-approved deployment jobs.  This job never receives SSH
  # material and only publishes an immutable archive plus provenance.
  build-release:
    name: Build immutable release artifact in CI
    needs:
      - validate-dispatch
      - validate-classifier
      - host-capability-preflight
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.validate-classifier.result == 'success' &&
      needs.host-capability-preflight.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: ${{ inputs.mode }}
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      PLATFORM_WEB_NEXT_COMPRESSION: ${{ inputs.web_compression == 'disabled' && 'false' || 'true' }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      artifact_id: ${{ steps.publish-release-artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.publish-release-artifact.outputs.artifact-digest }}
    steps:
      - name: Download closed deployment handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-deploy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-input

      - name: Revalidate deployment handoff before candidate build
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" && test ! -L "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          /usr/bin/python3 - "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$TARGET_SHA" "$DEPLOY_MODE" "$RUNTIME_PROFILE" "$WEB_COMPRESSION" "$CLASSIFIER_RUN_ID" "$CLASSIFIER_RUN_ATTEMPT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, target_sha, mode, runtime_profile, web_compression, run_id, attempt = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          expected = {
              "schema", "mode", "runtime_profile", "release_slug", "target_sha",
              "artifact_remote_dir", "classifier_run_id", "classifier_run_attempt",
              "web_compression",
          }
          if set(payload) != expected:
              raise SystemExit("deployment handoff schema is not closed")
          if payload.get("schema") not in (1, "1"):
              raise SystemExit("deployment handoff schema version is invalid")
          if payload.get("mode") != mode or payload.get("mode") != "deploy":
              raise SystemExit("deployment handoff mode is not deploy")
          if payload.get("runtime_profile") != runtime_profile:
              raise SystemExit("deployment handoff runtime profile mismatch")
          if payload.get("web_compression") != web_compression:
              raise SystemExit("deployment handoff compression mismatch")
          if payload.get("target_sha") != target_sha or re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("deployment handoff exact target SHA mismatch")
          if re.fullmatch(r"[1-9][0-9]{0,31}", str(payload.get("classifier_run_id"))) is None or payload.get("classifier_run_id") != run_id:
              raise SystemExit("deployment handoff classifier run mismatch")
          if re.fullmatch(r"[1-9][0-9]{0,31}", str(payload.get("classifier_run_attempt"))) is None or payload.get("classifier_run_attempt") != attempt:
              raise SystemExit("deployment handoff classifier attempt mismatch")
          release_slug = payload.get("release_slug")
          if (
              not isinstance(release_slug, str)
              or re.fullmatch(r"gha-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}-[0-9a-f]{12}", release_slug) is None
              or not release_slug.endswith(f"-{target_sha[:12]}")
          ):
              raise SystemExit("deployment handoff release slug is not source-bound")
          if re.fullmatch(r"/tmp/old-sparky-platform-artifact-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}", str(payload.get("artifact_remote_dir"))) is None:
              raise SystemExit("deployment handoff artifact path is unsafe")
          print("closed deployment handoff accepted for exact target SHA")
          PY

      - name: Checkout reviewed deployment source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require reviewed dev branch for deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" || { echo "Production deploys must target the reviewed dev branch." >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- platform)"

      - name: Build immutable release artifact in CI
        shell: bash
        run: |
          set -euo pipefail
          ci_build_root=/root/old_sparky
          sudo rm -rf -- "$ci_build_root"
          sudo install -d -o root -g root -m 0755 "$ci_build_root"
          sudo cp -a "$GITHUB_WORKSPACE/." "$ci_build_root/"
          sudo chown -R root:root "$ci_build_root"
          sudo env -i \
            HOME=/root \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/python3 -m venv "$ci_build_root/platform/.venv_platform"
          sudo install -d -o root -g root -m 0755 "$ci_build_root/platform/dist/releases"
          release_slug="$(/usr/bin/python3 - "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$TARGET_SHA" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          target_sha = sys.argv[2]
          release_slug = payload.get("release_slug")
          if (
              not isinstance(release_slug, str)
              or re.fullmatch(r"gha-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}-[0-9a-f]{12}", release_slug) is None
              or not release_slug.endswith(f"-{target_sha[:12]}")
          ):
              raise SystemExit("deployment handoff release slug is not source-bound")
          print(release_slug)
          PY
          )"
          sudo env -i \
            HOME=/root \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            PLATFORM_RELEASE_OUTPUT_DIR="$ci_build_root/platform/dist/releases" \
            PLATFORM_WEB_NEXT_COMPRESSION="$PLATFORM_WEB_NEXT_COMPRESSION" \
            "$ci_build_root/platform/tools/platform_build_release.sh" --release-slug "$release_slug"
          release_archive="$(sudo find "$ci_build_root/platform/dist/releases" -maxdepth 1 -type f -name "${release_slug}.tar.gz" -print -quit)"
          test -n "$release_archive" || { echo "CI release artifact was not produced" >&2; exit 1; }
          release_checksum="${release_archive}.sha256"
          sudo test -f "$release_checksum"
          release_output="$GITHUB_WORKSPACE/ci-release"
          rm -rf -- "$release_output"
          install -d -m 0755 "$release_output"
          sudo install -m 0644 "$release_archive" "$release_output/$(basename "$release_archive")"
          sudo install -m 0644 "$release_checksum" "$release_output/$(basename "$release_checksum")"
          sudo chown "$(id -u):$(id -g)" "$release_output/$(basename "$release_archive")" "$release_output/$(basename "$release_checksum")"
          (cd "$release_output" && sha256sum -c "$(basename "$release_checksum")")
          /usr/bin/python3 - "$release_output/$(basename "$release_archive")" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          archive, target_sha = sys.argv[1:]
          archive_path = Path(archive)
          checksum = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          if len(target_sha) != 40 or any(character not in "0123456789abcdef" for character in target_sha):
              raise SystemExit("exact target SHA is malformed")
          Path(archive_path.parent / "RELEASE.provenance.json").write_text(
              json.dumps({
                  "schema": 1,
                  "artifact_file": archive_path.name,
                  "artifact_sha256": checksum,
                  "source_git_commit": target_sha,
              }, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish immutable release artifact
        id: publish-release-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-release/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest immutable release artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ci-release/*.tar.gz

      - name: Remove candidate build tree
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/ci-release" "$RUNNER_TEMP/deploy-input"

  validate-security-provenance:
    name: Validate exact security provenance
    needs:
      - validate-dispatch
      - build-release
    outputs:
      security_ready: ${{ steps.security_provenance.outputs.security_ready }}
      security_digest: ${{ steps.security_provenance.outputs.security_digest }}
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.build-release.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      statuses: read
    env:
      TARGET_SHA: ${{ github.sha }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      SOURCE_RUN_URL: ${{ inputs.classifier_run_id && format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, inputs.classifier_run_id) || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    steps:
      # This job has a GitHub API token. Resolve the validator from the
      # immutable default-branch commit before checkout; TARGET_SHA is the
      # deployment candidate and must never select executable code here.
      - name: Resolve immutable default-branch provenance source
        id: trusted_default
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: dev
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_REF" = "refs/heads/dev"
          trusted_ref="$RUNNER_TEMP/platform-trusted-default-ref.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRUSTED_BRANCH}" \
            --output "$trusted_ref"
          /usr/bin/python3 - "$trusted_ref" "$GITHUB_OUTPUT" "$TRUSTED_BRANCH" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branch = sys.argv[3]
          expected_ref = f"refs/heads/{branch}"
          obj = payload.get("object") if isinstance(payload, dict) else None
          sha = obj.get("sha") if isinstance(obj, dict) else None
          if payload.get("ref") != expected_ref or not isinstance(obj, dict) or obj.get("type") != "commit":
              raise SystemExit("trusted default branch ref is not an immutable commit")
          if not isinstance(sha, str) or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("trusted default branch commit SHA is malformed")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
          rm -f -- "$trusted_ref"

      - name: Checkout trusted provenance validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.trusted_default.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact security snapshots
        id: security_provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SOURCE_SHA: ${{ steps.trusted_default.outputs.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$(git rev-parse HEAD)" = "$TRUSTED_SOURCE_SHA"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CLASSIFIER_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$CLASSIFIER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          provenance_dir="$(mktemp -d "$RUNNER_TEMP/platform-security-provenance.XXXXXX")"
          trap 'rm -rf -- "$provenance_dir"' EXIT
          chmod 700 "$provenance_dir"
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          fetch_statuses() {
            local output_path="$1" page=1 count page_path
            local pages_dir="$output_path.pages"
            case "$pages_dir" in
              "$provenance_dir"/*) ;;
              *) echo "status page directory escaped the ephemeral provenance root" >&2; exit 1 ;;
            esac
            if [[ -e "$pages_dir" || -L "$pages_dir" ]]; then
              rm -rf -- "$pages_dir"
            fi
            install -d -m 700 "$pages_dir"
            test ! -L "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail-with-body --silent --show-error "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100&page=${page}" \
                --output "$page_path"
              count="$(/usr/bin/python3 - "$page_path" <<'PY'
          import json
          from pathlib import Path
          import sys

          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(rows, list) or any(not isinstance(row, dict) for row in rows):
              raise SystemExit("paginated status response is malformed")
          print(len(rows))
          PY
              )"
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 1000 )) || { echo "status pagination exceeded its bound" >&2; exit 1; }
            done
            /usr/bin/python3 - "$pages_dir" "$output_path" <<'PY'
          import json
          from pathlib import Path
          import sys

          pages_dir, output_path = map(Path, sys.argv[1:])
          rows = []
          for path in sorted(pages_dir.glob("page-*.json"), key=lambda item: int(item.stem.split("-")[-1])):
              page_rows = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(page_rows, list):
                  raise SystemExit("paginated status response is malformed")
              rows.extend(page_rows)
          output_path.write_text(json.dumps(rows, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          PY
          }
          fetch_snapshot() {
            local snapshot_dir="$1"
            install -d -m 700 "$snapshot_dir"
            curl --fail-with-body --silent --show-error "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/platform-security.yml" \
              --output "$snapshot_dir/workflow.json"
            curl --fail-with-body --silent --show-error "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CLASSIFIER_RUN_ID}" \
              --output "$snapshot_dir/run.json"
            fetch_statuses "$snapshot_dir/statuses.json"
          }
          for snapshot in first second; do
            fetch_snapshot "$provenance_dir/$snapshot"
            /usr/bin/python3 platform/tools/platform_workflow_provenance.py security \
              --workflow "$provenance_dir/$snapshot/workflow.json" \
              --run "$provenance_dir/$snapshot/run.json" \
              --status "$provenance_dir/$snapshot/statuses.json" \
              --expected-run-id "$CLASSIFIER_RUN_ID" \
              --expected-attempt "$CLASSIFIER_RUN_ATTEMPT" \
              --expected-target-sha "$TARGET_SHA" \
              --expected-run-url "$SOURCE_RUN_URL" \
              > "$provenance_dir/$snapshot/validated.json"
          done
          /usr/bin/python3 - "$provenance_dir/first/validated.json" "$provenance_dir/second/validated.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          first, second = (json.loads(Path(path).read_text(encoding="utf-8")) for path in sys.argv[1:3])
          if first != second:
              raise SystemExit("security provenance changed between adjacent snapshots")
          if first.get("deploy_ready") is not True:
              raise SystemExit("security provenance did not authorize deployment")
          digest = first.get("snapshot_digest")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("security provenance snapshot digest is malformed")
          with Path(sys.argv[3]).open("a", encoding="utf-8") as output:
              output.write("security_ready=true\n")
              output.write(f"security_digest={digest}\n")
          PY

  # This is the only job that owns the production environment for preflight.
  # It has no checkout and never executes candidate source.
  preflight:
    name: Production preflight
    needs:
      - validate-dispatch
      - host-capability-preflight
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.host-capability-preflight.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: preflight
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      HOST_TOOLS_SHA: ${{ needs.host-capability-preflight.outputs.host_tools_sha }}
      HOST_TOOLS_DISPATCHER: /opt/oldsparky/platform/shared/host-tools/${{ needs.host-capability-preflight.outputs.host_tools_sha }}/platform_workflow_remote_dispatch.py
    steps:
      - name: Download closed preflight handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-deploy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-input

      - name: Revalidate exact target SHA preflight handoff
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" && test ! -L "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          /usr/bin/python3 - "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$TARGET_SHA" "$RUNTIME_PROFILE" "$WEB_COMPRESSION" "$CLASSIFIER_RUN_ID" "$CLASSIFIER_RUN_ATTEMPT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, target_sha, runtime_profile, web_compression, run_id, attempt = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          expected = {"schema", "mode", "runtime_profile", "release_slug", "target_sha", "artifact_remote_dir", "classifier_run_id", "classifier_run_attempt", "web_compression"}
          if set(payload) != expected or payload.get("schema") not in (1, "1"):
              raise SystemExit("preflight handoff schema is not closed")
          if payload.get("mode") != "preflight" or payload.get("runtime_profile") != runtime_profile or payload.get("web_compression") != web_compression:
              raise SystemExit("preflight handoff values do not match dispatch")
          if payload.get("target_sha") != target_sha or re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("preflight handoff exact target SHA mismatch")
          if payload.get("classifier_run_id") != run_id or payload.get("classifier_run_attempt") != attempt:
              raise SystemExit("preflight handoff classifier identity mismatch")
          print("preflight handoff accepted for exact target SHA")
          PY

      - name: Validate deployment secrets
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PROD_SSH_HOST:-}" || -z "${PROD_SSH_USER:-}" || -z "${PROD_SSH_KEY:-}" ]]; then
            echo "Production SSH configuration is incomplete." >&2
            exit 1
          fi

      - name: Configure preflight SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-preflight-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "PREFLIGHT_SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run production preflight
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          remote_log="$RUNNER_TEMP/platform-production-preflight-remote.log"
          remote_error="$RUNNER_TEMP/platform-production-preflight-remote-error.log"
          umask 077
          : > "$remote_log"; : > "$remote_error"; chmod 600 "$remote_log" "$remote_error"
          set +e
          timeout --foreground 300s ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -F "$PREFLIGHT_SSH_DIR/config" -i "$PREFLIGHT_SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" \
            production-deploy < "$input_path" > "$remote_log" 2> "$remote_error"
          remote_status="$?"
          set -e
          public_line="$(grep -E '^RELEASE_DEPLOY schema=1 status=(passed|failed|review) class=(preflight|deployment|argument|privilege|policy|layout|service_state|readiness|lock|quiesce|recovery|artifact|pending_operation|transaction|abort|remote_or_transport)( phase=(artifact|provenance|preflight|candidate|readiness) reason=(internal|host_tools_invalid|lock|environment|service_state|nginx_config|preflight_failed|artifact_missing|artifact_count_invalid|checksum_missing|provenance_missing|artifact_name_invalid|release_slug_mismatch|checksum_mismatch|validation_failed|provenance_invalid|candidate_missing|activation_failed|lock_lost|runtime_profile_failed))? release_slug=(unavailable|[A-Za-z0-9][A-Za-z0-9._-]{0,179}) source_sha=(unavailable|[0-9a-f]{40,64})$' "$remote_log" | tail -n 1 || true)"
          if [[ -z "$public_line" ]]; then
            public_line='RELEASE_DEPLOY schema=1 status=failed class=remote_or_transport release_slug=unavailable source_sha=unavailable'
            printf '%s\n' "$public_line"
            (( remote_status != 0 )) && exit "$remote_status"
            exit 1
          fi
          printf '%s\n' "$public_line"
          rm -f -- "$remote_log" "$remote_error"
          exit "$remote_status"

      - name: Remove preflight SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-preflight-ssh"
          rm -f -- "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$RUNNER_TEMP/platform-production-preflight-remote.log" "$RUNNER_TEMP/platform-production-preflight-remote-error.log"
          if [[ -d "$ssh_dir" && ! -L "$ssh_dir" ]]; then
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$ssh_dir/known_hosts.scan" "$ssh_dir/known_hosts.scan.1" "$ssh_dir/known_hosts.scan.2" "$ssh_dir/config" "$ssh_dir/control.sock" "$ssh_dir/control-master" "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -e "$ssh_dir/known_hosts" && test ! -e "$ssh_dir/config"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'PREFLIGHT_SSH_DIR=' >> "$GITHUB_ENV"

  # This environment-approved job consumes only scalar verifier claims and the
  # immutable release archive. It checks out only the exact trusted validator source;
  # candidate code is never executed on the runner that receives PROD_SSH_KEY.
  production:
    name: Deploy production
    needs:
      - validate-dispatch
      - validate-classifier
      - build-release
      - validate-security-provenance
      - host-capability-preflight
    if: >-
      needs.validate-dispatch.result == 'success' &&
      needs.validate-classifier.result == 'success' &&
      needs.build-release.result == 'success' &&
      needs.validate-security-provenance.result == 'success' &&
      needs.host-capability-preflight.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      attestations: read
      contents: read
      statuses: write
    env:
      TARGET_SHA: ${{ github.sha }}
      DEPLOY_MODE: deploy
      RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
      PLATFORM_WEB_NEXT_COMPRESSION: ${{ inputs.web_compression == 'disabled' && 'false' || 'true' }}
      WEB_COMPRESSION: ${{ inputs.web_compression }}
      CLASSIFIER_RUN_ID: ${{ inputs.classifier_run_id || github.run_id }}
      CLASSIFIER_RUN_ATTEMPT: ${{ inputs.classifier_run_attempt || github.run_attempt }}
      ARTIFACT_REMOTE_DIR: /tmp/old-sparky-platform-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      PUBLISHED_ARTIFACT_ID: ${{ needs.build-release.outputs.artifact_id }}
      PUBLISHED_ARTIFACT_DIGEST: ${{ needs.build-release.outputs.artifact_digest }}
      HOST_TOOLS_SHA: ${{ needs.host-capability-preflight.outputs.host_tools_sha }}
      HOST_TOOLS_GENERATION: /opt/oldsparky/platform/shared/host-tools/${{ needs.host-capability-preflight.outputs.host_tools_sha }}
      HOST_TOOLS_DISPATCHER: /opt/oldsparky/platform/shared/host-tools/${{ needs.host-capability-preflight.outputs.host_tools_sha }}/platform_workflow_remote_dispatch.py
      HOST_TOOLS_ARTIFACT_ID: ${{ needs.host-capability-preflight.outputs.host_tools_artifact_id }}
      HOST_TOOLS_ARTIFACT_NAME: ${{ needs.host-capability-preflight.outputs.host_tools_artifact_name }}
      HOST_TOOLS_ARTIFACT_SIZE: ${{ needs.host-capability-preflight.outputs.host_tools_artifact_size }}
      HOST_TOOLS_ARTIFACT_DIGEST: ${{ needs.host-capability-preflight.outputs.host_tools_artifact_digest }}
      HOST_TOOLS_BUNDLE_SHA256: ${{ needs.host-capability-preflight.outputs.host_tools_bundle_sha256 }}
      HOST_TOOLS_MANIFEST_SHA256: ${{ needs.host-capability-preflight.outputs.host_tools_manifest_sha256 }}
      HOST_TOOLS_CAPABILITIES_SHA256: ${{ needs.host-capability-preflight.outputs.host_tools_capabilities_sha256 }}
      HOST_TOOLS_FILES_CONTRACT_SHA256: ${{ needs.host-capability-preflight.outputs.host_tools_files_contract_sha256 }}
      HOST_TOOLS_MODES_CONTRACT_SHA256: ${{ needs.host-capability-preflight.outputs.host_tools_modes_contract_sha256 }}
      HOST_TOOLS_SIGNER_WORKFLOW: ${{ needs.host-capability-preflight.outputs.host_tools_signer_workflow }}
      HOST_TOOLS_SOURCE_REF: ${{ needs.host-capability-preflight.outputs.host_tools_source_ref }}
      HOST_TOOLS_SOURCE_DIGEST: ${{ needs.host-capability-preflight.outputs.host_tools_source_digest }}
      HOST_TOOLS_ATTESTATION_RUN_ID: ${{ needs.host-capability-preflight.outputs.host_tools_attestation_run_id }}
      HOST_TOOLS_ATTESTATION_RUN_ATTEMPT: ${{ needs.host-capability-preflight.outputs.host_tools_attestation_run_attempt }}
      HOST_TOOLS_ATTESTATION_JOB_ID: ${{ needs.host-capability-preflight.outputs.host_tools_attestation_job_id }}
    steps:
      - name: Download closed deployment handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-deploy-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-input

      - name: Validate production deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" && test ! -L "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          test -n "$CLASSIFIER_RUN_ID" || { echo "classifier_run_id is required for production deploy" >&2; exit 1; }
          test -n "$CLASSIFIER_RUN_ATTEMPT" || { echo "classifier_run_attempt is required for production deploy" >&2; exit 1; }
          /usr/bin/python3 - "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$TARGET_SHA" "$RUNTIME_PROFILE" "$WEB_COMPRESSION" "$CLASSIFIER_RUN_ID" "$CLASSIFIER_RUN_ATTEMPT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, target_sha, runtime_profile, web_compression, run_id, attempt = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          expected = {"schema", "mode", "runtime_profile", "release_slug", "target_sha", "artifact_remote_dir", "classifier_run_id", "classifier_run_attempt", "web_compression"}
          if set(payload) != expected or payload.get("schema") not in (1, "1"):
              raise SystemExit("deployment handoff schema is not closed")
          if payload.get("mode") != "deploy" or payload.get("runtime_profile") != runtime_profile or payload.get("web_compression") != web_compression:
              raise SystemExit("deployment handoff values do not match dispatch")
          if payload.get("target_sha") != target_sha or re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("deployment handoff exact target SHA mismatch")
          release_slug = payload.get("release_slug")
          if (
              not isinstance(release_slug, str)
              or re.fullmatch(r"gha-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}-[0-9a-f]{12}", release_slug) is None
              or not release_slug.endswith(f"-{target_sha[:12]}")
          ):
              raise SystemExit("deployment handoff release slug is not source-bound")
          if payload.get("classifier_run_id") != run_id or payload.get("classifier_run_attempt") != attempt:
              raise SystemExit("deployment handoff classifier identity mismatch")
          if re.fullmatch(r"/tmp/old-sparky-platform-artifact-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}", str(payload.get("artifact_remote_dir"))) is None:
              raise SystemExit("deployment handoff artifact path is unsafe")
          print("deployment handoff accepted for exact target SHA")
          PY

      - name: Require successful platform security build (shared provenance validator)
        shell: bash
        run: |
          set -euo pipefail
          # platform_workflow_provenance.py enforces run.get("workflow_id") != workflow.get("id"),
          # run.get("run_attempt") != int(expected_attempt), and exact
          # "event": "push", "head_branch": "dev", "head_sha": os.environ["TARGET_SHA"],
          # "status": "completed", "conclusion": "success" metadata.  The
          security_digest="${{ needs.validate-security-provenance.outputs.security_digest }}"
          [[ "$security_digest" =~ ^[0-9a-f]{64}$ ]] || { echo "security provenance handoff is malformed" >&2; exit 1; }
          test "${{ needs.validate-security-provenance.outputs.security_ready }}" = "true"
          echo "exact platform security provenance accepted: snapshot=$security_digest"

      - name: Resolve immutable default-branch classifier source
        id: trusted_classifier_default
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: dev
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_REF" = "refs/heads/dev"
          trusted_ref="$RUNNER_TEMP/platform-trusted-classifier-ref.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRUSTED_BRANCH}" \
            --output "$trusted_ref"
          /usr/bin/python3 - "$trusted_ref" "$GITHUB_OUTPUT" "$TRUSTED_BRANCH" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branch = sys.argv[3]
          obj = payload.get("object") if isinstance(payload, dict) else None
          sha = obj.get("sha") if isinstance(obj, dict) else None
          if (
              payload.get("ref") != f"refs/heads/{branch}"
              or not isinstance(obj, dict)
              or obj.get("type") != "commit"
              or not isinstance(sha, str)
              or re.fullmatch(r"[0-9a-f]{40}", sha) is None
          ):
              raise SystemExit("trusted classifier source is not an immutable commit")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
          rm -f -- "$trusted_ref"

      - name: Checkout trusted classifier validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.trusted_classifier_default.outputs.sha }}
          path: trusted-classifier
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate deployable exact classifier artifact immediately before production writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The trusted parser validates classifier-manifest.json as data and
          # never executes the downloaded payload.
          umask 077
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          trusted_tool="$trusted_root/platform/tools/platform_production_classifier_artifact.py"
          test -f "$trusted_tool" && test ! -L "$trusted_tool"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "${{ steps.trusted_classifier_default.outputs.sha }}"
          expected_name="platform-ci-route-${CLASSIFIER_RUN_ID}-${CLASSIFIER_RUN_ATTEMPT}"
          route_dir="$(mktemp -d "$RUNNER_TEMP/platform-ci-route.XXXXXX")"
          trap 'rm -rf -- "$route_dir"' EXIT
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          fetch_classifier_artifacts() {
            local pages_dir="$1" page=1 summary count total expected_total=""
            install -d -m 700 "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail --silent --show-error --location \
                --max-filesize 4194304 \
                "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CLASSIFIER_RUN_ID}/artifacts?per_page=100&page=${page}" \
                --output "$page_path"
              chmod 600 "$page_path"
              summary="$(/usr/bin/python3 "$trusted_tool" page "$page_path")"
              [[ "$summary" =~ ^count=([0-9]+)\ total=([0-9]+)$ ]] || {
                echo "classifier artifact pagination summary is malformed" >&2
                exit 1
              }
              count="${BASH_REMATCH[1]}"
              total="${BASH_REMATCH[2]}"
              if [[ -n "$expected_total" ]]; then
                test "$total" = "$expected_total" || {
                  echo "classifier artifact total changed during pagination" >&2
                  exit 1
                }
              else
                expected_total="$total"
              fi
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 100 )) || {
                echo "classifier artifact pagination exceeded its bound" >&2
                exit 1
              }
            done
          }
          first_pages="$route_dir/artifacts-first"
          second_pages="$route_dir/artifacts-second"
          fetch_classifier_artifacts "$first_pages"
          fetch_classifier_artifacts "$second_pages"
          artifact_id="$(
            /usr/bin/python3 "$trusted_tool" metadata \
              "$first_pages" "$second_pages" \
              --expected-name "$expected_name" \
              --run-id "$CLASSIFIER_RUN_ID" \
              --run-attempt "$CLASSIFIER_RUN_ATTEMPT" \
              --target-sha "$TARGET_SHA"
          )"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "classifier artifact id is malformed" >&2
            exit 1
          }
          curl --fail --silent --show-error --location \
            --max-filesize 4194304 \
            "${api_headers[@]}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$route_dir/artifact.zip"
          /usr/bin/python3 "$trusted_tool" manifest "$route_dir/artifact.zip" --target-sha "$TARGET_SHA"

      - name: Remove trusted classifier validator
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$GITHUB_WORKSPACE/trusted-classifier"
          if [[ -d "$trusted_root" && ! -L "$trusted_root" ]]; then
            rm -rf -- "$trusted_root"
          fi
          test ! -e "$trusted_root" && test ! -L "$trusted_root"

      - name: Mark production deployment pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment is running\",\"target_url\":\"${run_url}\"}"

      - name: Checkout pinned host-tools release verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.host-capability-preflight.outputs.host_tools_sha }}
          path: trusted-host-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and extract exact raw API release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$PUBLISHED_ARTIFACT_ID" && test -n "$PUBLISHED_ARTIFACT_DIGEST"
          PUBLISHED_ARTIFACT_DIGEST="${PUBLISHED_ARTIFACT_DIGEST#sha256:}"
          [[ "$PUBLISHED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "Published GitHub artifact ID is invalid" >&2; exit 1; }
          [[ "$PUBLISHED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "Published GitHub artifact digest is invalid" >&2; exit 1; }
          artifact_metadata="$RUNNER_TEMP/platform-release-artifact-metadata.json"
          expected_artifact_name='platform-release-artifact-${{ github.run_id }}-${{ github.run_attempt }}'
          test "$expected_artifact_name" = "platform-release-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PUBLISHED_ARTIFACT_ID}" --output "$artifact_metadata"
          /usr/bin/python3 - "$artifact_metadata" "$PUBLISHED_ARTIFACT_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$TARGET_SHA" "$expected_artifact_name" <<'PY'
          import json
          from pathlib import Path
          import sys

          metadata_path, artifact_id, run_id, attempt, target_sha, expected_name = sys.argv[1:]
          payload = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          if payload.get("id") != int(artifact_id) or payload.get("name") != expected_name or payload.get("expired") is not False:
              raise SystemExit("published release artifact metadata is not the exact current-run artifact")
          workflow_run = payload.get("workflow_run")
          if not isinstance(workflow_run, dict) or workflow_run.get("id") != int(run_id) or workflow_run.get("head_sha") != target_sha:
              raise SystemExit("published release artifact is not bound to this exact workflow run and SHA")
          PY
          artifact_zip="$RUNNER_TEMP/platform-release-artifact.zip"
          rm -f -- "$artifact_zip"
          curl --fail-with-body --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PUBLISHED_ARTIFACT_ID}/zip" --output "$artifact_zip"
          printf '%s  %s\n' "$PUBLISHED_ARTIFACT_DIGEST" "$artifact_zip" | sha256sum -c - >/dev/null 2>/dev/null || { echo "Published GitHub artifact digest verification failed" >&2; exit 1; }
          release_slug="$(/usr/bin/python3 - "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$TARGET_SHA" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          target_sha = sys.argv[2]
          release_slug = payload.get("release_slug")
          if (
              not isinstance(release_slug, str)
              or re.fullmatch(r"gha-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}-[0-9a-f]{12}", release_slug) is None
              or not release_slug.endswith(f"-{target_sha[:12]}")
          ):
              raise SystemExit("deployment handoff release slug is not source-bound")
          print(release_slug)
          PY
          )"
          trusted_tool="$GITHUB_WORKSPACE/trusted-host-tools/platform/tools/platform_host_tools_bundle.py"
          test -f "$trusted_tool" && test ! -L "$trusted_tool"
          test "$(git -C "$GITHUB_WORKSPACE/trusted-host-tools" rev-parse HEAD)" = "$HOST_TOOLS_SHA"
          release_dir="$RUNNER_TEMP/release"
          test ! -e "$release_dir" && test ! -L "$release_dir"
          env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/python3 -I -B "$trusted_tool" extract-release-artifact \
            --archive "$artifact_zip" \
            --output-dir "$release_dir" \
            --release-slug "$release_slug" \
            --expected-archive-sha256 "$PUBLISHED_ARTIFACT_DIGEST"
          release_archive="$release_dir/${release_slug}.tar.gz"
          release_checksum="$release_dir/${release_slug}.tar.gz.sha256"
          release_provenance="$release_dir/RELEASE.provenance.json"
          for release_file in "$release_archive" "$release_checksum" "$release_provenance"; do
            test -f "$release_file" && test ! -L "$release_file"
          done
          (cd "$(dirname "$release_archive")" && sha256sum -c "$(basename "$release_checksum")")
          /usr/bin/python3 - "$release_archive" "$release_provenance" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          archive, provenance_path, target_sha = sys.argv[1:]
          provenance = json.loads(Path(provenance_path).read_text(encoding="utf-8"))
          if set(provenance) != {"schema", "artifact_file", "artifact_sha256", "source_git_commit"}:
              raise SystemExit("release provenance schema is not closed")
          if provenance.get("schema") != 1 or provenance.get("artifact_file") != Path(archive).name or provenance.get("source_git_commit") != target_sha or re.fullmatch(r"[0-9a-f]{64}", str(provenance.get("artifact_sha256"))) is None:
              raise SystemExit("release provenance does not bind the exact target SHA")
          if hashlib.sha256(Path(archive).read_bytes()).hexdigest() != provenance["artifact_sha256"]:
              raise SystemExit("release provenance digest mismatch")
          PY
          {
            printf 'RELEASE_ARTIFACT=%s\n' "$release_archive"
            printf 'RELEASE_CHECKSUM=%s\n' "$release_checksum"
            printf 'RELEASE_PROVENANCE=%s\n' "$release_provenance"
          } >> "$GITHUB_ENV"

      - name: Validate deployment secrets
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${PROD_SSH_HOST:-}" || -z "${PROD_SSH_USER:-}" || -z "${PROD_SSH_KEY:-}" ]]; then
            echo "Production SSH configuration is incomplete." >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-deploy-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Verify SSH connection
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=5s 30s \
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" true >/dev/null

      - name: Upload verified CI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          test -s "$input_path"
          require_current_dev_head() {
            local branch_json dev_sha
            branch_json="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev")"
            dev_sha="$(printf '%s' "$branch_json" | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); sha=payload["commit"]["sha"]; assert isinstance(sha,str) and len(sha)==40 and all(c in "0123456789abcdef" for c in sha), "current dev head SHA is malformed"; print(sha)')"
            test "$dev_sha" = "$TARGET_SHA" || { echo "Refusing production side effects: dev moved from $TARGET_SHA to $dev_sha." >&2; exit 1; }
          }
          require_current_dev_head
          timeout --foreground 300s ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" production-prepare-artifact < "$input_path"
          timeout --foreground 300s scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_ARTIFACT" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          timeout --foreground 300s scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_PROVENANCE" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"
          timeout --foreground 300s scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$RELEASE_CHECKSUM" "$PROD_SSH_USER@$PROD_SSH_HOST:$ARTIFACT_REMOTE_DIR/"

      - name: Run production preflight or deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json"
          branch_json="$(curl --fail-with-body --silent --show-error --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev")"
          dev_sha="$(printf '%s' "$branch_json" | /usr/bin/python3 -c 'import json,sys; payload=json.load(sys.stdin); sha=payload["commit"]["sha"]; assert isinstance(sha,str) and len(sha)==40 and all(c in "0123456789abcdef" for c in sha), "current dev head SHA is malformed"; print(sha)')"
          test "$dev_sha" = "$TARGET_SHA" || { echo "Refusing activation: dev moved from $TARGET_SHA to $dev_sha." >&2; exit 1; }
          remote_log="$RUNNER_TEMP/platform-production-deploy-remote.log"
          remote_error="$RUNNER_TEMP/platform-production-deploy-remote-error.log"
          umask 077; : > "$remote_log"; : > "$remote_error"; chmod 600 "$remote_log" "$remote_error"
          set +e
          timeout --foreground 900s ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B "$HOST_TOOLS_DISPATCHER" production-deploy < "$input_path" > "$remote_log" 2> "$remote_error"
          remote_status="$?"
          set -e
          public_line="$(grep -E '^RELEASE_DEPLOY schema=1 status=(passed|failed|review) class=(preflight|deployment|argument|privilege|policy|layout|service_state|readiness|lock|quiesce|recovery|artifact|pending_operation|transaction|abort|remote_or_transport)( phase=(artifact|provenance|preflight|candidate|readiness) reason=(internal|host_tools_invalid|lock|environment|service_state|nginx_config|preflight_failed|artifact_missing|artifact_count_invalid|checksum_missing|provenance_missing|artifact_name_invalid|release_slug_mismatch|checksum_mismatch|validation_failed|provenance_invalid|candidate_missing|activation_failed|lock_lost|runtime_profile_failed))? release_slug=(unavailable|[A-Za-z0-9][A-Za-z0-9._-]{0,179}) source_sha=(unavailable|[0-9a-f]{40,64})$' "$remote_log" | tail -n 1 || true)"
          if [[ -z "$public_line" ]]; then
            public_line='RELEASE_DEPLOY schema=1 status=failed class=remote_or_transport release_slug=unavailable source_sha=unavailable'
            printf '%s\n' "$public_line"
            (( remote_status != 0 )) && exit "$remote_status"
            exit 1
          fi
          printf '%s\n' "$public_line"
          exit "$remote_status"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-deploy-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-deploy-ssh"
          rm -f -- "$RUNNER_TEMP/deploy-input/platform-production-deploy-input.json" "$RUNNER_TEMP/platform-production-deploy-remote.log" "$RUNNER_TEMP/platform-production-deploy-remote-error.log" "$RUNNER_TEMP/platform-release-artifact.zip"
          release_dir="$RUNNER_TEMP/release"
          if [[ -d "$release_dir" && ! -L "$release_dir" ]]; then
            rm -rf -- "$release_dir"
          fi
          test ! -e "$release_dir" && test ! -L "$release_dir"
          trusted_root="$GITHUB_WORKSPACE/trusted-host-tools"
          if [[ -d "$trusted_root" && ! -L "$trusted_root" ]]; then
            rm -rf -- "$trusted_root"
          fi
          test ! -e "$trusted_root" && test ! -L "$trusted_root"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Deployment summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "### Platform production deploy"
            echo
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Web compression: \`$PLATFORM_WEB_NEXT_COMPRESSION\`"
            echo "- Status: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark production deployment successful
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" --data "{\"state\":\"success\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment and live smoke passed\",\"target_url\":\"${run_url}\"}"

      - name: Mark production deployment failed
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" --data "{\"state\":\"failure\",\"context\":\"platform-production-deploy\",\"description\":\"Production deployment failed\",\"target_url\":\"${run_url}\"}"
