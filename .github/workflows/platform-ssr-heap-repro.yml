name: Platform synthetic SSR heap reproduction

on:
  pull_request:
    paths:
      - ".github/workflows/platform-ssr-heap-repro.yml"
      - "platform/apps/platform_web/**"
      - "platform/tools/ssr_heap_repro*"
  workflow_dispatch:
    inputs:
      regime:
        description: Synthetic API response regime
        required: true
        type: choice
        options:
          - baseline
          - slow_bootstrap_1pct
          - workspace_500_230
        default: baseline
      auth_transport:
        description: Existing server-auth transport branch
        required: true
        type: choice
        options:
          - fetch
          - node
        default: fetch

permissions:
  contents: read

jobs:
  build-exact-h:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 3367e50e347a70ef670a7d1a19091669b6a379e7
          path: ssr-reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.3.1
      - name: Verify exact runtime and harness contract
        working-directory: platform/apps/platform_web
        run: |
          test "$(node -p 'process.versions.node')" = "26.3.1"
          node ../../tools/ssr_heap_repro.mjs --self-test
          test "$(git -C "$GITHUB_WORKSPACE/ssr-reference" rev-parse HEAD)" = "3367e50e347a70ef670a7d1a19091669b6a379e7"
      - name: Install locked web dependencies
        working-directory: ssr-reference/platform/apps/platform_web
        run: npm ci --no-audit --no-fund
      - name: Build the exact checked-out standalone application
        working-directory: ssr-reference/platform/apps/platform_web
        env:
          PLATFORM_API_BASE_URL: http://127.0.0.1:3199/api/v1
          PLATFORM_API_INTERNAL_ORIGIN: http://127.0.0.1:3199
          NEXT_PUBLIC_PLATFORM_API_BASE_URL: http://127.0.0.1:3199/api/v1
          PLATFORM_ADSENSE_ENABLED: "false"
        run: |
          npm run build
          test -f .next/standalone/server.js
          test "$(node -p 'require("./node_modules/next/package.json").version')" = "16.3.8"
          test "$(node -p 'require("./node_modules/react/package.json").version')" = "19.2.7"
          mkdir -p "$RUNNER_TEMP/ssr-heap-standalone"
          cp -a .next/standalone/. "$RUNNER_TEMP/ssr-heap-standalone/"
          mkdir -p "$RUNNER_TEMP/ssr-heap-standalone/.next"
          cp -a .next/static "$RUNNER_TEMP/ssr-heap-standalone/.next/static"
          cp -a public "$RUNNER_TEMP/ssr-heap-standalone/public"
          cp server-shutdown-guard.cjs "$RUNNER_TEMP/ssr-heap-standalone/server-shutdown-guard.cjs"
          tar -czf "$RUNNER_TEMP/ssr-heap-standalone.tar.gz" -C "$RUNNER_TEMP" ssr-heap-standalone
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-ssr-heap-standalone
          path: ${{ runner.temp }}/ssr-heap-standalone.tar.gz
          if-no-files-found: error
          retention-days: 1

  reproduce-under-memory-cap:
    needs: build-exact-h
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v6.0.0
        with:
          name: platform-ssr-heap-standalone
          path: ${{ runner.temp }}/ssr-heap-artifact
      - name: Prepare exact standalone image without credentials or network access
        run: |
          mkdir -p "$RUNNER_TEMP/ssr-heap-app"
          tar -xzf "$RUNNER_TEMP/ssr-heap-artifact/ssr-heap-standalone.tar.gz" -C "$RUNNER_TEMP/ssr-heap-app"
          test -f "$RUNNER_TEMP/ssr-heap-app/ssr-heap-standalone/server.js"
          docker pull --platform linux/amd64 node:26.3.1-bookworm-slim@sha256:209558c3e5e40e8adff68959d3c2ba7cd73723e716d89196878a0c362fa1e109
          test "$(docker run --rm --network none node:26.3.1-bookworm-slim@sha256:209558c3e5e40e8adff68959d3c2ba7cd73723e716d89196878a0c362fa1e109 node -p 'process.versions.node')" = "26.3.1"
      - name: Run 20,000 synthetic authenticated SSR requests inside a 1 GiB networkless container
        env:
          SSR_HEAP_APP_DIR: ${{ runner.temp }}/ssr-heap-app/ssr-heap-standalone
          SSR_HEAP_REGIME: ${{ github.event.inputs.regime || 'baseline' }}
          SSR_HEAP_AUTH_TRANSPORT: ${{ github.event.inputs.auth_transport || 'fetch' }}
          SSR_HEAP_APP_SOURCE_COMMIT: 3367e50e347a70ef670a7d1a19091669b6a379e7
          SSR_HEAP_WEB_WORKERS: "1"
          SSR_HEAP_SSR_PERF_LOG_ENABLED: "false"
        run: |
          timeout --signal=TERM --kill-after=10s 18m docker run --rm --init \
            --platform linux/amd64 \
            --network none \
            --memory=1g --memory-swap=1g --cpus=2.0 --pids-limit=256 \
            --ulimit core=0:0 --cap-drop=ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --volume "$SSR_HEAP_APP_DIR:/app:ro" \
            --volume "$GITHUB_WORKSPACE/platform/tools:/tools:ro" \
            --env SSR_HEAP_APP_ROOT=/app \
            --env SSR_HEAP_WORK_ROOT=/tools \
            --env SSR_HEAP_REGIME="$SSR_HEAP_REGIME" \
            --env SSR_HEAP_AUTH_TRANSPORT="$SSR_HEAP_AUTH_TRANSPORT" \
            --env SSR_HEAP_APP_SOURCE_COMMIT="$SSR_HEAP_APP_SOURCE_COMMIT" \
            --env SSR_HEAP_WEB_WORKERS="$SSR_HEAP_WEB_WORKERS" \
            --env SSR_HEAP_SSR_PERF_LOG_ENABLED="$SSR_HEAP_SSR_PERF_LOG_ENABLED" \
            node:26.3.1-bookworm-slim@sha256:209558c3e5e40e8adff68959d3c2ba7cd73723e716d89196878a0c362fa1e109 \
            node /tools/ssr_heap_repro.mjs
