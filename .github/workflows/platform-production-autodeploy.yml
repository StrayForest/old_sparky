            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100&page=1" \
            --output "$metadata_dir/commits.json"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 "$PROVENANCE_TOOL" security \
            --workflow "$metadata_dir/workflows.json" \
            --run "$metadata_dir/runs.json" \
            --status "$metadata_dir/commits.json" \
            --expected-run-id "$SOURCE_RUN_ID" \
            --expected-attempt "$SOURCE_RUN_ATTEMPT" \
            --expected-target-sha "$TARGET_SHA" \
            --expected-run-url "$SOURCE_RUN_URL"

      - name: Revalidate exact successful source-bound backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          SOURCE_SECURITY_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SECURITY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKUP_GUARD_TOOL: ${{ github.workspace }}/platform/tools/platform_backup_success_guard.py
        run: |
          set -euo pipefail
          /usr/bin/python3 -I "$BACKUP_GUARD_TOOL"

      - name: Dispatch production deployment or baseline reconciliation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_MODE: ${{ needs.dispatch.outputs.mode }}
          ROUTE_CLASS: ${{ needs.dispatch.outputs.route_class }}
          ROUTE_DEPLOYABLE: ${{ needs.dispatch.outputs.route_deployable }}
          ROUTE_RECOVERY_BOOTSTRAP_ONLY: ${{ needs.dispatch.outputs.route_recovery_bootstrap_only }}
          ROUTE_CANDIDATE_PACKAGING_ONLY: ${{ needs.dispatch.outputs.route_candidate_packaging_only }}
          ROUTE_DOCS_ONLY: ${{ needs.dispatch.outputs.route_docs_only }}
          AUTODEPLOY_RUN_ID: ${{ github.run_id }}
          AUTODEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          HOST_TOOLS_SHA: ${{ needs.dispatch.outputs.host_tools_sha }}
        run: |
          set -euo pipefail
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$DISPATCH_MODE" in
            deploy)
              [[ "$ROUTE_DEPLOYABLE" == "true" \
                && "$ROUTE_RECOVERY_BOOTSTRAP_ONLY" == "false" \
                && "$ROUTE_CANDIDATE_PACKAGING_ONLY" == "false" ]] \
                || { echo "Refusing an invalid ordinary deploy route." >&2; exit 1; }
              ;;
            baseline-reconcile)
              [[ "$ROUTE_DEPLOYABLE" == "false" \
                && ( ( "$ROUTE_CLASS" == "full" \
                    && ( ( "$ROUTE_RECOVERY_BOOTSTRAP_ONLY" == "true" && "$ROUTE_CANDIDATE_PACKAGING_ONLY" == "false" ) \
                      || ( "$ROUTE_CANDIDATE_PACKAGING_ONLY" == "true" && "$ROUTE_RECOVERY_BOOTSTRAP_ONLY" == "false" ) ) ) \
                  || ( "$ROUTE_CLASS" == "docs-only" && "$ROUTE_DOCS_ONLY" == "true" \
                    && "$ROUTE_RECOVERY_BOOTSTRAP_ONLY" == "false" \
                    && "$ROUTE_CANDIDATE_PACKAGING_ONLY" == "false" ) ) ]] \
                || { echo "Refusing an invalid baseline-reconcile route." >&2; exit 1; }
              ;;
            *) echo "Refusing an unknown production dispatch mode." >&2; exit 1 ;;
          esac
          [[ "$AUTODEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ \
            && "$AUTODEPLOY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]] || {
            echo "Refusing malformed auto-deploy run identity." >&2; exit 1;
          }
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/platform-production-deploy.yml/dispatches" \
            --data "$(/usr/bin/python3 - "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$DISPATCH_MODE" "$AUTODEPLOY_RUN_ID" "$AUTODEPLOY_RUN_ATTEMPT" <<'PY'
          import json
          import sys
          print(json.dumps({
              "ref": "dev",
              "inputs": {
                  "mode": sys.argv[3],
                  "runtime_profile": "authenticated-read-admission-24x8",
                  "web_compression": "enabled",
                  "classifier_run_id": sys.argv[1],
                  "classifier_run_attempt": sys.argv[2],
                  "autodeploy_run_id": sys.argv[4],
                  "autodeploy_run_attempt": sys.argv[5],
              },
          }))
          PY
            )"

      - name: Auto-deploy dispatch summary
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          DISPATCH_MODE: ${{ needs.dispatch.outputs.mode }}
        run: |
          {
            echo "### Platform production auto-deploy dispatch"
            echo
            echo "- Security/build run: $SOURCE_RUN_URL"
            echo "- Mode: \`$DISPATCH_MODE\`"
            if [[ "${{ job.status }}" == "success" ]]; then
              echo "- Result: normal production child dispatched after source, backup, and host readiness proofs."
            else
              echo "- Result: deployment child was not dispatched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
