name: Platform production auto-deploy

on:
  workflow_run:
    workflows:
      - Platform security and build
    types:
      - completed
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: platform-production-auto-deploy
  cancel-in-progress: true

jobs:
  dispatch:
    permissions:
      actions: write
      contents: read
      statuses: read
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SECURITY_WORKFLOW_NAME: Platform security and build
      SECURITY_WORKFLOW_PATH: .github/workflows/platform-security.yml
      SECURITY_WORKFLOW_FILE: platform-security.yml
      PROVENANCE_TOOL: ${{ github.workspace }}/platform/tools/platform_workflow_provenance.py
    steps:
      - name: Checkout exact source for shared provenance validation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact completed security workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          metadata_dir="$(mktemp -d "$RUNNER_TEMP/platform-security-metadata.XXXXXX")"
          trap 'rm -rf -- "$metadata_dir"' EXIT
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${SECURITY_WORKFLOW_FILE}" \
            --output "$metadata_dir/workflow.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            --output "$metadata_dir/run.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100&page=1" \
            --output "$metadata_dir/statuses.json"
          /usr/bin/python3 - "$metadata_dir/statuses.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(rows, list) or len(rows) > 100 or any(not isinstance(row, dict) for row in rows):
              raise SystemExit("security status list response is malformed")
          ids = [row.get("id") for row in rows]
          if any(type(row_id) is not int or row_id <= 0 for row_id in ids) or len(ids) != len(set(ids)):
              raise SystemExit("security status list IDs are malformed or duplicate")
          PY
          # The validator is loaded from the exact source SHA that produced
          # this completed security run.  It is dependency-free and receives
          # no GitHub token, so this privileged workflow never executes a
          # checkout with credentials or a second provenance implementation.
          # It binds "event": "push", "head_branch": "dev",
          # "status": "completed", "conclusion": "success", run_attempt,
          # platform-security-build, trusted creator and target_url.
          test -f "$PROVENANCE_TOOL"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 "$PROVENANCE_TOOL" security \
            --workflow "$metadata_dir/workflow.json" \
            --run "$metadata_dir/run.json" \
            --status "$metadata_dir/statuses.json" \
            --expected-run-id "$SOURCE_RUN_ID" \
            --expected-attempt "$SOURCE_RUN_ATTEMPT" \
            --expected-target-sha "$TARGET_SHA" \
            --expected-run-url "$SOURCE_RUN_URL"

      - name: Download and validate exact classifier artifact
        id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID"
          test -n "$SOURCE_RUN_ATTEMPT"
          expected_name="platform-ci-route-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          route_dir="$(mktemp -d "$RUNNER_TEMP/platform-ci-route.XXXXXX")"
          trap 'rm -rf -- "$route_dir" "$RUNNER_TEMP/platform-ci-artifact-pages"' EXIT
          fetch_classifier_artifacts() {
            local output_path="$1" page=1 count page_path
            local pages_dir
            pages_dir="$RUNNER_TEMP/platform-ci-artifact-pages/$(basename "$output_path")"
            install -d -m 700 "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail-with-body --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100&page=${page}" \
                --output "$page_path"
              count="$(/usr/bin/python3 - "$page_path" "$pages_dir/total" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          page_path, total_path = sys.argv[1:]
          payload = json.loads(Path(page_path).read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or type(payload.get("total_count")) is not int or not 0 <= payload["total_count"] <= 10_000:
              raise SystemExit("classifier artifact pagination total_count is malformed or excessive")
          rows = payload.get("artifacts")
          if not isinstance(rows, list) or len(rows) > 100 or any(not isinstance(row, dict) for row in rows):
              raise SystemExit("classifier artifact pagination page is malformed")
          ids = []
          for row in rows:
              if type(row.get("id")) is not int or row["id"] <= 0:
                  raise SystemExit("classifier artifact row ID is malformed")
              if not isinstance(row.get("name"), str) or not row["name"].isascii() or not 1 <= len(row["name"]) <= 256:
                  raise SystemExit("classifier artifact row name is malformed")
              if type(row.get("expired")) is not bool:
                  raise SystemExit("classifier artifact expired flag is malformed")
              workflow_run = row.get("workflow_run")
              if not isinstance(workflow_run, dict) or type(workflow_run.get("id")) is not int or workflow_run["id"] <= 0:
                  raise SystemExit("classifier artifact workflow identity is malformed")
              if not isinstance(workflow_run.get("head_sha"), str) or re.fullmatch(r"[0-9a-f]{40}", workflow_run["head_sha"]) is None:
                  raise SystemExit("classifier artifact workflow SHA is malformed")
              if "run_attempt" in workflow_run and (type(workflow_run["run_attempt"]) is not int or workflow_run["run_attempt"] <= 0):
                  raise SystemExit("classifier artifact workflow attempt is malformed")
              ids.append(row["id"])
          if len(ids) != len(set(ids)):
              raise SystemExit("classifier artifact page contains duplicate IDs")
          marker = Path(total_path)
          if marker.exists() and marker.read_text(encoding="ascii") != str(payload["total_count"]):
              raise SystemExit("classifier artifact total_count changed during pagination")
          marker.write_text(str(payload["total_count"]), encoding="ascii")
          print(len(rows))
          PY
              )"
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 100 )) || { echo "classifier artifact pagination exceeded its bound" >&2; exit 1; }
            done
            /usr/bin/python3 - "$pages_dir" "$output_path" <<'PY'
          import json
          from pathlib import Path
          import sys

          pages_dir, output_path = map(Path, sys.argv[1:])
          total_path = pages_dir / "total"
          expected_total = int(total_path.read_text(encoding="ascii"))
          rows = []
          seen = set()
          paths = sorted(pages_dir.glob("page-*.json"), key=lambda item: int(item.stem.split("-")[-1]))
          for path in paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              page_rows = payload.get("artifacts") if isinstance(payload, dict) else None
              if not isinstance(page_rows, list):
                  raise SystemExit("classifier artifact page is malformed")
              for row in page_rows:
                  row_id = row.get("id")
                  if type(row_id) is not int or row_id <= 0 or row_id in seen:
                      raise SystemExit("classifier artifact rows contain duplicate or malformed IDs")
                  seen.add(row_id)
                  rows.append(row)
          if len(rows) > expected_total:
              raise SystemExit("classifier artifact pagination returned excess rows")
          if len(rows) != expected_total:
              raise SystemExit("classifier artifact pagination is incomplete")
          output_path = Path(output_path)
          output_path.write_text(json.dumps({"total_count": expected_total, "artifacts": rows}, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          PY
          }
          fetch_classifier_artifacts "$route_dir/artifacts-first.json"
          fetch_classifier_artifacts "$route_dir/artifacts-second.json"
          artifact_id="$(/usr/bin/python3 - "$route_dir/artifacts-first.json" "$route_dir/artifacts-second.json" "$expected_name" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$TARGET_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          first_path, second_path, expected_name, run_id, attempt, target_sha = sys.argv[1:]
          first = json.loads(Path(first_path).read_text(encoding="utf-8"))
          second = json.loads(Path(second_path).read_text(encoding="utf-8"))

          def identity(row):
              workflow_run = row.get("workflow_run")
              return (
                  row.get("id"),
                  row.get("name"),
                  row.get("expired"),
                  workflow_run.get("id") if isinstance(workflow_run, dict) else None,
                  workflow_run.get("head_sha") if isinstance(workflow_run, dict) else None,
                  workflow_run.get("run_attempt") if isinstance(workflow_run, dict) else None,
              )

          first_rows = sorted((identity(row) for row in first["artifacts"]), key=lambda value: value[0])
          second_rows = sorted((identity(row) for row in second["artifacts"]), key=lambda value: value[0])
          if first["total_count"] != second["total_count"] or first_rows != second_rows:
              raise SystemExit("classifier artifact listing changed during validation")
          matches = [row for row in second["artifacts"] if row.get("name") == expected_name and row.get("expired") is False]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one unexpired classifier artifact {expected_name!r}; found {len(matches)}")
          selected = matches[0]
          workflow_run = selected.get("workflow_run")
          if not isinstance(workflow_run, dict) or workflow_run.get("id") != int(run_id) or workflow_run.get("head_sha") != target_sha:
              raise SystemExit("classifier artifact is not bound to the exact run and target SHA")
          if "run_attempt" in workflow_run and workflow_run.get("run_attempt") != int(attempt):
              raise SystemExit("classifier artifact is not bound to the exact run attempt")
          if type(selected.get("id")) is not int or selected["id"] <= 0:
              raise SystemExit("classifier artifact ID is malformed")
          print(selected["id"])
          PY
          )"
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            --output "$route_dir/artifact.zip"
          # The artifact is data-only, but it is still an untrusted ZIP.  The
          # dependency-free checked-out helper rejects absolute/traversal,
          # symlink, duplicate and compression-bomb entries before a manifest
          # reaches the output protocol.  This job has only the GitHub API
          # token; it never receives production credentials.
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 - "$route_dir/artifact.zip" "$route_dir/unpacked" <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "platform/tools")
          from platform_safe_zip import extract_single_manifest

          extract_single_manifest(Path(sys.argv[1]), Path(sys.argv[2]))
          PY
          manifest_path="$route_dir/unpacked/classifier-manifest.json"
          /usr/bin/python3 - "$manifest_path" "$TARGET_SHA" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          manifest_path, target_sha, output_path = sys.argv[1:]
          manifest = json.loads(Path(manifest_path).read_text(encoding="utf-8"))
          fields = (
              "schema", "version", "target_sha", "event", "class",
              "expected_gates", "runtime_sensitive", "deployable", "fallback", "reason", "files",
          )
          expected_gates = {
              "docs-only": ["docs", "verification-contract"],
              "out-of-scope": ["verification-contract"],
              "full": [
                  "backend", "python-quality", "security", "migration", "docs",
                  "web-quality", "web-hermetic", "verification-contract",
              ],
          }
          recovery_bootstrap_files = {
              ".github/workflows/platform-production-recovery-bootstrap-build.yml",
              ".github/workflows/platform-production-recovery-bootstrap-publish.yml",
              ".github/workflows/platform-production-recovery-bootstrap-abort.yml",
              ".github/workflows/platform-production-deploy.yml",
              ".github/workflows/platform-production-release-abort.yml",
              ".github/workflows/platform-production-release-recover.yml",
              ".github/workflows/platform-production-autodeploy.yml",
              "platform/tools/platform_recovery_bootstrap.py",
              "platform/tools/platform_tournament_list_read_model_recovery.py",
              "platform/alembic/env.py",
              "platform/tools/platform_abort_retained_only.sh",
              "platform/tools/platform_release_lock.sh",
              "platform/tools/platform_release_deploy.sh",
              "platform/tools/platform_release_preflight.sh",
              "platform/tools/platform_install_systemd_units.sh",
              "platform/tools/platform_install_logging.sh",
              "platform/tools/platform_install_nginx.py",
              "platform/tools/platform_release_restore_runtime.sh",
              "platform/tools/platform_production_deploy_supervisor.sh",
              "platform/tools/platform_update_cloudflare_ips.py",
              "platform/tools/platform_deploy_smoke_impl.py",
              "platform/tools/platform_validate_edge_policy.py",
              "platform/tools/platform_health_monitor.py",
              "platform/tools/platform_release_rollback.sh",
              "platform/tools/platform_release_systemd_state.py",
              "platform/tools/platform_recover_pending.sh",
              "platform/tools/platform_release_transaction.py",
              "platform/tools/platform_run_alembic.sh",
              "platform/tools/platform_live_qa_guard.py",
              "platform/tools/platform_live_qa_runtime_install.py",
              "platform/tools/platform_build_live_qa_runtime.py",
              "platform/tests/test_platform_recovery_bootstrap.py",
              "platform/tests/test_platform_db.py",
              "platform/tests/test_platform_release_audit_hardening.py",
              "platform/tests/test_platform_release_build_contract.py",
              "platform/tests/test_platform_release_recovery_boundaries.py",
              "platform/tests/test_platform_storage_maintenance.py",
              "platform/tests/test_platform_release_systemd_state.py",
              "platform/tests/test_platform_release_venv_rollback.py",
              "platform/tests/test_platform_live_qa_guard.py",
              "platform/tests/test_platform_live_qa_runtime_install.py",
              "platform/tests/test_platform_live_qa_wrappers.py",
              "platform/tests/test_platform_ssh_host_key_scan.py",
              "platform/tests/test_platform_release_build_diagnostics.py",
              "platform/tests/test_platform_ci_classifier.py",
              "platform/tools/platform_ci_classifier.py",
              "platform/tools/platform_production_classifier_artifact.py",
              "platform/tools/platform_verify_contract.py",
              "platform/tools/platform_test_catalog.py",
              "platform/tools/platform_workflow_input_guard.py",
              "platform/tools/platform_workflow_remote_dispatch.py",
              "platform/tests/test_platform_host_tools_bundle.py",
              "platform/tests/test_platform_cloudflare_ips.py",
              "platform/python_packages/platform_infra/db.py",
              "platform/tests/test_platform_install_nginx.py",
              "platform/deploy/systemd/deadlock-cloudflare-ips.service",
              "platform/deploy/systemd/deadlock-health-monitor.service",
              "platform/contracts/host_tools_pin.json",
          }
          if manifest.get("schema") != 1 or manifest.get("version") != 1:
              raise SystemExit("classifier manifest schema/version is invalid")
          route_class = manifest.get("class")
          if route_class not in expected_gates:
              raise SystemExit("classifier manifest class is invalid")
          if manifest.get("expected_gates") != expected_gates[route_class]:
              raise SystemExit("classifier expected gates are invalid")
          if manifest.get("target_sha") != target_sha:
              raise SystemExit("classifier target SHA does not match workflow_run head SHA")
          if manifest.get("event") != "push":
              raise SystemExit("auto-deploy classifier event is not push")
          if manifest.get("fallback") is not False:
              raise SystemExit("fallback classifier routes cannot auto-deploy")
          reason = manifest.get("reason")
          if (
              not isinstance(reason, str)
              or not reason
              or len(reason) > 512
              or any(not 0x20 <= ord(character) <= 0x7E for character in reason)
          ):
              raise SystemExit("classifier reason is missing")
          if not isinstance(manifest.get("files"), list):
              raise SystemExit("classifier files are malformed")
          files = manifest["files"]
          recovery_bootstrap_only = bool(
              any(path in recovery_bootstrap_files for path in files)
              and all(
                  path in recovery_bootstrap_files
                  or (isinstance(path, str) and path.startswith("platform/docs/"))
                  for path in files
              )
          )
          if not isinstance(manifest.get("runtime_sensitive"), bool):
              raise SystemExit("classifier runtime-sensitive field is malformed")
          payload = {field: manifest[field] for field in fields}
          digest = hashlib.sha256(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          if manifest.get("digest") != digest:
              raise SystemExit("classifier digest does not match manifest")
          # A full route can intentionally be CI-only (for example, the
          # trusted host-tools candidate packaging).  The classifier's
          # deployable bit, not the route class alone, controls dispatch.
          if type(manifest.get("deployable")) is not bool:
              raise SystemExit("full route may be non-deployable, but its flag must be boolean")
          if recovery_bootstrap_only and manifest["deployable"]:
              raise SystemExit("recovery-bootstrap route cannot be deployable")
          if route_class != "full" and manifest.get("deployable") is not False:
              raise SystemExit("reduced classifier route must be non-deployable")
          with Path(output_path).open("a", encoding="utf-8") as output:
              output.write(f"route_class={route_class}\n")
              output.write(f"route_deployable={'true' if manifest['deployable'] else 'false'}\n")
              output.write(f"route_fallback={'true' if manifest['fallback'] else 'false'}\n")
              output.write(f"route_digest={manifest['digest']}\n")
              output.write(f"route_reason={reason}\n")
          PY

      - name: Verify tested SHA is current dev head
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_CLASS: ${{ steps.route.outputs.route_class }}
          ROUTE_DEPLOYABLE: ${{ steps.route.outputs.route_deployable }}
        run: |
          set -euo pipefail

          branch_json="$(
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev"
          )"
          dev_sha="$(
            printf '%s' "$branch_json" | /usr/bin/python3 -c '
          import json
          import sys
          print(json.load(sys.stdin)["commit"]["sha"])
          '
          )"

          if [[ "$dev_sha" != "$TARGET_SHA" ]]; then
            echo "Skipping stale successful CI result for $TARGET_SHA; current dev is $dev_sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$ROUTE_DEPLOYABLE" != "true" ]]; then
            echo "Classifier route is non-deployable ($ROUTE_CLASS); no production deployment required."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status_dir="$(mktemp -d "$RUNNER_TEMP/platform-autodeploy-status.XXXXXX")"
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          # The list-commit-statuses endpoint returns one raw array per page
          # and has no total_count field. Require bounded pages, regular row
          # shapes and globally unique numeric IDs while assembling a
          # complete snapshot. Every row is retained unchanged so the shared
          # validator can bind creator,
          # context, state and target URL to the exact run attempt.
          fetch_statuses() {
            local output_path="$1" page=1 count page_path
            local pages_dir="$output_path.pages"
            install -d -m 700 "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail-with-body --silent --show-error "${api_headers[@]}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100&page=${page}" \
                --output "$page_path"
              count="$(/usr/bin/python3 - "$page_path" <<'PY'
          import json
          from pathlib import Path
          import sys

          rows = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(rows, list) or len(rows) > 100 or any(not isinstance(row, dict) for row in rows):
              raise SystemExit("status pagination response is malformed")
          ids = []
          for row in rows:
              if type(row.get("id")) is not int or row["id"] <= 0:
                  raise SystemExit("status row ID is malformed")
              ids.append(row["id"])
          if len(ids) != len(set(ids)):
              raise SystemExit("status page contains duplicate IDs")
          print(len(rows))
          PY
              )"
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 1000 )) || { echo "status pagination exceeded its bound" >&2; exit 1; }
            done
            /usr/bin/python3 - "$pages_dir" "$output_path" <<'PY'
          import json
          from pathlib import Path
          import sys

          pages_dir, output_path = map(Path, sys.argv[1:])
          rows = []
          seen = set()
          for path in sorted(pages_dir.glob("page-*.json"), key=lambda item: int(item.stem.split("-")[-1])):
              page_rows = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(page_rows, list) or any(not isinstance(row, dict) for row in page_rows):
                  raise SystemExit("status pagination response is malformed")
              for row in page_rows:
                  row_id = row.get("id")
                  if type(row_id) is not int or row_id <= 0 or row_id in seen:
                      raise SystemExit("status rows contain duplicate or malformed IDs")
                  seen.add(row_id)
                  rows.append(row)
          output_path.write_text(json.dumps(rows, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          PY
          }
          fetch_security_snapshot() {
            local snapshot_dir="$1"
            install -d -m 700 "$snapshot_dir"
            curl --fail-with-body --silent --show-error "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${SECURITY_WORKFLOW_FILE}" \
              --output "$snapshot_dir/workflow.json"
            curl --fail-with-body --silent --show-error "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
              --output "$snapshot_dir/run.json"
            fetch_statuses "$snapshot_dir/statuses.json"
          }
          # Read the complete status list twice immediately before the
          # deployment candidate check. Equality is over the shared validator
          # output, not merely state/URL fields, so mutations cannot suppress a
          # required dispatch.
          for snapshot in first second; do
            fetch_security_snapshot "$status_dir/$snapshot"
          done
          security_marker_first="$(
