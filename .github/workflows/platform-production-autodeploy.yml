    name: Wait for exact host-tools generation readiness
    needs:
      - dispatch
    if: >-
      needs.dispatch.result == 'success' &&
      needs.dispatch.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      HOST_TOOLS_SHA: ${{ needs.dispatch.outputs.host_tools_sha }}
      HOST_TOOLS_TOOLSET_VERSION: ${{ needs.dispatch.outputs.host_tools_toolset_version }}
    steps:
      - name: Checkout exact tested source containing shared verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact uploaded host-tools bundle and contract
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-host-tools-bootstrap-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/host-tools-bootstrap

      - name: Revalidate bundle bytes against exact host-tools pin
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/platform/tools/platform_host_tools_bundle.py" verify \
            --bundle "$RUNNER_TEMP/host-tools-bootstrap/platform-host-tools-bundle.zip" \
            --expected-source-sha "$HOST_TOOLS_SHA" \
            --contract-dir "$RUNNER_TEMP/host-tools-bootstrap/contract"

      - name: Verify exact installed generation with shared read-only verifier
        id: host-ready
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HOST_TOOLS_TOOLSET_VERSION" =~ ^production-host-tools-v[34]$ ]]
          IFS= read -r bundle_source < "$RUNNER_TEMP/host-tools-bootstrap/contract/source_sha"
          IFS= read -r bundle_version < "$RUNNER_TEMP/host-tools-bootstrap/contract/toolset_version"
          test "$bundle_source" = "$HOST_TOOLS_SHA"
          test "$bundle_version" = "$HOST_TOOLS_TOOLSET_VERSION"
          /usr/bin/timeout --signal=TERM --kill-after=5s 35m \
            /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/platform/tools/platform_host_tools_installed_check.py" \
              --source-sha "$HOST_TOOLS_SHA" \
              --toolset-version "$HOST_TOOLS_TOOLSET_VERSION" \
              --contract-dir "$RUNNER_TEMP/host-tools-bootstrap/contract" \
              --wait-for-generation-seconds 1800

      - name: Remove host-readiness verifier material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/host-tools-bootstrap" "$RUNNER_TEMP/platform-host-capability-ssh"

