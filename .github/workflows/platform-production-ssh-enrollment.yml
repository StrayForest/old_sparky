name: Platform production SSH host-key enrollment

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/platform-production-ssh-enrollment.yml"

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
    steps:
      - name: Read production SSH host public fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          scan="$(mktemp)"
          trap 'rm -f -- "$scan"' EXIT
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$scan"
          test -s "$scan" || { echo "Production SSH host exposed no ED25519 key" >&2; exit 1; }
          count="$(wc -l < "$scan" | tr -d ' ')"
          test "$count" = "1" || { echo "Expected exactly one ED25519 host key, got $count" >&2; exit 1; }
          fingerprint="$(ssh-keygen -lf "$scan" -E sha256 | awk '{print $2}')"
          [[ "$fingerprint" == SHA256:* ]] || { echo "Invalid SSH host fingerprint" >&2; exit 1; }
          printf 'PRODUCTION_SSH_ED25519_FINGERPRINT=%s\n' "$fingerprint"
