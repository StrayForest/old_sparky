name: Platform production content diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact source SHA currently deployed on the production VPS"
        required: true
        type: string
  workflow_run:
    workflows: ["Platform production deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  validate-content-provenance:
    name: Validate content diagnostics handoff
    outputs:
      deploy_ready: ${{ steps.deployment_provenance.outputs.deploy_ready }}
      provenance_digest: ${{ steps.deployment_provenance.outputs.provenance_digest }}
    permissions:
      actions: read
      contents: read
      statuses: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      SOURCE_RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || '' }}
      SOURCE_RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}
      PROVENANCE_TOOL: ${{ github.workspace }}/platform/tools/platform_workflow_provenance.py
    steps:
      # The workflow-run SHA is data to validate, never the source of this
      # token-bearing validator. Pin the checkout to the immutable default
      # branch commit resolved by the GitHub API.
      - name: Resolve immutable default-branch provenance source
        id: trusted_default
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: dev
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_REF" = "refs/heads/dev"
          trusted_ref="$RUNNER_TEMP/platform-trusted-content-ref.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRUSTED_BRANCH}" \
            --output "$trusted_ref"
          /usr/bin/python3 - "$trusted_ref" "$GITHUB_OUTPUT" "$TRUSTED_BRANCH" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branch = sys.argv[3]
          obj = payload.get("object") if isinstance(payload, dict) else None
          sha = obj.get("sha") if isinstance(obj, dict) else None
          if payload.get("ref") != f"refs/heads/{branch}" or not isinstance(obj, dict) or obj.get("type") != "commit":
              raise SystemExit("trusted default branch ref is not an immutable commit")
          if not isinstance(sha, str) or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("trusted default branch commit SHA is malformed")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
          rm -f -- "$trusted_ref"

      - name: Checkout trusted content diagnostics source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.trusted_default.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate content diagnostics input
        shell: bash
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$GITHUB_REF" = "refs/heads/dev" \
              || { echo "Production content diagnostics must run from dev." >&2; exit 1; }
          fi
          /usr/bin/python3 -I platform/tools/platform_workflow_input_guard.py sha \
            --value "$TARGET_SHA"

      - name: Verify exact completed production deployment provenance (shared validator)
        id: deployment_provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SOURCE_SHA: ${{ steps.trusted_default.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_SOURCE_SHA"
          # The shared validator owns these exact checks; consumers must not
          # bind an untrusted row to any other workflow: "path": ".github/workflows/platform-production-deploy.yml"
          # and the source run must carry "event": "workflow_dispatch" with
          # "conclusion": "success".
          # reimplement status.get("context") == "platform-production-deploy"
          # or status.get("target_url") == os.environ["SOURCE_RUN_URL"].
          # Its closed output is equivalent to output.write("deploy_ready=false\n")
          # / output.write("deploy_ready=true\n") after two equal snapshots.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' 'deploy_ready=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' 'provenance_digest=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          provenance_dir="$(mktemp -d "$RUNNER_TEMP/platform-production-content-provenance.XXXXXX")"
          trap 'rm -rf -- "$provenance_dir"' EXIT
          chmod 700 "$provenance_dir"
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          fetch_rows() {
            local base_url="$1" output_path="$2" kind="$3" page=1 count page_path
            local pages_dir="$provenance_dir/pages-${kind}-$(basename "$output_path")"
            install -d -m 700 "$pages_dir"
            while :; do
              page_path="$pages_dir/page-${page}.json"
              curl --fail-with-body --silent --show-error "${api_headers[@]}" \
                "${base_url}?per_page=100&page=${page}" --output "$page_path"
              count="$(/usr/bin/python3 - "$page_path" "$kind" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = payload if sys.argv[2] == "statuses" else payload.get("jobs") if isinstance(payload, dict) else None
          if not isinstance(rows, list) or any(not isinstance(row, dict) for row in rows):
              raise SystemExit("paginated provenance response is malformed")
          print(len(rows))
          PY
              )"
              if (( count < 100 )); then
                break
              fi
              ((page += 1))
              (( page <= 1000 )) || { echo "provenance pagination exceeded its bound" >&2; exit 1; }
            done
            /usr/bin/python3 - "$pages_dir" "$output_path" "$kind" <<'PY'
          import json
          from pathlib import Path
          import sys

          pages_dir, output_path, kind = sys.argv[1:]
          rows = []
          page_paths = sorted(
              Path(pages_dir).glob("page-*.json"),
              key=lambda item: int(item.stem.split("-")[-1]),
          )
          for path in page_paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              page_rows = payload if kind == "statuses" else payload.get("jobs")
              if not isinstance(page_rows, list):
                  raise SystemExit("paginated provenance response is malformed")
              rows.extend(page_rows)
          if kind == "statuses":
              output_path = Path(output_path)
              output_path.write_text(json.dumps(rows, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          else:
              output_path = Path(output_path)
              output_path.write_text(json.dumps({"total_count": len(rows), "jobs": rows}, sort_keys=True, separators=(",", ":")), encoding="utf-8")
          PY
          }
          fetch_snapshot() {
            local snapshot_dir="$1"
            install -d -m 700 "$snapshot_dir"
            curl --fail-with-body --silent --show-error "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/platform-production-deploy.yml" \
              --output "$snapshot_dir/workflow.json"
            curl --fail-with-body --silent --show-error "${api_headers[@]}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
              --output "$snapshot_dir/run.json"
            fetch_rows \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}/jobs" \
              "$snapshot_dir/jobs.json" jobs
            fetch_rows \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses" \
              "$snapshot_dir/statuses.json" statuses
          }
          for snapshot in first second; do
            fetch_snapshot "$provenance_dir/$snapshot"
            /usr/bin/python3 "$PROVENANCE_TOOL" deployment \
              --allow-preflight-noop \
              --workflow "$provenance_dir/$snapshot/workflow.json" \
              --run "$provenance_dir/$snapshot/run.json" \
              --jobs "$provenance_dir/$snapshot/jobs.json" \
              --status "$provenance_dir/$snapshot/statuses.json" \
              --expected-run-id "$SOURCE_RUN_ID" \
              --expected-attempt "$SOURCE_RUN_ATTEMPT" \
              --expected-target-sha "$TARGET_SHA" \
              --expected-run-url "$SOURCE_RUN_URL" \
              > "$provenance_dir/$snapshot/validated.json"
          done
          /usr/bin/python3 - "$provenance_dir/first/validated.json" "$provenance_dir/second/validated.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          first, second = (json.loads(Path(path).read_text(encoding="utf-8")) for path in sys.argv[1:3])
          if first != second:
              raise SystemExit("deployment provenance changed between adjacent snapshots")
          if first.get("deploy_ready") not in (False, True):
              raise SystemExit("deployment provenance readiness is malformed")
          digest = first.get("snapshot_digest")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("deployment provenance snapshot digest is malformed")
          with Path(sys.argv[3]).open("a", encoding="utf-8") as output:
              output.write(f"deploy_ready={'true' if first['deploy_ready'] else 'false'}\n")
              output.write(f"provenance_digest={digest}\n")
          PY

  content-diagnostics:
    # The shared handoff replaces the former inline gate
    # steps.verify_deploy_provenance.outputs.deploy_ready == 'true'.
    permissions:
      contents: read
      statuses: write
    needs: validate-content-provenance
    if: >-
      needs.validate-content-provenance.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.validate-content-provenance.outputs.deploy_ready == 'true')
    name: Production content diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      SOURCE_RUN_ATTEMPT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_attempt || '' }}
      SOURCE_RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.html_url || '' }}

    steps:
      - name: Consume validated deployment provenance
        if: ${{ success() && needs.validate-content-provenance.outputs.deploy_ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.validate-content-provenance.outputs.deploy_ready }}" = "true"
          digest="${{ needs.validate-content-provenance.outputs.provenance_digest }}"
          test -z "$digest" || [[ "$digest" =~ ^[0-9a-f]{64}$ ]]

      - name: Mark content diagnostics pending
        if: ${{ success() && needs.validate-content-provenance.outputs.deploy_ready == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"platform-content-diagnostics\",\"description\":\"Production content diagnostics are running\",\"target_url\":\"${run_url}\"}"

      - name: Configure SSH
        if: ${{ success() && needs.validate-content-provenance.outputs.deploy_ready == 'true' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}"
          test -n "${PROD_SSH_KEY:-}"
          ssh_dir="$RUNNER_TEMP/platform-production-content-diagnostics-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-content-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 0600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          chmod 600 "$ssh_dir/known_hosts"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Verify latest patch distribution
        id: patch_distribution
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          umask 077
          remote_log="$RUNNER_TEMP/platform-production-content-diagnostics-patch.log"
          remote_error="$RUNNER_TEMP/platform-production-content-diagnostics-patch-error.log"
          : >"$remote_log"
          : >"$remote_error"
          chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            bash -s -- "$TARGET_SHA" >"$remote_log" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          runtime=/opt/oldsparky/platform
          guard="$runtime/current/tools/platform_release_lock_exec.sh"
          test -f "$guard" && test ! -L "$guard" && test -x "$guard" \
            || { echo "Production mutation guard is missing" >&2; exit 1; }
          /bin/bash "$guard" \
            --app-dir "$runtime" \
            --expected-sha "$target_sha" \
            -- /bin/bash -s <<'MUTATION'
          set -Eeuo pipefail
          runtime=/opt/oldsparky/platform
          cd "$runtime/current"
          export PLATFORM_APP_DIR="$runtime"
          export PLATFORM_SHARED_DIR="$runtime/shared"
          export PLATFORM_ENV_FILE="$runtime/shared/.env.platform"
          export PLATFORM_PYTHON_BIN="$runtime/shared/venv/bin/python"
          source "$runtime/current/tools/platform_runtime_common.sh"
          platform_load_env_file
          export PYTHONPATH="$runtime/current"

          "$runtime/shared/venv/bin/python" - <<'PY'
          import asyncio
          import re

          import httpx

          from apps.platform_api.app.api.schemas import PatchDetailResponse
          from apps.platform_api.app.services import home_content_security
          from apps.platform_api.app.services import patch_detail_security

          PATCH_ID_RE = re.compile(r"^[0-9]{1,32}$")


          class PatchDistributionFailure(RuntimeError):
              def __init__(self, error_class: str) -> None:
                  super().__init__(error_class)
                  self.error_class = error_class


          def fail(error_class: str) -> None:
              raise PatchDistributionFailure(error_class)


          def validate_detail(payload: object, *, expected_id: str) -> int:
              if not isinstance(payload, dict):
                  fail("producer")
              try:
                  parsed = PatchDetailResponse.model_validate(payload)
              except Exception:
                  fail("producer")
              if parsed.id != expected_id:
                  fail("producer")
              sections = payload.get("sections")
              if not isinstance(sections, list) or not sections:
                  fail("producer")
              return len(sections)


          async def fetch_api_detail(
              client: httpx.AsyncClient,
              url: str,
          ) -> dict[str, object]:
              try:
                  response = await client.get(url)
                  response.raise_for_status()
                  payload = response.json()
              except Exception:
                  fail("remote_or_transport")
              if not isinstance(payload, dict):
                  fail("remote_or_transport")
              return payload


          async def main() -> None:
              refreshed = await home_content_security.refresh_home_content(force=True)
              if not isinstance(refreshed, dict) or refreshed.get("patches_available") is not True:
                  fail("producer")
              patches = refreshed.get("patches")
              if not isinstance(patches, list) or not patches:
                  fail("producer")
              latest = patches[0]
              if not isinstance(latest, dict):
                  fail("producer")
              latest_id = str(latest.get("id") or "")
              if PATCH_ID_RE.fullmatch(latest_id) is None:
                  fail("producer")

              internal_detail = await patch_detail_security.get_patch_detail(latest_id)
              internal_sections = validate_detail(internal_detail, expected_id=latest_id)

              async with httpx.AsyncClient(
                  timeout=15,
                  follow_redirects=False,
                  headers={"Accept": "application/json"},
              ) as client:
                  internal_api, public_api = await asyncio.gather(
                      fetch_api_detail(
                          client,
                          f"http://127.0.0.1:8010/api/v1/content/patches/{latest_id}",
                      ),
                      fetch_api_detail(
                          client,
                          f"https://old-sparky.com/api/v1/content/patches/{latest_id}",
                      ),
                  )
              internal_api_sections = validate_detail(internal_api, expected_id=latest_id)
              public_api_sections = validate_detail(public_api, expected_id=latest_id)
              print(
                  "PRODUCTION_PATCH_DISTRIBUTION schema=1 status=passed "
                  "error_class=none latest_patch_id="
                  + latest_id
                  + " internal_section_count="
                  + str(internal_sections)
                  + " internal_api_section_count="
                  + str(internal_api_sections)
                  + " public_api_section_count="
                  + str(public_api_sections)
              )


          try:
              asyncio.run(main())
          except PatchDistributionFailure as error:
              print(
                  "PRODUCTION_PATCH_DISTRIBUTION schema=1 status=failed "
                  f"error_class={error.error_class} latest_patch_id=unavailable "
                  "internal_section_count=0 internal_api_section_count=0 "
                  "public_api_section_count=0"
              )
              raise SystemExit(1)
          except Exception:
              print(
                  "PRODUCTION_PATCH_DISTRIBUTION schema=1 status=failed "
                  "error_class=internal latest_patch_id=unavailable "
                  "internal_section_count=0 internal_api_section_count=0 "
                  "public_api_section_count=0"
              )
              raise SystemExit(1)
          PY
          MUTATION
          REMOTE
          remote_status=$?
          set -e
          summary_count="$(grep -Ec '^PRODUCTION_PATCH_DISTRIBUTION schema=1 status=(passed|failed) error_class=[a-z_]+ latest_patch_id=(unavailable|[0-9]{1,32}) internal_section_count=[0-9]+ internal_api_section_count=[0-9]+ public_api_section_count=[0-9]+$' "$remote_log" || true)"
          passed_count="$(grep -Ec '^PRODUCTION_PATCH_DISTRIBUTION schema=1 status=passed error_class=none latest_patch_id=[0-9]{1,32} internal_section_count=[1-9][0-9]* internal_api_section_count=[1-9][0-9]* public_api_section_count=[1-9][0-9]*$' "$remote_log" || true)"
          if (( remote_status != 0 )) || [[ "$summary_count" != "1" ]] || [[ "$passed_count" != "1" ]]; then
            rm -f -- "$remote_log" "$remote_error"
            printf '%s\n' 'PRODUCTION_PATCH_DISTRIBUTION schema=1 status=failed error_class=remote_or_transport latest_patch_id=unavailable internal_section_count=0 internal_api_section_count=0 public_api_section_count=0'
            exit 1
          fi
          summary_line="$(grep -E '^PRODUCTION_PATCH_DISTRIBUTION schema=1 status=passed error_class=none latest_patch_id=[0-9]{1,32} internal_section_count=[1-9][0-9]* internal_api_section_count=[1-9][0-9]* public_api_section_count=[1-9][0-9]*$' "$remote_log")"
          printf '%s\n' "$summary_line"
          printf 'summary_line=%s\n' "$summary_line" >> "$GITHUB_OUTPUT"
          rm -f -- "$remote_log" "$remote_error"

      - name: Probe and refresh production home content
        id: home_content
        if: ${{ success() && needs.validate-content-provenance.outputs.deploy_ready == 'true' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          umask 077
          remote_log="$RUNNER_TEMP/platform-production-content-diagnostics.log"
          remote_error="$RUNNER_TEMP/platform-production-content-diagnostics-error.log"
          : >"$remote_log"
          : >"$remote_error"
          chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA'" >"$remote_log" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          runtime=/opt/oldsparky/platform
          guard="$runtime/current/tools/platform_release_lock_exec.sh"
          test -f "$guard" && test ! -L "$guard" && test -x "$guard" \
            || { echo "Production mutation guard is missing" >&2; exit 1; }
          /bin/bash "$guard" \
            --app-dir "$runtime" \
            --expected-sha "$target_sha" \
            -- /bin/bash -s <<'MUTATION'
          set -Eeuo pipefail
          runtime=/opt/oldsparky/platform
          cd "$runtime/current"
          python_bin="$runtime/shared/venv/bin/python"

          echo '=== YouTube endpoint probe ==='
          "$python_bin" - <<'PY'
          import httpx
          import re

          SAFE_ID = re.compile(r"^[A-Za-z0-9_-]{1,128}$")

          def safe_id(value):
              candidate = str(value or "")
              return candidate if SAFE_ID.fullmatch(candidate) else "unavailable"

          urls = {
              "feed": "https://www.youtube.com/feeds/videos.xml?channel_id=UCNoxEIMEAbGHLpn2IGKqlCQ",
              "videos": "https://www.youtube.com/@deadlockOldSparky/videos",
          }
          headers = {
              "Accept-Language": "en-US,en;q=0.8",
              "Cookie": "SOCS=CAI",
              "User-Agent": "Mozilla/5.0 (compatible; OldSparkyArena/1.0)",
          }
          with httpx.Client(timeout=10, follow_redirects=True, headers=headers) as client:
              for name, url in urls.items():
                  try:
                      response = client.get(url)
                      print(
                          "YOUTUBE_PROBE",
                          f"source={name}",
                          f"status={response.status_code}",
                          f"bytes={len(response.content)}",
                          f"redirected={response.url != url}",
                      )
                  except Exception:
                      print(
                          "YOUTUBE_PROBE",
                          f"source={name}",
                          "error_class=request",
                      )
          PY

          echo '=== Forced home content refresh ==='
          tools/platform_refresh_home_content.sh >/dev/null 2>/dev/null

          echo '=== Local API home content and live page shape ==='
          "$python_bin" - <<'PY'
          import json
          import re
          import urllib.request

          import httpx

          from apps.platform_api.app.services import home_content_runtime

          SAFE_ID = re.compile(r"^[A-Za-z0-9_-]{1,128}$")

          def safe_id(value):
              candidate = str(value or "")
              return candidate if SAFE_ID.fullmatch(candidate) else "unavailable"

          with urllib.request.urlopen(
              "http://127.0.0.1:8010/api/v1/content/home",
              timeout=10,
          ) as response:
              payload = json.load(response)
          videos = list(payload.get("videos") or [])
          latest = videos[0] if videos else {}
          print(
              "HOME_CONTENT_API",
              json.dumps(
                  {
                      "videos_available": payload.get("videos_available") is True,
                      "videos_count": len(videos),
                      "latest_video_id": safe_id(latest.get("id")),
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
          )

          headers = {
              "Accept-Language": "en-US,en;q=0.8",
              "Cookie": "SOCS=CAI",
              "User-Agent": "Mozilla/5.0 (compatible; OldSparkyArena/1.0)",
          }
          with httpx.Client(timeout=10, follow_redirects=True, headers=headers) as client:
              response = client.get("https://www.youtube.com/@deadlockOldSparky/videos")
              response.raise_for_status()
          page_text = response.text
          renderer_videos = home_content_runtime._video_renderer_videos(page_text)
          expected = renderer_videos[0] if renderer_videos else {}
          markers = {
              name: page_text.count(name)
              for name in (
                  '"videoRenderer"',
                  '"gridVideoRenderer"',
                  '"richItemRenderer"',
                  '"lockupViewModel"',
                  '"contentMetadataViewModel"',
                  '"videoId"',
              )
          }
          print("VIDEO_PAGE_MARKERS", json.dumps(markers, separators=(",", ":")))

          latest_id = str(latest.get("id") or "")
          snippet_index = page_text.find(f'"videoId":"{latest_id}"') if latest_id else -1
          if snippet_index < 0 and latest_id:
              snippet_index = page_text.find(f'\\"videoId\\":\\"{latest_id}\\"')
          if snippet_index >= 0:
              print("VIDEO_PAGE_SNIPPET present=true")
          else:
              print("VIDEO_PAGE_SNIPPET present=false")

          print(
              "YOUTUBE_STRUCTURED",
              json.dumps(
                  {
                      "videos_count": len(renderer_videos),
                      "latest_video_id": safe_id(expected.get("id")),
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              ),
          )

          if not renderer_videos:
              raise SystemExit("YouTube /videos exposed no parseable videoRenderer entries")
          if payload.get("videos_available") is not True:
              raise SystemExit("production home content is still serving stale YouTube cache")
          if not videos:
              raise SystemExit("production home content has no videos")
          if latest.get("id") != expected.get("id"):
              raise SystemExit("production latest video identifier mismatch")
          print(
              "CONTENT_ASSERT",
              f"latest_video_id={safe_id(latest.get('id'))}",
              "status=matched",
          )
          PY

          echo '=== Recent worker YouTube log summary ==='
          worker_raw_log_file="$(mktemp)"
          worker_log_file="$(mktemp)"
          cleanup_worker_logs() {
            rm -f -- "$worker_raw_log_file" "$worker_log_file"
          }
          trap cleanup_worker_logs EXIT
          worker_log_status=0
          journalctl -u deadlock-worker --since '-10 minutes' --no-pager \
            --output cat -n 80 2>/dev/null \
            >"$worker_raw_log_file" || worker_log_status=$?
          if (( worker_log_status != 0 )); then
              printf '%s\n' 'WORKER_JOURNAL_SUMMARY schema=1 status=unavailable error_class=producer'
          else
              grep -Ei 'youtube|home_content' "$worker_raw_log_file" \
                >"$worker_log_file" || true
              youtube_count="$(grep -Eic 'youtube' "$worker_log_file" || true)"
              home_content_count="$(grep -Eic 'home_content' "$worker_log_file" || true)"
              total_count="$(wc -l < "$worker_log_file" | tr -d ' ')"
              printf 'WORKER_JOURNAL_SUMMARY schema=1 status=ok total_line_count=%s youtube_line_count=%s home_content_line_count=%s\n' \
                "$total_count" "$youtube_count" "$home_content_count"
          fi
          MUTATION
          REMOTE
          remote_status=$?
          set -e
          if (( remote_status != 0 )); then
            rm -f -- "$remote_log" "$remote_error"
            printf '%s\n' 'PRODUCTION_CONTENT_DIAGNOSTICS schema=1 status=failed error_class=remote_or_transport'
            exit 1
          fi
          if ! grep -Eq '^CONTENT_ASSERT latest_video_id=(unavailable|[A-Za-z0-9_-]{1,128}) status=matched$' "$remote_log"; then
            rm -f -- "$remote_log" "$remote_error"
            printf '%s\n' 'PRODUCTION_CONTENT_DIAGNOSTICS schema=1 status=failed error_class=producer'
            exit 1
          fi
          printf '%s\n' 'PRODUCTION_CONTENT_DIAGNOSTICS schema=1 status=passed error_class=none'
          rm -f -- "$remote_log" "$remote_error"

      - name: Write sanitized aggregate diagnostic evidence
        if: ${{ always() }}
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch_distribution.outcome }}
          PATCH_SUMMARY: ${{ steps.patch_distribution.outputs.summary_line }}
          CONTENT_OUTCOME: ${{ steps.home_content.outcome }}
        run: |
          set -euo pipefail
          umask 077
          aggregate="$RUNNER_TEMP/platform-production-content-diagnostics-aggregate.json"
          /usr/bin/python3 - "$aggregate" "$TARGET_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PATCH_OUTCOME" "$PATCH_SUMMARY" "$CONTENT_OUTCOME" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          output, target_sha, event, run_id, run_attempt, patch_outcome, patch_summary, content_outcome = sys.argv[1:]
          safe_sha = target_sha if re.fullmatch(r"[0-9a-f]{40}", target_sha) else "unavailable"
          safe_event = event if event in {"workflow_dispatch", "workflow_run"} else "unavailable"
          safe_run_id = int(run_id) if re.fullmatch(r"[1-9][0-9]{0,31}", run_id) else 0
          safe_attempt = int(run_attempt) if re.fullmatch(r"[1-9][0-9]{0,31}", run_attempt) else 0
          allowed_outcomes = {"success", "failure", "cancelled", "skipped"}
          patch_status = patch_outcome if patch_outcome in allowed_outcomes else "unknown"
          content_status = content_outcome if content_outcome in allowed_outcomes else "unknown"
          patch_match = re.fullmatch(
              r"PRODUCTION_PATCH_DISTRIBUTION schema=1 status=passed error_class=none "
              r"latest_patch_id=([0-9]{1,32}) internal_section_count=([1-9][0-9]*) "
              r"internal_api_section_count=([1-9][0-9]*) public_api_section_count=([1-9][0-9]*)",
              patch_summary,
          )
          status = "passed" if patch_status == content_status == "success" and patch_match else "failed"
          payload = {
              "schema": 1,
              "kind": "platform_content_diagnostics",
              "status": status,
              "error_class": "none" if status == "passed" else "diagnostic_failed",
              "event": safe_event,
              "run_id": safe_run_id,
              "run_attempt": safe_attempt,
              "target_sha": safe_sha,
              "patch_distribution_status": patch_status,
              "content_status": content_status,
              "latest_patch_id": patch_match.group(1) if patch_match else "unavailable",
              "internal_section_count": int(patch_match.group(2)) if patch_match else 0,
              "internal_api_section_count": int(patch_match.group(3)) if patch_match else 0,
              "public_api_section_count": int(patch_match.group(4)) if patch_match else 0,
          }
          Path(output).write_text(
              json.dumps(payload, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          Path(output).chmod(0o600)
          PY

      - name: Upload sanitized aggregate diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-content-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-production-content-diagnostics-aggregate.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-content-diagnostics-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-content-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- \
            "$RUNNER_TEMP/platform-production-content-diagnostics-patch.log" \
            "$RUNNER_TEMP/platform-production-content-diagnostics-patch-error.log" \
            "$RUNNER_TEMP/platform-production-content-diagnostics.log" \
            "$RUNNER_TEMP/platform-production-content-diagnostics-error.log"
          test ! -e "$RUNNER_TEMP/platform-production-content-diagnostics-patch.log"
          test ! -e "$RUNNER_TEMP/platform-production-content-diagnostics-patch-error.log"
          test ! -e "$RUNNER_TEMP/platform-production-content-diagnostics.log"
          test ! -e "$RUNNER_TEMP/platform-production-content-diagnostics-error.log"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Mark content diagnostics successful
        if: ${{ success() && needs.validate-content-provenance.outputs.deploy_ready == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"platform-content-diagnostics\",\"description\":\"Production content diagnostics passed\",\"target_url\":\"${run_url}\"}"

      - name: Mark content diagnostics failed
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"platform-content-diagnostics\",\"description\":\"Production content diagnostics failed\",\"target_url\":\"${run_url}\"}"
