name: Platform production external load (trusted)

# T-owned reusable workflow.  The public dispatch entry pins this file to an
# immutable commit; this file is the only place where production permissions,
# actions and scripts are defined.  E contributes one profile JSON fetched by
# the Contents API at an exact SHA, never executable checkout content.
on:
  workflow_call:
    inputs:
      confirmation:
        description: "Type RUN-PRODUCTION-EXTERNAL-LOAD to create a temporary production fixture"
        required: true
        type: string
      control_email:
        description: "Existing account preserved by exact cleanup"
        required: true
        type: string
      profile_id:
        description: "Reviewed canonical load profile ID"
        required: true
        default: "ready-vote-slo-v2"
        type: string
      timeout_diagnostics:
        description: "Enable bounded per-timeout client/edge/Next/API evidence (diagnostic-only)"
        required: false
        default: false
        type: boolean
      target_sha:
        description: "Exact candidate source SHA whose profile data is reviewed"
        required: true
        type: string
      source_run_id:
        description: "Public dispatch run identity"
        required: true
        type: string
      source_run_attempt:
        description: "Public dispatch run attempt"
        required: true
        type: string

permissions:
  contents: read

env:
  # These are explicit caller inputs, not the reusable workflow's mutable
  # implementation context.  Every provenance handoff binds to these values.
  TARGET_SHA: ${{ inputs.target_sha }}
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}

concurrency:
  group: platform-production-external-load
  cancel-in-progress: false

jobs:
  # This gate intentionally has no environment, secrets or candidate input
  # authority.  A caller can invoke workflow_call directly, so the reusable
  # workflow verifies the immutable GitHub context and the API's run/workflow
  # records before any production environment job is even eligible.
  validate-caller-identity:
    name: Validate exact public dispatch caller
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      caller_identity_validated: ${{ steps.identity.outputs.caller_identity_validated }}
      caller_workflow_id: ${{ steps.identity.outputs.caller_workflow_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_REPOSITORY: StrayForest/old_sparky
      EXPECTED_WORKFLOW_PATH: .github/workflows/platform-production-external-load.yml
      EXPECTED_WORKFLOW_NAME: Platform production external load
      EXPECTED_DEFAULT_REF: refs/heads/dev
      CALLER_REPOSITORY: ${{ github.repository }}
      CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      CALLER_EVENT_NAME: ${{ github.event_name }}
      CALLER_REF: ${{ github.ref }}
      CALLER_HEAD_REF: ${{ github.head_ref }}
      CALLER_REF_PROTECTED: ${{ github.ref_protected }}
      CALLER_RUN_ID: ${{ github.run_id }}
      CALLER_RUN_ATTEMPT: ${{ github.run_attempt }}
      CALLER_SHA: ${{ github.sha }}
    steps:
      - name: Verify context and exact caller workflow through GitHub API
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CALLER_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$CALLER_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$CALLER_REF" == "$EXPECTED_DEFAULT_REF" ]]
          [[ -z "$CALLER_HEAD_REF" ]]
          [[ "$CALLER_REF_PROTECTED" == "true" ]]
          [[ "$CALLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CALLER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CALLER_WORKFLOW_REF" == "$EXPECTED_REPOSITORY/$EXPECTED_WORKFLOW_PATH@$EXPECTED_DEFAULT_REF" ]]
          run_metadata="$RUNNER_TEMP/external-caller-run.json"
          workflow_metadata="$RUNNER_TEMP/external-caller-workflow.json"
          workflow_commit_metadata="$RUNNER_TEMP/external-caller-workflow-commit.json"
          branch_metadata="$RUNNER_TEMP/external-caller-branch.json"
          repository_metadata="$RUNNER_TEMP/external-caller-repository.json"
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY/actions/runs/$CALLER_RUN_ID" \
            --output "$run_metadata"
          workflow_id="$(/usr/bin/python3 - "$run_metadata" "$CALLER_RUN_ID" "$CALLER_RUN_ATTEMPT" "$CALLER_SHA" "$EXPECTED_REPOSITORY" "$EXPECTED_WORKFLOW_PATH" "$EXPECTED_WORKFLOW_NAME" <<'PY'
          import json
          from pathlib import Path
          import sys

          path, run_id, attempt, caller_sha, repository, workflow_path, workflow_name = sys.argv[1:]
          def closed_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("caller run API response contains duplicate keys")
                  result[key] = value
              return result
          payload = json.loads(Path(path).read_text(encoding="utf-8"), object_pairs_hook=closed_object)
          if not isinstance(payload, dict):
              raise SystemExit("caller run API response is not an object")
          if payload.get("id") != int(run_id) or payload.get("run_attempt") != int(attempt):
              raise SystemExit("caller run identity does not match context")
          if payload.get("event") != "workflow_dispatch" or payload.get("path") != workflow_path or payload.get("name") != workflow_name:
              raise SystemExit("caller run is not the exact public workflow")
          if payload.get("head_branch") != "dev" or payload.get("head_sha") != caller_sha:
              raise SystemExit("caller run is not the protected dev source")
          for key in ("repository", "head_repository"):
              value = payload.get(key)
              if not isinstance(value, dict) or value.get("full_name") != repository:
                  raise SystemExit("caller run repository identity is not exact")
          workflow_id = payload.get("workflow_id")
          if isinstance(workflow_id, bool) or not isinstance(workflow_id, int) or not 1 <= workflow_id <= 2**63 - 1:
              raise SystemExit("caller workflow id is malformed")
          print(workflow_id)
          PY
          )"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY/actions/workflows/$workflow_id" \
            --output "$workflow_metadata"
          /usr/bin/python3 - "$workflow_metadata" "$EXPECTED_WORKFLOW_PATH" "$EXPECTED_WORKFLOW_NAME" <<'PY'
          import json
          from pathlib import Path
          import sys

          path, expected_path, expected_name = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or payload.get("path") != expected_path or payload.get("name") != expected_name or payload.get("state") != "active":
              raise SystemExit("caller workflow id/path/name is not the reviewed active workflow")
          PY
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY/commits/$CALLER_WORKFLOW_SHA" \
            --output "$workflow_commit_metadata"
          /usr/bin/python3 - "$workflow_commit_metadata" "$CALLER_WORKFLOW_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or payload.get("sha") != sys.argv[2]:
              raise SystemExit("caller workflow SHA is not an exact API commit")
          PY
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY/branches/dev" \
            --output "$branch_metadata"
          /usr/bin/python3 - "$branch_metadata" "$CALLER_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          commit = payload.get("commit") if isinstance(payload, dict) else None
          if (
              not isinstance(payload, dict)
              or payload.get("name") != "dev"
              or payload.get("protected") is not True
              or not isinstance(commit, dict)
              or commit.get("sha") != sys.argv[2]
          ):
              raise SystemExit("caller ref is not the protected dev commit")
          PY
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            "${api_headers[@]}" "$GITHUB_API_URL/repos/$EXPECTED_REPOSITORY" \
            --output "$repository_metadata"
          /usr/bin/python3 - "$repository_metadata" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or payload.get("default_branch") != "dev":
              raise SystemExit("repository default branch is not protected dev")
          PY
          printf 'caller_identity_validated=true\n' >> "$GITHUB_OUTPUT"
          printf 'caller_workflow_id=%s\n' "$workflow_id" >> "$GITHUB_OUTPUT"

  # Environment-scoped variables are intentionally resolved inside the
  # protected environment.  A reusable workflow's caller context is not an
  # authority for its implementation SHA.
  resolve-trusted-runner:
    name: Resolve immutable trusted runner identity
    needs: validate-caller-identity
    if: >-
      needs.validate-caller-identity.result == 'success' &&
      needs.validate-caller-identity.outputs.caller_identity_validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    outputs:
      trusted_runner_sha: ${{ steps.resolve.outputs.trusted_runner_sha }}
      trusted_runner_attested: ${{ steps.attest.outputs.trusted_runner_attested }}
    steps:
      - name: Validate environment-scoped trusted SHA
        id: resolve
        shell: bash
        env:
          TRUSTED_RUNNER_SHA: ${{ vars.PLATFORM_EXTERNAL_LOAD_TRUSTED_SHA }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "The protected production environment must provide an immutable trusted runner SHA." >&2
            exit 1
          }
          printf 'trusted_runner_sha=%s\n' "$TRUSTED_RUNNER_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout the attested trusted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.resolve.outputs.trusted_runner_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: ${{ runner.temp }}/trusted-runner-attestation

      - name: Attest trusted source and helper closure
        id: attest
        shell: bash
        env:
          TRUSTED_RUNNER_SHA: ${{ steps.resolve.outputs.trusted_runner_sha }}
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/trusted-runner-attestation"
          test "$(git -C "$trusted_root" rev-parse HEAD)" = "$TRUSTED_RUNNER_SHA"
          default_sha="$(git -C "$trusted_root" ls-remote --exit-code origin refs/heads/dev | awk 'NR == 1 {print $1}')"
          test "$default_sha" = "$TRUSTED_RUNNER_SHA" \
            || { echo "trusted runner is not the protected dev/default commit" >&2; exit 1; }
          # The trusted workflow may execute only this reviewed closure.  All
          # paths are checked as regular non-symlink files from the attested
          # T commit before any later job receives the SHA.
          while IFS= read -r path; do
            test -n "$path"
            test -f "$trusted_root/$path" && test ! -L "$trusted_root/$path"
            git -C "$trusted_root" ls-files --error-unmatch -- "$path" >/dev/null
          done <<'EOF'
          .github/workflows/platform-production-external-load-trusted.yml
          platform/tools/platform_external_load_provenance.py
          platform/tools/platform_workflow_input_guard.py
          platform/tools/platform_load.py
          platform/tools/platform_external_load.py
          platform/tools/platform_load_acceptance.py
          platform/tools/platform_http_transport.py
          platform/tools/platform_evidence_sanitizer.py
          platform/tools/platform_timeout_diagnostics.py
          EOF
          printf 'trusted_runner_attested=true\n' >> "$GITHUB_OUTPUT"

  # Candidate validation and profile code run without the production
  # environment.  The only value crossing to later jobs is the closed
  # mode-600 JSON handoff; the approved jobs validate it again inline.  The
  # candidate repository is never checked out or executed here.
  validate-external-inputs:
    name: Validate external-load dispatch
    needs:
      - validate-caller-identity
      - resolve-trusted-runner
    if: >-
      always() &&
      needs.validate-caller-identity.result == 'success' &&
      needs.validate-caller-identity.outputs.caller_identity_validated == 'true' &&
      needs.resolve-trusted-runner.result == 'success' &&
      needs.resolve-trusted-runner.outputs.trusted_runner_sha != '' &&
      needs.resolve-trusted-runner.outputs.trusted_runner_attested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      input_artifact_id: ${{ steps.publish-input.outputs.artifact-id }}
      input_artifact_digest: ${{ steps.publish-input.outputs.artifact-digest }}
      profile_timeout_minutes: ${{ steps.profile-contract.outputs.execution_budget_minutes }}
    env:
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      CONTROL_EMAIL: ${{ inputs.control_email }}
      PROFILE_ID: ${{ inputs.profile_id }}
      TIMEOUT_DIAGNOSTICS: ${{ inputs.timeout_diagnostics }}
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      TRUSTED_RUNNER_SHA: ${{ needs.resolve-trusted-runner.outputs.trusted_runner_sha }}
    steps:
      - name: Reject invalid external-load dispatch before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "External load requires an exact target SHA." >&2; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,31}$ && "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "External load source run identity is malformed." >&2; exit 1; }
          [[ "$TRUSTED_RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "External load requires the protected trusted runner SHA." >&2; exit 1; }
          case "$PROFILE_ID" in
            authenticated-page-load-v1|authenticated-page-load-v2|read-mix-concurrency-ramp-v1|read-mix-human-v2|read-mix-stress-v2|ready-vote-capacity-ramp-v2|ready-vote-saturation-ramp-v4|ready-vote-slo-v2|ready-vote-spike-v1|ready-vote-stress-15k-v2|ready-vote-stress-20k-v2) ;;
            *) echo "External load profile is not on the reviewed dispatch allowlist." >&2; exit 1 ;;
          esac
          case "$TIMEOUT_DIAGNOSTICS:$PROFILE_ID:$QA_CONFIRMATION" in
            true:authenticated-page-load-v1:RUN-PRODUCTION-TIMEOUT-DIAGNOSTICS|false:*:RUN-PRODUCTION-EXTERNAL-LOAD) ;;
            *) echo "External load confirmation/profile combination is invalid." >&2; exit 1 ;;
          esac

      - name: Checkout the pinned trusted load runner
        if: ${{ needs.resolve-trusted-runner.result == 'success' && needs.resolve-trusted-runner.outputs.trusted_runner_sha != '' && needs.resolve-trusted-runner.outputs.trusted_runner_attested == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TRUSTED_RUNNER_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: ${{ runner.temp }}/trusted-external-load-runner

      - name: Validate candidate profile data with trusted runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/trusted-external-load-runner"
          candidate_profile="$RUNNER_TEMP/candidate-profile-data.json"
          trusted_profile="$trusted_root/platform/performance/profiles/$PROFILE_ID.json"
          [[ "$PROFILE_ID" =~ ^[a-z0-9](?:[a-z0-9-]{0,94}[a-z0-9])?$ ]]
          profile_api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/platform/performance/profiles/$PROFILE_ID.json?ref=$TARGET_SHA"
          # Contents API: only this bounded JSON profile document crosses E/T.
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$profile_api" --output "$RUNNER_TEMP/candidate-profile-envelope.json"
          /usr/bin/python3 - "$RUNNER_TEMP/candidate-profile-envelope.json" "$candidate_profile" "$PROFILE_ID" <<'PY'
          import base64
          import binascii
          import json
          from pathlib import Path
          import re
          import sys

          envelope_path, destination, profile_id = sys.argv[1:]
          def closed_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("candidate profile Contents response has duplicate keys")
                  result[key] = value
              return result

          envelope = json.loads(Path(envelope_path).read_text(encoding="utf-8"), object_pairs_hook=closed_object)
          expected_name = f"{profile_id}.json"
          required = {"content", "encoding", "name", "path", "sha", "size", "type"}
          optional = {"_links", "git_url", "html_url", "download_url", "url"}
          if not isinstance(envelope, dict) or not required.issubset(envelope) or set(envelope) - required - optional:
              raise SystemExit("candidate profile Contents response contains an unallowlisted field")
          if not isinstance(envelope["size"], int) or isinstance(envelope["size"], bool) or not 1 <= envelope["size"] <= 1_048_576:
              raise SystemExit("candidate profile Contents size is invalid")
          if not isinstance(envelope["sha"], str) or re.fullmatch(r"[0-9a-f]{40}", envelope["sha"]) is None:
              raise SystemExit("candidate profile Contents SHA is invalid")
          for key in optional:
              value = envelope.get(key)
              if key == "_links":
                  if value is not None and (not isinstance(value, dict) or any(not isinstance(item, str) for item in value.values())):
                      raise SystemExit("candidate profile Contents links are invalid")
              elif value is not None and (not isinstance(value, str) or len(value) > 2048):
                  raise SystemExit("candidate profile Contents URL metadata is invalid")
          if envelope["type"] != "file" or envelope["name"] != expected_name or envelope["path"] != f"platform/performance/profiles/{expected_name}":
              raise SystemExit("candidate profile Contents path is not exact")
          content = envelope["content"]
          if envelope["encoding"] != "base64" or not isinstance(content, str) or len(content) > 1_400_000:
              raise SystemExit("candidate profile Contents encoding is invalid")
          try:
              decoded = base64.b64decode("".join(content.split()), validate=True)
          except (binascii.Error, ValueError) as exc:
              raise SystemExit("candidate profile Contents bytes are invalid") from exc
          if not 1 <= len(decoded) <= 1_048_576 or b"\x00" in decoded:
              raise SystemExit("candidate profile is outside the bounded size")
          if envelope["size"] != len(decoded):
              raise SystemExit("candidate profile Contents size does not match decoded content")
          Path(destination).write_bytes(decoded)
          Path(destination).chmod(0o600)
          PY
          test -f "$candidate_profile" && test ! -L "$candidate_profile"
          test -f "$trusted_profile" && test ! -L "$trusted_profile"
          /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" profile \
            --candidate "$candidate_profile" \
            --trusted-profile "$trusted_profile" \
            --profile-id "$PROFILE_ID" \
            --source-sha "$TARGET_SHA" \
            --trusted-sha "$TRUSTED_RUNNER_SHA" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/platform-production-external-load-profile-contract.json"
          profile_env="$RUNNER_TEMP/profile.env"
          /usr/bin/python3 - "$RUNNER_TEMP/platform-production-external-load-profile-contract.json" > "$profile_env" <<'PY'
          import json
          from pathlib import Path
          import sys
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          fixture = payload["fixture"]
          execution_budget_minutes = payload["execution_budget_minutes"]
          print(f"EXECUTION_BUDGET_MINUTES={execution_budget_minutes}")
          for key in ("setup_concurrency", "tournament_count", "users_per_tournament"):
              print(f"{key.upper()}={fixture[key]}")
          PY
          while IFS='=' read -r key value; do export "$key=$value"; done < "$profile_env"
          /usr/bin/python3 "$trusted_root/platform/tools/platform_workflow_input_guard.py" email --value "$CONTROL_EMAIL"
          /usr/bin/python3 "$trusted_root/platform/tools/platform_workflow_input_guard.py" external \
            --output "$RUNNER_TEMP/platform-production-external-load-input.json" \
            --confirmation "$QA_CONFIRMATION" \
            --target-sha "$TARGET_SHA" \
            --control-email "$CONTROL_EMAIL" \
            --setup-concurrency "$SETUP_CONCURRENCY" \
            --run-id "$SOURCE_RUN_ID" \
            --profile external-vote \
            --tournament-count "$TOURNAMENT_COUNT" \
            --users-per-tournament "$USERS_PER_TOURNAMENT" \
            --timeout-diagnostics "$TIMEOUT_DIAGNOSTICS"
          test "$(stat -c '%a' "$RUNNER_TEMP/platform-production-external-load-input.json")" = 600

      - name: Publish closed external-load handoff
        id: publish-input
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-input-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: |
            ${{ runner.temp }}/platform-production-external-load-input.json
            ${{ runner.temp }}/platform-production-external-load-profile-contract.json
          if-no-files-found: error
          retention-days: 1

      - name: Export trusted profile timeout budget
        id: profile-contract
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          contract="$RUNNER_TEMP/platform-production-external-load-profile-contract.json"
          budget="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["execution_budget_minutes"])' "$contract")"
          [[ "$budget" =~ ^[1-9][0-9]*$ ]] && (( budget >= 15 && budget <= 60 ))
          printf 'execution_budget_minutes=%s\n' "$budget" >> "$GITHUB_OUTPUT"

      - name: Remove external-load validator handoff
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/platform-production-external-load-input.json" "$RUNNER_TEMP/profile.env"

  # This job owns SSH only for trusted fixture setup.  It does not checkout or
  # execute candidate code.  The credential-bearing manifest stays local to
  # this runner and is consumed by the pinned trusted runner only after SSH
  # cleanup; only non-secret report/status/diagnostic data is published.
  fixture-setup:
    name: Prepare external fixture with ephemeral SSH
    needs:
      - validate-caller-identity
      - resolve-trusted-runner
      - validate-external-inputs
    if: needs.validate-caller-identity.result == 'success' && needs.validate-caller-identity.outputs.caller_identity_validated == 'true' && needs.validate-external-inputs.result == 'success' && needs.resolve-trusted-runner.result == 'success' && needs.resolve-trusted-runner.outputs.trusted_runner_sha != '' && needs.resolve-trusted-runner.outputs.trusted_runner_attested == 'true'
    runs-on: ubuntu-latest
    # Fixture setup can spend up to 30 minutes waiting for the remote
    # supervisor and then run the profile's bounded 15-minute workload in the
    # same trusted job.  The old setup-only budget could kill a valid load
    # before its cleanup path began.
    timeout-minutes: ${{ fromJSON(needs.validate-external-inputs.outputs.profile_timeout_minutes) }}
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      setup_status: ${{ steps.fixture-setup.outputs.setup_status }}
      manifest_ready: ${{ steps.fixture-setup.outputs.manifest_ready }}
      manifest_validation_status: ${{ steps.validate-manifest.outputs.manifest_validation_status }}
      load_artifact_id: ${{ steps.publish-load-data.outputs.artifact-id }}
      load_artifact_digest: ${{ steps.publish-load-data.outputs.artifact-digest }}
      load_status: ${{ steps.external-evaluate.outputs.load_status }}
      report_ready: ${{ steps.external-evaluate.outputs.report_ready }}
      credential_cleanup_status: ${{ steps.external-evaluate.outputs.credential_cleanup_status }}
      ssh_cleanup_status: ${{ steps.cleanup_ssh.outputs.ssh_cleanup_status }}
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      TRUSTED_RUNNER_SHA: ${{ needs.resolve-trusted-runner.outputs.trusted_runner_sha }}
      PROFILE_ID: ${{ inputs.profile_id }}
      TIMEOUT_DIAGNOSTICS: ${{ inputs.timeout_diagnostics }}
      INPUT_ARTIFACT_ID: ${{ needs.validate-external-inputs.outputs.input_artifact_id }}
      INPUT_ARTIFACT_DIGEST: ${{ needs.validate-external-inputs.outputs.input_artifact_digest }}
    steps:
      - name: Download closed external-load handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-input-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/external-input

      - name: Checkout the pinned trusted load runner
        if: ${{ needs.resolve-trusted-runner.result == 'success' && needs.resolve-trusted-runner.outputs.trusted_runner_sha != '' && needs.resolve-trusted-runner.outputs.trusted_runner_attested == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TRUSTED_RUNNER_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: ${{ runner.temp }}/trusted-external-load-runner

      - name: Verify exact external-load handoff artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$INPUT_ARTIFACT_ID" && test -n "$INPUT_ARTIFACT_DIGEST"
          [[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          artifact_digest="${INPUT_ARTIFACT_DIGEST#sha256:}"
          [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]
          metadata="$RUNNER_TEMP/external-input-artifact-metadata.json"
          archive="$RUNNER_TEMP/external-input-artifact.zip"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID" \
            --output "$metadata"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --location --max-filesize 67108864 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT_ID/zip" \
            --output "$archive"
          run_metadata="$RUNNER_TEMP/external-input-run-metadata.json"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --output "$run_metadata"
          /usr/bin/python3 - "$metadata" "$run_metadata" "$TARGET_SHA" "$SOURCE_RUN_ID" "$GITHUB_REPOSITORY" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          metadata_path, run_path, target_sha, run_id, repository = sys.argv[1:]
          run = json.loads(Path(run_path).read_text(encoding="utf-8"))
          if not isinstance(run, dict) or run.get("id") != int(run_id) or run.get("head_sha") != target_sha:
              raise SystemExit("artifact workflow run identity is not exact")
          head_repository = run.get("head_repository")
          if not isinstance(head_repository, dict) or head_repository.get("full_name") != repository or run.get("path") != ".github/workflows/platform-production-external-load.yml":
              raise SystemExit("artifact workflow repository/path is not exact")
          PY
          /usr/bin/python3 "$RUNNER_TEMP/trusted-external-load-runner/platform/tools/platform_external_load_provenance.py" artifact \
            --metadata "$metadata" --archive "$archive" \
            --artifact-id "$INPUT_ARTIFACT_ID" \
            --artifact-name "platform-production-external-load-input-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" \
            --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --target-sha "$TARGET_SHA" --digest "$artifact_digest" \
            --repository "$GITHUB_REPOSITORY" \
            --run-metadata "$run_metadata" \
            --workflow-file ".github/workflows/platform-production-external-load.yml"

      - name: Revalidate external handoff and exact target SHA
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" && test ! -L "$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          /usr/bin/python3 - "$RUNNER_TEMP/external-input/platform-production-external-load-input.json" "$TARGET_SHA" "$RUN_ID" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, target_sha, run_id = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          expected = {"schema", "confirmation", "target_sha", "control_email", "setup_concurrency", "run_id", "profile", "tournament_count", "users_per_tournament", "timeout_diagnostics"}
          if set(payload) != expected:
              raise SystemExit("external handoff schema is not closed")
          if payload.get("schema") not in (1, "1") or payload.get("target_sha") != target_sha or payload.get("run_id") != run_id:
              raise SystemExit("external handoff exact target SHA or run identity mismatch")
          if payload.get("profile") != "external-vote" or payload.get("timeout_diagnostics") not in {"true", "false"}:
              raise SystemExit("external handoff profile is invalid")
          if re.fullmatch(r"[0-9a-f]{40}", target_sha) is None or re.fullmatch(r"[1-9][0-9]{0,31}", run_id) is None:
              raise SystemExit("external handoff exact target SHA is malformed")
          for key, maximum in (("setup_concurrency", 256), ("tournament_count", 40), ("users_per_tournament", 500)):
              value = payload.get(key)
              if not isinstance(value, str) or re.fullmatch(r"[1-9][0-9]*", value) is None or int(value) > maximum:
                  raise SystemExit(f"external handoff {key} is malformed")
          if int(payload["users_per_tournament"]) < 14:
              raise SystemExit("external handoff users-per-tournament is below the floor")
          print("external handoff accepted for exact target SHA")
          PY

      - name: Revalidate the trusted profile contract
        shell: bash
        run: |
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/trusted-external-load-runner"
          /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" profile-contract \
            --path "$RUNNER_TEMP/external-input/platform-production-external-load-profile-contract.json" \
            --profile-id "$PROFILE_ID" \
            --source-sha "$TARGET_SHA" \
            --trusted-sha "$TRUSTED_RUNNER_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --trusted-profile "$trusted_root/platform/performance/profiles/$PROFILE_ID.json"

      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/production-external-load-ssh-setup"
          control_path="/tmp/old-sparky-external-load-ssh-setup-$SOURCE_RUN_ID"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" 2>/dev/null | /usr/bin/head -c 65536 >"$ssh_scan_attempt" \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
            printf '%s\n' '  ControlMaster auto'
            printf '%s\n' '  ControlPersist 15m'
            printf '  ControlPath %s\n' "$control_path"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Prepare external fixture with ephemeral SSH
        id: fixture-setup
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -u
          set -o pipefail
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          artifact_dir="$RUNNER_TEMP/external-fixture"
          export_dir="/tmp/old-sparky-production-retained-load-$SOURCE_RUN_ID"
          manifest_path="$artifact_dir/manifest.json"
          mkdir -p "$artifact_dir"; chmod 700 "$artifact_dir"
          manifest_ready=0; setup_status=1
          set +e
          ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" /usr/bin/python3.12 -I -B /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py external-fixture < "$input_path" >/dev/null 2>&1
          launch_status="$?"
          if [[ "$launch_status" == 0 ]]; then
            remote_size() {
              local remote_path="$1" remote_size
              remote_size="$(timeout --foreground 15s ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$SSH_DIR/id_ed25519" \
                "$PROD_SSH_USER@$PROD_SSH_HOST" "stat -c '%s' -- '$remote_path'" 2>/dev/null | /usr/bin/head -c 32)" || return 1
              [[ "$remote_size" =~ ^[0-9]+$ ]] || return 1
              printf '%s\n' "$remote_size"
            }
            for _ in $(seq 1 900); do
              ready_size="$(remote_size "$export_dir/ready")"
              manifest_size="$(remote_size "$export_dir/manifest.json")"
              if [[ "$ready_size" =~ ^[0-9]+$ ]] && (( ready_size <= 4096 )) \
                && [[ "$manifest_size" =~ ^[0-9]+$ ]] && (( manifest_size <= 67108864 )) \
                && scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/ready" "$artifact_dir/ready" >/dev/null 2>&1 \
                && scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/manifest.json" "$manifest_path" >/dev/null 2>&1 \
                && [[ -f "$artifact_dir/ready" && ! -L "$artifact_dir/ready" ]] \
                && [[ "$(stat -c '%s' "$artifact_dir/ready" 2>/dev/null || echo 999999)" == "$ready_size" ]] \
                && [[ -f "$manifest_path" && ! -L "$manifest_path" ]] \
                && [[ "$(stat -c '%s' "$manifest_path" 2>/dev/null || echo 999999999)" == "$manifest_size" ]] \
                && chmod 600 "$manifest_path" \
                && [[ "$(stat -c '%a' "$manifest_path" 2>/dev/null || echo 0)" == 600 ]] \
                && [[ "$(stat -c '%u' "$manifest_path" 2>/dev/null || echo -1)" == "$(id -u)" ]]; then
                manifest_ready=1; setup_status=0; break
              fi
              sleep 2
            done
          fi
          echo "manifest_ready=$manifest_ready" >> "$GITHUB_OUTPUT"
          echo "setup_status=$setup_status" >> "$GITHUB_OUTPUT"
          exit "$setup_status"

      - name: Validate closed fixture manifest
        id: validate-manifest
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          manifest_status=1
          if [[ "${{ steps.fixture-setup.outputs.manifest_ready }}" == 1 ]] \
            && [[ -f "$RUNNER_TEMP/external-fixture/manifest.json" ]] \
            && [[ ! -L "$RUNNER_TEMP/external-fixture/manifest.json" ]] \
            && [[ "$(stat -c '%a' "$RUNNER_TEMP/external-fixture/manifest.json" 2>/dev/null || echo 0)" == 600 ]] \
            && [[ "$(stat -c '%u' "$RUNNER_TEMP/external-fixture/manifest.json" 2>/dev/null || echo -1)" == "$(id -u)" ]] \
            && [[ "$(stat -c '%s' "$RUNNER_TEMP/external-fixture/manifest.json" 2>/dev/null || echo 999999999)" -le 67108864 ]]; then
            /usr/bin/python3 - "$RUNNER_TEMP/external-fixture/manifest.json" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("fixture manifest contains duplicate keys")
                  result[key] = value
              return result

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"), object_pairs_hook=reject_duplicate_keys)
          keys = {"schema", "purpose", "origin", "session_cookie_name", "csrf_cookie_name", "marker", "created_at", "tournaments", "users"}
          if set(manifest) != keys or manifest.get("schema") != 1 or manifest.get("purpose") != "external_ready_vote" or manifest.get("origin") != "https://old-sparky.com":
              raise SystemExit("fixture manifest schema is not closed")
          if not isinstance(manifest.get("created_at"), str) or re.fullmatch(r"preprod[0-9]{12}[0-9a-f]{4}", str(manifest.get("marker"))) is None:
              raise SystemExit("fixture manifest marker is invalid")
          tournaments = manifest.get("tournaments")
          users = manifest.get("users")
          if not isinstance(tournaments, list) or not isinstance(users, list) or not tournaments or len(tournaments) > 40 or len(users) > 20000:
              raise SystemExit("fixture manifest population is invalid")
          for row in tournaments:
              if set(row) != {"id", "slug", "user_count"} or not re.fullmatch(r"[A-Za-z0-9_-]{1,128}", str(row["id"])) or not re.fullmatch(r"[A-Za-z0-9_-]{1,128}", str(row["slug"])) or not isinstance(row["user_count"], int) or row["user_count"] < 14:
                  raise SystemExit("fixture tournament row is invalid")
          for row in users:
              if set(row) != {"user_id", "tournament_slug", "session_token", "csrf_token"}:
                  raise SystemExit("fixture user row schema is not closed")
              for field in ("user_id", "tournament_slug", "session_token", "csrf_token"):
                  if not isinstance(row[field], str) or re.fullmatch(r"[A-Za-z0-9._~+/=-]{1,1024}", row[field]) is None:
                      raise SystemExit("fixture user field is unsafe")
          PY
            manifest_status="$?"
          fi
          echo "manifest_validation_status=$manifest_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove fixture-setup SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        env:
          MANIFEST_VALIDATION_STATUS: ${{ steps.validate-manifest.outputs.manifest_validation_status }}
        run: |
          set -u
          ssh_dir="$RUNNER_TEMP/production-external-load-ssh-setup"
          control_path="/tmp/old-sparky-external-load-ssh-setup-$SOURCE_RUN_ID"
          handoff="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          manifest_path="$RUNNER_TEMP/external-fixture/manifest.json"
          ssh_cleanup_status=0

          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            if [[ -L "$ssh_dir" || ! -d "$ssh_dir" ]]; then
              ssh_cleanup_status=1
            else
              rm -f -- \
                "$ssh_dir/id_ed25519" \
                "$ssh_dir/known_hosts" \
                "$ssh_dir/known_hosts.scan" \
                "$ssh_dir/known_hosts.scan.1" \
                "$ssh_dir/known_hosts.scan.2" \
                "$ssh_dir/config" \
                "$ssh_dir/control.sock" \
                "$ssh_dir/control-master" \
                "$ssh_dir/control-master.sock" || ssh_cleanup_status=1
              for path in \
                "$ssh_dir/id_ed25519" \
                "$ssh_dir/known_hosts" \
                "$ssh_dir/known_hosts.scan" \
                "$ssh_dir/config" \
                "$ssh_dir/control.sock" \
                "$ssh_dir/control-master" \
                "$ssh_dir/control-master.sock"; do
                [[ ! -e "$path" && ! -L "$path" ]] || ssh_cleanup_status=1
              done
              test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519" || ssh_cleanup_status=1
              rmdir -- "$ssh_dir" || ssh_cleanup_status=1
            fi
          fi
          [[ ! -e "$ssh_dir" && ! -L "$ssh_dir" ]] || ssh_cleanup_status=1
          rm -f -- "$control_path" "$handoff" || ssh_cleanup_status=1
          [[ ! -e "$control_path" && ! -L "$control_path" ]] || ssh_cleanup_status=1
          [[ ! -e "$handoff" && ! -L "$handoff" ]] || ssh_cleanup_status=1
          # The manifest is the only credential-bearing input needed by the
          # trusted load.  It must survive SSH cleanup and remain mode 0600
          # until the load step's terminal cleanup trap consumes it.  If
          # validation did not succeed, remove any partial manifest now and
          # attest that no secret-bearing file remains.
          if [[ "${MANIFEST_VALIDATION_STATUS:-1}" == 0 ]]; then
            [[ -f "$manifest_path" && ! -L "$manifest_path" ]] || ssh_cleanup_status=1
            [[ "$(stat -c '%a' "$manifest_path" 2>/dev/null || echo 0)" == 600 ]] || ssh_cleanup_status=1
            [[ "$(stat -c '%u' "$manifest_path" 2>/dev/null || echo -1)" == "$(id -u)" ]] || ssh_cleanup_status=1
          else
            rm -f -- "$manifest_path" || ssh_cleanup_status=1
            [[ ! -e "$manifest_path" && ! -L "$manifest_path" ]] || ssh_cleanup_status=1
          fi
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV" || ssh_cleanup_status=1
          unset SSH_DIR
          [[ -z "${SSH_DIR:-}" ]] || ssh_cleanup_status=1
          echo "ssh_cleanup_status=$ssh_cleanup_status" >> "$GITHUB_OUTPUT" || exit 1
          exit 0

      - name: Run trusted external load after SSH cleanup
        id: external-evaluate
        if: ${{ always() }}
        shell: bash
        env:
          CLEANUP_SSH_STATUS: ${{ steps.cleanup_ssh.outputs.ssh_cleanup_status }}
          MANIFEST_VALIDATION_STATUS: ${{ steps.validate-manifest.outputs.manifest_validation_status }}
        run: |
          set -u
          trusted_root="$RUNNER_TEMP/trusted-external-load-runner"
          artifact_dir="$RUNNER_TEMP/external-client"
          manifest_path="$RUNNER_TEMP/external-fixture/manifest.json"
          raw_report="$artifact_dir/external-load.raw.json"
          report_path="$artifact_dir/external-load.json"
          log_path="$artifact_dir/trusted-runner.log"
          status_path="$artifact_dir/load-status.json"
          diagnostic_path="$artifact_dir/timeout-diagnostic-ids.json"
          mkdir -p "$artifact_dir"; chmod 700 "$artifact_dir"
          load_status=1; report_ready=0
          credential_cleanup_status=1
          load_pid=""
          cleanup_done=0
          cleanup_local() {
            [[ "$cleanup_done" == 1 ]] && return 0
            cleanup_done=1
            local cleanup_status=0
            if [[ -n "${load_pid:-}" ]] && kill -0 "$load_pid" 2>/dev/null; then
              kill -TERM -- "-$load_pid" 2>/dev/null || kill -TERM "$load_pid" 2>/dev/null || cleanup_status=1
              timeout --foreground 10s tail --pid="$load_pid" -f /dev/null 2>/dev/null || {
                kill -KILL -- "-$load_pid" 2>/dev/null || kill -KILL "$load_pid" 2>/dev/null || true
                cleanup_status=1
              }
            fi
            rm -f -- "$raw_report" "$log_path" "$manifest_path" || cleanup_status=1
            for path in "$raw_report" "$log_path" "$manifest_path"; do
              [[ ! -e "$path" && ! -L "$path" ]] || cleanup_status=1
            done
            credential_cleanup_status="$cleanup_status"
            if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
              printf 'credential_cleanup_status=%s\n' "$credential_cleanup_status" >> "$GITHUB_OUTPUT" || true
            fi
            return 0
          }
          trap 'cleanup_local' EXIT
          trap 'exit 143' INT TERM HUP
          if [[ "${CLEANUP_SSH_STATUS:-1}" == 0 \
            && "${MANIFEST_VALIDATION_STATUS:-1}" == 0 \
            && -f "$manifest_path" && ! -L "$manifest_path" ]]; then
            load_args=(/usr/bin/python3 tools/platform_load.py run --profile "$PROFILE_ID" --manifest "$manifest_path" --report-path "$raw_report")
            if [[ "$TIMEOUT_DIAGNOSTICS" == true ]]; then
              load_args+=(--timeout-diagnostics-run-id "$RUN_ID")
            fi
            set +e
            (
              cd "$trusted_root/platform"
              env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                SOURCE_GIT_SHA="$TARGET_SHA" GITHUB_RUN_ID="$RUN_ID" GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" \
                TRUSTED_RUNNER_SHA="$TRUSTED_RUNNER_SHA" \
                "${load_args[@]}"
            ) >"$log_path" 2>&1 &
            load_pid="$!"
            wait "$load_pid"
            load_status="$?"
            load_pid=""
            set -e
            if [[ "$load_status" == 0 && -s "$raw_report" && ! -L "$raw_report" ]]; then
              if /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" attach-report \
                --input "$raw_report" --output "$report_path" \
                --target-sha "$TARGET_SHA" --run-id "$RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" \
                --trusted-sha "$TRUSTED_RUNNER_SHA" --profile-id "$PROFILE_ID" \
                --profile-version "$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_version"])' "$RUNNER_TEMP/external-input/platform-production-external-load-profile-contract.json")" \
                --profile-digest "$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_digest"])' "$RUNNER_TEMP/external-input/platform-production-external-load-profile-contract.json")"; then
                report_ready=1
              else
                load_status=1
              fi
            fi
          fi
          if [[ "$report_ready" == 1 ]]; then
            /usr/bin/python3 - "$report_path" "$diagnostic_path" "$TARGET_SHA" "$RUN_ID" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          summary = report.get("overall") or report.get("raw_http") or {}
          rows = summary.get("timeout_diagnostics") if isinstance(summary, dict) else []
          ids = sorted({row.get("diagnostic_id") for row in rows or [] if isinstance(row, dict) and isinstance(row.get("diagnostic_id"), str) and re.fullmatch(r"[A-Za-z0-9._:-]{1,128}", row["diagnostic_id"])})
          Path(sys.argv[2]).write_text(json.dumps({"schema": 1, "target_sha": sys.argv[3], "run_id": sys.argv[4], "ids": ids}, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          else
            printf '%s\n' "{\"schema\":1,\"target_sha\":\"$TARGET_SHA\",\"run_id\":\"$RUN_ID\",\"ids\":[]}" > "$diagnostic_path"
          fi
          profile_version="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_version"])' "$RUNNER_TEMP/external-input/platform-production-external-load-profile-contract.json")"
          profile_digest="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_digest"])' "$RUNNER_TEMP/external-input/platform-production-external-load-profile-contract.json")"
          cleanup_local
          if [[ "$credential_cleanup_status" != 0 ]]; then
            load_status=1
            report_ready=0
          fi
          /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" emit-status \
            --output "$status_path" --status "$load_status" --report-ready "$report_ready" \
            --target-sha "$TARGET_SHA" --run-id "$RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --trusted-sha "$TRUSTED_RUNNER_SHA" --profile-id "$PROFILE_ID" \
            --profile-version "$profile_version" --profile-digest "$profile_digest"
          if ! chmod 600 "$status_path" "$diagnostic_path"; then
            load_status=1
            report_ready=0
          fi
          if [[ "$report_ready" == 1 ]] && ! chmod 600 "$report_path"; then
            load_status=1
            report_ready=0
          fi
          echo "load_status=$load_status" >> "$GITHUB_OUTPUT"
          echo "report_ready=$report_ready" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish trusted load data
        id: publish-load-data
        if: >-
          always() &&
          steps.external-evaluate.outcome == 'success' &&
          steps.external-evaluate.outputs.load_status != '' &&
          steps.cleanup_ssh.outcome == 'success' &&
          steps.cleanup_ssh.outputs.ssh_cleanup_status == '0' &&
          steps.validate-manifest.outputs.manifest_validation_status == '0' &&
          steps.external-evaluate.outputs.credential_cleanup_status == '0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-client-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: |
            ${{ runner.temp }}/external-client/external-load.json
            ${{ runner.temp }}/external-client/load-status.json
            ${{ runner.temp }}/external-client/timeout-diagnostic-ids.json
          if-no-files-found: error
          retention-days: 1

  # This job verifies the non-secret report/status artifact.  It never
  # receives a fixture manifest and never checks out or executes E.
  load-client:
    name: Verify trusted external load data
    needs:
      - validate-caller-identity
      - resolve-trusted-runner
      - validate-external-inputs
      - fixture-setup
    if: >-
      needs.validate-caller-identity.result == 'success' &&
      needs.validate-caller-identity.outputs.caller_identity_validated == 'true' &&
      needs.validate-external-inputs.result == 'success' &&
      needs.fixture-setup.result == 'success' &&
      needs.fixture-setup.outputs.setup_status == '0' &&
      needs.fixture-setup.outputs.manifest_ready == '1' &&
      needs.fixture-setup.outputs.manifest_validation_status == '0' &&
      needs.fixture-setup.outputs.credential_cleanup_status == '0' &&
      needs.fixture-setup.outputs.ssh_cleanup_status == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      load_status: ${{ steps.verify-trusted-load.outputs.load_status }}
      report_ready: ${{ steps.verify-trusted-load.outputs.report_ready }}
      candidate_artifact_id: ${{ needs.fixture-setup.outputs.load_artifact_id }}
      candidate_artifact_digest: ${{ needs.fixture-setup.outputs.load_artifact_digest }}
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      TRUSTED_RUNNER_SHA: ${{ needs.resolve-trusted-runner.outputs.trusted_runner_sha }}
      PROFILE_ID: ${{ inputs.profile_id }}
      PROFILE_CONTRACT_PATH: ${{ runner.temp }}/external-input/platform-production-external-load-profile-contract.json
    steps:
      - name: Download trusted external-load data
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-client-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/external-client

      - name: Download the exact profile contract
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-input-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/external-input

      - name: Checkout the pinned trusted load runner
        if: ${{ needs.resolve-trusted-runner.result == 'success' && needs.resolve-trusted-runner.outputs.trusted_runner_sha != '' && needs.resolve-trusted-runner.outputs.trusted_runner_attested == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TRUSTED_RUNNER_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: ${{ runner.temp }}/trusted-external-load-runner

      - name: Verify exact load handoff artifacts
        id: verify-load-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/load-artifact-metadata.json"
          archive="$RUNNER_TEMP/load-artifact.zip"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.fixture-setup.outputs.load_artifact_id }}" --output "$metadata"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --location --max-filesize 67108864 \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.fixture-setup.outputs.load_artifact_id }}/zip" --output "$archive"
          run_metadata="$RUNNER_TEMP/load-run-metadata.json"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --output "$run_metadata"
          /usr/bin/python3 - "$metadata" "$run_metadata" "$TARGET_SHA" "$SOURCE_RUN_ID" "$GITHUB_REPOSITORY" <<'PY'
          import json
          from pathlib import Path
          import sys

          metadata_path, run_path, target_sha, run_id, repository = sys.argv[1:]
          run = json.loads(Path(run_path).read_text(encoding="utf-8"))
          if not isinstance(run, dict) or run.get("id") != int(run_id) or run.get("head_sha") != target_sha:
              raise SystemExit("artifact workflow run identity is not exact")
          head_repository = run.get("head_repository")
          if not isinstance(head_repository, dict) or head_repository.get("full_name") != repository or run.get("path") != ".github/workflows/platform-production-external-load.yml":
              raise SystemExit("artifact workflow repository/path is not exact")
          PY
          /usr/bin/python3 "$RUNNER_TEMP/trusted-external-load-runner/platform/tools/platform_external_load_provenance.py" artifact \
            --metadata "$metadata" --archive "$archive" \
            --artifact-id "${{ needs.fixture-setup.outputs.load_artifact_id }}" \
            --artifact-name "platform-production-external-load-client-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" \
            --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --target-sha "$TARGET_SHA" --digest "${{ needs.fixture-setup.outputs.load_artifact_digest }}" \
            --repository "$GITHUB_REPOSITORY" \
            --run-metadata "$run_metadata" \
            --workflow-file ".github/workflows/platform-production-external-load.yml"

      - name: Validate trusted load status and report binding
        id: verify-trusted-load
        shell: bash
        run: |
          set -u
          trusted_root="$RUNNER_TEMP/trusted-external-load-runner"
          contract="$RUNNER_TEMP/external-input/platform-production-external-load-profile-contract.json"
          /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" profile-contract \
            --path "$contract" --profile-id "$PROFILE_ID" --source-sha "$TARGET_SHA" \
            --trusted-sha "$TRUSTED_RUNNER_SHA" --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --trusted-profile "$trusted_root/platform/performance/profiles/$PROFILE_ID.json" >/dev/null || exit 1
          profile_version="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_version"])' "$contract")"
          profile_digest="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_digest"])' "$contract")"
          status=1; report_ready=0
          /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" load-status \
            --path "$RUNNER_TEMP/external-client/load-status.json" --target-sha "$TARGET_SHA" \
            --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --trusted-sha "$TRUSTED_RUNNER_SHA" --profile-id "$PROFILE_ID" \
            --profile-version "$profile_version" --profile-digest "$profile_digest" >/dev/null \
            && status=0
          if [[ "$status" == 0 ]]; then
            /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" report \
              --path "$RUNNER_TEMP/external-client/external-load.json" --target-sha "$TARGET_SHA" \
              --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" \
              --trusted-sha "$TRUSTED_RUNNER_SHA" --profile-id "$PROFILE_ID" \
              --profile-version "$profile_version" --profile-digest "$profile_digest" >/dev/null \
              && report_ready=1 || status=1
          fi
          echo "load_status=$status" >> "$GITHUB_OUTPUT"
          echo "report_ready=$report_ready" >> "$GITHUB_OUTPUT"
          exit 0

  # Finalization and cleanup use a new approved runner.  They consume only the
  # exact input and a bounded diagnostic-id list; no candidate script runs in
  # this secret-bearing job.
  fixture-finalize:
    name: Signal fixture completion and collect origin evidence
    needs:
      - validate-caller-identity
      - resolve-trusted-runner
      - validate-external-inputs
      - fixture-setup
      - load-client
    if: >-
      always() &&
      needs.validate-caller-identity.result == 'success' &&
      needs.validate-caller-identity.outputs.caller_identity_validated == 'true' &&
      needs.resolve-trusted-runner.result == 'success' &&
      needs.resolve-trusted-runner.outputs.trusted_runner_sha != '' &&
      needs.resolve-trusted-runner.outputs.trusted_runner_attested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      remote_status: ${{ steps.external-finalize.outputs.remote_status }}
      observer_ready: ${{ steps.external-finalize.outputs.observer_ready }}
      finalize_status: ${{ steps.external-finalize.outputs.finalize_status }}
      diagnostic_ids_status: ${{ steps.external-finalize.outputs.diagnostic_ids_status }}
      cleanup_status: ${{ steps.cleanup.outputs.cleanup_status }}
      cleanup_exports_status: ${{ steps.cleanup.outputs.cleanup_exports_status }}
      cleanup_export_status: ${{ steps.cleanup.outputs.cleanup_export_status }}
      ssh_cleanup_status: ${{ steps.cleanup_ssh.outputs.ssh_cleanup_status }}
      cleanup_identity_status: ${{ steps.revalidate-finalizer.outputs.cleanup_identity_status }}
      handoff_status: ${{ steps.revalidate-finalizer.outputs.handoff_status }}
      candidate_artifact_status: ${{ steps.revalidate-finalizer.outputs.candidate_artifact_status }}
      origin_artifact_id: ${{ steps.publish-origin.outputs.artifact-id }}
      origin_artifact_digest: ${{ steps.publish-origin.outputs.artifact-digest }}
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      TRUSTED_RUNNER_SHA: ${{ needs.resolve-trusted-runner.outputs.trusted_runner_sha }}
      CONTROL_EMAIL: ${{ inputs.control_email }}
      TIMEOUT_DIAGNOSTICS: ${{ inputs.timeout_diagnostics }}
      INPUT_ARTIFACT_ID: ${{ needs.validate-external-inputs.outputs.input_artifact_id }}
      INPUT_ARTIFACT_DIGEST: ${{ needs.validate-external-inputs.outputs.input_artifact_digest }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.load-client.outputs.candidate_artifact_id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.load-client.outputs.candidate_artifact_digest }}
    steps:
      - name: Download exact external-load handoff
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-input-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/external-input
      - name: Download candidate diagnostic data
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-client-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/external-client
      - name: Checkout the pinned trusted provenance runner
        if: ${{ needs.resolve-trusted-runner.result == 'success' && needs.resolve-trusted-runner.outputs.trusted_runner_sha != '' && needs.resolve-trusted-runner.outputs.trusted_runner_attested == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TRUSTED_RUNNER_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: ${{ runner.temp }}/trusted-external-load-runner
      - name: Revalidate finalizer handoffs
        id: revalidate-finalizer
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          cleanup_input_path="$RUNNER_TEMP/external-input/platform-production-external-load-cleanup.json"
          candidate_dir="$RUNNER_TEMP/external-client"
          trusted_root="$RUNNER_TEMP/trusted-external-load-runner"
          handoff_status=0
          candidate_artifact_status=0
          cleanup_identity_status=1
          install -d -m 700 "$RUNNER_TEMP/external-input"
          # The cleanup identity is deliberately independent of the load and
          # candidate handoffs.  Setup may already have committed a fixture
          # when a later artifact/handoff check fails, so cleanup must still
          # have a machine-validated run/SHA/control-account document.
          if /usr/bin/python3 - "$cleanup_input_path" "$TARGET_SHA" "$SOURCE_RUN_ID" "$CONTROL_EMAIL" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import tempfile

          destination, target_sha, run_id, control_email = sys.argv[1:]
          email_local = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9._%+\\-]{0,62}[A-Za-z0-9])?$")
          email_label = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9\\-]{0,61}[A-Za-z0-9])?$")
          if re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("cleanup target SHA is malformed")
          if re.fullmatch(r"[1-9][0-9]{0,31}", run_id) is None:
              raise SystemExit("cleanup run id is malformed")
          if (
              not control_email.isascii()
              or not 3 <= len(control_email) <= 254
              or control_email != control_email.strip()
              or control_email.count("@") != 1
          ):
              raise SystemExit("cleanup control email is malformed")
          local, domain = control_email.split("@", 1)
          labels = domain.split(".")
          if (
              not 1 <= len(local) <= 64
              or not 1 <= len(domain) <= 253
              or "." not in domain
              or email_local.fullmatch(local) is None
              or any(email_label.fullmatch(label) is None for label in labels)
          ):
              raise SystemExit("cleanup control email is malformed")
          payload = {
              "schema": "1",
              "target_sha": target_sha,
              "control_email": control_email.lower(),
              "load_run_id": run_id,
              "cleanup_run_id": run_id,
          }
          destination_path = Path(destination)
          if destination_path.is_symlink() or destination_path.exists():
              raise SystemExit("cleanup identity destination already exists")
          destination_path.parent.mkdir(mode=0o700, exist_ok=True)
          encoded = (json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          descriptor, temporary = tempfile.mkstemp(
              prefix=".external-cleanup-", dir=destination_path.parent
          )
          try:
              os.fchmod(descriptor, 0o600)
              os.write(descriptor, encoded)
              os.fsync(descriptor)
              os.close(descriptor)
              descriptor = -1
              os.replace(temporary, destination_path)
          finally:
              if descriptor >= 0:
                  os.close(descriptor)
              try:
                  os.unlink(temporary)
              except FileNotFoundError:
                  pass
          if destination_path.is_symlink() or destination_path.stat().st_mode & 0o077:
              raise SystemExit("cleanup identity permissions are unsafe")
          PY
          then
            cleanup_identity_status=0
          fi
          verify_artifact() {
            local artifact_id="$1" artifact_digest="$2" artifact_name="$3" prefix="$4" workflow_file="$5"
            test -n "$artifact_id" && test -n "$artifact_digest" || return 1
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || return 1
            artifact_digest="${artifact_digest#sha256:}"
            [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            local metadata="$RUNNER_TEMP/${prefix}-metadata.json" archive="$RUNNER_TEMP/${prefix}.zip"
            curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --output "$metadata" || return 1
            curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --location --max-filesize 67108864 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$archive" || return 1
            local run_metadata="$RUNNER_TEMP/${prefix}-run-metadata.json"
            curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
              --output "$run_metadata" || return 1
            /usr/bin/python3 - "$metadata" "$run_metadata" "$TARGET_SHA" "$SOURCE_RUN_ID" "$GITHUB_REPOSITORY" "$workflow_file" <<'PY' || return 1
          import json
          from pathlib import Path
          import sys

          metadata_path, run_path, target_sha, run_id, repository, workflow_file = sys.argv[1:]
          run = json.loads(Path(run_path).read_text(encoding="utf-8"))
          if not isinstance(run, dict) or run.get("id") != int(run_id) or run.get("head_sha") != target_sha:
              raise SystemExit("artifact workflow run identity is not exact")
          head_repository = run.get("head_repository")
          if not isinstance(head_repository, dict) or head_repository.get("full_name") != repository or run.get("path") != workflow_file:
              raise SystemExit("artifact workflow repository/path is not exact")
          PY
            /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" artifact \
              --metadata "$metadata" --archive "$archive" --artifact-id "$artifact_id" \
              --artifact-name "$artifact_name" --run-id "$SOURCE_RUN_ID" \
              --run-attempt "$SOURCE_RUN_ATTEMPT" --target-sha "$TARGET_SHA" \
              --digest "$artifact_digest" --repository "$GITHUB_REPOSITORY" \
              --run-metadata "$run_metadata" \
              --workflow-file "$workflow_file" >/dev/null || return 1
            /usr/bin/python3 - "$metadata" > "$RUNNER_TEMP/${prefix}-size" <<'PY' || return 1
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("size_in_bytes")
          if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
              raise SystemExit(1)
          print(value)
          PY
            [[ "$(cat "$RUNNER_TEMP/${prefix}-size")" =~ ^[1-9][0-9]*$ ]] || return 1
          }
          if [[ ! -s "$input_path" || -L "$input_path" ]]; then
            handoff_status=1
          elif ! verify_artifact "$INPUT_ARTIFACT_ID" "$INPUT_ARTIFACT_DIGEST" "platform-production-external-load-input-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" external-finalizer-input .github/workflows/platform-production-external-load.yml; then
            handoff_status=1
          fi
          install -d -m 700 "$candidate_dir"
          if [[ -z "$CANDIDATE_ARTIFACT_ID" || -z "$CANDIDATE_ARTIFACT_DIGEST" ]] \
            || ! verify_artifact "$CANDIDATE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT_DIGEST" "platform-production-external-load-client-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" external-finalizer-candidate .github/workflows/platform-production-external-load.yml; then
            candidate_artifact_status=1
          fi
          if [[ "$handoff_status" == 0 ]]; then
            set +e
            /usr/bin/python3 - "$input_path" "$TARGET_SHA" "$SOURCE_RUN_ID" "$RUNNER_TEMP/external-client/timeout-diagnostic-ids.json" "$RUNNER_TEMP/external-client/timeout-diagnostic-ids.remote.json" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          path, target_sha, run_id, ids_path, remote_ids_path = sys.argv[1:]
          payload = json.loads(Path(path).read_text(encoding="utf-8"))
          expected = {"schema", "confirmation", "target_sha", "control_email", "setup_concurrency", "run_id", "profile", "tournament_count", "users_per_tournament", "timeout_diagnostics"}
          if set(payload) != expected or payload.get("schema") not in (1, "1") or payload.get("target_sha") != target_sha or payload.get("run_id") != run_id:
              raise SystemExit("external finalizer handoff schema or exact target SHA mismatch")
          ids_file = Path(ids_path)
          if ids_file.exists() and ids_file.is_symlink():
              raise SystemExit("diagnostic id handoff must not be a symlink")
          if not ids_file.exists():
              ids_file.write_text(json.dumps({"schema": 1, "target_sha": target_sha, "run_id": run_id, "ids": []}) + "\n", encoding="utf-8")
          ids_payload = json.loads(ids_file.read_text(encoding="utf-8"))
          if set(ids_payload) != {"schema", "target_sha", "run_id", "ids"} or ids_payload.get("schema") != 1 or ids_payload.get("target_sha") != target_sha or ids_payload.get("run_id") != run_id:
              raise SystemExit("diagnostic id handoff schema or exact target SHA is invalid")
          ids = ids_payload.get("ids")
          if not isinstance(ids, list) or len(ids) > 100000 or any(not isinstance(item, str) or re.fullmatch(r"[A-Za-z0-9._:-]{1,128}", item) is None for item in ids):
              raise SystemExit("diagnostic id handoff is not closed")
          Path(remote_ids_path).write_text(json.dumps(ids, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
            handoff_status="$?"
            set -e
          fi
          echo "handoff_status=$handoff_status" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_status=$candidate_artifact_status" >> "$GITHUB_OUTPUT"
          echo "cleanup_identity_status=$cleanup_identity_status" >> "$GITHUB_OUTPUT"
          # This status-bearing step must not prevent the always-run cleanup
          # from executing.  The final gate consumes the explicit status and
          # reports handoff failure only after checking cleanup first.
          exit 0

      - name: Configure finalizer SSH
        if: ${{ always() }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/production-external-load-ssh-finalize"
          control_path="/tmp/old-sparky-external-load-ssh-finalize-$SOURCE_RUN_ID"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"; chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" 2>/dev/null | /usr/bin/head -c 65536 >"$ssh_scan_attempt" \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          { printf '%s\n' 'Host *' '  StrictHostKeyChecking yes'; printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"; printf '%s\n' '  ControlMaster auto' '  ControlPersist 15m'; printf '  ControlPath %s\n' "$control_path"; } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"; printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Signal fixture completion and collect origin evidence
        id: external-finalize
        if: ${{ always() }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          HANDOFF_STATUS: ${{ steps.revalidate-finalizer.outputs.handoff_status }}
        run: |
          set -u
          set -o pipefail
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          export_dir="/tmp/old-sparky-production-retained-load-$SOURCE_RUN_ID"
          artifact_dir="$RUNNER_TEMP/external-evidence"; mkdir -p "$artifact_dir"; chmod 700 "$artifact_dir"
          remote_status=1; observer_ready=0; finalize_status=1; diagnostic_ids_status=0; evidence_copy_status=1
          ssh_dir="${SSH_DIR:-$RUNNER_TEMP/production-external-load-ssh-finalize}"
          bounded_upload() {
            local source="$1" remote_path="$2" max_bytes="$3"
            [[ -f "$source" && ! -L "$source" ]] || return 1
            local local_size
            local_size="$(stat -c '%s' "$source" 2>/dev/null)" || return 1
            [[ "$local_size" =~ ^[0-9]+$ ]] && (( local_size <= max_bytes )) || return 1
            scp -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$ssh_dir/id_ed25519" \
              "$source" "$PROD_SSH_USER@$PROD_SSH_HOST:$remote_path" >/dev/null 2>&1 || return 1
            local remote_size
            remote_size="$(timeout --foreground 20s ssh -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$ssh_dir/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" "stat -c '%s' -- '$remote_path'" 2>/dev/null | /usr/bin/head -c 32)" || return 1
            [[ "$remote_size" =~ ^[0-9]+$ ]] && (( remote_size <= max_bytes )) && [[ "$remote_size" == "$local_size" ]]
          }
          bounded_download() {
            local remote_path="$1" destination="$2" max_bytes="$3"
            local remote_size
            remote_size="$(timeout --foreground 20s ssh -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$ssh_dir/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" "stat -c '%s' -- '$remote_path'" 2>/dev/null | /usr/bin/head -c 32)" || return 1
            [[ "$remote_size" =~ ^[0-9]+$ ]] && (( remote_size <= max_bytes )) || return 1
            scp -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$ssh_dir/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST:$remote_path" "$destination" >/dev/null 2>&1 || return 1
            local local_size
            local_size="$(stat -c '%s' "$destination" 2>/dev/null)" || return 1
            [[ "$local_size" =~ ^[0-9]+$ ]] && (( local_size <= max_bytes )) && [[ "$local_size" == "$remote_size" ]]
          }
          if [[ "$HANDOFF_STATUS" == 0 && -s "$input_path" && -s "$ssh_dir/config" && -s "$ssh_dir/id_ed25519" ]]; then
            if [[ "$TIMEOUT_DIAGNOSTICS" == true ]]; then
              bounded_upload "$RUNNER_TEMP/external-client/timeout-diagnostic-ids.remote.json" "$export_dir/timeout-diagnostic-ids.json" 1048576 || diagnostic_ids_status=1
            fi
            set +e
            ssh -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" /usr/bin/python3.12 -I -B /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py external-finalize < "$input_path" 2>&1 | /usr/bin/head -c 1048576 >/dev/null
            complete_status="$?"
            set -e
            if [[ "$complete_status" == 0 ]]; then
              deadline=$(( $(date +%s) + 10800 ))
              while (( $(date +%s) < deadline )); do
                if bounded_download "$export_dir/matrix-summary.json" "$artifact_dir/matrix-summary.json" 1048576 \
                  && bounded_download "$export_dir/supervisor.exit" "$artifact_dir/supervisor.exit" 128; then
                  remote_status="$(tr -d '[:space:]' < "$artifact_dir/supervisor.exit")"; observer_ready=1; break
                fi
                sleep 2
              done
              evidence_copy_status=0
              for file in canonical.log server-observability.json timeout-diagnostics.json; do
                max_bytes=16777216
                [[ "$file" == server-observability.json ]] && max_bytes=33554432
                bounded_download "$export_dir/$file" "$artifact_dir/$file" "$max_bytes" || evidence_copy_status=1
              done
              [[ "$observer_ready" == 1 && "$remote_status" == 0 && "$diagnostic_ids_status" == 0 && "$evidence_copy_status" == 0 && -s "$artifact_dir/matrix-summary.json" && -s "$artifact_dir/canonical.log" && -s "$artifact_dir/server-observability.json" ]] && finalize_status=0
            fi
          fi
          echo "remote_status=$remote_status" >> "$GITHUB_OUTPUT"
          echo "observer_ready=$observer_ready" >> "$GITHUB_OUTPUT"
          echo "finalize_status=$finalize_status" >> "$GITHUB_OUTPUT"
          echo "diagnostic_ids_status=$diagnostic_ids_status" >> "$GITHUB_OUTPUT"
          # Keep the finalizer job alive so the explicit cleanup status can be
          # observed and enforced even when completion/observer handoff fails.
          exit 0

      - name: Exact cleanup of external fixture
        id: cleanup
        if: ${{ always() }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          CLEANUP_IDENTITY_STATUS: ${{ steps.revalidate-finalizer.outputs.cleanup_identity_status }}
        run: |
          set -u
          set -o pipefail
          umask 077
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-cleanup.json"
          export_dir="/tmp/old-sparky-production-retained-cleanup-$SOURCE_RUN_ID"
          artifact_dir="$RUNNER_TEMP/external-evidence"
          ssh_dir="${SSH_DIR:-$RUNNER_TEMP/production-external-load-ssh-finalize}"
          trusted_root="$RUNNER_TEMP/trusted-external-load-runner"
          cleanup_status=1
          cleanup_exports_status=1
          cleanup_export_status=1
          cleanup_artifact_status=1
          summary_copy_status=1
          canonical_copy_status=1
          projection_status=1
          install -d -m 700 "$artifact_dir"
          cleanup_summary="$artifact_dir/cleanup-summary.json"
          canonical_raw="$artifact_dir/cleanup-canonical.raw"
          cleanup_log="$artifact_dir/cleanup-canonical.log"
          ssh_output_file="$artifact_dir/cleanup-ssh-output"

          bounded_download() {
            local remote_path="$1" destination="$2" max_bytes="$3"
            local remote_size
            remote_size="$(timeout --foreground 20s ssh -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$ssh_dir/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" "stat -c '%s' -- '$remote_path'" 2>/dev/null | /usr/bin/head -c 32)" || return 1
            [[ "$remote_size" =~ ^[0-9]+$ ]] && (( remote_size <= max_bytes )) || return 1
            scp -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST:$remote_path" "$destination" >/dev/null 2>&1 || return 1
            local local_size
            local_size="$(stat -c '%s' "$destination" 2>/dev/null)" || return 1
            [[ "$local_size" =~ ^[0-9]+$ ]] && (( local_size <= max_bytes )) && [[ "$local_size" == "$remote_size" ]]
          }

          project_cleanup_summary() {
            local source="$1" destination="$2"
            /usr/bin/python3 - "$source" "$destination" <<'PY'
          import json
          from pathlib import Path
          import sys

          source_path, destination_path = (Path(value) for value in sys.argv[1:])
          fallback = {
              "schema": 1,
              "ok": False,
              "markers": 0,
              "users_deleted": 0,
              "tournaments_deleted": 0,
              "control_account_preserved": False,
              "error_class": "cleanup_summary_invalid",
          }

          def write_fallback() -> None:
              destination_path.write_text(json.dumps(fallback, sort_keys=True) + chr(10), encoding="utf-8")

          try:
              source = json.loads(source_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              write_fallback()
              raise SystemExit("cleanup summary projection input is invalid")
          if not isinstance(source, dict) or source.get("ok") is not True or source.get("control_account_preserved") is not True:
              write_fallback()
              raise SystemExit("cleanup summary projection input is invalid")

          try:
              counts = {}
              for name in ("markers", "users_deleted", "tournaments_deleted"):
                  value = source.get(name)
                  if isinstance(value, bool) or not isinstance(value, int) or not 0 <= value <= 10_000_000:
                      raise ValueError(name)
                  counts[name] = value
              projection = {
                  "schema": 1,
                  "ok": True,
                  **counts,
                  "control_account_preserved": True,
              }
              if "partial_run_root_removed" in source:
                  if not isinstance(source["partial_run_root_removed"], bool):
                      raise ValueError("partial_run_root_removed")
                  projection["partial_run_root_removed"] = source["partial_run_root_removed"]
          except (KeyError, ValueError, TypeError):
              write_fallback()
              raise SystemExit("cleanup summary projection input is invalid")
          destination_path.write_text(json.dumps(projection, sort_keys=True) + chr(10), encoding="utf-8")
          PY
          }

          # The reduced cleanup identity is independently validated from the
          # workflow inputs.  Do not gate this attempt on load/candidate
          # handoff validation: setup may have committed state already.
          if [[ "$CLEANUP_IDENTITY_STATUS" == 0 && -s "$input_path" \
            && -s "$ssh_dir/config" && -s "$ssh_dir/id_ed25519" ]]; then
            set +e
            ssh -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
              /usr/bin/python3.12 -I -B /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py \
              external-cleanup < "$input_path" 2>&1 | /usr/bin/head -c 1048576 > "$ssh_output_file"
            cleanup_status="$?"
            rm -f -- "$ssh_output_file"
            test ! -e "$ssh_output_file"

            # Project the remote result before deleting the private export.
            # A missing, stale, false or malformed summary is a cleanup
            # failure even if the helper returned zero.
            rm -f -- "$cleanup_summary"
            bounded_download "$export_dir/cleanup-summary.json" "$cleanup_summary" 1048576
            summary_copy_status="$?"
            if [[ "$summary_copy_status" == 0 ]]; then
              public_summary="$cleanup_summary.public"
              project_cleanup_summary "$cleanup_summary" "$public_summary"
              projection_status="$?"
              if [[ "$projection_status" == 0 && -s "$public_summary" && ! -L "$public_summary" ]]; then
                chmod 600 "$public_summary"
                mv -- "$public_summary" "$cleanup_summary"
              else
                rm -f -- "$cleanup_summary" "$public_summary"
                printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_summary_invalid"}' > "$cleanup_summary"
                chmod 600 "$cleanup_summary"
              fi
            else
              rm -f -- "$cleanup_summary"
              printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_summary_unavailable"}' > "$cleanup_summary"
              chmod 600 "$cleanup_summary"
            fi

            rm -f -- "$canonical_raw"
            bounded_download "$export_dir/canonical.log" "$canonical_raw" 16777216
            canonical_copy_status="$?"
            [[ "$canonical_copy_status" == 0 && -s "$canonical_raw" ]] || canonical_copy_status=1
            if [[ "$canonical_copy_status" == 0 ]]; then
              /usr/bin/python3 "$trusted_root/platform/tools/platform_evidence_sanitizer.py" \
                --input "$canonical_raw" --output "$cleanup_log"
              sanitizer_status="$?"
              rm -f -- "$canonical_raw"
              [[ "$sanitizer_status" == 0 && -s "$cleanup_log" && ! -L "$cleanup_log" ]] || canonical_copy_status=1
              [[ ! -e "$canonical_raw" && ! -L "$canonical_raw" ]] || canonical_copy_status=1
            fi
            if [[ "$summary_copy_status" == 0 && "$projection_status" == 0 \
              && "$canonical_copy_status" == 0 && -s "$cleanup_summary" && -s "$cleanup_log" ]]; then
              cleanup_artifact_status=0
            fi

            # Always attempt private export deletion after the primary cleanup
            # attempt.  Its status is independent and never hidden.
            ssh -F "$ssh_dir/config" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -i "$ssh_dir/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
              /usr/bin/python3.12 -I -B /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py \
              external-cleanup-exports < "$input_path" 2>&1 | /usr/bin/head -c 1048576 >/dev/null
            cleanup_export_status="$?"
            cleanup_exports_status="$cleanup_export_status"
            if [[ "$cleanup_status" == 0 ]] \
              && { [[ "$cleanup_artifact_status" != 0 ]] || [[ "$cleanup_exports_status" != 0 ]]; }; then
              cleanup_status=1
            fi
            if [[ "$cleanup_status" != 0 || "$cleanup_exports_status" != 0 ]]; then
              cleanup_status=1
            fi
            set -e
          fi
          echo "cleanup_status=$cleanup_status" >> "$GITHUB_OUTPUT"
          echo "cleanup_exports_status=$cleanup_exports_status" >> "$GITHUB_OUTPUT"
          echo "cleanup_export_status=$cleanup_export_status" >> "$GITHUB_OUTPUT"
          # Keep status-bearing cleanup observable to the final gate.  The
          # gate consumes these explicit values before handoff diagnostics.
          exit 0

      - name: Remove untrusted origin transport logs
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/external-evidence"
          rm -f -- "$artifact_dir/cleanup-canonical.raw"
          test ! -e "$artifact_dir/cleanup-canonical.raw"
          for file in matrix-summary.json canonical.log server-observability.json timeout-diagnostics.json cleanup-summary.json cleanup-canonical.log; do
            if [[ -e "$artifact_dir/$file" ]]; then
              test ! -L "$artifact_dir/$file"
            fi
          done

      - name: Remove finalizer SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          ssh_dir="$RUNNER_TEMP/production-external-load-ssh-finalize"
          control_path="/tmp/old-sparky-external-load-ssh-finalize-$SOURCE_RUN_ID"
          input_path="$RUNNER_TEMP/external-input/platform-production-external-load-input.json"
          cleanup_input_path="$RUNNER_TEMP/external-input/platform-production-external-load-cleanup.json"
          ssh_cleanup_status=0

          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            if [[ -L "$ssh_dir" || ! -d "$ssh_dir" ]]; then
              ssh_cleanup_status=1
            else
              rm -f -- \
                "$ssh_dir/id_ed25519" \
                "$ssh_dir/known_hosts" \
                "$ssh_dir/known_hosts.scan" \
                "$ssh_dir/known_hosts.scan.1" \
                "$ssh_dir/known_hosts.scan.2" \
                "$ssh_dir/config" \
                "$ssh_dir/control.sock" \
                "$ssh_dir/control-master" \
                "$ssh_dir/control-master.sock" || ssh_cleanup_status=1
              for path in \
                "$ssh_dir/id_ed25519" \
                "$ssh_dir/known_hosts" \
                "$ssh_dir/known_hosts.scan" \
                "$ssh_dir/config" \
                "$ssh_dir/control.sock" \
                "$ssh_dir/control-master" \
                "$ssh_dir/control-master.sock"; do
                [[ ! -e "$path" && ! -L "$path" ]] || ssh_cleanup_status=1
              done
              test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519" || ssh_cleanup_status=1
              rmdir -- "$ssh_dir" || ssh_cleanup_status=1
            fi
          fi
          [[ ! -e "$ssh_dir" && ! -L "$ssh_dir" ]] || ssh_cleanup_status=1
          rm -f -- "$control_path" "$input_path" "$cleanup_input_path" || ssh_cleanup_status=1
          [[ ! -e "$control_path" && ! -L "$control_path" ]] || ssh_cleanup_status=1
          [[ ! -e "$input_path" && ! -L "$input_path" ]] || ssh_cleanup_status=1
          [[ ! -e "$cleanup_input_path" && ! -L "$cleanup_input_path" ]] || ssh_cleanup_status=1
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV" || ssh_cleanup_status=1
          unset SSH_DIR
          [[ -z "${SSH_DIR:-}" ]] || ssh_cleanup_status=1
          echo "ssh_cleanup_status=$ssh_cleanup_status" >> "$GITHUB_OUTPUT" || exit 1
          exit 0

      - name: Publish origin evidence
        id: publish-origin
        if: ${{ success() && steps.cleanup_ssh.outcome == 'success' && steps.cleanup_ssh.outputs.ssh_cleanup_status == '0' && steps.external-finalize.outputs.remote_status == '0' && steps.external-finalize.outputs.observer_ready == '1' && steps.external-finalize.outputs.finalize_status == '0' && steps.cleanup.outputs.cleanup_status == '0' && steps.cleanup.outputs.cleanup_exports_status == '0' && steps.revalidate-finalizer.outputs.cleanup_identity_status == '0' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-origin-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: |
            ${{ runner.temp }}/external-evidence/matrix-summary.json
            ${{ runner.temp }}/external-evidence/canonical.log
            ${{ runner.temp }}/external-evidence/server-observability.json
            ${{ runner.temp }}/external-evidence/timeout-diagnostics.json
            ${{ runner.temp }}/external-evidence/cleanup-summary.json
            ${{ runner.temp }}/external-evidence/cleanup-canonical.log
          if-no-files-found: error
          retention-days: 1

  # Evaluation/sanitization happens on another secret-free checkout runner.
  evaluate-load:
    name: Evaluate checked-out load report
    needs:
      - validate-caller-identity
      - resolve-trusted-runner
      - validate-external-inputs
      - fixture-setup
      - fixture-finalize
      - load-client
    if: >-
      always() &&
      needs.validate-caller-identity.result == 'success' &&
      needs.validate-caller-identity.outputs.caller_identity_validated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      PROFILE_ID: ${{ inputs.profile_id }}
      TIMEOUT_DIAGNOSTICS: ${{ inputs.timeout_diagnostics }}
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_GIT_SHA: ${{ inputs.target_sha }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      TRUSTED_RUNNER_SHA: ${{ needs.resolve-trusted-runner.outputs.trusted_runner_sha }}
      INPUT_ARTIFACT_ID: ${{ needs.validate-external-inputs.outputs.input_artifact_id }}
      INPUT_ARTIFACT_DIGEST: ${{ needs.validate-external-inputs.outputs.input_artifact_digest }}
      CANDIDATE_ARTIFACT_ID: ${{ needs.load-client.outputs.candidate_artifact_id }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ needs.load-client.outputs.candidate_artifact_digest }}
      ORIGIN_ARTIFACT_ID: ${{ needs.fixture-finalize.outputs.origin_artifact_id }}
      ORIGIN_ARTIFACT_DIGEST: ${{ needs.fixture-finalize.outputs.origin_artifact_digest }}
    steps:
      - name: Checkout the pinned trusted load evaluator
        if: ${{ needs.resolve-trusted-runner.result == 'success' && needs.resolve-trusted-runner.outputs.trusted_runner_sha != '' && needs.resolve-trusted-runner.outputs.trusted_runner_attested == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TRUSTED_RUNNER_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: ${{ runner.temp }}/trusted-external-load-runner
      - name: Download candidate load data
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-client-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/external-client
      - name: Download fixed origin evidence
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-origin-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/external-evidence
      - name: Download the exact profile contract
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-production-external-load-input-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: ${{ runner.temp }}/external-input
      - name: Download exact source run metadata
        id: download-run-metadata
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          run_metadata="$RUNNER_TEMP/external-load-source-run-metadata.json"
          temporary="$run_metadata.tmp"
          rm -f -- "$run_metadata" "$temporary"
          install -m 600 /dev/null "$temporary"
          curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.source_run_id }}" \
            --output "$temporary"
          chmod 600 "$temporary"
          test "$(stat -c '%a' "$temporary")" = 600
          mv -- "$temporary" "$run_metadata"
          test -f "$run_metadata" && test ! -L "$run_metadata"
          test "$(stat -c '%a' "$run_metadata")" = 600
          printf 'run_metadata_path=%s\n' "$run_metadata" >> "$GITHUB_OUTPUT"
      - name: Verify evaluator artifact identity and digest
        id: verify-evaluator-artifacts
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_METADATA_PATH: ${{ steps.download-run-metadata.outputs.run_metadata_path }}
        run: |
          set +e
          trusted_root="$RUNNER_TEMP/trusted-external-load-runner"
          run_metadata_path_status=0
          [[ -n "$RUN_METADATA_PATH" ]] || run_metadata_path_status=1
          [[ "$RUN_METADATA_PATH" == "$RUNNER_TEMP/external-load-source-run-metadata.json" ]] || run_metadata_path_status=1
          [[ -f "$RUN_METADATA_PATH" && ! -L "$RUN_METADATA_PATH" ]] || run_metadata_path_status=1
          [[ "$(stat -c '%a' "$RUN_METADATA_PATH" 2>/dev/null)" == 600 ]] || run_metadata_path_status=1
          verify_artifact() {
            local artifact_id="$1" artifact_digest="$2" artifact_name="$3" prefix="$4" workflow_file="$5" run_metadata_path="$6"
            [[ "$run_metadata_path_status" == 0 ]] || return 1
            [[ "$run_metadata_path" == "$RUNNER_TEMP/external-load-source-run-metadata.json" ]] || return 1
            test -n "$artifact_id" && test -n "$artifact_digest" || return 1
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || return 1
            artifact_digest="${artifact_digest#sha256:}"
            [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            local metadata="$RUNNER_TEMP/${prefix}-metadata.json" archive="$RUNNER_TEMP/${prefix}.zip"
            curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --max-filesize 1048576 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
              --output "$metadata" || return 1
            curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error --location --max-filesize 67108864 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$archive" || return 1
            /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" artifact \
              --metadata "$metadata" --archive "$archive" --artifact-id "$artifact_id" \
              --artifact-name "$artifact_name" --run-id "$SOURCE_RUN_ID" \
              --run-attempt "$SOURCE_RUN_ATTEMPT" --target-sha "$TARGET_SHA" \
              --digest "$artifact_digest" --repository "$GITHUB_REPOSITORY" \
              --run-metadata "$run_metadata_path" \
              --workflow-file "$workflow_file" >/dev/null || return 1
            /usr/bin/python3 - "$metadata" > "$RUNNER_TEMP/${prefix}-size" <<'PY' || return 1
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("size_in_bytes")
          if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
              raise SystemExit(1)
          print(value)
          PY
            [[ "$(cat "$RUNNER_TEMP/${prefix}-size")" =~ ^[1-9][0-9]*$ ]] || return 1
          }
          candidate_status=0
          origin_status=0
          input_status=0
          verify_artifact "$CANDIDATE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT_DIGEST" "platform-production-external-load-client-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" evaluator-candidate .github/workflows/platform-production-external-load.yml "$RUN_METADATA_PATH" || candidate_status=1
          verify_artifact "$ORIGIN_ARTIFACT_ID" "$ORIGIN_ARTIFACT_DIGEST" "platform-production-external-load-origin-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" evaluator-origin .github/workflows/platform-production-external-load.yml "$RUN_METADATA_PATH" || origin_status=1
          verify_artifact "$INPUT_ARTIFACT_ID" "$INPUT_ARTIFACT_DIGEST" "platform-production-external-load-input-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" evaluator-input .github/workflows/platform-production-external-load.yml "$RUN_METADATA_PATH" || input_status=1
          echo "candidate_artifact_status=$candidate_status" >> "$GITHUB_OUTPUT"
          echo "origin_artifact_status=$origin_status" >> "$GITHUB_OUTPUT"
          echo "input_artifact_status=$input_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Evaluate trusted load report
        id: evaluate-load
        shell: bash
        run: |
          set -u
          report="$RUNNER_TEMP/external-client/external-load.json"
          load_status_file="$RUNNER_TEMP/external-client/load-status.json"
          observer="$RUNNER_TEMP/external-evidence/server-observability.json"
          trusted_root="$RUNNER_TEMP/trusted-external-load-runner"
          contract="$RUNNER_TEMP/external-input/platform-production-external-load-profile-contract.json"
          contract_status=0
          /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" profile-contract \
            --path "$contract" --profile-id "$PROFILE_ID" --source-sha "$TARGET_SHA" \
            --trusted-sha "$TRUSTED_RUNNER_SHA" --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --trusted-profile "$trusted_root/platform/performance/profiles/$PROFILE_ID.json" >/dev/null || contract_status=1
          profile_version="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_version"])' "$contract" 2>/dev/null || true)"
          profile_digest="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_digest"])' "$contract" 2>/dev/null || true)"
          status=1
          upstream_ready=0
          if [[ "$contract_status" == 0 \
            && "${{ needs.validate-external-inputs.result }}" == success \
            && "${{ needs.fixture-setup.result }}" == success \
            && "${{ needs.fixture-setup.outputs.setup_status }}" == 0 \
            && "${{ needs.fixture-setup.outputs.manifest_validation_status }}" == 0 \
            && "${{ needs.fixture-setup.outputs.credential_cleanup_status }}" == 0 \
            && "${{ needs.fixture-setup.outputs.ssh_cleanup_status }}" == 0 \
            && "${{ needs.load-client.result }}" == success \
            && "${{ needs.load-client.outputs.load_status }}" == 0 \
            && "${{ needs.load-client.outputs.report_ready }}" == 1 \
            && "${{ needs.fixture-finalize.result }}" == success \
            && "${{ needs.fixture-finalize.outputs.remote_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.observer_ready }}" == 1 \
            && "${{ needs.fixture-finalize.outputs.finalize_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.diagnostic_ids_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.cleanup_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.cleanup_exports_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.ssh_cleanup_status }}" == 0 \
            && "${{ needs.fixture-finalize.outputs.cleanup_identity_status }}" == 0 \
            && "${{ steps.verify-evaluator-artifacts.outputs.candidate_artifact_status }}" == 0 \
            && "${{ steps.verify-evaluator-artifacts.outputs.origin_artifact_status }}" == 0 \
            && "${{ steps.verify-evaluator-artifacts.outputs.input_artifact_status }}" == 0 \
            && -s "$report" && -s "$load_status_file" && -s "$observer" ]]; then
            if /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" load-status \
              --path "$load_status_file" \
              --target-sha "$TARGET_SHA" \
              --run-id "$SOURCE_RUN_ID" \
              --run-attempt "$SOURCE_RUN_ATTEMPT" \
              --trusted-sha "$TRUSTED_RUNNER_SHA" --profile-id "$PROFILE_ID" \
              --profile-version "$profile_version" --profile-digest "$profile_digest" >/dev/null
            then upstream_ready=1; fi
          fi
          if [[ "$upstream_ready" == 1 ]]; then
            set +e
            /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" report \
              --path "$report" \
              --target-sha "$TARGET_SHA" \
              --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" \
              --trusted-sha "$TRUSTED_RUNNER_SHA" --profile-id "$PROFILE_ID" \
              --profile-version "$profile_version" --profile-digest "$profile_digest" >/dev/null
            status="$?"
            if [[ "$status" == 0 ]]; then
              if [[ "$TIMEOUT_DIAGNOSTICS" == true ]]; then
                /usr/bin/python3 "$trusted_root/platform/tools/platform_timeout_diagnostics.py" --client-report "$report" --server-observability "$observer" --output "$RUNNER_TEMP/external-evidence/timeout-diagnostics.json"
                status="$?"
              else
                (cd "$trusted_root/platform" && /usr/bin/python3 tools/platform_load.py evaluate --profile "$PROFILE_ID" --report "$report" --server-observability "$observer")
                status="$?"
              fi
            fi
            set -e
          fi
          echo "evaluation_status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Sanitize external evidence
        id: sanitize
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          public_dir="$RUNNER_TEMP/external-public"
          sanitizer_status=0
          install -d -m 700 "$public_dir" || sanitizer_status=1
          [[ -d "$public_dir" && ! -L "$public_dir" ]] || sanitizer_status=1
          remove_file() {
            local path="$1"
            if [[ -e "$path" || -L "$path" ]]; then
              rm -f -- "$path" || sanitizer_status=1
            fi
            [[ ! -e "$path" && ! -L "$path" ]] || sanitizer_status=1
          }
          move_file() {
            local source="$1" destination="$2"
            [[ -e "$source" && ! -L "$source" ]] || sanitizer_status=1
            mv -- "$source" "$destination" || sanitizer_status=1
            [[ ! -e "$source" && ! -L "$source" ]] || sanitizer_status=1
            [[ -e "$destination" && ! -L "$destination" ]] || sanitizer_status=1
          }
          remove_tree() {
            local path="$1"
            if [[ -e "$path" || -L "$path" ]]; then
              rm -rf -- "$path" || sanitizer_status=1
            fi
            [[ ! -e "$path" && ! -L "$path" ]] || sanitizer_status=1
          }
          # Closed artifact schemas: --artifact-type external_load,
          # --artifact-type server_observability,
          # --artifact-type timeout_diagnostics.
          sanitize_json() {
            local source="$1" destination="$2" artifact_type="$3"
            if [[ ! -s "$source" || -L "$source" ]]; then sanitizer_status=1; return; fi
            /usr/bin/python3 "$RUNNER_TEMP/trusted-external-load-runner/platform/tools/platform_evidence_sanitizer.py" \
              --json --artifact-type "$artifact_type" --input "$source" --output "$destination"
            local status="$?"
            if [[ "$status" != 0 || ! -s "$destination" || -L "$destination" ]]; then sanitizer_status=1; fi
          }
          sanitize_log() {
            local source="$1" destination="$2"
            if [[ ! -s "$source" || -L "$source" ]]; then sanitizer_status=1; return; fi
            /usr/bin/python3 "$RUNNER_TEMP/trusted-external-load-runner/platform/tools/platform_evidence_sanitizer.py" \
              --input "$source" --output "$destination"
            local status="$?"
            if [[ "$status" != 0 || ! -s "$destination" || -L "$destination" ]]; then sanitizer_status=1; fi
          }
          sanitize_json "$RUNNER_TEMP/external-client/external-load.json" "$public_dir/external-load.json" external_load
          sanitize_json "$RUNNER_TEMP/external-evidence/server-observability.json" "$public_dir/server-observability.json" server_observability
          if [[ "$TIMEOUT_DIAGNOSTICS" == true ]]; then
            sanitize_json "$RUNNER_TEMP/external-evidence/timeout-diagnostics.json" "$public_dir/timeout-diagnostics.json" timeout_diagnostics
          else
            printf '%s\n' '{"schema":1,"enabled":false,"public_projection":true,"authoritative":false}' > "$public_dir/timeout-diagnostics.json" || sanitizer_status=1
            [[ -s "$public_dir/timeout-diagnostics.json" && ! -L "$public_dir/timeout-diagnostics.json" ]] || sanitizer_status=1
          fi
          sanitize_log "$RUNNER_TEMP/external-evidence/canonical.log" "$public_dir/canonical.log"
          # The finalizer has already sanitized the remote cleanup log before
          # placing it in the origin artifact; sanitize it again here as a
          # defense-in-depth check before publication.
          sanitize_log "$RUNNER_TEMP/external-evidence/cleanup-canonical.log" "$public_dir/cleanup-canonical.log"
          /usr/bin/python3 - "$RUNNER_TEMP/external-evidence/matrix-summary.json" "$RUNNER_TEMP/external-evidence/cleanup-summary.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          matrix_path, cleanup_path = (Path(value) for value in sys.argv[1:])
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          cleanup = json.loads(cleanup_path.read_text(encoding="utf-8"))
          if not isinstance(matrix, dict) or matrix.get("passed") is not True:
              raise SystemExit("matrix summary is not a passing closed record")
          if not isinstance(cleanup, dict) or cleanup.get("ok") is not True:
              raise SystemExit("cleanup summary is not a passing closed record")
          PY
          if [[ "$?" != 0 ]]; then sanitizer_status=1; fi
          remove_file "$RUNNER_TEMP/external-client/external-load.json"
          remove_file "$RUNNER_TEMP/external-evidence/server-observability.json"
          remove_file "$RUNNER_TEMP/external-evidence/timeout-diagnostics.json"
          remove_file "$RUNNER_TEMP/external-evidence/canonical.log"
          remove_file "$RUNNER_TEMP/external-evidence/cleanup-canonical.log"
          remove_file "$RUNNER_TEMP/external-evidence/cleanup-canonical.log"
          move_file "$public_dir/external-load.json" "$RUNNER_TEMP/external-client/external-load.json"
          move_file "$public_dir/server-observability.json" "$RUNNER_TEMP/external-evidence/server-observability.json"
          move_file "$public_dir/timeout-diagnostics.json" "$RUNNER_TEMP/external-evidence/timeout-diagnostics.json"
          move_file "$public_dir/canonical.log" "$RUNNER_TEMP/external-evidence/canonical.log"
          move_file "$public_dir/cleanup-canonical.log" "$RUNNER_TEMP/external-evidence/cleanup-canonical.log"
          remove_tree "$public_dir"
          echo "sanitizer_status=$sanitizer_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build final non-secret provenance record
        id: provenance
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          provenance_status=1
          trusted_root="$RUNNER_TEMP/trusted-external-load-runner"
          provenance_artifacts="$RUNNER_TEMP/external-provenance-artifacts.json"
          provenance_output="$RUNNER_TEMP/external-client/external-load-provenance.json"
          if [[ "${{ steps.verify-evaluator-artifacts.outputs.input_artifact_status }}" == 0 \
            && "${{ steps.verify-evaluator-artifacts.outputs.candidate_artifact_status }}" == 0 \
            && "${{ steps.verify-evaluator-artifacts.outputs.origin_artifact_status }}" == 0 \
            && -s "$RUNNER_TEMP/evaluator-input-size" \
            && -s "$RUNNER_TEMP/evaluator-candidate-size" \
            && -s "$RUNNER_TEMP/evaluator-origin-size" ]]; then
            /usr/bin/python3 - "$provenance_artifacts" "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$GITHUB_REPOSITORY" \
              "$INPUT_ARTIFACT_ID" "$INPUT_ARTIFACT_DIGEST" "$RUNNER_TEMP/evaluator-input-size" \
              "$CANDIDATE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT_DIGEST" "$RUNNER_TEMP/evaluator-candidate-size" \
              "$ORIGIN_ARTIFACT_ID" "$ORIGIN_ARTIFACT_DIGEST" "$RUNNER_TEMP/evaluator-origin-size" <<'PY'
          import json
          from pathlib import Path
          import sys

          output, run_id, run_attempt, repository, input_id, input_digest, input_size, client_id, client_digest, client_size, origin_id, origin_digest, origin_size = sys.argv[1:]
          records = []
          for artifact_id, digest, size_path, kind in (
              (input_id, input_digest, input_size, "input"),
              (client_id, client_digest, client_size, "client"),
              (origin_id, origin_digest, origin_size, "origin"),
          ):
              records.append({
                  "artifact_id": int(artifact_id),
                  "artifact_name": f"platform-production-external-load-{kind}-{run_id}-{run_attempt}",
                  "artifact_digest": digest,
                  "size_in_bytes": int(Path(size_path).read_text(encoding="utf-8").strip()),
                  "repository": repository,
                  "workflow_file": ".github/workflows/platform-production-external-load.yml",
              })
          Path(output).write_text(json.dumps(records, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
            profile_version="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_version"])' "$RUNNER_TEMP/external-input/platform-production-external-load-profile-contract.json" 2>/dev/null)"
            profile_digest="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_digest"])' "$RUNNER_TEMP/external-input/platform-production-external-load-profile-contract.json" 2>/dev/null)"
            /usr/bin/python3 "$trusted_root/platform/tools/platform_external_load_provenance.py" provenance \
              --artifacts "$provenance_artifacts" --output "$provenance_output" \
              --target-sha "$TARGET_SHA" \
              --trusted-workflow-file ".github/workflows/platform-production-external-load-trusted.yml" \
              --trusted-sha "$TRUSTED_RUNNER_SHA" --profile-id "$PROFILE_ID" \
              --profile-version "$profile_version" --profile-digest "$profile_digest" \
              --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT" \
              --repository "$GITHUB_REPOSITORY" \
              --workflow-file ".github/workflows/platform-production-external-load.yml"
            provenance_status="$?"
          fi
          [[ "$provenance_status" == 0 && -s "$provenance_output" && ! -L "$provenance_output" ]] || provenance_status=1
          echo "provenance_status=$provenance_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish external load evidence
        if: >-
          success() &&
          needs.validate-external-inputs.result == 'success' &&
          needs.fixture-setup.result == 'success' &&
          needs.fixture-setup.outputs.setup_status == '0' &&
          needs.fixture-setup.outputs.manifest_validation_status == '0' &&
          needs.fixture-setup.outputs.credential_cleanup_status == '0' &&
          needs.fixture-setup.outputs.ssh_cleanup_status == '0' &&
          needs.load-client.result == 'success' &&
          needs.load-client.outputs.load_status == '0' &&
          needs.load-client.outputs.report_ready == '1' &&
          needs.fixture-finalize.result == 'success' &&
          needs.fixture-finalize.outputs.remote_status == '0' &&
          needs.fixture-finalize.outputs.observer_ready == '1' &&
          needs.fixture-finalize.outputs.finalize_status == '0' &&
          needs.fixture-finalize.outputs.cleanup_status == '0' &&
          needs.fixture-finalize.outputs.cleanup_exports_status == '0' &&
          needs.fixture-finalize.outputs.diagnostic_ids_status == '0' &&
          needs.fixture-finalize.outputs.ssh_cleanup_status == '0' &&
          needs.fixture-finalize.outputs.cleanup_identity_status == '0' &&
          needs.fixture-finalize.outputs.handoff_status == '0' &&
          needs.fixture-finalize.outputs.candidate_artifact_status == '0' &&
          steps.verify-evaluator-artifacts.outputs.candidate_artifact_status == '0' &&
          steps.verify-evaluator-artifacts.outputs.origin_artifact_status == '0' &&
          steps.verify-evaluator-artifacts.outputs.input_artifact_status == '0' &&
          steps.evaluate-load.outputs.evaluation_status == '0' &&
          steps.sanitize.outputs.sanitizer_status == '0' &&
          steps.provenance.outputs.provenance_status == '0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-external-load-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
          path: |
            ${{ runner.temp }}/external-client/external-load.json
            ${{ runner.temp }}/external-evidence/matrix-summary.json
            ${{ runner.temp }}/external-evidence/canonical.log
            ${{ runner.temp }}/external-evidence/server-observability.json
            ${{ runner.temp }}/external-evidence/timeout-diagnostics.json
            ${{ runner.temp }}/external-evidence/cleanup-summary.json
            ${{ runner.temp }}/external-evidence/cleanup-canonical.log
            ${{ runner.temp }}/external-client/external-load-provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce external load and exact cleanup gates
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.validate-external-inputs.result }}" = success || { echo "External-load dispatch validation failed." >&2; exit 1; }
          test "${{ needs.fixture-setup.result }}" = success || { echo "External fixture setup job failed." >&2; exit 1; }
          test "${{ needs.fixture-setup.outputs.setup_status }}" = 0 || { echo "External fixture setup status failed." >&2; exit 1; }
          test "${{ needs.fixture-setup.outputs.manifest_validation_status }}" = 0 || { echo "External fixture manifest validation failed." >&2; exit 1; }
          test "${{ needs.fixture-setup.outputs.ssh_cleanup_status }}" = 0 || { echo "Fixture-setup SSH cleanup failed." >&2; exit 1; }
          test "${{ needs.fixture-setup.outputs.credential_cleanup_status }}" = 0 || { echo "External fixture credential cleanup failed." >&2; exit 1; }
          test "${{ needs.load-client.result }}" = success || { echo "External load-client job failed." >&2; exit 1; }
          test "${{ needs.load-client.outputs.load_status }}" = 0 || { echo "Authoritative external load-status failed." >&2; exit 1; }
          test "${{ needs.load-client.outputs.report_ready }}" = 1 || { echo "External load report is missing." >&2; exit 1; }
          test "${{ needs.fixture-finalize.result }}" = success || { echo "External fixture-finalize job failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.remote_status }}" = 0 || { echo "Origin external-load supervisor failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.observer_ready }}" = 1 || { echo "Origin observer barrier was not reached." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.finalize_status }}" = 0 || { echo "External fixture finalization failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.cleanup_status }}" = 0 || { echo "Exact external-load cleanup failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.cleanup_exports_status }}" = 0 || { echo "External-load private export cleanup failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.diagnostic_ids_status }}" = 0 || { echo "Timeout diagnostic correlation failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.ssh_cleanup_status }}" = 0 || { echo "Finalizer SSH cleanup failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.cleanup_identity_status }}" = 0 || { echo "Cleanup identity validation failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.handoff_status }}" = 0 || { echo "Finalizer handoff validation failed." >&2; exit 1; }
          test "${{ needs.fixture-finalize.outputs.candidate_artifact_status }}" = 0 || { echo "Candidate load artifact identity/digest failed." >&2; exit 1; }
