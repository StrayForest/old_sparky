name: Platform production retained load matrix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN-PRODUCTION-RETAINED-LOAD-MATRIX to create retained production data"
        required: true
        type: string
      control_email:
        description: "Existing account for manual registration and team inspection"
        required: true
        default: "aleksei.lisitsin1@gmail.com"
        type: string
      concurrency:
        description: "Concurrent API workers for each phase (16 recommended; 1-256)"
        required: true
        default: "16"
        type: string
      profile:
        description: "Load profile for current request-driven reads or Ready vote writes"
        required: true
        default: "matrix"
        type: choice
        options:
          - matrix
          - read-mix
          - write-burst
      write_burst_profile:
        description: "Ready vote burst selection (all includes the 10k-user mixed workload)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - single-join
          - single-ready
          - multi-staggered
      write_burst_users_per_tournament:
        description: "Write-burst users per tournament (14-500; all/multi 500 = 10k users)"
        required: true
        default: "50"
        type: string
      write_burst_time_scale:
        description: "Write-burst timing scale (1.0 is the human-shaped measurement profile)"
        required: true
        default: "1.0"
        type: string
permissions:
  contents: read

concurrency:
  # The previous group was left holding GitHub startup-failure ghost runs;
  # version the operator workflow while keeping all new retained loads serial.
  group: platform-production-retained-load-matrix-v2
  cancel-in-progress: false

jobs:
  production-retained-load:
    name: Retained 10k-user load matrix on production
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      CONTROL_EMAIL: ${{ inputs.control_email }}
      QA_CONCURRENCY: ${{ inputs.concurrency }}
      QA_PROFILE: ${{ inputs.profile }}
      QA_WRITE_BURST_PROFILE: ${{ inputs.write_burst_profile }}
      QA_WRITE_BURST_USERS_PER_TOURNAMENT: ${{ inputs.write_burst_users_per_tournament }}
      QA_WRITE_BURST_TIME_SCALE: ${{ inputs.write_burst_time_scale }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Validate explicit production load confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production retained load must run from the reviewed dev branch." >&2; exit 1; }
          test "$QA_CONFIRMATION" = "RUN-PRODUCTION-RETAINED-LOAD-MATRIX" \
            || { echo "Refusing production load without exact confirmation." >&2; exit 1; }
          test "$QA_PROFILE" = "matrix" || test "$QA_PROFILE" = "read-mix" || test "$QA_PROFILE" = "write-burst" \
            || { echo "Unsupported production load profile" >&2; exit 1; }
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }
          /usr/bin/python3 - \
            "$CONTROL_EMAIL" "$QA_CONCURRENCY" "$QA_PROFILE" \
            "$QA_WRITE_BURST_PROFILE" "$QA_WRITE_BURST_USERS_PER_TOURNAMENT" \
            "$QA_WRITE_BURST_TIME_SCALE" <<'PY'
          import re
          import sys

          (
              email,
              concurrency,
              profile,
              write_burst_profile,
              write_burst_users_per_tournament,
              write_burst_time_scale,
          ) = sys.argv[1:]
          if not re.fullmatch(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+", email):
              raise SystemExit("control_email is invalid")
          if not re.fullmatch(r"[1-9][0-9]{0,2}", concurrency) or not 1 <= int(concurrency) <= 256:
              raise SystemExit("concurrency must be an integer from 1 to 256")
          if write_burst_profile not in {"all", "single-join", "single-ready", "multi-staggered"}:
              raise SystemExit("write_burst_profile is invalid")
          if (
              not re.fullmatch(r"[0-9]+", write_burst_users_per_tournament)
              or not 14 <= int(write_burst_users_per_tournament) <= 500
          ):
              raise SystemExit("write_burst_users_per_tournament must be between 14 and 500")
          try:
              write_burst_scale = float(write_burst_time_scale)
          except ValueError:
              raise SystemExit("write_burst_time_scale must be numeric") from None
          if not 0.01 <= write_burst_scale <= 10:
              raise SystemExit("write_burst_time_scale must be between 0.01 and 10")
          PY

      - name: Configure production SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/production-retained-load-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" || { echo "Production SSH host exposed no ED25519 key" >&2; exit 1; }
          ssh_key_count="$(wc -l < "$ssh_scan" | tr -d ' ')"
          test "$ssh_key_count" = "1" || { echo "Expected exactly one production ED25519 host key" >&2; exit 1; }
          ssh_fingerprint="$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$ssh_fingerprint" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" || {
            echo "Production SSH host fingerprint mismatch" >&2
            exit 1
          }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run retained matrix on the live production server
        id: run-matrix
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          remote_log="$RUNNER_TEMP/production-retained-load-remote.log"
          ssh_output_file="$RUNNER_TEMP/production-retained-load-ssh-output"
          remote_load_args=(
            "$QA_CONFIRMATION" "$TARGET_SHA" "$CONTROL_EMAIL" "$QA_CONCURRENCY" "$GITHUB_RUN_ID" "$QA_PROFILE"
          )
          if [[ "$QA_PROFILE" == "write-burst" ]]; then
            remote_load_args+=(
              "$QA_WRITE_BURST_PROFILE" "$QA_WRITE_BURST_USERS_PER_TOURNAMENT" "$QA_WRITE_BURST_TIME_SCALE"
            )
          fi
          set +e
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            bash -s -- "${remote_load_args[@]}" \
            > "$ssh_output_file" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          confirmation="$1"
          target_sha="$2"
          control_email="$3"
          concurrency="$4"
          run_id="$5"
          profile="$6"
          shift 6
          sudo -n -- /root/old_sparky/platform/tools/platform_production_retained_load_matrix_qa.sh \
            "$confirmation" "$target_sha" "$control_email" "$concurrency" "$run_id" "$profile" "$@"
          REMOTE
          remote_status=$?
          set -e
          cp "$ssh_output_file" "$remote_log"
          cat "$remote_log"
          echo "remote_exit_code=$remote_status" >> "$GITHUB_OUTPUT"

          export_dir="$(sed -n 's/^PRODUCTION_RETAINED_LOAD_MATRIX_EXPORT=//p' "$remote_log" | tail -n 1)"
          if [[ -n "$export_dir" ]]; then
            [[ "$export_dir" =~ ^/tmp/old-sparky-production-retained-load-[0-9]+$ ]] || {
              echo "Remote report export path failed validation" >&2
              exit 1
            }
            install -d -m 700 "$RUNNER_TEMP/production-retained-load-artifacts"
            scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/matrix-summary.json" \
              "$RUNNER_TEMP/production-retained-load-artifacts/matrix-summary.json"
            scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/matrix.log" \
              "$RUNNER_TEMP/production-retained-load-artifacts/matrix.log"
            if ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "test -s '$export_dir/qa-command.log'"; then
              scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
                -i "$SSH_DIR/id_ed25519" \
                "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/qa-command.log" \
                "$RUNNER_TEMP/production-retained-load-artifacts/qa-command.log"
            fi
            if ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "test -s '$export_dir/server-observability.log'"; then
              scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
                -i "$SSH_DIR/id_ed25519" \
                "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/server-observability.log" \
                "$RUNNER_TEMP/production-retained-load-artifacts/server-observability.log"
            fi
          fi
          exit "$remote_status"

      - name: Publish production retained-load artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: platform-production-retained-load-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-retained-load-artifacts/matrix-summary.json
            ${{ runner.temp }}/production-retained-load-artifacts/matrix.log
            ${{ runner.temp }}/production-retained-load-artifacts/qa-command.log
            ${{ runner.temp }}/production-retained-load-artifacts/server-observability.log
            ${{ runner.temp }}/production-retained-load-remote.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write production retained-load summary
        if: ${{ always() }}
        shell: bash
        run: |
          summary="$RUNNER_TEMP/production-retained-load-artifacts/matrix-summary.json"
          if [[ ! -s "$summary" ]]; then
            {
              echo "### Production retained 10k-user load matrix"
              echo
              echo "No matrix summary was exported from the production server."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          /usr/bin/python3 - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          performance = payload.get("performance_summary") or {}
          write_burst = payload.get("write_burst") or {}
          read_mix = payload.get("read_mix") or {}
          print("### Production retained 10k-user load matrix")
          print()
          print(f"- Profile: **{payload.get('mode', 'scale')}**")
          print(f"- Status: **{'passed' if payload.get('passed') else 'failed'}**")
          print(f"- Tournaments: {payload.get('completed_tournaments', 0)}/{payload.get('planned_tournaments', 0)}")
          print(f"- Generated users: {payload.get('completed_users', 0)}/{payload.get('planned_users', 0)}")
          print(f"- Planned teams: {payload.get('planned_teams', 0)}")
          print(f"- Worst HTTP p95: {performance.get('worst_http_p95_ms')} ms")
          print(f"- Worst HTTP p99: {performance.get('worst_http_p99_ms')} ms")
          if write_burst:
              print(f"- Ready vote burst: `{write_burst.get('selection')}`; users/tournament: {write_burst.get('users_per_tournament')}; time scale: {write_burst.get('time_scale')}")
              acceptance = write_burst.get("acceptance") or {}
              print(f"- Ready vote burst acceptance: {'healthy' if acceptance.get('healthy') else 'failed'}")
          if read_mix:
              print(f"- Read mix: {read_mix.get('users')} users; manual workspace refresh: {read_mix.get('manual_workspace_refresh')}")
          print()
          print("#### Bottleneck classes")
          for row in performance.get("bottleneck_classes") or []:
              if isinstance(row, dict):
                  print(f"- `{row.get('class')}`: {row.get('runs')} matrix runs")
              else:
                  print(f"- `{row}`")
          print()
          print("#### Manual browser inspection")
          print()
          print("| Tournament | Visibility | Control state | Team | Open |")
          print("|---|---|---|---|---|")
          for row in payload.get("rows") or []:
              control = (row.get("result") or {}).get("control_participant") or {}
              if not control:
                  continue
              slug = (row.get("result") or {}).get("tournament_slug") or ""
              link = f"[open](https://old-sparky.com/tournaments/{slug})" if slug else "-"
              team = control.get("team_name") or ("assigned" if control.get("assigned_to_team") else "not assigned")
              print(f"| `{slug}` | `{row.get('visibility')}` | `{control.get('state')}` | `{team}` | {link} |")
          print()
          print("The artifact contains the compact JSON and bounded remote log; detailed reports remain on the server until the cleanup workflow succeeds.")

      - name: Fail if production retained matrix failed
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.run-matrix.outputs.remote_exit_code }}" = "0" \
            || { echo "Production retained load matrix failed." >&2; exit 1; }
          /usr/bin/python3 - "$RUNNER_TEMP/production-retained-load-artifacts/matrix-summary.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("passed") is not True:
              raise SystemExit("matrix-summary.json does not report passed=true")
          PY
