name: Platform production retained load matrix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN-PRODUCTION-RETAINED-LOAD-MATRIX to create retained production data"
        required: true
        type: string
      control_email:
        description: "Existing account for manual registration, ready-check and team inspection"
        required: true
        default: "aleksei.lisitsin1@gmail.com"
        type: string
      concurrency:
        description: "Concurrent API workers for each matrix phase (1-256)"
        required: true
        default: "80"
        type: string
      profile:
        description: "Load profile; SSE profiles measure admission/fan-out and combined polling"
        required: true
        default: "matrix"
        type: choice
        options:
          - matrix
          - browser-polling
          - sse
          - combined
      sse_connections:
        description: "SSE connection attempts (1-10000; admission and fallback are measured separately)"
        required: true
        default: "128"
        type: string
      sse_duration:
        description: "SSE hold duration in seconds (1-600)"
        required: true
        default: "60"
        type: string
      sse_open_concurrency:
        description: "Concurrent SSE opens (1-10000)"
        required: true
        default: "256"
        type: string
      sse_open_timeout:
        description: "Client-side SSE handshake timeout before polling fallback (0.5-30 seconds)"
        required: true
        default: "5"
        type: string
      sse_reconnect_cycles:
        description: "Forced reconnect cycles per SSE client (0-10)"
        required: true
        default: "0"
        type: string
      sse_users_per_tournament:
        description: "Synthetic users per tournament: 50/250/500 for 1k/5k/10k"
        required: true
        default: "500"
        type: string
      sse_event_count:
        description: "Synthetic Redis fan-out probe events (0-100)"
        required: true
        default: "3"
        type: string
      sse_event_interval:
        description: "Seconds between fan-out probe events (0-60)"
        required: true
        default: "1"
        type: string
      sse_origin_mode:
        description: "SSE transport target; public includes Cloudflare, origin-local measures the VPS origin"
        required: true
        default: "public"
        type: choice
        options:
          - public
          - origin-local
      sse_admission_mode:
        description: "SSE admission path; signed ticket removes PostgreSQL from opening, legacy is the control"
        required: true
        default: "ticket"
        type: choice
        options:
          - ticket
          - legacy
      combined_polling_duration:
        description: "Combined polling window in seconds (1-300)"
        required: true
        default: "30"
        type: string
      combined_polling_open_stagger:
        description: "Combined polling opening stagger in seconds (0-600)"
        required: true
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  # The previous group was left holding GitHub startup-failure ghost runs;
  # version the operator workflow while keeping all new retained loads serial.
  group: platform-production-retained-load-matrix-v2
  cancel-in-progress: false

jobs:
  production-retained-load:
    name: Retained 10k-user load matrix on production
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      CONTROL_EMAIL: ${{ inputs.control_email }}
      QA_CONCURRENCY: ${{ inputs.concurrency }}
      QA_PROFILE: ${{ inputs.profile }}
      QA_SSE_CONNECTIONS: ${{ inputs.sse_connections }}
      QA_SSE_DURATION: ${{ inputs.sse_duration }}
      QA_SSE_OPEN_CONCURRENCY: ${{ inputs.sse_open_concurrency }}
      QA_SSE_OPEN_TIMEOUT: ${{ inputs.sse_open_timeout }}
      QA_SSE_RECONNECT_CYCLES: ${{ inputs.sse_reconnect_cycles }}
      QA_SSE_USERS_PER_TOURNAMENT: ${{ inputs.sse_users_per_tournament }}
      QA_SSE_EVENT_COUNT: ${{ inputs.sse_event_count }}
      QA_SSE_EVENT_INTERVAL: ${{ inputs.sse_event_interval }}
      QA_SSE_ORIGIN_MODE: ${{ inputs.sse_origin_mode }}
      QA_SSE_ADMISSION_MODE: ${{ inputs.sse_admission_mode }}
      QA_COMBINED_POLLING_DURATION: ${{ inputs.combined_polling_duration }}
      QA_COMBINED_POLLING_OPEN_STAGGER: ${{ inputs.combined_polling_open_stagger }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Validate explicit production load confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production retained load must run from the reviewed dev branch." >&2; exit 1; }
          test "$QA_CONFIRMATION" = "RUN-PRODUCTION-RETAINED-LOAD-MATRIX" \
            || { echo "Refusing production load without exact confirmation." >&2; exit 1; }
          test "$QA_PROFILE" = "matrix" || test "$QA_PROFILE" = "browser-polling" || \
            test "$QA_PROFILE" = "sse" || test "$QA_PROFILE" = "combined" \
            || { echo "Unsupported production load profile" >&2; exit 1; }
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }
          /usr/bin/python3 - \
            "$CONTROL_EMAIL" "$QA_CONCURRENCY" "$QA_PROFILE" \
            "$QA_SSE_CONNECTIONS" "$QA_SSE_DURATION" "$QA_SSE_OPEN_CONCURRENCY" \
            "$QA_SSE_OPEN_TIMEOUT" "$QA_SSE_RECONNECT_CYCLES" "$QA_SSE_USERS_PER_TOURNAMENT" \
            "$QA_SSE_EVENT_COUNT" "$QA_SSE_EVENT_INTERVAL" \
            "$QA_COMBINED_POLLING_DURATION" "$QA_COMBINED_POLLING_OPEN_STAGGER" \
            "$QA_SSE_ORIGIN_MODE" "$QA_SSE_ADMISSION_MODE" <<'PY'
          import re
          import sys

          (
              email,
              concurrency,
              profile,
              sse_connections,
              sse_duration,
              sse_open_concurrency,
              sse_open_timeout,
              sse_reconnect_cycles,
              sse_users_per_tournament,
              sse_event_count,
              sse_event_interval,
              combined_polling_duration,
              combined_polling_open_stagger,
              sse_origin_mode,
              sse_admission_mode,
          ) = sys.argv[1:]
          if not re.fullmatch(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+", email):
              raise SystemExit("control_email is invalid")
          if not re.fullmatch(r"[1-9][0-9]{0,2}", concurrency) or not 1 <= int(concurrency) <= 256:
              raise SystemExit("concurrency must be an integer from 1 to 256")
          if sse_origin_mode not in {"public", "origin-local"}:
              raise SystemExit("sse_origin_mode must be public or origin-local")
          if sse_admission_mode not in {"ticket", "legacy"}:
              raise SystemExit("sse_admission_mode must be ticket or legacy")
          if sse_origin_mode == "origin-local" and profile != "sse":
              raise SystemExit("origin-local is only supported for the SSE profile")
          if profile in {"sse", "combined"}:
              integer_ranges = {
                  "sse_connections": (sse_connections, 1, 10000),
                  "sse_open_concurrency": (sse_open_concurrency, 1, 10000),
                  "sse_reconnect_cycles": (sse_reconnect_cycles, 0, 10),
                  "sse_users_per_tournament": (sse_users_per_tournament, 10, 500),
                  "sse_event_count": (sse_event_count, 0, 100),
              }
              for name, (value, lower, upper) in integer_ranges.items():
                  if not re.fullmatch(r"[0-9]+", value) or not lower <= int(value) <= upper:
                      raise SystemExit(f"{name} must be between {lower} and {upper}")
              decimal_ranges = {
                  "sse_duration": (sse_duration, 1, 600),
                  "sse_open_timeout": (sse_open_timeout, 0.5, 30),
                  "sse_event_interval": (sse_event_interval, 0, 60),
                  "combined_polling_duration": (combined_polling_duration, 1, 300),
                  "combined_polling_open_stagger": (combined_polling_open_stagger, 0, 600),
              }
              for name, (value, lower, upper) in decimal_ranges.items():
                  try:
                      parsed = float(value)
                  except ValueError:
                      raise SystemExit(f"{name} must be numeric") from None
                  if not lower <= parsed <= upper:
                      raise SystemExit(f"{name} must be between {lower} and {upper}")
          PY

      - name: Configure production SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/production-retained-load-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" || { echo "Production SSH host exposed no ED25519 key" >&2; exit 1; }
          ssh_key_count="$(wc -l < "$ssh_scan" | tr -d ' ')"
          test "$ssh_key_count" = "1" || { echo "Expected exactly one production ED25519 host key" >&2; exit 1; }
          ssh_fingerprint="$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$ssh_fingerprint" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" || {
            echo "Production SSH host fingerprint mismatch" >&2
            exit 1
          }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run retained matrix on the live production server
        id: run-matrix
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          remote_log="$RUNNER_TEMP/production-retained-load-remote.log"
          ssh_output_file="$RUNNER_TEMP/production-retained-load-ssh-output"
          set +e
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            bash -s -- "$QA_CONFIRMATION" "$TARGET_SHA" "$CONTROL_EMAIL" "$QA_CONCURRENCY" "$GITHUB_RUN_ID" "$QA_PROFILE" \
              "$QA_SSE_CONNECTIONS" "$QA_SSE_DURATION" "$QA_SSE_OPEN_CONCURRENCY" "$QA_SSE_OPEN_TIMEOUT" "$QA_SSE_RECONNECT_CYCLES" \
              "$QA_SSE_USERS_PER_TOURNAMENT" "$QA_SSE_EVENT_COUNT" "$QA_SSE_EVENT_INTERVAL" \
              "$QA_COMBINED_POLLING_DURATION" "$QA_COMBINED_POLLING_OPEN_STAGGER" "$QA_SSE_ORIGIN_MODE" \
              "$QA_SSE_ADMISSION_MODE" \
            > "$ssh_output_file" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          confirmation="$1"
          target_sha="$2"
          control_email="$3"
          concurrency="$4"
          run_id="$5"
          profile="$6"
          shift 6
          sudo -n -- /root/old_sparky/platform/tools/platform_production_retained_load_matrix_qa.sh \
            "$confirmation" "$target_sha" "$control_email" "$concurrency" "$run_id" "$profile" "$@"
          REMOTE
          remote_status=$?
          set -e
          cp "$ssh_output_file" "$remote_log"
          cat "$remote_log"
          echo "remote_exit_code=$remote_status" >> "$GITHUB_OUTPUT"

          export_dir="$(sed -n 's/^PRODUCTION_RETAINED_LOAD_MATRIX_EXPORT=//p' "$remote_log" | tail -n 1)"
          if [[ -n "$export_dir" ]]; then
            [[ "$export_dir" =~ ^/tmp/old-sparky-production-retained-load-[0-9]+$ ]] || {
              echo "Remote report export path failed validation" >&2
              exit 1
            }
            install -d -m 700 "$RUNNER_TEMP/production-retained-load-artifacts"
            scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/matrix-summary.json" \
              "$RUNNER_TEMP/production-retained-load-artifacts/matrix-summary.json"
            scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/matrix.log" \
              "$RUNNER_TEMP/production-retained-load-artifacts/matrix.log"
            if ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "test -s '$export_dir/qa-command.log'"; then
              scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
                -i "$SSH_DIR/id_ed25519" \
                "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/qa-command.log" \
                "$RUNNER_TEMP/production-retained-load-artifacts/qa-command.log"
            fi
            if ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "test -s '$export_dir/server-observability.log'"; then
              scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
                -i "$SSH_DIR/id_ed25519" \
                "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/server-observability.log" \
                "$RUNNER_TEMP/production-retained-load-artifacts/server-observability.log"
            fi
          fi
          exit "$remote_status"

      - name: Publish production retained-load artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: platform-production-retained-load-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production-retained-load-artifacts/matrix-summary.json
            ${{ runner.temp }}/production-retained-load-artifacts/matrix.log
            ${{ runner.temp }}/production-retained-load-artifacts/qa-command.log
            ${{ runner.temp }}/production-retained-load-artifacts/server-observability.log
            ${{ runner.temp }}/production-retained-load-remote.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write production retained-load summary
        if: ${{ always() }}
        shell: bash
        run: |
          summary="$RUNNER_TEMP/production-retained-load-artifacts/matrix-summary.json"
          if [[ ! -s "$summary" ]]; then
            {
              echo "### Production retained 10k-user load matrix"
              echo
              echo "No matrix summary was exported from the production server."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          /usr/bin/python3 - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          performance = payload.get("performance_summary") or {}
          polling = payload.get("polling") or {}
          print("### Production retained 10k-user load matrix")
          print()
          print(f"- Profile: **{payload.get('mode', 'scale')}**")
          print(f"- Status: **{'passed' if payload.get('passed') else 'failed'}**")
          print(f"- Tournaments: {payload.get('completed_tournaments', 0)}/{payload.get('planned_tournaments', 0)}")
          print(f"- Generated users: {payload.get('completed_users', 0)}/{payload.get('planned_users', 0)}")
          print(f"- Planned teams: {payload.get('planned_teams', 0)}")
          print(f"- Worst HTTP p95: {performance.get('worst_http_p95_ms')} ms")
          print(f"- Worst HTTP p99: {performance.get('worst_http_p99_ms')} ms")
          if polling:
              print(f"- Polling tabs: {polling.get('tabs_planned')}; executed: {polling.get('executed')}; 304/not-modified: {polling.get('not_modified')}; deduped: {polling.get('deduped')}")
          sse = payload.get("sse") or {}
          if sse:
              connect_latency = sse.get("connect_latency_ms") or {}
              print(f"- SSE connections: {sse.get('connected')}/{sse.get('target_connections')}; 429 admissions: {sse.get('rejected_429')}; events: {sse.get('events')}; connect p95: {connect_latency.get('p95')} ms")
          print()
          print("#### Bottleneck classes")
          for row in performance.get("bottleneck_classes") or []:
              if isinstance(row, dict):
                  print(f"- `{row.get('class')}`: {row.get('runs')} matrix runs")
              else:
                  print(f"- `{row}`")
          print()
          print("#### Manual browser inspection")
          print()
          print("| Tournament | Visibility | Control state | Team | Open |")
          print("|---|---|---|---|---|")
          for row in payload.get("rows") or []:
              control = (row.get("result") or {}).get("control_participant") or {}
              if not control:
                  continue
              slug = (row.get("result") or {}).get("tournament_slug") or ""
              link = f"[open](https://old-sparky.com/tournaments/{slug})" if slug else "-"
              team = control.get("team_name") or ("assigned" if control.get("assigned_to_team") else "not assigned")
              print(f"| `{slug}` | `{row.get('visibility')}` | `{control.get('state')}` | `{team}` | {link} |")
          print()
          print("The artifact contains the compact JSON and bounded remote log; detailed reports remain on the server until the cleanup workflow succeeds.")

      - name: Fail if production retained matrix failed
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.run-matrix.outputs.remote_exit_code }}" = "0" \
            || { echo "Production retained load matrix failed." >&2; exit 1; }
          /usr/bin/python3 - "$RUNNER_TEMP/production-retained-load-artifacts/matrix-summary.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("passed") is not True:
              raise SystemExit("matrix-summary.json does not report passed=true")
          PY
