name: Platform production retained load abort

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ABORT-PRODUCTION-RETAINED-LOAD to stop one exact run"
        required: true
        type: string
      load_run_id:
        description: "GitHub run ID of the canceled production retained-load workflow"
        required: true
        type: string
      load_run_attempt:
        description: "Exact attempt number of the selected retained-load run"
        required: true
        type: string
      target_sha:
        description: "Exact source SHA currently deployed on the production VPS"
        required: true
        type: string
      security_run_id:
        description: "Exact successful Platform security and build run for this dev source SHA"
        required: true
        type: string
      security_run_attempt:
        description: "Exact attempt of that successful Security run"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-production-retained-load-abort
  cancel-in-progress: false

jobs:
  prepare-abort-helper:
    name: Prepare digest-bound retained-load abort helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      helper_sha256: ${{ steps.helper.outputs.sha256 }}
      source_sha: ${{ steps.helper.outputs.source_sha }}
      load_runner_sha: ${{ steps.selected-load.outputs.runner_sha }}
      terminal_recovery_enabled: ${{ steps.selected-load.outputs.terminal_recovery_enabled }}
      terminal_run_status: ${{ steps.selected-load.outputs.terminal_run_status }}
      terminal_run_conclusion: ${{ steps.selected-load.outputs.terminal_run_conclusion }}
      terminal_run_workflow_id: ${{ steps.selected-load.outputs.terminal_run_workflow_id }}
      terminal_run_head_sha: ${{ steps.selected-load.outputs.terminal_run_head_sha }}
      terminal_run_job_count: ${{ steps.selected-load.outputs.terminal_run_job_count }}
      terminal_run_failure_job_count: ${{ steps.selected-load.outputs.terminal_run_failure_job_count }}
      terminal_run_projection_sha256: ${{ steps.selected-load.outputs.terminal_run_projection_sha256 }}
    steps:
      - name: Require the reviewed dev workflow source
        shell: bash
        env:
          SECURITY_RUN_ID: ${{ inputs.security_run_id }}
          SECURITY_RUN_ATTEMPT: ${{ inputs.security_run_attempt }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_REF" = "refs/heads/dev"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SECURITY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SECURITY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]

      - name: Checkout the exact workflow source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact successful Security gates and trusted route
        id: source-security
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_RUN_ID: ${{ inputs.security_run_id }}
          SECURITY_RUN_ATTEMPT: ${{ inputs.security_run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$SECURITY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SECURITY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          metadata="$RUNNER_TEMP/retained-abort-source-security"
          install -d -m 700 "$metadata"
          trap 'rm -rf -- "$metadata"' EXIT
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/workflows/platform-security.yml" --output "$metadata/workflow.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$SECURITY_RUN_ID" --output "$metadata/latest-run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT" --output "$metadata/run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$metadata/jobs.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/commits/$SOURCE_SHA/statuses?per_page=100&page=1" --output "$metadata/statuses.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/git/ref/heads/dev" --output "$metadata/dev-ref.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$SECURITY_RUN_ID/artifacts?per_page=100&page=1" --output "$metadata/artifacts.json"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B - "$metadata" "$SECURITY_RUN_ID" "$SECURITY_RUN_ATTEMPT" "$SOURCE_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          run_id, attempt, source_sha, output_path = sys.argv[2:]
          if not re.fullmatch(r"[1-9][0-9]{0,19}", run_id) or not re.fullmatch(r"[1-9][0-9]{0,5}", attempt):
              raise SystemExit("exact Security identity is malformed")
          workflow = json.loads((root / "workflow.json").read_text(encoding="utf-8"))
          latest_run = json.loads((root / "latest-run.json").read_text(encoding="utf-8"))
          run = json.loads((root / "run.json").read_text(encoding="utf-8"))
          jobs_payload = json.loads((root / "jobs.json").read_text(encoding="utf-8"))
          statuses_payload = json.loads((root / "statuses.json").read_text(encoding="utf-8"))
          dev_ref = json.loads((root / "dev-ref.json").read_text(encoding="utf-8"))
          artifacts_payload = json.loads((root / "artifacts.json").read_text(encoding="utf-8"))
          jobs = jobs_payload.get("jobs") if isinstance(jobs_payload, dict) else None
          statuses = statuses_payload.get("statuses") if isinstance(statuses_payload, dict) else statuses_payload
          artifacts = artifacts_payload.get("artifacts") if isinstance(artifacts_payload, dict) else None
          if (not isinstance(jobs, list) or type(jobs_payload.get("total_count")) is not int
              or jobs_payload["total_count"] != len(jobs) or not 0 < len(jobs) <= 100):
              raise SystemExit("exact Security jobs response is incomplete")
          if (not isinstance(statuses, list) or len(statuses) >= 100
              or any(not isinstance(row, dict) for row in statuses)):
              raise SystemExit("exact Security status response is incomplete")
          if (not isinstance(artifacts, list) or type(artifacts_payload.get("total_count")) is not int
              or artifacts_payload["total_count"] != len(artifacts) or len(artifacts) > 100):
              raise SystemExit("exact Security artifact response is incomplete")
          if (not isinstance(dev_ref, dict) or dev_ref.get("ref") != "refs/heads/dev"
              or not isinstance(dev_ref.get("object"), dict)
              or dev_ref["object"].get("sha") != source_sha):
              raise SystemExit("dev has moved away from the exact Security source SHA")
          if (not isinstance(latest_run, dict)
              or latest_run.get("id") != int(run_id)
              or latest_run.get("run_attempt") != int(attempt)
              or latest_run.get("head_sha") != source_sha
              or latest_run.get("status") != "completed"
              or latest_run.get("conclusion") != "success"):
              raise SystemExit("supplied Security attempt is not the current successful attempt")
          sys.path.insert(0, str(Path.cwd() / "platform"))
          from tools.platform_workflow_provenance import validate_recovery_source_security_gates
          validate_recovery_source_security_gates(
              workflow, run, jobs, statuses,
              expected_run_id=int(run_id), expected_attempt=int(attempt),
              expected_target_sha=source_sha,
          )
          producer_rows = [row for row in jobs if isinstance(row, dict)
                           and row.get("name") == "CI route classifier"
                           and row.get("run_id") == int(run_id)
                           and row.get("run_attempt") == int(attempt)
                           and row.get("head_sha") == source_sha
                           and row.get("status") == "completed"
                           and row.get("conclusion") == "success"]
          if len(producer_rows) != 1:
              raise SystemExit("exact successful CI route job is missing")
          route_name = f"platform-ci-route-{run_id}-{attempt}"
          route_rows = [row for row in artifacts if isinstance(row, dict)
                        and row.get("name") == route_name and row.get("expired") is False]
          if len(route_rows) != 1:
              raise SystemExit("exact CI route artifact is missing or ambiguous")
          route = route_rows[0]
          workflow_run = route.get("workflow_run")
          if (type(route.get("id")) is not int or route["id"] <= 0
              or type(route.get("size_in_bytes")) is not int
              or not 0 < route["size_in_bytes"] <= 4 * 1024 * 1024
              or not isinstance(route.get("digest"), str)
              or re.fullmatch(r"sha256:[0-9a-f]{64}", route["digest"]) is None
              or not isinstance(workflow_run, dict)
              or workflow_run.get("id") != int(run_id)
              or workflow_run.get("head_sha") != source_sha
              or ("run_attempt" in workflow_run and workflow_run.get("run_attempt") != int(attempt))):
              raise SystemExit("CI route artifact provenance is not exact")
          with Path(output_path).open("a", encoding="ascii") as stream:
              stream.write(f"route_artifact_id={route['id']}\n")
              stream.write(f"route_artifact_digest={route['digest'][7:]}\n")
              stream.write(f"route_artifact_size={route['size_in_bytes']}\n")
          PY
          route_artifact_id="$(sed -n 's/^route_artifact_id=//p' "$GITHUB_OUTPUT")"
          route_artifact_digest="$(sed -n 's/^route_artifact_digest=//p' "$GITHUB_OUTPUT")"
          route_artifact_size="$(sed -n 's/^route_artifact_size=//p' "$GITHUB_OUTPUT")"
          [[ "$route_artifact_id" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$route_artifact_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$route_artifact_size" =~ ^[1-9][0-9]{0,8}$ ]]
          route_archive="$metadata/route.zip"
          curl --fail-with-body --silent --show-error --location --connect-timeout 10 --max-time 30 --max-filesize 4194304 \
            "${headers[@]}" "$api/actions/artifacts/$route_artifact_id/zip" --output "$route_archive"
          test "$(sha256sum "$route_archive" | awk '{print $1}')" = "$route_artifact_digest"
          test "$(stat -c '%s' "$route_archive")" = "$route_artifact_size"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B \
            platform/tools/platform_production_classifier_artifact.py manifest \
            "$route_archive" --target-sha "$SOURCE_SHA" >/dev/null

      - name: Resolve the selected external-load runner SHA from its exact attempt
        id: selected-load
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LOAD_RUN_ID: ${{ inputs.load_run_id }}
          LOAD_RUN_ATTEMPT: ${{ inputs.load_run_attempt }}
          DISPATCH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          [[ "$LOAD_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$LOAD_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]]
          metadata="$RUNNER_TEMP/retained-abort-selected-load"
          install -d -m 700 "$metadata"
          trap 'rm -rf -- "$metadata"' EXIT
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/workflows/platform-production-external-load.yml" --output "$metadata/workflow.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT" --output "$metadata/attempt.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID" --output "$metadata/latest-run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$metadata/jobs.json"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B - \
            "$metadata/workflow.json" "$metadata/attempt.json" "$metadata/latest-run.json" "$metadata/jobs.json" \
            "$LOAD_RUN_ID" "$LOAD_RUN_ATTEMPT" "$DISPATCH_ACTOR" "$GITHUB_OUTPUT" <<'PY'
          import json
          import hashlib
          from pathlib import Path
          import re
          import sys

          workflow_path, attempt_path, latest_run_path, jobs_path, run_id, attempt, dispatch_actor, output_path = sys.argv[1:]
          expected_path = ".github/workflows/platform-production-external-load.yml"
          if (re.fullmatch(r"[1-9][0-9]{0,31}", run_id) is None
              or re.fullmatch(r"[1-9][0-9]{0,8}", attempt) is None
              or not dispatch_actor or len(dispatch_actor) > 100):
              raise SystemExit("selected external-load identity is malformed")
          workflow = json.loads(Path(workflow_path).read_text(encoding="utf-8"))
          selected = json.loads(Path(attempt_path).read_text(encoding="utf-8"))
          latest = json.loads(Path(latest_run_path).read_text(encoding="utf-8"))
          jobs_payload = json.loads(Path(jobs_path).read_text(encoding="utf-8"))
          repository = selected.get("repository") if isinstance(selected, dict) else None
          runner_sha = selected.get("head_sha") if isinstance(selected, dict) else None
          actor = selected.get("actor") if isinstance(selected, dict) else None
          latest_repository = latest.get("repository") if isinstance(latest, dict) else None
          latest_actor = latest.get("actor") if isinstance(latest, dict) else None
          if not isinstance(workflow, dict) or type(workflow.get("id")) is not int or workflow["id"] <= 0:
              raise SystemExit("external-load workflow identity is unavailable")
          if (
              workflow.get("path") != expected_path
              or not isinstance(selected, dict)
              or type(selected.get("id")) is not int
              or selected["id"] != int(run_id)
              or type(selected.get("run_attempt")) is not int
              or selected["run_attempt"] != int(attempt)
              or selected.get("workflow_id") != workflow["id"]
              or selected.get("path") != expected_path
              or selected.get("head_branch") != "dev"
              or selected.get("event") != "workflow_dispatch"
              or not isinstance(repository, dict)
              or repository.get("full_name") != "StrayForest/old_sparky"
              or not isinstance(runner_sha, str)
              or re.fullmatch(r"[0-9a-f]{40}", runner_sha) is None
              or not isinstance(actor, dict)
              or actor.get("login") != dispatch_actor
              or not isinstance(latest, dict)
              or type(latest.get("id")) is not int
              or latest["id"] != int(run_id)
              or latest.get("run_attempt") != int(attempt)
              or latest.get("workflow_id") != workflow["id"]
              or latest.get("path") != expected_path
              or latest.get("head_branch") != "dev"
              or latest.get("event") != "workflow_dispatch"
              or latest.get("head_sha") != runner_sha
              or latest.get("status") != selected.get("status")
              or latest.get("conclusion") != selected.get("conclusion")
              or not isinstance(latest_repository, dict)
              or latest_repository.get("full_name") != "StrayForest/old_sparky"
              or not isinstance(latest_actor, dict)
              or latest_actor.get("login") != dispatch_actor
              or latest_actor.get("id") != actor.get("id")
          ):
              raise SystemExit("selected external-load attempt is not exact")
          recovery_enabled = latest.get("status") == "completed" and latest.get("conclusion") == "failure"
          controller_projection = None
          job_count = 0
          failure_job_count = 0
          if recovery_enabled:
              jobs = jobs_payload.get("jobs") if isinstance(jobs_payload, dict) else None
              if (not isinstance(jobs, list) or type(jobs_payload.get("total_count")) is not int
                  or jobs_payload["total_count"] != len(jobs) or not 0 < len(jobs) <= 100):
                  raise SystemExit("terminal external-load jobs response is incomplete")
              if selected.get("status") != "completed" or selected.get("conclusion") != "failure":
                  raise SystemExit("selected external-load attempt is not terminal failure")
              normalized_jobs = []
              for row in jobs:
                  if (not isinstance(row, dict) or type(row.get("id")) is not int or row["id"] <= 0
                      or row.get("run_id") != int(run_id) or row.get("run_attempt") != int(attempt)
                      or row.get("head_sha") != runner_sha or row.get("status") != "completed"
                      or row.get("conclusion") not in {"success", "failure", "skipped"}):
                      raise SystemExit("terminal external-load jobs include a nonterminal or mismatched row")
                  normalized_jobs.append({
                      "id": row["id"], "run_id": int(run_id), "run_attempt": int(attempt),
                      "head_sha": runner_sha, "status": row["status"], "conclusion": row["conclusion"],
                  })
              if len({row["id"] for row in normalized_jobs}) != len(normalized_jobs):
                  raise SystemExit("terminal external-load jobs contain duplicate identities")
              job_count = len(normalized_jobs)
              failure_job_count = sum(row["conclusion"] == "failure" for row in normalized_jobs)
              if failure_job_count < 1:
                  raise SystemExit("failed external-load run has no failed terminal job")
              if (actor.get("id") is None or type(actor.get("id")) is not int or actor["id"] <= 0
                  or latest.get("status") != "completed" or latest.get("conclusion") != "failure"):
                  raise SystemExit("terminal external-load run or actor identity is invalid")
              controller_projection = {
                  "schema": 1, "repository": "StrayForest/old_sparky", "workflow_path": expected_path,
                  "event": "workflow_dispatch", "head_branch": "dev", "run_id": int(run_id),
                  "run_attempt": int(attempt), "workflow_id": workflow["id"], "status": "completed",
                  "conclusion": "failure", "head_sha": runner_sha, "actor_id": actor["id"],
                  "jobs": sorted(normalized_jobs, key=lambda row: row["id"]),
              }
          with Path(output_path).open("a", encoding="ascii") as stream:
              stream.write(f"runner_sha={runner_sha}\n")
              stream.write(f"terminal_recovery_enabled={'true' if recovery_enabled else 'false'}\n")
              if recovery_enabled:
                  projection_sha = hashlib.sha256(
                      json.dumps(controller_projection, ensure_ascii=True, sort_keys=True,
                                 separators=(",", ":"), allow_nan=False).encode("ascii")
                  ).hexdigest()
                  stream.write("terminal_run_status=completed\n")
                  stream.write("terminal_run_conclusion=failure\n")
                  stream.write(f"terminal_run_workflow_id={workflow['id']}\n")
                  stream.write(f"terminal_run_head_sha={runner_sha}\n")
                  stream.write(f"terminal_run_job_count={job_count}\n")
                  stream.write(f"terminal_run_failure_job_count={failure_job_count}\n")
                  stream.write(f"terminal_run_projection_sha256={projection_sha}\n")
          PY
          runner_sha="$(sed -n 's/^runner_sha=//p' "$GITHUB_OUTPUT")"
          [[ "$runner_sha" =~ ^[0-9a-f]{40}$ ]]
          recovery_enabled="$(sed -n 's/^terminal_recovery_enabled=//p' "$GITHUB_OUTPUT")"
          [[ "$recovery_enabled" == true || "$recovery_enabled" == false ]]
          if [[ "$recovery_enabled" == true ]]; then
            terminal_status="$(sed -n 's/^terminal_run_status=//p' "$GITHUB_OUTPUT")"
            terminal_conclusion="$(sed -n 's/^terminal_run_conclusion=//p' "$GITHUB_OUTPUT")"
            terminal_workflow_id="$(sed -n 's/^terminal_run_workflow_id=//p' "$GITHUB_OUTPUT")"
            terminal_head_sha="$(sed -n 's/^terminal_run_head_sha=//p' "$GITHUB_OUTPUT")"
            terminal_job_count="$(sed -n 's/^terminal_run_job_count=//p' "$GITHUB_OUTPUT")"
            terminal_failure_count="$(sed -n 's/^terminal_run_failure_job_count=//p' "$GITHUB_OUTPUT")"
            terminal_projection_sha="$(sed -n 's/^terminal_run_projection_sha256=//p' "$GITHUB_OUTPUT")"
            [[ "$terminal_status" == completed && "$terminal_conclusion" == failure ]]
            [[ "$terminal_workflow_id" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$terminal_head_sha" == "$runner_sha" ]]
            [[ "$terminal_job_count" =~ ^[1-9][0-9]{0,2}$ && "$terminal_job_count" -le 100 ]]
            [[ "$terminal_failure_count" =~ ^[1-9][0-9]{0,2}$ && "$terminal_failure_count" -le "$terminal_job_count" ]]
            [[ "$terminal_projection_sha" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Pin the exact helper bytes
        id: helper
        shell: bash
        run: |
          set -euo pipefail
          helper="platform/tools/platform_abort_retained_load.py"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -f "$helper" && test ! -L "$helper"
          test "$(stat -c '%F:%h' "$helper")" = "regular file:1"
          test "$(stat -c '%s' "$helper")" -le 131072
          digest="$(sha256sum "$helper" | awk '{print $1}')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          chmod 600 "$helper"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload the single-file source-bound helper
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-retained-load-abort-helper-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/tools/platform_abort_retained_load.py
          if-no-files-found: error
          retention-days: 1

  abort:
    name: Abort one exact retained-load process tree on production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare-abort-helper
    environment: production
    env:
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      LOAD_RUN_ID: ${{ inputs.load_run_id }}
      LOAD_RUN_ATTEMPT: ${{ inputs.load_run_attempt }}
      TARGET_SHA: ${{ inputs.target_sha }}
      LOAD_RUNNER_SHA: ${{ needs.prepare-abort-helper.outputs.load_runner_sha }}
      LOAD_TERMINAL_RECOVERY_ENABLED: ${{ needs.prepare-abort-helper.outputs.terminal_recovery_enabled }}
      LOAD_TERMINAL_RUN_STATUS: ${{ needs.prepare-abort-helper.outputs.terminal_run_status }}
      LOAD_TERMINAL_RUN_CONCLUSION: ${{ needs.prepare-abort-helper.outputs.terminal_run_conclusion }}
      LOAD_TERMINAL_RUN_WORKFLOW_ID: ${{ needs.prepare-abort-helper.outputs.terminal_run_workflow_id }}
      LOAD_TERMINAL_RUN_HEAD_SHA: ${{ needs.prepare-abort-helper.outputs.terminal_run_head_sha }}
      LOAD_TERMINAL_RUN_JOB_COUNT: ${{ needs.prepare-abort-helper.outputs.terminal_run_job_count }}
      LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT: ${{ needs.prepare-abort-helper.outputs.terminal_run_failure_job_count }}
      LOAD_TERMINAL_RUN_PROJECTION_SHA256: ${{ needs.prepare-abort-helper.outputs.terminal_run_projection_sha256 }}
      SECURITY_RUN_ID: ${{ inputs.security_run_id }}
      SECURITY_RUN_ATTEMPT: ${{ inputs.security_run_attempt }}

    steps:
      - name: Validate explicit abort confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production abort must run from the reviewed dev branch." >&2; exit 1; }
          [[ "$SECURITY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] \
            || { echo "security_run_id must be a positive decimal identifier." >&2; exit 1; }
          [[ "$SECURITY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]] \
            || { echo "security_run_attempt must be a positive decimal attempt." >&2; exit 1; }
          test "$QA_CONFIRMATION" = "ABORT-PRODUCTION-RETAINED-LOAD" \
            || { echo "Refusing abort without exact confirmation." >&2; exit 1; }
          [[ "$LOAD_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "load_run_id must be a positive decimal identifier." >&2; exit 1; }
          [[ "$LOAD_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]] \
            || { echo "load_run_attempt must be a positive decimal attempt." >&2; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "target_sha must be a lowercase 40-character commit SHA." >&2; exit 1; }
          [[ "$LOAD_RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "selected load runner SHA is unavailable." >&2; exit 1; }
          [[ "$LOAD_TERMINAL_RECOVERY_ENABLED" == true || "$LOAD_TERMINAL_RECOVERY_ENABLED" == false ]] \
            || { echo "selected load terminal recovery state is unavailable." >&2; exit 1; }
          if [[ "$LOAD_TERMINAL_RECOVERY_ENABLED" == true ]]; then
            [[ "$LOAD_TERMINAL_RUN_STATUS" == completed && "$LOAD_TERMINAL_RUN_CONCLUSION" == failure ]]
            [[ "$LOAD_TERMINAL_RUN_WORKFLOW_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$LOAD_TERMINAL_RUN_HEAD_SHA" == "$LOAD_RUNNER_SHA" ]]
            [[ "$LOAD_TERMINAL_RUN_JOB_COUNT" =~ ^[1-9][0-9]{0,2}$ && "$LOAD_TERMINAL_RUN_JOB_COUNT" -le 100 ]]
            [[ "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT" =~ ^[1-9][0-9]{0,2}$ && "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT" -le "$LOAD_TERMINAL_RUN_JOB_COUNT" ]]
            [[ "$LOAD_TERMINAL_RUN_PROJECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          else
            [[ -z "$LOAD_TERMINAL_RUN_STATUS$LOAD_TERMINAL_RUN_CONCLUSION$LOAD_TERMINAL_RUN_WORKFLOW_ID$LOAD_TERMINAL_RUN_HEAD_SHA$LOAD_TERMINAL_RUN_JOB_COUNT$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT$LOAD_TERMINAL_RUN_PROJECTION_SHA256" ]]
          fi

      - name: Download and verify the source-bound recovery helper
        id: helper
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-retained-load-abort-helper-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-load-abort-helper

      - name: Validate the closed helper artifact
        shell: bash
        env:
          EXPECTED_HELPER_SHA256: ${{ needs.prepare-abort-helper.outputs.helper_sha256 }}
          EXPECTED_HELPER_SOURCE_SHA: ${{ needs.prepare-abort-helper.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$EXPECTED_HELPER_SOURCE_SHA" = "$GITHUB_SHA"
          [[ "$EXPECTED_HELPER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          helper_dir="$RUNNER_TEMP/retained-load-abort-helper"
          test "$(stat -c '%F:%a:%h' "$helper_dir")" = "directory:755:2"
          /usr/bin/python3 -I -B - "$helper_dir" "$EXPECTED_HELPER_SHA256" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import stat
          import sys

          directory = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          entries = list(directory.iterdir())
          if len(entries) != 1 or entries[0].name != "platform_abort_retained_load.py":
              raise SystemExit("abort helper artifact member roster is invalid")
          path = entries[0]
          metadata = path.lstat()
          if (
              not stat.S_ISREG(metadata.st_mode)
              or stat.S_ISLNK(metadata.st_mode)
              or metadata.st_nlink != 1
              or metadata.st_size <= 0
              or metadata.st_size > 131072
          ):
              raise SystemExit("abort helper artifact member is unsafe")
          descriptor = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
          try:
              opened = os.fstat(descriptor)
              if (opened.st_dev, opened.st_ino, opened.st_size) != (
                  metadata.st_dev, metadata.st_ino, metadata.st_size
              ):
                  raise SystemExit("abort helper artifact changed during read")
              digest = hashlib.sha256()
              while chunk := os.read(descriptor, 65536):
                  digest.update(chunk)
              after = os.fstat(descriptor)
              if (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns) != (
                  opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns
              ):
                  raise SystemExit("abort helper artifact changed during hashing")
          finally:
              os.close(descriptor)
          if digest.hexdigest() != expected_sha:
              raise SystemExit("abort helper artifact digest mismatch")
          path.chmod(0o600)
          if stat.S_IMODE(path.stat().st_mode) != 0o600:
              raise SystemExit("abort helper artifact permissions are invalid")
          PY

      - name: Configure production SSH
        id: configure_ssh
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/production-retained-abort-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            ssh_scan_rc=0
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null; then
              :
            else
              ssh_scan_rc=$?
            fi
            if (( ssh_scan_rc == 0 )) \
              && awk -v host="$PROD_SSH_HOST" '/^[[:space:]]*($|#)/ { next } { records++; if (NF == 3 && $1 == host && $2 == "ssh-ed25519") { valid=1; next } { invalid=1 } } END { exit !(records == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            ssh_scan_line_count="$(awk 'END {print NR + 0}' "$ssh_scan_attempt")"
            read -r ssh_scan_record_count ssh_scan_host_token_valid ssh_scan_key_type_valid < <(
              awk -v host="$PROD_SSH_HOST" '
                /^[[:space:]]*($|#)/ { next }
                {
                  records++
                  if (NF != 3 || $1 != host) host_invalid=1
                  if (NF != 3 || $2 != "ssh-ed25519") type_invalid=1
                }
                END { printf "%d %d %d\n", records + 0, (records == 1 && !host_invalid), (records == 1 && !type_invalid) }
              ' "$ssh_scan_attempt"
            )
            ssh_scan_fingerprint_match=0
            if (( ssh_scan_record_count == 1 )); then
              ssh_scan_fingerprint="$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}' || true)"
              if [[ "$ssh_scan_fingerprint" == "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" ]]; then
                ssh_scan_fingerprint_match=1
              fi
            fi
            printf 'SSH_KEYSCAN_DIAGNOSTIC rc=%s lines=%s records=%s host_token_valid=%s key_type_valid=%s fingerprint_match=%s\n' \
              "$ssh_scan_rc" "$ssh_scan_line_count" "$ssh_scan_record_count" "$ssh_scan_host_token_valid" "$ssh_scan_key_type_valid" "$ssh_scan_fingerprint_match" >&2
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Revalidate exact failed load attempt immediately before SSH
        id: revalidate_terminal_before_ssh
        if: ${{ env.LOAD_TERMINAL_RECOVERY_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          [[ "$LOAD_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$LOAD_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]]
          metadata="$RUNNER_TEMP/retained-abort-terminal-pre-ssh"
          install -d -m 700 "$metadata"
          trap 'rm -rf -- "$metadata"' EXIT
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID" --output "$metadata/latest.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT" --output "$metadata/attempt.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$metadata/jobs.json"
          validator="$RUNNER_TEMP/retained-abort-terminal-validator.py"
          cat > "$validator" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          latest_path, attempt_path, jobs_path, run_id, attempt, head_sha, dispatch_actor, workflow_id, expected_jobs, expected_failures, expected_sha = sys.argv[1:]
          latest = json.loads(Path(latest_path).read_text(encoding="utf-8"))
          selected = json.loads(Path(attempt_path).read_text(encoding="utf-8"))
          jobs_payload = json.loads(Path(jobs_path).read_text(encoding="utf-8"))
          path = ".github/workflows/platform-production-external-load.yml"
          repository = latest.get("repository") if isinstance(latest, dict) else None
          selected_repository = selected.get("repository") if isinstance(selected, dict) else None
          latest_actor = latest.get("actor") if isinstance(latest, dict) else None
          actor = selected.get("actor") if isinstance(selected, dict) else None
          if (not isinstance(latest, dict) or not isinstance(selected, dict)
              or latest.get("id") != int(run_id) or selected.get("id") != int(run_id)
              or latest.get("run_attempt") != int(attempt) or selected.get("run_attempt") != int(attempt)
              or latest.get("status") != "completed" or selected.get("status") != "completed"
              or latest.get("conclusion") != "failure" or selected.get("conclusion") != "failure"
              or latest.get("workflow_id") != int(workflow_id) or selected.get("workflow_id") != int(workflow_id)
              or latest.get("path") != path or selected.get("path") != path
              or latest.get("head_branch") != "dev" or selected.get("head_branch") != "dev"
              or latest.get("event") != "workflow_dispatch" or selected.get("event") != "workflow_dispatch"
              or latest.get("head_sha") != head_sha or selected.get("head_sha") != head_sha
              or not isinstance(repository, dict) or repository.get("full_name") != "StrayForest/old_sparky"
              or not isinstance(selected_repository, dict)
              or selected_repository.get("full_name") != "StrayForest/old_sparky"
              or not isinstance(latest_actor, dict)
              or latest_actor.get("login") != dispatch_actor
              or type(latest_actor.get("id")) is not int or latest_actor["id"] <= 0
              or not isinstance(actor, dict) or actor.get("login") != dispatch_actor
              or type(actor.get("id")) is not int or actor["id"] <= 0):
              raise SystemExit("selected load attempt is no longer the exact failed terminal run")
          if latest_actor["id"] != actor["id"]:
              raise SystemExit("selected load attempt actor changed")
          jobs = jobs_payload.get("jobs") if isinstance(jobs_payload, dict) else None
          if (not isinstance(jobs, list) or type(jobs_payload.get("total_count")) is not int
              or jobs_payload["total_count"] != len(jobs) or len(jobs) != int(expected_jobs)
              or not 0 < len(jobs) <= 100):
              raise SystemExit("selected load terminal job set is incomplete")
          normalized = []
          for row in jobs:
              if (not isinstance(row, dict) or type(row.get("id")) is not int or row["id"] <= 0
                  or row.get("run_id") != int(run_id) or row.get("run_attempt") != int(attempt)
                  or row.get("head_sha") != head_sha or row.get("status") != "completed"
                  or row.get("conclusion") not in {"success", "failure", "skipped"}):
                  raise SystemExit("selected load terminal jobs include a pending or mismatched row")
              normalized.append({"id": row["id"], "run_id": int(run_id), "run_attempt": int(attempt),
                                "head_sha": head_sha, "status": row["status"], "conclusion": row["conclusion"]})
          if len({row["id"] for row in normalized}) != len(normalized):
              raise SystemExit("selected load terminal jobs contain duplicate identities")
          failures = sum(row["conclusion"] == "failure" for row in normalized)
          if failures != int(expected_failures) or failures < 1:
              raise SystemExit("selected load terminal failure set changed")
          projection = {"schema": 1, "repository": "StrayForest/old_sparky", "workflow_path": path,
                        "event": "workflow_dispatch", "head_branch": "dev", "run_id": int(run_id),
                        "run_attempt": int(attempt), "workflow_id": int(workflow_id), "status": "completed",
                        "conclusion": "failure", "head_sha": head_sha, "actor_id": actor["id"],
                        "jobs": sorted(normalized, key=lambda row: row["id"])}
          actual_sha = hashlib.sha256(json.dumps(projection, ensure_ascii=True, sort_keys=True,
                                                 separators=(",", ":"), allow_nan=False).encode("ascii")).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit("selected load terminal controller projection changed")
          PY
          chmod 600 "$validator"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B "$validator" \
            "$metadata/latest.json" "$metadata/attempt.json" "$metadata/jobs.json" \
            "$LOAD_RUN_ID" "$LOAD_RUN_ATTEMPT" "$LOAD_RUNNER_SHA" "$GITHUB_ACTOR" \
            "$LOAD_TERMINAL_RUN_WORKFLOW_ID" "$LOAD_TERMINAL_RUN_JOB_COUNT" \
            "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT" "$LOAD_TERMINAL_RUN_PROJECTION_SHA256"
          printf '%s\n' 'exact failed load attempt revalidated before SSH'

      - name: Abort the exact production load process tree
        id: abort_remote
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          HELPER_SHA256: ${{ needs.prepare-abort-helper.outputs.helper_sha256 }}
          HELPER_SOURCE_SHA: ${{ needs.prepare-abort-helper.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/production-retained-abort-artifacts"
          install -d -m 700 "$artifact_dir"
          helper_file="$RUNNER_TEMP/retained-load-abort-helper/platform_abort_retained_load.py"
          ssh_output_file="$artifact_dir/abort-raw.log"
          incoming="/tmp/oldsparky-retained-abort-helper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          stage="/run/oldsparky-retained-abort-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          : > "$ssh_output_file"
          chmod 600 "$ssh_output_file"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$LOAD_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$LOAD_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          terminal_args=()
          if [[ "$LOAD_TERMINAL_RECOVERY_ENABLED" == true ]]; then
            [[ "$LOAD_TERMINAL_RUN_STATUS" == completed && "$LOAD_TERMINAL_RUN_CONCLUSION" == failure ]]
            [[ "$LOAD_TERMINAL_RUN_WORKFLOW_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$LOAD_TERMINAL_RUN_HEAD_SHA" == "$LOAD_RUNNER_SHA" ]]
            [[ "$LOAD_TERMINAL_RUN_JOB_COUNT" =~ ^[1-9][0-9]{0,2}$ && "$LOAD_TERMINAL_RUN_JOB_COUNT" -le 100 ]]
            [[ "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT" =~ ^[1-9][0-9]{0,2}$ && "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT" -le "$LOAD_TERMINAL_RUN_JOB_COUNT" ]]
            [[ "$LOAD_TERMINAL_RUN_PROJECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
            terminal_args=(
              --terminal-run-status "$LOAD_TERMINAL_RUN_STATUS"
              --terminal-run-conclusion "$LOAD_TERMINAL_RUN_CONCLUSION"
              --terminal-run-workflow-id "$LOAD_TERMINAL_RUN_WORKFLOW_ID"
              --terminal-run-head-sha "$LOAD_TERMINAL_RUN_HEAD_SHA"
              --terminal-run-job-count "$LOAD_TERMINAL_RUN_JOB_COUNT"
              --terminal-run-failure-job-count "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT"
              --terminal-run-projection-sha256 "$LOAD_TERMINAL_RUN_PROJECTION_SHA256"
            )
          else
            [[ "$LOAD_TERMINAL_RECOVERY_ENABLED" == false ]]
            [[ -z "$LOAD_TERMINAL_RUN_STATUS$LOAD_TERMINAL_RUN_CONCLUSION$LOAD_TERMINAL_RUN_WORKFLOW_ID$LOAD_TERMINAL_RUN_HEAD_SHA$LOAD_TERMINAL_RUN_JOB_COUNT$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT$LOAD_TERMINAL_RUN_PROJECTION_SHA256" ]]
          fi
          [[ "$HELPER_SOURCE_SHA" = "$GITHUB_SHA" ]]
          [[ "$HELPER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "$helper_file" | awk '{print $1}')" = "$HELPER_SHA256"
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "test ! -e '$incoming' && test ! -L '$incoming' && test ! -e '$stage' && test ! -L '$stage'"
          scp \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i "$SSH_DIR/id_ed25519" \
            "$helper_file" "$PROD_SSH_USER@$PROD_SSH_HOST:$incoming"
          ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" "chmod 600 '$incoming'"
          if [[ "$LOAD_TERMINAL_RECOVERY_ENABLED" == true ]]; then
            recheck_dir="$RUNNER_TEMP/retained-abort-terminal-immediate-pre-remote"
            validator="$RUNNER_TEMP/retained-abort-terminal-validator.py"
            install -d -m 700 "$recheck_dir"
            trap 'rm -rf -- "$recheck_dir"' EXIT
            test -f "$validator" && test ! -L "$validator"
            test "$(stat -c '%F:%a:%h' "$validator")" = "regular file:600:1"
            api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
            headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
              "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID" --output "$recheck_dir/latest.json"
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
              "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT" --output "$recheck_dir/attempt.json"
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
              "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$recheck_dir/jobs.json"
            env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B "$validator" \
              "$recheck_dir/latest.json" "$recheck_dir/attempt.json" "$recheck_dir/jobs.json" \
              "$LOAD_RUN_ID" "$LOAD_RUN_ATTEMPT" "$LOAD_RUNNER_SHA" "$GITHUB_ACTOR" \
              "$LOAD_TERMINAL_RUN_WORKFLOW_ID" "$LOAD_TERMINAL_RUN_JOB_COUNT" \
              "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT" "$LOAD_TERMINAL_RUN_PROJECTION_SHA256"
            rm -rf -- "$recheck_dir"
            trap - EXIT
          fi
          set +e
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            sudo -n -- /usr/bin/bash -s -- \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$HELPER_SHA256" \
              "$HELPER_SOURCE_SHA" "$TARGET_SHA" "$LOAD_RUNNER_SHA" "$LOAD_RUN_ID" \
              "$LOAD_RUN_ATTEMPT" "$QA_CONFIRMATION" "${terminal_args[@]}" > "$ssh_output_file" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          workflow_run_id="${1:-}"
          workflow_attempt="${2:-}"
          helper_sha="${3:-}"
          workflow_sha="${4:-}"
          target_sha="${5:-}"
          load_runner_sha="${6:-}"
          load_run_id="${7:-}"
          load_run_attempt="${8:-}"
          confirmation="${9:-}"
          shift 9
          terminal_args=("$@")
          [[ "$workflow_run_id" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$workflow_attempt" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$helper_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$workflow_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$load_runner_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$load_run_id" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$load_run_attempt" =~ ^[1-9][0-9]{0,8}$ ]]
          test "$confirmation" = ABORT-PRODUCTION-RETAINED-LOAD
          if ((${#terminal_args[@]} != 0)); then
            ((${#terminal_args[@]} == 14))
            test "${terminal_args[0]}" = --terminal-run-status
            test "${terminal_args[1]}" = completed
            test "${terminal_args[2]}" = --terminal-run-conclusion
            test "${terminal_args[3]}" = failure
            test "${terminal_args[4]}" = --terminal-run-workflow-id
            [[ "${terminal_args[5]}" =~ ^[1-9][0-9]{0,19}$ ]]
            test "${terminal_args[6]}" = --terminal-run-head-sha
            test "${terminal_args[7]}" = "$load_runner_sha"
            test "${terminal_args[8]}" = --terminal-run-job-count
            [[ "${terminal_args[9]}" =~ ^[1-9][0-9]{0,2}$ && "${terminal_args[9]}" -le 100 ]]
            test "${terminal_args[10]}" = --terminal-run-failure-job-count
            [[ "${terminal_args[11]}" =~ ^[1-9][0-9]{0,2}$ && "${terminal_args[11]}" -le "${terminal_args[9]}" ]]
            test "${terminal_args[12]}" = --terminal-run-projection-sha256
            [[ "${terminal_args[13]}" =~ ^[0-9a-f]{64}$ ]]
          fi
          test "$(id -u)" -eq 0
          incoming="/tmp/oldsparky-retained-abort-helper-${workflow_run_id}-${workflow_attempt}.py"
          stage="/run/oldsparky-retained-abort-${workflow_run_id}-${workflow_attempt}"
          test ! -L /run
          test "$(stat -c '%F:%u:%g:%a' /run)" = "directory:0:0:755"
          caller_uid="${SUDO_UID:-0}"
          caller_gid="${SUDO_GID:-0}"
          [[ "$caller_uid" =~ ^[0-9]{1,10}$ && "$caller_gid" =~ ^[0-9]{1,10}$ ]]
          test "$(stat -c '%F:%u:%g:%a:%h' "$incoming")" = "regular file:${caller_uid}:${caller_gid}:600:1"
          test "$(stat -c '%s' "$incoming")" -le 131072
          mkdir -m 0700 -- "$stage"
          test "$(stat -c '%F:%u:%g:%a:%h' "$stage")" = "directory:0:0:700:2"
          helper="$stage/platform_abort_retained_load.py"
          test ! -e "$helper" && test ! -L "$helper"
          /usr/bin/install -o root -g root -m 0500 -- "$incoming" "$helper"
          test "$(stat -c '%F:%u:%g:%a:%h' "$helper")" = "regular file:0:0:500:1"
          test "$(sha256sum "$helper" | awk '{print $1}')" = "$helper_sha"
          /usr/bin/python3.12 -I -B "$helper" \
            "$confirmation" "$target_sha" "$load_run_id" "$load_run_attempt" \
            --expected-runner-sha "$load_runner_sha" \
            --recovery-workflow-sha "$workflow_sha" \
            --recovery-helper-sha256 "$helper_sha" \
            "${terminal_args[@]}"
          REMOTE
          remote_status=$?
          set -e
          if [[ "$LOAD_TERMINAL_RECOVERY_ENABLED" == true ]]; then
            set +e
            (
              set -euo pipefail
              umask 077
              recheck_dir="$RUNNER_TEMP/retained-abort-terminal-immediate-post-ssh"
              validator="$RUNNER_TEMP/retained-abort-terminal-validator.py"
              install -d -m 700 "$recheck_dir"
              trap 'rm -rf -- "$recheck_dir"' EXIT
              test -f "$validator" && test ! -L "$validator"
              test "$(stat -c '%F:%a:%h' "$validator")" = "regular file:600:1"
              api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
              headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
                "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID" --output "$recheck_dir/latest.json"
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
                "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT" --output "$recheck_dir/attempt.json"
              curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
                "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$recheck_dir/jobs.json"
              env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B "$validator" \
                "$recheck_dir/latest.json" "$recheck_dir/attempt.json" "$recheck_dir/jobs.json" \
                "$LOAD_RUN_ID" "$LOAD_RUN_ATTEMPT" "$LOAD_RUNNER_SHA" "$GITHUB_ACTOR" \
                "$LOAD_TERMINAL_RUN_WORKFLOW_ID" "$LOAD_TERMINAL_RUN_JOB_COUNT" \
                "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT" "$LOAD_TERMINAL_RUN_PROJECTION_SHA256"
            )
            immediate_recheck_status=$?
            set -e
            if [[ "$immediate_recheck_status" != 0 ]]; then
              printf '%s\n' 'Exact terminal load attempt revalidation immediately after remote abort failed.' >&2
              if [[ "$remote_status" != 0 ]]; then
                exit "$remote_status"
              fi
              exit 1
            fi
          fi
          export_dir="$(sed -n 's/^ABORT_EVIDENCE_EXPORT=//p' "$ssh_output_file" | tail -n 1)"
          if [[ -n "$export_dir" ]]; then
            [[ "$export_dir" =~ ^/tmp/old-sparky-production-retained-abort-[0-9]+$ ]] || {
              echo "Abort evidence export path failed validation" >&2
              exit 1
            }
            copy_if_present() {
              local name="$1"
              if ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
                -i "$SSH_DIR/id_ed25519" \
                "$PROD_SSH_USER@$PROD_SSH_HOST" \
                "test -s '$export_dir/$name'"; then
                scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
                  -i "$SSH_DIR/id_ed25519" \
                  "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/$name" \
                  "$artifact_dir/$name"
              fi
            }
            copy_if_present abort-process-tree.txt
            copy_if_present abort-only.json
            copy_if_present canonical.log
            copy_if_present server-observability.json
            copy_if_present matrix-summary.json
          fi
          /usr/bin/python3 -I -B - "$ssh_output_file" "$artifact_dir/abort-only.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import stat
          import sys

          source, destination = (Path(value) for value in sys.argv[1:])
          source_meta = source.lstat()
          if (
              not stat.S_ISREG(source_meta.st_mode)
              or stat.S_ISLNK(source_meta.st_mode)
              or source_meta.st_nlink != 1
              or source_meta.st_size > 262144
          ):
              raise SystemExit("abort SSH response is unsafe")
          raw = source.read_bytes()
          rows = [line[len(b"ABORT_ONLY_JSON="):] for line in raw.splitlines()
                  if line.startswith(b"ABORT_ONLY_JSON=")]
          if len(rows) > 1:
              raise SystemExit("multiple typed abort proofs were returned")
          if rows:
              if destination.exists() or destination.is_symlink():
                  raise SystemExit("typed abort proof was both exported and returned")
              proof_raw = rows[0]
              if not proof_raw or len(proof_raw) > 16384:
                  raise SystemExit("typed abort proof length is invalid")
              def reject_duplicate_keys(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError
                      result[key] = value
                  return result
              try:
                  proof = json.loads(proof_raw.decode("ascii"), object_pairs_hook=reject_duplicate_keys)
                  canonical = json.dumps(proof, ensure_ascii=True, allow_nan=False,
                                         sort_keys=True, separators=(",", ":")).encode("ascii")
              except (UnicodeError, ValueError, TypeError, json.JSONDecodeError):
                  raise SystemExit("typed abort proof is invalid")
              if not isinstance(proof, dict) or canonical != proof_raw:
                  raise SystemExit("typed abort proof is not canonical")
              descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL |
                                   os.O_CLOEXEC | os.O_NOFOLLOW, 0o600)
              try:
                  metadata = os.fstat(descriptor)
                  if (not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1
                          or stat.S_IMODE(metadata.st_mode) != 0o600):
                      raise SystemExit("typed abort proof output is unsafe")
                  os.write(descriptor, proof_raw + b"\n")
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)
          PY
          echo "remote_status=$remote_status" >> "$GITHUB_OUTPUT"
          exit "$remote_status"

      - name: Revalidate exact failed load attempt immediately after remote abort
        id: revalidate_terminal_after_remote
        if: ${{ always() && env.LOAD_TERMINAL_RECOVERY_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          [[ "$LOAD_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$LOAD_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]]
          metadata="$RUNNER_TEMP/retained-abort-terminal-after-remote"
          validator="$RUNNER_TEMP/retained-abort-terminal-validator.py"
          install -d -m 700 "$metadata"
          trap 'rm -rf -- "$metadata"' EXIT
          test -f "$validator" && test ! -L "$validator"
          test "$(stat -c '%F:%a:%h' "$validator")" = "regular file:600:1"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID" --output "$metadata/latest.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT" --output "$metadata/attempt.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$metadata/jobs.json"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B "$validator" \
            "$metadata/latest.json" "$metadata/attempt.json" "$metadata/jobs.json" \
            "$LOAD_RUN_ID" "$LOAD_RUN_ATTEMPT" "$LOAD_RUNNER_SHA" "$GITHUB_ACTOR" \
            "$LOAD_TERMINAL_RUN_WORKFLOW_ID" "$LOAD_TERMINAL_RUN_JOB_COUNT" \
            "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT" "$LOAD_TERMINAL_RUN_PROJECTION_SHA256"
          printf '%s\n' 'exact failed load attempt revalidated immediately after remote abort'

      - name: Remove the exact temporary recovery helper stage
        id: cleanup_recovery_helper
        if: ${{ always() && steps.configure_ssh.outcome == 'success' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sudo -n /usr/bin/bash -s -- $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -Eeuo pipefail
          workflow_run_id="${1:-}"
          workflow_attempt="${2:-}"
          [[ "$workflow_run_id" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$workflow_attempt" =~ ^[1-9][0-9]{0,5}$ ]]
          stage="/run/oldsparky-retained-abort-${workflow_run_id}-${workflow_attempt}"
          incoming="/tmp/oldsparky-retained-abort-helper-${workflow_run_id}-${workflow_attempt}.py"
          if [[ -e "$stage" || -L "$stage" ]]; then
            test -d "$stage" && test ! -L "$stage"
            test "$(stat -c '%F:%u:%g:%a:%h' "$stage")" = "directory:0:0:700:2"
            shopt -s nullglob
            entries=("$stage"/*)
            if [[ ${#entries[@]} -eq 1 && "${entries[0]}" = "$stage/platform_abort_retained_load.py" ]]; then
              test "$(stat -c '%F:%u:%g:%a:%h' "${entries[0]}")" = "regular file:0:0:500:1"
              rm -- "${entries[0]}"
            else
              [[ ${#entries[@]} -eq 0 ]]
            fi
            rmdir -- "$stage"
          fi
          test ! -e "$stage" && test ! -L "$stage"
          if [[ -e "$incoming" || -L "$incoming" ]]; then
            test -f "$incoming" && test ! -L "$incoming"
            caller_uid="${SUDO_UID:-0}"
            caller_gid="${SUDO_GID:-0}"
            [[ "$caller_uid" =~ ^[0-9]{1,10}$ && "$caller_gid" =~ ^[0-9]{1,10}$ ]]
            test "$(stat -c '%F:%u:%g:%a:%h' "$incoming")" = "regular file:${caller_uid}:${caller_gid}:600:1"
            rm -f -- "$incoming"
          fi
          test ! -e "$incoming" && test ! -L "$incoming"
          REMOTE

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/production-retained-abort-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Diagnose abort evidence inputs
        if: ${{ always() }}
        shell: bash
        env:
          ABORT_REMOTE_STEP: ${{ steps.abort_remote.outcome }}
          ABORT_REMOTE_STATUS: ${{ steps.abort_remote.outputs.remote_status }}
          ABORT_STAGE_CLEANUP_STEP: ${{ steps.cleanup_recovery_helper.outcome }}
          ABORT_SSH_CLEANUP_STEP: ${{ steps.cleanup_ssh.outcome }}
          RECOVERY_WORKFLOW_SHA: ${{ github.sha }}
          RECOVERY_HELPER_SHA256: ${{ needs.prepare-abort-helper.outputs.helper_sha256 }}
        run: |
          set +e
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path

          def classify(name: str, allowed: dict[str, str]) -> str:
              value = os.environ.get(name)
              if value is None or value == "":
                  return "missing"
              return allowed.get(value, "invalid")

          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "production-retained-abort-artifacts"
          def present(name: str) -> str:
              try:
                  path = artifact_dir / name
                  return "present" if path.is_file() and path.stat().st_size > 0 else "absent"
              except OSError:
                  return "unknown"

          fields = {
              "remote_step": classify("ABORT_REMOTE_STEP", {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"}),
              "remote": classify("ABORT_REMOTE_STATUS", {"0": "ok", "1": "failed"}),
              "stage_cleanup": classify("ABORT_STAGE_CLEANUP_STEP", {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"}),
              "ssh_cleanup": classify("ABORT_SSH_CLEANUP_STEP", {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"}),
              "raw_log": present("abort-raw.log"),
              "process_tree": present("abort-process-tree.txt"),
              "abort_only": present("abort-only.json"),
              "canonical": present("canonical.log"),
              "matrix": present("matrix-summary.json"),
              "observer": present("server-observability.json"),
          }
          print("RETAINED_ABORT_INPUT " + " ".join(f"{name}={value}" for name, value in fields.items()))
          PY
          diagnostic_status="$?"
          if [[ "$diagnostic_status" != 0 ]]; then
            printf '%s\n' 'RETAINED_ABORT_INPUT diagnostic=unavailable'
          fi
          exit 0

      - name: Normalize abort evidence
        id: normalize_abort_evidence
        if: ${{ always() }}
        shell: bash
        env:
          ABORT_REMOTE_STEP: ${{ steps.abort_remote.outcome }}
          ABORT_REMOTE_STATUS: ${{ steps.abort_remote.outputs.remote_status }}
          ABORT_STAGE_CLEANUP_STEP: ${{ steps.cleanup_recovery_helper.outcome }}
          ABORT_SSH_CLEANUP_STEP: ${{ steps.cleanup_ssh.outcome }}
          RECOVERY_WORKFLOW_SHA: ${{ github.sha }}
          RECOVERY_HELPER_SHA256: ${{ needs.prepare-abort-helper.outputs.helper_sha256 }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/production-retained-abort-artifacts"
          install -d -m 700 "$artifact_dir"
          raw_log="$artifact_dir/abort-raw.log"
          # The secret-bearing job has no checkout.  Project the already
          # bounded remote evidence with this closed, dependency-free schema;
          # never execute a candidate sanitizer beside the SSH key.
          trap 'rm -f -- "$raw_log"' EXIT
          if [[ -s "$raw_log" ]]; then
            /usr/bin/python3 - "$raw_log" "$artifact_dir/canonical.log" <<'PY'
          import json
          from pathlib import Path
          import sys

          source, destination = (Path(value) for value in sys.argv[1:])
          allowed_status = {"passed", "failed", "unavailable", "unknown"}
          fallback = {
              "schema": 1,
              "status": "unavailable",
              "line_count": 0,
              "retained_line_count": 0,
              "truncated": False,
              "class_counts": {"other": 1},
              "route_class_counts": {"other": 1},
              "status_counts": {},
          }
          try:
              raw = source.read_bytes()
              payload = json.loads(raw.decode("utf-8"))
              if not isinstance(payload, dict):
                  raise ValueError
              status = payload.get("status")
              if status not in allowed_status:
                  raise ValueError
              result = {
                  "schema": 1,
                  "status": status,
                  "line_count": min(max(int(payload.get("line_count", 0)), 0), 100000),
                  "retained_line_count": min(max(int(payload.get("retained_line_count", 0)), 0), 100000),
                  "truncated": payload.get("truncated") is True,
                  "class_counts": {"other": 1},
                  "route_class_counts": {"other": 1},
                  "status_counts": {},
              }
          except (OSError, UnicodeError, ValueError, TypeError, json.JSONDecodeError):
              result = fallback
          destination.write_text(json.dumps(result, sort_keys=True) + "\n", encoding="utf-8")
          PY
          fi
          if [[ ! -s "$artifact_dir/canonical.log" ]]; then
            printf '%s\n' '{"schema":1,"status":"unavailable","line_count":0,"retained_line_count":0,"truncated":false,"class_counts":{"other":1},"route_class_counts":{"other":1},"status_counts":{}}' > "$artifact_dir/canonical.log"
          fi
          if [[ ! -s "$artifact_dir/abort-process-tree.txt" ]]; then
            printf '%s\n' '{"schema":1,"process_count":0,"snapshot_available":false}' > "$artifact_dir/abort-process-tree.txt"
          fi
          if [[ ! -s "$artifact_dir/matrix-summary.json" ]]; then
            printf '%s\n' '{"schema":1,"passed":false,"control_account_preserved":false,"rows":[]}' > "$artifact_dir/matrix-summary.json"
          fi
          if [[ ! -s "$artifact_dir/abort-only.json" ]]; then
            printf '%s\n' '{"schema":1,"status":"not_applicable"}' > "$artifact_dir/abort-only.json"
          fi
          if [[ ! -s "$artifact_dir/server-observability.json" ]]; then
            printf '%s\n' '{"schema":1,"available":false,"error_class":"observer_unavailable","binding":{"complete":false}}' > "$artifact_dir/server-observability.json"
          fi
          observer_source="$artifact_dir/server-observability.json"
          observer_public="$artifact_dir/.server-observability.public.json"
          /usr/bin/python3 - "$observer_source" "$observer_public" <<'PY'
          import json
          from pathlib import Path
          import sys

          source, destination = (Path(value) for value in sys.argv[1:])
          try:
              payload = json.loads(source.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise ValueError
              binding = payload.get("binding")
              if not isinstance(binding, dict):
                  binding = {}
              result = {
                  "schema": 1,
                  "available": payload.get("available") is True,
                  "error_class": "none" if payload.get("available") is True else "observer_unavailable",
                  "binding": {"complete": binding.get("complete") is True},
              }
          except (OSError, UnicodeError, ValueError, TypeError, json.JSONDecodeError):
              result = {
                  "schema": 1,
                  "available": False,
                  "error_class": "observer_invalid",
                  "binding": {"complete": False},
              }
          destination.write_text(json.dumps(result, sort_keys=True) + "\n", encoding="utf-8")
          PY
          chmod 600 "$observer_public"
          rm -f -- "$observer_source"
          mv -- "$observer_public" "$observer_source"
          test ! -e "$observer_public"
          rm -f -- "$artifact_dir/abort-raw.log" "$artifact_dir/abort.log"
          test ! -e "$artifact_dir/abort-raw.log"
          test ! -e "$artifact_dir/abort.log"

          /usr/bin/python3 - "$artifact_dir/canonical.log" "$artifact_dir/abort-only.json" \
            "$LOAD_RUN_ID" "$LOAD_RUN_ATTEMPT" "$TARGET_SHA" "$LOAD_RUNNER_SHA" <<'PY'
          import json
          import os
          import re
          import stat
          from pathlib import Path
          import sys

          canonical_path, abort_path = Path(sys.argv[1]), Path(sys.argv[2])
          run_id, attempt, target_sha, runner_sha = sys.argv[3:]
          try:
              payload = json.loads(canonical_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("required abort log evidence is not valid JSON")
          if not isinstance(payload, dict) or payload.get("truncated") is not False:
              raise SystemExit("required abort log evidence is incomplete")
          if payload.get("status") not in {"unavailable", "passed", "failed", "unknown"}:
              raise SystemExit("required abort log evidence is incomplete")
          if payload.get("status") in {"unavailable", "passed", "failed", "unknown"}:
              proof_raw = b""
              descriptor = -1
              try:
                  before = abort_path.lstat()
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or stat.S_ISLNK(before.st_mode)
                      or before.st_nlink != 1
                      or before.st_size > 4096
                  ):
                      raise ValueError
                  descriptor = os.open(abort_path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
                  opened = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(opened.st_mode)
                      or (opened.st_dev, opened.st_ino) != (before.st_dev, before.st_ino)
                      or opened.st_nlink != 1
                      or opened.st_size != before.st_size
                  ):
                      raise ValueError
                  chunks = bytearray()
                  while len(chunks) <= 4096:
                      block = os.read(descriptor, min(1024, 4097 - len(chunks)))
                      if not block:
                          break
                      chunks.extend(block)
                  after = os.fstat(descriptor)
                  if (
                      len(chunks) != before.st_size
                      or len(chunks) > 4096
                      or (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)
                      != (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns)
                  ):
                      raise ValueError
                  proof_raw = bytes(chunks)
              except (OSError, UnicodeError, ValueError):
                  raise SystemExit("typed diagnostic abort proof is unavailable")
              finally:
                  if descriptor >= 0:
                      os.close(descriptor)
              if not proof_raw.endswith(b"\n"):
                  raise SystemExit("typed diagnostic abort proof is not canonical")

              def reject_duplicate_keys(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError
                      result[key] = value
                  return result

              try:
                  proof = json.loads(
                      proof_raw.decode("ascii"), object_pairs_hook=reject_duplicate_keys
                  )
                  canonical_proof = json.dumps(
                      proof, ensure_ascii=True, allow_nan=False, sort_keys=True,
                      separators=(",", ":"),
                  ).encode("ascii") + b"\n"
              except (UnicodeError, ValueError, TypeError, json.JSONDecodeError):
                  raise SystemExit("typed diagnostic abort proof is invalid")
              if canonical_proof != proof_raw:
                  raise SystemExit("typed diagnostic abort proof is not canonical")
              expected_v1 = {
                  "schema", "status", "fixture_kind", "external_run_id",
                  "external_run_attempt", "source_sha", "app_target_sha",
                  "input_handoff_sha256", "fixture_manifest_sha256", "remote_stage",
                  "supervisor_selector", "supervisor_roots_before", "supervisor_tree_before",
                  "supervisor_roots_after", "supervisor_descendants_after", "proc_read_errors",
                  "supervisor_exit_code", "shared_lock_clear", "namespace_closed",
                  "recovery_workflow_sha", "recovery_helper_sha256",
              }
              expected_v2 = {
                  "schema", "status", "fixture_kind", "external_run_id",
                  "external_run_attempt", "source_sha", "app_target_sha",
                  "input_handoff_sha256", "fixture_manifest_sha256", "remote_stage",
                  "run_owned_process_selector", "run_owned_roots_before", "run_owned_processes_before",
                  "run_owned_roots_after", "run_owned_processes_after",
                  "run_owned_roots_after_scan_1", "run_owned_processes_after_scan_1",
                  "run_owned_roots_after_scan_2", "run_owned_processes_after_scan_2",
                  "post_abort_scan_count", "post_scan_separation_ms", "proc_read_errors",
                  "supervisor_exit_record_present", "supervisor_exit_code", "shared_lock_clear",
                  "namespace_closed", "recovery_workflow_sha", "recovery_helper_sha256",
                  "termination_signals", "release_lock_held", "retained_lock_held",
                  "recovery_lock_order", "recovery_locks_held_through_scans_and_revalidation",
                  "binding_revalidated", "active_release_sha", "terminal_controller",
              }
              expected_controller = {
                  "schema", "repository", "workflow_path", "event", "head_branch",
                  "run_id", "run_attempt", "workflow_id", "status", "conclusion",
                  "head_sha", "actor_matches_abort_dispatch", "jobs_complete",
                  "job_count", "failure_job_count", "projection_sha256",
              }
              controller = proof.get("terminal_controller") if isinstance(proof, dict) else None
              allowed_fixture_kinds = {
                      "cpu_diagnostic_only_v1",
                      "ssr_capacity_diagnostic_v1",
                      "ssr_html_capacity_diagnostic_v1",
                      "ssr_html_capacity_composite_diagnostic_v1",
              }
              common_ok = (
                  isinstance(proof, dict)
                  and proof.get("status") == "safe_for_exact_fixture_cleanup"
                  and isinstance(proof.get("fixture_kind"), str)
                  and proof.get("fixture_kind") in allowed_fixture_kinds
                  and proof.get("external_run_id") == run_id
                  and proof.get("external_run_attempt") == attempt
                  and proof.get("source_sha") == runner_sha
                  and proof.get("app_target_sha") == target_sha
                  and isinstance(proof.get("input_handoff_sha256"), str)
                  and re.fullmatch(r"[0-9a-f]{64}", proof["input_handoff_sha256"]) is not None
                  and isinstance(proof.get("fixture_manifest_sha256"), str)
                  and re.fullmatch(r"[0-9a-f]{64}", proof["fixture_manifest_sha256"]) is not None
                  and type(proof.get("proc_read_errors")) is int
                  and proof.get("proc_read_errors") == 0
                  and proof.get("shared_lock_clear") is True
                  and proof.get("namespace_closed") is False
                  and proof.get("recovery_workflow_sha") == os.environ.get("RECOVERY_WORKFLOW_SHA")
                  and re.fullmatch(
                      r"[0-9a-f]{64}", str(proof.get("recovery_helper_sha256", ""))
                  ) is not None
                  and proof.get("recovery_helper_sha256") == os.environ.get("RECOVERY_HELPER_SHA256")
                  and os.environ.get("ABORT_REMOTE_STEP") == "success"
                  and os.environ.get("ABORT_REMOTE_STATUS") == "0"
                  and os.environ.get("ABORT_STAGE_CLEANUP_STEP") == "success"
                  and os.environ.get("ABORT_SSH_CLEANUP_STEP") == "success"
              )
              legacy_ok = (
                  common_ok
                  and set(proof) == expected_v1
                  and type(proof.get("schema")) is int
                  and proof.get("schema") == 1
                  and proof.get("supervisor_selector") == "fixed_script_paths_run_root_and_run_id"
                  and proof.get("remote_stage") in {
                      "supervisor_terminated", "supervisor_already_absent"
                  }
                  and type(proof.get("supervisor_roots_before")) is int
                  and type(proof.get("supervisor_tree_before")) is int
                  and (
                      (proof["remote_stage"] == "supervisor_terminated"
                       and proof["supervisor_roots_before"] > 0
                       and proof["supervisor_tree_before"] > 0)
                      or (proof["remote_stage"] == "supervisor_already_absent"
                          and proof["supervisor_roots_before"] == 0
                          and proof["supervisor_tree_before"] == 0)
                  )
                  and type(proof.get("supervisor_roots_after")) is int
                  and proof.get("supervisor_roots_after") == 0
                  and type(proof.get("supervisor_descendants_after")) is int
                  and proof.get("supervisor_descendants_after") == 0
                  and type(proof.get("supervisor_exit_code")) is int
                  and 0 <= proof["supervisor_exit_code"] <= 255
              )
              recovery_controller_ok = False
              if os.environ.get("LOAD_TERMINAL_RECOVERY_ENABLED") == "true" and isinstance(controller, dict):
                  recovery_controller_ok = (
                  isinstance(controller, dict)
                  and set(controller) == expected_controller
                  and type(controller.get("schema")) is int
                  and controller.get("schema") == 1
                  and controller.get("repository") == "StrayForest/old_sparky"
                  and controller.get("workflow_path") == ".github/workflows/platform-production-external-load.yml"
                  and controller.get("event") == "workflow_dispatch"
                  and controller.get("head_branch") == "dev"
                  and controller.get("run_id") == run_id
                  and controller.get("run_attempt") == attempt
                  and type(controller.get("workflow_id")) is int
                  and controller.get("workflow_id") == int(os.environ.get("LOAD_TERMINAL_RUN_WORKFLOW_ID", "0"))
                  and controller.get("status") == "completed"
                  and controller.get("conclusion") == "failure"
                  and controller.get("head_sha") == runner_sha
                  and controller.get("actor_matches_abort_dispatch") is True
                  and controller.get("jobs_complete") is True
                  and type(controller.get("job_count")) is int
                  and 1 <= controller["job_count"] <= 100
                  and controller.get("job_count") == int(os.environ.get("LOAD_TERMINAL_RUN_JOB_COUNT", "0"))
                  and type(controller.get("failure_job_count")) is int
                  and 1 <= controller["failure_job_count"] <= controller["job_count"]
                  and controller.get("failure_job_count") == int(
                      os.environ.get("LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT", "0")
                  )
                  and controller.get("projection_sha256")
                  == os.environ.get("LOAD_TERMINAL_RUN_PROJECTION_SHA256")
                  )
              terminal_stage = proof.get("remote_stage") if isinstance(proof, dict) else None
              terminal_signals = proof.get("termination_signals") if isinstance(proof, dict) else None
              stage_valid = False
              if isinstance(proof, dict) and terminal_stage == "run_owned_process_tree_stopped_without_exit_record":
                  stage_valid = (
                      type(proof.get("run_owned_roots_before")) is int
                      and proof["run_owned_roots_before"] > 0
                      and type(proof.get("run_owned_processes_before")) is int
                      and proof["run_owned_processes_before"] > 0
                      and terminal_signals in (["SIGTERM"], ["SIGTERM", "SIGKILL"])
                  )
              elif isinstance(proof, dict):
                  stage_valid = (
                      terminal_stage == "run_owned_process_tree_already_absent_without_exit_record"
                      and type(proof.get("run_owned_roots_before")) is int
                      and proof["run_owned_roots_before"] == 0
                      and type(proof.get("run_owned_processes_before")) is int
                      and proof["run_owned_processes_before"] == 0
                      and terminal_signals == []
                  )
              missing_exit_ok = (
                  common_ok
                  and os.environ.get("LOAD_TERMINAL_RECOVERY_ENABLED") == "true"
                  and set(proof) == expected_v2
                  and type(proof.get("schema")) is int
                  and proof.get("schema") == 2
                  and proof.get("run_owned_process_selector") == "fixed_script_paths_run_root_and_run_id"
                  and stage_valid
                  and recovery_controller_ok
                  and proof.get("supervisor_exit_record_present") is False
                  and proof.get("supervisor_exit_code") is None
                  and proof.get("post_abort_scan_count") == 2
                  and type(proof.get("post_abort_scan_count")) is int
                  and type(proof.get("post_scan_separation_ms")) is int
                  and 100 <= proof["post_scan_separation_ms"] <= 5000
                  and all(
                      type(proof.get(field)) is int and proof[field] == 0
                      for field in (
                          "run_owned_roots_after", "run_owned_processes_after",
                          "run_owned_roots_after_scan_1", "run_owned_processes_after_scan_1",
                          "run_owned_roots_after_scan_2", "run_owned_processes_after_scan_2",
                      )
                  )
                  and proof.get("release_lock_held") is True
                  and proof.get("retained_lock_held") is True
                  and proof.get("recovery_lock_order") == ["release", "retained"]
                  and proof.get("recovery_locks_held_through_scans_and_revalidation") is True
                  and proof.get("binding_revalidated") is True
                  and proof.get("active_release_sha") == target_sha
              )
              if not (legacy_ok or missing_exit_ok):
                  raise SystemExit("typed diagnostic abort proof binding or termination checks failed")
          PY

      - name: Revalidate exact failed load attempt after abort normalization
        id: revalidate_terminal_after_normalization
        if: ${{ always() && env.LOAD_TERMINAL_RECOVERY_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          [[ "$LOAD_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$LOAD_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,8}$ ]]
          metadata="$RUNNER_TEMP/retained-abort-terminal-post-normalization"
          validator="$RUNNER_TEMP/retained-abort-terminal-validator.py"
          install -d -m 700 "$metadata"
          trap 'rm -rf -- "$metadata"; rm -f -- "$validator"' EXIT
          test -f "$validator" && test ! -L "$validator"
          test "$(stat -c '%F:%a:%h' "$validator")" = "regular file:600:1"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID" --output "$metadata/latest.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT" --output "$metadata/attempt.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 \
            "${headers[@]}" "$api/actions/runs/$LOAD_RUN_ID/attempts/$LOAD_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$metadata/jobs.json"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B "$validator" \
            "$metadata/latest.json" "$metadata/attempt.json" "$metadata/jobs.json" \
            "$LOAD_RUN_ID" "$LOAD_RUN_ATTEMPT" "$LOAD_RUNNER_SHA" "$GITHUB_ACTOR" \
            "$LOAD_TERMINAL_RUN_WORKFLOW_ID" "$LOAD_TERMINAL_RUN_JOB_COUNT" \
            "$LOAD_TERMINAL_RUN_FAILURE_JOB_COUNT" "$LOAD_TERMINAL_RUN_PROJECTION_SHA256"
          printf '%s\n' 'exact failed load attempt revalidated after abort normalization'

      - name: Remove terminal attempt revalidation helper
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/retained-abort-terminal-validator.py"
          if [[ -e "$validator" || -L "$validator" ]]; then
            test -f "$validator" && test ! -L "$validator"
            test "$(stat -c '%F:%a:%h' "$validator")" = "regular file:600:1"
            rm -- "$validator"
          fi
          test ! -e "$validator" && test ! -L "$validator"

      - name: Diagnose abort evidence normalization
        if: ${{ always() }}
        shell: bash
        env:
          ABORT_REMOTE_STEP: ${{ steps.abort_remote.outcome }}
          ABORT_REMOTE_STATUS: ${{ steps.abort_remote.outputs.remote_status }}
          ABORT_SSH_CLEANUP_STEP: ${{ steps.cleanup_ssh.outcome }}
          ABORT_NORMALIZE_STEP: ${{ steps.normalize_abort_evidence.outcome }}
        run: |
          set +e
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def classify(name: str, allowed: dict[str, str]) -> str:
              value = os.environ.get(name)
              if value is None or value == "":
                  return "missing"
              return allowed.get(value, "invalid")

          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "production-retained-abort-artifacts"
          def present(name: str) -> str:
              try:
                  path = artifact_dir / name
                  return "present" if path.is_file() and path.stat().st_size > 0 else "absent"
              except OSError:
                  return "unknown"

          evidence_status = "missing"
          evidence_truncated = "unknown"
          try:
              path = artifact_dir / "canonical.log"
              if path.is_file():
                  with path.open("rb") as source:
                      raw = source.read(262145)
                  if len(raw) > 262144:
                      raise ValueError
                  payload = json.loads(raw.decode("utf-8"))
                  if isinstance(payload, dict) and payload.get("schema") == 1:
                      status = payload.get("status")
                      evidence_status = status if isinstance(status, str) and status in {"passed", "failed", "unavailable", "unknown"} else "invalid"
                      evidence_truncated = "yes" if payload.get("truncated") is True else "no" if payload.get("truncated") is False else "unknown"
                  else:
                      evidence_status = "invalid"
          except (OSError, UnicodeError, ValueError, TypeError, json.JSONDecodeError):
              evidence_status = "invalid"

          fields = {
              "remote_step": classify("ABORT_REMOTE_STEP", {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"}),
              "remote": classify("ABORT_REMOTE_STATUS", {"0": "ok", "1": "failed"}),
              "ssh_cleanup": classify("ABORT_SSH_CLEANUP_STEP", {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"}),
              "normalize": classify("ABORT_NORMALIZE_STEP", {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"}),
              "canonical": present("canonical.log"),
              "process_tree": present("abort-process-tree.txt"),
              "abort_only": present("abort-only.json"),
              "matrix": present("matrix-summary.json"),
              "observer": present("server-observability.json"),
              "evidence_status": evidence_status,
              "truncated": evidence_truncated,
          }
          print("RETAINED_ABORT_EVIDENCE " + " ".join(f"{name}={value}" for name, value in fields.items()))
          PY
          diagnostic_status="$?"
          if [[ "$diagnostic_status" != 0 ]]; then
            printf '%s\n' 'RETAINED_ABORT_EVIDENCE diagnostic=unavailable'
          fi
          exit 0

      - name: Publish abort evidence
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' && steps.normalize_abort_evidence.outcome == 'success' && (env.LOAD_TERMINAL_RECOVERY_ENABLED != 'true' || (steps.revalidate_terminal_before_ssh.outcome == 'success' && steps.revalidate_terminal_after_remote.outcome == 'success' && steps.revalidate_terminal_after_normalization.outcome == 'success')) }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-retained-abort-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-retained-abort-artifacts/canonical.log
            ${{ runner.temp }}/production-retained-abort-artifacts/abort-only.json
            ${{ runner.temp }}/production-retained-abort-artifacts/abort-process-tree.txt
            ${{ runner.temp }}/production-retained-abort-artifacts/server-observability.json
            ${{ runner.temp }}/production-retained-abort-artifacts/matrix-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Write abort summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Production retained-load abort"
            echo
            echo "- Target load run: **selected retained-load run (identifier withheld)**"
            echo "- The abort helper matched only the exact retained-load supervisor tree for the selected run."
          } >> "$GITHUB_STEP_SUMMARY"
