name: Platform production retained load abort

# Data-only dispatch wrapper.  The secret-bearing implementation is owned by
# the protected trusted branch and is pinned by an immutable SHA.  During the
# staged bootstrap the SHA is replaced by the first commit containing the
# trusted workflow before this wrapper is enabled.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ABORT-PRODUCTION-RETAINED-LOAD to stop one exact run"
        required: true
        type: string
      load_run_id:
        description: "GitHub run ID of the canceled production retained-load workflow"
        required: true
        type: string
      target_sha:
        description: "Exact source SHA currently deployed on the production VPS"
        required: true
        type: string

permissions:
  contents: read

jobs:
  abort:
    uses: StrayForest/old_sparky/.github/workflows/platform-production-retained-load-abort-trusted.yml@cda24284180c9b69accc9a7007fcf9e8e763cbcb
    with:
      confirmation: ${{ inputs.confirmation }}
      load_run_id: ${{ inputs.load_run_id }}
      target_sha: ${{ inputs.target_sha }}
