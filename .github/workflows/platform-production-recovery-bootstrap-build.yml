name: Platform production recovery bootstrap build

on:
  workflow_run:
    workflows: [Platform security and build]
    types: [completed]

# This workflow is deliberately secret-free and evidence-only.  It never
# provisions a host, opens SSH, dispatches production, or writes a production
# path.  The later operator workflow consumes the exact bundle/evidence IDs.
permissions:
  contents: read
  actions: read

concurrency:
  group: platform-production-recovery-bootstrap-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build retained-release recovery bootstrap evidence
    if: >-
      github.ref == 'refs/heads/dev' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == 'StrayForest/old_sparky' &&
      github.event.workflow_run.name == 'Platform security and build' &&
      github.event.workflow_run.path == '.github/workflows/platform-security.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      REPOSITORY: StrayForest/old_sparky
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SECURITY_RUN_ID: ${{ github.event.workflow_run.id }}
      SECURITY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RECOVERY_BUILD_RUN_ID: ${{ github.run_id }}
      RECOVERY_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
      SECURITY_WORKFLOW: Platform security and build
      SECURITY_WORKFLOW_PATH: .github/workflows/platform-security.yml
      SECURITY_JOB: Verification contract
      RECOVERY_BUILD_JOB: Build retained-release recovery bootstrap evidence
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Validate exact successful security run, source and job provenance
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$SOURCE_SHA" = "${{ github.event.workflow_run.head_sha }}"
          test "$SECURITY_RUN_ID" = "${{ github.event.workflow_run.id }}"
          test "$SECURITY_RUN_ATTEMPT" = "${{ github.event.workflow_run.run_attempt }}"
          metadata="$RUNNER_TEMP/platform-recovery-provenance"
          install -d -m 700 "$metadata"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/actions/runs/$SECURITY_RUN_ID" \
            --output "$metadata/run.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT/jobs?per_page=100" \
            --output "$metadata/jobs.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/actions/runs/$SECURITY_RUN_ID/artifacts?per_page=100&page=1" \
            --output "$metadata/artifacts.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/actions/runs/$RECOVERY_BUILD_RUN_ID/attempts/$RECOVERY_BUILD_RUN_ATTEMPT/jobs?per_page=100" \
            --output "$metadata/recovery-jobs.json"
          /usr/bin/python3 -I -B - "$metadata" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          run = json.loads((root / "run.json").read_text(encoding="utf-8"))
          jobs = json.loads((root / "jobs.json").read_text(encoding="utf-8"))
          artifacts = json.loads((root / "artifacts.json").read_text(encoding="utf-8"))
          recovery_jobs = json.loads((root / "recovery-jobs.json").read_text(encoding="utf-8"))
          if (
              run.get("id") != int(__import__("os").environ["SECURITY_RUN_ID"])
              or run.get("run_attempt") != int(__import__("os").environ["SECURITY_RUN_ATTEMPT"])
              or run.get("head_sha") != __import__("os").environ["SOURCE_SHA"]
              or run.get("head_branch") != "dev"
              or run.get("event") != "push"
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
              or run.get("name") != __import__("os").environ["SECURITY_WORKFLOW"]
              or run.get("path") != __import__("os").environ["SECURITY_WORKFLOW_PATH"]
              or (run.get("repository") or {}).get("full_name") != __import__("os").environ["REPOSITORY"]
          ):
              raise SystemExit("security run provenance is not exact")
          rows = jobs.get("jobs") if isinstance(jobs, dict) else None
          if not isinstance(rows, list):
              raise SystemExit("security jobs response is malformed")
          security_run_id = int(__import__("os").environ["SECURITY_RUN_ID"])
          security_attempt = int(__import__("os").environ["SECURITY_RUN_ATTEMPT"])
          source_sha = __import__("os").environ["SOURCE_SHA"]
          matches = [
              row for row in rows
              if (
                  isinstance(row, dict)
                  and type(row.get("id")) is int
                  and row.get("name") == __import__("os").environ["SECURITY_JOB"]
                  and row.get("run_id") == security_run_id
                  and row.get("run_attempt") == security_attempt
                  and row.get("status") == "completed"
                  and row.get("conclusion") == "success"
                  and row.get("head_sha") == source_sha
              )
          ]
          if len(matches) != 1:
              raise SystemExit("exact successful security verification job is missing")
          artifact_name = f"platform-ci-route-{__import__('os').environ['SECURITY_RUN_ID']}-{__import__('os').environ['SECURITY_RUN_ATTEMPT']}"
          artifact_rows = artifacts.get("artifacts") if isinstance(artifacts, dict) else None
          if not isinstance(artifact_rows, list):
              raise SystemExit("security artifact response is malformed")
          artifact_matches = [row for row in artifact_rows if isinstance(row, dict) and row.get("name") == artifact_name and row.get("expired") is False]
          if len(artifact_matches) != 1:
              raise SystemExit("exact security route artifact is missing")
          artifact = artifact_matches[0]
          workflow_run = artifact.get("workflow_run")
          digest = artifact.get("digest")
          if not isinstance(workflow_run, dict) or workflow_run.get("id") != int(__import__('os').environ['SECURITY_RUN_ID']) or workflow_run.get("head_sha") != __import__('os').environ['SOURCE_SHA'] or ("run_attempt" in workflow_run and workflow_run.get("run_attempt") != int(__import__('os').environ['SECURITY_RUN_ATTEMPT'])):
              raise SystemExit("security artifact provenance is not exact")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("security artifact digest is invalid")
          recovery_rows = recovery_jobs.get("jobs") if isinstance(recovery_jobs, dict) else None
          if not isinstance(recovery_rows, list):
              raise SystemExit("recovery build jobs response is malformed")
          recovery_matches = [
              row
              for row in recovery_rows
              if (
                  isinstance(row, dict)
                  and row.get("name") == __import__("os").environ["RECOVERY_BUILD_JOB"]
                  and type(row.get("id")) is int
                  and row.get("run_id") == int(__import__("os").environ["RECOVERY_BUILD_RUN_ID"])
                  and row.get("run_attempt") == int(__import__("os").environ["RECOVERY_BUILD_RUN_ATTEMPT"])
                  and row.get("status") == "completed"
                  and row.get("conclusion") == "success"
                  and row.get("head_sha") == source_sha
              )
          ]
          if len(recovery_matches) != 1:
              raise SystemExit("exact recovery build job is missing")
          recovery_job_id = recovery_matches[0]["id"]
          provenance = {
              "repository": __import__('os').environ["REPOSITORY"],
              "workflow": __import__('os').environ["SECURITY_WORKFLOW"],
              "job": __import__('os').environ["SECURITY_JOB"],
              "run_id": __import__('os').environ["SECURITY_RUN_ID"],
              "run_attempt": __import__('os').environ["SECURITY_RUN_ATTEMPT"],
              "source_sha": __import__('os').environ["SOURCE_SHA"],
              "artifact_name": artifact_name,
              "artifact_sha256": digest.removeprefix("sha256:"),
              "deployable": False,
          }
          path = root / "provenance.json"
          path.write_text(json.dumps(provenance, sort_keys=True, separators=(",", ":")), encoding="ascii")
          path.chmod(0o600)
          with output.open("a", encoding="ascii") as stream:
              stream.write(f"provenance={path}\n")
              stream.write(f"artifact_name={artifact_name}\n")
              stream.write(f"artifact_id={artifact.get('id')}\n")
              stream.write(f"artifact_sha256={provenance['artifact_sha256']}\n")
              stream.write(f"recovery_job_id={recovery_job_id}\n")
          PY

      - name: Checkout exact trusted default-branch source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: StrayForest/old_sparky
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          path: trusted-source
          persist-credentials: false

      - name: Download and validate exact security route artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_ARTIFACT_ID: ${{ steps.provenance.outputs.artifact_id }}
          ROUTE_ARTIFACT_SHA256: ${{ steps.provenance.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$ROUTE_ARTIFACT_ID" != ""
          test "$ROUTE_ARTIFACT_SHA256" != ""
          route_archive="$RUNNER_TEMP/platform-security-route.zip"
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/actions/artifacts/$ROUTE_ARTIFACT_ID/zip" \
            --output "$route_archive"
          test "$(sha256sum "$route_archive" | awk '{print $1}')" = "$ROUTE_ARTIFACT_SHA256"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B \
            trusted-source/platform/tools/platform_production_classifier_artifact.py \
            manifest "$route_archive" --target-sha "$SOURCE_SHA"

      - name: Build and validate deterministic recovery bundle
        id: bundle
        shell: bash
        env:
          RECOVERY_BUILD_JOB_ID: ${{ steps.provenance.outputs.recovery_job_id }}
        run: |
          set -euo pipefail
          provenance="$RUNNER_TEMP/platform-recovery-provenance/provenance.json"
          bundle_name="platform-recovery-bootstrap-${SOURCE_SHA}-${SECURITY_RUN_ID}-${SECURITY_RUN_ATTEMPT}-${RECOVERY_BUILD_RUN_ID}-${RECOVERY_BUILD_RUN_ATTEMPT}.zip"
          /usr/bin/python3 -I -B trusted-source/platform/tools/platform_recovery_bootstrap.py build \
            --source-root "$GITHUB_WORKSPACE/trusted-source" \
            --source-sha "$SOURCE_SHA" \
            --provenance "$provenance" \
            --output "$RUNNER_TEMP/$bundle_name" > "$RUNNER_TEMP/recovery-build.json"
          bundle_sha="$(/usr/bin/python3 -I -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["bundle_sha256"])' "$RUNNER_TEMP/recovery-build.json")"
          [[ "$RECOVERY_BUILD_JOB_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          /usr/bin/python3 -I -B trusted-source/platform/tools/platform_recovery_bootstrap.py validate \
            --bundle "$RUNNER_TEMP/$bundle_name" --source-sha "$SOURCE_SHA" --provenance "$provenance"
          evidence_name="platform-recovery-bootstrap-evidence-${SOURCE_SHA}-${SECURITY_RUN_ID}-${SECURITY_RUN_ATTEMPT}-${RECOVERY_BUILD_RUN_ID}-${RECOVERY_BUILD_RUN_ATTEMPT}.json"
          evidence="$RUNNER_TEMP/$evidence_name"
          /usr/bin/python3 -I -B - "$provenance" "$evidence" "$bundle_name" "$bundle_sha" "$RECOVERY_BUILD_JOB_ID" <<'PY'
          import json,sys
          from pathlib import Path
          provenance=json.loads(Path(sys.argv[1]).read_text(encoding="ascii"))
          payload={"schema":1,"capability":"recovery_bootstrap","capabilities":["abort_retained_only","recover_pending"],"deployable":False,"bundle_name":sys.argv[3],"bundle_sha256":sys.argv[4],"recovery_run_id":__import__("os").environ["RECOVERY_BUILD_RUN_ID"],"recovery_run_attempt":__import__("os").environ["RECOVERY_BUILD_RUN_ATTEMPT"],"recovery_job_id":sys.argv[5],"provenance":provenance}
          Path(sys.argv[2]).write_text(json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n",encoding="ascii")
          Path(sys.argv[2]).chmod(0o600)
          PY
          echo "bundle_name=$bundle_name" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=$bundle_sha" >> "$GITHUB_OUTPUT"
          evidence_sha="$(sha256sum "$evidence" | awk '{print $1}')"
          echo "evidence_name=$evidence_name" >> "$GITHUB_OUTPUT"
          echo "evidence_sha=$evidence_sha" >> "$GITHUB_OUTPUT"

      - name: Attest immutable recovery bundle (evidence only)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/${{ steps.bundle.outputs.bundle_name }}

      - name: Upload immutable recovery bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.bundle.outputs.bundle_name }}
          path: ${{ runner.temp }}/${{ steps.bundle.outputs.bundle_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload closed recovery evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.bundle.outputs.evidence_name }}
          path: ${{ runner.temp }}/${{ steps.bundle.outputs.evidence_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Write non-deployable summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Retained-release recovery bootstrap evidence"
            echo "- Source SHA: `$SOURCE_SHA`"
            echo "- Security run: `$SECURITY_RUN_ID` attempt `$SECURITY_RUN_ATTEMPT`"
            echo "- Recovery build run: `$RECOVERY_BUILD_RUN_ID` attempt `$RECOVERY_BUILD_RUN_ATTEMPT`"
            echo "- Recovery build job: `${{ steps.provenance.outputs.recovery_job_id }}`"
            echo "- Bundle: `${{ steps.bundle.outputs.bundle_name }}`"
            echo "- Bundle SHA-256: `${{ steps.bundle.outputs.bundle_sha }}`"
            echo "- Evidence artifact: `${{ steps.bundle.outputs.evidence_name }}`"
            echo "- Evidence SHA-256: `${{ steps.bundle.outputs.evidence_sha }}`"
            echo "- deployable: `false` (no provisioning/deployment authority)"
          } >> "$GITHUB_STEP_SUMMARY"
