name: Platform production recovery bootstrap build

on:
  workflow_run:
    workflows: [Platform security and build]
    types: [completed]

# This producer is secret-free and evidence-only.  Publication is a separate
# workflow_run consumer, so it never tries to publish while this run is still
# in progress.  A is the security checkout; B is this workflow's source SHA.
permissions:
  contents: read
  actions: read

concurrency:
  group: platform-production-recovery-bootstrap-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  build:
    name: Build retained-release recovery bootstrap evidence
    outputs:
      bundle_name: ${{ steps.bundle.outputs.bundle_name }}
      bundle_sha: ${{ steps.bundle.outputs.bundle_sha }}
    if: >-
      github.ref == 'refs/heads/dev' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == 'StrayForest/old_sparky' &&
      github.event.workflow_run.name == 'Platform security and build' &&
      github.event.workflow_run.path == '.github/workflows/platform-security.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      REPOSITORY: StrayForest/old_sparky
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      RECOVERY_WORKFLOW_SHA: ${{ github.workflow_sha }}
      SECURITY_RUN_ID: ${{ github.event.workflow_run.id }}
      SECURITY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RECOVERY_BUILD_RUN_ID: ${{ github.run_id }}
      RECOVERY_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
      SECURITY_WORKFLOW: Platform security and build
      SECURITY_WORKFLOW_PATH: .github/workflows/platform-security.yml
      SECURITY_JOB: Verification contract
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Validate exact successful security run, source and job provenance
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$SOURCE_SHA" = "${{ github.event.workflow_run.head_sha }}"
          test "$SECURITY_RUN_ID" = "${{ github.event.workflow_run.id }}"
          test "$SECURITY_RUN_ATTEMPT" = "${{ github.event.workflow_run.run_attempt }}"
          metadata="$RUNNER_TEMP/platform-recovery-provenance"
          install -d -m 700 "$metadata"
          api="$GITHUB_API_URL/repos/$REPOSITORY"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT" \
            --output "$metadata/run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT/jobs?per_page=100&page=1" \
            --output "$metadata/jobs.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/runs/$SECURITY_RUN_ID/artifacts?per_page=100&page=1" \
            --output "$metadata/artifacts.json"
          /usr/bin/python3 -I -B - "$metadata" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          env = os.environ
          run = json.loads((root / "run.json").read_text(encoding="utf-8"))
          jobs = json.loads((root / "jobs.json").read_text(encoding="utf-8"))
          artifacts = json.loads((root / "artifacts.json").read_text(encoding="utf-8"))
          if any((
              run.get("id") != int(env["SECURITY_RUN_ID"]),
              run.get("run_attempt") != int(env["SECURITY_RUN_ATTEMPT"]),
              run.get("head_sha") != env["SOURCE_SHA"], run.get("head_branch") != "dev",
              run.get("event") != "push", run.get("status") != "completed",
              run.get("conclusion") != "success", run.get("name") != env["SECURITY_WORKFLOW"],
              run.get("path") != env["SECURITY_WORKFLOW_PATH"],
              (run.get("repository") or {}).get("full_name") != env["REPOSITORY"],
          )):
              raise SystemExit("security run provenance is not exact")
          job_rows = jobs.get("jobs") if isinstance(jobs, dict) else None
          if not isinstance(job_rows, list) or type(jobs.get("total_count")) is not int or not 0 <= jobs["total_count"] <= 100 or jobs["total_count"] != len(job_rows):
              raise SystemExit("security jobs response is incomplete")
          matches = [row for row in job_rows if isinstance(row, dict)
                     and type(row.get("id")) is int and row.get("id") > 0 and row.get("name") == env["SECURITY_JOB"]
                     and row.get("run_id") == int(env["SECURITY_RUN_ID"])
                     and row.get("run_attempt") == int(env["SECURITY_RUN_ATTEMPT"])
                     and row.get("status") == "completed" and row.get("conclusion") == "success"
                     and row.get("head_sha") == env["SOURCE_SHA"]]
          if len(matches) != 1:
              raise SystemExit("exact successful security verification job is missing")
          artifact_rows = artifacts.get("artifacts") if isinstance(artifacts, dict) else None
          if not isinstance(artifact_rows, list) or type(artifacts.get("total_count")) is not int or not 0 <= artifacts["total_count"] <= 100 or artifacts["total_count"] != len(artifact_rows):
              raise SystemExit("security artifact response is incomplete")
          name = f"platform-ci-route-{env['SECURITY_RUN_ID']}-{env['SECURITY_RUN_ATTEMPT']}"
          route = [row for row in artifact_rows if isinstance(row, dict)
                   and row.get("name") == name and row.get("expired") is False]
          if len(route) != 1 or type(route[0].get("id")) is not int or route[0]["id"] <= 0:
              raise SystemExit("exact security route artifact is missing")
          workflow_run = route[0].get("workflow_run")
          digest = route[0].get("digest")
          if (not isinstance(workflow_run, dict) or workflow_run.get("id") != int(env["SECURITY_RUN_ID"])
              or workflow_run.get("head_sha") != env["SOURCE_SHA"]
              or ("run_attempt" in workflow_run and workflow_run.get("run_attempt") != int(env["SECURITY_RUN_ATTEMPT"]))
              or not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None):
              raise SystemExit("security route artifact provenance is not exact")
          provenance = {
              "repository": env["REPOSITORY"], "workflow": env["SECURITY_WORKFLOW"],
              "job": env["SECURITY_JOB"], "run_id": env["SECURITY_RUN_ID"],
              "run_attempt": env["SECURITY_RUN_ATTEMPT"],
              "recovery_workflow_sha": env["RECOVERY_WORKFLOW_SHA"],
              "source_sha": env["SOURCE_SHA"], "artifact_name": name,
              "artifact_sha256": digest.removeprefix("sha256:"), "deployable": False,
          }
          path = root / "provenance.json"
          path.write_text(json.dumps(provenance, sort_keys=True, separators=(",", ":")), encoding="ascii")
          path.chmod(0o600)
          with output.open("a", encoding="ascii") as stream:
              stream.write(f"provenance={path}\nartifact_id={route[0]['id']}\nartifact_sha256={provenance['artifact_sha256']}\n")
          PY

      - name: Checkout exact trusted security source A
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: StrayForest/old_sparky
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          path: trusted-source
          persist-credentials: false

      - name: Download and validate exact security route artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_ARTIFACT_ID: ${{ steps.provenance.outputs.artifact_id }}
          ROUTE_ARTIFACT_SHA256: ${{ steps.provenance.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          route_archive="$RUNNER_TEMP/platform-security-route.zip"
          curl --fail-with-body --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$REPOSITORY/actions/artifacts/$ROUTE_ARTIFACT_ID/zip" \
            --output "$route_archive"
          test "$(sha256sum "$route_archive" | awk '{print $1}')" = "$ROUTE_ARTIFACT_SHA256"
          env -u GH_TOKEN -u GITHUB_TOKEN /usr/bin/python3 -I -B trusted-source/platform/tools/platform_production_classifier_artifact.py manifest "$route_archive" --target-sha "$SOURCE_SHA"

      - name: Build and validate deterministic recovery bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          provenance="$RUNNER_TEMP/platform-recovery-provenance/provenance.json"
          bundle_name="platform-recovery-bootstrap-${SOURCE_SHA}-${SECURITY_RUN_ID}-${SECURITY_RUN_ATTEMPT}-${RECOVERY_BUILD_RUN_ID}-${RECOVERY_BUILD_RUN_ATTEMPT}.zip"
          /usr/bin/python3 -I -B trusted-source/platform/tools/platform_recovery_bootstrap.py build --source-root "$GITHUB_WORKSPACE/trusted-source" --source-sha "$SOURCE_SHA" --provenance "$provenance" --output "$RUNNER_TEMP/$bundle_name" >"$RUNNER_TEMP/recovery-build.json"
          bundle_sha="$(/usr/bin/python3 -I -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["bundle_sha256"])' "$RUNNER_TEMP/recovery-build.json")"
          /usr/bin/python3 -I -B trusted-source/platform/tools/platform_recovery_bootstrap.py validate --bundle "$RUNNER_TEMP/$bundle_name" --source-sha "$SOURCE_SHA" --provenance "$provenance"
          echo "bundle_name=$bundle_name" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=$bundle_sha" >> "$GITHUB_OUTPUT"

      - name: Attest immutable recovery bundle (producer B)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/${{ steps.bundle.outputs.bundle_name }}

      - name: Upload immutable recovery bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.bundle.outputs.bundle_name }}
          path: ${{ runner.temp }}/${{ steps.bundle.outputs.bundle_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Write non-deployable producer summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Retained-release recovery bootstrap producer"
            echo "- Bundle source A: `$SOURCE_SHA`"
            echo "- Producer workflow SHA B: `$RECOVERY_WORKFLOW_SHA`"
            echo "- Security run: `$SECURITY_RUN_ID` attempt `$SECURITY_RUN_ATTEMPT`"
            echo "- Producer run: `$RECOVERY_BUILD_RUN_ID` attempt `$RECOVERY_BUILD_RUN_ATTEMPT`"
            echo "- Bundle: `${{ steps.bundle.outputs.bundle_name }}`"
            echo "- Bundle SHA-256: `${{ steps.bundle.outputs.bundle_sha }}`"
            echo "- Publication is performed only by the separate completed-run publisher."
          } >> "$GITHUB_STEP_SUMMARY"
