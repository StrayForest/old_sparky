name: Apply persistence follow-up hardening

on: push

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/automation/persistence-remediation-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/persistence-remediation-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply follow-up patch
        run: python .github/scripts/persistence_followup_20260823.py
      - name: Validate patched tree
        run: |
          set -euo pipefail
          python -m compileall -q \
            platform/apps/platform_api/app \
            platform/apps/platform_worker \
            platform/python_packages \
            platform/alembic/versions \
            platform/tests
          git diff --check
      - name: Remove one-shot staging files
        run: |
          rm -f .github/scripts/persistence_followup_20260823.py
          rm -f .github/workflows/persistence-followup-apply.yml
      - name: Commit and push follow-up
        run: |
          set -euo pipefail
          git config user.name "oldsparky-remediation-bot"
          git config user.email "oldsparky-remediation-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(platform): complete persistence remediation hardening"
          git push origin HEAD:automation/persistence-remediation-20260823
