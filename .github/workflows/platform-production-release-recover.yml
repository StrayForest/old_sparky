          descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(raw)
              stream.flush()
              os.fsync(stream.fileno())
          PY
          recovery_stage=bootstrap_extract
          bootstrap_tool="$install_stage/platform_recovery_bootstrap.py"
          /usr/bin/python3 -I - "$bundle_path" "$install_stage" "$source_sha" <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys
          import zipfile
          from pathlib import Path
          bundle = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          expected_source_sha = sys.argv[3]
          member_root = "platform-recovery-bootstrap/"
          required = (
              "platform_recovery_bootstrap.py",
              "platform_release_systemd_state.py",
              "platform_release_transaction.py",
          )
          max_file_bytes = 768 * 1024
          max_manifest_bytes = 256 * 1024
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate manifest key")
                  result[key] = value
              return result
          directory = destination.lstat()
          if (stat.S_ISLNK(directory.st_mode) or not stat.S_ISDIR(directory.st_mode)
                  or directory.st_uid != 0 or directory.st_gid != 0
                  or stat.S_IMODE(directory.st_mode) != 0o700):
              raise SystemExit("recovery bootstrap staging directory is unsafe")
          with zipfile.ZipFile(bundle) as archive:
              infos = archive.infolist()
              names = [info.filename for info in infos]
              if len(names) != len(set(names)):
                  raise SystemExit("immutable recovery archive has duplicate members")
              manifest_name = member_root + "manifest.json"
              manifest_infos = [info for info in infos if info.filename == manifest_name]
              if len(manifest_infos) != 1:
                  raise SystemExit("immutable recovery manifest is missing")
              manifest_info = manifest_infos[0]
              manifest_mode = (manifest_info.external_attr >> 16) & 0o177777
              if (manifest_info.create_system != 3 or manifest_info.is_dir()
                      or not stat.S_ISREG(manifest_mode)
                      or stat.S_IMODE(manifest_mode) != 0o444
                      or manifest_info.file_size > max_manifest_bytes):
                  raise SystemExit("immutable recovery manifest metadata is unsafe")
              manifest_raw = archive.read(manifest_info)
              if len(manifest_raw) != manifest_info.file_size:
                  raise SystemExit("immutable recovery manifest is truncated")
              manifest = json.loads(manifest_raw.decode("ascii"), object_pairs_hook=unique_object)
              if (not isinstance(manifest, dict) or manifest.get("schema") != 1
                      or manifest.get("source_sha") != expected_source_sha
                      or manifest.get("capabilities") != ["abort_retained_only", "recover_pending", "quarantine_populated_quiesce", "prune_task_releases", "capture_maintenance_failure", "reset_maintenance_failed"]):
                  raise SystemExit("immutable recovery manifest source is invalid")
              records = manifest.get("files")
              if not isinstance(records, list):
                  raise SystemExit("immutable recovery manifest file list is invalid")
              selected = {}
              for record in records:
                  if not isinstance(record, dict) or set(record) != {"path", "sha256", "mode"}:
                      raise SystemExit("immutable recovery manifest record is invalid")
                  path = record.get("path")
                  if path in required:
                      if path in selected or record.get("mode") != 0o444:
                          raise SystemExit("immutable recovery import record is invalid")
                      selected[path] = record.get("sha256")
              if set(selected) != set(required):
                  raise SystemExit("immutable recovery import closure is incomplete")
              extracted = []
              for relative in required:
                  name = member_root + relative
                  member_infos = [info for info in infos if info.filename == name]
                  if len(member_infos) != 1:
                      raise SystemExit("immutable recovery import member is missing")
                  info = member_infos[0]
                  mode = (info.external_attr >> 16) & 0o177777
                  if (info.create_system != 3 or info.is_dir() or not stat.S_ISREG(mode)
                          or stat.S_IMODE(mode) != 0o444 or info.file_size > max_file_bytes):
                      raise SystemExit("immutable recovery import member metadata is unsafe")
                  data = archive.read(info)
                  if (len(data) != info.file_size
                          or hashlib.sha256(data).hexdigest() != selected[relative]):
                      raise SystemExit("immutable recovery import member digest is invalid")
                  extracted.append((relative, data))
          for relative, data in extracted:
              target = destination / relative
              descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
              with os.fdopen(descriptor, "wb") as stream:
                  stream.write(data)
                  stream.flush()
                  os.fsync(stream.fileno())
              os.chown(target, 0, 0)
              os.chmod(target, 0o444)
              metadata = target.lstat()
              if (not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0
                      or metadata.st_gid != 0 or metadata.st_nlink != 1
                      or stat.S_IMODE(metadata.st_mode) != 0o444
                      or metadata.st_size != len(data)):
                  raise SystemExit("immutable recovery import member install is unsafe")
          PY
          recovery_stage=generation_install
          /usr/bin/python3 -I -B "$bootstrap_tool" install \
            --bundle "$bundle_path" --app-dir "$runtime" \
            --expected-bundle-sha "$bundle_sha" \
            --provenance "$provenance_path" --capability "$recovery_capability" \
            >/dev/null
          recovery_stage=generation_validate
          generation_name="$bundle_sha"
          trusted_generation="$runtime/shared/.release-recovery/generations/$generation_name"
          test -d "$trusted_generation" && test ! -L "$trusted_generation"
          export RECOVERY_TRUSTED_GENERATION="$trusted_generation"
          lock_helper="$trusted_generation/platform_release_lock.sh"
          bootstrap_tool="$trusted_generation/platform_recovery_bootstrap.py"
          /usr/bin/python3 -I -B "$bootstrap_tool" validate-generation \
            --generation "$trusted_generation" --bundle-sha "$generation_name" \
            --provenance "$provenance_path" --capability "$recovery_capability" \
            >/dev/null 2>/dev/null \
            || { echo "Immutable recovery generation manifest validation failed" >&2; exit 1; }
          for helper_spec in \
            "platform_recovery_bootstrap.py:444" \
            "platform_release_lock.sh:555" \
            "platform_release_restore_runtime.sh:555" \
            "platform_release_systemd_state.py:444" \
            "platform_release_transaction.py:444" \
            "platform_release_retention.py:444" \
            "platform_release_capture_probe.py:444" \
            "platform_release_active_artifact_proof.py:444" \
            "platform_recover_pending.sh:555"; do
            helper_name="${helper_spec%%:*}"
            helper_mode="${helper_spec##*:}"
            helper_path="$trusted_generation/$helper_name"
            test -f "$helper_path" && test ! -L "$helper_path" \
              && test "$(stat -c '%u:%h:%a' "$helper_path" 2>/dev/null)" = "0:1:$helper_mode" \
              || { echo "Immutable recovery helper is missing or unsafe" >&2; exit 1; }
          done
          test -f "$lock_helper" && test ! -L "$lock_helper" \
            || { echo "Canonical release lock helper is missing or unsafe" >&2; exit 1; }
          recovery_stage=install_stage_cleanup
          rm -rf -- "$install_stage"
          # The immutable generation wrapper owns lock, transaction, systemd and
          # runtime restoration for every supported topology.
          recovery_stage=quiesce_recovery
          set +e
          if [[ "$recovery_action" == quarantine_populated_quiesce ]]; then
            "$trusted_generation/platform_recover_pending.sh" \
              --action quarantine-populated-quiesce \
              --failed-deploy-run-id "$failed_deploy_run_id" \
              --failed-deploy-run-attempt "$failed_deploy_run_attempt" \
              --failed-deploy-source-sha "$failed_deploy_source_sha" \
              --recovery-run-id "$recovery_action_run_id" \
              --recovery-run-attempt "$recovery_action_run_attempt" \
              --app-dir "$runtime" --systemctl /usr/bin/systemctl
          elif [[ "$recovery_action" == prune_task_releases ]]; then
            IFS=, read -r -a expected_candidates <<<"$expected_candidates_csv"
            IFS=, read -r -a protected_releases <<<"$protected_releases_csv"
            args=(--action prune-task-releases --app-dir "$runtime" --systemctl /usr/bin/systemctl)
            for slug in "${expected_candidates[@]}"; do args+=(--expected-candidate "$slug"); done
            for slug in "${protected_releases[@]}"; do args+=(--protected-release "$slug"); done
            "$trusted_generation/platform_recover_pending.sh" "${args[@]}"
          else
            recovery_args=(--app-dir "$runtime" --systemctl /usr/bin/systemctl)
            if [[ "$source_bound_liveqa_enabled" == 1 ]]; then
              recovery_args+=(--source-bound-liveqa-reuse)
            fi
            "$trusted_generation/platform_recover_pending.sh" "${recovery_args[@]}"
          fi
          remote_status="$?"
          set -e
          exit "$remote_status"
          REMOTE
          remote_status="$?"
          set -e
          if (( remote_status != 0 )); then
            if [[ "$runtime_private_capture" == 1 ]]; then
              if ! encrypt_private_failure_context; then
                printf '%s\n' 'RECOVERY_PRIVATE_FAILURE status=unavailable' >&2
              fi
            fi
            safe_stage="$(grep -E '^RECOVERY_STAGE schema=1 status=failed stage=(remote_identity|argument_count|bundle_sha|source_sha|security_run_id|security_run_attempt|recovery_run_id|recovery_run_attempt|recovery_job_id|recovery_workflow_sha|publisher_run_id|publisher_run_attempt|publisher_workflow_sha|publisher_job_id|route_digest|bundle_input|staging|provenance|bootstrap_extract|generation_install|generation_validate|install_stage_cleanup|source_bound_liveqa|quiesce_recovery)$' "$remote_error" | tail -n 1 | sed -E 's/^RECOVERY_STAGE schema=1 status=failed stage=//' || true)"
            if [[ -z "$safe_stage" ]]; then safe_stage=transport_or_unclassified; fi
            safe_class=unavailable
            safe_check=""
            helper_marker=none
            if grep -Fqx 'RECOVERY_BOOTSTRAP schema=1 status=failed capability=abort_retained_only deployable=false' "$remote_error"; then
              helper_marker=bootstrap_failed
            fi
            if [[ "$safe_stage" == quiesce_recovery ]]; then
              safe_class="$(grep -E '^RELEASE_RUNTIME schema=1 status=failed class=(argument|generation|layout|lock|nginx|privilege|recovery|retention|runtime|service_state|systemd_state|topology|transaction) release_slug=[A-Za-z0-9][A-Za-z0-9._-]{0,179} source_sha=(unavailable|[0-9a-f]{40,64})$' "$remote_error" | tail -n 1 | sed -E 's/^RELEASE_RUNTIME schema=1 status=failed class=([^ ]+).*/\1/' || true)"
              if [[ -z "$safe_class" ]]; then safe_class=unavailable; fi
              check_line_count="$(grep -Ec '^RECOVERY_CHECK' "$remote_error" || true)"
              check_valid_count="$(grep -Ec '^RECOVERY_CHECK schema=1 status=failed check=(receipt_metadata|receipt_validate|capture_transaction|expected_receipt_current|verify_units|expected_unit_snapshot|unit_state|clear_receipt|receipt_absent)$' "$remote_error" || true)"
              runtime_systemd_count="$(grep -Ec '^RELEASE_RUNTIME schema=1 status=failed class=systemd_state release_slug=[A-Za-z0-9][A-Za-z0-9._-]{0,179} source_sha=(unavailable|[0-9a-f]{40,64})$' "$remote_error" || true)"
              if [[ "$safe_class" == systemd_state \
                && "$check_line_count" == 1 \
                && "$check_valid_count" == 1 \
                && "$runtime_systemd_count" == 1 ]]; then
                safe_check="$(grep -E '^RECOVERY_CHECK schema=1 status=failed check=(receipt_metadata|receipt_validate|capture_transaction|expected_receipt_current|verify_units|expected_unit_snapshot|unit_state|clear_receipt|receipt_absent)$' "$remote_error" | sed -E 's/^RECOVERY_CHECK schema=1 status=failed check=//')"
              fi
            fi
            [[ "$remote_status" =~ ^[0-9]{1,3}$ ]] || remote_status=unknown
            if [[ -n "$safe_check" ]]; then
              printf 'RECOVERY_FAILURE schema=1 stage=%s class=%s check=%s helper=%s ssh_rc=%s\n' \
                "$safe_stage" "$safe_class" "$safe_check" "$helper_marker" "$remote_status"
            else
              printf 'RECOVERY_FAILURE schema=1 stage=%s class=%s helper=%s ssh_rc=%s\n' \
                "$safe_stage" "$safe_class" "$helper_marker" "$remote_status"
            fi
            printf '%s\n' 'RELEASE_RUNTIME schema=1 status=failed class=remote_or_transport release_slug=unavailable source_sha=unavailable'
            exit 1
          fi
          public_line="$(grep -E '^RELEASE_RUNTIME schema=1 status=passed class=recovery release_slug=[A-Za-z0-9][A-Za-z0-9._-]{0,179} source_sha=(unavailable|[0-9a-f]{40,64})$' "$remote_log" | tail -n 1 || true)"
          if [[ -z "$public_line" ]]; then
            public_line='RELEASE_RUNTIME schema=1 status=failed class=producer release_slug=unavailable source_sha=unavailable'
            printf '%s\n' "$public_line"
            exit 1
          fi
          if [[ "$RECOVERY_ACTION" == quarantine_populated_quiesce ]]; then
            quarantine_line='RECOVERY_QUARANTINE schema=1 status=passed phase=receipt_consumed'
            grep -Fqx "$quarantine_line" "$remote_log" \
              || { echo 'Quarantine recovery success receipt is missing' >&2; exit 1; }
            printf '%s\n' "$quarantine_line"
          elif [[ "$RECOVERY_ACTION" == prune_task_releases ]]; then
            retention_receipts="$(grep -Ec "^PLATFORM_RETENTION schema=1 status=passed candidate_count=${EXPECTED_CANDIDATE_COUNT} deleted_count=${EXPECTED_CANDIDATE_COUNT} reclaimed_bytes=[0-9]+$" "$remote_log" || true)"
            [[ "$retention_receipts" == 1 ]] \
              || { echo 'Exact retention success receipt is missing or ambiguous' >&2; exit 1; }
            printf 'PLATFORM_RETENTION schema=1 status=passed candidate_count=%s deleted_count=%s\n' \
              "$EXPECTED_CANDIDATE_COUNT" "$EXPECTED_CANDIDATE_COUNT"
          fi
          printf '%s\n' "$public_line"

      - name: Upload encrypted recovery runtime failure context
        if: ${{ always() && steps.recovery_action.outputs.private_failure_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-release-runtime-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-release-runtime-failure/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove encrypted recovery runtime failure staging
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/platform-release-runtime-failure"
          if [[ -e "$private_dir" || -L "$private_dir" ]]; then
            [[ -d "$private_dir" && ! -L "$private_dir" ]]
            [[ "$(stat -c '%u:%a:%h' "$private_dir")" == "$(id -u):700:2" || "$(stat -c '%u:%a:%h' "$private_dir")" == "$(id -u):700:1" ]]
            rm -f -- "$private_dir/manifest.json" "$private_dir/evidence.cms" "$private_dir/evidence.json"
            rmdir -- "$private_dir"
          fi

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-release-recovery-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-release-recovery-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"
