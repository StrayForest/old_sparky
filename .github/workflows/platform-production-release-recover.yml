name: Platform production release recovery

on:
  workflow_dispatch:
    inputs:
      security_run_id:
        description: "Exact successful Platform security and build run ID"
        required: true
        type: string
      security_run_attempt:
        description: "Exact attempt for that security run"
        required: true
        type: string
      recovery_run_id:
        description: "Exact completed recovery-bootstrap producer run ID"
        required: true
        type: string
      recovery_run_attempt:
        description: "Exact attempt for that recovery-bootstrap producer run"
        required: true
        type: string
      publisher_run_id:
        description: "Exact completed recovery-bootstrap publisher run ID"
        required: true
        type: string
      publisher_run_attempt:
        description: "Exact attempt for that recovery-bootstrap publisher run"
        required: true
        type: string
      confirmation:
        description: "Type RECOVER-PENDING-RELEASE after reviewing the retained receipt"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  recover:
    name: Recover pending release transaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      REPOSITORY: StrayForest/old_sparky
      SECURITY_RUN_ID: ${{ inputs.security_run_id }}
      SECURITY_RUN_ATTEMPT: ${{ inputs.security_run_attempt }}
      RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
      PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
      PUBLISHER_RUN_ATTEMPT: ${{ inputs.publisher_run_attempt }}
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      SECURITY_WORKFLOW: Platform security and build
      SECURITY_WORKFLOW_PATH: .github/workflows/platform-security.yml
      SECURITY_JOB: Verification contract
      RECOVERY_BUILD_JOB: Build retained-release recovery bootstrap evidence
      PUBLISHER_WORKFLOW: Platform production recovery bootstrap publish
      PUBLISHER_WORKFLOW_PATH: .github/workflows/platform-production-recovery-bootstrap-publish.yml
    steps:
      - name: Validate explicit recovery confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY" \
            || { echo "Recovery repository is not canonical" >&2; exit 1; }
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production recovery must run from the reviewed dev ref" >&2; exit 1; }
          [[ "$SECURITY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "Security run ID is invalid" >&2; exit 1; }
          [[ "$SECURITY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "Security run attempt is invalid" >&2; exit 1; }
          [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "Recovery producer run ID is invalid" >&2; exit 1; }
          [[ "$RECOVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "Recovery producer run attempt is invalid" >&2; exit 1; }
          [[ "$PUBLISHER_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "Recovery publisher run ID is invalid" >&2; exit 1; }
          [[ "$PUBLISHER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "Recovery publisher run attempt is invalid" >&2; exit 1; }
          case "$RECOVERY_CONFIRMATION" in
            RECOVER-PENDING-RELEASE) ;;
            *) echo "Refusing recovery without exact confirmation" >&2; exit 1 ;;
          esac


      - name: Validate exact security and recovery provenance before SSH
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/platform-production-release-recover-provenance"
          install -d -m 700 "$metadata"
          api="$GITHUB_API_URL/repos/$REPOSITORY"
          gh_header=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT" --output "$metadata/security-run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT/jobs?per_page=100" --output "$metadata/security-jobs.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/runs/$SECURITY_RUN_ID/artifacts?per_page=100&page=1" --output "$metadata/security-artifacts.json"
          source_sha="$(/usr/bin/python3 -I - "$metadata/security-run.json" <<'PY'
          import json
          import re
          import sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read()).get("head_sha")
          if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{40}", value) is None:
              raise SystemExit("security source SHA is invalid")
          print(value)
          PY
          )"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/runs/$RECOVERY_RUN_ID/attempts/$RECOVERY_RUN_ATTEMPT" --output "$metadata/recovery-run.json"
          /usr/bin/python3 -I -B - "$metadata" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          sid = int(os.environ["SECURITY_RUN_ID"])
          sattempt = int(os.environ["SECURITY_RUN_ATTEMPT"])
          repo = os.environ["REPOSITORY"]
          security = json.loads((root / "security-run.json").read_text(encoding="utf-8"))
          jobs = json.loads((root / "security-jobs.json").read_text(encoding="utf-8")).get("jobs")
          artifacts = json.loads((root / "security-artifacts.json").read_text(encoding="utf-8")).get("artifacts")
          recovery_run = json.loads((root / "recovery-run.json").read_text(encoding="utf-8"))
          source = security.get("head_sha")
          if not (
              security.get("id") == sid and security.get("run_attempt") == sattempt
              and security.get("head_branch") == "dev" and security.get("event") == "push"
              and security.get("status") == "completed" and security.get("conclusion") == "success"
              and security.get("name") == os.environ["SECURITY_WORKFLOW"]
              and security.get("path") == os.environ["SECURITY_WORKFLOW_PATH"]
              and (security.get("repository") or {}).get("full_name") == repo
              and isinstance(source, str) and re.fullmatch(r"[0-9a-f]{40}", source)
          ):
              raise SystemExit("security run provenance is not exact")
          security_jobs_payload = json.loads((root / "security-jobs.json").read_text(encoding="utf-8"))
          security_artifacts_payload = json.loads((root / "security-artifacts.json").read_text(encoding="utf-8"))
          if not isinstance(jobs, list) or type(security_jobs_payload.get("total_count")) is not int or not 0 <= security_jobs_payload["total_count"] <= 100 or security_jobs_payload["total_count"] != len(jobs):
              raise SystemExit("security jobs response is incomplete")
          if not isinstance(artifacts, list) or type(security_artifacts_payload.get("total_count")) is not int or not 0 <= security_artifacts_payload["total_count"] <= 100 or security_artifacts_payload["total_count"] != len(artifacts):
              raise SystemExit("security artifacts response is incomplete")
          security_matches = [
              row for row in jobs
              if isinstance(row, dict) and type(row.get("id")) is int and row.get("id") > 0
              and row.get("name") == os.environ["SECURITY_JOB"]
              and row.get("conclusion") == "success" and row.get("run_id") == sid
              and row.get("run_attempt") == sattempt
              and row.get("status") == "completed" and row.get("head_sha") == source
          ]
          if len(security_matches) != 1:
              raise SystemExit("exact successful security verification job is missing")
          route = [
              row for row in artifacts or []
              if isinstance(row, dict) and type(row.get("id")) is int and row.get("id") > 0
              and row.get("name") == f"platform-ci-route-{sid}-{sattempt}"
              and row.get("expired") is False
              and isinstance(row.get("workflow_run"), dict)
              and row["workflow_run"].get("id") == sid
              and row["workflow_run"].get("head_sha") == source
          ]
          if len(route) != 1 or not re.fullmatch(r"sha256:[0-9a-f]{64}", str(route[0].get("digest"))):
              raise SystemExit("exact security route artifact is missing")
          if not (
              recovery_run.get("id") == int(os.environ["RECOVERY_RUN_ID"])
              and recovery_run.get("run_attempt") == int(os.environ["RECOVERY_RUN_ATTEMPT"])
              and recovery_run.get("name") == "Platform production recovery bootstrap build"
              and recovery_run.get("path") == ".github/workflows/platform-production-recovery-bootstrap-build.yml"
              and recovery_run.get("head_branch") == "dev"
              and recovery_run.get("event") == "workflow_run"
              and recovery_run.get("status") == "completed"
              and recovery_run.get("conclusion") == "success"
              and (recovery_run.get("repository") or {}).get("full_name") == repo
              and isinstance(recovery_run.get("head_sha"), str)
              and re.fullmatch(r"[0-9a-f]{40,64}", recovery_run["head_sha"])
          ):
              raise SystemExit("exact recovery-bootstrap producer run is missing or invalid")
          with out.open("a", encoding="ascii") as stream:
              stream.write(f"source_sha={source}\n")
              stream.write(f"route_digest={route[0]['digest'].removeprefix('sha256:')}\n")
              stream.write(f"recovery_run_id={recovery_run['id']}\n")
              stream.write(f"recovery_run_attempt={recovery_run['run_attempt']}\n")
              stream.write(f"recovery_workflow_sha={recovery_run['head_sha']}\n")
              stream.write(f"bundle_name=platform-recovery-bootstrap-{source}-{os.environ['SECURITY_RUN_ID']}-{os.environ['SECURITY_RUN_ATTEMPT']}-{recovery_run['id']}-{recovery_run['run_attempt']}.zip\n")
              stream.write(f"publisher_bundle_name=platform-recovery-bootstrap-publisher-{source}-{os.environ['SECURITY_RUN_ID']}-{os.environ['SECURITY_RUN_ATTEMPT']}-{recovery_run['id']}-{recovery_run['run_attempt']}-{os.environ['PUBLISHER_RUN_ID']}-{os.environ['PUBLISHER_RUN_ATTEMPT']}.zip\n")
              stream.write(f"evidence_name=platform-recovery-bootstrap-evidence-{source}-{os.environ['SECURITY_RUN_ID']}-{os.environ['SECURITY_RUN_ATTEMPT']}-{recovery_run['id']}-{recovery_run['run_attempt']}-{os.environ['PUBLISHER_RUN_ID']}-{os.environ['PUBLISHER_RUN_ATTEMPT']}.json\n")
          PY
          recovery_run_id="$(awk -F= '$1 == "recovery_run_id" {print $2}' "$GITHUB_OUTPUT")"
          recovery_run_attempt="$(awk -F= '$1 == "recovery_run_attempt" {print $2}' "$GITHUB_OUTPUT")"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/runs/$recovery_run_id/attempts/$recovery_run_attempt/jobs?per_page=100" --output "$metadata/recovery-jobs.json"
          /usr/bin/python3 -I - "$metadata/recovery-jobs.json" "$metadata/recovery-job-id" "$recovery_run_id" "$recovery_run_attempt" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = payload.get("jobs") if isinstance(payload, dict) else None
          if not isinstance(rows, list) or type(payload.get("total_count")) is not int or not 0 <= payload["total_count"] <= 100 or payload["total_count"] != len(rows):
              raise SystemExit("recovery jobs response is malformed")
          run_id, attempt = int(sys.argv[3]), int(sys.argv[4])
          source = json.loads((Path(sys.argv[1]).parent / "recovery-run.json").read_text(encoding="utf-8")).get("head_sha")
          matches = [
              row for row in rows
              if isinstance(row, dict) and row.get("name") == os.environ["RECOVERY_BUILD_JOB"]
              and row.get("conclusion") == "success" and type(row.get("id")) is int and row.get("id") > 0
              and row.get("run_id") == run_id and row.get("run_attempt") == attempt
              and row.get("status") == "completed"
              and row.get("head_sha") == source
          ]
          if len(matches) != 1:
              raise SystemExit("exact successful recovery build job is missing")
          Path(sys.argv[2]).write_text(str(matches[0]["id"]), encoding="ascii")
          PY
          recovery_job_id="$(cat "$metadata/recovery-job-id")"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/runs/$PUBLISHER_RUN_ID/attempts/$PUBLISHER_RUN_ATTEMPT" --output "$metadata/publisher-run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/runs/$PUBLISHER_RUN_ID/attempts/$PUBLISHER_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$metadata/publisher-jobs.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/runs/$PUBLISHER_RUN_ID/artifacts?per_page=100&page=1" --output "$metadata/publisher-artifacts.json"
          /usr/bin/python3 -I - "$metadata" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          root = Path(sys.argv[1]); out = Path(sys.argv[2])
          run = json.loads((root / "publisher-run.json").read_text(encoding="ascii"))
          sha = run.get("head_sha")
          if not (run.get("id") == int(os.environ["PUBLISHER_RUN_ID"])
                  and run.get("run_attempt") == int(os.environ["PUBLISHER_RUN_ATTEMPT"])
                  and run.get("name") == os.environ["PUBLISHER_WORKFLOW"]
                  and run.get("path") == os.environ["PUBLISHER_WORKFLOW_PATH"]
                  and run.get("event") == "workflow_run" and run.get("head_branch") == "dev"
                  and run.get("status") == "completed" and run.get("conclusion") == "success"
                  and (run.get("repository") or {}).get("full_name") == os.environ["REPOSITORY"]
                  and isinstance(sha, str) and re.fullmatch(r"[0-9a-f]{40,64}", sha)):
              raise SystemExit("exact publisher run is missing or invalid")
          jobs = json.loads((root / "publisher-jobs.json").read_text(encoding="ascii"))
          rows = jobs.get("jobs") if isinstance(jobs, dict) else None
          if not isinstance(rows, list) or type(jobs.get("total_count")) is not int or not 0 <= jobs["total_count"] <= 100 or jobs["total_count"] != len(rows):
              raise SystemExit("publisher jobs response is incomplete")
          matches = [row for row in rows if isinstance(row, dict) and type(row.get("id")) is int and row.get("id") > 0
                     and row.get("name") == "Publish retained-release recovery bootstrap evidence"
                     and row.get("run_id") == int(os.environ["PUBLISHER_RUN_ID"])
                     and row.get("run_attempt") == int(os.environ["PUBLISHER_RUN_ATTEMPT"])
                     and row.get("status") == "completed" and row.get("conclusion") == "success"
                     and row.get("head_sha") == sha]
          if len(matches) != 1:
              raise SystemExit("exact successful publisher job is missing")
          artifacts = json.loads((root / "publisher-artifacts.json").read_text(encoding="ascii"))
          artifact_rows = artifacts.get("artifacts") if isinstance(artifacts, dict) else None
          if not isinstance(artifact_rows, list) or type(artifacts.get("total_count")) is not int or not 0 <= artifacts["total_count"] <= 100 or artifacts["total_count"] != len(artifact_rows):
              raise SystemExit("publisher artifacts response is incomplete")
          output_lines = out.read_text(encoding="ascii").splitlines()
          def exact_output_value(prefix):
              values = [line.split("=", 1)[1] for line in output_lines if line.startswith(prefix)]
              if len(values) != 1 or not values[0]:
                  raise SystemExit(f"exact output {prefix} is missing")
              return values[0]
          evidence_name = exact_output_value("evidence_name=")
          bundle_name = exact_output_value("publisher_bundle_name=")
          selected = {}
          for name in (bundle_name, evidence_name):
              found = [row for row in artifact_rows if isinstance(row, dict) and row.get("name") == name and row.get("expired") is False and type(row.get("id")) is int and row.get("id") > 0 and isinstance(row.get("workflow_run"), dict) and row["workflow_run"].get("id") == int(os.environ["PUBLISHER_RUN_ID"]) and row["workflow_run"].get("head_sha") == sha and ("run_attempt" not in row["workflow_run"] or row["workflow_run"].get("run_attempt") == int(os.environ["PUBLISHER_RUN_ATTEMPT"]))]
              if len(found) != 1:
                  raise SystemExit("exact publisher artifact is missing")
              if not isinstance(found[0].get("digest"), str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", found[0]["digest"]):
                  raise SystemExit("publisher artifact digest is invalid")
              selected[name] = found[0]
          with out.open("a", encoding="ascii") as stream:
              stream.write(f"publisher_run_id={os.environ['PUBLISHER_RUN_ID']}\n")
              stream.write(f"publisher_run_attempt={os.environ['PUBLISHER_RUN_ATTEMPT']}\n")
              stream.write(f"publisher_workflow_sha={sha}\n")
              stream.write(f"publisher_job_id={matches[0]['id']}\n")
              stream.write(f"publisher_bundle_artifact_id={selected[bundle_name]['id']}\n")
              stream.write(f"publisher_bundle_artifact_sha256={selected[bundle_name]['digest'].removeprefix('sha256:')}\n")
          PY
          artifact_dir="$RUNNER_TEMP/platform-production-release-recover-artifacts"
          install -d -m 700 "$artifact_dir"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/runs/$PUBLISHER_RUN_ID/artifacts?per_page=100&page=1" --output "$artifact_dir/artifacts.json"
          RECOVERY_RUN_ID="$recovery_run_id" RECOVERY_RUN_ATTEMPT="$recovery_run_attempt" RECOVERY_WORKFLOW_SHA="$(awk -F= '$1 == "recovery_workflow_sha" {print $2}' "$GITHUB_OUTPUT")" PUBLISHER_RUN_ID="$PUBLISHER_RUN_ID" PUBLISHER_RUN_ATTEMPT="$PUBLISHER_RUN_ATTEMPT" PUBLISHER_WORKFLOW_SHA="$(awk -F= '$1 == "publisher_workflow_sha" {print $2}' "$GITHUB_OUTPUT")" SOURCE_SHA="$source_sha" RECOVERY_JOB_ID="$recovery_job_id" PUBLISHER_JOB_ID="$(awk -F= '$1 == "publisher_job_id" {print $2}' "$GITHUB_OUTPUT")" BUNDLE_NAME="$(awk -F= '$1 == "bundle_name" {print $2}' "$GITHUB_OUTPUT")" PUBLISHER_BUNDLE_NAME="$(awk -F= '$1 == "publisher_bundle_name" {print $2}' "$GITHUB_OUTPUT")" EVIDENCE_NAME="$(awk -F= '$1 == "evidence_name" {print $2}' "$GITHUB_OUTPUT")" PUBLISHER_BUNDLE_ARTIFACT_ID="$(awk -F= '$1 == "publisher_bundle_artifact_id" {print $2}' "$GITHUB_OUTPUT")" PUBLISHER_BUNDLE_ARTIFACT_SHA256="$(awk -F= '$1 == "publisher_bundle_artifact_sha256" {print $2}' "$GITHUB_OUTPUT")"             /usr/bin/python3 -I - "$artifact_dir/artifacts.json" "$artifact_dir" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          root = Path(sys.argv[2])
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = payload.get("artifacts") if isinstance(payload, dict) else None
          if not isinstance(rows, list) or type(payload.get("total_count")) is not int or not 0 <= payload["total_count"] <= 100 or payload["total_count"] != len(rows):
              raise SystemExit("recovery artifacts response is malformed")
          run_id = int(os.environ["PUBLISHER_RUN_ID"])
          attempt = int(os.environ["PUBLISHER_RUN_ATTEMPT"])
          for name, output in ((os.environ["PUBLISHER_BUNDLE_NAME"], "bundle.id"), (os.environ["EVIDENCE_NAME"], "evidence.id")):
              matches = [
                  row for row in rows
                  if isinstance(row, dict) and row.get("name") == name
                  and row.get("expired") is False and type(row.get("id")) is int and row.get("id") > 0 and isinstance(row.get("workflow_run"), dict)
                  and row["workflow_run"].get("id") == run_id
                  and row["workflow_run"].get("head_sha") == os.environ["PUBLISHER_WORKFLOW_SHA"]
                  and ("run_attempt" not in row["workflow_run"] or row["workflow_run"].get("run_attempt") == attempt)
              ]
              if len(matches) != 1 or not isinstance(matches[0].get("id"), int):
                  raise SystemExit(f"exact {name} artifact is missing")
              (root / output).write_text(str(matches[0]["id"]), encoding="ascii")
          PY
          bundle_id="$(cat "$artifact_dir/bundle.id")"
          evidence_id="$(cat "$artifact_dir/evidence.id")"
          for pair in "bundle:$bundle_id" "evidence:$evidence_id"; do
            kind="${pair%%:*}"; id="${pair#*:}"
            curl --fail-with-body --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors "${gh_header[@]}" "$api/actions/artifacts/$id/zip" --output "$artifact_dir/$kind.download.zip"
          done
          source_sha="$(awk -F= '$1 == "source_sha" {print $2}' "$GITHUB_OUTPUT")"
          RECOVERY_RUN_ID="$recovery_run_id" RECOVERY_RUN_ATTEMPT="$recovery_run_attempt" RECOVERY_JOB_ID="$recovery_job_id" RECOVERY_WORKFLOW_SHA="$(awk -F= '$1 == "recovery_workflow_sha" {print $2}' "$GITHUB_OUTPUT")" SOURCE_SHA="$source_sha" SECURITY_RUN_ID="$SECURITY_RUN_ID" SECURITY_RUN_ATTEMPT="$SECURITY_RUN_ATTEMPT" ROUTE_DIGEST="$(awk -F= '$1 == "route_digest" {print $2}' "$GITHUB_OUTPUT")" PUBLISHER_RUN_ID="$PUBLISHER_RUN_ID" PUBLISHER_RUN_ATTEMPT="$PUBLISHER_RUN_ATTEMPT" PUBLISHER_WORKFLOW_SHA="$(awk -F= '$1 == "publisher_workflow_sha" {print $2}' "$GITHUB_OUTPUT")" PUBLISHER_JOB_ID="$(awk -F= '$1 == "publisher_job_id" {print $2}' "$GITHUB_OUTPUT")" BUNDLE_NAME="$(awk -F= '$1 == "bundle_name" {print $2}' "$GITHUB_OUTPUT")" PUBLISHER_BUNDLE_NAME="$(awk -F= '$1 == "publisher_bundle_name" {print $2}' "$GITHUB_OUTPUT")" PUBLISHER_BUNDLE_ARTIFACT_ID="$(awk -F= '$1 == "publisher_bundle_artifact_id" {print $2}' "$GITHUB_OUTPUT")" PUBLISHER_BUNDLE_ARTIFACT_SHA256="$(awk -F= '$1 == "publisher_bundle_artifact_sha256" {print $2}' "$GITHUB_OUTPUT")" EVIDENCE_NAME="$(awk -F= '$1 == "evidence_name" {print $2}' "$GITHUB_OUTPUT")"             /usr/bin/python3 -I - "$artifact_dir" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import zipfile
          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          def extract(archive, expected):
              with zipfile.ZipFile(archive) as source:
                  infos = source.infolist()
                  if len(infos) != 1 or infos[0].filename != expected:
                      raise SystemExit("artifact archive is not a single exact file")
                  info = infos[0]
                  mode = (info.external_attr >> 16) & 0o177777
                  if info.create_system != 3 or info.is_dir() or not stat.S_ISREG(mode) or stat.S_IMODE(mode) & 0o022:
                      raise SystemExit("artifact member metadata is unsafe")
                  data = source.read(info)
                  if len(data) != info.file_size:
                      raise SystemExit("artifact member is truncated")
                  target = root / expected
                  descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(descriptor, "wb") as stream:
                      stream.write(data)
                      stream.flush()
                      os.fsync(stream.fileno())
                  return target
          bundle = extract(root / "bundle.download.zip", os.environ["BUNDLE_NAME"])
          evidence = extract(root / "evidence.download.zip", os.environ["EVIDENCE_NAME"])
          payload = json.loads(evidence.read_text(encoding="ascii"))
          if (
