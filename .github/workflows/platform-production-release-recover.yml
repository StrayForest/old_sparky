name: Platform production release recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECOVER-PENDING-RELEASE after reviewing the retained receipt"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  recover:
    name: Recover pending release transaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate explicit recovery confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production recovery must run from the reviewed dev ref" >&2; exit 1; }
          test "$RECOVERY_CONFIRMATION" = "RECOVER-PENDING-RELEASE" \
            || { echo "Refusing recovery without exact confirmation" >&2; exit 1; }

      - name: Validate production SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-release-recovery-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" || { echo "Production SSH host exposed no ED25519 key" >&2; exit 1; }
          test "$(wc -l < "$ssh_scan" | tr -d ' ')" = "1" \
            || { echo "Expected exactly one production ED25519 host key" >&2; exit 1; }
          ssh_fingerprint="$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$ssh_fingerprint" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" || {
            echo "Production SSH host fingerprint mismatch" >&2
            exit 1
          }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Recover the pending release and restore runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          runtime=/opt/oldsparky/platform
          state="$runtime/shared/.release-operation.json"
          rollback="$runtime/current/tools/platform_release_rollback.sh"

          test "$(id -u)" -eq 0 || { echo "Production recovery must run as root" >&2; exit 1; }
          test -f "$state" || { echo "No pending release transaction exists" >&2; exit 1; }
          test -x "$rollback" || { echo "Release recovery tool is missing" >&2; exit 1; }

          "$rollback" --recover-pending --app-dir "$runtime"
          test ! -e "$state" && test ! -L "$state" \
            || { echo "Pending release transaction was not cleared" >&2; exit 1; }

          current_release="$(readlink -f "$runtime/current")"
          restore="$current_release/tools/platform_release_restore_runtime.sh"
          test -x "$restore" || { echo "Runtime restore tool is missing" >&2; exit 1; }
          "$restore" \
            --app-dir "$runtime" \
            --release "$current_release" \
            --expected-csp-mode report-only \
            --edge-origin https://127.0.0.1 \
            --edge-host old-sparky.com \
            --public-edge-origin https://old-sparky.com

          nginx -t >/dev/null
          for service in deadlock-api deadlock-worker deadlock-web; do
            systemctl is-active --quiet "$service"
          done
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:8010/api/v1/health/ready >/dev/null
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:3000/ >/dev/null
          printf 'Pending release recovered; active release restored: %s\n' "$current_release"
          REMOTE
