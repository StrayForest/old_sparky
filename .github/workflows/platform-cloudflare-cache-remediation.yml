name: Platform Cloudflare cache remediation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-cloudflare-cache-remediation
  cancel-in-progress: false

jobs:
  fix:
    name: Repair reviewed session-cookie bypass
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ALL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Require remediation credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Apply and verify the narrow cache-rule repair
        shell: bash
        run: python3 platform/tools/cloudflare_cache_rule_fix.py
