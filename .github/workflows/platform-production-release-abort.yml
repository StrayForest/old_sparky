name: Platform production release abort (legacy bridge)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type ABORT-LEGACY-RELEASE after reviewing the retained receipt"
        required: true
        type: string
      generation_sha:
        description: "Exact installed immutable recovery generation SHA-256"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  abort:
    name: Legacy receipt cleanup bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      RECOVERY_GENERATION_SHA: ${{ inputs.generation_sha }}
    steps:
      - name: Validate explicit legacy bridge request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Legacy release abort must run from the reviewed dev ref" >&2; exit 1; }
          test "$RECOVERY_CONFIRMATION" = "ABORT-LEGACY-RELEASE" \
            || { echo "Refusing legacy bridge without exact confirmation" >&2; exit 1; }
          [[ "$RECOVERY_GENERATION_SHA" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "Recovery generation must be an exact SHA-256" >&2; exit 1; }

      - name: Configure pinned production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/platform-production-release-abort-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-release-abort-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" >"$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >>"$GITHUB_ENV"

      - name: Run only the immutable legacy cleanup bridge
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          remote_log="$RUNNER_TEMP/platform-production-release-abort.log"
          : >"$remote_log"
          chmod 600 "$remote_log"
          set +e
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o ConnectTimeout=10 -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" 'bash -s' >"$remote_log" <<REMOTE
          set -Eeuo pipefail
          runtime=/opt/oldsparky/platform
          generation="\$runtime/shared/.release-recovery/generations/$RECOVERY_GENERATION_SHA"
          test "\$(id -u)" -eq 0 || { echo "Legacy recovery must run as root" >&2; exit 1; }
          test -d "\$generation" && test ! -L "\$generation" \
            && test "\$(stat -c '%u:%g:%a:%h' "\$generation")" = "0:0:555:2" \
            || { echo "Immutable recovery generation is missing or unsafe" >&2; exit 1; }
          state="\$runtime/shared/.release-operation.json"
          test -f "\$state" && test ! -L "\$state" \
            && test "\$(stat -c '%u:%g:%a:%h' "\$state")" = "0:0:600:1" \
            || { echo "No safe retained release receipt exists" >&2; exit 1; }
          /usr/bin/python3 -I - "\$state" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate receipt key")
                  value[key] = item
              return value

          record = json.loads(
              Path(sys.argv[1]).read_text(encoding="ascii"),
              object_pairs_hook=unique_object,
          )
          expected = {
              "version", "operation", "phase", "app_dir", "current_before",
              "previous_before", "candidate_release", "shared_venv", "peer",
              "snapshot", "transition", "shared_before", "peer_before",
              "current_before_identity", "previous_before_identity",
              "candidate_identity", "remove_env_on_recovery", "service_state_before",
              "quiesced_services", "timer_active_before",
          }
          if not isinstance(record, dict) or set(record) != expected:
              raise SystemExit("legacy bridge accepts one exact v2 receipt schema")
          if (
              type(record["version"]) is not int
              or record["version"] != 2
              or record["operation"] != "install"
              or record["phase"] != "recovery-restored"
              or type(record["remove_env_on_recovery"]) is not bool
              or type(record["timer_active_before"]) is not bool
          ):
              raise SystemExit("legacy bridge receipt phase or scalar types are invalid")

          app_dir = Path("/opt/oldsparky/platform")
          if record["app_dir"] != str(app_dir):
              raise SystemExit("legacy bridge receipt application identity is invalid")

          def release_path(value, *, required):
              if value is None and not required:
                  return None
              if not isinstance(value, str) or not value:
                  raise SystemExit("legacy bridge release topology is invalid")
              path = Path(value)
              if (
                  path.parent != app_dir / "releases"
                  or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,179}", path.name)
                  is None
              ):
                  raise SystemExit("legacy bridge release topology is invalid")
              return path

          current = release_path(record["current_before"], required=True)
          previous = release_path(record["previous_before"], required=True)
          candidate = release_path(record["candidate_release"], required=True)
          if len({current, previous, candidate}) != 3:
              raise SystemExit("legacy bridge release topology is ambiguous")

          def identity(value, *, required):
              if value is None and not required:
                  return None
              if (
                  not isinstance(value, dict)
                  or set(value) != {"dev", "ino"}
                  or type(value["dev"]) is not int
                  or type(value["ino"]) is not int
                  or value["dev"] < 0
                  or value["ino"] <= 0
              ):
                  raise SystemExit("legacy bridge receipt identity is invalid")
              return (value["dev"], value["ino"])

          identity(record["current_before_identity"], required=True)
          identity(record["previous_before_identity"], required=True)
          identity(record["candidate_identity"], required=True)
          shared_venv = Path(record["shared_venv"]) if isinstance(record["shared_venv"], str) else None
          snapshot = Path(record["snapshot"]) if isinstance(record["snapshot"], str) else None
          peer = Path(record["peer"]) if isinstance(record["peer"], str) else None
          if (
              shared_venv != app_dir / "shared" / "venv"
              or snapshot != candidate / ".rollback" / "shared-venv-before-install"
              or peer is None
              or peer.parent != app_dir / "shared"
              or not peer.name.startswith(f".venv-install-{candidate.name}.")
          ):
              raise SystemExit("legacy bridge venv topology is invalid")

          transition = record["transition"]
          if transition not in {"exchange", "create", "none"}:
              raise SystemExit("legacy bridge venv transition is invalid")
          shared_before = record["shared_before"]
          peer_before = record["peer_before"]
          if transition == "exchange":
              if identity(shared_before, required=True) == identity(peer_before, required=True):
                  raise SystemExit("legacy bridge venv identities are ambiguous")
          elif transition == "create":
              if shared_before is not None or identity(peer_before, required=True) is None:
                  raise SystemExit("legacy bridge created venv identity is invalid")
          elif peer_before is not None:
              raise SystemExit("legacy bridge no-op peer identity is invalid")
          elif shared_before is not None:
              identity(shared_before, required=True)

          service_state = record["service_state_before"]
          if (
              not isinstance(service_state, dict)
              or set(service_state) != {"deadlock-api", "deadlock-worker", "deadlock-web"}
              or any(type(value) is not str or value not in {"active", "inactive"} for value in service_state.values())
              or record["quiesced_services"] != ["deadlock-api", "deadlock-worker", "deadlock-web"]
          ):
              raise SystemExit("legacy bridge service receipt is invalid")
          PY
          test -f "\$generation/platform_recovery_bootstrap.py" \
            && test ! -L "\$generation/platform_recovery_bootstrap.py" \
            && test "\$(stat -c '%u:%g:%a:%h' "\$generation/platform_recovery_bootstrap.py")" = "0:0:444:1" \
            || { echo "Immutable recovery bootstrap is missing or unsafe" >&2; exit 1; }
          test -f "\$generation/platform_release_lock.sh" \
            && test ! -L "\$generation/platform_release_lock.sh" \
            && test "\$(stat -c '%u:%g:%a:%h' "\$generation/platform_release_lock.sh")" = "0:0:555:1" \
            || { echo "Immutable recovery lock helper is missing or unsafe" >&2; exit 1; }
          "\$generation/platform_release_lock.sh" --run \
            /usr/bin/python3 -I -B "\$generation/platform_recovery_bootstrap.py" \
            abort_retained_only --app-dir "\$runtime" --generation "\$generation"
          REMOTE
          status="\$?"
          set -e
          if (( status != 0 )); then
            echo 'RECOVERY_BOOTSTRAP schema=1 status=failed capability=legacy-cleanup deployable=false'
            exit 1
          fi
          grep -E '^RECOVERY_BOOTSTRAP schema=1 status=complete capability=abort_retained_only deployable=false$' "$remote_log"

      - name: Remove production SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-release-abort-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-release-abort-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" "$ssh_dir/config" \
              "$ssh_dir/control.sock" "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"
