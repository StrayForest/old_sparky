name: Platform production storage maintenance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY-PRODUCTION-STORAGE-MAINTENANCE after reviewing the storage inventory"
        required: true
        type: string
      expected_sha:
        description: "Exact source SHA currently deployed on the production VPS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  maintenance:
    name: Apply bounded production storage retention
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Validate explicit maintenance confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production storage maintenance must run from dev." >&2; exit 1; }
          test "$CONFIRMATION" = "APPLY-PRODUCTION-STORAGE-MAINTENANCE" \
            || { echo "Refusing maintenance without exact confirmation." >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "expected_sha must be a lowercase 40-character commit SHA." >&2; exit 1; }

      - name: Validate production SSH inputs
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured." >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured." >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured." >&2; exit 1; }

      - name: Configure pinned production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-storage-maintenance-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run installed bounded maintenance service
        id: maintenance
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -u
          umask 077
          artifact_dir="$RUNNER_TEMP/platform-production-storage-maintenance-artifacts"
          install -d -m 700 "$artifact_dir"
          remote_log="$artifact_dir/maintenance.log"
          ssh_error="$artifact_dir/ssh-error.log"
          : >"$remote_log"
          : >"$ssh_error"
          chmod 600 "$remote_log" "$ssh_error"
          set +e
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
          bash -s -- "$EXPECTED_SHA" "$CONFIRMATION" > "$remote_log" 2> "$ssh_error" <<'REMOTE'
          set -Eeuo pipefail
          CURRENT_STAGE=identity
          trap 'diagnostic_rc=$?; trap - ERR; if [[ "${service_status:-0}" =~ ^[1-9][0-9]{0,2}$ ]] && (( service_status <= 255 )); then diagnostic_rc=$service_status; fi; printf "{\"schema\":1,\"kind\":\"collection_failure\",\"status\":\"failed\",\"stage\":\"%s\",\"outcome\":\"producer_failed\",\"exit_code\":%d}\n" "$CURRENT_STAGE" "$diagnostic_rc"; exit "$diagnostic_rc"' ERR

          expected_sha="$1"
          confirmation="$2"
          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          shared="$runtime/shared"
          report_dir="$shared/maintenance"
          summary_tool="$current/tools/platform_storage_evidence_summary.py"
          input_guard="$current/tools/platform_workflow_input_guard.py"

          fail() {
            local failure_code=1
            if [[ "${service_status:-0}" =~ ^[1-9][0-9]{0,2}$ ]] \
              && (( service_status <= 255 )); then
              failure_code="$service_status"
            fi
            printf '{"schema":1,"kind":"collection_failure","status":"failed","stage":"%s","outcome":"producer_failed","exit_code":%d}\n' \
              "$CURRENT_STAGE" "$failure_code"
            exit "$failure_code"
          }
          fail_with_status() {
            local outcome="$1"
            local failure_code="$2"
            printf '{"schema":1,"kind":"collection_failure","status":"failed","stage":"%s","outcome":"%s","exit_code":%d}\n' \
              "$CURRENT_STAGE" "$outcome" "$failure_code"
            exit "$failure_code"
          }
          fail_for_service_status() {
            local outcome="$1"
            local fallback_code="$2"
            local failure_code="$fallback_code"
            if [[ "${service_status:-0}" =~ ^[1-9][0-9]{0,2}$ ]] \
              && (( service_status <= 255 )); then
              failure_code="$service_status"
            fi
            fail_with_status "$outcome" "$failure_code"
          }

          test "$(id -u)" -eq 0 || fail "Production maintenance must run as root."
          test -f "$input_guard" && test ! -L "$input_guard" \
            || fail "Workflow input guard is missing or unsafe."
          /usr/bin/python3 -I "$input_guard" confirmation \
            --value "$confirmation" \
            --expected "APPLY-PRODUCTION-STORAGE-MAINTENANCE" \
            >/dev/null \
            || fail "Maintenance confirmation mismatch."
          /usr/bin/python3 -I "$input_guard" sha \
            --value "$expected_sha" \
            >/dev/null \
            || fail "Maintenance source SHA is invalid."
          test -L "$current" || fail "Current release symlink is missing."
          test -d "$shared" && test ! -L "$shared" || fail "Shared directory is unsafe."

          active_sha="$(/usr/bin/python3 -I - "$current/RELEASE.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("source_git_commit") or "")
          PY
          )"
          test "$active_sha" = "$expected_sha" || fail "Active release SHA differs from expected_sha."
          test -f "$current/tools/platform_storage_maintenance.py" \
            && test ! -L "$current/tools/platform_storage_maintenance.py" \
            && test -x "$current/tools/platform_storage_maintenance.py" \
            || fail "Installed storage maintenance tool is missing."
          test -f "$summary_tool" && test ! -L "$summary_tool" \
            || fail "Storage evidence summary helper is missing or unsafe."

          current_before="$(readlink -f "$current")"
          previous_before="$(readlink -f "$runtime/previous")"
          current_id="$(basename "$current_before")"
          previous_id="$(basename "$previous_before")"
          [[ "$current_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,179}$ ]] \
            || fail "Current release identifier is invalid."
          [[ "$previous_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,179}$ ]] \
            || fail "Previous release identifier is invalid."
          test ! -e "$shared/.release-operation.json" \
            || fail "A release transaction is already pending."

          # The installed maintenance command acquires the canonical release
          # lock and then the retained-load lock in that order. Do not hold the
          # load lock here while starting the service: that would create the
          # reverse load -> release edge against production deploy.
          printf '{"schema":1,"kind":"storage_maintenance","active_release_id":"%s","previous_release_id":"%s","active_source_sha":"%s"}\n' \
            "$current_id" "$previous_id" "$active_sha"
          printf '{"schema":1,"kind":"storage_lock_lifecycle","owner":"deadlock-maintenance.service","state":"service_managed"}\n'

          CURRENT_STAGE=service_invocation
          service_state_before="$(systemctl show deadlock-maintenance.service \
            --property=ActiveState --value --no-pager 2>/dev/null)" \
            || fail "Maintenance service state producer failed."
          [[ "$service_state_before" == inactive || "$service_state_before" == failed ]] \
            || fail "Maintenance service already has an active invocation."
          service_invocation_before="$(systemctl show deadlock-maintenance.service \
            --property=InvocationID --value --no-pager 2>/dev/null)" \
            || fail "Maintenance invocation identity producer failed."
          if [[ -n "$service_invocation_before" \
            && ! "$service_invocation_before" =~ ^[0-9a-f]{32}$ ]]; then
            fail "Previous maintenance invocation identity is invalid."
          fi
          invocation_started_at="$(date -u '+%Y-%m-%dT%H:%M:%S.%NZ')" \
            || fail "Maintenance invocation start time producer failed."
          set +e
          systemctl start deadlock-maintenance.service
          service_status=$?
          set -e
          invocation_completed_at="$(date -u '+%Y-%m-%dT%H:%M:%S.%NZ')" \
            || fail "Maintenance invocation completion time producer failed."
          if ! service_invocation_after="$(systemctl show deadlock-maintenance.service \
            --property=InvocationID --value --no-pager 2>/dev/null)"; then
            fail_for_service_status invocation_unavailable 2
          fi
          if [[ ! "$service_invocation_after" =~ ^[0-9a-f]{32}$ \
            || "$service_invocation_after" == "$service_invocation_before" ]]; then
            fail_for_service_status invocation_unavailable 2
          fi
          service_output="$(systemctl show deadlock-maintenance.service \
            --property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,NRestarts,MemoryCurrent,MemoryPeak,MemoryMax,TasksCurrent,TasksMax,CPUUsageNSec \
            --no-pager 2>/dev/null)" \
            || fail_for_service_status service_state_unavailable 2
          printf '%s\n' "$service_output" \
            | /usr/bin/python3 -I "$summary_tool" --mode service --service maintenance \
            || fail_for_service_status service_summary_unavailable 2

          CURRENT_STAGE=postchecks
          test "$(readlink -f "$current")" = "$current_before" \
            || fail "Current release target changed during maintenance."
          test "$(readlink -f "$runtime/previous")" = "$previous_before" \
            || fail "Previous release target changed during maintenance."
          current_id_after="$(basename "$(readlink -f "$current")")"
          previous_id_after="$(basename "$(readlink -f "$runtime/previous")")"
          [[ "$current_id_after" == "$current_id" \
            && "$previous_id_after" == "$previous_id" ]] \
            || fail "Protected release identifiers changed during maintenance."
          active_sha_after="$(/usr/bin/python3 -I - "$current/RELEASE.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")).get("source_git_commit") or "")
          PY
          )"
          test "$active_sha_after" = "$active_sha" \
            || fail "Active release source SHA changed during maintenance."
          test ! -e "$shared/.release-operation.json" \
            || fail "A release transaction remains after maintenance."

          CURRENT_STAGE=report_binding
          set +e
          report_name="$(/usr/bin/python3 -I - "$report_dir" \
            "$invocation_started_at" "$invocation_completed_at" \
            "$service_invocation_before" "$service_invocation_after" \
            "$current_id" "$previous_id" 2>/dev/null <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          report_dir = Path(sys.argv[1])
          pattern = re.compile(r"^platform-maintenance-[0-9]{8}T[0-9]{6}Z\.json$")
          try:
              started_at = datetime.fromisoformat(sys.argv[2].replace("Z", "+00:00"))
              completed_at = datetime.fromisoformat(sys.argv[3].replace("Z", "+00:00"))
              before_id, after_id = sys.argv[4], sys.argv[5]
              current_id, previous_id = sys.argv[6], sys.argv[7]
              if (
                  started_at.tzinfo != timezone.utc
                  or completed_at.tzinfo != timezone.utc
                  or completed_at < started_at
                  or (before_id and not re.fullmatch(r"[0-9a-f]{32}", before_id))
                  or not re.fullmatch(r"[0-9a-f]{32}", after_id)
                  or before_id == after_id
              ):
                  raise ValueError
              directory = report_dir.lstat()
              if (
                  not stat.S_ISDIR(directory.st_mode)
                  or stat.S_ISLNK(directory.st_mode)
                  or directory.st_uid != 0
                  or directory.st_gid != 0
                  or (stat.S_IMODE(directory.st_mode) & 0o022)
              ):
                  raise ValueError
              start_ns = int(started_at.timestamp() * 1_000_000_000)
              finish_ns = int(completed_at.timestamp() * 1_000_000_000)
              matches = []
              for path in report_dir.iterdir():
                  if not pattern.fullmatch(path.name):
                      continue
                  named = path.lstat()
                  if not start_ns <= named.st_mtime_ns <= finish_ns:
                      continue
                  if (
                      not stat.S_ISREG(named.st_mode)
                      or stat.S_ISLNK(named.st_mode)
                      or named.st_uid != 0
                      or named.st_gid != 0
                      or named.st_nlink != 1
                      or stat.S_IMODE(named.st_mode) != 0o600
                  ):
                      raise ValueError
                  descriptor = os.open(
                      path,
                      os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | os.O_NOFOLLOW,
                  )
                  try:
                      opened = os.fstat(descriptor)
                      current = path.lstat()
                      if (
                          (opened.st_dev, opened.st_ino) != (current.st_dev, current.st_ino)
                          or (named.st_dev, named.st_ino) != (current.st_dev, current.st_ino)
                          or not stat.S_ISREG(opened.st_mode)
                          or opened.st_uid != 0
                          or opened.st_gid != 0
                          or opened.st_nlink != 1
                          or stat.S_IMODE(opened.st_mode) != 0o600
                          or opened.st_size > 256 * 1024
                      ):
                          raise ValueError
                      payload_bytes = os.read(descriptor, 256 * 1024 + 1)
                      if len(payload_bytes) > 256 * 1024:
                          raise ValueError
                  finally:
                      os.close(descriptor)
                  payload = json.loads(payload_bytes)
                  if not isinstance(payload, dict) or payload.get("mode") != "apply":
                      continue
                  production = payload.get("production_releases")
                  protected = production.get("protected") if isinstance(production, dict) else None
                  backup = payload.get("backup")
                  if (
                      not isinstance(protected, list)
                      or current_id not in protected
                      or previous_id not in protected
                      or not isinstance(backup, dict)
                      or backup.get("status") != "completed"
                      or backup.get("restore_verified") is not True
                  ):
                      continue
                  report_started = datetime.fromisoformat(
                      str(payload.get("started_at_utc", "")).replace("Z", "+00:00")
                  )
                  report_completed = datetime.fromisoformat(
                      str(payload.get("completed_at_utc", "")).replace("Z", "+00:00")
                  )
                  if (
                      report_started.tzinfo == timezone.utc
                      and report_completed.tzinfo == timezone.utc
                      and started_at <= report_started <= report_completed <= completed_at
                      and isinstance(payload.get("ok"), bool)
                  ):
                      matches.append(path.name)
              if len(matches) != 1:
                  raise LookupError
              print(matches[0])
          except LookupError:
              raise SystemExit(3)
          except Exception:
              raise SystemExit(2)
          PY
          )"
          report_binding_status=$?
          set -e
          if (( report_binding_status != 0 )); then
            if (( service_status != 0 )); then
              fail_with_status report_unavailable "$service_status"
            fi
            failure_code=$(( report_binding_status == 3 ? 3 : 2 ))
            fail_with_status report_unavailable "$failure_code"
          fi
          [[ "$report_name" =~ ^platform-maintenance-[0-9]{8}T[0-9]{6}Z\.json$ ]] \
            || fail "Bound maintenance report name is invalid."
          latest_report="$report_dir/$report_name"
          CURRENT_STAGE=retention_summary
          retention_summary_file="$(mktemp)"
          trap 'rm -f -- "$retention_summary_file"' EXIT
          /usr/bin/python3 -I "$summary_tool" --mode retention <"$latest_report" \
            >"$retention_summary_file" \
            || fail "Maintenance report summary failed."
          maintenance_result="$(/usr/bin/python3 -I - \
            "$retention_summary_file" "$service_status" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          backup = report.get("backup") or {}
          disk = report.get("disk_after") or {}
          limits = report.get("limits") or {}
          ok = report.get("ok")
          if report.get("mode") != "apply" or not isinstance(ok, bool):
              raise SystemExit(2)
          if backup.get("status") != "completed" or backup.get("restore_verified") is not True:
              raise SystemExit(2)
          free_bytes = disk.get("free_bytes")
          used_percent = disk.get("used_percent")
          minimum_free = limits.get("minimum_free_bytes")
          maximum_used = limits.get("maximum_used_percent")
          def numeric(value):
              return isinstance(value, (int, float)) and not isinstance(value, bool)
          if not all(numeric(value) for value in (free_bytes, used_percent, minimum_free, maximum_used)):
              raise SystemExit(2)
          threshold_failed = free_bytes < minimum_free or used_percent > maximum_used
          service_status = int(sys.argv[2])
          if ok == threshold_failed:
              status, error_class = "failed", "inconsistent_result"
          elif not ok and threshold_failed:
              status, error_class = "unhealthy", "disk_threshold"
          elif ok and service_status == 0:
              status, error_class = "ok", "none"
          else:
              status, error_class = "failed", "service_exit"
          print(json.dumps({
              "schema": 1,
              "kind": "storage_maintenance_result",
              "status": status,
              "error_class": error_class,
              "service_exit_code": service_status,
              "minimum_free_bytes": minimum_free,
              "maximum_used_percent": maximum_used,
              "free_bytes": free_bytes,
              "used_percent": used_percent,
          }, sort_keys=True, separators=(",", ":")))
          PY
          )" || fail "Maintenance report result summary failed."
          printf '%s\n' "$maintenance_result"
          cat "$retention_summary_file"
          maintenance_result_status="$(printf '%s\n' "$maintenance_result" \
            | /usr/bin/python3 -I -c 'import json,sys; print(json.load(sys.stdin).get("status", "invalid"))')"
          if [[ "$maintenance_result_status" == unhealthy ]]; then
            CURRENT_STAGE=service_result
            failure_code=$(( service_status != 0 ? service_status : 1 ))
            fail_with_status disk_threshold "$failure_code"
          elif [[ "$maintenance_result_status" == failed || "$maintenance_result_status" != ok ]]; then
            CURRENT_STAGE=service_result
            failure_code=$(( service_status != 0 ? service_status : 2 ))
            fail_with_status maintenance_service_failed "$failure_code"
          fi

          CURRENT_STAGE=postchecks
          for service in deadlock-api deadlock-worker deadlock-web nginx; do
            systemctl is-active --quiet "$service" || fail "$service is not active after maintenance."
          done
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8010/api/v1/health/live >/dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8010/api/v1/health/ready >/dev/null
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/ >/dev/null
          df_bytes="$(df -B1 --output=size,used,avail,pcent -- / 2>/dev/null)" \
            || fail "Disk usage producer failed."
          printf '%s\n' "$df_bytes" \
            | /usr/bin/python3 -I "$summary_tool" --mode df --category root \
            || fail "Disk usage summary failed."
          df_inodes="$(df --output=iused,iavail,ipcent -- / 2>/dev/null)" \
            || fail "Inode usage producer failed."
          printf '%s\n' "$df_inodes" \
            | /usr/bin/python3 -I "$summary_tool" --mode inode --category root \
            || fail "Inode usage summary failed."
          printf 'health=passed\n'
          REMOTE
          remote_status=$?
          if (( remote_status != 0 )); then
            if (( remote_status == 255 )); then
              printf '%s\n' \
                '{"schema":1,"kind":"collection_transport","status":"failed","stage":"ssh_transport","outcome":"transport_failed","exit_code":255}' \
                >> "$remote_log"
            else
              printf '{"schema":1,"kind":"collection_transport","status":"failed","stage":"remote_exit","outcome":"nonzero_exit","exit_code":%d}\n' \
                "$remote_status" >> "$remote_log"
            fi
          fi
          set -e
          echo "remote_status=$remote_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-storage-maintenance-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock"
          test ! -e "$ssh_dir/control-master"
          test ! -e "$ssh_dir/control-master.sock"
          rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- "$RUNNER_TEMP/platform-production-storage-maintenance-artifacts/ssh-error.log"
          test ! -e "$RUNNER_TEMP/platform-production-storage-maintenance-artifacts/ssh-error.log"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Publish maintenance evidence
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-storage-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-production-storage-maintenance-artifacts/maintenance.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce maintenance result
        if: ${{ always() }}
        shell: bash
        env:
          REMOTE_STATUS: ${{ steps.maintenance.outputs.remote_status }}
        run: |
          set -euo pipefail
          [[ "$REMOTE_STATUS" =~ ^(0|[1-9][0-9]{0,2})$ ]] \
            || { echo "Maintenance remote status was not a bounded integer." >&2; exit 2; }
          (( REMOTE_STATUS <= 255 )) \
            || { echo "Maintenance remote status exceeded the SSH exit range." >&2; exit 2; }
          if (( REMOTE_STATUS != 0 )); then
            echo "Production storage maintenance failed after evidence upload (exit $REMOTE_STATUS)." >&2
          fi
          exit "$REMOTE_STATUS"
