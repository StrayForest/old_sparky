name: Platform production retained load cleanup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE-PRODUCTION-RETAINED-LOAD to remove one exact retained load run"
        required: true
        type: string
      load_run_id:
        description: "GitHub run ID of the production retained-load workflow to clean"
        required: true
        type: string
      control_email:
        description: "The same control account email used by the retained-load run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-retained-load-cleanup
  cancel-in-progress: false

jobs:
  resolve-host-tools-pin:
    name: Resolve retained-load host-tools pin without production secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      host_tools_sha: ${{ steps.resolve.outputs.host_tools_sha }}
      app_target_sha: ${{ steps.resolve-source-binding.outputs.app_target_sha }}
      source_binding_artifact_id: ${{ steps.publish-source-binding.outputs.artifact-id }}
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact target as untrusted source data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact retained-load host-tools generation
        id: resolve
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          QA_CONFIRMATION: ${{ inputs.confirmation }}
          LOAD_RUN_ID: ${{ inputs.load_run_id }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$QA_CONFIRMATION" = "DELETE-PRODUCTION-RETAINED-LOAD"
          [[ "$LOAD_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          test "$EXPECTED_REPOSITORY" = "StrayForest/old_sparky"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- platform)"
          pin_output="$RUNNER_TEMP/retained-load-host-tools-pin"
          trap 'rm -f -- "$pin_output"' EXIT
          /usr/bin/python3 platform/tools/platform_host_tools_pin.py resolve \
            --source-root "$GITHUB_WORKSPACE" --target-sha "$TARGET_SHA" \
            --expected-repository "$EXPECTED_REPOSITORY" > "$pin_output"
          test "$(stat -c '%F:%h:%a' -- "$pin_output")" = "regular file:1:600"
          test "$(wc -l < "$pin_output" | tr -d '[:space:]')" = 1
          IFS= read -r host_tools_sha < "$pin_output"
          [[ "$host_tools_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'host_tools_sha=%s\n' "$host_tools_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve exact runner and active app source binding
        id: resolve-source-binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          binding_dir="$RUNNER_TEMP/retained-cleanup-source-binding"
          /usr/bin/python3 platform/tools/platform_noop_source_binding.py \
            resolve-workflow-source-binding \
            "$TARGET_SHA" "$GITHUB_REPOSITORY" "$GITHUB_API_URL" \
            "$binding_dir" "$GITHUB_OUTPUT"
          test "$(stat -c '%F:%h:%a:%u' -- "$binding_dir")" = "directory:2:700:$(id -u)" || {
            # The source-binding.json is the one expected directory entry;
            # directory hard-link counts vary by filesystem, so validate its
            # type, owner and mode separately below.
            test "$(stat -c '%F:%a:%u' -- "$binding_dir")" = "directory:700:$(id -u)"
          }
          test "$(stat -c '%F:%h:%a:%u' -- "$binding_dir/source-binding.json")" = "regular file:1:600:$(id -u)"
          /usr/bin/python3 - "$binding_dir/source-binding.json" "$TARGET_SHA" <<'PY'
          import json
          from pathlib import Path
          import re
          import stat
          import sys

          path = Path(sys.argv[1])
          target_sha = sys.argv[2]
          metadata = path.lstat()
          if (
              not stat.S_ISREG(metadata.st_mode)
              or stat.S_ISLNK(metadata.st_mode)
              or metadata.st_nlink != 1
              or stat.S_IMODE(metadata.st_mode) != 0o600
              or metadata.st_size > 20 * 1024
          ):
              raise SystemExit("source-binding handoff metadata is invalid")
          raw = path.read_bytes()
          try:
              value = json.loads(raw.decode("ascii"))
          except (UnicodeError, json.JSONDecodeError):
              raise SystemExit("source-binding handoff is malformed") from None
          keys = {"schema", "runner_sha", "app_target_sha", "source_binding"}
          if (
              not isinstance(value, dict)
              or set(value) != keys
              or type(value.get("schema")) is not int
              or value.get("schema") != 1
              or value.get("runner_sha") != target_sha
              or re.fullmatch(r"[0-9a-f]{40}", str(value.get("app_target_sha"))) is None
          ):
              raise SystemExit("source-binding handoff identity is invalid")
          binding = value.get("source_binding")
          if binding is None:
              if value["app_target_sha"] != target_sha:
                  raise SystemExit("source-binding same-source identity is invalid")
          else:
              expected = {
                  "schema", "binding_mode", "runner_sha", "app_target_sha", "baseline_identity",
                  "receipt_document_sha256", "receipt_artifact_id", "receipt_artifact_name",
                  "receipt_artifact_digest", "receipt_archive_sha256", "cumulative_manifest_sha256",
                  "source_security_run_id", "source_security_run_attempt", "autodeploy_run_id",
                  "autodeploy_run_attempt", "production_deploy_run_id", "production_deploy_run_attempt",
              }
              if (
                  not isinstance(binding, dict)
                  or set(binding) != expected
                  or binding.get("binding_mode") != "verified-noop"
                  or binding.get("runner_sha") != target_sha
                  or binding.get("app_target_sha") != value["app_target_sha"]
              ):
                  raise SystemExit("source-binding verified-noop identity is invalid")
          PY

      - name: Publish exact source-binding handoff
        id: publish-source-binding
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-retained-cleanup-source-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-cleanup-source-binding/source-binding.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove local source-binding handoff
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          binding_dir="$RUNNER_TEMP/retained-cleanup-source-binding"
          if [[ -e "$binding_dir" || -L "$binding_dir" ]]; then
            test -d "$binding_dir" && test ! -L "$binding_dir"
            rm -f -- "$binding_dir/source-binding.json"
            rmdir -- "$binding_dir"
          fi
          test ! -e "$binding_dir" && test ! -L "$binding_dir"

  cleanup:
    name: Exact cleanup of one production retained-load run
    needs: resolve-host-tools-pin
    if: needs.resolve-host-tools-pin.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      contents: none
    env:
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      LOAD_RUN_ID: ${{ inputs.load_run_id }}
      TARGET_SHA: ${{ github.sha }}
      APP_TARGET_SHA: ${{ needs.resolve-host-tools-pin.outputs.app_target_sha }}
      HOST_TOOLS_SHA: ${{ needs.resolve-host-tools-pin.outputs.host_tools_sha }}
      SOURCE_BINDING_ARTIFACT_ID: ${{ needs.resolve-host-tools-pin.outputs.source_binding_artifact_id }}

    steps:
      - name: Download exact source-binding handoff
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          artifact-ids: ${{ needs.resolve-host-tools-pin.outputs.source_binding_artifact_id }}
          path: ${{ runner.temp }}/retained-cleanup-source-binding

      - name: Verify exact source-binding artifact metadata and archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BINDING_ARTIFACT_ID: ${{ needs.resolve-host-tools-pin.outputs.source_binding_artifact_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP/retained-cleanup-source-binding/source-binding.json" <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          binding_path = Path(sys.argv[1])
          token = os.environ.get("GH_TOKEN", "")
          api_base = os.environ.get("GITHUB_API_URL", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          artifact_id = os.environ.get("SOURCE_BINDING_ARTIFACT_ID", "")
          target_sha = os.environ.get("TARGET_SHA", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
          if (
              not token
              or not api_base.startswith("https://")
              or api_base.endswith("/")
              or re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", artifact_id) is None
              or re.fullmatch(r"[0-9a-f]{40}", target_sha) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", run_id) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", attempt) is None
          ):
              raise SystemExit("source-binding artifact context is invalid")
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, new_url):
                  destination = urllib.parse.urlsplit(new_url)
                  source = urllib.parse.urlsplit(request.full_url)
                  if (
                      destination.scheme != "https"
                      or not destination.netloc
                      or destination.username is not None
                      or destination.password is not None
                  ):
                      return None
                  redirected = super().redirect_request(request, fp, code, message, headers, new_url)
                  if redirected is not None and destination.netloc != source.netloc:
                      for name in (
                          "Authorization", "Proxy-Authorization", "Cookie", "Cookie2"
                      ):
                          redirected.remove_header(name)
                          redirected.remove_header(name.lower())
                  return redirected

          opener = urllib.request.build_opener(SafeRedirect())
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "OldSparky-retained-cleanup-binding-check",
          }
          api_root = f"{api_base}/repos/{repository}"

          def read_url(url: str, maximum: int, accept: str | None = None) -> bytes:
              request_headers = dict(headers)
              if accept is not None:
                  request_headers["Accept"] = accept
              request = urllib.request.Request(url, headers=request_headers)
              try:
                  with opener.open(request, timeout=20) as response:
                      if response.status != 200:
                          raise ValueError
                      raw = response.read(maximum + 1)
              except (OSError, urllib.error.URLError, urllib.error.HTTPError, ValueError):
                  raise SystemExit("source-binding artifact verification failed") from None
              if len(raw) > maximum:
                  raise SystemExit("source-binding artifact exceeds its bound")
              return raw

          metadata_raw = read_url(
              f"{api_root}/actions/artifacts/{artifact_id}", 256 * 1024
          )
          try:
              metadata = json.loads(metadata_raw)
          except (UnicodeError, json.JSONDecodeError):
              raise SystemExit("source-binding artifact metadata is malformed") from None
          artifact_name = f"platform-retained-cleanup-source-binding-{run_id}-{attempt}"
          workflow_run = metadata.get("workflow_run") if isinstance(metadata, dict) else None
          if (
              not isinstance(metadata, dict)
              or type(metadata.get("id")) is not int
              or metadata.get("id") != int(artifact_id)
              or metadata.get("name") != artifact_name
              or type(metadata.get("expired")) is not bool
              or metadata.get("expired") is not False
              or not isinstance(metadata.get("digest"), str)
              or re.fullmatch(r"sha256:[0-9a-f]{64}", metadata.get("digest", "")) is None
              or not isinstance(workflow_run, dict)
              or type(workflow_run.get("id")) is not int
              or workflow_run.get("id") != int(run_id)
              or workflow_run.get("head_sha") != target_sha
              or workflow_run.get("head_branch") != "dev"
          ):
              raise SystemExit("source-binding artifact metadata identity is invalid")
          normalized_digest = metadata["digest"].removeprefix("sha256:")
          attempt_url = f"{api_root}/actions/runs/{run_id}/attempts/{attempt}"
          attempt_raw = read_url(attempt_url, 256 * 1024)
          try:
              attempt_record = json.loads(attempt_raw)
          except (UnicodeError, json.JSONDecodeError):
              raise SystemExit("source-binding workflow attempt is malformed") from None
          if (
              not isinstance(attempt_record, dict)
              or type(attempt_record.get("id")) is not int
              or attempt_record.get("id") != int(run_id)
              or type(attempt_record.get("run_attempt")) is not int
              or attempt_record.get("run_attempt") != int(attempt)
              or attempt_record.get("head_sha") != target_sha
              or attempt_record.get("head_branch") != "dev"
          ):
              raise SystemExit("source-binding workflow attempt identity is invalid")

          archive_bytes = read_url(
              f"{api_root}/actions/artifacts/{artifact_id}/zip",
              256 * 1024,
              "application/vnd.github+json",
          )
          if hashlib.sha256(archive_bytes).hexdigest() != normalized_digest:
              raise SystemExit("source-binding artifact archive digest does not match")
          file_meta = binding_path.lstat()
          if (
              not stat.S_ISREG(file_meta.st_mode)
              or stat.S_ISLNK(file_meta.st_mode)
              or file_meta.st_nlink != 1
              or file_meta.st_size > 20 * 1024
          ):
              raise SystemExit("downloaded source-binding handoff is unsafe")
          downloaded = binding_path.read_bytes()
          try:
              with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                  entries = archive.infolist()
                  if len(entries) != 1 or entries[0].filename != "source-binding.json" or entries[0].file_size > 20 * 1024:
                      raise ValueError
                  mode = (entries[0].external_attr >> 16) & 0o170000
                  if mode not in (0, stat.S_IFREG):
                      raise ValueError
                  with archive.open(entries[0]) as source:
                      archived = source.read(20 * 1024 + 1)
          except (OSError, EOFError, ValueError, zipfile.BadZipFile):
              raise SystemExit("source-binding artifact archive is malformed") from None
          if len(archived) > 20 * 1024 or archived != downloaded:
              raise SystemExit("downloaded source-binding handoff differs from authenticated artifact")
          print("SOURCE_BINDING_ARTIFACT status=verified")
          PY

      - name: Validate explicit cleanup confirmation
        id: validate_cleanup_inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production cleanup must run from the reviewed dev branch." >&2; exit 1; }
          test "$QA_CONFIRMATION" = "DELETE-PRODUCTION-RETAINED-LOAD" \
            || { echo "Refusing cleanup without exact confirmation." >&2; exit 1; }
          [[ "$LOAD_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "load_run_id must be a positive decimal identifier." >&2; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "target_sha must be a lowercase 40-character commit SHA." >&2; exit 1; }
          [[ "$SOURCE_BINDING_ARTIFACT_ID" =~ ^[1-9][0-9]{0,31}$ ]] \
            || { echo "Source-binding artifact identity is invalid." >&2; exit 1; }
          # Validate and serialize operator-controlled identity before any
          # SSH key file, keyscan or remote command is reached.  This is a
          # data-only handoff; the secret job never loads repository code.
          /usr/bin/python3 - "$TARGET_SHA" "$LOAD_RUN_ID" "$GITHUB_RUN_ID" "$GITHUB_EVENT_PATH" \
            "$RUNNER_TEMP/retained-cleanup-source-binding/source-binding.json" \
            "$APP_TARGET_SHA" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          target_sha, load_run_id, cleanup_run_id, event_path, binding_path_value, expected_app_sha = sys.argv[1:]
          try:
              flags = os.O_RDONLY | os.O_NOFOLLOW
              descriptor = os.open(event_path, flags)
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or metadata.st_size > 65536
                      or stat.S_IMODE(metadata.st_mode) & 0o022
                  ):
                      raise ValueError
                  with os.fdopen(descriptor, "rb", closefd=False) as event_file:
                      raw_event = event_file.read(65537)
              finally:
                  os.close(descriptor)
              if len(raw_event) > 65536:
                  raise ValueError

              def reject_duplicate_keys(pairs):
                  values = {}
                  for key, value in pairs:
                      if key in values:
                          raise ValueError
                      values[key] = value
                  return values

              def reject_duplicate_binding_keys(pairs):
                  values = {}
                  for key, value in pairs:
                      if key in values:
                          raise ValueError
                      values[key] = value
                  return values

              event = json.loads(
                  raw_event.decode("utf-8"), object_pairs_hook=reject_duplicate_keys
              )
              inputs = event.get("inputs") if isinstance(event, dict) else None
              if not isinstance(inputs, dict) or set(inputs) != {
                  "confirmation", "control_email", "load_run_id"
              }:
                  raise ValueError
              email = inputs.get("control_email") if isinstance(inputs, dict) else None
              binding_path = Path(binding_path_value)
              binding_meta = binding_path.lstat()
              if (
                  not stat.S_ISREG(binding_meta.st_mode)
                  or stat.S_ISLNK(binding_meta.st_mode)
                  or binding_meta.st_nlink != 1
                  or binding_meta.st_size > 20 * 1024
              ):
                  raise ValueError
              binding_raw = binding_path.read_bytes()
              source_handoff = json.loads(
                  binding_raw.decode("ascii"),
                  object_pairs_hook=reject_duplicate_binding_keys,
              )
          except (OSError, UnicodeError, ValueError, json.JSONDecodeError):
              raise SystemExit("cleanup control identity input is invalid")
          binding_keys = {
              "schema", "binding_mode", "runner_sha", "app_target_sha", "baseline_identity",
              "receipt_document_sha256", "receipt_artifact_id", "receipt_artifact_name",
              "receipt_artifact_digest", "receipt_archive_sha256", "cumulative_manifest_sha256",
              "source_security_run_id", "source_security_run_attempt", "autodeploy_run_id",
              "autodeploy_run_attempt", "production_deploy_run_id", "production_deploy_run_attempt",
          }
          if (
              not isinstance(source_handoff, dict)
              or set(source_handoff) != {"schema", "runner_sha", "app_target_sha", "source_binding"}
              or type(source_handoff.get("schema")) is not int
              or source_handoff.get("schema") != 1
              or source_handoff.get("runner_sha") != target_sha
              or source_handoff.get("app_target_sha") != expected_app_sha
              or re.fullmatch(r"[0-9a-f]{40}", expected_app_sha) is None
          ):
              raise SystemExit("cleanup source-binding handoff is invalid")
          source_binding = source_handoff.get("source_binding")
          if source_binding is None:
              if expected_app_sha != target_sha:
                  raise SystemExit("cleanup same-source binding is invalid")
          elif (
              not isinstance(source_binding, dict)
              or set(source_binding) != binding_keys
              or type(source_binding.get("schema")) is not int
              or source_binding.get("schema") != 1
              or source_binding.get("binding_mode") != "verified-noop"
              or source_binding.get("runner_sha") != target_sha
              or source_binding.get("app_target_sha") != expected_app_sha
              or expected_app_sha == target_sha
          ):
              raise SystemExit("cleanup verified-noop binding is invalid")
          else:
              baseline = source_binding.get("baseline_identity")
              baseline_keys = {
                  "schema", "source_sha", "release_slug", "release_json_sha256",
                  "current_link_dev", "current_link_ino", "release_dev", "release_ino",
                  "pending_operation",
              }
              def positive_decimal(value):
                  return isinstance(value, str) and re.fullmatch(r"[1-9][0-9]{0,31}", value) is not None
              def sha256_hex(value):
                  return isinstance(value, str) and re.fullmatch(r"[0-9a-f]{64}", value) is not None
              def positive_native_integer(value):
                  return type(value) is int and 0 < value <= 2**63 - 1
              run_fields = (
                  "source_security_run_id", "source_security_run_attempt",
                  "autodeploy_run_id", "autodeploy_run_attempt",
                  "production_deploy_run_id", "production_deploy_run_attempt",
                  "receipt_artifact_id",
              )
              if (
                  not isinstance(baseline, dict)
                  or set(baseline) != baseline_keys
                  or type(baseline.get("schema")) is not int
                  or baseline.get("schema") != 1
                  or baseline.get("source_sha") != expected_app_sha
                  or re.fullmatch(r"gha-[1-9][0-9]{0,31}-[1-9][0-9]{0,31}-[0-9a-f]{12}", str(baseline.get("release_slug"))) is None
                  or not sha256_hex(baseline.get("release_json_sha256"))
                  or any(not positive_native_integer(baseline.get(name)) for name in ("current_link_dev", "current_link_ino", "release_dev", "release_ino"))
                  or type(baseline.get("pending_operation")) is not bool
                  or baseline.get("pending_operation") is not False
                  or any(not positive_decimal(source_binding.get(name)) for name in run_fields)
                  or any(not sha256_hex(source_binding.get(name)) for name in ("receipt_document_sha256", "receipt_archive_sha256", "cumulative_manifest_sha256"))
                  or not isinstance(source_binding.get("receipt_artifact_name"), str)
                  or source_binding.get("receipt_artifact_name") != f"platform-production-noop-source-receipt-{source_binding.get('production_deploy_run_id')}-{source_binding.get('production_deploy_run_attempt')}"
                  or not isinstance(source_binding.get("receipt_artifact_digest"), str)
                  or re.fullmatch(r"sha256:[0-9a-f]{64}", source_binding.get("receipt_artifact_digest")) is None
                  or source_binding.get("receipt_archive_sha256") != source_binding.get("receipt_artifact_digest", "").removeprefix("sha256:")
              ):
                  raise SystemExit("cleanup verified-noop binding proof is malformed")
          if (
              re.fullmatch(r"[0-9a-f]{40}", target_sha) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", load_run_id) is None
              or re.fullmatch(r"[1-9][0-9]{0,31}", cleanup_run_id) is None
              or not isinstance(email, str)
              or not re.fullmatch(r"[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]{1,64}@[A-Za-z0-9.-]{1,253}", email)
              or any(ord(character) < 0x21 or ord(character) > 0x7E for character in email)
          ):
              raise SystemExit("cleanup handoff is invalid")
          canonical_email = email.lower()
          for value in dict.fromkeys((email, canonical_email)):
              escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              sys.stdout.write(f"::add-mask::{escaped}\n")
          sys.stdout.flush()
          handoff = json.dumps({
              "schema": 2 if source_binding is not None else 1,
              "target_sha": target_sha,
              "control_email": canonical_email,
              "load_run_id": load_run_id,
              "cleanup_run_id": cleanup_run_id,
              **({"source_binding": source_binding} if source_binding is not None else {}),
          }, separators=(",", ":")).encode("ascii") + b"\n"
          output_path = Path(os.environ["RUNNER_TEMP"]) / "platform-retained-cleanup-input.json"
          try:
              descriptor = os.open(
                  output_path,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                  0o600,
              )
              try:
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or stat.S_IMODE(metadata.st_mode) != 0o600
                  ):
                      raise OSError
                  with os.fdopen(descriptor, "wb", closefd=False) as output_file:
                      output_file.write(handoff)
                      output_file.flush()
                      os.fsync(output_file.fileno())
                  metadata = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or metadata.st_uid != os.geteuid()
                      or metadata.st_nlink != 1
                      or stat.S_IMODE(metadata.st_mode) != 0o600
                  ):
                      raise OSError
              finally:
                  os.close(descriptor)
          except OSError:
              raise SystemExit("cleanup handoff could not be created safely")
          PY
          test "$(stat -c '%F:%h:%a:%u' -- "$RUNNER_TEMP/platform-retained-cleanup-input.json")" = "regular file:1:600:$(id -u)"

      - name: Configure production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/platform-retained-cleanup-input.json" \
            || { echo "Cleanup workflow handoff is missing; refusing SSH setup" >&2; exit 1; }
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/production-retained-cleanup-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Clean the exact retained load run on production
        id: run-cleanup
        if: ${{ success() && steps.validate_cleanup_inputs.outcome == 'success' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -u
          umask 077
          remote_status=1
          remote_ssh_exit_code=255
          remote_stage=unknown
          remote_child_exit=unknown
          cleanup_artifact_status=1
          cleanup_export_status=1
          input_path="$RUNNER_TEMP/platform-retained-cleanup-input.json"
          ssh_output_file="$RUNNER_TEMP/production-retained-cleanup-ssh-output"
          canonical_raw="$RUNNER_TEMP/production-retained-cleanup-canonical.raw"
          artifact_dir="$RUNNER_TEMP/production-retained-cleanup-artifacts"
          cleanup_summary="$artifact_dir/cleanup-summary.json"
          canonical_log="$artifact_dir/canonical.log"
          export_dir="/tmp/old-sparky-production-retained-cleanup-$GITHUB_RUN_ID"
          test -s "$input_path" \
            || { echo "Cleanup workflow handoff is missing; refusing remote cleanup" >&2; exit 1; }
          [[ "$HOST_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "Retained-load host-tools pin is invalid; refusing remote export cleanup" >&2; exit 1; }
          retained_load_dispatcher="/opt/oldsparky/platform/shared/host-tools/$HOST_TOOLS_SHA/platform_workflow_remote_dispatch.py"
          install -d -m 700 "$artifact_dir"
          trap 'rm -f -- "$ssh_output_file" "$input_path"; test ! -e "$input_path"; ssh_dir="$RUNNER_TEMP/production-retained-cleanup-ssh"; if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then test -d "$ssh_dir" && test ! -L "$ssh_dir"; rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$ssh_dir/known_hosts.scan" "$ssh_dir/known_hosts.scan.1" "$ssh_dir/known_hosts.scan.2" "$ssh_dir/config" "$ssh_dir/control.sock" "$ssh_dir/control-master" "$ssh_dir/control-master.sock"; rmdir -- "$ssh_dir"; fi; test ! -e "$ssh_dir" && test ! -L "$ssh_dir"' EXIT

          project_cleanup_summary() {
            local source="$1"
            local destination="$2"
            /usr/bin/python3 - "$source" "$destination" <<'PY'
          import json
          from pathlib import Path
          import sys

          source_path, destination_path = (Path(value) for value in sys.argv[1:])
          fallback = {
              "schema": 1,
              "ok": False,
              "markers": 0,
              "users_deleted": 0,
              "tournaments_deleted": 0,
              "control_account_preserved": False,
              "error_class": "cleanup_summary_invalid",
          }

          def write_fallback() -> None:
              destination_path.write_text(json.dumps(fallback, sort_keys=True) + chr(10), encoding="utf-8")

          try:
              source = json.loads(source_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              write_fallback()
              raise SystemExit(1)
          if not isinstance(source, dict) or not isinstance(source.get("ok"), bool):
              write_fallback()
              raise SystemExit(1)

          def bounded_count(name: str) -> int:
              value = source.get(name)
              if isinstance(value, bool) or not isinstance(value, int) or not 0 <= value <= 10_000_000:
                  raise ValueError(name)
              return value

          try:
              projection = {
                  "schema": 1,
                  "ok": source["ok"],
                  "markers": bounded_count("markers"),
                  "users_deleted": bounded_count("users_deleted"),
                  "tournaments_deleted": bounded_count("tournaments_deleted"),
                  "control_account_preserved": source["control_account_preserved"] is True,
              }
              if "partial_run_root_removed" in source:
                  if not isinstance(source["partial_run_root_removed"], bool):
                      raise ValueError("partial_run_root_removed")
                  projection["partial_run_root_removed"] = source["partial_run_root_removed"]
          except (KeyError, ValueError, TypeError):
              write_fallback()
              raise SystemExit(1)
          destination_path.write_text(json.dumps(projection, sort_keys=True) + chr(10), encoding="utf-8")
          PY
          }

          set +e
          # The remote command is fixed; all cleanup identity is in the
          # validated mode-600 JSON stdin document.
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B \
            /opt/oldsparky/platform/current/tools/platform_workflow_remote_dispatch.py \
            retained-cleanup < "$input_path" > "$ssh_output_file" 2>&1
          remote_status="$?"
          remote_ssh_exit_code="$remote_status"
          set -e
          if [[ -f "$ssh_output_file" && ! -L "$ssh_output_file" ]] \
            && [[ "$(stat -c '%s' -- "$ssh_output_file" 2>/dev/null || echo 999999)" =~ ^[0-9]+$ ]] \
            && (( $(stat -c '%s' -- "$ssh_output_file" 2>/dev/null || echo 999999) <= 512 )); then
            diagnostic_count=0
            while IFS= read -r diagnostic_line; do
              if [[ "$diagnostic_line" =~ ^RETAINED_CLEANUP_DIAGNOSTIC\ schema=1\ stage=(lock|input|identity|release_binding|run_root|external_vote_recovery|orphan_cleanup|matrix_cleanup|export_cleanup|complete|dispatcher|timeout|unknown)\ child_exit=([0-9]{1,3})$ ]]; then
                diagnostic_count=$((diagnostic_count + 1))
                if (( diagnostic_count == 1 )); then
                  remote_stage="${BASH_REMATCH[1]}"
                  remote_child_exit="${BASH_REMATCH[2]}"
                fi
              fi
            done < "$ssh_output_file"
            if (( diagnostic_count != 1 )); then
              remote_stage=unknown
              remote_child_exit=unknown
            fi
          fi
          rm -f -- "$ssh_output_file"
          test ! -e "$ssh_output_file"

          # Project the public summary before asking the host to delete its
          # private export inventory.  The projection has a closed schema and
          # cannot carry the control email or arbitrary remote error text.
          rm -f -- "$cleanup_summary"
          set +e
          scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/cleanup-summary.json" "$cleanup_summary" \
            >/dev/null 2>&1
          summary_copy_status="$?"
          set -e
          projection_status=1
          if [[ "$summary_copy_status" == "0" ]]; then
            public_summary="$cleanup_summary.public"
            set +e
            project_cleanup_summary "$cleanup_summary" "$public_summary"
            projection_status="$?"
            set -e
            if [[ "$projection_status" == "0" && -s "$public_summary" ]]; then
              chmod 600 "$public_summary"
              mv -- "$public_summary" "$cleanup_summary"
              test ! -e "$public_summary"
            else
              # Never leave a copied remote response in the artifact path when
              # the closed-schema projection rejects it.  Replace it with a
              # fixed failure record so later always-run evidence steps cannot
              # publish provider text or the control identity.
              rm -f -- "$cleanup_summary" "$public_summary"
              printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_summary_invalid"}' > "$cleanup_summary"
              chmod 600 "$cleanup_summary"
              projection_status=1
            fi
          else
            rm -f -- "$cleanup_summary"
            printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_summary_unavailable"}' > "$cleanup_summary"
            chmod 600 "$cleanup_summary"
          fi

          # Copy the canonical log while the private export still exists.  A
          # later secret-free step reduces it to the public aggregate.
          rm -f -- "$canonical_raw"
          set +e
          scp -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$export_dir/canonical.log" "$canonical_raw" \
            >/dev/null 2>&1
          canonical_copy_status="$?"
          set -e
          canonical_status=1
          if [[ "$canonical_copy_status" == "0" && -s "$canonical_raw" ]]; then
            canonical_status=0
          fi
          if [[ "$summary_copy_status" == "0" && "$projection_status" == "0" \
            && "$canonical_status" == "0" && -s "$cleanup_summary" ]]; then
            cleanup_artifact_status=0
          fi

          # Exact closed-inventory removal is attempted even when the primary
          # cleanup failed, but its status can never be hidden.
          set +e
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            /usr/bin/python3.12 -I -B \
            "$retained_load_dispatcher" \
            retained-cleanup-exports < "$input_path" >/dev/null 2>&1
          cleanup_export_status="$?"
          set -e
          if [[ "$remote_status" == "0" ]] \
            && { [[ "$cleanup_artifact_status" != "0" ]] || [[ "$cleanup_export_status" != "0" ]]; }; then
            remote_status=1
          fi
          echo "remote_exit_code=$remote_status" >> "$GITHUB_OUTPUT"
          echo "remote_ssh_exit_code=$remote_ssh_exit_code" >> "$GITHUB_OUTPUT"
          echo "remote_stage=$remote_stage" >> "$GITHUB_OUTPUT"
          echo "remote_child_exit=$remote_child_exit" >> "$GITHUB_OUTPUT"
          echo "cleanup_artifact_status=$cleanup_artifact_status" >> "$GITHUB_OUTPUT"
          echo "cleanup_export_status=$cleanup_export_status" >> "$GITHUB_OUTPUT"
          printf 'Retained cleanup diagnostic: ssh_exit=%s stage=%s child_exit=%s\n' \
            "$remote_ssh_exit_code" "$remote_stage" "$remote_child_exit" >> "$GITHUB_STEP_SUMMARY"
          # The final always-run gate reports the preserved primary status and
          # rejects any incomplete artifact projection or export deletion.
          exit 0

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          input_path="$RUNNER_TEMP/platform-retained-cleanup-input.json"
          rm -f -- "$input_path"
          test ! -e "$input_path"
          ssh_dir="$RUNNER_TEMP/production-retained-cleanup-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Diagnose cleanup evidence inputs
        if: ${{ always() }}
        shell: bash
        env:
          CLEANUP_REMOTE_EXIT: ${{ steps.run-cleanup.outputs.remote_exit_code }}
          CLEANUP_SSH_EXIT_CODE: ${{ steps.run-cleanup.outputs.remote_ssh_exit_code }}
          CLEANUP_REMOTE_STAGE: ${{ steps.run-cleanup.outputs.remote_stage }}
          CLEANUP_REMOTE_CHILD_EXIT: ${{ steps.run-cleanup.outputs.remote_child_exit }}
          CLEANUP_ARTIFACT_STATUS: ${{ steps.run-cleanup.outputs.cleanup_artifact_status }}
          CLEANUP_EXPORT_STATUS: ${{ steps.run-cleanup.outputs.cleanup_export_status }}
          CLEANUP_SSH_STEP: ${{ steps.cleanup_ssh.outcome }}
        run: |
          set +e
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path

          def classify(name: str, allowed: dict[str, str]) -> str:
              value = os.environ.get(name)
              if value is None or value == "":
                  return "missing"
              return allowed.get(value, "invalid")

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          artifact_dir = runner_temp / "production-retained-cleanup-artifacts"
          def present(path: Path) -> str:
              try:
                  return "present" if path.is_file() and path.stat().st_size > 0 else "absent"
              except OSError:
                  return "unknown"

          fields = {
              "remote": classify(
                  "CLEANUP_REMOTE_EXIT",
                  {"0": "ok", **{str(value): "failed" for value in range(1, 256)}},
              ),
              "ssh_exit": classify("CLEANUP_SSH_EXIT_CODE", {str(value): str(value) for value in range(256)}),
              "remote_stage": classify("CLEANUP_REMOTE_STAGE", {
                  "lock": "lock", "input": "input", "identity": "identity",
                  "release_binding": "release_binding", "run_root": "run_root",
                  "external_vote_recovery": "external_vote_recovery",
                  "orphan_cleanup": "orphan_cleanup", "matrix_cleanup": "matrix_cleanup",
                  "export_cleanup": "export_cleanup", "complete": "complete",
                  "dispatcher": "dispatcher", "timeout": "timeout", "unknown": "unknown",
              }),
              "child_exit": classify("CLEANUP_REMOTE_CHILD_EXIT", {str(value): str(value) for value in range(256)}),
              "artifact": classify("CLEANUP_ARTIFACT_STATUS", {"0": "ok", "1": "failed"}),
              "exports": classify("CLEANUP_EXPORT_STATUS", {"0": "ok", "1": "failed"}),
              "ssh_cleanup": classify("CLEANUP_SSH_STEP", {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"}),
              "canonical_raw": present(runner_temp / "production-retained-cleanup-canonical.raw"),
              "summary": present(artifact_dir / "cleanup-summary.json"),
              "canonical": present(artifact_dir / "canonical.log"),
          }
          print("RETAINED_CLEANUP_INPUT " + " ".join(f"{name}={value}" for name, value in fields.items()))
          PY
          diagnostic_status="$?"
          if [[ "$diagnostic_status" != 0 ]]; then
            printf '%s\n' 'RETAINED_CLEANUP_INPUT diagnostic=unavailable'
          fi
          exit 0

      - name: Normalize cleanup evidence
        id: normalize_cleanup_evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/production-retained-cleanup-artifacts"
          install -d -m 700 "$artifact_dir"
          canonical_raw="$RUNNER_TEMP/production-retained-cleanup-canonical.raw"
          sanitation_status=0
          if [[ -s "$canonical_raw" ]]; then
            # Keep this projection in the secret consumer.  It intentionally
            # accepts only a bounded, fixed schema and never executes a
            # sanitizer from the candidate checkout.
            /usr/bin/python3 - "$canonical_raw" "$artifact_dir/canonical.log" <<'PY' || sanitation_status=1
          import json
          from pathlib import Path
          import sys

          source, destination = (Path(value) for value in sys.argv[1:])
          try:
              raw = source.read_bytes()
              if len(raw) > 256 * 1024:
                  raise ValueError
              payload = json.loads(raw.decode("utf-8"))
              if not isinstance(payload, dict):
                  raise ValueError
              status = payload.get("status")
              if status not in {"passed", "failed", "unavailable", "unknown"}:
                  raise ValueError
              result = {
                  "schema": 1,
                  "status": status,
                  "line_count": min(max(int(payload.get("line_count", 0)), 0), 100000),
                  "retained_line_count": min(max(int(payload.get("retained_line_count", 0)), 0), 100000),
                  "truncated": payload.get("truncated") is True,
                  "class_counts": {"other": 1},
                  "route_class_counts": {"other": 1},
                  "status_counts": {},
              }
          except (OSError, UnicodeError, ValueError, TypeError, json.JSONDecodeError):
              raise SystemExit(1)
          destination.write_text(json.dumps(result, sort_keys=True) + "\n", encoding="utf-8")
          PY
          else
            sanitation_status=1
          fi
          rm -f -- "$canonical_raw"
          test ! -e "$canonical_raw"
          echo "sanitation_status=$sanitation_status" >> "$GITHUB_OUTPUT"
          if [[ ! -s "$artifact_dir/cleanup-summary.json" ]]; then
            printf '%s\n' '{"schema":1,"ok":false,"control_account_preserved":false,"error_class":"cleanup_unavailable"}' > "$artifact_dir/cleanup-summary.json"
          fi
          if [[ ! -s "$artifact_dir/canonical.log" ]]; then
            printf '%s\n' '{"schema":1,"status":"unavailable","line_count":0,"retained_line_count":0,"truncated":false,"class_counts":{"other":1},"route_class_counts":{"other":1},"status_counts":{}}' > "$artifact_dir/canonical.log"
          fi
          chmod 600 "$artifact_dir/cleanup-summary.json" "$artifact_dir/canonical.log"
          rm -f -- "$RUNNER_TEMP/production-retained-cleanup-remote.log"
          test ! -e "$RUNNER_TEMP/production-retained-cleanup-remote.log"

      - name: Diagnose normalized cleanup evidence
        if: ${{ always() }}
        shell: bash
        env:
          CLEANUP_REMOTE_EXIT: ${{ steps.run-cleanup.outputs.remote_exit_code }}
          CLEANUP_ARTIFACT_STATUS: ${{ steps.run-cleanup.outputs.cleanup_artifact_status }}
          CLEANUP_EXPORT_STATUS: ${{ steps.run-cleanup.outputs.cleanup_export_status }}
          CLEANUP_SANITATION_STATUS: ${{ steps.normalize_cleanup_evidence.outputs.sanitation_status }}
          CLEANUP_NORMALIZE_STEP: ${{ steps.normalize_cleanup_evidence.outcome }}
          CLEANUP_SSH_STEP: ${{ steps.cleanup_ssh.outcome }}
        run: |
          set +e
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def classify(name: str, allowed: dict[str, str]) -> str:
              value = os.environ.get(name)
              if value is None or value == "":
                  return "missing"
              return allowed.get(value, "invalid")

          artifact_dir = Path(os.environ["RUNNER_TEMP"]) / "production-retained-cleanup-artifacts"
          summary_status = "missing"
          summary_error = "missing"
          control_preserved = "unknown"
          try:
              path = artifact_dir / "cleanup-summary.json"
              if path.is_file():
                  with path.open("rb") as source:
                      raw = source.read(65537)
                  if len(raw) > 65536:
                      raise ValueError
                  payload = json.loads(raw.decode("utf-8"))
                  if isinstance(payload, dict) and payload.get("schema") == 1:
                      if payload.get("ok") is True:
                          summary_status = "passed"
                      elif payload.get("ok") is False:
                          summary_status = "failed"
                      else:
                          summary_status = "invalid"
                      error_class = payload.get("error_class")
                      if isinstance(error_class, str) and error_class in {"cleanup_summary_invalid", "cleanup_summary_unavailable", "cleanup_unavailable"}:
                          summary_error = error_class
                      elif error_class is None:
                          summary_error = "none" if payload.get("ok") is True else "missing"
                      else:
                          summary_error = "other"
                      control_preserved = "yes" if payload.get("control_account_preserved") is True else "no" if payload.get("control_account_preserved") is False else "unknown"
                  else:
                      summary_status = "invalid"
                      summary_error = "invalid"
          except (OSError, UnicodeError, ValueError, TypeError, json.JSONDecodeError):
              summary_status = "invalid"
              summary_error = "invalid"

          canonical_status = "missing"
          canonical_truncated = "unknown"
          try:
              path = artifact_dir / "canonical.log"
              if path.is_file():
                  with path.open("rb") as source:
                      raw = source.read(262145)
                  if len(raw) > 262144:
                      raise ValueError
                  payload = json.loads(raw.decode("utf-8"))
                  if isinstance(payload, dict) and payload.get("schema") == 1:
                      status = payload.get("status")
                      canonical_status = status if isinstance(status, str) and status in {"passed", "failed", "unavailable", "unknown"} else "invalid"
                      canonical_truncated = "yes" if payload.get("truncated") is True else "no" if payload.get("truncated") is False else "unknown"
                  else:
                      canonical_status = "invalid"
          except (OSError, UnicodeError, ValueError, TypeError, json.JSONDecodeError):
              canonical_status = "invalid"

          fields = {
              "remote": classify("CLEANUP_REMOTE_EXIT", {"0": "ok", "1": "failed"}),
              "artifact": classify("CLEANUP_ARTIFACT_STATUS", {"0": "ok", "1": "failed"}),
              "exports": classify("CLEANUP_EXPORT_STATUS", {"0": "ok", "1": "failed"}),
              "ssh_cleanup": classify("CLEANUP_SSH_STEP", {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"}),
              "normalize": classify("CLEANUP_NORMALIZE_STEP", {"success": "ok", "failure": "failed", "cancelled": "cancelled", "skipped": "skipped"}),
              "sanitation": classify("CLEANUP_SANITATION_STATUS", {"0": "ok", "1": "failed"}),
              "summary": summary_status,
              "summary_error": summary_error,
              "control_preserved": control_preserved,
              "canonical": canonical_status,
              "truncated": canonical_truncated,
          }
          print("RETAINED_CLEANUP_EVIDENCE " + " ".join(f"{name}={value}" for name, value in fields.items()))
          PY
          diagnostic_status="$?"
          if [[ "$diagnostic_status" != 0 ]]; then
            printf '%s\n' 'RETAINED_CLEANUP_EVIDENCE diagnostic=unavailable'
          fi
          exit 0

      - name: Reject incomplete cleanup log evidence
        id: validate_cleanup_evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP/production-retained-cleanup-artifacts/canonical.log" <<'PY'
          import json
          from pathlib import Path
          import sys

          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("required cleanup log evidence is not valid JSON")
          if (
              not isinstance(payload, dict)
              or payload.get("truncated") is not False
              or payload.get("status") in {"truncated", "error", "unavailable"}
          ):
              raise SystemExit("required cleanup log evidence is incomplete")
          PY

      - name: Publish cleanup artifacts
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' && steps.validate_cleanup_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-production-retained-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-retained-cleanup-artifacts/cleanup-summary.json
            ${{ runner.temp }}/production-retained-cleanup-artifacts/canonical.log
          if-no-files-found: error
          retention-days: 14

      - name: Write cleanup summary
        if: ${{ always() }}
        shell: bash
        run: |
          summary="$RUNNER_TEMP/production-retained-cleanup-artifacts/cleanup-summary.json"
          if [[ ! -s "$summary" ]]; then
            {
              echo "### Production retained-load cleanup"
              echo
              echo "No cleanup summary was exported from the production server."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          /usr/bin/python3 - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("### Production retained-load cleanup")
          print()
          print(f"- Status: **{'passed' if payload.get('ok') else 'failed'}**")
          print(f"- Markers cleaned: {payload.get('markers', 0)}")
          print(f"- Synthetic users deleted: {payload.get('users_deleted', 0)}")
          print(f"- Tournaments deleted: {payload.get('tournaments_deleted', 0)}")
          print(f"- Control account preserved: `{payload.get('control_account_preserved')}`")
          PY

      - name: Fail if cleanup was not verified
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.run-cleanup.outputs.remote_exit_code }}" = "0" \
            || { echo "Production retained-load cleanup failed; retained data was not removed by the supervisor." >&2; exit 1; }
          test "${{ steps.run-cleanup.outputs.cleanup_artifact_status }}" = "0" \
            || { echo "Retained-load cleanup public projection or evidence copy failed." >&2; exit 1; }
          test "${{ steps.run-cleanup.outputs.cleanup_export_status }}" = "0" \
            || { echo "Retained-load private export cleanup is incomplete." >&2; exit 1; }
          test "${{ steps.normalize_cleanup_evidence.outputs.sanitation_status }}" = "0" \
            || { echo "Retained-load cleanup evidence sanitation failed." >&2; exit 1; }
          /usr/bin/python3 - "$RUNNER_TEMP/production-retained-cleanup-artifacts/cleanup-summary.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("ok") is not True:
              raise SystemExit("cleanup-summary.json does not report ok=true")
          PY
