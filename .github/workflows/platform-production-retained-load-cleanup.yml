name: Platform production retained load cleanup

# Data-only dispatch wrapper.  The secret-bearing implementation is owned by
# the protected trusted branch and is pinned by an immutable SHA.  During the
# staged bootstrap the SHA is replaced by the first commit containing the
# trusted workflow before this wrapper is enabled.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE-PRODUCTION-RETAINED-LOAD to remove one exact retained load run"
        required: true
        type: string
      load_run_id:
        description: "GitHub run ID of the production retained-load workflow to clean"
        required: true
        type: string
      target_sha:
        description: "Exact source SHA recorded by the retained-load run"
        required: true
        type: string
      control_email:
        description: "The same control account email used by the retained-load run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    uses: StrayForest/old_sparky/.github/workflows/platform-production-retained-load-cleanup-trusted.yml@fe99fe0c6f16b0a879a26a4701086fdd6fcb5940
    with:
      confirmation: ${{ inputs.confirmation }}
      load_run_id: ${{ inputs.load_run_id }}
      target_sha: ${{ inputs.target_sha }}
      control_email: ${{ inputs.control_email }}
