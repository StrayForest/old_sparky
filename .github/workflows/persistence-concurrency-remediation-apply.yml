name: Apply persistence concurrency remediation

on:
  push:
    branches: [dev]
    paths:
      - ".github/scripts/persistence_concurrency_remediation_20260823.py"
      - ".github/workflows/persistence-concurrency-remediation-apply.yml"

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Mark remediation apply pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"persistence-remediation-apply\",\"description\":\"Persistence remediation is applying\",\"target_url\":\"${run_url}\"}"
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Disambiguate audited selector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/persistence_concurrency_remediation_20260823.py')
          text = path.read_text(encoding='utf-8')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected one exact match, found {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''    count = text.count(old)\n    if label == "deadlock profile lock" and count == 2:\n        head, separator, tail = text.rpartition(old)\n        if not separator:\n            raise RuntimeError(f"{label}: target disappeared")\n        return head + new + tail\n    if count != 1:\n        raise RuntimeError(f"{label}: expected one exact match, found {count}")\n    return text.replace(old, new, 1)\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected applicator helper shape')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply audited remediation
        run: python .github/scripts/persistence_concurrency_remediation_20260823.py
      - name: Syntax and diff validation
        run: |
          set -euo pipefail
          python -m compileall -q \
            platform/apps/platform_api/app \
            platform/apps/platform_worker \
            platform/python_packages \
            platform/alembic/versions \
            platform/tests/test_platform_persistence_concurrency_remediation.py
          git diff --check
      - name: Remove one-shot applicator
        run: |
          rm -f .github/scripts/persistence_concurrency_remediation_20260823.py
          rm -f .github/workflows/persistence-concurrency-remediation-apply.yml
      - name: Commit remediation to temporary branch
        run: |
          set -euo pipefail
          git config user.name "oldsparky-remediation-bot"
          git config user.email "oldsparky-remediation-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No remediation changes to commit"
            exit 0
          fi
          git commit -m "fix(platform): harden persistence concurrency invariants"
          git push --force origin HEAD:refs/heads/automation/persistence-remediation-20260823
      - name: Publish remediation apply result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ job.status }}" == "success" ]]; then
            state=success
            description="Persistence remediation staged"
          else
            state=failure
            description="Persistence remediation apply failed"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"persistence-remediation-apply\",\"description\":\"${description}\",\"target_url\":\"${run_url}\"}"
