name: Platform production diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-production-diagnostics
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/old_sparky_prod
          chmod 600 ~/.ssh/old_sparky_prod
          ssh_scan="$(mktemp)"
          trap 'rm -f -- "$ssh_scan"' EXIT
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" || { echo "Production SSH host exposed no ED25519 key" >&2; exit 1; }
          ssh_key_count="$(wc -l < "$ssh_scan" | tr -d ' ')"
          test "$ssh_key_count" = "1" || { echo "Expected exactly one production ED25519 host key" >&2; exit 1; }
          ssh_fingerprint="$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$ssh_fingerprint" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" || {
            echo "Production SSH host fingerprint mismatch" >&2
            exit 1
          }
          install -m 0600 "$ssh_scan" ~/.ssh/known_hosts
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s/.ssh/known_hosts\n' "$HOME"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts

      - name: Verify latest patch distribution
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          runtime=/opt/oldsparky/platform
          guard="$runtime/current/tools/platform_release_lock_exec.sh"
          test -f "$guard" || { echo "Production mutation guard is missing" >&2; exit 1; }
          /bin/bash "$guard" --app-dir "$runtime" --expected-sha "$target_sha" -- /bin/bash -s <<'MUTATION'
          set -euo pipefail
          runtime=/opt/oldsparky/platform
          cd "$runtime/current"
          export PLATFORM_APP_DIR="$runtime"
          export PLATFORM_SHARED_DIR="$runtime/shared"
          export PLATFORM_ENV_FILE="$runtime/shared/.env.platform"
          export PLATFORM_PYTHON_BIN="$runtime/shared/venv/bin/python"
          source "$runtime/current/tools/platform_runtime_common.sh"
          platform_load_env_file
          export PYTHONPATH="$runtime/current"

          "$runtime/shared/venv/bin/python" - <<'PY'
          import asyncio
          from apps.platform_api.app.services import home_content
          from apps.platform_api.app.services.patch_detail import get_patch_detail

          async def main():
              home = await home_content.refresh_home_content()
              latest = (home.get("patches") or [{}])[0]
              patch_id = str(latest.get("id") or "")
              detail = await get_patch_detail(patch_id)
              sections = list((detail or {}).get("sections") or [])
              heroes = [str(s.get("title") or "") for s in sections if s.get("kind") == "hero"]
              items = [str(s.get("title") or "") for s in sections if s.get("kind") == "item"]
              print("latest_patch_id=" + patch_id)
              print("latest_patch_title=" + str(latest.get("title") or ""))
              print("section_count=" + str(len(sections)))
              print("hero_section_count=" + str(len(heroes)))
              print("hero_titles=" + " | ".join(heroes))
              print("item_section_count=" + str(len(items)))
              if patch_id == "1840944183775204" and len(heroes) < 13:
                  raise SystemExit("latest known patch is still not distributed across its heroes")

          asyncio.run(main())
          PY

          latest_id="$($runtime/shared/venv/bin/python - <<'PY'
          import asyncio
          from apps.platform_api.app.services import home_content
          async def main():
              data = await home_content.refresh_home_content()
              print((data.get('patches') or [{}])[0].get('id') or '')
          asyncio.run(main())
          PY
          )"

          curl -fsS --max-time 15 "http://127.0.0.1:8010/api/v1/content/patches/${latest_id}" \
            | "$runtime/shared/venv/bin/python" -c 'import json,sys; d=json.load(sys.stdin); s=d.get("sections",[]); h=[x.get("title","") for x in s if x.get("kind")=="hero"]; print("internal_api_hero_count="+str(len(h))); print("internal_api_heroes="+" | ".join(h)); assert len(h) >= 13 if d.get("id")=="1840944183775204" else True'

          curl -fsS --max-time 15 "https://old-sparky.com/api/v1/content/patches/${latest_id}?diag=$(date +%s)" \
            | "$runtime/shared/venv/bin/python" -c 'import json,sys; d=json.load(sys.stdin); s=d.get("sections",[]); h=[x.get("title","") for x in s if x.get("kind")=="hero"]; print("public_api_hero_count="+str(len(h))); print("public_api_heroes="+" | ".join(h)); assert len(h) >= 13 if d.get("id")=="1840944183775204" else True'
          MUTATION
          REMOTE

      - name: Verify ru-v10 four-patch translation regression set
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -i ~/.ssh/old_sparky_prod "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          runtime=/opt/oldsparky/platform
          guard="$runtime/current/tools/platform_release_lock_exec.sh"
          test -f "$guard" || { echo "Production mutation guard is missing" >&2; exit 1; }
          /bin/bash "$guard" --app-dir "$runtime" --expected-sha "$target_sha" -- /bin/bash -s <<'MUTATION'
          set -Eeuo pipefail
          runtime=/opt/oldsparky/platform
          cd "$runtime/current"
          export PLATFORM_APP_DIR="$runtime"
          export PLATFORM_SHARED_DIR="$runtime/shared"
          export PLATFORM_ENV_FILE="$runtime/shared/.env.platform"
          export PLATFORM_PYTHON_BIN="$runtime/shared/venv/bin/python"
          source "$runtime/current/tools/platform_runtime_common.sh"
          platform_load_env_file
          export PYTHONPATH="$runtime/current"

          "$runtime/shared/venv/bin/python" - <<'PY'
          import asyncio
          import json
          import re

          from apps.platform_api.app.services import home_content
          from apps.platform_api.app.services.patch_detail import (
              get_patch_detail,
              get_patch_detail_source,
          )
          from apps.platform_api.app.services.patch_translation import (
              PATCH_TRANSLATION_VERSION,
              extract_translation_segments,
              translate_patch_to_russian,
          )
          from apps.platform_api.app.services.patch_translation_terms import fact_fingerprint

          PATCH_IDS = (
              "1840944183775204",
              "1839676055886206",
              "1839041357039193",
              "1836506165584438",
          )
          WATCH_TERMS = (
              "lifesteal",
              "cooldown",
              "spirit scaling",
              "spirit power",
              "move speed",
              "movement speed",
              "sprint speed",
              "falloff range",
              "bullet resist",
              "spirit resist",
              "melee resist",
          )
          CYRILLIC_RE = re.compile(r"[А-Яа-яЁё]")

          def emit(kind, **payload):
              print(kind, json.dumps(payload, ensure_ascii=False, separators=(",", ":")))

          async def main():
              catalog = await home_content.get_deadlock_asset_catalog()
              for patch_id in PATCH_IDS:
                  source = await get_patch_detail_source(patch_id)
                  if source is None:
                      raise SystemExit(f"missing source patch {patch_id}")

                  result = await translate_patch_to_russian(source, catalog)
                  emit("TRANSLATION_RUN", patch_id=patch_id, result=result)
                  if not result.get("ok"):
                      raise SystemExit(f"translation failed for {patch_id}: {result}")
                  if result.get("status") == "locked":
                      raise SystemExit(f"translation is locked for {patch_id}; fail-fast QA stops")

                  translated = await get_patch_detail(patch_id)
                  if translated is None:
                      raise SystemExit(f"missing translated patch {patch_id}")

                  source_segments = extract_translation_segments(source)
                  translated_segments = extract_translation_segments(translated)
                  if [s["id"] for s in source_segments] != [s["id"] for s in translated_segments]:
                      raise SystemExit(f"segment ids/order changed for {patch_id}")
                  if len(source_segments) != len(translated_segments):
                      raise SystemExit(f"segment count changed for {patch_id}")

                  paired = list(zip(source_segments, translated_segments, strict=True))
                  for source_segment, ru_segment in paired:
                      if fact_fingerprint(source_segment["text"]) != fact_fingerprint(ru_segment["text"]):
                          raise SystemExit(
                              f"numeric/tier fact changed for {patch_id} {source_segment['id']}"
                          )

                  if source_segments and not any(
                      CYRILLIC_RE.search(segment["text"] or "")
                      for segment in translated_segments
                  ):
                      raise SystemExit(f"patch {patch_id} has no Russian translation")

                  samples = []
                  for source_segment, ru_segment in paired:
                      source_text = source_segment["text"]
                      ru_text = ru_segment["text"]
                      source_lower = source_text.casefold()
                      ru_lower = ru_text.casefold()

                      if "bullet lifesteal" in source_lower and re.search(r"[+\-]?\d", source_text):
                          if "bullet lifesteal" in ru_lower:
                              raise SystemExit(
                                  f"Bullet Lifesteal stat stayed English: {patch_id} {source_segment['id']}"
                              )
                      if "spirit lifesteal" in source_lower and re.search(r"[+\-]?\d", source_text):
                          if "spirit lifesteal" in ru_lower:
                              raise SystemExit(
                                  f"Spirit Lifesteal stat stayed English: {patch_id} {source_segment['id']}"
                              )
                      if "bullet, spirit and melee lifesteal" in source_lower:
                          if "lifesteal" in ru_lower or "сопротив" in ru_lower:
                              raise SystemExit(
                                  f"compound Lifesteal mistranslated: {patch_id} {source_segment['id']} -> {ru_text}"
                              )
                      if "same change for melee lifesteal" in source_lower:
                          if "Melee Lifesteal" not in ru_text:
                              raise SystemExit(
                                  f"Melee Lifesteal item reference was translated: {patch_id} {source_segment['id']}"
                              )

                      if any(term in source_lower for term in WATCH_TERMS):
                          samples.append(
                              {
                                  "id": source_segment["id"],
                                  "en": source_text,
                                  "ru": ru_text,
                              }
                          )

                  for sample in samples[:30]:
                      emit("PATCH_TRANSLATION_SAMPLE", patch_id=patch_id, **sample)

                  if paired:
                      longest_source, longest_ru = max(
                          paired,
                          key=lambda pair: len(pair[0]["text"]),
                      )
                      emit(
                          "PATCH_TRANSLATION_LONGEST",
                          patch_id=patch_id,
                          id=longest_source["id"],
                          en=longest_source["text"],
                          ru=longest_ru["text"],
                      )

                  emit(
                      "PATCH_TRANSLATION_PATCH_OK",
                      patch_id=patch_id,
                      version=PATCH_TRANSLATION_VERSION,
                      segments=len(source_segments),
                      watched_samples=len(samples),
                  )

              print("PATCH_TRANSLATION_QA status=passed version=" + PATCH_TRANSLATION_VERSION)

          asyncio.run(main())
          PY

          echo '=== Recent translation usage logs ==='
          journalctl -u deadlock-worker -u deadlock-api --since '-20 minutes' --no-pager \
            | grep -E 'patch_translation_(openai_usage|completed|failed)' \
            | tail -n 120 \
            || true
          MUTATION
          REMOTE
