name: Platform production diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic mode
        type: choice
        options:
          - existing
          - capture-probe
        default: existing
        required: true

permissions:
  contents: read

concurrency:
  group: platform-production-diagnostics
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact diagnostic source
        if: ${{ inputs.mode == 'capture-probe' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind read-only probe source
        if: ${{ inputs.mode == 'capture-probe' }}
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/dev" ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          probe_sha256="$(sha256sum platform/tools/platform_release_capture_probe.py | awk '{print $1}')"
          [[ "$(wc -c < platform/tools/platform_release_capture_probe.py)" -le 524288 ]]
          systemd_sha256="$(sha256sum platform/tools/platform_release_systemd_state.py | awk '{print $1}')"
          [[ "$probe_sha256" =~ ^[0-9a-f]{64}$ && "$systemd_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'PROBE_SHA256=%s\nSYSTEMD_SHA256=%s\n' "$probe_sha256" "$systemd_sha256" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-diagnostics-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 0600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          chmod 600 "$ssh_dir/known_hosts"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Verify latest patch distribution
        if: ${{ inputs.mode != 'capture-probe' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          remote_log="$RUNNER_TEMP/platform-production-diagnostics-patch.log"
          remote_error="$RUNNER_TEMP/platform-production-diagnostics-patch-error.log"
          umask 077
          : >"$remote_log"
          : >"$remote_error"
          chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA'" >"$remote_log" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          runtime=/opt/oldsparky/platform
          guard="$runtime/current/tools/platform_release_lock_exec.sh"
          test -f "$guard" && test ! -L "$guard" && test -x "$guard" \
            || { echo "Production mutation guard is missing" >&2; exit 1; }
          /bin/bash "$guard" --app-dir "$runtime" --expected-sha "$target_sha" -- /bin/bash -s <<'MUTATION'
          set -euo pipefail
          runtime=/opt/oldsparky/platform
          cd "$runtime/current"
          export PLATFORM_APP_DIR="$runtime"
          export PLATFORM_SHARED_DIR="$runtime/shared"
          export PLATFORM_ENV_FILE="$runtime/shared/.env.platform"
          export PLATFORM_PYTHON_BIN="$runtime/shared/venv/bin/python"
          source "$runtime/current/tools/platform_runtime_common.sh"
          platform_load_env_file
          export PYTHONPATH="$runtime/current"

          "$runtime/shared/venv/bin/python" - <<'PY'
          import asyncio
          from apps.platform_api.app.services import home_content
          from apps.platform_api.app.services.patch_detail import get_patch_detail

          async def main():
              home = await home_content.refresh_home_content()
              latest = (home.get("patches") or [{}])[0]
              patch_id = str(latest.get("id") or "")
              detail = await get_patch_detail(patch_id)
              sections = list((detail or {}).get("sections") or [])
              if not patch_id.isdecimal() or len(patch_id) > 32:
                  raise SystemExit(1)
              hero_count = sum(1 for section in sections if section.get("kind") == "hero")
              item_count = sum(1 for section in sections if section.get("kind") == "item")
              print(
                  "PRODUCTION_PATCH schema=1 status=passed error_class=none "
                  "section_count=" + str(len(sections)) + " hero_section_count="
                  + str(hero_count) + " item_section_count=" + str(item_count)
              )
              print("PRODUCTION_PATCH_ID=" + patch_id)
              if patch_id == "1840944183775204" and hero_count < 13:
                  raise SystemExit(1)

          asyncio.run(main())
          PY

          latest_id="$(sed -n 's/^PRODUCTION_PATCH_ID=//p' "$remote_log" | tail -n 1)"
          [[ "$latest_id" =~ ^[0-9]{1,32}$ ]] || { echo "PRODUCTION_PATCH schema=1 status=failed error_class=producer section_count=0 hero_section_count=0 item_section_count=0" >&2; exit 1; }

          curl -fsS --max-time 15 "http://127.0.0.1:8010/api/v1/content/patches/${latest_id}" \
            | "$runtime/shared/venv/bin/python" -c 'import json,sys; d=json.load(sys.stdin); s=d.get("sections",[]); h=[x for x in s if x.get("kind")=="hero"]; print("PRODUCTION_PATCH_API schema=1 status=passed error_class=none api_class=internal hero_section_count="+str(len(h))); assert len(h) >= 13 if d.get("id")=="1840944183775204" else True'

          curl -fsS --max-time 15 "https://old-sparky.com/api/v1/content/patches/${latest_id}" \
            | "$runtime/shared/venv/bin/python" -c 'import json,sys; d=json.load(sys.stdin); s=d.get("sections",[]); h=[x for x in s if x.get("kind")=="hero"]; print("PRODUCTION_PATCH_API schema=1 status=passed error_class=none api_class=public hero_section_count="+str(len(h))); assert len(h) >= 13 if d.get("id")=="1840944183775204" else True'
          MUTATION
          REMOTE
          remote_status=$?
          set -e
          if (( remote_status != 0 )); then
            rm -f -- "$remote_log" "$remote_error"
            printf '%s\n' 'PRODUCTION_DIAGNOSTICS status=failed error_class=remote'
            exit 1
          fi
          public_line="$(grep -E '^(PRODUCTION_PATCH|PRODUCTION_PATCH_API) schema=1 status=(passed|failed) error_class=(none|producer|remote_or_transport|internal) (api_class=(internal|public) )?(section_count|hero_section_count)=[0-9]+( hero_section_count=[0-9]+)?( item_section_count=[0-9]+)?$' "$remote_log" | tail -n 20 || true)"
          if [[ -z "$public_line" ]]; then
            public_line='PRODUCTION_PATCH schema=1 status=failed error_class=remote_or_transport section_count=0 hero_section_count=0 item_section_count=0'
          fi
          printf '%s\n' "$public_line"
          rm -f -- "$remote_log" "$remote_error"

      - name: Verify ru-v10 four-patch translation regression set
        if: ${{ inputs.mode != 'capture-probe' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          remote_log="$RUNNER_TEMP/platform-production-diagnostics-translation.log"
          remote_error="$RUNNER_TEMP/platform-production-diagnostics-translation-error.log"
          umask 077
          : >"$remote_log"
          : >"$remote_error"
          chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA'" >"$remote_log" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          runtime=/opt/oldsparky/platform
          guard="$runtime/current/tools/platform_release_lock_exec.sh"
          test -f "$guard" && test ! -L "$guard" && test -x "$guard" \
            || { echo "Production mutation guard is missing" >&2; exit 1; }
          /bin/bash "$guard" --app-dir "$runtime" --expected-sha "$target_sha" -- /bin/bash -s <<'MUTATION'
          set -Eeuo pipefail
          runtime=/opt/oldsparky/platform
          cd "$runtime/current"
          export PLATFORM_APP_DIR="$runtime"
          export PLATFORM_SHARED_DIR="$runtime/shared"
          export PLATFORM_ENV_FILE="$runtime/shared/.env.platform"
          export PLATFORM_PYTHON_BIN="$runtime/shared/venv/bin/python"
          source "$runtime/current/tools/platform_runtime_common.sh"
          platform_load_env_file
          export PYTHONPATH="$runtime/current"

          "$runtime/shared/venv/bin/python" - <<'PY'
          import asyncio
          import json
          import re

          from apps.platform_api.app.services import home_content
          from apps.platform_api.app.services.patch_detail import (
              get_patch_detail,
              get_patch_detail_source,
          )
          from apps.platform_api.app.services.patch_translation import (
              extract_translation_segments,
              translate_patch_to_russian,
          )
          from apps.platform_api.app.services.patch_translation_terms import fact_fingerprint
          from tools.platform_translation_qa_summary import public_summary

          PATCH_IDS = (
              "1840944183775204",
              "1839676055886206",
              "1839041357039193",
              "1836506165584438",
          )
          WATCH_TERMS = (
              "lifesteal",
              "cooldown",
              "spirit scaling",
              "spirit power",
              "move speed",
              "movement speed",
              "sprint speed",
              "falloff range",
              "bullet resist",
              "spirit resist",
              "melee resist",
          )
          CYRILLIC_RE = re.compile(r"[А-Яа-яЁё]")

          metrics = {
              "patches_checked": 0,
              "segments_checked": 0,
              "watched_segments": 0,
              "translation_calls": 0,
              "max_source_length": 0,
              "max_translation_length": 0,
          }

          class TranslationQAFailure(RuntimeError):
              def __init__(self, error_class):
                  super().__init__(error_class)
                  self.error_class = error_class

          def fail(error_class):
              raise TranslationQAFailure(error_class)

          def report(status, error_class):
              # Closed public schema: "kind": "translation_qa".
              return public_summary(
                  status=status,
                  error_class=error_class,
                  metrics=metrics,
              )

          async def main():
              catalog = await home_content.get_deadlock_asset_catalog()
              for patch_id in PATCH_IDS:
                  source = await get_patch_detail_source(patch_id)
                  if source is None:
                      fail("source_missing")

                  metrics["translation_calls"] += 1
                  result = await translate_patch_to_russian(source, catalog)
                  if not isinstance(result, dict) or result.get("ok") is not True:
                      fail("translation_failed")
                  if result.get("status") == "locked":
                      fail("translation_locked")

                  translated = await get_patch_detail(patch_id)
                  if translated is None:
                      fail("translation_missing")

                  source_segments = extract_translation_segments(source)
                  translated_segments = extract_translation_segments(translated)
                  if [s["id"] for s in source_segments] != [s["id"] for s in translated_segments]:
                      fail("segment_contract")
                  if len(source_segments) != len(translated_segments):
                      fail("segment_contract")

                  paired = list(zip(source_segments, translated_segments, strict=True))
                  metrics["patches_checked"] += 1
                  metrics["segments_checked"] += len(paired)
                  for source_segment, translated_segment in paired:
                      metrics["max_source_length"] = max(
                          metrics["max_source_length"], len(source_segment["text"])
                      )
                      metrics["max_translation_length"] = max(
                          metrics["max_translation_length"], len(translated_segment["text"])
                      )
                  for source_segment, ru_segment in paired:
                      if fact_fingerprint(source_segment["text"]) != fact_fingerprint(ru_segment["text"]):
                          fail("fact_contract")

                  if source_segments and not any(
                      CYRILLIC_RE.search(segment["text"] or "")
                      for segment in translated_segments
                  ):
                      fail("locale_contract")

                  for source_segment, ru_segment in paired:
                      source_text = source_segment["text"]
                      ru_text = ru_segment["text"]
                      source_lower = source_text.casefold()
                      ru_lower = ru_text.casefold()

                      if "bullet lifesteal" in source_lower and re.search(r"[+\-]?\d", source_text):
                          if "bullet lifesteal" in ru_lower:
                              fail("terminology_contract")
                      if "spirit lifesteal" in source_lower and re.search(r"[+\-]?\d", source_text):
                          if "spirit lifesteal" in ru_lower:
                              fail("terminology_contract")
                      if "bullet, spirit and melee lifesteal" in source_lower:
                          if "lifesteal" in ru_lower or "сопротив" in ru_lower:
                              fail("terminology_contract")
                      if "same change for melee lifesteal" in source_lower:
                          if "Melee Lifesteal" not in ru_text:
                              fail("terminology_contract")

                      if any(term in source_lower for term in WATCH_TERMS):
                          metrics["watched_segments"] += 1

              return report("passed", "none")

          try:
              public = asyncio.run(main())
          except TranslationQAFailure as exc:
              print(json.dumps(report("failed", exc.error_class), sort_keys=True))
              raise SystemExit(1)
          except Exception:
              print(json.dumps(report("failed", "internal"), sort_keys=True))
              raise SystemExit(1)
          print(json.dumps(public, sort_keys=True))
          PY

          umask 077
          usage_log_file="$(mktemp "$runtime/shared/.translation-usage.XXXXXX")"
          chmod 600 "$usage_log_file"
          cleanup_usage_log() {
            rm -f -- "$usage_log_file"
          }
          trap cleanup_usage_log EXIT
          journal_status=0
          journalctl -u deadlock-worker -u deadlock-api --since '-20 minutes' --no-pager -n 200 \
            --output cat >"$usage_log_file" 2>/dev/null || journal_status=$?
          if (( journal_status != 0 )); then
            echo 'TRANSLATION_USAGE_LOG_SUMMARY status=unavailable error_class=producer'
            exit 1
          fi
          usage_count="$(awk '/patch_translation_openai_usage/ {if (count < 1000000) count++} END {print count+0}' "$usage_log_file")"
          completed_count="$(awk '/patch_translation_completed/ {if (count < 1000000) count++} END {print count+0}' "$usage_log_file")"
          failed_count="$(awk '/patch_translation_failed/ {if (count < 1000000) count++} END {print count+0}' "$usage_log_file")"
          printf 'TRANSLATION_USAGE_LOG_SUMMARY schema=1 openai_usage_count=%s completed_count=%s failed_count=%s\n' \
            "$usage_count" "$completed_count" "$failed_count"
          MUTATION
          REMOTE
          remote_status=$?
          set -e
          if (( remote_status != 0 )); then
            public_line="$(grep -E '^(\{"error_class":"(none|source_missing|call_budget|translation_failed|translation_locked|translation_missing|segment_contract|objective_contract|fact_contract|locale_contract|terminology_contract|unit_contract|internal|producer|remote_or_transport)","kind":"translation_qa","max_source_length":[0-9]+,"max_translation_length":[0-9]+,"patches_checked":[0-9]+,"schema":1,"segments_checked":[0-9]+,"status":"(failed|passed)","translation_calls":[0-9]+,"watched_segments":[0-9]+\}|TRANSLATION_USAGE_LOG_SUMMARY (schema=1 openai_usage_count=[0-9]+ completed_count=[0-9]+ failed_count=[0-9]+|status=unavailable error_class=producer))$' "$remote_log" | tail -n 20 || true)"
            if [[ -z "$public_line" ]]; then
              public_line='PRODUCTION_DIAGNOSTICS schema=1 status=failed error_class=remote_or_transport'
            fi
            printf '%s\n' "$public_line"
            rm -f -- "$remote_log" "$remote_error"
            exit 1
          fi
          public_line="$(grep -E '^(\{"error_class":"(none|source_missing|call_budget|translation_failed|translation_locked|translation_missing|segment_contract|objective_contract|fact_contract|locale_contract|terminology_contract|unit_contract|internal|producer|remote_or_transport)","kind":"translation_qa","max_source_length":[0-9]+,"max_translation_length":[0-9]+,"patches_checked":[0-9]+,"schema":1,"segments_checked":[0-9]+,"status":"(failed|passed)","translation_calls":[0-9]+,"watched_segments":[0-9]+\}|TRANSLATION_USAGE_LOG_SUMMARY schema=1 openai_usage_count=[0-9]+ completed_count=[0-9]+ failed_count=[0-9]+)$' "$remote_log" | tail -n 20 || true)"
          if [[ -z "$public_line" ]]; then
            public_line='PRODUCTION_DIAGNOSTICS schema=1 status=failed error_class=producer'
          fi
          printf '%s\n' "$public_line"
          rm -f -- "$remote_log" "$remote_error"

      - name: Stage read-only probe in a private task directory
        if: ${{ inputs.mode == 'capture-probe' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          probe_dir="/run/oldsparky-capture-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          dir_identity="$(
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'" <<'REMOTE_STAGE'
          set -euo pipefail
          run_id="$1"; run_attempt="$2"
          [[ "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[0-9]+$ ]]
          probe_dir="/run/oldsparky-capture-probe-$run_id-$run_attempt"
          mkdir -m 0700 -- "$probe_dir"
          cleanup_created_dir() {
            if [[ -d "$probe_dir" && ! -L "$probe_dir" \
              && "$(stat -c '%u:%g:%a:%h' "$probe_dir" 2>/dev/null || true)" == "0:0:700:2" ]]; then
              rmdir -- "$probe_dir" 2>/dev/null || true
            fi
          }
          trap cleanup_created_dir EXIT
          dir_metadata="$(stat -c '%u:%g:%a:%h:%d:%i' "$probe_dir")"
          [[ "$dir_metadata" =~ ^0:0:700:2:([0-9]+):([0-9]+)$ ]]
          printf '%s:%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}"
          trap - EXIT
          REMOTE_STAGE
          )"
          [[ "$dir_identity" =~ ^[0-9]+:[0-9]+$ ]]
          printf 'CAPTURE_PROBE_DIR_ID=%s\n' "$dir_identity" >> "$GITHUB_ENV"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$GITHUB_WORKSPACE/platform/tools/platform_release_capture_probe.py" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$probe_dir/probe.py"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "chmod 0600 -- '$probe_dir/probe.py'"

      - name: Read-only systemd capture precondition probe
        if: ${{ inputs.mode == 'capture-probe' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          remote_log="$RUNNER_TEMP/platform-production-capture-probe.log"
          remote_error="$RUNNER_TEMP/platform-production-capture-probe-error.log"
          umask 077
          : >"$remote_log"
          : >"$remote_error"
          chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' '$CAPTURE_PROBE_DIR_ID' '$PROBE_SHA256' '$SYSTEMD_SHA256'" >"$remote_log" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          run_id="$2"
          run_attempt="$3"
          probe_dir_identity="$4"
          probe_sha256="$5"
          systemd_sha256="$6"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ && "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[0-9]+$ ]]
          [[ "$probe_dir_identity" =~ ^[0-9]+:[0-9]+$ ]]
          [[ "$probe_sha256" =~ ^[0-9a-f]{64}$ && "$systemd_sha256" =~ ^[0-9a-f]{64}$ ]]
          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          tools="$current/tools"
          probe_dir="/run/oldsparky-capture-probe-$run_id-$run_attempt"
          probe_path="$probe_dir/probe.py"
          test "$(id -u)" = 0 || exit 1
          test -d "$runtime" && test ! -L "$runtime"
          test -d "$runtime/shared" && test ! -L "$runtime/shared"
          test -d "$runtime/releases" && test ! -L "$runtime/releases"
          test -L "$current" && test "$(stat -c %u "$current")" = 0
          release="$(readlink -f "$current")"
          test -d "$release" && test ! -L "$release"
          test "$(dirname "$release")" = "$runtime/releases"
          test -d "$tools" && test ! -L "$tools"
          test -d "$probe_dir" && test ! -L "$probe_dir"
          test "$(stat -c '%d:%i' "$probe_dir")" = "$probe_dir_identity"
          test "$(stat -c '%u:%g:%a:%h' "$probe_dir")" = "0:0:700:2"
          test -f "$probe_path" && test ! -L "$probe_path"
          chmod 0600 -- "$probe_path"
          test "$(stat -c '%u:%g:%a:%h' "$probe_path")" = "0:0:600:1"
          test "$(stat -c %s "$probe_path")" -le 524288
          test "$(sha256sum "$probe_path" | awk '{print $1}')" = "$probe_sha256"
          probe_metadata="$(stat -c '%d:%i:%u:%g:%a:%h' "$probe_path")"
          probe_directory_metadata="$(stat -c '%d:%i:%u:%g:%a' "$probe_dir")"
          cleanup_probe() {
            if [[ -f "$probe_path" && ! -L "$probe_path" \
              && "$(stat -c '%d:%i:%u:%g:%a:%h' "$probe_path" 2>/dev/null || true)" == "$probe_metadata" \
              && "$(sha256sum "$probe_path" 2>/dev/null | awk '{print $1}' || true)" == "$probe_sha256" ]]; then
              rm -- "$probe_path"
            fi
            if [[ -d "$probe_dir" && ! -L "$probe_dir" \
              && "$(stat -c '%d:%i:%u:%g:%a' "$probe_dir" 2>/dev/null || true)" == "$probe_directory_metadata" ]]; then
              rmdir -- "$probe_dir" 2>/dev/null || true
            fi
          }
          trap cleanup_probe EXIT
          lock_helper="$tools/platform_release_lock.sh"
          test -f "$lock_helper" && test ! -L "$lock_helper"
          source "$lock_helper"
          platform_release_lock_open || { echo 'PRODUCTION_CAPTURE_PROBE schema=1 status=failed failed_check=release_lock error_class=lock' >&2; exit 1; }
          trap 'platform_release_lock_close; cleanup_probe' EXIT
          [[ "$target_sha" =~ ^[0-9a-f]{40,64}$ ]]
          export PYTHONDONTWRITEBYTECODE=1
          timeout --foreground 480s /usr/bin/python3 -I -B "$probe_path" "$probe_sha256" "$systemd_sha256"
          REMOTE
          remote_status=$?
          set -e
          /usr/bin/python3 - "$remote_log" "$remote_status" <<'PY'
          import json, sys
          from pathlib import Path
          fallback = {"schema": 1, "kind": "release_capture_probe", "status": "failed", "failed_check": "remote_or_transport", "error_class": "remote"}
          try:
              path = Path(sys.argv[1])
              if path.stat().st_size > 8192:
                  raise ValueError
              lines = [line for line in path.read_text(encoding="ascii").splitlines() if line]
              if len(lines) != 1:
                  raise ValueError
              report = json.loads(lines[0])
              common = {"schema", "kind", "status", "health"}
              health_keys = {"api_live", "api_ready", "web_local", "public"}
              if type(report) is not dict or report.get("schema") != 1 or report.get("kind") != "release_capture_probe":
                  raise ValueError
              health = report.get("health")
              if type(health) is not dict or set(health) != health_keys or any(type(value) is not bool for value in health.values()):
                  raise ValueError
              if report.get("status") == "failed":
                  if set(report) not in (common | {"failed_check", "error_class"}, common | {"failed_check", "error_class", "systemd_observation"}):
                      raise ValueError
                  units = ("deadlock-api.service", "deadlock-worker.service", "deadlock-web.service", "deadlock-maintenance.service", "deadlock-maintenance.timer", "deadlock-logrotate.service", "deadlock-logrotate.timer", "deadlock-offsite-backup.service", "deadlock-offsite-backup.timer", "deadlock-cloudflare-ips.service", "deadlock-cloudflare-ips.timer", "deadlock-health-monitor.service", "deadlock-health-monitor.timer")
                  checks = {"root", "probe_identity", "systemd_module_identity", "module_metadata", "module_open", "module_identity", "module_size", "module_changed", "module_import", "release_metadata", "companion_metadata", "companion_lstat", "companion_recheck", "companion_changed", "systemctl_path", "transaction_read", "install_operation", "active_overrides", "current_binding", "previous_binding", "helper_digests", "helper_release_binding", "capture_context", "receipt_absence", "existing_receipt_validate", "unit_snapshot", "internal"}
                  checks |= {"unit_" + verb + "_" + unit.replace(".", "_") for unit in units for verb in ("active", "enabled")}
                  classes = {"permission", "predicate", "oserror", "input", "StateError", "ValueError", "TypeError", "JSONDecodeError", "TimeoutExpired", "exception"}
                  if report["failed_check"] not in checks or report["error_class"] not in classes:
                      raise ValueError
                  if "systemd_observation" in report:
                      observation = report["systemd_observation"]
                      if report["error_class"] != "StateError" or type(observation) is not dict or set(observation) != {"command", "unit", "result", "returncode", "state"}:
                          raise ValueError
                      command = observation["command"]
                      unit = observation["unit"]
                      result_class = observation["result"]
                      returncode = observation["returncode"]
                      state = observation["state"]
                      if unit not in units or command not in {"is-active", "is-enabled"}:
                          raise ValueError
                      expected_check = "unit_" + ("active" if command == "is-active" else "enabled") + "_" + unit.replace(".", "_")
                      if report["failed_check"] != expected_check:
                          raise ValueError
                      active_states = {"active", "inactive", "failed", "activating", "deactivating", "reloading", "maintenance", "unknown", "empty", "other", "multiple", "command_error"}
                      enabled_states = {"enabled", "disabled", "static", "indirect", "masked", "generated", "transient", "unknown", "empty", "other", "multiple", "command_error"}
                      if state not in (active_states if command == "is-active" else enabled_states):
                          raise ValueError
                      if returncode != "unavailable" and (type(returncode) is not int or not 0 <= returncode <= 255):
                          raise ValueError
                      if result_class == "unsupported_state":
                          supported = {"active", "inactive"} if command == "is-active" else {"enabled", "disabled", "static"}
                          if state in supported or state in {"multiple", "command_error"}:
                              raise ValueError
                      elif result_class == "status_mismatch":
                          supported = {"active", "inactive"} if command == "is-active" else {"enabled", "disabled", "static"}
                          if state not in supported:
                              raise ValueError
                          if returncode != "unavailable":
                              expected = {"active": 0, "inactive": 3, "enabled": 0, "disabled": 1, "static": 0}[state]
                              if returncode == expected:
                                  raise ValueError
                      elif result_class == "malformed_output":
                          if state != "multiple" or returncode != "unavailable":
                              raise ValueError
                      elif result_class == "command_error":
                          if state != "command_error" or returncode != "unavailable":
                              raise ValueError
                      else:
                          raise ValueError
                  safe = {key: report[key] for key in ("schema", "kind", "status", "failed_check", "error_class", "health")}
                  if "systemd_observation" in report:
                      safe["systemd_observation"] = report["systemd_observation"]
              elif report.get("status") == "passed":
                  keys = common | {"capture_predicate", "receipt_present", "current_bound", "previous_bound", "service_active_count", "service_enabled_count"}
                  if set(report) != keys or report["capture_predicate"] not in {"existing_receipt_valid", "prewrite_predicates_passed"}:
                      raise ValueError
                  if type(report["receipt_present"]) is not bool:
                      raise ValueError
                  for key in ("current_bound", "previous_bound"):
                      if report[key] is not None and type(report[key]) is not bool:
                          raise ValueError
                  for key in ("service_active_count", "service_enabled_count"):
                      if report[key] is not None and (type(report[key]) is not int or not 0 <= report[key] <= 13):
                          raise ValueError
                  safe = {key: report[key] for key in sorted(keys)}
                  if sys.argv[2] != "0":
                      safe = {"schema": 1, "kind": "release_capture_probe", "status": "failed", "failed_check": "remote_or_transport", "error_class": "remote", "health": health}
              else:
                  raise ValueError
              print("PRODUCTION_CAPTURE_PROBE " + json.dumps(safe, sort_keys=True, separators=(",", ":")))
          except Exception:
              print("PRODUCTION_CAPTURE_PROBE " + json.dumps(fallback, sort_keys=True, separators=(",", ":")))
          PY
          rm -f -- "$remote_log" "$remote_error"
          (( remote_status == 0 ))

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          remote_cleanup_status=0
          if [[ "${{ inputs.mode }}" == "capture-probe" && -n "${SSH_DIR:-}" \
            && -f "$SSH_DIR/config" && -n "${CAPTURE_PROBE_DIR_ID:-}" \
            && -n "${PROBE_SHA256:-}" ]]; then
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
            [[ "$CAPTURE_PROBE_DIR_ID" =~ ^[0-9]+:[0-9]+$ && "$PROBE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            set +e
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
              -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "bash -s -- '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' '$CAPTURE_PROBE_DIR_ID' '$PROBE_SHA256'" <<'REMOTE_CLEANUP'
          set -euo pipefail
          run_id="$1"; run_attempt="$2"; expected_dir_id="$3"; expected_sha="$4"
          [[ "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[0-9]+$ ]]
          [[ "$expected_dir_id" =~ ^[0-9]+:[0-9]+$ && "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          probe_dir="/run/oldsparky-capture-probe-$run_id-$run_attempt"
          probe_path="$probe_dir/probe.py"
          [[ -e "$probe_dir" || -L "$probe_dir" ]] || exit 0
          [[ -d "$probe_dir" && ! -L "$probe_dir" ]]
          [[ "$(stat -c '%d:%i' "$probe_dir")" == "$expected_dir_id" ]]
          [[ "$(stat -c '%u:%g:%a' "$probe_dir")" == "0:0:700" ]]
          if [[ -e "$probe_path" || -L "$probe_path" ]]; then
            [[ -f "$probe_path" && ! -L "$probe_path" ]]
            [[ "$(stat -c '%u:%g:%a:%h' "$probe_path")" == "0:0:600:1" ]]
            [[ "$(stat -c %s "$probe_path")" -le 524288 ]]
            [[ "$(sha256sum "$probe_path" | awk '{print $1}')" == "$expected_sha" ]]
            probe_file_id="$(stat -c '%d:%i:%u:%g:%a:%h' "$probe_path")"
            [[ "$(stat -c '%d:%i:%u:%g:%a:%h' "$probe_path")" == "$probe_file_id" ]]
            [[ "$(sha256sum "$probe_path" | awk '{print $1}')" == "$expected_sha" ]]
            rm -- "$probe_path"
          fi
          rmdir -- "$probe_dir"
          REMOTE_CLEANUP
            remote_cleanup_status=$?
            set -e
          fi
          ssh_dir="$RUNNER_TEMP/platform-production-diagnostics-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"
          if (( remote_cleanup_status != 0 )); then
            exit "$remote_cleanup_status"
          fi
