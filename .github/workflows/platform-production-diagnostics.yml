name: Platform production diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic mode
        type: choice
        options:
          - existing
          - capture-probe
        default: existing
        required: true
      diagnostic_systemd_state:
        description: Collect a private read-only systemd receipt/current-state comparison for the fixed pending target
        type: boolean
        default: false
        required: false
      recipient_certificate_b64:
        description: Pinned public certificate for encrypted read-only preflight diagnostics
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: platform-production-diagnostics
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TARGET_SHA: ${{ github.sha }}
      RECIPIENT_CERTIFICATE_SHA256: 28d857f5fc6ff987444ca920a2bb5072081dbf2e41ef158d362b60e45e3f67a3
    steps:
      - name: Checkout exact diagnostic source
        if: ${{ inputs.mode == 'capture-probe' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind read-only probe source
        if: ${{ inputs.mode == 'capture-probe' }}
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/dev" ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          probe_sha256="$(sha256sum platform/tools/platform_release_capture_probe.py | awk '{print $1}')"
          [[ "$(wc -c < platform/tools/platform_release_capture_probe.py)" -le 524288 ]]
          systemd_sha256="$(sha256sum platform/tools/platform_release_systemd_state.py | awk '{print $1}')"
          lock_helper_sha256="$(sha256sum platform/tools/platform_release_lock.sh | awk '{print $1}')"
          [[ "$probe_sha256" =~ ^[0-9a-f]{64}$ && "$systemd_sha256" =~ ^[0-9a-f]{64}$ && "$lock_helper_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(wc -c < platform/tools/platform_release_lock.sh)" -le 524288 ]]
          printf 'PROBE_SHA256=%s\nSYSTEMD_SHA256=%s\nLOCK_HELPER_SHA256=%s\n' "$probe_sha256" "$systemd_sha256" "$lock_helper_sha256" >> "$GITHUB_ENV"

      - name: Validate pinned runtime failure recipient before production access
        id: runtime_failure_recipient
        if: ${{ inputs.mode == 'capture-probe' }}
        shell: bash
        env:
          RECIPIENT_CERTIFICATE_B64: ${{ inputs.recipient_certificate_b64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$RECIPIENT_CERTIFICATE_B64" && test "${#RECIPIENT_CERTIFICATE_B64}" -le 16384
          certificate="$RUNNER_TEMP/platform-release-runtime-recipient.pem"
          public_key="$RUNNER_TEMP/platform-release-runtime-recipient-public.pem"
          /usr/bin/python3 -I - "$certificate" <<'PY'
          import base64, os, re, sys
          from pathlib import Path
          encoded = os.environ.get("RECIPIENT_CERTIFICATE_B64", "")
          try:
              raw = base64.b64decode(encoded, validate=True)
          except (ValueError, base64.binascii.Error) as exc:
              raise SystemExit("runtime recipient encoding is invalid") from exc
          if len(raw) > 8192 or re.fullmatch(rb"\s*-----BEGIN CERTIFICATE-----\s+[A-Za-z0-9+/=\r\n]+-----END CERTIFICATE-----\s*", raw) is None:
              raise SystemExit("runtime recipient must be one PEM certificate")
          destination = Path(sys.argv[1])
          descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(raw)
              stream.flush()
              os.fsync(stream.fileno())
          PY
          openssl x509 -in "$certificate" -noout -checkend 0 >/dev/null
          fingerprint="$(openssl x509 -in "$certificate" -noout -fingerprint -sha256 | sed 's/^[^=]*=//; s/://g' | tr '[:upper:]' '[:lower:]')"
          test "$fingerprint" = "$RECIPIENT_CERTIFICATE_SHA256"
          openssl x509 -in "$certificate" -pubkey -noout -out "$public_key"
          grep -Eq 'Public-Key: \(3072 bit\)' <<<"$(openssl pkey -pubin -in "$public_key" -text -noout)"
          printf 'runtime-cms-capability-check\n' | openssl cms -encrypt -binary -aes-256-gcm -outform DER \
            -recip "$certificate" -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 \
            -out "$RUNNER_TEMP/platform-runtime-cms-capability.der"
          printf 'capture_enabled=1\ncertificate_path=%s\n' "$certificate" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-diagnostics-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 0600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          chmod 600 "$ssh_dir/known_hosts"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Verify latest patch distribution
        if: ${{ inputs.mode != 'capture-probe' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          remote_log="$RUNNER_TEMP/platform-production-diagnostics-patch.log"
          remote_error="$RUNNER_TEMP/platform-production-diagnostics-patch-error.log"
          umask 077
          : >"$remote_log"
          : >"$remote_error"
          chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA'" >"$remote_log" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          runtime=/opt/oldsparky/platform
          guard="$runtime/current/tools/platform_release_lock_exec.sh"
          test -f "$guard" && test ! -L "$guard" && test -x "$guard" \
            || { echo "Production mutation guard is missing" >&2; exit 1; }
          /bin/bash "$guard" --app-dir "$runtime" --expected-sha "$target_sha" -- /bin/bash -s <<'MUTATION'
          set -euo pipefail
          runtime=/opt/oldsparky/platform
          cd "$runtime/current"
          export PLATFORM_APP_DIR="$runtime"
          export PLATFORM_SHARED_DIR="$runtime/shared"
          export PLATFORM_ENV_FILE="$runtime/shared/.env.platform"
          export PLATFORM_PYTHON_BIN="$runtime/shared/venv/bin/python"
          source "$runtime/current/tools/platform_runtime_common.sh"
          platform_load_env_file
          export PYTHONPATH="$runtime/current"

          "$runtime/shared/venv/bin/python" - <<'PY'
          import asyncio
          from apps.platform_api.app.services import home_content
          from apps.platform_api.app.services.patch_detail import get_patch_detail

          async def main():
              home = await home_content.refresh_home_content()
              latest = (home.get("patches") or [{}])[0]
              patch_id = str(latest.get("id") or "")
              detail = await get_patch_detail(patch_id)
              sections = list((detail or {}).get("sections") or [])
              if not patch_id.isdecimal() or len(patch_id) > 32:
                  raise SystemExit(1)
              hero_count = sum(1 for section in sections if section.get("kind") == "hero")
              item_count = sum(1 for section in sections if section.get("kind") == "item")
              print(
                  "PRODUCTION_PATCH schema=1 status=passed error_class=none "
                  "section_count=" + str(len(sections)) + " hero_section_count="
                  + str(hero_count) + " item_section_count=" + str(item_count)
              )
              print("PRODUCTION_PATCH_ID=" + patch_id)
              if patch_id == "1840944183775204" and hero_count < 13:
                  raise SystemExit(1)

          asyncio.run(main())
          PY

          latest_id="$(sed -n 's/^PRODUCTION_PATCH_ID=//p' "$remote_log" | tail -n 1)"
          [[ "$latest_id" =~ ^[0-9]{1,32}$ ]] || { echo "PRODUCTION_PATCH schema=1 status=failed error_class=producer section_count=0 hero_section_count=0 item_section_count=0" >&2; exit 1; }

          curl -fsS --max-time 15 "http://127.0.0.1:8010/api/v1/content/patches/${latest_id}" \
            | "$runtime/shared/venv/bin/python" -c 'import json,sys; d=json.load(sys.stdin); s=d.get("sections",[]); h=[x for x in s if x.get("kind")=="hero"]; print("PRODUCTION_PATCH_API schema=1 status=passed error_class=none api_class=internal hero_section_count="+str(len(h))); assert len(h) >= 13 if d.get("id")=="1840944183775204" else True'

          curl -fsS --max-time 15 "https://old-sparky.com/api/v1/content/patches/${latest_id}" \
            | "$runtime/shared/venv/bin/python" -c 'import json,sys; d=json.load(sys.stdin); s=d.get("sections",[]); h=[x for x in s if x.get("kind")=="hero"]; print("PRODUCTION_PATCH_API schema=1 status=passed error_class=none api_class=public hero_section_count="+str(len(h))); assert len(h) >= 13 if d.get("id")=="1840944183775204" else True'
          MUTATION
          REMOTE
          remote_status=$?
          set -e
          if (( remote_status != 0 )); then
            rm -f -- "$remote_log" "$remote_error"
            printf '%s\n' 'PRODUCTION_DIAGNOSTICS status=failed error_class=remote'
            exit 1
          fi
          public_line="$(grep -E '^(PRODUCTION_PATCH|PRODUCTION_PATCH_API) schema=1 status=(passed|failed) error_class=(none|producer|remote_or_transport|internal) (api_class=(internal|public) )?(section_count|hero_section_count)=[0-9]+( hero_section_count=[0-9]+)?( item_section_count=[0-9]+)?$' "$remote_log" | tail -n 20 || true)"
          if [[ -z "$public_line" ]]; then
            public_line='PRODUCTION_PATCH schema=1 status=failed error_class=remote_or_transport section_count=0 hero_section_count=0 item_section_count=0'
          fi
          printf '%s\n' "$public_line"
          rm -f -- "$remote_log" "$remote_error"

      - name: Verify ru-v10 four-patch translation regression set
        if: ${{ inputs.mode != 'capture-probe' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          remote_log="$RUNNER_TEMP/platform-production-diagnostics-translation.log"
          remote_error="$RUNNER_TEMP/platform-production-diagnostics-translation-error.log"
          umask 077
          : >"$remote_log"
          : >"$remote_error"
          chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$TARGET_SHA'" >"$remote_log" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          runtime=/opt/oldsparky/platform
          guard="$runtime/current/tools/platform_release_lock_exec.sh"
          test -f "$guard" && test ! -L "$guard" && test -x "$guard" \
            || { echo "Production mutation guard is missing" >&2; exit 1; }
          /bin/bash "$guard" --app-dir "$runtime" --expected-sha "$target_sha" -- /bin/bash -s <<'MUTATION'
          set -Eeuo pipefail
          runtime=/opt/oldsparky/platform
          cd "$runtime/current"
          export PLATFORM_APP_DIR="$runtime"
          export PLATFORM_SHARED_DIR="$runtime/shared"
          export PLATFORM_ENV_FILE="$runtime/shared/.env.platform"
          export PLATFORM_PYTHON_BIN="$runtime/shared/venv/bin/python"
          source "$runtime/current/tools/platform_runtime_common.sh"
          platform_load_env_file
          export PYTHONPATH="$runtime/current"

          "$runtime/shared/venv/bin/python" - <<'PY'
          import asyncio
          import json
          import re

          from apps.platform_api.app.services import home_content
          from apps.platform_api.app.services.patch_detail import (
              get_patch_detail,
              get_patch_detail_source,
          )
          from apps.platform_api.app.services.patch_translation import (
              extract_translation_segments,
              translate_patch_to_russian,
          )
          from apps.platform_api.app.services.patch_translation_terms import fact_fingerprint
          from tools.platform_translation_qa_summary import public_summary

          PATCH_IDS = (
              "1840944183775204",
              "1839676055886206",
              "1839041357039193",
              "1836506165584438",
          )
          WATCH_TERMS = (
              "lifesteal",
              "cooldown",
              "spirit scaling",
              "spirit power",
              "move speed",
              "movement speed",
              "sprint speed",
              "falloff range",
              "bullet resist",
              "spirit resist",
              "melee resist",
          )
          CYRILLIC_RE = re.compile(r"[А-Яа-яЁё]")

          metrics = {
              "patches_checked": 0,
              "segments_checked": 0,
              "watched_segments": 0,
              "translation_calls": 0,
              "max_source_length": 0,
              "max_translation_length": 0,
          }

          class TranslationQAFailure(RuntimeError):
              def __init__(self, error_class):
                  super().__init__(error_class)
                  self.error_class = error_class

          def fail(error_class):
              raise TranslationQAFailure(error_class)

          def report(status, error_class):
              # Closed public schema: "kind": "translation_qa".
              return public_summary(
                  status=status,
                  error_class=error_class,
                  metrics=metrics,
              )

          async def main():
              catalog = await home_content.get_deadlock_asset_catalog()
              for patch_id in PATCH_IDS:
                  source = await get_patch_detail_source(patch_id)
                  if source is None:
                      fail("source_missing")

                  metrics["translation_calls"] += 1
                  result = await translate_patch_to_russian(source, catalog)
                  if not isinstance(result, dict) or result.get("ok") is not True:
                      fail("translation_failed")
                  if result.get("status") == "locked":
                      fail("translation_locked")

                  translated = await get_patch_detail(patch_id)
                  if translated is None:
                      fail("translation_missing")

                  source_segments = extract_translation_segments(source)
                  translated_segments = extract_translation_segments(translated)
                  if [s["id"] for s in source_segments] != [s["id"] for s in translated_segments]:
                      fail("segment_contract")
                  if len(source_segments) != len(translated_segments):
                      fail("segment_contract")

                  paired = list(zip(source_segments, translated_segments, strict=True))
                  metrics["patches_checked"] += 1
                  metrics["segments_checked"] += len(paired)
                  for source_segment, translated_segment in paired:
                      metrics["max_source_length"] = max(
                          metrics["max_source_length"], len(source_segment["text"])
                      )
                      metrics["max_translation_length"] = max(
                          metrics["max_translation_length"], len(translated_segment["text"])
                      )
                  for source_segment, ru_segment in paired:
                      if fact_fingerprint(source_segment["text"]) != fact_fingerprint(ru_segment["text"]):
                          fail("fact_contract")

                  if source_segments and not any(
                      CYRILLIC_RE.search(segment["text"] or "")
                      for segment in translated_segments
                  ):
                      fail("locale_contract")

                  for source_segment, ru_segment in paired:
                      source_text = source_segment["text"]
                      ru_text = ru_segment["text"]
                      source_lower = source_text.casefold()
                      ru_lower = ru_text.casefold()

                      if "bullet lifesteal" in source_lower and re.search(r"[+\-]?\d", source_text):
                          if "bullet lifesteal" in ru_lower:
                              fail("terminology_contract")
                      if "spirit lifesteal" in source_lower and re.search(r"[+\-]?\d", source_text):
                          if "spirit lifesteal" in ru_lower:
                              fail("terminology_contract")
                      if "bullet, spirit and melee lifesteal" in source_lower:
                          if "lifesteal" in ru_lower or "сопротив" in ru_lower:
                              fail("terminology_contract")
                      if "same change for melee lifesteal" in source_lower:
                          if "Melee Lifesteal" not in ru_text:
                              fail("terminology_contract")

                      if any(term in source_lower for term in WATCH_TERMS):
                          metrics["watched_segments"] += 1

              return report("passed", "none")

          try:
              public = asyncio.run(main())
          except TranslationQAFailure as exc:
              print(json.dumps(report("failed", exc.error_class), sort_keys=True))
              raise SystemExit(1)
          except Exception:
              print(json.dumps(report("failed", "internal"), sort_keys=True))
              raise SystemExit(1)
          print(json.dumps(public, sort_keys=True))
          PY

          umask 077
          usage_log_file="$(mktemp "$runtime/shared/.translation-usage.XXXXXX")"
          chmod 600 "$usage_log_file"
          cleanup_usage_log() {
            rm -f -- "$usage_log_file"
          }
          trap cleanup_usage_log EXIT
          journal_status=0
          journalctl -u deadlock-worker -u deadlock-api --since '-20 minutes' --no-pager -n 200 \
            --output cat >"$usage_log_file" 2>/dev/null || journal_status=$?
          if (( journal_status != 0 )); then
            echo 'TRANSLATION_USAGE_LOG_SUMMARY status=unavailable error_class=producer'
            exit 1
          fi
          usage_count="$(awk '/patch_translation_openai_usage/ {if (count < 1000000) count++} END {print count+0}' "$usage_log_file")"
          completed_count="$(awk '/patch_translation_completed/ {if (count < 1000000) count++} END {print count+0}' "$usage_log_file")"
          failed_count="$(awk '/patch_translation_failed/ {if (count < 1000000) count++} END {print count+0}' "$usage_log_file")"
          printf 'TRANSLATION_USAGE_LOG_SUMMARY schema=1 openai_usage_count=%s completed_count=%s failed_count=%s\n' \
            "$usage_count" "$completed_count" "$failed_count"
          MUTATION
          REMOTE
          remote_status=$?
          set -e
          if (( remote_status != 0 )); then
            public_line="$(grep -E '^(\{"error_class":"(none|source_missing|call_budget|translation_failed|translation_locked|translation_missing|segment_contract|objective_contract|fact_contract|locale_contract|terminology_contract|unit_contract|internal|producer|remote_or_transport)","kind":"translation_qa","max_source_length":[0-9]+,"max_translation_length":[0-9]+,"patches_checked":[0-9]+,"schema":1,"segments_checked":[0-9]+,"status":"(failed|passed)","translation_calls":[0-9]+,"watched_segments":[0-9]+\}|TRANSLATION_USAGE_LOG_SUMMARY (schema=1 openai_usage_count=[0-9]+ completed_count=[0-9]+ failed_count=[0-9]+|status=unavailable error_class=producer))$' "$remote_log" | tail -n 20 || true)"
            if [[ -z "$public_line" ]]; then
              public_line='PRODUCTION_DIAGNOSTICS schema=1 status=failed error_class=remote_or_transport'
            fi
            printf '%s\n' "$public_line"
            rm -f -- "$remote_log" "$remote_error"
            exit 1
          fi
          public_line="$(grep -E '^(\{"error_class":"(none|source_missing|call_budget|translation_failed|translation_locked|translation_missing|segment_contract|objective_contract|fact_contract|locale_contract|terminology_contract|unit_contract|internal|producer|remote_or_transport)","kind":"translation_qa","max_source_length":[0-9]+,"max_translation_length":[0-9]+,"patches_checked":[0-9]+,"schema":1,"segments_checked":[0-9]+,"status":"(failed|passed)","translation_calls":[0-9]+,"watched_segments":[0-9]+\}|TRANSLATION_USAGE_LOG_SUMMARY schema=1 openai_usage_count=[0-9]+ completed_count=[0-9]+ failed_count=[0-9]+)$' "$remote_log" | tail -n 20 || true)"
          if [[ -z "$public_line" ]]; then
            public_line='PRODUCTION_DIAGNOSTICS schema=1 status=failed error_class=producer'
          fi
          printf '%s\n' "$public_line"
          rm -f -- "$remote_log" "$remote_error"

      - name: Stage read-only probe in a private task directory
        if: ${{ inputs.mode == 'capture-probe' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          probe_dir="/run/oldsparky-capture-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          dir_identity="$(
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'" <<'REMOTE_STAGE'
          set -euo pipefail
          run_id="$1"; run_attempt="$2"
          [[ "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[0-9]+$ ]]
          probe_dir="/run/oldsparky-capture-probe-$run_id-$run_attempt"
          mkdir -m 0700 -- "$probe_dir"
          cleanup_created_dir() {
            if [[ -d "$probe_dir" && ! -L "$probe_dir" \
              && "$(stat -c '%u:%g:%a:%h' "$probe_dir" 2>/dev/null || true)" == "0:0:700:2" ]]; then
              rmdir -- "$probe_dir" 2>/dev/null || true
            fi
          }
          trap cleanup_created_dir EXIT
          dir_metadata="$(stat -c '%u:%g:%a:%h:%d:%i' "$probe_dir")"
          [[ "$dir_metadata" =~ ^0:0:700:2:([0-9]+):([0-9]+)$ ]]
          printf '%s:%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}"
          trap - EXIT
          REMOTE_STAGE
          )"
          [[ "$dir_identity" =~ ^[0-9]+:[0-9]+$ ]]
          printf 'CAPTURE_PROBE_DIR_ID=%s\n' "$dir_identity" >> "$GITHUB_ENV"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$GITHUB_WORKSPACE/platform/tools/platform_release_capture_probe.py" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$probe_dir/probe.py"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$GITHUB_WORKSPACE/platform/tools/platform_release_lock.sh" \
            "$PROD_SSH_USER@$PROD_SSH_HOST:$probe_dir/platform_release_lock.sh"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "chmod 0600 -- '$probe_dir/probe.py' '$probe_dir/platform_release_lock.sh'"

      - name: Read-only systemd capture precondition probe
        id: capture_probe
        if: ${{ inputs.mode == 'capture-probe' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PRIVATE_CAPTURE: ${{ steps.runtime_failure_recipient.outputs.capture_enabled }}
          DIAGNOSTIC_SYSTEMD_STATE: ${{ inputs.diagnostic_systemd_state }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "${PRIVATE_CAPTURE:-}" == 1 ]]
          [[ "$DIAGNOSTIC_SYSTEMD_STATE" == true || "$DIAGNOSTIC_SYSTEMD_STATE" == false ]]
          remote_log="$RUNNER_TEMP/platform-production-capture-probe.log"
          remote_error="$RUNNER_TEMP/platform-production-capture-probe-error.log"
          umask 077
          : >"$remote_log"
          : >"$remote_error"
          chmod 600 "$remote_log" "$remote_error"
          set +e
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "PLATFORM_RUNTIME_PRIVATE_CAPTURE=1 PLATFORM_RUNTIME_PRIVATE_ROUTE='capture_probe' bash -c 'set -euo pipefail; lock=/run/oldsparky-capture-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/platform_release_lock.sh; expected=$LOCK_HELPER_SHA256; test -f \"\$lock\" && test ! -L \"\$lock\"; test \"\$(stat -c %u:%g:%a:%h \"\$lock\")\" = 0:0:600:1; read -r actual _ < <(/usr/bin/sha256sum -- \"\$lock\"); [[ \"\$actual\" == \"\$expected\" ]]; exec bash \"\$lock\" --run /usr/bin/bash -s -- \"\$@\"' _ '$TARGET_SHA' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' '$CAPTURE_PROBE_DIR_ID' '$PROBE_SHA256' '$SYSTEMD_SHA256' '$LOCK_HELPER_SHA256' '$DIAGNOSTIC_SYSTEMD_STATE'" >"$remote_log" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail
          target_sha="$1"
          run_id="$2"
          run_attempt="$3"
          probe_dir_identity="$4"
          probe_sha256="$5"
          systemd_sha256="$6"
          lock_helper_sha256="$7"
          diagnostic_systemd_state="$8"
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ && "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[0-9]+$ ]]
          [[ "$probe_dir_identity" =~ ^[0-9]+:[0-9]+$ ]]
          [[ "$probe_sha256" =~ ^[0-9a-f]{64}$ && "$systemd_sha256" =~ ^[0-9a-f]{64}$ && "$lock_helper_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$diagnostic_systemd_state" == true || "$diagnostic_systemd_state" == false ]]
          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          tools="$current/tools"
          probe_dir="/run/oldsparky-capture-probe-$run_id-$run_attempt"
          probe_path="$probe_dir/probe.py"
          lock_helper="$probe_dir/platform_release_lock.sh"
          test "$(id -u)" = 0 || exit 1
          test -d "$runtime" && test ! -L "$runtime"
          test -d "$runtime/shared" && test ! -L "$runtime/shared"
          test -d "$runtime/releases" && test ! -L "$runtime/releases"
          test -L "$current" && test "$(stat -c %u "$current")" = 0
          release="$(readlink -f "$current")"
          test -d "$release" && test ! -L "$release"
          test "$(dirname "$release")" = "$runtime/releases"
          test -d "$tools" && test ! -L "$tools"
          test -d "$probe_dir" && test ! -L "$probe_dir"
          test "$(stat -c '%d:%i' "$probe_dir")" = "$probe_dir_identity"
          test "$(stat -c '%u:%g:%a:%h' "$probe_dir")" = "0:0:700:2"
          test -f "$probe_path" && test ! -L "$probe_path"
          chmod 0600 -- "$probe_path"
          test "$(stat -c '%u:%g:%a:%h' "$probe_path")" = "0:0:600:1"
          test "$(stat -c %s "$probe_path")" -le 524288
          test "$(sha256sum "$probe_path" | awk '{print $1}')" = "$probe_sha256"
          test -f "$lock_helper" && test ! -L "$lock_helper"
          test "$(stat -c '%u:%g:%a:%h' "$lock_helper")" = "0:0:600:1"
          test "$(stat -c %s "$lock_helper")" -le 524288
          test "$(sha256sum "$lock_helper" | awk '{print $1}')" = "$lock_helper_sha256"
          probe_metadata="$(stat -c '%d:%i:%u:%g:%a:%h' "$probe_path")"
          probe_directory_metadata="$(stat -c '%d:%i:%u:%g:%a' "$probe_dir")"
          cleanup_probe() {
            if [[ -f "$probe_path" && ! -L "$probe_path" \
              && "$(stat -c '%d:%i:%u:%g:%a:%h' "$probe_path" 2>/dev/null || true)" == "$probe_metadata" \
              && "$(sha256sum "$probe_path" 2>/dev/null | awk '{print $1}' || true)" == "$probe_sha256" ]]; then
              rm -- "$probe_path"
            fi
            if [[ -f "$lock_helper" && ! -L "$lock_helper" \
              && "$(stat -c '%u:%g:%a:%h' "$lock_helper" 2>/dev/null || true)" == "0:0:600:1" \
              && "$(sha256sum "$lock_helper" 2>/dev/null | awk '{print $1}' || true)" == "$lock_helper_sha256" ]]; then
              rm -- "$lock_helper"
            fi
            if [[ -d "$probe_dir" && ! -L "$probe_dir" \
              && "$(stat -c '%d:%i:%u:%g:%a' "$probe_dir" 2>/dev/null || true)" == "$probe_directory_metadata" ]]; then
              rmdir -- "$probe_dir" 2>/dev/null || true
            fi
          }
          trap cleanup_probe EXIT
          test -f "$lock_helper" && test ! -L "$lock_helper"
          source "$lock_helper"
          platform_release_lock_open || { echo 'PRODUCTION_CAPTURE_PROBE schema=1 status=failed failed_check=release_lock error_class=lock' >&2; exit 1; }
          trap 'platform_release_lock_close; cleanup_probe' EXIT
          [[ "$target_sha" =~ ^[0-9a-f]{40,64}$ ]]
          export PYTHONDONTWRITEBYTECODE=1
          probe_args=("$probe_sha256" "$systemd_sha256")
          if [[ "$diagnostic_systemd_state" == true ]]; then
            probe_args=(--diagnostic-systemd-state "${probe_args[@]}")
          fi
          timeout --signal=TERM --kill-after=30s 560s /usr/bin/python3 -I -B "$probe_path" "${probe_args[@]}"
          REMOTE
          remote_status=$?
          set -e
          /usr/bin/python3 - "$remote_log" "$remote_status" <<'PY'
          import json, re, sys
          from pathlib import Path
          fallback = {"schema": 1, "kind": "release_capture_probe", "status": "failed", "failed_check": "remote_or_transport", "error_class": "remote"}
          preserve_preflight_failure = False
          try:
              path = Path(sys.argv[1])
              if path.stat().st_size > 8192:
                  raise ValueError
              lines = [line for line in path.read_text(encoding="ascii").splitlines() if line]
              if len(lines) != 1:
                  raise ValueError
              report = json.loads(lines[0])
              common = {"schema", "kind", "status", "health"}
              diagnostic_keys = {"schema", "kind", "status", "diagnostic_systemd_state", "diagnostic_systemd_state_returncode"}
              diagnostic_failed_keys = diagnostic_keys | {"failed_check", "error_class"}
              health_keys = {"api_live", "api_ready", "web_local", "public"}
              if type(report) is not dict or report.get("schema") != 1 or report.get("kind") != "release_capture_probe":
                  raise ValueError
              if "diagnostic_systemd_state" in report or "diagnostic_systemd_state_returncode" in report:
                  if report.get("status") == "passed":
                      if set(report) != diagnostic_keys or report["diagnostic_systemd_state"] != "passed" or report["diagnostic_systemd_state_returncode"] != 0 or sys.argv[2] != "0":
                          raise ValueError
                      safe = report
                  elif report.get("status") == "failed":
                      if set(report) != diagnostic_failed_keys or report["diagnostic_systemd_state"] not in {"mismatch", "unavailable"} or report["diagnostic_systemd_state_returncode"] != 1 or sys.argv[2] != "1":
                          raise ValueError
                      if report["failed_check"] != ("diagnostic_mismatch" if report["diagnostic_systemd_state"] == "mismatch" else "diagnostic_unavailable") or report["error_class"] != "predicate":
                          raise ValueError
                      safe = report
                  else:
                      raise ValueError
                  print("PRODUCTION_CAPTURE_PROBE " + json.dumps(safe, sort_keys=True, separators=(",", ":")))
                  raise SystemExit(0)
              health = report.get("health")
              if type(health) is not dict or set(health) != health_keys or any(type(value) is not bool for value in health.values()):
                  raise ValueError
              receipt_evidence = {"capture_predicate", "receipt_present", "current_bound", "previous_bound", "runtime_target", "runtime_target_source", "runtime_target_helper_sha256", "service_active_count", "service_enabled_count", "runtime_payload_verify", "runtime_payload_verify_returncode", "runtime_expected_tree", "runtime_expected_tree_returncode", "nginx_preflight", "nginx_preflight_returncode"}
              units = ("deadlock-api.service", "deadlock-worker.service", "deadlock-web.service", "deadlock-maintenance.service", "deadlock-maintenance.timer", "deadlock-logrotate.service", "deadlock-logrotate.timer", "deadlock-offsite-backup.service", "deadlock-offsite-backup.timer", "deadlock-cloudflare-ips.service", "deadlock-cloudflare-ips.timer", "deadlock-health-monitor.service", "deadlock-health-monitor.timer")
              checks = {"root", "probe_identity", "systemd_module_identity", "module_metadata", "module_open", "module_identity", "module_size", "module_changed", "module_import", "runtime_installer_identity", "runtime_installer_import", "runtime_installer_changed", "runtime_expected_tree", "runtime_payload_verify", "release_metadata", "companion_metadata", "companion_lstat", "companion_recheck", "companion_changed", "systemctl_path", "transaction_read", "install_operation", "active_overrides", "current_binding", "previous_binding", "helper_digests", "helper_release_binding", "capture_context", "receipt_absence", "existing_receipt_validate", "existing_receipt_transaction", "existing_receipt_phase", "runtime_target_binding", "nginx_preflight", "unit_snapshot", "internal"}
              checks |= {"unit_" + verb + "_" + unit.replace(".", "_") for unit in units for verb in ("active", "enabled")}
              classes = {"permission", "predicate", "oserror", "input", "StateError", "ValueError", "TypeError", "JSONDecodeError", "TimeoutExpired", "timeout", "child_failure", "exception"}
              if report.get("status") == "failed":
                  minimal_failed = common | {"failed_check", "error_class"}
                  observation_failed = minimal_failed | {"systemd_observation"}
                  receipt_failed = minimal_failed | receipt_evidence
                  receipt_observed_failed = receipt_failed | {"systemd_observation"}
                  if set(report) not in (minimal_failed, observation_failed, receipt_failed, receipt_observed_failed):
                      raise ValueError
                  if report["failed_check"] not in checks or report["error_class"] not in classes:
                      raise ValueError
                  if "systemd_observation" in report:
                      observation = report["systemd_observation"]
                      if report["error_class"] != "StateError" or type(observation) is not dict or set(observation) != {"command", "unit", "result", "returncode", "state"}:
                          raise ValueError
                      command, unit = observation["command"], observation["unit"]
                      result_class, returncode, state = observation["result"], observation["returncode"], observation["state"]
                      if unit not in units or command not in {"is-active", "is-enabled"}:
                          raise ValueError
                      expected_check = "unit_" + ("active" if command == "is-active" else "enabled") + "_" + unit.replace(".", "_")
                      if report["failed_check"] != expected_check:
                          raise ValueError
                      active_states = {"active", "inactive", "failed", "activating", "deactivating", "reloading", "maintenance", "unknown", "empty", "other", "multiple", "command_error"}
                      enabled_states = {"enabled", "disabled", "static", "indirect", "masked", "generated", "transient", "unknown", "empty", "other", "multiple", "command_error"}
                      if state not in (active_states if command == "is-active" else enabled_states):
                          raise ValueError
                      if returncode != "unavailable" and (type(returncode) is not int or not 0 <= returncode <= 255):
                          raise ValueError
                      supported = {"active", "inactive"} if command == "is-active" else {"enabled", "disabled", "static"}
                      if result_class == "unsupported_state":
                          if state in supported or state in {"multiple", "command_error"}:
                              raise ValueError
                      elif result_class == "status_mismatch":
                          if state not in supported:
                              raise ValueError
                          if returncode != "unavailable" and returncode == {"active": 0, "inactive": 3, "enabled": 0, "disabled": 1, "static": 0}[state]:
                              raise ValueError
                      elif result_class == "malformed_output":
                          if state != "multiple" or returncode != "unavailable":
                              raise ValueError
                      elif result_class == "command_error":
                          if state != "command_error" or returncode != "unavailable":
                              raise ValueError
                      else:
                          raise ValueError
                  if receipt_failed <= set(report):
                      if report["capture_predicate"] != "existing_receipt_valid" or report["receipt_present"] is not True or report["current_bound"] is not True or report["previous_bound"] is not True:
                          raise ValueError
                      for key in ("service_active_count", "service_enabled_count"):
                          if type(report[key]) is not int or not 0 <= report[key] <= 13:
                              raise ValueError
                      if not isinstance(report["runtime_target"], str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,179}", report["runtime_target"]):
                          raise ValueError
                      if not isinstance(report["runtime_target_source"], str) or not re.fullmatch(r"[0-9a-f]{40,64}", report["runtime_target_source"]):
                          raise ValueError
                      if not isinstance(report["runtime_target_helper_sha256"], str) or not re.fullmatch(r"[0-9a-f]{64}", report["runtime_target_helper_sha256"]):
                          raise ValueError
                      statuses = ("runtime_payload_verify", "runtime_expected_tree", "nginx_preflight")
                      for status_key in statuses:
                          status = report[status_key]
                          rc = report[status_key + "_returncode"]
                          if rc != "unavailable" and (type(rc) is not int or not 0 <= rc <= 255):
                              raise ValueError
                          if status in {"failed", "timeout", "unavailable"}:
                              if status == "failed" and rc not in {"unavailable", *range(1, 256)}:
                                  raise ValueError
                              if status in {"timeout", "unavailable"} and rc != "unavailable":
                                  raise ValueError
                          elif status == "passed":
                              if rc != 0:
                                  raise ValueError
                          elif status == "not_applicable":
                              if rc != "unavailable":
                                  raise ValueError
                          else:
                              raise ValueError
                      failed = report["failed_check"]
                      if failed in statuses:
                          if report[failed] not in {"failed", "timeout", "unavailable"}:
                              raise ValueError
                          if failed == "runtime_payload_verify":
                              if report["runtime_expected_tree"] != "not_applicable" or report["nginx_preflight"] != "not_applicable":
                                  raise ValueError
                          elif failed == "runtime_expected_tree":
                              if report["runtime_payload_verify"] != "passed" or report["nginx_preflight"] != "not_applicable":
                                  raise ValueError
                          elif report["runtime_payload_verify"] != "passed" or report["runtime_expected_tree"] != "passed":
                              raise ValueError
                      elif any(report[key] != "not_applicable" for key in statuses):
                          raise ValueError
                  safe = {key: report[key] for key in ("schema", "kind", "status", "failed_check", "error_class", "health")}
                  if "systemd_observation" in report:
                      safe["systemd_observation"] = report["systemd_observation"]
                  if receipt_failed <= set(report):
                      safe.update({key: report[key] for key in receipt_evidence})
                  preserve_preflight_failure = (
                  "systemd_observation" in report
                  or (report["failed_check"] == "unit_snapshot" and report["error_class"] == "timeout")
                  or (
                          receipt_failed <= set(report)
                          and report["failed_check"] in {"runtime_payload_verify", "runtime_expected_tree", "nginx_preflight"}
                          and report["error_class"] == "child_failure"
                      )
                  )
                  if sys.argv[2] != "0" and not preserve_preflight_failure:
                      safe = {"schema": 1, "kind": "release_capture_probe", "status": "failed", "failed_check": "remote_or_transport", "error_class": "remote", "health": health}
              elif report.get("status") == "passed":
                  keys = common | {"capture_predicate", "receipt_present", "current_bound", "previous_bound", "service_active_count", "service_enabled_count", "runtime_payload_verify", "runtime_payload_verify_returncode"}
                  receipt_keys = keys | {"runtime_target", "runtime_target_source", "runtime_target_helper_sha256", "runtime_payload_verify", "runtime_payload_verify_returncode", "runtime_expected_tree", "runtime_expected_tree_returncode", "nginx_preflight", "nginx_preflight_returncode"}
                  if set(report) not in (keys, receipt_keys) or report["capture_predicate"] not in {"existing_receipt_valid", "prewrite_predicates_passed"}:
                      raise ValueError
                  if type(report["receipt_present"]) is not bool:
                      raise ValueError
                  for key in ("current_bound", "previous_bound"):
                      if report[key] is not None and type(report[key]) is not bool:
                          raise ValueError
                  for key in ("service_active_count", "service_enabled_count"):
                      if report[key] is not None and (type(report[key]) is not int or not 0 <= report[key] <= 13):
                          raise ValueError
                  if set(report) == keys:
                      if report["runtime_payload_verify"] != "not_applicable" or report["runtime_payload_verify_returncode"] != "unavailable":
                          raise ValueError
                  if set(report) == receipt_keys:
                      if report["capture_predicate"] != "existing_receipt_valid" or report["receipt_present"] is not True or report["current_bound"] is not True or report["previous_bound"] is not True:
                          raise ValueError
                      if report["nginx_preflight"] not in {"passed", "not_applicable"}:
                          raise ValueError
                      for status_key in ("runtime_payload_verify", "runtime_expected_tree", "nginx_preflight"):
                          status = report[status_key]
                          rc = report[status_key + "_returncode"]
                          if rc != "unavailable" and (type(rc) is not int or not 0 <= rc <= 255):
                              raise ValueError
                          if status == "passed" and rc != 0:
                              raise ValueError
                          if status == "not_applicable" and rc != "unavailable":
                              raise ValueError
                      if report["nginx_preflight"] == "not_applicable":
                          if report["runtime_payload_verify"] != "not_applicable" or report["runtime_expected_tree"] != "not_applicable":
                              raise ValueError
                          if any(report[key] is not None for key in ("runtime_target", "runtime_target_source", "runtime_target_helper_sha256")):
                              raise ValueError
                      else:
                          if report["runtime_payload_verify"] != "passed" or report["runtime_expected_tree"] != "passed" or report["nginx_preflight_returncode"] != 0:
                              raise ValueError
                          if not isinstance(report["runtime_target"], str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,179}", report["runtime_target"]):
                              raise ValueError
                          if not isinstance(report["runtime_target_source"], str) or not re.fullmatch(r"[0-9a-f]{40,64}", report["runtime_target_source"]):
                              raise ValueError
                          if not isinstance(report["runtime_target_helper_sha256"], str) or not re.fullmatch(r"[0-9a-f]{64}", report["runtime_target_helper_sha256"]):
                              raise ValueError
                  safe = {key: report[key] for key in sorted(report)}
              else:
                  raise ValueError
              print("PRODUCTION_CAPTURE_PROBE " + json.dumps(safe, sort_keys=True, separators=(",", ":")))
          except Exception:
              print("PRODUCTION_CAPTURE_PROBE " + json.dumps(fallback, sort_keys=True, separators=(",", ":")))
          PY
          printf 'remote_status=%s\n' "$remote_status" >> "$GITHUB_OUTPUT"
          printf 'private_error_path=%s\n' "$remote_error" >> "$GITHUB_OUTPUT"
          (( remote_status == 0 ))

      - name: Encrypt private read-only preflight failure context
        id: encrypt_runtime_failure
        if: ${{ always() && inputs.mode == 'capture-probe' && steps.runtime_failure_recipient.outputs.capture_enabled == '1' }}
        shell: bash
        env:
          RECIPIENT_CERTIFICATE_PATH: ${{ steps.runtime_failure_recipient.outputs.certificate_path }}
        run: |
          set -euo pipefail
          printf 'private_failure_ready=false\n' >> "$GITHUB_OUTPUT"
          remote_error="$RUNNER_TEMP/platform-production-capture-probe-error.log"
          if [[ ! -f "$remote_error" || -L "$remote_error" ]]; then exit 0; fi
          if [[ ! -s "$remote_error" ]]; then exit 0; fi
          [[ "$(stat -c '%u:%h:%a' "$remote_error")" == "$(id -u):1:600" ]]
          test "$(stat -c '%s' "$remote_error")" -le 131072
          private_dir="$RUNNER_TEMP/platform-release-runtime-failure"
          [[ ! -e "$private_dir" && ! -L "$private_dir" ]]
          install -d -m 700 "$private_dir"
          set +e
          PRIVATE_REMOTE_ERROR="$remote_error" PRIVATE_PAYLOAD="$private_dir/evidence.json" \
          PRIVATE_ACTION_RUN_ID="$GITHUB_RUN_ID" PRIVATE_ACTION_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          PRIVATE_WORKFLOW_SHA="$GITHUB_SHA" PRIVATE_SOURCE_SHA="$TARGET_SHA" \
          /usr/bin/python3 -I - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = Path(os.environ["PRIVATE_REMOTE_ERROR"]).read_bytes()
          if not 1 <= len(raw) <= 131072:
              raise SystemExit(2)
          try:
              text = raw.decode("utf-8")
          except UnicodeDecodeError as exc:
              raise SystemExit(2) from exc
          markers = [line.removeprefix("RUNTIME_PRIVATE_CONTEXT ") for line in text.splitlines() if line.startswith("RUNTIME_PRIVATE_CONTEXT ")]
          if not markers:
              raise SystemExit(2)
          if len(markers) != 1:
              raise SystemExit(2)
          try:
              marker = json.loads(markers[0])
              output = base64.b64decode(marker["output_b64"], validate=True)
          except Exception as exc:
              raise SystemExit(2) from exc
          if (
              type(marker) is not dict
              or set(marker) != {"schema", "route", "component", "guard_id", "returncode", "stream", "output_b64", "total_bytes", "truncated", "retained"}
              or marker.get("schema") != 1 or marker.get("route") != "capture_probe"
              or marker.get("component") not in {"nginx_preflight", "runtime_payload_verify", "runtime_expected_tree", "systemd_unit_snapshot", "systemd_state_probe"} or marker.get("guard_id") is not None or marker.get("stream") != "stderr"
              or marker.get("retained") != "tail" or type(marker.get("truncated")) is not bool
              or (marker.get("returncode") != "unavailable" and (type(marker.get("returncode")) is not int or not 0 <= marker["returncode"] <= 255))
              or len(output) > 16384 or base64.b64encode(output).decode("ascii") != marker["output_b64"]
              or (marker.get("total_bytes") != "unavailable" and (type(marker.get("total_bytes")) is not int or not len(output) <= marker["total_bytes"] <= 9223372036854775807))
              or marker["truncated"] != (marker["total_bytes"] == "unavailable" or marker["total_bytes"] > len(output))
          ):
              raise SystemExit(2)
          if marker["component"] == "systemd_state_probe":
              def unique_object(pairs):
                  value = {}
                  for key, item in pairs:
                      if key in value:
                          raise ValueError("duplicate diagnostic field")
                      value[key] = item
                  return value
              try:
                  state = json.loads(output.decode("utf-8"), object_pairs_hook=unique_object)
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as exc:
                  raise SystemExit(2) from exc
              unit_names = ["deadlock-api.service", "deadlock-worker.service", "deadlock-web.service", "deadlock-maintenance.service", "deadlock-maintenance.timer", "deadlock-logrotate.service", "deadlock-logrotate.timer", "deadlock-offsite-backup.service", "deadlock-offsite-backup.timer", "deadlock-cloudflare-ips.service", "deadlock-cloudflare-ips.timer", "deadlock-health-monitor.service", "deadlock-health-monitor.timer"]
              state_keys = {"schema", "collection_completed", "validate_status", "verify_status", "current_facts_status", "mismatch_count", "historical_cause_proven", "expected_units", "observed_units", "failure_phase", "failure_check", "failure_class", "failure_reason", "failure_unit", "failure_query", "failure_rc"}
              phases = {"none", "module", "systemctl_path", "transaction", "receipt", "binding", "unit_active", "unit_enabled", "verify"}
              checks = {"none", "diagnostic_receipt_absent", "systemctl_path", "transaction_read", "systemd_module_identity", "module_metadata", "module_open", "module_identity", "module_size", "module_changed", "module_import", "existing_receipt_transaction", "runtime_target_binding", "current_binding", "previous_binding", "existing_receipt_validate", "release_metadata", "helper_digests", "diagnostic_target_binding", "unit_active", "unit_enabled", "diagnostic_receipt_units", "unit_snapshot", "systemd_verify"}
              classes = {"none", "predicate", "oserror", "StateError", "ValueError", "TypeError", "TimeoutExpired", "timeout", "exception"}
              reasons = {"none", "binding", "unsupported_state", "status_mismatch", "command_error", "malformed_output", "timeout", "receipt_state_invalid", "verify_mismatch", "verification_error"}
              if type(state) is not dict or set(state) != state_keys or type(state["schema"]) is not int or state["schema"] != 1 or type(state["collection_completed"]) is not bool or state["historical_cause_proven"] is not False:
                  raise SystemExit(2)
              if not isinstance(state["validate_status"], str) or state["validate_status"] not in {"passed", "failed", "unavailable"} or not isinstance(state["verify_status"], str) or state["verify_status"] not in {"passed", "failed", "unavailable"} or not isinstance(state["current_facts_status"], str) or state["current_facts_status"] not in {"matched", "mismatch", "unavailable"}:
                  raise SystemExit(2)
              if not isinstance(state["failure_phase"], str) or state["failure_phase"] not in phases or not isinstance(state["failure_check"], str) or state["failure_check"] not in checks or not isinstance(state["failure_class"], str) or state["failure_class"] not in classes or not isinstance(state["failure_reason"], str) or state["failure_reason"] not in reasons or not isinstance(state["failure_unit"], str) or state["failure_unit"] not in {"none", *unit_names} or not isinstance(state["failure_query"], str) or state["failure_query"] not in {"none", "active", "enabled"} or (state["failure_rc"] != "unavailable" and (type(state["failure_rc"]) is not int or not 0 <= state["failure_rc"] <= 255)):
                  raise SystemExit(2)
              failure = state["failure_reason"] != "none"
              if (not failure and any(state[key] != expected for key, expected in (("failure_phase", "none"), ("failure_check", "none"), ("failure_class", "none"), ("failure_unit", "none"), ("failure_query", "none"), ("failure_rc", "unavailable")))) or (failure and (state["failure_phase"] == "none" or state["failure_check"] == "none" or state["failure_class"] == "none")) or ((state["failure_unit"] == "none") != (state["failure_query"] == "none")) or (state["failure_rc"] != "unavailable" and state["failure_unit"] == "none") or (state["failure_reason"] in {"unsupported_state", "status_mismatch"} and (state["failure_unit"] == "none" or state["failure_rc"] == "unavailable")) or (marker["returncode"] == 0 and failure):
                  raise SystemExit(2)
              if type(state["mismatch_count"]) is not int or not 0 <= state["mismatch_count"] <= 13:
                  raise SystemExit(2)
              expected = state["expected_units"]
              observed = state["observed_units"]
              if type(expected) is not list or type(observed) is not list or len(expected) not in {0, 13} or len(observed) > 13:
                  raise SystemExit(2)
              for index, row in enumerate(expected):
                  if type(row) is not dict or set(row) != {"unit", "active", "enabled"} or row["unit"] != unit_names[index] or not isinstance(row["active"], str) or row["active"] not in {"active", "inactive"} or not isinstance(row["enabled"], str) or row["enabled"] not in {"enabled", "disabled", "static"}:
                      raise SystemExit(2)
              active_values = {"active", "inactive", "failed", "activating", "deactivating", "reloading", "maintenance", "unknown", "empty", "other", "unavailable"}
              enabled_values = {"enabled", "disabled", "static", "indirect", "masked", "generated", "transient", "unknown", "empty", "other", "unavailable"}
              for index, row in enumerate(observed):
                  if type(row) is not dict or set(row) != {"unit", "active", "enabled"} or row["unit"] != unit_names[index] or not isinstance(row["active"], str) or row["active"] not in active_values or not isinstance(row["enabled"], str) or row["enabled"] not in enabled_values:
                      raise SystemExit(2)
              if not state["collection_completed"]:
                  if (expected and len(expected) != 13) or state["current_facts_status"] != "unavailable" or state["mismatch_count"] != 0:
                      raise SystemExit(2)
              if state["collection_completed"]:
                  if len(expected) != 13 or len(observed) != 13:
                      raise SystemExit(2)
                  comparable = all(row["active"] not in {"unknown", "empty", "other", "unavailable"} and row["enabled"] not in {"unknown", "empty", "other", "unavailable"} for row in observed)
                  if not comparable:
                      if state["current_facts_status"] != "unavailable" or state["mismatch_count"] != 0:
                          raise SystemExit(2)
                  else:
                      differences = sum(left != right for left, right in zip(expected, observed, strict=True))
                      if differences != state["mismatch_count"] or state["current_facts_status"] != ("mismatch" if differences else "matched"):
                          raise SystemExit(2)
              state_passed = (state["collection_completed"] and state["validate_status"] == "passed" and state["verify_status"] == "passed" and state["current_facts_status"] == "matched" and state["mismatch_count"] == 0 and state["failure_phase"] == "none" and state["failure_check"] == "none" and state["failure_class"] == "none" and state["failure_reason"] == "none" and state["failure_unit"] == "none" and state["failure_query"] == "none" and state["failure_rc"] == "unavailable")
              if (marker["returncode"] == 0) != state_passed:
                  raise SystemExit(2)
              if marker["returncode"] != 0 and marker["returncode"] != 1:
                  raise SystemExit(2)
          elif marker["returncode"] == 0:
              raise SystemExit(2)
          payload = {
              "schema": 1,
              "kind": "release_runtime_failure_private_context",
              "route": "capture_probe",
              "repository": "StrayForest/old_sparky",
              "workflow_path": ".github/workflows/platform-production-diagnostics.yml",
              "workflow_run_id": os.environ["PRIVATE_ACTION_RUN_ID"],
              "workflow_run_attempt": os.environ["PRIVATE_ACTION_RUN_ATTEMPT"],
              "workflow_sha": os.environ["PRIVATE_WORKFLOW_SHA"],
              "source_sha": os.environ["PRIVATE_SOURCE_SHA"],
              "bundle_sha256": None,
              "security_run_id": None,
              "security_run_attempt": None,
              "recovery_run_id": None,
              "recovery_run_attempt": None,
              "publisher_run_id": None,
              "publisher_run_attempt": None,
              "remote_stderr_b64": base64.b64encode(raw).decode("ascii"),
              "remote_stderr_size": len(raw),
          }
          target = Path(os.environ["PRIVATE_PAYLOAD"])
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "w", encoding="ascii") as stream:
              json.dump(payload, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
              stream.flush()
              os.fsync(stream.fileno())
          PY
          payload_status=$?
          set -e
          if (( payload_status != 0 )); then
            rm -rf -- "$private_dir"
            exit "$payload_status"
          fi
          chmod 600 "$private_dir/evidence.json"
          openssl cms -encrypt -binary -aes-256-gcm -outform DER \
            -in "$private_dir/evidence.json" -out "$private_dir/evidence.cms" \
            -recip "$RECIPIENT_CERTIFICATE_PATH" \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256
          chmod 600 "$private_dir/evidence.cms"
          PRIVATE_DIR="$private_dir" PRIVATE_ACTION_RUN_ID="$GITHUB_RUN_ID" \
          PRIVATE_ACTION_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" PRIVATE_WORKFLOW_SHA="$GITHUB_SHA" \
          PRIVATE_SOURCE_SHA="$TARGET_SHA" /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path(os.environ["PRIVATE_DIR"])
          ciphertext = (directory / "evidence.cms").read_bytes()
          manifest = {
              "schema": 1,
              "kind": "encrypted_release_runtime_failure_context",
              "repository": "StrayForest/old_sparky",
              "workflow_path": ".github/workflows/platform-production-diagnostics.yml",
              "route": "capture_probe",
              "workflow_run_id": os.environ["PRIVATE_ACTION_RUN_ID"],
              "workflow_run_attempt": os.environ["PRIVATE_ACTION_RUN_ATTEMPT"],
              "workflow_sha": os.environ["PRIVATE_WORKFLOW_SHA"],
              "source_sha": os.environ["PRIVATE_SOURCE_SHA"],
              "bundle_sha256": None,
              "security_run_id": None, "security_run_attempt": None,
              "recovery_run_id": None, "recovery_run_attempt": None,
              "publisher_run_id": None, "publisher_run_attempt": None,
              "recipient_certificate_sha256": os.environ["RECIPIENT_CERTIFICATE_SHA256"],
              "encryption": "CMS-EnvelopedData/AES-256-GCM/RSA-OAEP-SHA-256",
              "ciphertext_sha256": hashlib.sha256(ciphertext).hexdigest(),
              "ciphertext_size": len(ciphertext),
          }
          target = directory / "manifest.json"
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "w", encoding="ascii") as stream:
              json.dump(manifest, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
              stream.flush()
              os.fsync(stream.fileno())
          PY
          rm -f -- "$private_dir/evidence.json"
          printf 'private_failure_ready=true\n' >> "$GITHUB_OUTPUT"
          printf 'RUNTIME_PRIVATE_FAILURE status=encrypted route=capture_probe\n'

      - name: Upload encrypted runtime failure context
        if: ${{ always() && steps.encrypt_runtime_failure.outputs.private_failure_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-release-runtime-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-release-runtime-failure/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove private runtime failure staging
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/platform-release-runtime-failure"
          if [[ -e "$private_dir" || -L "$private_dir" ]]; then
            [[ -d "$private_dir" && ! -L "$private_dir" ]]
            rm -f -- "$private_dir/manifest.json" "$private_dir/evidence.cms" "$private_dir/evidence.json"
            rmdir -- "$private_dir"
          fi
          rm -f -- "$RUNNER_TEMP/platform-production-capture-probe.log" "$RUNNER_TEMP/platform-production-capture-probe-error.log" \
            "$RUNNER_TEMP/platform-release-runtime-recipient.pem" "$RUNNER_TEMP/platform-release-runtime-recipient-public.pem" \
            "$RUNNER_TEMP/platform-runtime-cms-capability.der"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          remote_cleanup_status=0
          if [[ "${{ inputs.mode }}" == "capture-probe" && -n "${SSH_DIR:-}" \
            && -f "$SSH_DIR/config" && -n "${CAPTURE_PROBE_DIR_ID:-}" \
            && -n "${PROBE_SHA256:-}" ]]; then
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
            [[ "$CAPTURE_PROBE_DIR_ID" =~ ^[0-9]+:[0-9]+$ && "$PROBE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            set +e
            ssh -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
              -F "$SSH_DIR/config" -i "$SSH_DIR/id_ed25519" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "bash -s -- '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT' '$CAPTURE_PROBE_DIR_ID' '$PROBE_SHA256'" <<'REMOTE_CLEANUP'
          set -euo pipefail
          run_id="$1"; run_attempt="$2"; expected_dir_id="$3"; expected_sha="$4"
          [[ "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[0-9]+$ ]]
          [[ "$expected_dir_id" =~ ^[0-9]+:[0-9]+$ && "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          probe_dir="/run/oldsparky-capture-probe-$run_id-$run_attempt"
          probe_path="$probe_dir/probe.py"
          [[ -e "$probe_dir" || -L "$probe_dir" ]] || exit 0
          [[ -d "$probe_dir" && ! -L "$probe_dir" ]]
          [[ "$(stat -c '%d:%i' "$probe_dir")" == "$expected_dir_id" ]]
          [[ "$(stat -c '%u:%g:%a' "$probe_dir")" == "0:0:700" ]]
          if [[ -e "$probe_path" || -L "$probe_path" ]]; then
            [[ -f "$probe_path" && ! -L "$probe_path" ]]
            [[ "$(stat -c '%u:%g:%a:%h' "$probe_path")" == "0:0:600:1" ]]
            [[ "$(stat -c %s "$probe_path")" -le 524288 ]]
            [[ "$(sha256sum "$probe_path" | awk '{print $1}')" == "$expected_sha" ]]
            probe_file_id="$(stat -c '%d:%i:%u:%g:%a:%h' "$probe_path")"
            [[ "$(stat -c '%d:%i:%u:%g:%a:%h' "$probe_path")" == "$probe_file_id" ]]
            [[ "$(sha256sum "$probe_path" | awk '{print $1}')" == "$expected_sha" ]]
            rm -- "$probe_path"
          fi
          rmdir -- "$probe_dir"
          REMOTE_CLEANUP
            remote_cleanup_status=$?
            set -e
          fi
          ssh_dir="$RUNNER_TEMP/platform-production-diagnostics-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"
          if (( remote_cleanup_status != 0 )); then
            exit "$remote_cleanup_status"
          fi
