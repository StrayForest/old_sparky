              "security_run_id": env["SECURITY_RUN_ID"],
              "security_run_attempt": env["SECURITY_RUN_ATTEMPT"],
              "recovery_run_id": env["RECOVERY_RUN_ID"],
              "recovery_run_attempt": env["RECOVERY_RUN_ATTEMPT"],
              "publisher_run_id": env["PUBLISHER_RUN_ID"],
              "publisher_run_attempt": env["PUBLISHER_RUN_ATTEMPT"],
              "recipient_certificate_sha256": recipient,
              "encryption": "CMS-EnvelopedData/AES-256-GCM/RSA-OAEP-SHA-256",
              "ciphertext_sha256": ciphertext_sha,
              "ciphertext_size": int(ciphertext_size),
          }
          plaintext = json.loads(Path(os.environ["CAPTURE_EVIDENCE_PATH"]).read_text(encoding="ascii"))
          if (not isinstance(plaintext, dict)
              or plaintext.get("kind") not in {"maintenance_failure_evidence", "maintenance_failure_diagnostic"}
              or not re.fullmatch(r"[0-9a-f]{40,64}", payload["source_sha"])
              or not re.fullmatch(r"[0-9a-f]{64}", payload["bundle_sha256"])
              or not re.fullmatch(r"[0-9a-f]{64}", ciphertext_sha)
              or not 1 <= payload["ciphertext_size"] <= 384 * 1024):
              raise SystemExit("maintenance capture manifest fields are outside their bounds")
          raw = (json.dumps(payload, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          descriptor = os.open(output, os.O_WRONLY | os.O_TRUNC | os.O_NOFOLLOW)
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(raw); stream.flush(); os.fsync(stream.fileno())
          PY
            test "$plaintext_size" -le 262144 && test "$ciphertext_size" -le 393216
            printf 'encrypted_artifact_ready=true\ncapture_remote_status=%s\n' "$capture_remote_status" >> "$GITHUB_OUTPUT"
            rm -f -- "$CAPTURE_EVIDENCE_PATH" "$RECIPIENT_CERT_PATH" "$RUNNER_TEMP/platform-maintenance-recipient-public.pem" "$RUNNER_TEMP/platform-cms-capability.der"
            test ! -e "$CAPTURE_EVIDENCE_PATH" && test ! -e "$RECIPIENT_CERT_PATH"
            printf 'MAINTENANCE_EVIDENCE status=encrypted ciphertext_sha256=%s recipient_certificate_sha256=%s\n' "$ciphertext_sha256" "$RECIPIENT_CERTIFICATE_FINGERPRINT"
            if (( capture_remote_status != 0 )); then
              exit "$capture_remote_status"
            fi
          fi

      - name: Validate ciphertext-only capture artifact staging
        if: ${{ always() && inputs.action == 'capture_maintenance_failure' && steps.maintenance_action.outputs.encrypted_artifact_ready == 'true' }}
        shell: bash
        env:
          CAPTURE_EVIDENCE_PATH: ${{ runner.temp }}/platform-maintenance-evidence.json
          CAPTURE_CIPHERTEXT_DIR: ${{ runner.temp }}/platform-maintenance-capture-artifact
        run: |
          set -euo pipefail
          test ! -e "$CAPTURE_EVIDENCE_PATH"
          test ! -e "$RUNNER_TEMP/platform-maintenance-recipient.pem"
          test -f "$CAPTURE_CIPHERTEXT_DIR/evidence.cms"
          test -f "$CAPTURE_CIPHERTEXT_DIR/manifest.json"
          test "$(find "$CAPTURE_CIPHERTEXT_DIR" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(stat -c %a "$CAPTURE_CIPHERTEXT_DIR/evidence.cms")" = 600
          test "$(stat -c %a "$CAPTURE_CIPHERTEXT_DIR/manifest.json")" = 600

      - name: Upload encrypted maintenance failure evidence
        if: ${{ always() && inputs.action == 'capture_maintenance_failure' && steps.maintenance_action.outputs.encrypted_artifact_ready == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-maintenance-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-maintenance-capture-artifact/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove production SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="${SSH_DIR:-$RUNNER_TEMP/platform-recovery-bootstrap-ssh}"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts" "$ssh_dir/known_hosts.scan" "$ssh_dir/known_hosts.scan.1" "$ssh_dir/known_hosts.scan.2"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- "$RUNNER_TEMP/platform-maintenance-evidence.json" "$RUNNER_TEMP/platform-maintenance-recipient.pem" "$RUNNER_TEMP/platform-maintenance-recipient-public.pem" "$RUNNER_TEMP/platform-cms-capability.der"
          capture_artifact_dir="$RUNNER_TEMP/platform-maintenance-capture-artifact"
          if [[ -e "$capture_artifact_dir" || -L "$capture_artifact_dir" ]]; then
            test -d "$capture_artifact_dir" && test ! -L "$capture_artifact_dir"
            test "$(find "$capture_artifact_dir" -mindepth 1 -maxdepth 1 | wc -l)" -le 2
            find "$capture_artifact_dir" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir -- "$capture_artifact_dir"
          fi
          test ! -e "$RUNNER_TEMP/platform-maintenance-evidence.json"
          test ! -e "$RUNNER_TEMP/platform-maintenance-recipient.pem"
          test ! -e "$capture_artifact_dir"
