name: Platform production recovery bootstrap abort

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Fixed recovery action"
        required: true
        type: choice
        default: abort_retained_only
        options:
          - abort_retained_only
          - capture_maintenance_failure
          - reset_maintenance_failed
      security_run_id:
        description: "Exact successful Platform security and build run ID"
        required: true
        type: string
      security_run_attempt:
        description: "Exact attempt for that security run"
        required: true
        type: string
      recovery_run_id:
        description: "Exact completed recovery-bootstrap producer run ID"
        required: true
        type: string
      recovery_run_attempt:
        description: "Exact attempt for that recovery-bootstrap producer run"
        required: true
        type: string
      publisher_run_id:
        description: "Exact completed recovery-bootstrap publisher run ID"
        required: true
        type: string
      publisher_run_attempt:
        description: "Exact attempt for that recovery-bootstrap publisher run"
        required: true
        type: string
      confirmation:
        description: "Type the exact confirmation token for the selected action"
        required: true
        type: string
      capture_run_id:
        description: "Exact successful capture action run ID (reset only)"
        required: false
        type: string
      capture_run_attempt:
        description: "Exact capture action attempt (reset only)"
        required: false
        type: string
      evidence_sha256:
        description: "Locally verified SHA-256 of the decrypted host evidence (reset only)"
        required: false
        type: string
      recipient_certificate_b64:
        description: "Base64 PEM X.509 recipient certificate for encrypted capture only"
        required: false
        type: string

# This is the only manual execution path for the immutable recovery bootstrap.
# Validation is evidence-only and completes before production secrets or SSH are
# read. The host receives a bundle, never a source checkout.
permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  abort:
    name: Abort one exact retained release with the verified bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      REPOSITORY: StrayForest/old_sparky
      SECURITY_RUN_ID: ${{ inputs.security_run_id }}
      SECURITY_RUN_ATTEMPT: ${{ inputs.security_run_attempt }}
      RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
      PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
      PUBLISHER_RUN_ATTEMPT: ${{ inputs.publisher_run_attempt }}
      ABORT_CONFIRMATION: ${{ inputs.confirmation }}
      ACTION: ${{ inputs.action }}
      CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
      CAPTURE_RUN_ATTEMPT: ${{ inputs.capture_run_attempt }}
      EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
      RECIPIENT_CERTIFICATE_SHA256: 28d857f5fc6ff987444ca920a2bb5072081dbf2e41ef158d362b60e45e3f67a3
      SECURITY_WORKFLOW: Platform security and build
      SECURITY_WORKFLOW_PATH: .github/workflows/platform-security.yml
      SECURITY_JOB: Verification contract
      RECOVERY_BUILD_JOB: Build retained-release recovery bootstrap evidence
      PUBLISHER_WORKFLOW: Platform production recovery bootstrap publish
      PUBLISHER_WORKFLOW_PATH: .github/workflows/platform-production-recovery-bootstrap-publish.yml
    steps:
      - name: Validate exact recovery request before secrets or SSH
        shell: bash
        env:
          RECIPIENT_CERTIFICATE_B64: ${{ inputs.recipient_certificate_b64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/dev"
          [[ "$SECURITY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$SECURITY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$RECOVERY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$PUBLISHER_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$PUBLISHER_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          case "$ACTION" in
            abort_retained_only)
              test "$ABORT_CONFIRMATION" = "ABORT-RECOVERY-BOOTSTRAP-RETAINED-ONLY"
              ;;
            capture_maintenance_failure)
              test "$ABORT_CONFIRMATION" = "CAPTURE-MAINTENANCE-FAILURE"
              test -z "$CAPTURE_RUN_ID" && test -z "$CAPTURE_RUN_ATTEMPT" && test -z "$EVIDENCE_SHA256"
              test -n "$RECIPIENT_CERTIFICATE_B64"
              ;;
            reset_maintenance_failed)
              test "$ABORT_CONFIRMATION" = "RESET-MAINTENANCE-FAILED"
              [[ "$CAPTURE_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
              [[ "$CAPTURE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
              [[ "$EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
              test -z "$RECIPIENT_CERTIFICATE_B64"
              ;;
            *) test -z "$RECIPIENT_CERTIFICATE_B64"; exit 1 ;;
          esac

      - name: Validate pinned encrypted-capture recipient before production access
        if: ${{ inputs.action == 'capture_maintenance_failure' }}
        shell: bash
        env:
          RECIPIENT_CERTIFICATE_B64: ${{ inputs.recipient_certificate_b64 }}
          RECIPIENT_CERTIFICATE_SHA256: 28d857f5fc6ff987444ca920a2bb5072081dbf2e41ef158d362b60e45e3f67a3
        run: |
          set -euo pipefail
          umask 077
          certificate="$RUNNER_TEMP/platform-maintenance-recipient.pem"
          public_key="$RUNNER_TEMP/platform-maintenance-recipient-public.pem"
          /usr/bin/python3 -I - "$certificate" <<'PY'
          import base64, os, re, sys
          from pathlib import Path
          encoded = os.environ.get("RECIPIENT_CERTIFICATE_B64", "")
          if len(encoded) > 16384 or not encoded:
              raise SystemExit("capture recipient certificate input is outside its bound")
          try:
              raw = base64.b64decode(encoded, validate=True)
          except (ValueError, base64.binascii.Error) as exc:
              raise SystemExit("capture recipient certificate encoding is invalid") from exc
          if len(raw) > 8192 or re.fullmatch(rb"\s*-----BEGIN CERTIFICATE-----\s+[A-Za-z0-9+/=\r\n]+-----END CERTIFICATE-----\s*", raw) is None:
              raise SystemExit("capture recipient must contain exactly one PEM certificate")
          destination = Path(sys.argv[1])
          descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(raw)
              stream.flush()
              os.fsync(stream.fileno())
          PY
          openssl x509 -in "$certificate" -noout -checkend 0 >/dev/null
          fingerprint="$(openssl x509 -in "$certificate" -noout -fingerprint -sha256 | sed 's/^[^=]*=//; s/://g' | tr '[:upper:]' '[:lower:]')"
          test "$fingerprint" = "$RECIPIENT_CERTIFICATE_SHA256"
          openssl x509 -in "$certificate" -pubkey -noout -out "$public_key"
          key_description="$(openssl pkey -pubin -in "$public_key" -text -noout)"
          grep -Eq 'Public-Key: \(3072 bit\)' <<<"$key_description"
          openssl cms -help 2>&1 | grep -q -- '-encrypt'
          if ! printf 'cms-capability-check\n' | openssl cms -encrypt -binary -aes-256-gcm -outform DER -recip "$certificate" -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 -out "$RUNNER_TEMP/platform-cms-capability.der"; then
            echo "OpenSSL CMS AES-256-GCM/RSA-OAEP-SHA-256 is unavailable" >&2
            exit 1
          fi
          printf 'Recipient certificate pin validated: sha256=%s\n' "$fingerprint"
          {
            printf 'RECIPIENT_CERT_PATH=%s\n' "$certificate"
            printf 'RECIPIENT_CERTIFICATE_FINGERPRINT=%s\n' "$fingerprint"
          } >> "$GITHUB_ENV"

      - name: Validate exact successful security run, route artifact and evidence
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/platform-recovery-bootstrap-evidence"
          install -d -m 700 "$metadata"
          api="$GITHUB_API_URL/repos/$REPOSITORY"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT" --output "$metadata/run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT/jobs?per_page=100" --output "$metadata/jobs.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$SECURITY_RUN_ID/artifacts?per_page=100&page=1" --output "$metadata/artifacts.json"
          source_sha="$(/usr/bin/python3 -I -B - "$metadata/run.json" <<'PY'
          import json, sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read()).get("head_sha")
          if not isinstance(value, str):
              raise SystemExit(1)
          print(value)
          PY
          )"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$RECOVERY_RUN_ID/attempts/$RECOVERY_RUN_ATTEMPT" --output "$metadata/recovery-run.json"
          /usr/bin/python3 -I -B - "$metadata" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import zipfile

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          run_id = int(os.environ["SECURITY_RUN_ID"])
          attempt = int(os.environ["SECURITY_RUN_ATTEMPT"])
          repository = os.environ["REPOSITORY"]
          run = json.loads((root / "run.json").read_text(encoding="utf-8"))
          jobs = json.loads((root / "jobs.json").read_text(encoding="utf-8"))
          artifacts = json.loads((root / "artifacts.json").read_text(encoding="utf-8"))
          recovery_run = json.loads((root / "recovery-run.json").read_text(encoding="utf-8"))
          source_sha = run.get("head_sha")
          if not (
              run.get("id") == run_id
              and run.get("run_attempt") == attempt
              and run.get("head_branch") == "dev"
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and run.get("name") == os.environ["SECURITY_WORKFLOW"]
              and run.get("path") == os.environ["SECURITY_WORKFLOW_PATH"]
              and (run.get("repository") or {}).get("full_name") == repository
          ):
              raise SystemExit("security run provenance is not exact")
          rows = jobs.get("jobs")
          if not isinstance(rows, list) or type(jobs.get("total_count")) is not int or not 0 <= jobs["total_count"] <= 100 or jobs["total_count"] != len(rows):
              raise SystemExit("security jobs response is incomplete")
          security_matches = [
              row for row in rows or []
              if (
                  isinstance(row, dict)
                  and type(row.get("id")) is int
                  and row.get("id") > 0
                  and row.get("name") == os.environ["SECURITY_JOB"]
                  and row.get("run_id") == run_id
                  and row.get("run_attempt") == attempt
                  and row.get("status") == "completed"
                  and row.get("conclusion") == "success"
                  and row.get("head_sha") == source_sha
              )
          ]
          if not isinstance(rows, list) or len(security_matches) != 1:
              raise SystemExit("exact successful security verification job is missing")
          artifact_rows = artifacts.get("artifacts")
          if not isinstance(artifact_rows, list) or type(artifacts.get("total_count")) is not int or not 0 <= artifacts["total_count"] <= 100 or artifacts["total_count"] != len(artifact_rows):
              raise SystemExit("security artifacts response is incomplete")
          route_matches = [row for row in artifact_rows if isinstance(row, dict) and type(row.get("id")) is int and row.get("id") > 0 and row.get("name") == f"platform-ci-route-{run_id}-{attempt}" and row.get("expired") is False and isinstance(row.get("workflow_run"), dict) and row["workflow_run"].get("id") == run_id and row["workflow_run"].get("head_sha") == run.get("head_sha")]
          if len(route_matches) != 1:
              raise SystemExit("exact security route artifact is missing")
          route = route_matches[0]
          if not (
              recovery_run.get("id") == int(os.environ["RECOVERY_RUN_ID"])
              and recovery_run.get("run_attempt") == int(os.environ["RECOVERY_RUN_ATTEMPT"])
              and recovery_run.get("name") == "Platform production recovery bootstrap build"
              and recovery_run.get("path") == ".github/workflows/platform-production-recovery-bootstrap-build.yml"
              and recovery_run.get("head_branch") == "dev"
              and recovery_run.get("event") == "workflow_run"
              and recovery_run.get("status") == "completed"
              and recovery_run.get("conclusion") == "success"
              and (recovery_run.get("repository") or {}).get("full_name") == repository
              and isinstance(recovery_run.get("head_sha"), str)
              and re.fullmatch(r"[0-9a-f]{40,64}", recovery_run["head_sha"])
          ):
              raise SystemExit("exact recovery-bootstrap producer run is missing or invalid")
          if not isinstance(route.get("digest"), str) or re.fullmatch(r"sha256:[0-9a-f]{64}", route["digest"]) is None:
              raise SystemExit("route artifact digest is invalid")
          with output.open("a", encoding="ascii") as stream:
              stream.write(f"source_sha={source_sha}\n")
              stream.write(f"recovery_run_id={recovery_run['id']}\n")
              stream.write(f"recovery_run_attempt={recovery_run['run_attempt']}\n")
              stream.write(f"recovery_workflow_sha={recovery_run['head_sha']}\n")
              stream.write(f"route_digest={route['digest'].removeprefix('sha256:')}\n")
              stream.write(f"bundle_name=platform-recovery-bootstrap-{source_sha}-{os.environ['SECURITY_RUN_ID']}-{os.environ['SECURITY_RUN_ATTEMPT']}-{recovery_run['id']}-{recovery_run['run_attempt']}.zip\n")
              stream.write(f"publisher_bundle_name=platform-recovery-bootstrap-publisher-{source_sha}-{os.environ['SECURITY_RUN_ID']}-{os.environ['SECURITY_RUN_ATTEMPT']}-{recovery_run['id']}-{recovery_run['run_attempt']}-{os.environ['PUBLISHER_RUN_ID']}-{os.environ['PUBLISHER_RUN_ATTEMPT']}.zip\n")
              stream.write(f"evidence_name=platform-recovery-bootstrap-evidence-{source_sha}-{os.environ['SECURITY_RUN_ID']}-{os.environ['SECURITY_RUN_ATTEMPT']}-{recovery_run['id']}-{recovery_run['run_attempt']}-{os.environ['PUBLISHER_RUN_ID']}-{os.environ['PUBLISHER_RUN_ATTEMPT']}.json\n")
          # Evidence and bundle are downloaded by the next step; the host is
          # not contacted and no production secret has been read yet.
          _ = route
          PY
          recovery_run_id="$(awk -F= '$1 == "recovery_run_id" {print $2}' "$GITHUB_OUTPUT")"
          [[ "$recovery_run_id" =~ ^[1-9][0-9]{0,31}$ ]]
          recovery_run_attempt="$(awk -F= '$1 == "recovery_run_attempt" {print $2}' "$GITHUB_OUTPUT")"
          [[ "$recovery_run_attempt" =~ ^[1-9][0-9]{0,31}$ ]]
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$recovery_run_id/attempts/$recovery_run_attempt/jobs?per_page=100" --output "$metadata/recovery-jobs.json"
          recovery_workflow_sha="$(awk -F= '$1 == "recovery_workflow_sha" {print $2}' "$GITHUB_OUTPUT")"
          /usr/bin/python3 -I -B - "$metadata/recovery-jobs.json" "$GITHUB_OUTPUT" "$recovery_run_id" "$recovery_run_attempt" "$recovery_workflow_sha" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = payload.get("jobs") if isinstance(payload, dict) else None
          if not isinstance(rows, list) or type(payload.get("total_count")) is not int or not 0 <= payload["total_count"] <= 100 or payload["total_count"] != len(rows):
              raise SystemExit("recovery build jobs response is malformed")
          expected_run_id = int(sys.argv[3])
          expected_attempt = int(sys.argv[4])
          expected_source = sys.argv[5]
          matches = [
              row
              for row in rows
              if (
                  isinstance(row, dict)
                  and row.get("name") == os.environ["RECOVERY_BUILD_JOB"]
                  and row.get("conclusion") == "success"
                  and type(row.get("id")) is int
                  and row.get("id") > 0
                  and row.get("run_id") == expected_run_id
                  and row.get("run_attempt") == expected_attempt
                  and row.get("status") == "completed"
                  and row.get("head_sha") == expected_source
              )
          ]
          if len(matches) != 1:
              raise SystemExit("exact successful recovery build job is missing")
          with Path(sys.argv[2]).open("a", encoding="ascii") as stream:
              stream.write(f"recovery_job_id={matches[0]['id']}\n")
          PY
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$PUBLISHER_RUN_ID/attempts/$PUBLISHER_RUN_ATTEMPT" --output "$metadata/publisher-run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$PUBLISHER_RUN_ID/attempts/$PUBLISHER_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$metadata/publisher-jobs.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$PUBLISHER_RUN_ID/artifacts?per_page=100&page=1" --output "$metadata/publisher-artifacts.json"
          /usr/bin/python3 -I -B - "$metadata" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          publisher = json.loads((root / "publisher-run.json").read_text(encoding="ascii"))
          publisher_sha = publisher.get("head_sha")
          if not (publisher.get("id") == int(os.environ["PUBLISHER_RUN_ID"])
                  and publisher.get("run_attempt") == int(os.environ["PUBLISHER_RUN_ATTEMPT"])
                  and publisher.get("name") == os.environ["PUBLISHER_WORKFLOW"]
                  and publisher.get("path") == os.environ["PUBLISHER_WORKFLOW_PATH"]
                  and publisher.get("event") == "workflow_run"
                  and publisher.get("head_branch") == "dev"
                  and publisher.get("status") == "completed"
                  and publisher.get("conclusion") == "success"
                  and (publisher.get("repository") or {}).get("full_name") == os.environ["REPOSITORY"]
                  and isinstance(publisher_sha, str) and re.fullmatch(r"[0-9a-f]{40,64}", publisher_sha)):
              raise SystemExit("exact publisher run is missing or invalid")
          jobs = json.loads((root / "publisher-jobs.json").read_text(encoding="ascii"))
          rows = jobs.get("jobs") if isinstance(jobs, dict) else None
          if not isinstance(rows, list) or type(jobs.get("total_count")) is not int or not 0 <= jobs["total_count"] <= 100 or jobs["total_count"] != len(rows):
              raise SystemExit("publisher jobs response is incomplete")
          matches = [row for row in rows if isinstance(row, dict) and type(row.get("id")) is int and row.get("id") > 0
                     and row.get("name") == "Publish retained-release recovery bootstrap evidence"
                     and row.get("run_id") == int(os.environ["PUBLISHER_RUN_ID"])
                     and row.get("run_attempt") == int(os.environ["PUBLISHER_RUN_ATTEMPT"])
                     and row.get("status") == "completed" and row.get("conclusion") == "success"
                     and row.get("head_sha") == publisher_sha]
          if len(matches) != 1:
              raise SystemExit("exact successful publisher job is missing")
          artifacts = json.loads((root / "publisher-artifacts.json").read_text(encoding="ascii"))
          artifact_rows = artifacts.get("artifacts") if isinstance(artifacts, dict) else None
          if not isinstance(artifact_rows, list) or type(artifacts.get("total_count")) is not int or not 0 <= artifacts["total_count"] <= 100 or artifacts["total_count"] != len(artifact_rows):
              raise SystemExit("publisher artifacts response is incomplete")
          output_lines = output.read_text(encoding="ascii").splitlines()
          name_values = {}
          for kind, prefix in (("bundle", "publisher_bundle_name="), ("evidence", "evidence_name=")):
              values = [line.split("=", 1)[1] for line in output_lines if line.startswith(prefix)]
              if len(values) != 1 or not values[0]:
                  raise SystemExit(f"exact publisher {kind} name is missing")
              name_values[kind] = values[0]
          names = name_values
          ids = {}
          for kind, name in names.items():
              found = [row for row in artifact_rows if isinstance(row, dict) and row.get("name") == name and row.get("expired") is False and type(row.get("id")) is int and row.get("id") > 0 and isinstance(row.get("workflow_run"), dict) and row["workflow_run"].get("id") == int(os.environ["PUBLISHER_RUN_ID"]) and row["workflow_run"].get("head_sha") == publisher_sha and ("run_attempt" not in row["workflow_run"] or row["workflow_run"].get("run_attempt") == int(os.environ["PUBLISHER_RUN_ATTEMPT"]))]
              if len(found) != 1:
                  raise SystemExit(f"exact publisher {kind} artifact is missing")
              ids[kind] = found[0]["id"]
          bundle_rows = [row for row in artifact_rows if isinstance(row, dict) and row.get("id") == ids["bundle"]]
          if len(bundle_rows) != 1 or not isinstance(bundle_rows[0].get("digest"), str) or re.fullmatch(r"sha256:[0-9a-f]{64}", bundle_rows[0]["digest"]) is None:
              raise SystemExit("publisher bundle artifact digest is missing")
          with output.open("a", encoding="ascii") as stream:
              stream.write(f"publisher_run_id={os.environ['PUBLISHER_RUN_ID']}\n")
              stream.write(f"publisher_run_attempt={os.environ['PUBLISHER_RUN_ATTEMPT']}\n")
              stream.write(f"publisher_workflow_sha={publisher_sha}\n")
              stream.write(f"publisher_job_id={matches[0]['id']}\n")
              stream.write(f"publisher_bundle_artifact_id={ids['bundle']}\n")
              stream.write(f"publisher_bundle_artifact_sha256={bundle_rows[0]['digest'].removeprefix('sha256:')}\n")
              stream.write(f"publisher_evidence_artifact_id={ids['evidence']}\n")
          PY

      - name: Download, verify and attest the exact immutable bundle
        id: bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ steps.evidence.outputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ steps.evidence.outputs.recovery_run_attempt }}
          BUNDLE_NAME: ${{ steps.evidence.outputs.bundle_name }}
          PUBLISHER_BUNDLE_NAME: ${{ steps.evidence.outputs.publisher_bundle_name }}
          EVIDENCE_NAME: ${{ steps.evidence.outputs.evidence_name }}
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
          RECOVERY_WORKFLOW_SHA: ${{ steps.evidence.outputs.recovery_workflow_sha }}
          ROUTE_DIGEST: ${{ steps.evidence.outputs.route_digest }}
          RECOVERY_BUILD_JOB_ID: ${{ steps.evidence.outputs.recovery_job_id }}
          PUBLISHER_RUN_ID: ${{ steps.evidence.outputs.publisher_run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ steps.evidence.outputs.publisher_run_attempt }}
          PUBLISHER_WORKFLOW_SHA: ${{ steps.evidence.outputs.publisher_workflow_sha }}
          PUBLISHER_JOB_ID: ${{ steps.evidence.outputs.publisher_job_id }}
          PUBLISHER_BUNDLE_ARTIFACT_ID: ${{ steps.evidence.outputs.publisher_bundle_artifact_id }}
          PUBLISHER_BUNDLE_ARTIFACT_SHA256: ${{ steps.evidence.outputs.publisher_bundle_artifact_sha256 }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/platform-recovery-bootstrap-artifacts"
          install -d -m 700 "$artifact_dir"
          [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$PUBLISHER_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          api="$GITHUB_API_URL/repos/$REPOSITORY"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$PUBLISHER_RUN_ID/artifacts?per_page=100&page=1" --output "$artifact_dir/artifacts.json"
          /usr/bin/python3 -I -B - "$artifact_dir/artifacts.json" "$PUBLISHER_BUNDLE_NAME" "$EVIDENCE_NAME" "$artifact_dir" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[4])
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = payload.get("artifacts") if isinstance(payload, dict) else None
          if not isinstance(rows, list) or type(payload.get("total_count")) is not int or not 0 <= payload["total_count"] <= 100 or payload["total_count"] != len(rows):
              raise SystemExit("recovery artifacts response is malformed")
          def select(name):
              matches = [row for row in rows if isinstance(row, dict) and row.get("name") == name and row.get("expired") is False and type(row.get("id")) is int and row.get("id") > 0 and isinstance(row.get("workflow_run"), dict) and row["workflow_run"].get("id") == int(__import__("os").environ["PUBLISHER_RUN_ID"]) and row["workflow_run"].get("head_sha") == __import__("os").environ["PUBLISHER_WORKFLOW_SHA"] and ("run_attempt" not in row["workflow_run"] or row["workflow_run"].get("run_attempt") == int(__import__("os").environ["PUBLISHER_RUN_ATTEMPT"]))]
              if len(matches) != 1:
                  raise SystemExit("required recovery artifact is missing")
              return matches[0]["id"]
          (root / "bundle_id").write_text(str(select(sys.argv[2])), encoding="ascii")
          (root / "evidence_id").write_text(str(select(sys.argv[3])), encoding="ascii")
          PY
          bundle_id="$(cat "$artifact_dir/bundle_id")"
          evidence_id="$(cat "$artifact_dir/evidence_id")"
          for pair in "evidence:$evidence_id" "bundle:$bundle_id"; do
            kind="${pair%%:*}"; id="${pair#*:}"
            [[ "$id" =~ ^[1-9][0-9]{0,31}$ ]]
            curl --fail-with-body --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/artifacts/$id/zip" --output "$artifact_dir/$kind.zip"
          done
          /usr/bin/python3 -I -B - "$artifact_dir" "$GITHUB_OUTPUT" "$EVIDENCE_NAME" "$BUNDLE_NAME" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import zipfile
          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          evidence_name = sys.argv[3]
          bundle_name = sys.argv[4]
          MAX_MEMBER_BYTES = 8 * 1024 * 1024
          MAX_TOTAL_MEMBER_BYTES = 8 * 1024 * 1024
          MAX_COMPRESSION_RATIO = 100
          def write_exclusive(target, data):
              descriptor = os.open(
                  target,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                  0o600,
              )
              try:
                  with os.fdopen(descriptor, "wb") as destination:
                      destination.write(data)
                      destination.flush()
                      os.fsync(destination.fileno())
                  os.chmod(target, 0o600, follow_symlinks=False)
              except BaseException:
                  try:
                      os.unlink(target)
                  except FileNotFoundError:
                      pass
                  raise
          def one(archive, expected_name):
              with zipfile.ZipFile(archive) as source:
                  infos = source.infolist()
                  if len(infos) != 1:
                      raise SystemExit("artifact archive is not a single closed file")
                  info = infos[0]
                  mode = (info.external_attr >> 16) & 0o177777
                  if (
                      info.filename != expected_name
                      or info.create_system != 3
                      or info.is_dir()
                      or not stat.S_ISREG(mode)
                      or stat.S_IMODE(mode) & 0o022
                      or info.flag_bits & 0x1
                      or info.file_size > MAX_MEMBER_BYTES
                      or info.compress_size > MAX_MEMBER_BYTES
                      or (
                          info.file_size
                          and (
                              info.compress_size == 0
                              or info.file_size > info.compress_size * MAX_COMPRESSION_RATIO
                          )
                      )
                  ):
                      raise SystemExit("artifact archive member is unsafe")
                  data = source.read(info)
                  if len(data) != info.file_size or len(data) > MAX_TOTAL_MEMBER_BYTES:
                      raise SystemExit("artifact archive member size is unsafe")
                  target = root / expected_name
                  write_exclusive(target, data)
                  return target
          evidence = one(root / "evidence.zip", evidence_name)
          bundle = one(root / "bundle.zip", bundle_name)
          payload = json.loads(evidence.read_text(encoding="ascii"))
          if set(payload) != {"schema", "capability", "capabilities", "deployable", "bundle_name", "bundle_sha256", "bundle_artifact_sha256", "recovery_run_id", "recovery_run_attempt", "recovery_job_id", "provenance", "publisher_workflow_sha", "publisher_run_id", "publisher_run_attempt", "publisher_job_id", "publisher_bundle_name", "publisher_bundle_artifact_id", "publisher_bundle_artifact_sha256"} or payload.get("schema") != 3 or payload.get("capability") != "recovery_bootstrap" or payload.get("capabilities") != ["abort_retained_only", "recover_pending", "quarantine_populated_quiesce", "prune_task_releases", "capture_maintenance_failure", "reset_maintenance_failed"] or payload.get("deployable") is not False:
              raise SystemExit("recovery evidence schema is not closed")
          if not isinstance(payload.get("bundle_name"), str) or payload["bundle_name"] != bundle.name or payload.get("publisher_bundle_name") != os.environ["PUBLISHER_BUNDLE_NAME"] or payload.get("publisher_bundle_artifact_id") != os.environ["PUBLISHER_BUNDLE_ARTIFACT_ID"] or not re.fullmatch(r"[0-9a-f]{64}", str(payload.get("bundle_sha256"))) or not re.fullmatch(r"[0-9a-f]{64}", str(payload.get("bundle_artifact_sha256"))) or payload.get("publisher_bundle_artifact_sha256") != os.environ["PUBLISHER_BUNDLE_ARTIFACT_SHA256"]:
              raise SystemExit("recovery evidence bundle identity is invalid")
          if payload.get("recovery_run_id") != __import__("os").environ["RECOVERY_RUN_ID"] or payload.get("recovery_run_attempt") != __import__("os").environ["RECOVERY_RUN_ATTEMPT"]:
              raise SystemExit("recovery evidence run identity is invalid")
          if payload.get("recovery_job_id") != __import__("os").environ["RECOVERY_BUILD_JOB_ID"]:
              raise SystemExit("recovery evidence job identity is invalid")
          if (payload.get("publisher_run_id") != __import__("os").environ["PUBLISHER_RUN_ID"]
              or payload.get("publisher_run_attempt") != __import__("os").environ["PUBLISHER_RUN_ATTEMPT"]
              or payload.get("publisher_job_id") != __import__("os").environ["PUBLISHER_JOB_ID"]
              or payload.get("publisher_workflow_sha") != __import__("os").environ["PUBLISHER_WORKFLOW_SHA"]):
              raise SystemExit("publisher evidence identity is invalid")
          provenance = payload.get("provenance")
          expected_provenance = {
              "repository": "StrayForest/old_sparky",
              "workflow": "Platform security and build",
              "job": "Verification contract",
              "run_id": __import__("os").environ["SECURITY_RUN_ID"],
              "run_attempt": __import__("os").environ["SECURITY_RUN_ATTEMPT"],
              "recovery_workflow_sha": __import__("os").environ["RECOVERY_WORKFLOW_SHA"],
              "source_sha": __import__("os").environ["SOURCE_SHA"],
              "artifact_name": f"platform-ci-route-{__import__('os').environ['SECURITY_RUN_ID']}-{__import__('os').environ['SECURITY_RUN_ATTEMPT']}",
              "artifact_sha256": __import__("os").environ["ROUTE_DIGEST"],
              "deployable": False,
          }
          if provenance != expected_provenance:
              raise SystemExit("recovery evidence provenance is invalid")
          if hashlib.sha256(bundle.read_bytes()).hexdigest() != payload["bundle_sha256"]:
              raise SystemExit("recovery bundle digest mismatch")
          if hashlib.sha256((root / "bundle.zip").read_bytes()).hexdigest() != payload["publisher_bundle_artifact_sha256"]:
              raise SystemExit("publisher bundle artifact digest mismatch")
          with output.open("a", encoding="ascii") as stream:
              stream.write(f"bundle={bundle}\n")
              stream.write(f"bundle_sha={payload['bundle_sha256']}\n")
              stream.write(f"bundle_artifact_sha256={payload['bundle_artifact_sha256']}\n")
              stream.write(f"publisher_bundle_artifact_sha256={payload['publisher_bundle_artifact_sha256']}\n")
          PY
          # GitHub's attestation verifier binds the bundle to the trusted
          # default-branch builder; no host side trust is inferred from it.
          # The certificate runInvocationURI is run/attempt scoped and does
          # not carry a job ID.  The exact job identity is therefore bound by
          # the closed evidence above and the exact attempt jobs API response;
          # no job identity is fabricated into the certificate URI.
          # Keep the descriptor and digest bound while gh reads the file so a
          # local replacement cannot swap the subject between hashing and
          # verification.
          bundle_path="$RUNNER_TEMP/platform-recovery-bootstrap-artifacts/${{ steps.evidence.outputs.bundle_name }}"
          bundle_sha="$(/usr/bin/python3 -I -B - "$artifact_dir/$EVIDENCE_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="ascii"))["bundle_sha256"])
          PY
          )"
          bundle_stat_before="$(stat -c '%d:%i:%h:%s:%u:%g:%a' "$bundle_path")"
          bundle_digest_before="$(sha256sum "$bundle_path" | awk '{print $1}')"
          test "$bundle_digest_before" = "$bundle_sha"
          attestation_json="$artifact_dir/attestation.json"
          gh attestation verify "$bundle_path" \
            --repo "$REPOSITORY" \
            --signer-workflow StrayForest/old_sparky/.github/workflows/platform-production-recovery-bootstrap-build.yml \
            --source-ref refs/heads/dev \
            --source-digest "$RECOVERY_WORKFLOW_SHA" \
            --format json >"$attestation_json"
          bundle_stat_after="$(stat -c '%d:%i:%h:%s:%u:%g:%a' "$bundle_path")"
          bundle_digest_after="$(sha256sum "$bundle_path" | awk '{print $1}')"
          [[ "$bundle_stat_before" = "$bundle_stat_after" \
            && "$bundle_digest_before" = "$bundle_digest_after" \
            && "$bundle_digest_after" = "$bundle_sha" ]]
          /usr/bin/python3 -I -B - "$attestation_json" "$bundle_digest_after" "$RECOVERY_RUN_ID" "$RECOVERY_RUN_ATTEMPT" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          bundle_digest = sys.argv[2]
          recovery_run_id = sys.argv[3]
          recovery_run_attempt = sys.argv[4]
          values = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(values, list) or not values:
              raise SystemExit("attestation JSON is not a non-empty array")
          expected_build = "https://github.com/StrayForest/old_sparky/.github/workflows/platform-production-recovery-bootstrap-build.yml@refs/heads/dev"
          expected_repo = "https://github.com/StrayForest/old_sparky"
          expected_runner = f"https://github.com/StrayForest/old_sparky/actions/runs/{recovery_run_id}/attempts/{recovery_run_attempt}"
          found = False
          for item in values:
              if not isinstance(item, dict):
                  continue
              result = item.get("verificationResult")
              if not isinstance(result, dict):
                  continue
              signature = result.get("signature")
              certificate = signature.get("certificate") if isinstance(signature, dict) else None
              statement = result.get("statement")
              timestamps = result.get("verifiedTimestamps")
              if not isinstance(certificate, dict) or not isinstance(statement, dict) or not isinstance(timestamps, list) or not timestamps:
                  continue
              if (
                  certificate.get("issuer") != "https://token.actions.githubusercontent.com"
                  or certificate.get("sourceRepositoryURI") != expected_repo
                  or certificate.get("sourceRepositoryRef") != "refs/heads/dev"
                  or certificate.get("sourceRepositoryDigest") != os.environ.get("RECOVERY_WORKFLOW_SHA", "")
                  or certificate.get("buildConfigURI") != expected_build
                  or certificate.get("buildSignerURI") != expected_build
                  or certificate.get("runInvocationURI") != expected_runner
              ):
                  continue
              subjects = statement.get("subject")
              if not isinstance(subjects, list) or len(subjects) != 1:
                  continue
              digest = subjects[0].get("digest") if isinstance(subjects[0], dict) else None
              if not isinstance(digest, dict) or digest.get("sha256") != bundle_digest:
                  continue
              found = True
              break
          if not found:
              raise SystemExit("attestation certificate/source/run/subject policy failed")
          PY

      - name: Fetch and validate exact encrypted capture artifact
        if: ${{ inputs.action == 'reset_maintenance_failed' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
          CAPTURE_RUN_ATTEMPT: ${{ inputs.capture_run_attempt }}
          EXPECTED_EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
          SOURCE_SHA: ${{ steps.evidence.outputs.source_sha }}
          BUNDLE_SHA: ${{ steps.bundle.outputs.bundle_sha }}
          SECURITY_RUN_ID: ${{ inputs.security_run_id }}
          SECURITY_RUN_ATTEMPT: ${{ inputs.security_run_attempt }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
          PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
          PUBLISHER_RUN_ATTEMPT: ${{ inputs.publisher_run_attempt }}
          RECIPIENT_CERTIFICATE_SHA256: 28d857f5fc6ff987444ca920a2bb5072081dbf2e41ef158d362b60e45e3f67a3
        run: |
          set -euo pipefail
          [[ "$CAPTURE_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$CAPTURE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$EXPECTED_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          metadata="$RUNNER_TEMP/platform-maintenance-capture"
          install -d -m 700 "$metadata"
          api="$GITHUB_API_URL/repos/$REPOSITORY"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$CAPTURE_RUN_ID/attempts/$CAPTURE_RUN_ATTEMPT" --output "$metadata/run.json"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$CAPTURE_RUN_ID/artifacts?per_page=100&page=1" --output "$metadata/artifacts.json"
          /usr/bin/python3 -I -B - "$metadata" "$RUNNER_TEMP" "$GITHUB_OUTPUT" <<'PY'
          import hashlib, json, os, re, sys, zipfile
          from pathlib import Path
          root, runner_temp, output = map(Path, sys.argv[1:])
          env = os.environ
          run = json.loads((root / "run.json").read_text(encoding="utf-8"))
          if any((run.get("id") != int(env["CAPTURE_RUN_ID"]), run.get("run_attempt") != int(env["CAPTURE_RUN_ATTEMPT"]), run.get("name") != "Platform production recovery bootstrap abort", run.get("path") != ".github/workflows/platform-production-recovery-bootstrap-abort.yml", run.get("head_branch") != "dev", run.get("head_sha") != env["SOURCE_SHA"], run.get("event") != "workflow_dispatch", run.get("status") != "completed", run.get("conclusion") != "success")):
              raise SystemExit("capture run provenance is not exact")
          listing = json.loads((root / "artifacts.json").read_text(encoding="utf-8"))
          rows = listing.get("artifacts") if isinstance(listing, dict) else None
          if not isinstance(rows, list) or type(listing.get("total_count")) is not int or listing["total_count"] != len(rows) or len(rows) > 100:
              raise SystemExit("capture artifact page is incomplete")
          name = f"platform-maintenance-failure-{env['CAPTURE_RUN_ID']}-{env['CAPTURE_RUN_ATTEMPT']}"
          matches = [row for row in rows if isinstance(row, dict) and row.get("name") == name and row.get("expired") is False and isinstance(row.get("workflow_run"), dict) and row["workflow_run"].get("id") == int(env["CAPTURE_RUN_ID"]) and row["workflow_run"].get("head_sha") == env["SOURCE_SHA"] and ("run_attempt" not in row["workflow_run"] or row["workflow_run"].get("run_attempt") == int(env["CAPTURE_RUN_ATTEMPT"]))]
          if (len(matches) != 1 or type(matches[0].get("id")) is not int or matches[0]["id"] <= 0
              or type(matches[0].get("size_in_bytes")) is not int or not 1 <= matches[0]["size_in_bytes"] <= 1024 * 1024):
              raise SystemExit("exact encrypted capture artifact is missing or duplicated")
          digest = matches[0].get("digest")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("capture artifact digest is invalid")
          with output.open("a", encoding="ascii") as stream:
              stream.write(f"artifact_id={matches[0]['id']}\nartifact_digest={digest.removeprefix('sha256:')}\n")
          PY
          artifact_id="$(awk -F= '$1=="artifact_id" {print $2}' "$GITHUB_OUTPUT" | tail -n 1)"
          curl --fail-with-body --silent --show-error --location --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/artifacts/$artifact_id/zip" --output "$metadata/capture.zip"
          test "$(stat -c %s "$metadata/capture.zip")" -le 1048576
          expected_archive_digest="$(awk -F= '$1=="artifact_digest" {print $2}' "$GITHUB_OUTPUT" | tail -n 1)"
          test "$(sha256sum "$metadata/capture.zip" | awk '{print $1}')" = "$expected_archive_digest"
          /usr/bin/python3 -I -B - "$metadata/capture.zip" "$metadata" <<'PY'
          import hashlib, json, os, re, stat, sys, zipfile
          from pathlib import Path
          archive, root = map(Path, sys.argv[1:3])
          env = os.environ
          source_sha, bundle_sha = env["SOURCE_SHA"], env["BUNDLE_SHA"]
          capture_id, capture_attempt = env["CAPTURE_RUN_ID"], env["CAPTURE_RUN_ATTEMPT"]
          security_id, security_attempt = env["SECURITY_RUN_ID"], env["SECURITY_RUN_ATTEMPT"]
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              names = {"manifest.json", "evidence.cms"}
              if len(entries) != 2 or {entry.filename for entry in entries} != names:
                  raise SystemExit("capture artifact archive is not closed")
              for entry in entries:
                  mode = (entry.external_attr >> 16) & 0o177777
                  if entry.file_size > 512 * 1024 or entry.flag_bits & 0x1 or entry.is_dir() or not stat.S_ISREG(mode):
                      raise SystemExit("capture artifact member is unsafe")
              manifest_raw = bundle.read("manifest.json")
              ciphertext = bundle.read("evidence.cms")
          if len(ciphertext) > 384 * 1024 or len(manifest_raw) > 8192:
              raise SystemExit("encrypted capture artifact exceeded its bound")
          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit("encrypted capture manifest has duplicate keys")
                  value[key] = item
              return value
          manifest = json.loads(manifest_raw.decode("ascii"), object_pairs_hook=unique_object)
          required = {"schema", "kind", "repository", "workflow_path", "capture_run_id", "capture_run_attempt", "source_sha", "bundle_sha256", "security_run_id", "security_run_attempt", "recovery_run_id", "recovery_run_attempt", "publisher_run_id", "publisher_run_attempt", "recipient_certificate_sha256", "encryption", "ciphertext_sha256", "ciphertext_size"}
          if (set(manifest) != required or manifest.get("schema") != 1 or manifest.get("kind") != "encrypted_maintenance_failure_report"
              or manifest.get("repository") != "StrayForest/old_sparky" or manifest.get("workflow_path") != ".github/workflows/platform-production-recovery-bootstrap-abort.yml"
              or manifest.get("capture_run_id") != capture_id or manifest.get("capture_run_attempt") != capture_attempt
              or manifest.get("source_sha") != source_sha or manifest.get("bundle_sha256") != bundle_sha
              or manifest.get("security_run_id") != security_id or manifest.get("security_run_attempt") != security_attempt
              or manifest.get("recovery_run_id") != env["RECOVERY_RUN_ID"] or manifest.get("recovery_run_attempt") != env["RECOVERY_RUN_ATTEMPT"]
              or manifest.get("publisher_run_id") != env["PUBLISHER_RUN_ID"] or manifest.get("publisher_run_attempt") != env["PUBLISHER_RUN_ATTEMPT"]
              or manifest.get("recipient_certificate_sha256") != env["RECIPIENT_CERTIFICATE_SHA256"]
              or manifest.get("encryption") != "CMS-EnvelopedData/AES-256-GCM/RSA-OAEP-SHA-256"
              or type(manifest.get("ciphertext_size")) is not int or manifest["ciphertext_size"] != len(ciphertext)
              or not isinstance(manifest.get("ciphertext_sha256"), str) or re.fullmatch(r"[0-9a-f]{64}", manifest["ciphertext_sha256"]) is None
              or hashlib.sha256(ciphertext).hexdigest() != manifest["ciphertext_sha256"]
              or re.fullmatch(r"[0-9a-f]{40,64}", source_sha) is None or re.fullmatch(r"[0-9a-f]{64}", bundle_sha) is None):
              raise SystemExit("encrypted capture manifest or provenance is invalid")
          ciphertext_path = root / "evidence.cms"
          descriptor = os.open(ciphertext_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(ciphertext); stream.flush(); os.fsync(stream.fileno())
          with (root / "artifact-info.txt").open("a", encoding="ascii") as stream:
              stream.write(f"ciphertext_sha256={manifest['ciphertext_sha256']}\n")
          PY
          echo "MAINTENANCE_EVIDENCE status=bound local_evidence_hash_supplied=true"

      - name: Validate production SSH inputs
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$PROD_SSH_HOST"; test -n "$PROD_SSH_USER"; test -n "$PROD_SSH_KEY"

      - name: Configure SSH after evidence validation
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$RUNNER_TEMP/platform-recovery-bootstrap-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-recovery-bootstrap-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
