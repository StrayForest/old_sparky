name: Backend audit ruff fix

on:
  push:
    branches:
      - fix/backend-audit-remediation-20260823

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/backend-audit-remediation-20260823
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply targeted import fix
        run: python .github/scripts/backend_audit_ruff_fix.py
      - name: Commit fix when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/platform_api/app/api/routes/tournaments.py
          git commit -m "fix: remove duplicate runtime cache import"
          git push origin HEAD:fix/backend-audit-remediation-20260823
