name: Platform retained load matrix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN-RETAINED-LOAD-MATRIX to create retained pre-production data"
        required: true
        type: string
      control_email:
        description: "Existing pre-production account used for registered/ready/assigned inspection states"
        required: true
        type: string
      concurrency:
        description: "Concurrent API workers for each matrix phase (1-256)"
        required: true
        default: "80"
        type: string

permissions:
  contents: read

concurrency:
  group: platform-retained-load-matrix
  cancel-in-progress: false

jobs:
  retained-load-matrix:
    name: Retained 10k-user load matrix on pre-production
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: preproduction
    env:
      PREPROD_SSH_HOST: ${{ secrets.PREPROD_SSH_HOST }}
      PREPROD_SSH_USER: ${{ secrets.PREPROD_SSH_USER }}
      PREPROD_SSH_KEY: ${{ secrets.PREPROD_SSH_KEY }}
      PREPROD_SSH_HOST_FINGERPRINT: ${{ secrets.PREPROD_SSH_HOST_FINGERPRINT }}
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      CONTROL_EMAIL: ${{ inputs.control_email }}
      QA_CONCURRENCY: ${{ inputs.concurrency }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Validate explicit pre-production load confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Retained load matrix must run from the reviewed dev branch." >&2; exit 1; }
          test "$QA_CONFIRMATION" = "RUN-RETAINED-LOAD-MATRIX" \
            || { echo "Refusing retained load without exact confirmation." >&2; exit 1; }
          test -n "${PREPROD_SSH_HOST:-}" || { echo "PREPROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PREPROD_SSH_USER:-}" || { echo "PREPROD_SSH_USER is not configured" >&2; exit 1; }
          test -n "${PREPROD_SSH_KEY:-}" || { echo "PREPROD_SSH_KEY is not configured" >&2; exit 1; }
          test -n "${PREPROD_SSH_HOST_FINGERPRINT:-}" || {
            echo "PREPROD_SSH_HOST_FINGERPRINT is not configured" >&2
            exit 1
          }
          /usr/bin/python3 - "$CONTROL_EMAIL" "$QA_CONCURRENCY" <<'PY'
          import re
          import sys

          email, concurrency = sys.argv[1:]
          if not re.fullmatch(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+", email):
              raise SystemExit("control_email is invalid")
          if not re.fullmatch(r"[1-9][0-9]{0,2}", concurrency) or not 1 <= int(concurrency) <= 256:
              raise SystemExit("concurrency must be an integer from 1 to 256")
          PY

      - name: Configure pre-production SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/retained-load-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PREPROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PREPROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" || { echo "Pre-production SSH host exposed no ED25519 key" >&2; exit 1; }
          ssh_key_count="$(wc -l < "$ssh_scan" | tr -d ' ')"
          test "$ssh_key_count" = "1" || { echo "Expected exactly one pre-production ED25519 host key" >&2; exit 1; }
          ssh_fingerprint="$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$ssh_fingerprint" = "$PREPROD_SSH_HOST_FINGERPRINT" || {
            echo "Pre-production SSH host fingerprint mismatch" >&2
            exit 1
          }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run retained matrix on pre-production host
        id: run-matrix
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          remote_log="$RUNNER_TEMP/retained-load-remote.log"
          set +e
          ssh_output_file="$RUNNER_TEMP/retained-load-ssh-output"
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" \
            "$PREPROD_SSH_USER@$PREPROD_SSH_HOST" \
            bash -s -- "$QA_CONFIRMATION" "$TARGET_SHA" "$CONTROL_EMAIL" "$QA_CONCURRENCY" "$GITHUB_RUN_ID" \
            > "$ssh_output_file" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          confirmation="$1"
          target_sha="$2"
          control_email="$3"
          concurrency="$4"
          run_id="$5"
          sudo -n -- /root/old_sparky/platform/tools/platform_retained_load_matrix_qa.sh \
            "$confirmation" "$target_sha" "$control_email" "$concurrency" "$run_id"
          REMOTE
          remote_status=$?
          set -e
          cp "$ssh_output_file" "$remote_log"
          cat "$remote_log"
          echo "remote_exit_code=$remote_status" >> "$GITHUB_OUTPUT"

          export_dir="$(sed -n 's/^RETAINED_LOAD_MATRIX_EXPORT=//p' "$remote_log" | tail -n 1)"
          if [[ -n "$export_dir" ]]; then
            [[ "$export_dir" =~ ^/tmp/old-sparky-retained-load-[0-9]+$ ]] || {
              echo "Remote report export path failed validation" >&2
              exit 1
            }
            install -d -m 700 "$RUNNER_TEMP/retained-load-artifacts"
            scp \
              -F "$SSH_DIR/config" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PREPROD_SSH_USER@$PREPROD_SSH_HOST:$export_dir/matrix-summary.json" \
              "$RUNNER_TEMP/retained-load-artifacts/matrix-summary.json"
            scp \
              -F "$SSH_DIR/config" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -i "$SSH_DIR/id_ed25519" \
              "$PREPROD_SSH_USER@$PREPROD_SSH_HOST:$export_dir/matrix.log" \
              "$RUNNER_TEMP/retained-load-artifacts/matrix.log"
          fi
          exit "$remote_status"

      - name: Publish retained matrix artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: platform-retained-load-matrix-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/retained-load-artifacts/matrix-summary.json
            ${{ runner.temp }}/retained-load-artifacts/matrix.log
            ${{ runner.temp }}/retained-load-remote.log
          if-no-files-found: warn
          retention-days: 14

      - name: Write retained matrix summary
        if: ${{ always() }}
        shell: bash
        run: |
          summary="$RUNNER_TEMP/retained-load-artifacts/matrix-summary.json"
          if [[ ! -s "$summary" ]]; then
            {
              echo "### Retained 10k-user load matrix"
              echo
              echo "No matrix summary was exported from the pre-production host."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          /usr/bin/python3 - "$summary" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          performance = payload.get("performance_summary") or {}
          print("### Retained 10k-user load matrix")
          print()
          print(f"- Status: **{'passed' if payload.get('passed') else 'failed'}**")
          print(f"- Tournaments: {payload.get('completed_tournaments', 0)}/{payload.get('planned_tournaments', 0)}")
          print(f"- Generated users: {payload.get('completed_users', 0)}/{payload.get('planned_users', 0)}")
          print(f"- Planned teams: {payload.get('planned_teams', 0)}")
          print(f"- Worst HTTP p95: {performance.get('worst_http_p95_ms')} ms")
          print(f"- Worst HTTP p99: {performance.get('worst_http_p99_ms')} ms")
          print()
          print("#### Bottleneck classes")
          for row in performance.get("bottleneck_classes") or []:
              print(f"- `{row.get('class')}`: {row.get('runs')} matrix runs")
          print()
          print("#### Worst client phases")
          for row in performance.get("top_client_phases_by_worst_p95") or []:
              print(f"- `{row.get('name')}`: {row.get('max_p95_ms')} ms p95")
          print()
          print("Detailed compact JSON and remote execution log are available in the workflow artifact.")

      - name: Fail if retained matrix failed
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.run-matrix.outputs.remote_exit_code }}" = "0" \
            || { echo "Retained pre-production load matrix failed." >&2; exit 1; }
          /usr/bin/python3 - "$RUNNER_TEMP/retained-load-artifacts/matrix-summary.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if payload.get("passed") is not True:
              raise SystemExit("matrix-summary.json does not report passed=true")
          PY
