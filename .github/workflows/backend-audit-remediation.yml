name: Backend audit remediation helper

on:
  push:
    branches:
      - fix/backend-audit-remediation-20260823
    paths:
      - ".github/scripts/backend_audit_remediation.py"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[backend-audit-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/backend-audit-remediation-20260823
      - name: Apply audited backend remediation
        run: python .github/scripts/backend_audit_remediation.py
      - name: Validate generated Python
        run: |
          git diff --check
          python -m compileall -q \
            platform/apps/platform_api/app/api/routes/admin.py \
            platform/apps/platform_api/app/api/routes/tournaments.py \
            platform/apps/platform_api/app/services/deadlock_automation.py \
            platform/apps/platform_api/app/services/tournament_workflow.py \
            platform/tests/test_platform_backend_audit_remediation.py
      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform
          if git diff --cached --quiet; then
            echo "No remediation changes produced"
            exit 1
          fi
          git commit -m "Fix backend audit findings [backend-audit-applied]"
          git push origin HEAD:fix/backend-audit-remediation-20260823
