name: Platform Cloudflare range and UFW parity alert

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-cloudflare-range-alert
  cancel-in-progress: false

jobs:
  parity:
    name: Check Cloudflare/Nginx/UFW parity
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate production SSH inputs
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}"
          test -n "${PROD_SSH_USER:-}"
          test -n "${PROD_SSH_KEY:-}"

      - name: Configure pinned production SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-cloudflare-range-alert-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-cloudflare-range-alert-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan" 2>/dev/null
          test -s "$ssh_scan"
          test "$(wc -l < "$ssh_scan" | tr -d ' ')" = "1"
          ssh_fingerprint="$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$ssh_fingerprint" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Run read-only parity proof
        id: proof
        continue-on-error: true
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          umask 077
          proof_file="$RUNNER_TEMP/cloudflare-range-proof.txt"
          : >"$proof_file"
          chmod 600 "$proof_file"
          set +e
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            bash -s <<'REMOTE' > "$proof_file" 2>&1
          set -Eeuo pipefail
          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          guard="$current/tools/platform_release_lock_exec.sh"
          test -f "$guard" && test ! -L "$guard" && test -x "$guard"
          /bin/bash "$guard" --app-dir "$runtime" -- \
            "$runtime/shared/venv/bin/python" \
            "$current/tools/platform_validate_edge_policy.py" --json
          REMOTE
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            edge_line="$(grep -E '^EDGE_POLICY status=(passed|failed) error_class=(none|argument|cloudflare_fetch|nginx_input|ufw_command|baseline|policy|internal|remote_or_transport) cloudflare_ranges=[0-9]+ nginx_ranges=[0-9]+ ufw_ranges=[0-9]+$' \
              "$proof_file" | tail -n 1 || true)"
            if [[ -z "$edge_line" ]]; then
              edge_line='EDGE_POLICY status=failed error_class=remote_or_transport cloudflare_ranges=0 nginx_ranges=0 ufw_ranges=0'
            fi
            printf '%s\n' "$edge_line" >&2
          fi
          exit "$status"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$RUNNER_TEMP/platform-cloudflare-range-alert-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-cloudflare-range-alert-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Open or update alert issue
        if: steps.proof.outcome != 'success' && steps.cleanup_ssh.outcome == 'success'
        run: |
          set -euo pipefail
          umask 077
          title='[ALERT] Cloudflare range/UFW parity failed'
          body_file="$RUNNER_TEMP/cloudflare-range-alert.md"
          : >"$body_file"
          chmod 600 "$body_file"
          edge_line="$(grep -E '^EDGE_POLICY status=(passed|failed) error_class=(none|argument|cloudflare_fetch|nginx_input|ufw_command|baseline|policy|internal|remote_or_transport) cloudflare_ranges=[0-9]+ nginx_ranges=[0-9]+ ufw_ranges=[0-9]+$' \
            "$RUNNER_TEMP/cloudflare-range-proof.txt" | tail -n 1 || true)"
          if [[ -z "$edge_line" ]]; then
            edge_line='EDGE_POLICY status=failed error_class=remote_or_transport cloudflare_ranges=0 nginx_ranges=0 ufw_ranges=0'
          fi
          {
            echo "Daily read-only Cloudflare/Nginx/UFW parity proof failed."
            echo
            echo '```text'
            printf '%s\n' "$edge_line"
            echo '```'
          } > "$body_file"
          issue_number="$(gh issue list --state open --search '"[ALERT] Cloudflare range/UFW parity failed" in:title' --json number --jq '.[0].number // ""' 2>/dev/null)"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body-file "$body_file" >/dev/null
          else
            gh issue create --title "$title" --body-file "$body_file" >/dev/null
          fi

      - name: Remove parity proof evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/cloudflare-range-proof.txt" \
            "$RUNNER_TEMP/cloudflare-range-alert.md"
          test ! -e "$RUNNER_TEMP/cloudflare-range-proof.txt"
          test ! -e "$RUNNER_TEMP/cloudflare-range-alert.md"

      - name: Fail the scheduled check after alerting
        if: steps.proof.outcome != 'success'
        run: exit 1
