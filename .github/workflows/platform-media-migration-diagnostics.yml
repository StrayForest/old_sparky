name: Platform media migration diagnostics

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/platform-media-migration-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: platform-media-migration-diagnostics
  cancel-in-progress: false

jobs:
  media-inventory:
    name: Production legacy media inventory
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Mark media inventory pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"platform-media-inventory\",\"description\":\"Production legacy media inventory is running\",\"target_url\":\"${run_url}\"}"

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}"
          test -n "${PROD_SSH_KEY:-}"
          ssh_dir="$RUNNER_TEMP/platform-media-migration-diagnostics-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-media-migration-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test -s "$ssh_scan" || { echo "Production SSH host exposed no ED25519 key" >&2; exit 1; }
          ssh_key_count="$(wc -l < "$ssh_scan" | tr -d ' ')"
          test "$ssh_key_count" = "1" || { echo "Expected exactly one production ED25519 host key" >&2; exit 1; }
          ssh_fingerprint="$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$ssh_fingerprint" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" || {
            echo "Production SSH host fingerprint mismatch" >&2
            exit 1
          }
          install -m 0600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          chmod 600 "$ssh_dir/known_hosts"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Inspect production legacy media sources
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          umask 077
          capture_dir="$RUNNER_TEMP/platform-media-migration-diagnostics-capture"
          test "$capture_dir" = "$RUNNER_TEMP/platform-media-migration-diagnostics-capture"
          if [[ -e "$capture_dir" || -L "$capture_dir" ]]; then
            test -d "$capture_dir" && test ! -L "$capture_dir"
          fi
          install -d -m 700 "$capture_dir"
          remote_log="$(mktemp "$capture_dir/remote-log.XXXXXX")"
          remote_error="$(mktemp "$capture_dir/remote-error.XXXXXX")"
          chmod 600 "$remote_log" "$remote_error"
          printf '%s\n' \
            "MEDIA_CAPTURE_DIR=$capture_dir" \
            "MEDIA_REMOTE_LOG=$remote_log" \
            "MEDIA_REMOTE_ERROR=$remote_error" >> "$GITHUB_ENV"
          cleanup_media_capture() {
            trap - EXIT
            rm -f -- "$remote_log" "$remote_error"
            test ! -e "$remote_log" && test ! -e "$remote_error"
          }
          trap cleanup_media_capture EXIT
          set +e
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -F "$SSH_DIR/config" \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            'bash -s' >"$remote_log" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail
          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          python_bin="$runtime/shared/venv/bin/python"
          env_file="$runtime/shared/env/api.env"
          summary_tool="$current/tools/platform_media_migration_diagnostics_summary.py"
          umask 077
          private_report="$(mktemp "$runtime/shared/.media-migration-private.XXXXXX")"
          private_error="$(mktemp "$runtime/shared/.media-migration-private-error.XXXXXX")"
          public_report="$(mktemp "$runtime/shared/.media-migration-public.XXXXXX")"
          projector_error="$(mktemp "$runtime/shared/.media-migration-projector-error.XXXXXX")"
          chmod 600 "$private_report" "$private_error" "$public_report" "$projector_error"
          cleanup_media_files() {
            rm -f -- "$private_report" "$private_error" "$public_report" "$projector_error"
          }
          trap cleanup_media_files EXIT

          test -x "$python_bin"
          test -f "$env_file" && test ! -L "$env_file"
          test -f "$current/tools/platform_migrate_legacy_r2.py" \
            && test ! -L "$current/tools/platform_migrate_legacy_r2.py" \
            && test -x "$current/tools/platform_migrate_legacy_r2.py"
          test -f "$summary_tool" && test ! -L "$summary_tool"
          cd "$current"

          set +e
          PLATFORM_ENV_FILE="$env_file" \
          PLATFORM_SHARED_DIR="$runtime/shared" \
            "$python_bin" \
              tools/platform_migrate_legacy_r2.py \
              --env-file "$env_file" \
              --max-records 1000 \
              --json >"$private_report" 2>"$private_error"
          producer_exit="$?"
          set -e

          stderr_bytes="$(wc -c <"$private_error" | tr -d '[:space:]')"
          set +e
          "$python_bin" "$summary_tool" \
            --input "$private_report" \
            --producer-exit-code "$producer_exit" \
            --stderr-bytes "$stderr_bytes" \
            >"$public_report" 2>"$projector_error"
          projector_exit="$?"
          set -e

          public_cleanup_ok=true
          rm -f -- "$private_report" "$private_error" "$projector_error" || public_cleanup_ok=false
          for private_file in "$private_report" "$private_error" "$projector_error"; do
            if [[ -e "$private_file" || -L "$private_file" ]]; then
              public_cleanup_ok=false
            fi
          done
          if [[ "$public_cleanup_ok" != true ]]; then
            exit 1
          fi

          public_pattern='^\{"schema":1,"kind":"media_migration_diagnostics","status":"(passed|failed)","error_class":"(none|cutover_required|source_conflict|manual_conflict|inventory_bound|legacy_references|mutation_detected|unexpected_exit|producer|internal|remote_or_transport)","source_class":"(none|r2|local|both|mixed|unknown)","producer_exit_code":[0-9]{1,3},"stderr_bytes":[0-9]{1,7},"mutated":(true|false),"read_only":(true|false),"inventory_before_present":(true|false),"inventory_after_present":(true|false),"inventory_clear":(true|false),"source_present":(true|false),"source_failures_present":(true|false),"inventory_before_legacy_upload_references":[0-9]{1,7},"inventory_before_packaged_asset_references":[0-9]{1,7},"inventory_before_manual_conflicts":[0-9]{1,7},"inventory_after_legacy_upload_references":[0-9]{1,7},"inventory_after_packaged_asset_references":[0-9]{1,7},"inventory_after_manual_conflicts":[0-9]{1,7},"source_result_count":[0-9]{1,7},"source_failure_count":[0-9]{1,7},"processed_count":[0-9]{1,7},"succeeded_count":[0-9]{1,7},"failed_count":[0-9]{1,7},"operation_r2_gets":[0-9]{1,7},"operation_local_reads":[0-9]{1,7},"operation_r2_head_objects":[0-9]{1,7},"operation_cdn_gets":[0-9]{1,7},"operation_list_objects":[0-9]{1,7},"operation_legacy_r2_deletes":[0-9]{1,7},"operation_local_deletes":[0-9]{1,7}\}$'
          if grep -Eq "$public_pattern" "$public_report"; then
            IFS= read -r public_line < "$public_report"
            printf 'MEDIA_INVENTORY %s\n' "$public_line"
          else
            printf '%s\n' '{"schema":1,"kind":"media_migration_diagnostics","status":"failed","error_class":"producer","source_class":"unknown","producer_exit_code":255,"stderr_bytes":0,"mutated":false,"read_only":false,"inventory_before_present":false,"inventory_after_present":false,"inventory_clear":false,"source_present":false,"source_failures_present":false,"inventory_before_legacy_upload_references":0,"inventory_before_packaged_asset_references":0,"inventory_before_manual_conflicts":0,"inventory_after_legacy_upload_references":0,"inventory_after_packaged_asset_references":0,"inventory_after_manual_conflicts":0,"source_result_count":0,"source_failure_count":0,"processed_count":0,"succeeded_count":0,"failed_count":0,"operation_r2_gets":0,"operation_local_reads":0,"operation_r2_head_objects":0,"operation_cdn_gets":0,"operation_list_objects":0,"operation_legacy_r2_deletes":0,"operation_local_deletes":0}'
            projector_exit=1
          fi
          exit "$projector_exit"
          REMOTE
          remote_status="$?"
          set -e
          public_pattern='^MEDIA_INVENTORY \{"schema":1,"kind":"media_migration_diagnostics","status":"(passed|failed)","error_class":"(none|cutover_required|source_conflict|manual_conflict|inventory_bound|legacy_references|mutation_detected|unexpected_exit|producer|internal|remote_or_transport)","source_class":"(none|r2|local|both|mixed|unknown)","producer_exit_code":[0-9]{1,3},"stderr_bytes":[0-9]{1,7},"mutated":(true|false),"read_only":(true|false),"inventory_before_present":(true|false),"inventory_after_present":(true|false),"inventory_clear":(true|false),"source_present":(true|false),"source_failures_present":(true|false),"inventory_before_legacy_upload_references":[0-9]{1,7},"inventory_before_packaged_asset_references":[0-9]{1,7},"inventory_before_manual_conflicts":[0-9]{1,7},"inventory_after_legacy_upload_references":[0-9]{1,7},"inventory_after_packaged_asset_references":[0-9]{1,7},"inventory_after_manual_conflicts":[0-9]{1,7},"source_result_count":[0-9]{1,7},"source_failure_count":[0-9]{1,7},"processed_count":[0-9]{1,7},"succeeded_count":[0-9]{1,7},"failed_count":[0-9]{1,7},"operation_r2_gets":[0-9]{1,7},"operation_local_reads":[0-9]{1,7},"operation_r2_head_objects":[0-9]{1,7},"operation_cdn_gets":[0-9]{1,7},"operation_list_objects":[0-9]{1,7},"operation_legacy_r2_deletes":[0-9]{1,7},"operation_local_deletes":[0-9]{1,7}\}$'
          public_line="$(grep -E "$public_pattern" "$remote_log" | tail -n 1 || true)"
          if [[ -n "$public_line" ]]; then
            printf '%s\n' "$public_line"
          else
            printf '%s\n' 'MEDIA_INVENTORY {"schema":1,"kind":"media_migration_diagnostics","status":"failed","error_class":"remote_or_transport","source_class":"unknown","producer_exit_code":255,"stderr_bytes":0,"mutated":false,"read_only":false,"inventory_before_present":false,"inventory_after_present":false,"inventory_clear":false,"source_present":false,"source_failures_present":false,"inventory_before_legacy_upload_references":0,"inventory_before_packaged_asset_references":0,"inventory_before_manual_conflicts":0,"inventory_after_legacy_upload_references":0,"inventory_after_packaged_asset_references":0,"inventory_after_manual_conflicts":0,"source_result_count":0,"source_failure_count":0,"processed_count":0,"succeeded_count":0,"failed_count":0,"operation_r2_gets":0,"operation_local_reads":0,"operation_r2_head_objects":0,"operation_cdn_gets":0,"operation_list_objects":0,"operation_legacy_r2_deletes":0,"operation_local_deletes":0}'
            remote_status=1
          fi
          if (( remote_status != 0 )); then
            exit 1
          fi

      - name: Remove private media diagnostic capture
        id: cleanup_media_capture
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          capture_dir="${MEDIA_CAPTURE_DIR:-$RUNNER_TEMP/platform-media-migration-diagnostics-capture}"
          test "$capture_dir" = "$RUNNER_TEMP/platform-media-migration-diagnostics-capture"
          if [[ -n "${MEDIA_REMOTE_LOG:-}" ]]; then
            case "$MEDIA_REMOTE_LOG" in
              "$capture_dir"/remote-log.*) rm -f -- "$MEDIA_REMOTE_LOG" ;;
              *) exit 1 ;;
            esac
          fi
          if [[ -n "${MEDIA_REMOTE_ERROR:-}" ]]; then
            case "$MEDIA_REMOTE_ERROR" in
              "$capture_dir"/remote-error.*) rm -f -- "$MEDIA_REMOTE_ERROR" ;;
              *) exit 1 ;;
            esac
          fi
          if [[ -e "$capture_dir" || -L "$capture_dir" ]]; then
            test -d "$capture_dir" && test ! -L "$capture_dir"
            rmdir -- "$capture_dir"
          fi
          printf '%s\n' 'MEDIA_CAPTURE_DIR=' 'MEDIA_REMOTE_LOG=' 'MEDIA_REMOTE_ERROR=' >> "$GITHUB_ENV"
          unset MEDIA_CAPTURE_DIR MEDIA_REMOTE_LOG MEDIA_REMOTE_ERROR
          test -z "${MEDIA_CAPTURE_DIR:-}" && test -z "${MEDIA_REMOTE_LOG:-}" && test -z "${MEDIA_REMOTE_ERROR:-}"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-media-migration-diagnostics-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-media-migration-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Mark media inventory successful
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"platform-media-inventory\",\"description\":\"Production legacy media inventory collected\",\"target_url\":\"${run_url}\"}"

      - name: Mark media inventory failed
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"platform-media-inventory\",\"description\":\"Production legacy media inventory failed\",\"target_url\":\"${run_url}\"}"
