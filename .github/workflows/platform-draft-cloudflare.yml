name: Platform Draft Cloudflare

on:
  pull_request:
    paths:
      - "platform/apps/platform_draft/**"
      - "platform/apps/platform_web/components/layout/site-header.tsx"
      - "platform/apps/platform_web/lib/routes.ts"
      - "platform/apps/platform_web/public/assets/heroes/**"
      - "platform/tools/sync_draft_hero_assets.py"
      - "platform/docs/adr/public-draft-edge-boundary.md"
      - ".github/workflows/platform-draft-cloudflare.yml"
  workflow_run:
    workflows: ["Platform security and build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-draft-cloudflare-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pr:
    name: Draft static and state checks
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.3.1"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        working-directory: platform/apps/platform_draft
        run: npm run check
      - name: Run zero-dependency Draft tests
        working-directory: platform/apps/platform_draft
        run: npm test
      - name: Build routed static assets
        working-directory: platform/apps/platform_draft
        run: |
          npm run build
          test -f dist/draft/index.html
          test -f dist/draft/app.js
          test -f dist/draft/styles.css
          grep -q 'Драфты' dist/draft/app.js
          grep -q 'Баны на команду' dist/draft/app.js
          ! grep -Eq 'Предпросмотр|preview' dist/draft/app.js dist/draft/styles.css
      - name: Generate optimized hero thumbnails without network writes
        run: |
          python -m venv platform/.venv_draft_assets
          platform/.venv_draft_assets/bin/python -m pip install \
            --require-hashes \
            -r platform/apps/platform_draft/requirements-assets.lock.txt
          cd platform
          .venv_draft_assets/bin/python tools/sync_draft_hero_assets.py \
            --output-dir /tmp/oldsparky-draft-heroes
          test "$(find /tmp/oldsparky-draft-heroes -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')" -ge 30

  detect-release:
    name: Detect Draft release
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'dev')
      }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
      target_sha: ${{ steps.paths.outputs.target_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'dev' }}
          fetch-depth: 2
          persist-credentials: false
      - name: Detect Draft-related changes
        id: paths
        shell: bash
        env:
          WORKFLOW_TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          target_sha="${WORKFLOW_TARGET_SHA:-$(git rev-parse HEAD)}"
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "${target_sha}^1" >/dev/null 2>&1; then
            changed_files="$(git diff --name-only "${target_sha}^1" "${target_sha}")"
          else
            changed_files="$(git show --pretty='' --name-only "${target_sha}")"
          fi
          printf '%s\n' "$changed_files"

          if grep -Eq '^(platform/apps/platform_draft/|platform/apps/platform_web/components/layout/site-header\.tsx$|platform/apps/platform_web/lib/routes\.ts$|platform/apps/platform_web/public/assets/heroes/|platform/tools/sync_draft_hero_assets\.py$|platform/docs/adr/public-draft-edge-boundary\.md$|\.github/workflows/platform-draft-cloudflare\.yml$)' <<<"$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    name: Build digest-bound Draft bundle without Cloudflare credentials
    if: ${{ needs.detect-release.outputs.changed == 'true' }}
    needs: [detect-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.detect-release.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.3.1"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build and test Draft candidate
        working-directory: platform/apps/platform_draft
        run: |
          set -euo pipefail
          npm run check
          npm test
          npm run build
          test -f dist/draft/index.html
          test -f dist/draft/app.js
          test -f dist/draft/styles.css
      - name: Install hash-locked Wrangler without Cloudflare credentials
        working-directory: platform/apps/platform_draft
        env:
          WRANGLER_LOCK_SHA256: 17d717b60ee2f9edf5bbf1c21d0e99c787e974aa347eea0dedb896d36dcff145
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$WRANGLER_LOCK_SHA256" package-lock.json | sha256sum --check --status -
          npm ci --ignore-scripts --no-audit --no-fund --omit=dev
      - name: Generate immutable Draft bundle
        shell: bash
        env:
          TARGET_SHA: ${{ needs.detect-release.outputs.target_sha }}
          WRANGLER_LOCK_SHA256: 17d717b60ee2f9edf5bbf1c21d0e99c787e974aa347eea0dedb896d36dcff145
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/draft-release-bundle"
          mkdir -m 700 "$bundle"
          cp -- platform/apps/platform_draft/wrangler.jsonc "$bundle/wrangler.jsonc"
          cp -- platform/apps/platform_draft/worker.js "$bundle/worker.js"
          mkdir -m 700 "$bundle/public" "$bundle/dist" "$bundle/heroes"
          cp -- platform/apps/platform_draft/public/heroes.js "$bundle/public/heroes.js"
          cp -a -- platform/apps/platform_draft/dist/draft "$bundle/dist/draft"
          python -m venv platform/.venv_draft_assets
          platform/.venv_draft_assets/bin/python -m pip install \
            --require-hashes \
            -r platform/apps/platform_draft/requirements-assets.lock.txt
          cd platform
          .venv_draft_assets/bin/python tools/sync_draft_hero_assets.py \
            --output-dir "$bundle/heroes"
          /usr/bin/python3 - "$bundle" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          target_sha = sys.argv[2]
          files = {}
          total_bytes = 0
          for path in sorted(root.rglob("*")):
              if path.is_symlink() or not (path.is_file() or path.is_dir()):
                  raise SystemExit("Draft bundle contains an unsafe filesystem entry")
              if path.is_file():
                  relative = path.relative_to(root).as_posix()
                  size = path.stat().st_size
                  if not relative or len(relative) > 256 or size > 16 * 1024 * 1024:
                      raise SystemExit("Draft bundle member exceeds its bound")
                  total_bytes += size
                  if total_bytes > 64 * 1024 * 1024:
                      raise SystemExit("Draft bundle exceeds its size bound")
                  files[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          if not files or len(files) > 4096:
              raise SystemExit("Draft bundle inventory is outside its bound")
          payload = {"schema": 1, "target_sha": target_sha, "files": files}
          payload["digest"] = hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (root / "bundle-manifest.json").write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="ascii")
          PY
          wrangler_root="$RUNNER_TEMP/draft-wrangler-runtime"
          install -d -m 700 "$wrangler_root/node_modules"
          for entry in platform/apps/platform_draft/node_modules/*; do
            [[ "$(basename "$entry")" == ".bin" ]] && continue
            cp -a -- "$entry" "$wrangler_root/node_modules/"
          done
          /usr/bin/python3 - "$wrangler_root" platform/apps/platform_draft/package-lock.json "$WRANGLER_LOCK_SHA256" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          lock_path = Path(sys.argv[2])
          expected_lock_sha = sys.argv[3]
          if hashlib.sha256(lock_path.read_bytes()).hexdigest() != expected_lock_sha:
              raise SystemExit("Wrangler lockfile digest is not the reviewed value")
          files = {}
          total_bytes = 0
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit("Wrangler runtime contains a symlink")
              if path.is_file():
                  relative = path.relative_to(root).as_posix()
                  if not relative or len(relative) > 256:
                      raise SystemExit("Wrangler runtime member name is unsafe")
                  size = path.stat().st_size
                  total_bytes += size
                  if size > 64 * 1024 * 1024 or total_bytes > 300 * 1024 * 1024:
                      raise SystemExit("Wrangler runtime exceeds its size bound")
                  files[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          if len(files) < 100 or len(files) > 4096:
              raise SystemExit("Wrangler runtime inventory is outside its bound")
          cli = "node_modules/wrangler/wrangler-dist/cli.js"
          if cli not in files:
              raise SystemExit("Wrangler CLI is missing from the runtime")
          payload = {
              "schema": 1,
              "package": "wrangler",
              "version": "4.129.0",
              "lockfile_sha256": expected_lock_sha,
              "files": files,
          }
          digest = hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (root / "wrangler-tool-manifest.json").write_text(
              json.dumps({**payload, "digest": digest}, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="ascii",
          )
          if digest != "c27608e7efe705b963aee2f3b2d5ef15ac7d7e51816f086836aac071ea59ad6a":
              raise SystemExit("Wrangler runtime manifest digest is not the reviewed value")
          PY
      - name: Upload digest-bound Draft bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-draft-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draft-release-bundle
          if-no-files-found: error
          retention-days: 2
      - name: Upload digest-bound Wrangler runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-draft-wrangler-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draft-wrangler-runtime
          if-no-files-found: error
          retention-days: 2

  release:
    name: Publish Draft edge runtime
    if: ${{ needs.detect-release.outputs.changed == 'true' }}
    needs: [detect-release, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Download digest-bound Draft bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-draft-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draft-release-bundle
      - name: Download digest-bound Wrangler runtime
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: platform-draft-wrangler-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draft-wrangler-runtime
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26.3.1"
      - name: Validate data-only Draft handoff
        shell: bash
        env:
          TARGET_SHA: ${{ needs.detect-release.outputs.target_sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/draft-release-bundle"
          test -d "$bundle" && test ! -L "$bundle"
          ! find -L "$bundle" -type l -print -quit | grep -q .
          /usr/bin/python3 - "$bundle/bundle-manifest.json" "$bundle" "$TARGET_SHA" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import stat
          import sys

          manifest_path = Path(sys.argv[1])
          root = Path(sys.argv[2])
          target_sha = sys.argv[3]
          if re.fullmatch(r"[0-9a-f]{40}", target_sha) is None:
              raise SystemExit("Draft target SHA is invalid")
          manifest = json.loads(manifest_path.read_text(encoding="ascii"))
          if not isinstance(manifest, dict) or manifest.get("schema") != 1 or manifest.get("target_sha") != target_sha:
              raise SystemExit("Draft handoff schema or SHA is invalid")
          files = manifest.get("files")
          if not isinstance(files, dict) or not files or len(files) > 4096:
              raise SystemExit("Draft handoff file inventory is invalid")
          expected = set(files)
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() and path.name != "bundle-manifest.json"
          }
          if actual != expected:
              raise SystemExit("Draft handoff file inventory changed")
          for name, expected_digest in files.items():
              path_parts = Path(name).parts if isinstance(name, str) else ()
              if (
                  not isinstance(name, str)
                  or not name.isascii()
                  or "\\" in name
                  or Path(name).is_absolute()
                  or any(part in {"", ".", ".."} for part in path_parts)
                  or len(name) > 256
                  or not isinstance(expected_digest, str)
                  or re.fullmatch(r"[0-9a-f]{64}", expected_digest) is None
              ):
                  raise SystemExit("Draft handoff digest is invalid")
              path = root / name
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode) or metadata.st_nlink != 1:
                  raise SystemExit("Draft handoff member is not a regular file")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != expected_digest:
                  raise SystemExit("Draft handoff digest mismatch")
          canonical = json.dumps({"schema": 1, "target_sha": target_sha, "files": files}, sort_keys=True, separators=(",", ":")).encode()
          expected_manifest_digest = hashlib.sha256(canonical).hexdigest()
          if manifest.get("digest") != expected_manifest_digest:
              raise SystemExit("Draft handoff manifest digest mismatch")
          PY

      - name: Validate immutable Wrangler runtime
        shell: bash
        env:
          EXPECTED_WRANGLER_LOCK_SHA256: 17d717b60ee2f9edf5bbf1c21d0e99c787e974aa347eea0dedb896d36dcff145
          EXPECTED_WRANGLER_MANIFEST_SHA256: c27608e7efe705b963aee2f3b2d5ef15ac7d7e51816f086836aac071ea59ad6a
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/draft-wrangler-runtime"
          test -d "$root" && test ! -L "$root"
          /usr/bin/python3 - "$root" "$EXPECTED_WRANGLER_LOCK_SHA256" "$EXPECTED_WRANGLER_MANIFEST_SHA256" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import stat
          import sys

          root = Path(sys.argv[1])
          expected_lock_sha, expected_manifest_sha = sys.argv[2:]
          manifest_path = root / "wrangler-tool-manifest.json"
          if not manifest_path.is_file() or manifest_path.is_symlink():
              raise SystemExit("Wrangler runtime manifest is missing")
          manifest = json.loads(manifest_path.read_text(encoding="ascii"))
          expected_keys = {"schema", "package", "version", "lockfile_sha256", "files", "digest"}
          if set(manifest) != expected_keys or manifest.get("schema") != 1 or manifest.get("package") != "wrangler" or manifest.get("version") != "4.129.0":
              raise SystemExit("Wrangler runtime manifest schema is not closed")
          if manifest.get("lockfile_sha256") != expected_lock_sha:
              raise SystemExit("Wrangler runtime lockfile digest mismatch")
          files = manifest.get("files")
          if not isinstance(files, dict) or not files or len(files) > 4096:
              raise SystemExit("Wrangler runtime file inventory is invalid")
          canonical = json.dumps({key: manifest[key] for key in ("schema", "package", "version", "lockfile_sha256", "files")}, sort_keys=True, separators=(",", ":")).encode()
          if hashlib.sha256(canonical).hexdigest() != expected_manifest_sha or manifest.get("digest") != expected_manifest_sha:
              raise SystemExit("Wrangler runtime manifest digest mismatch")
          actual = set()
          total_bytes = 0
          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit("Wrangler runtime contains a symlink")
              if path.is_file() and path != manifest_path:
                  actual.add(path.relative_to(root).as_posix())
          if actual != set(files):
              raise SystemExit("Wrangler runtime file inventory changed")
          for name, expected_digest in files.items():
              if not isinstance(name, str) or not name.isascii() or "\\" in name or Path(name).is_absolute() or any(part in {"", ".", ".."} for part in Path(name).parts) or len(name) > 256:
                  raise SystemExit("Wrangler runtime path is unsafe")
              if not isinstance(expected_digest, str) or re.fullmatch(r"[0-9a-f]{64}", expected_digest) is None:
                  raise SystemExit("Wrangler runtime member digest is malformed")
              path = root / name
              metadata = path.lstat()
              if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode) or metadata.st_nlink != 1:
                  raise SystemExit("Wrangler runtime member is not a regular file")
              total_bytes += metadata.st_size
              if metadata.st_size > 64 * 1024 * 1024 or total_bytes > 300 * 1024 * 1024:
                  raise SystemExit("Wrangler runtime member exceeds its size bound")
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected_digest:
                  raise SystemExit("Wrangler runtime member digest mismatch")
          cli = root / "node_modules/wrangler/wrangler-dist/cli.js"
          if not cli.is_file() or cli.is_symlink():
              raise SystemExit("validated Wrangler CLI is missing")
          print("immutable Wrangler runtime accepted")
          PY

      - name: Require Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Generate production hero thumbnails
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/draft-release-bundle/heroes"

      - name: Upload immutable hero thumbnails to existing R2 bucket
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRAFT_R2_BUCKET: oldsparky
          WRANGLER_CLI: ${{ runner.temp }}/draft-wrangler-runtime/node_modules/wrangler/wrangler-dist/cli.js
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/draft-release-bundle/heroes/*.webp)
          test "${#files[@]}" -ge 30
          test -f "$WRANGLER_CLI" && test ! -L "$WRANGLER_CLI"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            node "$WRANGLER_CLI" r2 object put \
              "${DRAFT_R2_BUCKET}/draft/heroes/v1/${name}" \
              --file "$file" \
              --content-type image/webp \
              --cache-control 'public, max-age=31536000, immutable' \
              --remote \
              --force
          done

      - name: Deploy Worker, Static Assets and Durable Object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CLI: ${{ runner.temp }}/draft-wrangler-runtime/node_modules/wrangler/wrangler-dist/cli.js
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/draft-release-bundle"
          test -f "$WRANGLER_CLI" && test ! -L "$WRANGLER_CLI"
          node "$WRANGLER_CLI" deploy --config "$RUNNER_TEMP/draft-release-bundle/wrangler.jsonc"

      - name: Smoke-check Draft page, assets, CDN and room creation
        shell: bash
        run: |
          set -euo pipefail

          get_200() {
            local name="$1"
            local url="$2"
            local output="$3"
            local headers="${output}.headers"
            local status=""
            for attempt in $(seq 1 10); do
              status="$(curl --silent --show-error --output "$output" --dump-header "$headers" --write-out '%{http_code}' "$url" || true)"
              echo "${name}: HTTP ${status} (attempt ${attempt})"
              if [[ "$status" == "200" ]]; then
                return 0
              fi
              sleep 2
            done
            echo "${name} failed with HTTP ${status}" >&2
            cat "$headers" >&2 || true
            return 1
          }

          assert_live_asset() {
            local name="$1"
            local url="$2"
            local output="$3"
            local expected="$4"
            get_200 "$name" "$url" "$output"
            if ! cmp --silent "$output" "$expected"; then
              echo "${name} body does not match the just-built asset" >&2
              echo "Expected: $(sha256sum "$expected" | awk '{print $1}')" >&2
              echo "Received: $(sha256sum "$output" | awk '{print $1}')" >&2
              return 1
            fi
            echo "${name}: live body matches $(sha256sum "$expected" | awk '{print $1}')"
            grep -iE '^(cf-cache-status|age|x-old-sparky-draft-asset-cache-status):' "${output}.headers" || true
          }

          assert_live_asset \
            "Draft page" \
            "https://old-sparky.com/draft" \
            /tmp/draft.html \
            "$RUNNER_TEMP/draft-release-bundle/dist/draft/index.html"
          grep -q 'id="app"' /tmp/draft.html
          grep -q 'ca-pub-7185165276065459' /tmp/draft.html
          grep -qi '^x-old-sparky-draft: 1' /tmp/draft.html.headers

          assert_live_asset \
            "Draft app.js" \
            "https://old-sparky.com/draft/app.js" \
            /tmp/draft-app.js \
            "$RUNNER_TEMP/draft-release-bundle/dist/draft/app.js"
          grep -q 'oldsparky:draft:solo' /tmp/draft-app.js
          grep -q 'Драфты' /tmp/draft-app.js
          grep -q 'Баны на команду' /tmp/draft-app.js
          ! grep -Eq 'Предпросмотр|preview' /tmp/draft-app.js

          assert_live_asset \
            "Draft styles.css" \
            "https://old-sparky.com/draft/styles.css" \
            /tmp/draft-styles.css \
            "$RUNNER_TEMP/draft-release-bundle/dist/draft/styles.css"
          assert_live_asset \
            "Draft draft-core.js" \
            "https://old-sparky.com/draft/draft-core.js" \
            /tmp/draft-core.js \
            "$RUNNER_TEMP/draft-release-bundle/dist/draft/draft-core.js"
          assert_live_asset \
            "Draft heroes.js" \
            "https://old-sparky.com/draft/heroes.js" \
            /tmp/draft-heroes.js \
            "$RUNNER_TEMP/draft-release-bundle/dist/draft/heroes.js"

          get_200 "Hero CDN" "https://cdn.old-sparky.com/draft/heroes/v1/abrams.webp" /tmp/abrams.webp
          test -s /tmp/abrams.webp

          room_status="$(curl --silent --show-error \
            --output /tmp/draft-room.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://old-sparky.com' \
            --header 'Content-Type: application/json' \
            --data '{"presetId":"6v6-no-bans","timerSeconds":30}' \
            https://old-sparky.com/draft/api/rooms || true)"
          echo "Draft room create: HTTP ${room_status}"
          test "$room_status" = "201"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/draft-room.json').read_text())
          assert isinstance(payload.get('roomCode'), str) and 6 <= len(payload['roomCode']) <= 32
          assert isinstance(payload.get('hostToken'), str) and len(payload['hostToken']) >= 20
          assert isinstance(payload.get('guestToken'), str) and len(payload['guestToken']) >= 20
          print("Draft room API OK")
          PY
