name: Platform Draft Cloudflare

on:
  pull_request:
    paths:
      - "platform/apps/platform_draft/**"
      - "platform/apps/platform_web/components/layout/site-header.tsx"
      - "platform/apps/platform_web/lib/routes.ts"
      - "platform/tools/sync_draft_hero_assets.py"
      - "platform/docs/adr/public-draft-edge-boundary.md"
      - ".github/workflows/platform-draft-cloudflare.yml"
  push:
    branches: [dev]
    paths:
      - "platform/apps/platform_draft/**"
      - "platform/apps/platform_web/components/layout/site-header.tsx"
      - "platform/apps/platform_web/lib/routes.ts"
      - "platform/tools/sync_draft_hero_assets.py"
      - "platform/docs/adr/public-draft-edge-boundary.md"
      - ".github/workflows/platform-draft-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: platform-draft-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Draft static and state checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26.3.1"
      - name: Check JavaScript syntax
        working-directory: platform/apps/platform_draft
        run: npm run check
      - name: Run zero-dependency Draft tests
        working-directory: platform/apps/platform_draft
        run: npm test
      - name: Check R2 thumbnail plan without writing objects
        run: |
          python3 -m venv platform/.venv_draft_assets
          platform/.venv_draft_assets/bin/python -m pip install --disable-pip-version-check Pillow pydantic pydantic-settings boto3
          cd platform
          .venv_draft_assets/bin/python tools/sync_draft_hero_assets.py --dry-run

  deploy:
    name: Publish Draft edge runtime
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Wait for exact-SHA platform security gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status"
          for attempt in $(seq 1 120); do
            state="$(
              curl --fail-with-body --silent --show-error \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "$api" \
              | jq -r '[.statuses[] | select(.context == "platform-security-build")][0].state // "missing"'
            )"
            case "$state" in
              success)
                echo "platform-security-build passed for ${TARGET_SHA}"
                exit 0
                ;;
              failure|error)
                echo "platform-security-build failed for ${TARGET_SHA}" >&2
                exit 1
                ;;
              pending|missing)
                sleep 10
                ;;
              *)
                echo "Unexpected platform-security-build state: $state" >&2
                exit 1
                ;;
            esac
          done
          echo "Timed out waiting for platform-security-build on ${TARGET_SHA}" >&2
          exit 1

      - name: Detect Cloudflare deployment credentials
        id: cloudflare-config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Draft deployment is not configured; add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production environment."
          fi

      - name: Deploy Worker, Static Assets and Durable Object
        if: ${{ steps.cloudflare-config.outputs.configured == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: platform/apps/platform_draft
          command: deploy

      - name: Smoke-check public Draft route
        if: ${{ steps.cloudflare-config.outputs.configured == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --retry 5 --retry-delay 2 https://old-sparky.com/draft)"
          grep -q 'id="app"' <<<"$body"
          grep -q 'ca-pub-7185165276065459' <<<"$body"
