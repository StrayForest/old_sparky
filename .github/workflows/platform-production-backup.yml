name: Platform production backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  backup:
    name: Create restore-verified backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Require the reviewed dev ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production backup must run from the reviewed dev ref" >&2; exit 1; }

      - name: Validate production SSH inputs
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-backup-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-backup-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' "SSH_DIR=$ssh_dir"
          } >> "$GITHUB_ENV"

      - name: Create and verify the production backup
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          umask 077
          remote_report="$RUNNER_TEMP/platform-production-backup-report.log"
          remote_error="$RUNNER_TEMP/platform-production-backup-ssh-error.log"
          : >"$remote_report"
          : >"$remote_error"
          chmod 600 "$remote_report" "$remote_error"
          if ! ssh \
            -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            'bash -s' >"$remote_report" 2>"$remote_error" <<'REMOTE'
          set -Eeuo pipefail

          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          python_bin="$runtime/shared/venv/bin/python"
          # The historical platform_storage_maintenance.py wrapper remains
          # read-only/library compatibility; this production path enters the
          # single supervisor directly.
          maintenance_tool="$current/tools/platform_backup_supervisor.py"
          process_monitor="$current/tools/platform_backup_process_monitor.py"
          summary_tool="$current/tools/platform_storage_evidence_summary.py"
          umask 077
          backup_report_file="$(mktemp)"
          chmod 600 "$backup_report_file"
          cleanup() {
            rm -f -- "$backup_report_file"
          }
          trap cleanup EXIT

          test "$(id -u)" -eq 0 || { echo "Production backup must run as root" >&2; exit 1; }
          test -L "$current" || { echo "Current release symlink is missing" >&2; exit 1; }
          test -x "$python_bin" || { echo "Shared Python runtime is missing" >&2; exit 1; }
          test -f "$runtime/shared/.env.platform" || { echo "Platform env file is missing" >&2; exit 1; }
          test -f "$maintenance_tool" && test ! -L "$maintenance_tool" \
            || { echo "Storage maintenance tool is missing" >&2; exit 1; }
          test -f "$process_monitor" && test ! -L "$process_monitor" \
            && test -x "$process_monitor" && test "$(stat -c '%u:%F:%a' "$process_monitor")" = "0:regular file:755" \
            && test "$(readlink -f -- "$process_monitor")" = "$(readlink -f -- "$current")/tools/platform_backup_process_monitor.py" \
            || { echo "Backup process monitor is missing or unsafe" >&2; exit 1; }
          test -f "$summary_tool" && test ! -L "$summary_tool" \
            || { echo "Storage evidence summary helper is missing or unsafe" >&2; exit 1; }

          if ! "$python_bin" "$maintenance_tool" maintenance \
            --app-dir "$runtime" \
            --source-release-dir "$runtime/dist/releases" \
            --backup-keep 14 \
            --backup-max-age-hours 24 \
            --backup-timeout-seconds 1500 \
            --backup-only \
            --apply \
            --json >"$backup_report_file" 2>/dev/null; then
            echo "Production backup lock-aware maintenance failed" >&2
            exit 1
          fi
          public_report="$({
            /usr/bin/python3 -I "$summary_tool" --mode retention \
              <"$backup_report_file"
          } 2>/dev/null)" || {
            echo "Production backup summary failed" >&2
            exit 1
          }
          /usr/bin/python3 -I - "$backup_report_file" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("mode") != "backup-only" or report.get("ok") is not True:
              raise SystemExit("lock-aware backup report is not successful")
          limits = report.get("limits") or {}
          if limits.get("backup_keep") != 14:
              raise SystemExit("backup rotation limit is not 14")
          backup = report.get("backup") or {}
          if (
              backup.get("status") != "completed"
              or backup.get("restore_verified") is not True
              or backup.get("alembic_revision_verified") is not True
              or backup.get("checksum_present") is not True
          ):
              raise SystemExit("lock-aware backup was not fully verified")
          for section_name in (
              "production_releases",
              "source_release_artifacts",
              "live_qa_runtime_caches",
          ):
              section = report.get(section_name) or {}
              if (
                  section.get("deleted_count") != 0
                  or section.get("reclaimable_bytes", 0) != 0
              ):
                  raise SystemExit(f"backup-only changed {section_name}")
          transient = report.get("transient") or {}
          for category in (
              "failed_builds",
              "browser_test_artifacts",
              "preprod_screenshots",
          ):
              section = transient.get(category) or {}
              if (
                  section.get("count") != 0
                  or section.get("reclaimable_bytes") != 0
              ):
                  raise SystemExit(f"backup-only changed {category}")
          PY
          public_report="$({
            /usr/bin/python3 -I - "$public_report" <<'PY'
          import json
          import sys

          public = json.loads(sys.argv[1])
          if not isinstance(public, dict) or public.get("mode") != "unknown":
              raise SystemExit("unexpected retention summary mode")
          public["mode"] = "backup-only"
          print(json.dumps(public, sort_keys=True, separators=(",", ":")))
          PY
          } 2>/dev/null)" || {
            echo "Production backup public summary normalization failed" >&2
            exit 1
          }
          test -n "$public_report" || {
            echo "Production backup summary was unavailable" >&2
            exit 1
          }
          printf '%s\n' "$public_report"
          REMOTE
          then
            rm -f -- "$remote_report" "$remote_error"
            echo "Production backup failed" >&2
            exit 1
          fi
          rm -f -- "$remote_report" "$remote_error"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-backup-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-backup-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- \
            "$RUNNER_TEMP/platform-production-backup-report.log" \
            "$RUNNER_TEMP/platform-production-backup-ssh-error.log"
          test ! -e "$RUNNER_TEMP/platform-production-backup-report.log"
          test ! -e "$RUNNER_TEMP/platform-production-backup-ssh-error.log"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"
