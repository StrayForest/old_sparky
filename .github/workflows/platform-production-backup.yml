name: Platform production backup
run-name: "Platform backup/probe ${{ inputs.operation }} s${{ inputs.security_run_id }}.${{ inputs.security_run_attempt }} ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Create/verify a backup or run the isolated scratch authorization probe"
        required: true
        type: choice
        options:
          - create
          - verify-existing
          - authorization-probe
        default: create
      authorization_probe_before_create:
        description: "Run and verify a source-bound scratch authorization probe before create (create only)"
        required: false
        type: boolean
        default: false
      scratch_backend:
        description: "Scratch backend for the new backup restore verification (create only)"
        required: false
        type: choice
        options:
          - tmpfs_v1
          - disk_ext4_image_v1
        default: tmpfs_v1
      security_run_id:
        description: "Exact Platform security and build push run ID for this dev SHA"
        required: true
        type: string
      security_run_attempt:
        description: "Exact attempt for that security run; never substituted"
        required: true
        type: string
      source_sha:
        description: "Exact dev SHA for the helper bundle and workflow dispatch"
        required: true
        type: string
      evict_build_node_cache:
        description: "Explicitly remove the pinned disposable build-Node cache before verifying the newest backup"
        required: false
        type: boolean
        default: false
      compact_fallback_runtime_cache:
        description: "Explicitly compact the pinned legacy live-QA fallback cache before verifying the newest backup"
        required: false
        type: boolean
        default: false
      resume_fallback_cache_compaction:
        description: "Resume an interrupted compaction receipt from this exact source SHA"
        required: false
        type: boolean
        default: false
      resume_compaction_run_id:
        description: "Exact prior backup workflow run ID for compaction recovery"
        required: false
        type: string
      resume_compaction_run_attempt:
        description: "Exact prior backup workflow attempt for compaction recovery"
        required: false
        type: string
      resume_compaction_bundle_sha256:
        description: "Exact prior attested helper bundle digest for compaction recovery"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  backup:
    name: Create restore-verified backup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Require the reviewed dev ref
        shell: bash
        env:
          BACKUP_OPERATION: ${{ inputs.operation }}
          AUTHORIZATION_PROBE_BEFORE_CREATE: ${{ inputs.authorization_probe_before_create }}
          SCRATCH_BACKEND: ${{ inputs.scratch_backend }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production backup must run from the reviewed dev ref" >&2; exit 1; }
          [[ "$AUTHORIZATION_PROBE_BEFORE_CREATE" = true || "$AUTHORIZATION_PROBE_BEFORE_CREATE" = false ]]
          [[ "$SCRATCH_BACKEND" = tmpfs_v1 || "$SCRATCH_BACKEND" = disk_ext4_image_v1 ]]
          if [[ "$SCRATCH_BACKEND" != tmpfs_v1 && "$BACKUP_OPERATION" != create ]]; then
            echo "scratch_backend is only valid for create" >&2
            exit 1
          fi
          if [[ "$AUTHORIZATION_PROBE_BEFORE_CREATE" = true && "$BACKUP_OPERATION" != create ]]; then
            echo "authorization_probe_before_create is only valid for create" >&2
            exit 1
          fi

      - name: Download and verify exact-source backup helper bundle
        if: ${{ inputs.operation == 'create' || inputs.operation == 'verify-existing' || inputs.operation == 'authorization-probe' }}
        id: backup-helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SECURITY_RUN_ID: ${{ inputs.security_run_id }}
          SECURITY_RUN_ATTEMPT: ${{ inputs.security_run_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$REPOSITORY" = "StrayForest/old_sparky" ]]
          [[ "$SECURITY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SECURITY_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" = "$DISPATCH_SHA" ]]
          job_deadline_ns="$(/usr/bin/python3 -I -B -c 'import time; print(time.monotonic_ns() + 6_900_000_000_000)')"
          printf 'job_deadline_monotonic_ns=%s\n' "$job_deadline_ns" >>"$GITHUB_OUTPUT"
          artifact_dir="$RUNNER_TEMP/platform-backup-verifier-input"
          install -d -m 700 "$artifact_dir"
          test "$(stat -c '%F:%a:%h' "$artifact_dir")" = "directory:700:2"
          api="$GITHUB_API_URL/repos/$REPOSITORY"
          run_ready=0
          poll_deadline_ns="$(/usr/bin/python3 -I -B -c 'import time; print(time.monotonic_ns() + 1_800_000_000_000)')"
          poll_remaining_seconds() {
            /usr/bin/python3 -I -B - "$poll_deadline_ns" "$1" <<'PY'
          import sys
          import time

          remaining = (int(sys.argv[1]) - time.monotonic_ns()) / 1_000_000_000
          if remaining <= 0:
              raise SystemExit(1)
          print(f"{min(float(sys.argv[2]), remaining):.6f}")
          PY
          }
          for poll in $(seq 1 360); do
            request_timeout="$(poll_remaining_seconds 5)" || break
            poll_path="$artifact_dir/run-poll-$poll.json"
            test ! -e "$poll_path" && test ! -L "$poll_path"
            curl --fail-with-body --silent --show-error --connect-timeout "$request_timeout" --max-time "$request_timeout" \
              --max-filesize 1048576 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/runs/$SECURITY_RUN_ID" --output "$poll_path"
            poll_state="$(/usr/bin/python3 -I -B - "$poll_path" "$SECURITY_RUN_ID" "$SECURITY_RUN_ATTEMPT" "$SOURCE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          path, expected_run_id, expected_attempt, expected_sha = sys.argv[1:]
          run = json.loads(Path(path).read_text(encoding="utf-8"))
          if (
              not isinstance(run, dict)
              or type(run.get("id")) is not int
              or run.get("id") != int(expected_run_id)
              or type(run.get("run_attempt")) is not int
              or run.get("run_attempt") != int(expected_attempt)
              or run.get("path") != ".github/workflows/platform-security.yml"
              or run.get("event") != "push"
              or run.get("head_branch") != "dev"
              or run.get("head_sha") != expected_sha
          ):
              raise SystemExit("exact security run identity changed or does not match")
          if run.get("status") != "completed":
              if run.get("status") not in {"queued", "in_progress", "pending", "requested", "waiting"}:
                  raise SystemExit("exact security run has an unexpected status")
              print("pending")
          elif run.get("conclusion") == "success":
              print("success")
          else:
              raise SystemExit("exact security run did not complete successfully")
          PY
            )"
            if [[ "$poll_state" = success ]]; then
              poll_remaining_seconds 0.001 >/dev/null || break
              mv -- "$poll_path" "$artifact_dir/run.json"
              run_ready=1
              break
            fi
            rm -f -- "$poll_path"
            sleep_seconds="$(poll_remaining_seconds 5)" || break
            sleep "$sleep_seconds"
          done
          test "$run_ready" = 1 || {
            echo "Exact security run did not finish successfully within the bounded wait" >&2
            exit 1
          }
          curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 10 \
            --max-filesize 65536 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/git/ref/heads/dev" --output "$artifact_dir/dev-ref.json"
          /usr/bin/python3 -I -B - "$artifact_dir/dev-ref.json" "$SOURCE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          ref = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (
              not isinstance(ref, dict)
              or ref.get("ref") != "refs/heads/dev"
              or not isinstance(ref.get("object"), dict)
              or ref["object"].get("sha") != sys.argv[2]
          ):
              raise SystemExit("dev moved away from the exact backup source SHA")
          PY
          source_jobs_ready=0
          previous_job_ids=""
          poll_deadline_ns="$(/usr/bin/python3 -I -B - "$poll_deadline_ns" <<'PY'
          import sys
          import time

          overall_deadline_ns = int(sys.argv[1])
          settle_deadline_ns = time.monotonic_ns() + 900_000_000_000
          print(min(overall_deadline_ns, settle_deadline_ns))
          PY
          )"
          for poll in $(seq 1 360); do
            request_timeout="$(poll_remaining_seconds 10)" || break
            run_poll_path="$artifact_dir/jobs-run-poll-$poll.json"
            jobs_poll_path="$artifact_dir/jobs-poll-$poll.json"
            test ! -e "$run_poll_path" && test ! -L "$run_poll_path"
            test ! -e "$jobs_poll_path" && test ! -L "$jobs_poll_path"
            curl --fail-with-body --silent --show-error --connect-timeout "$request_timeout" --max-time "$request_timeout" \
              --max-filesize 1048576 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/runs/$SECURITY_RUN_ID" --output "$run_poll_path"
            curl --fail-with-body --silent --show-error --connect-timeout "$request_timeout" --max-time "$request_timeout" \
              --max-filesize 1048576 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/runs/$SECURITY_RUN_ID/attempts/$SECURITY_RUN_ATTEMPT/jobs?per_page=100&page=1" --output "$jobs_poll_path"
            poll_result="$(/usr/bin/python3 -I -B - "$run_poll_path" "$jobs_poll_path" "$SECURITY_RUN_ID" "$SECURITY_RUN_ATTEMPT" "$SOURCE_SHA" "$previous_job_ids" <<'PY'
          import json
          from pathlib import Path
          import sys

          run_path, jobs_path, expected_run_id, expected_attempt, expected_sha, previous_job_ids = sys.argv[1:]
          expected_run_id = int(expected_run_id)
          expected_attempt = int(expected_attempt)
          run = json.loads(Path(run_path).read_text(encoding="utf-8"))
          if (
              not isinstance(run, dict)
              or type(run.get("id")) is not int
              or run.get("id") != expected_run_id
              or type(run.get("run_attempt")) is not int
              or run.get("run_attempt") != expected_attempt
              or run.get("path") != ".github/workflows/platform-security.yml"
              or run.get("event") != "push"
              or run.get("head_branch") != "dev"
              or run.get("head_sha") != expected_sha
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
          ):
              raise SystemExit("exact security run identity changed or is not successful")
          payload = json.loads(Path(jobs_path).read_text(encoding="utf-8"))
          jobs = payload.get("jobs") if isinstance(payload, dict) else None
          if (
              not isinstance(jobs, list)
              or type(payload.get("total_count")) is not int
              or payload["total_count"] != len(jobs)
              or not 0 < len(jobs) <= 100
          ):
              raise SystemExit("security jobs response is incomplete")
          seen_ids = set()
          pending_statuses = {"queued", "in_progress", "requested", "waiting", "pending"}
          has_pending = False
          producer_rows = []
          for row in jobs:
              if not isinstance(row, dict):
                  raise SystemExit("security job row is malformed")
              job_id = row.get("id")
              if type(job_id) is not int or job_id <= 0 or job_id in seen_ids:
                  raise SystemExit("security job IDs are malformed or duplicate")
              seen_ids.add(job_id)
              if type(row.get("run_id")) is not int or row["run_id"] != expected_run_id:
                  raise SystemExit("security job belongs to a different workflow run")
              if "run_attempt" in row and (
                  type(row["run_attempt"]) is not int or row["run_attempt"] != expected_attempt
              ):
                  raise SystemExit("security job belongs to a different run attempt")
              if "head_sha" in row and (
                  not isinstance(row["head_sha"], str) or row["head_sha"] != expected_sha
              ):
                  raise SystemExit("security job belongs to a different source SHA")
              status = row.get("status")
              conclusion = row.get("conclusion")
              if not isinstance(status, str):
                  raise SystemExit("security job status is malformed")
              if status in pending_statuses:
                  if "conclusion" not in row or conclusion is not None:
                      raise SystemExit("nonterminal security job has a terminal conclusion")
                  has_pending = True
              elif (
                  status != "completed"
                  or not isinstance(conclusion, str)
                  or conclusion not in {"success", "skipped"}
              ):
                  raise SystemExit("security job did not reach an allowed terminal result")
              if row.get("name") == "Verification contract":
                  producer_rows.append(row)
          if len(producer_rows) != 1:
              raise SystemExit("exact verification-contract job is missing or ambiguous")
          current_job_ids = ",".join(str(job_id) for job_id in sorted(seen_ids))
          if previous_job_ids and current_job_ids != previous_job_ids:
              raise SystemExit("exact security attempt job set changed during polling")
          producer = producer_rows[0]
          if (
              type(producer.get("run_attempt")) is not int
              or producer["run_attempt"] != expected_attempt
              or producer.get("head_sha") != expected_sha
          ):
              raise SystemExit("verification-contract job identity is not exact")
          if producer.get("status") == "completed" and producer.get("conclusion") != "success":
              raise SystemExit("exact verification-contract job did not succeed")
          print(("pending" if has_pending else "success") + ":" + current_job_ids)
          PY
            )"
            poll_state="${poll_result%%:*}"
            previous_job_ids="${poll_result#*:}"
            if [[ "$poll_state" = success ]]; then
              poll_remaining_seconds 0.001 >/dev/null || break
              mv -- "$run_poll_path" "$artifact_dir/run.json"
              mv -- "$jobs_poll_path" "$artifact_dir/jobs.json"
              source_jobs_ready=1
              break
            fi
            if (( poll == 1 || poll % 4 == 0 )); then
              echo "Exact Security attempt jobs remain nonterminal; waiting within the bounded settle window."
            fi
            rm -f -- "$run_poll_path" "$jobs_poll_path"
            sleep_seconds="$(poll_remaining_seconds 15)" || break
            sleep "$sleep_seconds"
          done
          test "$source_jobs_ready" = 1 || {
            echo "Exact Security attempt jobs did not reach allowed terminal results within the bounded wait" >&2
            exit 1
          }
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$SECURITY_RUN_ID/artifacts?per_page=100&page=1" --output "$artifact_dir/artifacts.json"
          /usr/bin/python3 -I -B - "$artifact_dir" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          run_id = os.environ["SECURITY_RUN_ID"]
          attempt = int(os.environ["SECURITY_RUN_ATTEMPT"])
          source_sha = os.environ["SOURCE_SHA"]
          dispatch_sha = os.environ["DISPATCH_SHA"]
          if source_sha != dispatch_sha:
              raise SystemExit("backup helper source must equal the reviewed dispatch SHA")
          run = json.loads((root / "run.json").read_text(encoding="utf-8"))
          if (
              not isinstance(run, dict)
              or run.get("id") != int(run_id)
              or run.get("run_attempt") != attempt
              or run.get("path") != ".github/workflows/platform-security.yml"
              or run.get("event") != "push"
              or run.get("head_branch") != "dev"
              or run.get("head_sha") != source_sha
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
          ):
              raise SystemExit("security source run identity is not exact and successful")
          jobs_payload = json.loads((root / "jobs.json").read_text(encoding="utf-8"))
          jobs = jobs_payload.get("jobs") if isinstance(jobs_payload, dict) else None
          if (
              not isinstance(jobs, list)
              or type(jobs_payload.get("total_count")) is not int
              or jobs_payload["total_count"] != len(jobs)
              or not 0 < len(jobs) <= 100
          ):
              raise SystemExit("security jobs response is incomplete")
          producer_jobs = [
              row for row in jobs
              if isinstance(row, dict)
              and row.get("name") == "Verification contract"
              and row.get("run_id") == int(run_id)
              and row.get("run_attempt") == attempt
              and row.get("head_sha") == source_sha
              and row.get("status") == "completed"
              and row.get("conclusion") == "success"
              and type(row.get("id")) is int
              and row["id"] > 0
          ]
          if len(producer_jobs) != 1:
              raise SystemExit("exact successful verification-contract job is missing")
          artifact_name = f"platform-backup-verifier-{run_id}-{attempt}"
          artifact_payload = json.loads((root / "artifacts.json").read_text(encoding="utf-8"))
          artifacts = artifact_payload.get("artifacts") if isinstance(artifact_payload, dict) else None
          if (
              not isinstance(artifacts, list)
              or type(artifact_payload.get("total_count")) is not int
              or artifact_payload["total_count"] != len(artifacts)
              or not 0 <= len(artifacts) <= 100
          ):
              raise SystemExit("security artifacts response is incomplete")
          matches = [
              row for row in artifacts
              if isinstance(row, dict)
              and row.get("name") == artifact_name
              and row.get("expired") is False
              and type(row.get("id")) is int
              and row["id"] > 0
              and type(row.get("size_in_bytes")) is int
              and 0 < row["size_in_bytes"] <= 10 * 1024 * 1024
              and isinstance(row.get("workflow_run"), dict)
              and row["workflow_run"].get("id") == int(run_id)
              and row["workflow_run"].get("head_sha") == source_sha
              and ("run_attempt" not in row["workflow_run"] or row["workflow_run"].get("run_attempt") == attempt)
              and re.fullmatch(r"sha256:[0-9a-f]{64}", str(row.get("digest", ""))) is not None
          ]
          if len(matches) != 1:
              raise SystemExit("exact backup helper artifact is missing or ambiguous")
          with output.open("a", encoding="ascii") as stream:
              stream.write(f"artifact_id={matches[0]['id']}\n")
              stream.write(f"artifact_digest={matches[0]['digest'].removeprefix('sha256:')}\n")
              stream.write(f"artifact_size={matches[0]['size_in_bytes']}\n")
              stream.write(f"artifact_name={artifact_name}\n")
              stream.write(f"producer_job_id={producer_jobs[0]['id']}\n")
          PY
          artifact_id="$(awk -F= '$1 == "artifact_id" {print $2}' "$GITHUB_OUTPUT")"
          artifact_digest="$(awk -F= '$1 == "artifact_digest" {print $2}' "$GITHUB_OUTPUT")"
          artifact_size="$(awk -F= '$1 == "artifact_size" {print $2}' "$GITHUB_OUTPUT")"
          [[ "$artifact_id" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]
          [[ "$artifact_size" =~ ^[1-9][0-9]{0,8}$ ]]
          curl --fail-with-body --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors \
            --max-filesize 10485760 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/artifacts/$artifact_id/zip" --output "$artifact_dir/outer.zip"
          test "$(sha256sum "$artifact_dir/outer.zip" | awk '{print $1}')" = "$artifact_digest"
          test "$(stat -c '%s' "$artifact_dir/outer.zip")" = "$artifact_size"
          /usr/bin/python3 -I -B - "$artifact_dir" "$SOURCE_SHA" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import sys
          import zipfile

          root = Path(sys.argv[1])
          source_sha = sys.argv[2]
          output = Path(sys.argv[3])
          outer = root / "outer.zip"
          with zipfile.ZipFile(outer) as archive:
              infos = archive.infolist()
              if len(infos) != 1:
                  raise SystemExit("backup verifier artifact is not a closed single-file archive")
              info = infos[0]
              mode = (info.external_attr >> 16) & 0o177777
              if (
                  info.filename != "platform-backup-verifier.zip"
                  or info.create_system != 3
                  or info.is_dir()
                  or not stat.S_ISREG(mode)
                  or stat.S_IMODE(mode) & 0o022
                  or info.flag_bits & 0x1
                  or info.file_size > 10 * 1024 * 1024
                  or info.compress_size > 10 * 1024 * 1024
              ):
                  raise SystemExit("backup verifier artifact member is unsafe")
              data = archive.read(info)
              if len(data) != info.file_size:
                  raise SystemExit("backup verifier artifact size mismatch")
          target = root / "platform-backup-verifier.zip"
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(descriptor, "wb") as handle:
              handle.write(data)
              handle.flush()
              os.fsync(handle.fileno())
              opened = os.fstat(handle.fileno())
              if not stat.S_ISREG(opened.st_mode) or opened.st_uid != os.getuid() or opened.st_nlink != 1 or stat.S_IMODE(opened.st_mode) != 0o600 or opened.st_size != len(data):
                  raise SystemExit("backup verifier bundle staging metadata is invalid")
          digest = hashlib.sha256(data).hexdigest()
          attestation_path = root / "attestation.json"
          with output.open("a", encoding="ascii") as stream:
              stream.write(f"bundle_path={target}\n")
              stream.write(f"bundle_sha256={digest}\n")
              stream.write(f"attestation_path={attestation_path}\n")
          PY
          bundle_path="$artifact_dir/platform-backup-verifier.zip"
          before="$(stat -c '%d:%i:%h:%s:%u:%g:%a' "$bundle_path")"
          bundle_sha="$(sha256sum "$bundle_path" | awk '{print $1}')"
          test "$bundle_sha" = "$(awk -F= '$1 == "bundle_sha256" {print $2}' "$GITHUB_OUTPUT")"
          timeout --signal=TERM --kill-after=15s 600s gh attestation verify "$bundle_path" \
            --repo "$REPOSITORY" \
            --signer-workflow StrayForest/old_sparky/.github/workflows/platform-security.yml \
            --source-ref refs/heads/dev \
            --source-digest "$SOURCE_SHA" \
            --format json > "$artifact_dir/attestation.json"
          after="$(stat -c '%d:%i:%h:%s:%u:%g:%a' "$bundle_path")"
          test "$before" = "$after"
          test "$(sha256sum "$bundle_path" | awk '{print $1}')" = "$bundle_sha"
          /usr/bin/python3 -I -B - "$artifact_dir/attestation.json" "$bundle_sha" "$SECURITY_RUN_ID" "$SECURITY_RUN_ATTEMPT" "$SOURCE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          attestation_path = Path(sys.argv[1])
          if attestation_path.stat().st_size > 2 * 1024 * 1024:
              raise SystemExit("attestation output exceeds its fixed bound")
          values = json.loads(attestation_path.read_text(encoding="utf-8"))
          digest, run_id, attempt, source_sha = sys.argv[2:]
          expected_build = "https://github.com/StrayForest/old_sparky/.github/workflows/platform-security.yml@refs/heads/dev"
          expected_repo = "https://github.com/StrayForest/old_sparky"
          expected_runner = f"https://github.com/StrayForest/old_sparky/actions/runs/{run_id}/attempts/{attempt}"
          if not isinstance(values, list) or not values:
              raise SystemExit("attestation output is empty")
          policy_checks = (
              "issuer",
              "source_repository",
              "source_ref",
              "source_digest",
              "build_config",
              "build_signer",
              "run_invocation",
              "subject_count",
              "subject_digest",
          )
          best_diagnostic = None
          for item in values[:256]:
              result = item.get("verificationResult") if isinstance(item, dict) else None
              signature = result.get("signature") if isinstance(result, dict) else None
              certificate = signature.get("certificate") if isinstance(signature, dict) else None
              statement = result.get("statement") if isinstance(result, dict) else None
              subjects = statement.get("subject") if isinstance(statement, dict) else None
              checks = {
                  "issuer": isinstance(certificate, dict)
                  and certificate.get("issuer") == "https://token.actions.githubusercontent.com",
                  "source_repository": isinstance(certificate, dict)
                  and certificate.get("sourceRepositoryURI") == expected_repo,
                  "source_ref": isinstance(certificate, dict)
                  and certificate.get("sourceRepositoryRef") == "refs/heads/dev",
                  "source_digest": isinstance(certificate, dict)
                  and certificate.get("sourceRepositoryDigest") == source_sha,
                  "build_config": isinstance(certificate, dict)
                  and certificate.get("buildConfigURI") == expected_build,
                  "build_signer": isinstance(certificate, dict)
                  and certificate.get("buildSignerURI") == expected_build,
                  "run_invocation": isinstance(certificate, dict)
                  and certificate.get("runInvocationURI") == expected_runner,
                  "subject_count": isinstance(subjects, list) and len(subjects) == 1,
                  "subject_digest": isinstance(subjects, list)
                  and len(subjects) == 1
                  and isinstance(subjects[0], dict)
                  and isinstance(subjects[0].get("digest"), dict)
                  and subjects[0]["digest"].get("sha256") == digest,
              }
              if all(checks.values()):
                  break
              certificate_shape = (
                  "invalid"
                  if not isinstance(certificate, dict)
                  else "extensions"
                  if isinstance(certificate.get("extensions"), dict)
                  else "flat"
              )
              candidate = {
                  "shape": certificate_shape,
                  "checks": checks,
                  "score": sum(bool(value) for value in checks.values()),
              }
              if best_diagnostic is None or candidate["score"] > best_diagnostic["score"]:
                  best_diagnostic = candidate
          else:
              diagnostic = {
                  "schema": 1,
                  "kind": "backup_attestation_policy_diagnostic",
                  "status": "mismatch",
                  "source_sha": source_sha,
                  "run_id": run_id,
                  "run_attempt": attempt,
                  "bundle_sha256": digest,
                  "candidate_count": min(len(values), 256),
                  "candidate_count_capped": len(values) > 256,
                  "certificate_shape": (
                      "invalid" if best_diagnostic is None else best_diagnostic["shape"]
                  ),
                  "checks": (
                      {name: False for name in policy_checks}
                      if best_diagnostic is None
                      else best_diagnostic["checks"]
                  ),
              }
              print(json.dumps(diagnostic, sort_keys=True, separators=(",", ":")), file=sys.stderr)
              raise SystemExit("backup verifier attestation policy failed")
          PY
          /usr/bin/python3 -I -B - "$bundle_path" "$SOURCE_SHA" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import stat
          import sys
          import zipfile

          bundle_path = Path(sys.argv[1])
          source_sha = sys.argv[2]
          output = Path(sys.argv[3])
          expected_names = (
              "platform_backup_restore_drill.py",
              "platform_disk_policy.py",
              "platform_live_qa_guard.py",
              "platform_live_qa_machine_lock.py",
              "platform_release_retention.py",
              "platform_build_node_cache.py",
              "platform_storage_maintenance.py",
              "platform_storage_evidence_summary.py",
          )
          expected_source_modes = {
              "platform_backup_restore_drill.py": 0o755,
              "platform_disk_policy.py": 0o644,
              "platform_live_qa_guard.py": 0o755,
              "platform_live_qa_machine_lock.py": 0o644,
              "platform_release_retention.py": 0o755,
              "platform_build_node_cache.py": 0o644,
              "platform_storage_maintenance.py": 0o755,
              "platform_storage_evidence_summary.py": 0o644,
          }
          with zipfile.ZipFile(bundle_path) as archive:
              infos = archive.infolist()
              expected_paths = {f"platform-backup-verifier/{name}" for name in expected_names}
              expected_paths.add("platform-backup-verifier/manifest.json")
              if len(infos) != len(expected_paths) or {item.filename for item in infos} != expected_paths:
                  raise SystemExit("backup verifier bundle inventory is not closed")
              by_name = {item.filename: item for item in infos}
              manifest_info = by_name["platform-backup-verifier/manifest.json"]
              manifest_mode = (manifest_info.external_attr >> 16) & 0o177777
              if not stat.S_ISREG(manifest_mode) or stat.S_IMODE(manifest_mode) != 0o444 or manifest_info.file_size > 65536:
                  raise SystemExit("backup verifier manifest metadata is invalid")
              manifest = json.loads(archive.read(manifest_info).decode("ascii"))
              if set(manifest) != {"schema", "repository", "source_sha", "files"} or manifest.get("schema") != 1 or manifest.get("repository") != "StrayForest/old_sparky" or manifest.get("source_sha") != source_sha:
                  raise SystemExit("backup verifier manifest binding is invalid")
              rows = manifest.get("files")
              if not isinstance(rows, list) or len(rows) != len(expected_names):
                  raise SystemExit("backup verifier manifest rows are invalid")
              seen = set()
              for row in rows:
                  if not isinstance(row, dict) or set(row) != {"path", "source_mode", "size", "sha256"}:
                      raise SystemExit("backup verifier manifest row is not closed")
                  path = row.get("path")
                  name = path.removeprefix("platform/tools/") if isinstance(path, str) else ""
                  if name not in expected_names or name in seen or row.get("source_mode") != expected_source_modes.get(name) or type(row.get("size")) is not int or row["size"] <= 0 or re.fullmatch(r"[0-9a-f]{64}", str(row.get("sha256", ""))) is None:
                      raise SystemExit("backup verifier manifest row binding is invalid")
                  seen.add(name)
                  item = by_name[f"platform-backup-verifier/{name}"]
                  mode = (item.external_attr >> 16) & 0o177777
                  data = archive.read(item)
                  if not stat.S_ISREG(mode) or stat.S_IMODE(mode) != 0o444 or len(data) != row["size"] or hashlib.sha256(data).hexdigest() != row["sha256"]:
                      raise SystemExit("backup verifier member bytes or mode differ from manifest")
          if seen != set(expected_names):
              raise SystemExit("backup verifier member set differs from manifest")
          with zipfile.ZipFile(bundle_path) as archive:
              manifest = json.loads(
                  archive.read("platform-backup-verifier/manifest.json").decode("ascii")
              )
          member_sha = {
              row["path"].removeprefix("platform/tools/"): row["sha256"]
              for row in manifest["files"]
          }
          with output.open("a", encoding="ascii") as stream:
              stream.write(
                  f"storage_helper_sha256={member_sha['platform_storage_maintenance.py']}\n"
              )
              stream.write(
                  f"backup_drill_sha256={member_sha['platform_backup_restore_drill.py']}\n"
              )
          PY

      - name: Validate production SSH inputs
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured" >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-backup-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-backup-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
          fi
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            ssh_scan_rc=0
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null; then
              :
            else
              ssh_scan_rc=$?
            fi
            if (( ssh_scan_rc == 0 )) \
              && awk -v host="$PROD_SSH_HOST" '/^[[:space:]]*($|#)/ { next } { records++; if (NF == 3 && $1 == host && $2 == "ssh-ed25519") { valid=1; next } { invalid=1 } } END { exit !(records == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            ssh_scan_line_count="$(awk 'END {print NR + 0}' "$ssh_scan_attempt")"
            read -r ssh_scan_record_count ssh_scan_host_token_valid ssh_scan_key_type_valid < <(
              awk -v host="$PROD_SSH_HOST" '
                /^[[:space:]]*($|#)/ { next }
                {
                  records++
                  if (NF != 3 || $1 != host) host_invalid=1
                  if (NF != 3 || $2 != "ssh-ed25519") type_invalid=1
                }
                END { printf "%d %d %d\n", records + 0, (records == 1 && !host_invalid), (records == 1 && !type_invalid) }
              ' "$ssh_scan_attempt"
            )
            ssh_scan_fingerprint_match=0
            if (( ssh_scan_record_count == 1 )); then
              ssh_scan_fingerprint="$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}' || true)"
              if [[ "$ssh_scan_fingerprint" == "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" ]]; then
                ssh_scan_fingerprint_match=1
              fi
            fi
            printf 'SSH_KEYSCAN_DIAGNOSTIC rc=%s lines=%s records=%s host_token_valid=%s key_type_valid=%s fingerprint_match=%s\n' \
              "$ssh_scan_rc" "$ssh_scan_line_count" "$ssh_scan_record_count" "$ssh_scan_host_token_valid" "$ssh_scan_key_type_valid" "$ssh_scan_fingerprint_match" >&2
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' "SSH_DIR=$ssh_dir"
          } >> "$GITHUB_ENV"

      - name: Stage the verified helper bundle on the production host
        if: ${{ inputs.operation == 'create' || inputs.operation == 'verify-existing' || inputs.operation == 'authorization-probe' }}
        id: stage-backup-helper
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          BUNDLE_PATH: ${{ steps.backup-helper.outputs.bundle_path }}
          BUNDLE_SHA256: ${{ steps.backup-helper.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$BUNDLE_PATH" = "$RUNNER_TEMP/platform-backup-verifier-input/platform-backup-verifier.zip" ]]
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REPOSITORY" = "StrayForest/old_sparky" ]]
          [[ "$SOURCE_SHA" = "$GITHUB_SHA" ]]
          ref_path="$RUNNER_TEMP/platform-backup-verifier-input/current-dev-ref.json"
          curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 10 \
            --max-filesize 65536 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/git/ref/heads/dev" --output "$ref_path"
          /usr/bin/python3 -I -B - "$ref_path" "$SOURCE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys

          ref = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (
              not isinstance(ref, dict)
              or ref.get("ref") != "refs/heads/dev"
              or not isinstance(ref.get("object"), dict)
              or ref["object"].get("sha") != sys.argv[2]
          ):
              raise SystemExit("dev moved before the source-bound helper was staged")
          PY
          test "$(stat -c '%F:%a:%h' "$BUNDLE_PATH")" = "regular file:600:1"
          test "$(sha256sum "$BUNDLE_PATH" | awk '{print $1}')" = "$BUNDLE_SHA256"
          stage="/tmp/oldsparky-backup-verifier-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stage_identity=""
          cleanup_failed_transfer() {
            exit_code=$?
            trap - EXIT
            if (( exit_code != 0 )) && [[ "$stage_identity" =~ ^[0-9]+:[0-9]+$ ]]; then
              timeout --foreground --signal=TERM --kill-after=5s 60s ssh \
                -F /dev/null \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
                -o ServerAliveInterval=10 \
                -o ServerAliveCountMax=3 \
                -o ConnectTimeout=10 \
                -i "$SSH_DIR/id_ed25519" \
                "$PROD_SSH_USER@$PROD_SSH_HOST" \
                "bash -s -- $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $stage_identity" <<'REMOTE' >/dev/null 2>&1 || true
          set -Eeuo pipefail
          run_id="${1:-}"
          run_attempt="${2:-}"
          expected_identity="${3:-}"
          [[ "$run_id" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$run_attempt" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$expected_identity" =~ ^[0-9]+:[0-9]+$ ]]
          test "$(id -u)" -eq 0
          prepare_stage_lock() {
            local lock_parent=/run/lock
            local lock_dir=$lock_parent/oldsparky-backup-verifier-stage
            local lock_file="$lock_dir/operation.lock"
            test ! -L "$lock_parent"
            test -d "$lock_parent"
            test "$(stat -c '%u:%g:%a' "$lock_parent")" = "0:0:1777"
            if [[ ! -e "$lock_dir" && ! -L "$lock_dir" ]]; then
              mkdir -m 755 -- "$lock_dir" 2>/dev/null && chmod 755 -- "$lock_dir" || :
            fi
            test ! -L "$lock_dir"
            test "$(stat -c '%F:%u:%g:%a:%h' "$lock_dir")" = "directory:0:0:755:2"
            if [[ ! -e "$lock_file" && ! -L "$lock_file" ]]; then
              (umask 022; set -o noclobber; : >"$lock_file") 2>/dev/null || :
            fi
            test ! -L "$lock_file"
            test -f "$lock_file"
            test "$(stat -c '%u:%g:%a:%h' "$lock_file")" = "0:0:644:1"
            local lock_identity
            lock_identity="$(stat -c '%d:%i:%u:%g:%a:%h' "$lock_file")"
            exec 7>>"$lock_file"
            test "$(stat -Lc '%d:%i:%u:%g:%a:%h' "/proc/$$/fd/7")" = "$lock_identity"
            test "$(stat -c '%d:%i:%u:%g:%a:%h' "$lock_file")" = "$lock_identity"
            flock -w 45 7
          }
          prepare_stage_lock
          stage="/tmp/oldsparky-backup-verifier-${run_id}-${run_attempt}"
          /usr/bin/python3 -I -B - "$stage" "$expected_identity" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys

          path = Path(sys.argv[1])
          expected = tuple(int(item) for item in sys.argv[2].split(":"))
          try:
              before = path.lstat()
          except FileNotFoundError:
              raise SystemExit(0)
          if not stat.S_ISDIR(before.st_mode) or (before.st_dev, before.st_ino) != expected or before.st_uid != 0 or before.st_gid != 0 or stat.S_IMODE(before.st_mode) != 0o700 or before.st_nlink != 2:
              raise SystemExit(1)
          entries = list(path.iterdir())
          if len(entries) > 1 or any(entry.name != "bundle.zip" for entry in entries):
              raise SystemExit(1)
          if entries:
              bundle = entries[0]
              item = bundle.lstat()
              if not stat.S_ISREG(item.st_mode) or item.st_uid != 0 or item.st_gid != 0 or item.st_nlink != 1 or stat.S_IMODE(item.st_mode) != 0o600:
                  raise SystemExit(1)
              bundle.unlink()
          current = path.lstat()
          if (current.st_dev, current.st_ino) != expected or list(path.iterdir()):
              raise SystemExit(1)
          path.rmdir()
          directory_fd = os.open("/tmp", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              os.fsync(directory_fd)
          finally:
              os.close(directory_fd)
          PY
          REMOTE
            fi
            exit "$exit_code"
          }
          trap cleanup_failed_transfer EXIT
          stage_identity="$(timeout --foreground --signal=TERM --kill-after=5s 60s ssh \
            -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -c 'set -Eeuo pipefail
          run_id=\$1
          run_attempt=\$2
          bundle_sha=\$3
          [[ \"\$run_id\" =~ ^[1-9][0-9]{0,19}\$ ]]
          [[ \"\$run_attempt\" =~ ^[1-9][0-9]{0,5}\$ ]]
          [[ \"\$bundle_sha\" =~ ^[0-9a-f]{64}\$ ]]
          test \"\$(id -u)\" -eq 0
          prepare_stage_lock() {
            local lock_parent=/run/lock
            local lock_dir=\$lock_parent/oldsparky-backup-verifier-stage
            local lock_file=\"\$lock_dir/operation.lock\"
            test ! -L "\$lock_parent"
            test -d "\$lock_parent"
            test \"\$(stat -c %u:%g:%a \"\$lock_parent\")\" = 0:0:1777
            if [[ ! -e "\$lock_dir" && ! -L "\$lock_dir" ]]; then mkdir -m 755 -- "\$lock_dir" 2>/dev/null && chmod 755 -- "\$lock_dir" || :; fi
            test ! -L "\$lock_dir"
            test -d "\$lock_dir"
            test \"\$(stat -c %u:%g:%a:%h \"\$lock_dir\")\" = 0:0:755:2
            if [[ ! -e "\$lock_file" && ! -L "\$lock_file" ]]; then (umask 022; set -o noclobber; : >"\$lock_file") 2>/dev/null || :; fi
            test ! -L "\$lock_file"
            test -f "\$lock_file"
            test \"\$(stat -c %u:%g:%a:%h \"\$lock_file\")\" = 0:0:644:1
            local lock_identity
            lock_identity=\$(stat -c %d:%i:%u:%g:%a:%h \"\$lock_file\")
            exec 7>>\"\$lock_file\"
            test \"\$(stat -Lc %d:%i:%u:%g:%a:%h /proc/\$\$/fd/7)\" = \"\$lock_identity\"
            test \"\$(stat -c %d:%i:%u:%g:%a:%h \"\$lock_file\")\" = "\$lock_identity"
            flock -w 45 7
          }
          prepare_stage_lock
          stage=\"/tmp/oldsparky-backup-verifier-\$run_id-\$run_attempt\"
          [[ ! -e \"\$stage\" && ! -L \"\$stage\" ]]
          mkdir -m 700 -- \"\$stage\"
          test \"\$(stat -c \"%F:%u:%g:%a:%h\" \"\$stage\")\" = \"directory:0:0:700:2\"
          cat >\"\$stage/bundle.zip\"
          chmod 600 -- \"\$stage/bundle.zip\"
          test \"\$(stat -c \"%F:%u:%g:%a:%h\" \"\$stage/bundle.zip\")\" = \"regular file:0:0:600:1\"
          test \"\$(sha256sum \"\$stage/bundle.zip\" | awk \"{print \\\$1}\")\" = \"\$bundle_sha\"
          stat -c \"%d:%i\" \"\$stage\"
          ' -- $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $BUNDLE_SHA256" <"$BUNDLE_PATH")"
          [[ "$stage_identity" =~ ^[0-9]+:[0-9]+$ ]]
          trap - EXIT
          printf 'stage_identity=%s\n' "$stage_identity" >>"$GITHUB_OUTPUT"

      - name: Create/verify backup or run authorization probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          BACKUP_OPERATION: ${{ inputs.operation }}
          AUTHORIZATION_PROBE_BEFORE_CREATE: ${{ inputs.authorization_probe_before_create }}
          SCRATCH_BACKEND: ${{ inputs.scratch_backend }}
          EVICT_BUILD_NODE_CACHE: ${{ inputs.evict_build_node_cache }}
          COMPACT_FALLBACK_RUNTIME_CACHE: ${{ inputs.compact_fallback_runtime_cache }}
          RESUME_FALLBACK_CACHE_COMPACTION: ${{ inputs.resume_fallback_cache_compaction }}
          RESUME_COMPACTION_RUN_ID: ${{ inputs.resume_compaction_run_id }}
          RESUME_COMPACTION_RUN_ATTEMPT: ${{ inputs.resume_compaction_run_attempt }}
          RESUME_COMPACTION_BUNDLE_SHA256: ${{ inputs.resume_compaction_bundle_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SECURITY_RUN_ID: ${{ inputs.security_run_id }}
          SECURITY_RUN_ATTEMPT: ${{ inputs.security_run_attempt }}
          BUNDLE_SHA256: ${{ steps.backup-helper.outputs.bundle_sha256 }}
          EXPECTED_STORAGE_HELPER_SHA256: ${{ steps.backup-helper.outputs.storage_helper_sha256 }}
          EXPECTED_BACKUP_DRILL_SHA256: ${{ steps.backup-helper.outputs.backup_drill_sha256 }}
          JOB_DEADLINE_MONOTONIC_NS: ${{ steps.backup-helper.outputs.job_deadline_monotonic_ns }}
          STAGED_HELPER_IDENTITY: ${{ steps.stage-backup-helper.outputs.stage_identity }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$BACKUP_OPERATION" = create || "$BACKUP_OPERATION" = verify-existing || "$BACKUP_OPERATION" = authorization-probe ]]
          [[ "$AUTHORIZATION_PROBE_BEFORE_CREATE" = true || "$AUTHORIZATION_PROBE_BEFORE_CREATE" = false ]]
          [[ "$SCRATCH_BACKEND" = tmpfs_v1 || "$SCRATCH_BACKEND" = disk_ext4_image_v1 ]]
          if [[ "$SCRATCH_BACKEND" != tmpfs_v1 && "$BACKUP_OPERATION" != create ]]; then
            echo "scratch_backend is only valid for create" >&2
            exit 1
          fi
          if [[ "$AUTHORIZATION_PROBE_BEFORE_CREATE" = true && "$BACKUP_OPERATION" != create ]]; then
            echo "authorization_probe_before_create is only valid for create" >&2
            exit 1
          fi
          [[ "$EVICT_BUILD_NODE_CACHE" = true || "$EVICT_BUILD_NODE_CACHE" = false ]]
          [[ "$COMPACT_FALLBACK_RUNTIME_CACHE" = true || "$COMPACT_FALLBACK_RUNTIME_CACHE" = false ]]
          [[ "$RESUME_FALLBACK_CACHE_COMPACTION" = true || "$RESUME_FALLBACK_CACHE_COMPACTION" = false ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
