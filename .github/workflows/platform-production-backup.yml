              expected_fields = {
                  "schema", "kind", "status", "workflow_run_id", "workflow_run_attempt",
                  "security_run_id", "security_run_attempt", "source_sha", "helper_bundle_sha256",
                  "cleanup_status",
              }
              if "first_fault" in expected_receipt:
                  expected_fields.add("first_fault")
              if (
                  not isinstance(parsed, dict)
                  or set(parsed) != expected_fields
                  or type(parsed.get("schema")) is not int
                  or parsed.get("schema") != 1
                  or type(parsed.get("kind")) is not str
                  or parsed.get("kind") != "authorization_probe_receipt"
                  or type(parsed.get("status")) is not str
                  or parsed.get("status") not in {"completed", "failed"}
                  or type(parsed.get("cleanup_status")) is not str
                  or parsed.get("cleanup_status") not in {"confirmed", "failed", "unknown"}
                  or any(type(parsed.get(field)) is not str for field in (
                      "workflow_run_id", "workflow_run_attempt", "security_run_id",
                      "security_run_attempt", "source_sha", "helper_bundle_sha256",
                  ))
                  or ("first_fault" in parsed and not valid_first_fault(parsed["first_fault"]))
                  or parsed != expected_receipt
                  or encoded != expected_bytes
              ):
                  raise ValueError
              return encoded

          def read_back_owned_diagnostic(shared_fd, filename, identity, expected_bytes, expected_diagnostic):
              before = os.stat(filename, dir_fd=shared_fd, follow_symlinks=False)
              if (
                  not stat.S_ISREG(before.st_mode)
                  or before.st_uid != 0
                  or before.st_gid != 0
                  or stat.S_IMODE(before.st_mode) != 0o600
                  or before.st_nlink != 1
                  or before.st_size != len(expected_bytes)
                  or (before.st_dev, before.st_ino) != identity
              ):
                  raise OSError
              descriptor = os.open(filename, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW, dir_fd=shared_fd)
              try:
                  opened = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(opened.st_mode)
                      or opened.st_uid != 0
                      or opened.st_gid != 0
                      or stat.S_IMODE(opened.st_mode) != 0o600
                      or opened.st_nlink != 1
                      or (opened.st_dev, opened.st_ino, opened.st_size)
                      != (identity[0], identity[1], len(expected_bytes))
                  ):
                      raise OSError
                  payload = bytearray()
                  while len(payload) <= len(expected_bytes):
                      block = os.read(descriptor, min(4096, len(expected_bytes) + 1 - len(payload)))
                      if not block:
                          break
                      payload.extend(block)
                  finished = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              after = os.stat(filename, dir_fd=shared_fd, follow_symlinks=False)
              fields = lambda value: (
                  value.st_dev, value.st_ino, value.st_mode, value.st_uid, value.st_gid,
                  value.st_nlink, value.st_size, value.st_mtime_ns, value.st_ctime_ns,
              )
              if (
                  bytes(payload) != expected_bytes
                  or fields(finished) != fields(before)
                  or fields(after) != fields(before)
                  or json.loads(bytes(payload).decode("ascii"), object_pairs_hook=reject_duplicate_keys) != expected_diagnostic
              ):
                  raise OSError

          def persist_probe_diagnostic(shared_path, run_id, run_attempt, security_id, security_attempt,
                                       source_sha, bundle_sha, stage, cleanup_status, operation_exit,
                                       first_fault, host_guard):
              if (
                  re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is None
                  or re.fullmatch(r"[1-9][0-9]{0,5}", run_attempt) is None
                  or re.fullmatch(r"[1-9][0-9]{0,19}", security_id) is None
                  or re.fullmatch(r"[1-9][0-9]{0,5}", security_attempt) is None
                  or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None
                  or re.fullmatch(r"[0-9a-f]{64}", bundle_sha) is None
                  or stage not in {"validated_failure", "report_frame_validation", "authorization_receipt_custody"}
                  or cleanup_status not in {"confirmed", "failed", "unknown"}
                  or (operation_exit is not None and (type(operation_exit) is not int or not 0 <= operation_exit <= 255))
                  or (first_fault is not None and not valid_first_fault(first_fault))
                  or (host_guard is not None and not valid_host_guard(host_guard))
              ):
                  raise ValueError
              diagnostic = {
                  "schema": 1,
                  "kind": "authorization_probe_diagnostic",
                  "status": "failed" if stage == "validated_failure" else "unknown",
                  "workflow_run_id": run_id,
                  "workflow_run_attempt": run_attempt,
                  "security_run_id": security_id,
                  "security_run_attempt": security_attempt,
                  "source_sha": source_sha,
                  "helper_bundle_sha256": bundle_sha,
                  "stage": stage,
                  "cleanup_status": cleanup_status,
                  "probe_operation_exit_code": operation_exit,
                  "helper_exit_code": None,
                  "ssh_exit_code": None,
                  "first_fault": first_fault,
                  "scratch_host_guard_diagnostic": host_guard,
              }
              encoded = (json.dumps(diagnostic, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
              if len(encoded) > 4096:
                  raise ValueError
              shared_fd, shared_identity = verify_shared_parent(shared_path)
              try:
                  filename = f"authorization-probe-diagnostic-{run_id}-{run_attempt}.json"
                  identity = write_closed_file(shared_fd, filename, encoded)
                  os.fsync(shared_fd)
                  verify_shared_parent_identity(shared_fd, shared_path, shared_identity)
                  verify_owned_entry(shared_fd, filename, identity, len(encoded))
                  read_back_owned_diagnostic(shared_fd, filename, identity, encoded, diagnostic)
                  verify_shared_parent_identity(shared_fd, shared_path, shared_identity)
              finally:
                  os.close(shared_fd)
              return diagnostic

          def unlink_temporary_capture(capture_path, temporary_path, cap):
              if str(Path(capture_path).parent) != temporary_path:
                  raise OSError
              temporary_fd = os.open(temporary_path, os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC | os.O_NOFOLLOW)
              try:
                  temporary = os.fstat(temporary_fd)
                  temporary_named = os.lstat(temporary_path)
                  temporary_identity = (temporary.st_dev, temporary.st_ino, temporary.st_mode, temporary.st_uid, temporary.st_gid, temporary.st_nlink)
                  if (
                      not stat.S_ISDIR(temporary.st_mode)
                      or temporary.st_uid != 0
                      or not (temporary.st_mode & stat.S_ISVTX)
                      or temporary_identity != (temporary_named.st_dev, temporary_named.st_ino, temporary_named.st_mode, temporary_named.st_uid, temporary_named.st_gid, temporary_named.st_nlink)
                  ):
                      raise OSError
                  name = Path(capture_path).name
                  before = os.stat(name, dir_fd=temporary_fd, follow_symlinks=False)
                  if (
                      not stat.S_ISREG(before.st_mode)
                      or before.st_uid != 0
                      or before.st_gid != 0
                      or stat.S_IMODE(before.st_mode) != 0o600
                      or before.st_nlink != 1
                      or before.st_size > cap
                  ):
                      raise OSError
                  descriptor = os.open(name, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW, dir_fd=temporary_fd)
                  try:
                      opened = os.fstat(descriptor)
                      named = os.stat(name, dir_fd=temporary_fd, follow_symlinks=False)
                      if (
                          (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mode, opened.st_uid, opened.st_gid, opened.st_nlink)
                          != (before.st_dev, before.st_ino, before.st_size, before.st_mode, before.st_uid, before.st_gid, before.st_nlink)
                          or (named.st_dev, named.st_ino) != (before.st_dev, before.st_ino)
                      ):
                          raise OSError
                      os.unlink(name, dir_fd=temporary_fd)
                  finally:
                      os.close(descriptor)
                  os.fsync(temporary_fd)
                  temporary_after = os.fstat(temporary_fd)
                  named_after = os.lstat(temporary_path)
                  if (
                      (temporary_after.st_dev, temporary_after.st_ino, temporary_after.st_mode, temporary_after.st_uid, temporary_after.st_gid, temporary_after.st_nlink) != temporary_identity
                      or (named_after.st_dev, named_after.st_ino, named_after.st_mode, named_after.st_uid, named_after.st_gid, named_after.st_nlink) != temporary_identity
                  ):
                      raise OSError
              finally:
                  os.close(temporary_fd)

          def process_probe(report_path, capture_path, child_status, shared_path, run_id, run_attempt,
                            security_id, security_attempt, source_sha, bundle_sha, temporary_path="/tmp"):
              status = "unknown"
              cleanup_status = "unknown"
              first_fault = None
              host_guard = None
              stage = "report_frame_validation"
              diagnostic_attempted = False
              shared_fd = None
              pending_name = None
              pending_identity = None
              pending_size = None
              pending_committed = False
              try:
                  if (
                      re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is None
                      or re.fullmatch(r"[1-9][0-9]{0,5}", run_attempt) is None
                      or re.fullmatch(r"[1-9][0-9]{0,19}", security_id) is None
                      or re.fullmatch(r"[1-9][0-9]{0,5}", security_attempt) is None
                      or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None
                      or re.fullmatch(r"[0-9a-f]{64}", bundle_sha) is None
                      or str(Path(capture_path).parent) != temporary_path
                      or Path(capture_path).name != f"oldsparky-production-backup-{run_id}-{run_attempt}.stderr"
                      or str(Path(report_path).parent) != temporary_path
                      or re.fullmatch(r"oldsparky-production-backup-report\.[A-Za-z0-9]{6}", Path(report_path).name) is None
                  ):
                      raise ValueError
                  report_bytes = read_private(report_path, 16384)
                  capture_bytes = read_private(capture_path, 65536)
                  status, cleanup_status, first_fault, host_guard = parse_probe_report(
                      report_bytes, capture_bytes, child_status
                  )
                  operation_exit = (
                      int(child_status)
                      if re.fullmatch(r"(?:0|[1-9][0-9]{0,2})", str(child_status))
                      and int(child_status) <= 255
                      else None
                  )
                  if status == "failed":
                      stage = "validated_failure"
                      diagnostic_attempted = True
                      persist_probe_diagnostic(
                          shared_path, run_id, run_attempt, security_id, security_attempt,
                          source_sha, bundle_sha, stage, cleanup_status, operation_exit,
                          first_fault, host_guard,
                      )
                  else:
                      stage = "authorization_receipt_custody"
                  receipt = {
                      "schema": 1,
                      "kind": "authorization_probe_receipt",
                      "status": status,
                      "workflow_run_id": run_id,
                      "workflow_run_attempt": run_attempt,
                      "security_run_id": security_id,
                      "security_run_attempt": security_attempt,
                      "source_sha": source_sha,
                      "helper_bundle_sha256": bundle_sha,
                      "cleanup_status": cleanup_status,
                  }
                  if first_fault is not None:
                      receipt["first_fault"] = first_fault
                  pending = {
                      "schema": 1,
                      "kind": "authorization_probe_pending",
                      "status": "pending",
                      "probe_status": status,
                      **{key: value for key, value in receipt.items() if key not in {"kind", "status"}},
                  }
                  receipt_bytes = (json.dumps(receipt, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
                  pending_bytes = (json.dumps(pending, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
                  if len(receipt_bytes) > 4096 or len(pending_bytes) > 4096:
                      raise ValueError
                  shared_fd, shared_identity = verify_shared_parent(shared_path)
                  pending_name = f"authorization-probe-{run_id}-{run_attempt}.pending.json"
                  pending_identity = write_closed_file(shared_fd, pending_name, pending_bytes)
                  pending_size = len(pending_bytes)
                  os.fsync(shared_fd)
                  verify_shared_parent_identity(shared_fd, shared_path, shared_identity)
                  verify_owned_entry(shared_fd, pending_name, pending_identity, pending_size)
                  pending_committed = True
                  unlink_temporary_capture(capture_path, temporary_path, 65536)
                  unlink_temporary_capture(report_path, temporary_path, 16384)
                  final_name = f"authorization-probe-{run_id}-{run_attempt}.json"
                  final_identity = write_closed_file(shared_fd, final_name, receipt_bytes)
                  os.fsync(shared_fd)
                  verify_shared_parent_identity(shared_fd, shared_path, shared_identity)
                  verify_owned_entry(shared_fd, final_name, final_identity, len(receipt_bytes))
                  verify_shared_parent_identity(shared_fd, shared_path, shared_identity)
                  read_back_owned_receipt(
                      shared_fd, final_name, final_identity, len(receipt_bytes), receipt_bytes, receipt
                  )
                  verify_shared_parent_identity(shared_fd, shared_path, shared_identity)
                  unlink_owned_file(shared_fd, pending_name, pending_identity, len(pending_bytes))
                  os.fsync(shared_fd)
                  verify_shared_parent_identity(shared_fd, shared_path, shared_identity)
                  status_code = 0 if status == "completed" else 1
                  marker = (
                  f"AUTHORIZATION_PROBE_RESULT schema=1 run_id={run_id} attempt={run_attempt} "
                  f"security_run_id={security_id} security_run_attempt={security_attempt} source_sha={source_sha} "
                  f"bundle_sha256={bundle_sha} status={status} cleanup_status={cleanup_status} receipt=written custody=committed"
                  )
                  return status_code, marker
              except Exception:
                  if not diagnostic_attempted:
                      diagnostic_attempted = True
                      operation_exit = (
                          int(child_status)
                          if re.fullmatch(r"(?:0|[1-9][0-9]{0,2})", str(child_status))
                          and int(child_status) <= 255
                          else None
                      )
                      try:
                          persist_probe_diagnostic(
                              shared_path, run_id, run_attempt, security_id, security_attempt,
                              source_sha, bundle_sha, stage, cleanup_status, operation_exit,
                              first_fault, host_guard,
                          )
                      except Exception:
                          pass
                  if shared_fd is not None and pending_name is not None and pending_identity is not None and pending_size is not None:
                      try:
                          # Keep the pending projection after any final receipt failure.
                          verify_shared_parent_identity(shared_fd, shared_path, shared_identity)
                      except OSError:
                          pass
                  if pending_committed:
                      cleanup_paths = []
                      if (
                          re.fullmatch(r"[1-9][0-9]{0,19}", run_id)
                          and re.fullmatch(r"[1-9][0-9]{0,5}", run_attempt)
                          and str(Path(capture_path).parent) == temporary_path
                          and Path(capture_path).name == f"oldsparky-production-backup-{run_id}-{run_attempt}.stderr"
                      ):
                          cleanup_paths.append((capture_path, 65536))
                      if (
                          str(Path(report_path).parent) == temporary_path
                          and re.fullmatch(r"oldsparky-production-backup-report\.[A-Za-z0-9]{6}", Path(report_path).name)
                      ):
                          cleanup_paths.append((report_path, 16384))
                      for path, cap in cleanup_paths:
                          try:
                              unlink_temporary_capture(path, temporary_path, cap)
                          except OSError:
                              pass
                  safe_run_id = run_id if re.fullmatch(r"[1-9][0-9]{0,19}", run_id) else "0"
                  safe_run_attempt = run_attempt if re.fullmatch(r"[1-9][0-9]{0,5}", run_attempt) else "0"
                  return 1, (
                      f"AUTHORIZATION_PROBE_EVIDENCE_UNAVAILABLE schema=1 run_id={safe_run_id} attempt={safe_run_attempt} "
                      f"status=unknown cleanup_status={cleanup_status} receipt=unavailable "
                      f"custody={'pending' if pending_committed else 'unavailable'}"
                  )
              finally:
                  if shared_fd is not None:
                      os.close(shared_fd)

          def main(argv=None):
              if argv is None:
                  argv = sys.argv[1:]
              report_path, capture_path, child_status, shared_path, run_id, run_attempt, security_id, security_attempt, source_sha, bundle_sha = argv
              status, marker = process_probe(
                  report_path, capture_path, child_status, shared_path, run_id, run_attempt,
                  security_id, security_attempt, source_sha, bundle_sha,
              )
              print(marker)
              return status

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
