          expected_mode = "backup-only" if sys.argv[4] == "create" else "verify-existing-backup-only"
          if not isinstance(summary, dict) or summary.get("mode") != expected_mode:
              raise SystemExit("remote success summary does not match operation")
          print(marker)
          PY
          )"
          if [[ "$REMOTE_OPERATION" = create ]]; then
            receipt_path="$RUNNER_TEMP/platform-backup-success-receipt.json"
            test "$receipt_path" = "$RUNNER_TEMP/platform-backup-success-receipt.json"
            test ! -e "$receipt_path" && test ! -L "$receipt_path"
            /usr/bin/python3 -I - "$remote_report" "$REPOSITORY" "$SOURCE_SHA" "$SECURITY_RUN_ID" "$SECURITY_RUN_ATTEMPT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$receipt_path" "$BUNDLE_SHA256" "$EXPECTED_STORAGE_HELPER_SHA256" "$EXPECTED_BACKUP_DRILL_SHA256" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          (
              report_path, repository, source_sha, security_id, security_attempt,
              backup_id, backup_attempt, output_path, bundle_sha, storage_helper_sha,
              backup_drill_sha,
          ) = sys.argv[1:]
          if (
              repository != "StrayForest/old_sparky"
              or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None
              or re.fullmatch(r"[1-9][0-9]{0,19}", security_id) is None
              or re.fullmatch(r"[1-9][0-9]{0,5}", security_attempt) is None
              or re.fullmatch(r"[1-9][0-9]{0,19}", backup_id) is None
              or re.fullmatch(r"[1-9][0-9]{0,5}", backup_attempt) is None
              or re.fullmatch(r"[0-9a-f]{64}", bundle_sha) is None
              or re.fullmatch(r"[0-9a-f]{64}", storage_helper_sha) is None
              or re.fullmatch(r"[0-9a-f]{64}", backup_drill_sha) is None
          ):
              raise SystemExit("source-bound backup receipt identity is invalid")
          max_marker_bytes = 512
          max_summary_bytes = 1_056_768
          max_report_bytes = max_marker_bytes + max_summary_bytes + 2
          try:
              with Path(report_path).open("rb") as handle:
                  raw_report = handle.read(max_report_bytes + 1)
          except OSError as exc:
              raise SystemExit("source-bound backup report is unavailable") from exc
          if (
              len(raw_report) > max_report_bytes
              or raw_report.count(b"\n") != 2
              or not raw_report.endswith(b"\n")
              or b"\r" in raw_report
          ):
              raise SystemExit("source-bound backup report is not the closed two-line output")
          marker_raw, summary_raw, trailing = raw_report.split(b"\n")
          if (
              trailing
              or len(marker_raw) > max_marker_bytes
              or len(summary_raw) > max_summary_bytes
          ):
              raise SystemExit("source-bound backup report is not the closed two-line output")
          marker_match = re.fullmatch(
              rb"BACKUP_SUCCESS schema=1 run_id=([1-9][0-9]{0,19}) attempt=([1-9][0-9]{0,5}) operation=(create|verify-existing) source_sha=([0-9a-f]{40}) bundle_sha256=([0-9a-f]{64}) storage_helper_sha256=([0-9a-f]{64}) backup_drill_sha256=([0-9a-f]{64})",
              marker_raw,
          )
          expected_marker = (
              backup_id, backup_attempt, "create", source_sha, bundle_sha,
              storage_helper_sha, backup_drill_sha,
          )
          if (
              marker_match is None
              or marker_match.groups()
              != tuple(value.encode("ascii") for value in expected_marker)
          ):
              raise SystemExit("source-bound backup success marker is invalid")
          try:
              report = json.loads(summary_raw.decode("utf-8"))
          except (UnicodeDecodeError, ValueError) as exc:
              raise SystemExit("source-bound backup report is invalid") from exc
          backup = report.get("backup") if isinstance(report, dict) else None
          if not isinstance(backup, dict):
              raise SystemExit("source-bound backup report is invalid")
          archive_name = backup.get("archive_name")
          if (
              report.get("mode") != "backup-only"
              or report.get("ok") is not True
              or backup.get("status") != "completed"
              or backup.get("created") is not True
              or backup.get("restore_verified") is not True
              or backup.get("alembic_revision_verified") is not True
              or backup.get("checksum_present") is not True
              or backup.get("format_version") != 2
              or type(backup.get("format_version")) is not int
              or not isinstance(archive_name, str)
              or re.fullmatch(r"platformdb-[0-9]{8}T[0-9]{6}Z\.dump", archive_name) is None
              or not isinstance(backup.get("archive_sha256"), str)
              or re.fullmatch(r"[0-9a-f]{64}", backup["archive_sha256"]) is None
              or type(backup.get("size_bytes")) is not int
              or backup["size_bytes"] <= 0
              or type(backup.get("restored_table_count")) is not int
              or backup["restored_table_count"] < 1
              or backup.get("preexisting_archives_preserved") is not True
              or backup.get("rotation_mode") != "preserve-existing"
          ):
              raise SystemExit("source-bound backup report did not meet acceptance")
          receipt = {
              "schema": 1,
              "kind": "platform_source_bound_backup_success",
              "repository": repository,
              "ref": "refs/heads/dev",
              "operation": "create",
              "source_security_run_id": security_id,
              "source_security_run_attempt": security_attempt,
              "source_sha": source_sha,
              "backup_workflow_path": ".github/workflows/platform-production-backup.yml",
              "backup_run_id": backup_id,
              "backup_run_attempt": backup_attempt,
              "backup_head_sha": source_sha,
              "archive_name": archive_name,
              "format_version": backup["format_version"],
              "archive_sha256": backup["archive_sha256"],
              "archive_size_bytes": backup["size_bytes"],
              "created": True,
              "restore_verified": True,
              "alembic_revision_verified": True,
              "restored_table_count": backup["restored_table_count"],
              "preexisting_archives_preserved": True,
              "rotation_mode": "preserve-existing",
          }
          raw = (json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          if len(raw) > 4096:
              raise SystemExit("source-bound backup receipt is oversized")
          fd = os.open(output_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          try:
              metadata = os.fstat(fd)
              if not stat.S_ISREG(metadata.st_mode) or stat.S_IMODE(metadata.st_mode) != 0o600 or metadata.st_nlink != 1:
                  raise SystemExit("source-bound backup receipt file is unsafe")
              with os.fdopen(fd, "wb", closefd=False) as stream:
                  if stream.write(raw) != len(raw):
                      raise SystemExit("source-bound backup receipt write was incomplete")
                  stream.flush()
                  os.fsync(stream.fileno())
          finally:
              os.close(fd)
          PY
          fi
          printf '%s\n' "$success_marker"
          rm -f -- "$remote_report" "$remote_error"
          }
          if [[ "$BACKUP_OPERATION" = create && "$AUTHORIZATION_PROBE_BEFORE_CREATE" = true ]]; then
            run_remote_operation authorization-probe true
            run_remote_operation create false
          else
            run_remote_operation "$BACKUP_OPERATION" false
          fi

      - name: Remove staged helper bundle from production host
        if: ${{ always() && steps.stage-backup-helper.outcome != 'skipped' && steps.backup-helper.outputs.bundle_sha256 != '' }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGED_HELPER_IDENTITY: ${{ steps.stage-backup-helper.outputs.stage_identity }}
          BUNDLE_SHA256: ${{ steps.backup-helper.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ -z "$STAGED_HELPER_IDENTITY" || "$STAGED_HELPER_IDENTITY" =~ ^[0-9]+:[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          ssh_dir="$RUNNER_TEMP/platform-production-backup-ssh"
          if [[ ! -e "$ssh_dir" && ! -L "$ssh_dir" ]]; then
            exit 0
          fi
          test -d "$ssh_dir" && test ! -L "$ssh_dir"
          timeout --foreground --signal=TERM --kill-after=5s 60s ssh \
            -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -i "$ssh_dir/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash -s -- $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT ${STAGED_HELPER_IDENTITY:-none} $BUNDLE_SHA256 $SOURCE_SHA" <<'REMOTE'
          set -Eeuo pipefail
          run_id="${1:-}"
          run_attempt="${2:-}"
          expected_identity="${3:-}"
          expected_sha="${4:-}"
          source_sha="${5:-}"
          if [[ "$expected_identity" = none ]]; then expected_identity=""; fi
          [[ "$run_id" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$run_attempt" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ -z "$expected_identity" || "$expected_identity" =~ ^[0-9]+:[0-9]+$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(id -u)" -eq 0
          # Wait for any transfer or operation session to release the stage first.
          prepare_stage_lock() {
            local lock_parent=/run/lock
            local lock_dir=$lock_parent/oldsparky-backup-verifier-stage
            local lock_file="$lock_dir/operation.lock"
            test ! -L "$lock_parent"
            test -d "$lock_parent"
            test "$(stat -c '%u:%g:%a' "$lock_parent")" = "0:0:1777"
            if [[ ! -e "$lock_dir" && ! -L "$lock_dir" ]]; then mkdir -m 755 -- "$lock_dir" 2>/dev/null && chmod 755 -- "$lock_dir" || :; fi
            test ! -L "$lock_dir"
            test "$(stat -c '%F:%u:%g:%a:%h' "$lock_dir")" = "directory:0:0:755:2"
            if [[ ! -e "$lock_file" && ! -L "$lock_file" ]]; then (umask 022; set -o noclobber; : >"$lock_file") 2>/dev/null || :; fi
            test ! -L "$lock_file"
            test -f "$lock_file"
            test "$(stat -c '%u:%g:%a:%h' "$lock_file")" = "0:0:644:1"
            local lock_identity
            lock_identity="$(stat -c '%d:%i:%u:%g:%a:%h' "$lock_file")"
            exec 7>>"$lock_file"
            test "$(stat -Lc '%d:%i:%u:%g:%a:%h' "/proc/$$/fd/7")" = "$lock_identity"
            test "$(stat -c '%d:%i:%u:%g:%a:%h' "$lock_file")" = "$lock_identity"
            flock -w 45 7
          }
          prepare_stage_lock || exit 75
          # The backup remote then owns these canonical locks until its command stops.
          exec 9>/run/lock/oldsparky-platform-release.lock
          exec 8>/run/lock/oldsparky-retained-load-matrix.lock
          lock_deadline=$((SECONDS + 45))
          until flock -n 9 && flock -n 8; do
            (( SECONDS < lock_deadline )) || exit 75
            sleep 1
          done
          stage="/tmp/oldsparky-backup-verifier-${run_id}-${run_attempt}"
          /usr/bin/python3 -I -B - "$stage" "$expected_identity" "$expected_sha" "$source_sha" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import stat
          import sys
          import json
          import zipfile

          path = Path(sys.argv[1])
          expected = tuple(int(item) for item in sys.argv[2].split(":")) if sys.argv[2] else None
          expected_sha = sys.argv[3]
          source_sha = sys.argv[4]
          helper_names = {
              "platform_backup_restore_drill.py",
              "platform_disk_policy.py",
              "platform_live_qa_guard.py",
              "platform_live_qa_machine_lock.py",
              "platform_release_retention.py",
              "platform_build_node_cache.py",
              "platform_storage_maintenance.py",
              "platform_storage_evidence_summary.py",
          }
          try:
              before = path.lstat()
          except FileNotFoundError:
              raise SystemExit(0)
          if expected is None:
              raise SystemExit(1)
          if (
              not stat.S_ISDIR(before.st_mode)
              or before.st_uid != 0
              or before.st_gid != 0
              or stat.S_IMODE(before.st_mode) != 0o700
              or before.st_nlink not in {2, 3}
          ):
              raise SystemExit(1)
          if expected is not None and (before.st_dev, before.st_ino) != expected:
              raise SystemExit(1)
          entries = list(path.iterdir())
          names = {entry.name for entry in entries}
          if names not in (set(), {"bundle.zip"}, {"bundle.zip", "tools"}):
              raise SystemExit(1)
          if "tools" in names and "bundle.zip" not in names:
              raise SystemExit(1)
          bundle = path / "bundle.zip"
          item = None
          if "bundle.zip" in names:
              item = bundle.lstat()
              if (
                  not stat.S_ISREG(item.st_mode)
                  or item.st_uid != 0
                  or item.st_gid != 0
                  or item.st_nlink != 1
                  or stat.S_IMODE(item.st_mode) != 0o600
              ):
                  raise SystemExit(1)
              digest = hashlib.sha256()
              with bundle.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              current_bundle = bundle.lstat()
              if (
                  digest.hexdigest() != expected_sha
                  or (current_bundle.st_dev, current_bundle.st_ino, current_bundle.st_size,
                      current_bundle.st_mtime_ns, current_bundle.st_ctime_ns)
                  != (item.st_dev, item.st_ino, item.st_size, item.st_mtime_ns, item.st_ctime_ns)
              ):
                  raise SystemExit(1)
          if "tools" in names:
              tools = path / "tools"
              tools_stat = tools.lstat()
              if (
                  not stat.S_ISDIR(tools_stat.st_mode)
                  or tools_stat.st_uid != 0
                  or tools_stat.st_gid != 0
                  or tools_stat.st_nlink != 2
                  or stat.S_IMODE(tools_stat.st_mode) != 0o555
                  or {child.name for child in tools.iterdir()} != helper_names
              ):
                  raise SystemExit(1)
              with zipfile.ZipFile(bundle) as archive:
                  manifest = json.loads(
                      archive.read("platform-backup-verifier/manifest.json").decode("ascii")
                  )
              if manifest.get("source_sha") != source_sha:
                  raise SystemExit(1)
              rows = {
                  row.get("path", "").removeprefix("platform/tools/"): row
                  for row in manifest.get("files", [])
                  if isinstance(row, dict)
              }
              if set(rows) != helper_names:
                  raise SystemExit(1)
              for name in helper_names:
                  helper = tools / name
                  helper_stat = helper.lstat()
                  row = rows[name]
                  if (
                      not stat.S_ISREG(helper_stat.st_mode)
                      or helper_stat.st_uid != 0
                      or helper_stat.st_gid != 0
                      or helper_stat.st_nlink != 1
                      or stat.S_IMODE(helper_stat.st_mode) != 0o444
                      or helper_stat.st_size != row.get("size")
                      or hashlib.sha256(helper.read_bytes()).hexdigest() != row.get("sha256")
                  ):
                      raise SystemExit(1)
              tools.chmod(0o700)
              for name in helper_names:
                  (tools / name).unlink()
              tools.rmdir()
          if item is not None:
              current_bundle = bundle.lstat()
              if (current_bundle.st_dev, current_bundle.st_ino) != (item.st_dev, item.st_ino):
                  raise SystemExit(1)
              bundle.unlink()
          current = path.lstat()
          if (
              (expected is not None and (current.st_dev, current.st_ino) != expected)
              or (current.st_dev, current.st_ino) != (before.st_dev, before.st_ino)
              or list(path.iterdir())
          ):
              raise SystemExit(1)
          path.rmdir()
          directory_fd = os.open("/tmp", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              os.fsync(directory_fd)
          finally:
              os.close(directory_fd)
          PY
          REMOTE

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-backup-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-backup-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- \
            "$RUNNER_TEMP/platform-production-backup-report.log" \
            "$RUNNER_TEMP/platform-production-backup-ssh-error.log"
          test ! -e "$RUNNER_TEMP/platform-production-backup-report.log"
          test ! -e "$RUNNER_TEMP/platform-production-backup-ssh-error.log"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Publish source-bound backup success receipt
        if: ${{ success() && inputs.operation == 'create' && steps.cleanup_ssh.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-backup-success-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-backup-success-receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
