          backup_report_file="$(mktemp /tmp/oldsparky-production-backup-report.XXXXXX)"
          chmod 600 "$backup_report_file"

          test "$(id -u)" -eq 0 || { echo "Production backup must run as root" >&2; exit 1; }
          test -L "$current" || { echo "Current release symlink is missing" >&2; exit 1; }
          test -x "$python_bin" || { echo "Shared Python runtime is missing" >&2; exit 1; }
          test -f "$runtime/shared/.env.platform" || { echo "Platform env file is missing" >&2; exit 1; }
          test -f "$maintenance_tool" && test ! -L "$maintenance_tool" \
            || { echo "Storage maintenance tool is missing" >&2; exit 1; }
          test -f "$summary_tool" && test ! -L "$summary_tool" \
            || { echo "Storage evidence summary helper is missing or unsafe" >&2; exit 1; }

          if [[ "$operation" = verify-existing ]]; then
            failure_stage=backup_verify_existing
          else
            failure_stage=backup_create
          fi
          /usr/bin/python3 -I - "$python_bin" "$maintenance_tool" \
            "$runtime" "$run_id" "$run_attempt" "$backup_report_file" "$operation" <<'PY'
          import os
          from pathlib import Path
          import re
          import signal
          import stat
          import subprocess
          import sys

          python_bin, maintenance_tool, runtime, run_id, run_attempt, report_path, operation = sys.argv[1:]
          if not re.fullmatch(r"[1-9][0-9]{0,19}", run_id):
              raise SystemExit(125)
          if not re.fullmatch(r"[1-9][0-9]{0,5}", run_attempt):
              raise SystemExit(125)
          tmp_stat = os.stat("/tmp", follow_symlinks=False)
          if not stat.S_ISDIR(tmp_stat.st_mode) or tmp_stat.st_uid != 0 or not (tmp_stat.st_mode & stat.S_ISVTX):
              raise SystemExit(125)
          capture_path = Path(f"/tmp/oldsparky-production-backup-{run_id}-{run_attempt}.stderr")
          capture_fd = os.open(
              capture_path,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
              0o600,
          )
          capture_stat = os.fstat(capture_fd)
          if (
              not stat.S_ISREG(capture_stat.st_mode)
              or capture_stat.st_uid != 0
              or stat.S_IMODE(capture_stat.st_mode) != 0o600
              or capture_stat.st_nlink != 1
          ):
              os.close(capture_fd)
              raise SystemExit(125)
          report = Path(report_path)
          report_stat = report.lstat()
          if (
              not stat.S_ISREG(report_stat.st_mode)
              or report_stat.st_uid != 0
              or stat.S_IMODE(report_stat.st_mode) != 0o600
              or report_stat.st_nlink != 1
          ):
              os.close(capture_fd)
              raise SystemExit(125)
          command = [
              python_bin,
              "-I",
              "-B",
              maintenance_tool,
              "--app-dir", runtime,
              "--backup-max-age-hours", "24",
              "--private-backup-diagnostics", "--apply", "--json",
          ]
          if operation == "create":
              command.insert(-3, "--backup-only")
          elif operation == "verify-existing":
              command.insert(-3, "--verify-existing-backup-only")
              if evict_build_node_cache == "true":
                  command.extend((
                      "--evict-pinned-build-node-cache",
                      "--eviction-run-id", run_id,
                      "--eviction-run-attempt", run_attempt,
                      "--eviction-source-sha", source_sha,
                      "--eviction-bundle-sha256", bundle_sha,
                  ))
          else:
              raise SystemExit(125)
          def stop_child_group(process):
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  pass
              try:
                  os.killpg(process.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              process.wait()

          def interrupt_child(signum, frame):
              if process is not None:
                  stop_child_group(process)
              raise InterruptedError(f"backup child interrupted by signal {signum}")

          process = None
          signal.signal(signal.SIGTERM, interrupt_child)
          signal.signal(signal.SIGINT, interrupt_child)
          report_fd = os.open(report, os.O_WRONLY | os.O_TRUNC | os.O_NOFOLLOW)
          opened_report = os.fstat(report_fd)
          if (opened_report.st_dev, opened_report.st_ino) != (report_stat.st_dev, report_stat.st_ino):
              os.close(report_fd)
              raise SystemExit(125)
          with os.fdopen(report_fd, "wb") as report_stream:
              process = subprocess.Popen(
                  command,
                  stdin=subprocess.DEVNULL,
                  stdout=report_stream,
                  stderr=subprocess.PIPE,
                  close_fds=True,
                  start_new_session=True,
              )
              captured = 0
              try:
                  with os.fdopen(capture_fd, "wb") as private_capture:
                      assert process.stderr is not None
                      while True:
                          chunk = process.stderr.read(4096)
                          if not chunk:
                              break
                          if captured < 65536:
                              retained = chunk[: 65536 - captured]
                              private_capture.write(retained)
                              captured += len(retained)
                      private_capture.flush()
                      os.fsync(private_capture.fileno())
                  status = process.wait()
              except BaseException:
                  if process is not None:
                      stop_child_group(process)
                  raise
          raise SystemExit(status)
          PY
          failure_stage=summary_validation
          public_report="$({
            /usr/bin/python3 -I "$summary_tool" --mode retention \
              <"$backup_report_file"
          } 2>/dev/null)" || {
            echo "Production backup summary failed" >&2
            exit 1
          }
          /usr/bin/python3 -I - "$backup_report_file" "$operation" "$evict_build_node_cache" "$run_id" "$run_attempt" "$source_sha" "$bundle_sha" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          operation = sys.argv[2]
          evict_cache = sys.argv[3]
          expected_run_id, expected_attempt, expected_source, expected_bundle = sys.argv[4:]
          if evict_cache not in {"true", "false"}:
              raise SystemExit("cache eviction selection is invalid")
          expected_mode = "backup-only" if operation == "create" else "verify-existing-backup-only"
          if operation not in {"create", "verify-existing"} or report.get("mode") != expected_mode or report.get("ok") is not True:
              raise SystemExit("lock-aware backup report mode or health is invalid")
          backup = report.get("backup") or {}
          if (
              backup.get("status") != "completed"
              or backup.get("restore_verified") is not True
              or backup.get("alembic_revision_verified") is not True
              or backup.get("rotation_mode") != "preserve-existing"
              or backup.get("removed_count") != 0
              or not isinstance(backup.get("restored_table_count"), int)
              or isinstance(backup.get("restored_table_count"), bool)
              or backup.get("restored_table_count", 0) < 1
          ):
              raise SystemExit("lock-aware backup verification flags are invalid")
          if operation == "create":
              if (
                  backup.get("checksum_present") is not True
                  or backup.get("preexisting_archives_preserved") is not True
                  or backup.get("created") is not True
                  or not isinstance(backup.get("preexisting_archive_count"), int)
                  or isinstance(backup.get("preexisting_archive_count"), bool)
                  or backup.get("preexisting_archive_count", -1) < 0
                  or not isinstance(backup.get("preexisting_sidecar_count"), int)
                  or isinstance(backup.get("preexisting_sidecar_count"), bool)
                  or backup.get("preexisting_sidecar_count", -1) < 0
                  or not re.fullmatch(r"[0-9a-f]{64}", str(backup.get("preexisting_archive_inventory_sha256") or ""))
                  or backup.get("preexisting_archive_inventory_sha256") != backup.get("postexisting_archive_inventory_sha256")
              ):
                  raise SystemExit("new backup creation or preservation failed")
          elif (
              backup.get("verified_existing") is not True
              or backup.get("created") is not False
              or re.fullmatch(r"[0-9a-f]{64}", str(backup.get("sha256") or "")) is None
              or not isinstance(backup.get("age_hours"), (int, float))
              or isinstance(backup.get("age_hours"), bool)
              or not 0 <= backup.get("age_hours", -1) <= 24
              or not isinstance(backup.get("restore_verified_at_utc"), str)
              or re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z", backup["restore_verified_at_utc"]) is None
          ):
              raise SystemExit("existing backup verification result is invalid")
          cache = backup.get("build_node_cache")
          if operation == "verify-existing" and evict_cache == "true":
              if (
                  not isinstance(cache, dict)
                  or cache.get("status") not in {"removed", "already-absent"}
                  or cache.get("node_version") != "26.3.1"
                  or cache.get("run_id") != expected_run_id
                  or cache.get("run_attempt") != expected_attempt
                  or cache.get("source_sha") != expected_source
                  or cache.get("bundle_sha256") != expected_bundle
                  or type(cache.get("reclaimed_bytes")) is not int
                  or cache["reclaimed_bytes"] < 0
                  or cache.get("intent_receipt") != f"build-node-cache-eviction-{expected_run_id}-{expected_attempt}.intent.json"
                  or cache.get("completion_receipt") != f"build-node-cache-eviction-{expected_run_id}-{expected_attempt}.completion.json"
                  or (cache.get("status") == "removed" and (re.fullmatch(r"[0-9a-f]{64}", str(cache.get("manifest_tree_sha256", ""))) is None or cache.get("regeneration") != "pinned_archive_required"))
                  or (cache.get("status") == "already-absent" and (cache["reclaimed_bytes"] != 0 or "manifest_tree_sha256" in cache))
              ):
                  raise SystemExit("build Node cache eviction result is invalid")
          elif operation == "verify-existing" and (
              not isinstance(cache, dict) or cache.get("status") != "not-requested"
          ):
              raise SystemExit("unexpected build Node cache operation")
          elif operation == "create" and (evict_cache != "false" or cache is not None):
              raise SystemExit("unexpected build Node cache operation")
          for section_name in (
              "production_releases",
              "source_release_artifacts",
              "live_qa_runtime_caches",
          ):
              section = report.get(section_name) or {}
              if (
                  section.get("deleted_count") != 0
                  or section.get("reclaimable_bytes", 0) != 0
              ):
                  raise SystemExit(f"backup-only changed {section_name}")
          transient = report.get("transient") or {}
          for category in (
              "failed_builds",
              "browser_test_artifacts",
              "preprod_screenshots",
          ):
              section = transient.get(category) or {}
              if (
                  section.get("count") != 0
                  or section.get("reclaimable_bytes") != 0
              ):
                  raise SystemExit(f"backup-only changed {category}")
          PY
          failure_stage=public_summary
          public_report="$({
            /usr/bin/python3 -I - "$public_report" "$operation" "$backup_report_file" "$EVICT_BUILD_NODE_CACHE" <<'PY'
          import json
          from pathlib import Path
          import sys

          public = json.loads(sys.argv[1])
          if not isinstance(public, dict) or public.get("mode") != "unknown":
              raise SystemExit("unexpected retention summary mode")
          public["mode"] = "backup-only" if sys.argv[2] == "create" else "verify-existing-backup-only"
          if sys.argv[4] == "true":
              report = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
              cache = report["backup"]["build_node_cache"]
              projected = {
                  "status": cache["status"],
                  "node_version": cache["node_version"],
                  "reclaimed_bytes": cache["reclaimed_bytes"],
                  "intent_receipt": cache["intent_receipt"],
                  "completion_receipt": cache["completion_receipt"],
                  "run_id": cache["run_id"],
                  "run_attempt": cache["run_attempt"],
                  "source_sha": cache["source_sha"],
                  "bundle_sha256": cache["bundle_sha256"],
              }
              if cache["status"] == "removed":
                  projected["manifest_tree_sha256"] = cache["manifest_tree_sha256"]
                  projected["regeneration"] = cache["regeneration"]
              public["build_node_cache"] = projected
          elif sys.argv[4] != "false":
              raise SystemExit("cache eviction selection is invalid")
          print(json.dumps(public, sort_keys=True, separators=(",", ":")))
          PY
          } 2>/dev/null)" || {
            echo "Production backup public summary normalization failed" >&2
            exit 1
          }
          test -n "$public_report" || {
            echo "Production backup summary was unavailable" >&2
            exit 1
          }
          failure_stage=private_capture_cleanup
          /usr/bin/python3 -I - "$run_id" "$run_attempt" <<'PY'
          import os
          import stat
          import sys

          run_id, run_attempt = sys.argv[1:]
          capture_name = f"oldsparky-production-backup-{run_id}-{run_attempt}.stderr"
          directory_fd = os.open("/tmp", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              directory = os.fstat(directory_fd)
              if not stat.S_ISDIR(directory.st_mode) or directory.st_uid != 0 or not (directory.st_mode & stat.S_ISVTX):
                  raise SystemExit(125)
              before = os.stat(capture_name, dir_fd=directory_fd, follow_symlinks=False)
              if (
                  not stat.S_ISREG(before.st_mode)
                  or before.st_uid != 0
                  or stat.S_IMODE(before.st_mode) != 0o600
                  or before.st_nlink != 1
                  or before.st_size > 65536
              ):
                  raise SystemExit(125)
              file_fd = os.open(capture_name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=directory_fd)
              try:
                  opened = os.fstat(file_fd)
                  if (opened.st_dev, opened.st_ino) != (before.st_dev, before.st_ino):
                      raise SystemExit(125)
                  current_capture = os.stat(capture_name, dir_fd=directory_fd, follow_symlinks=False)
                  if (current_capture.st_dev, current_capture.st_ino) != (before.st_dev, before.st_ino):
                      raise SystemExit(125)
                  os.unlink(capture_name, dir_fd=directory_fd)
              finally:
                  os.close(file_fd)
          finally:
              os.close(directory_fd)
          PY
          failure_stage=complete
          printf '%s\n' "$public_report"
          REMOTE
          then
            :
          else
            ssh_exit_code=$?
            failure_summary="$(/usr/bin/python3 -I - "$remote_report" <<'PY'
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              raw = handle.read(4097)
          match = re.fullmatch(
              r"BACKUP_FAILURE schema=1 stage=(preflight|helper_bundle_validation|backup_create|backup_verify_existing|summary_validation|public_summary|private_capture_cleanup|helper_cleanup|report_cleanup|complete) exit_code=([0-9]{1,3})\n",
              raw,
          )
          if match is not None:
              print(f"stage={match.group(1)} exit_code={match.group(2)}")
          PY
            )"
            rm -f -- "$remote_report" "$remote_error"
            if [[ -n "$failure_summary" ]]; then
              printf 'Production backup failed (%s)\n' "$failure_summary" >&2
            else
              printf 'Production backup failed before remote stage evidence (ssh_exit=%s)\n' \
                "$ssh_exit_code" >&2
            fi
            exit 1
          fi
          rm -f -- "$remote_report" "$remote_error"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-backup-ssh"
          test "$ssh_dir" = "$RUNNER_TEMP/platform-production-backup-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519" && test ! -L "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts" && test ! -L "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan" && test ! -L "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config" && test ! -L "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock" && test ! -L "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master" && test ! -L "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock" && test ! -L "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- \
            "$RUNNER_TEMP/platform-production-backup-report.log" \
            "$RUNNER_TEMP/platform-production-backup-ssh-error.log"
          test ! -e "$RUNNER_TEMP/platform-production-backup-report.log"
          test ! -e "$RUNNER_TEMP/platform-production-backup-ssh-error.log"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"
