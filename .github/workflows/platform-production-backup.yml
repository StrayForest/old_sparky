          scratch_unit_diagnostic = None
          scratch_admission_diagnostic = None
          backup_disk_diagnostic = None
          scratch_first_fault = None
          scratch_host_guard_diagnostic = None
          scratch_resource_attribution = None
          scratch_phase_attribution = None
          scratch_allocation_attribution = None
          scratch_cleanup_status = None
          host_guard_invalid = False

          def valid_resource_attribution(value):
              if (
                  not isinstance(value, dict)
                  or set(value) != {
                      "schema", "status", "sample_offset_ms", "unknown_reason", "controller",
                      "worker", "cgroup",
                  }
                  or type(value.get("schema")) is not int
                  or value["schema"] != 1
                  or type(value.get("status")) is not str
                  or value["status"] not in {"complete", "unknown"}
                  or (
                      value.get("sample_offset_ms") is not None
                      and (type(value["sample_offset_ms"]) is not int or value["sample_offset_ms"] < 0)
                  )
                  or (
                      value.get("unknown_reason") is not None
                      and (
                          type(value["unknown_reason"]) is not str
                          or value["unknown_reason"] not in {
                              "sample_unavailable", "identity_drift", "parse_invalid",
                              "cap_exceeded", "internal_error",
                          }
                      )
                  )
              ):
                  return False
              for role in ("controller", "worker"):
                  observation = value.get(role)
                  if (
                      not isinstance(observation, dict)
                      or set(observation) != {"identity_bound", "rss_bytes"}
                      or type(observation.get("identity_bound")) is not bool
                      or (
                          observation.get("rss_bytes") is not None
                          and (
                              type(observation["rss_bytes"]) is not int
                              or not 0 <= observation["rss_bytes"] <= (1 << 40)
                          )
                      )
                      or (observation.get("rss_bytes") is not None and not observation["identity_bound"])
                  ):
                      return False
              cgroup = value.get("cgroup")
              if (
                  not isinstance(cgroup, dict)
                  or set(cgroup) != {
                      "identity_bound", "memory_current_bytes", "anon_bytes", "file_bytes",
                      "shmem_bytes", "events",
                  }
                  or type(cgroup.get("identity_bound")) is not bool
              ):
                  return False
              for key in ("memory_current_bytes", "anon_bytes", "file_bytes", "shmem_bytes"):
                  item = cgroup.get(key)
                  if (
                      item is not None
                      and (type(item) is not int or not 0 <= item <= (1 << 60) or not cgroup["identity_bound"])
                  ):
                      return False
              events = cgroup.get("events")
              if not isinstance(events, dict) or set(events) != {"high", "max", "oom", "oom_kill"}:
                  return False
              for item in events.values():
                  if item is not None and (type(item) is not int or not 0 <= item <= (1 << 60) or not cgroup["identity_bound"]):
                      return False
              if value["status"] == "complete":
                  return (
                      value["sample_offset_ms"] is not None
                      and value["unknown_reason"] is None
                      and value["controller"]["identity_bound"]
                      and value["controller"]["rss_bytes"] is not None
                      and value["worker"]["identity_bound"]
                      and value["worker"]["rss_bytes"] is not None
                      and cgroup["identity_bound"]
                      and all(cgroup[key] is not None for key in (
                          "memory_current_bytes", "anon_bytes", "file_bytes", "shmem_bytes",
                      ))
                      and all(item is not None for item in events.values())
                  )
              return value.get("unknown_reason") in {
                  "sample_unavailable", "identity_drift", "parse_invalid",
                  "cap_exceeded", "internal_error",
              }

          def valid_phase_attribution(value):
              if (
                  not isinstance(value, dict)
                  or set(value) != {
                      "schema", "status", "unknown_reason", "controller_guard_offset_ms",
                      "controller_drain_offset_ms", "frames",
                  }
                  or type(value.get("schema")) is not int
                  or value["schema"] != 1
                  or type(value.get("status")) is not str
                  or value["status"] not in {"complete", "unknown"}
              ):
                  return False
              reasons = {
                  "capture_unavailable", "capture_prefix", "incomplete", "malformed",
                  "non_phase_bytes", "truncated", "internal_error",
              }
              reason = value.get("unknown_reason")
              if reason is not None and (type(reason) is not str or reason not in reasons):
                  return False
              guard_offset = value.get("controller_guard_offset_ms")
              drain_offset = value.get("controller_drain_offset_ms")
              for offset in (guard_offset, drain_offset):
                  if offset is not None and (
                      type(offset) is not int or not 0 <= offset <= 960_000
                  ):
                      return False
              if (guard_offset is None) != (drain_offset is None):
                  return False
              if guard_offset is not None and drain_offset < guard_offset:
                  return False
              frames = value.get("frames")
              if not isinstance(frames, list) or len(frames) > 12:
                  return False
              phases = (
                  "archive_verify", "initdb", "postgres_start", "restore_platform",
                  "restore_public", "alembic_verify",
              )
              expected = [(phase, event) for phase in phases for event in ("start", "end")]
              previous = -1
              for index, frame in enumerate(frames):
                  if (
                      not isinstance(frame, dict)
                      or set(frame) != {"ordinal", "phase", "event", "worker_offset_ms"}
                      or type(frame.get("ordinal")) is not int
                      or frame["ordinal"] != index + 1
                      or (frame.get("phase"), frame.get("event")) != expected[index]
                      or type(frame.get("worker_offset_ms")) is not int
                      or not 0 <= frame["worker_offset_ms"] <= 960_000
                      or frame["worker_offset_ms"] < previous
                  ):
                      return False
                  previous = frame["worker_offset_ms"]
              if value["status"] == "complete":
                  return len(frames) == 12 and reason is None
              return reason in reasons

          def valid_scratch_allocation_attribution(value):
              reasons = {
                  "sample_unavailable", "identity_drift", "mount_identity", "read_error",
                  "unsupported_entry", "entry_cap", "depth_cap", "deadline", "malformed",
                  "incomplete", "capture_unavailable", "capture_prefix", "internal_error",
              }
              phases = {
                  "initdb_end", "postgres_start_end", "restore_platform_start",
                  "restore_platform_end", "worker_failure", "parent_last_guard",
              }
              if (
                  not isinstance(value, dict)
                  or set(value) != {
                      "schema", "status", "unknown_reason", "archive_size_bytes", "archive_sha256", "samples",
                  }
                  or type(value.get("schema")) is not int
                  or value["schema"] != 1
                  or type(value.get("status")) is not str
                  or value["status"] not in {"complete", "partial", "unknown"}
                  or (
                      value.get("unknown_reason") is not None
                      and (type(value["unknown_reason"]) is not str or value["unknown_reason"] not in reasons)
                  )
                  or type(value.get("archive_size_bytes")) is not int
                  or not 0 < value["archive_size_bytes"] <= (1 << 60)
                  or type(value.get("archive_sha256")) is not str
                  or re.fullmatch(r"[0-9a-f]{64}", value["archive_sha256"]) is None
                  or not isinstance(value.get("samples"), list)
                  or len(value["samples"]) > 6
              ):
                  return False

              samples = value["samples"]
              seen_phases = set()
              complete_phases = set()
              phase_order = {
                  "initdb_end": 0,
                  "postgres_start_end": 1,
                  "restore_platform_start": 2,
                  "restore_platform_end": 3,
                  "worker_failure": 4,
                  "parent_last_guard": 5,
              }
              previous_phase = -1
              sample_keys = {
                  "schema", "phase", "status", "unknown_reason", "sample_unix_ns", "sample_offset_ms",
                  "guard_available_bytes", "guard_sample_lag_ms", "mount", "host", "tree",
              }
              mount_keys = {"dev", "ino", "mount_id", "total_bytes", "used_bytes", "free_bytes"}
              host_keys = {
                  "mem_available_bytes", "rss_bytes", "memory_current_bytes", "anon_bytes", "file_bytes", "shmem_bytes",
              }
              tree_keys = {"data", "base", "pg_wal"}
              for sample in samples:
                  if (
                      not isinstance(sample, dict)
                      or set(sample) != sample_keys
                      or type(sample.get("schema")) is not int
                      or sample["schema"] != 1
                      or type(sample.get("phase")) is not str
                      or sample["phase"] not in phases
                      or sample["phase"] in seen_phases
                      or phase_order[sample["phase"]] <= previous_phase
                      or type(sample.get("status")) is not str
                      or sample["status"] not in {"complete", "unknown"}
                      or (
                          sample.get("unknown_reason") is not None
                          and (type(sample["unknown_reason"]) is not str or sample["unknown_reason"] not in reasons)
                      )
                      or type(sample.get("sample_unix_ns")) is not int
                      or not 0 <= sample["sample_unix_ns"] <= (1 << 63) - 1
                      or (
                          sample.get("sample_offset_ms") is not None
                          and (
                              type(sample["sample_offset_ms"]) is not int
                              or not 0 <= sample["sample_offset_ms"] <= 960_000
                          )
                      )
                  ):
                      return False
                  seen_phases.add(sample["phase"])
                  previous_phase = phase_order[sample["phase"]]
                  guard_available = sample.get("guard_available_bytes")
                  guard_lag = sample.get("guard_sample_lag_ms")
                  if (
                      (guard_available is not None and (type(guard_available) is not int or not 0 <= guard_available < 1_073_741_824))
                      or (guard_lag is not None and (type(guard_lag) is not int or not 0 <= guard_lag <= 60_000))
                  ):
                      return False
                  mount = sample.get("mount")
                  if not isinstance(mount, dict) or set(mount) != mount_keys:
                      return False
                  mount_limits = {
                      "dev": (1 << 63) - 1,
                      "ino": (1 << 63) - 1,
                      "mount_id": (1 << 31) - 1,
                      "total_bytes": 1 << 60,
                      "used_bytes": 1 << 60,
                      "free_bytes": 1 << 60,
                  }
                  for key, item in mount.items():
                      if item is not None and (type(item) is not int or not 0 <= item <= mount_limits[key]):
                          return False
                  if (
                      mount.get("used_bytes") is not None
                      and mount.get("free_bytes") is not None
                      and mount["used_bytes"] + mount["free_bytes"] != mount.get("total_bytes")
                  ):
                      return False
                  host = sample.get("host")
                  if not isinstance(host, dict) or set(host) != host_keys:
                      return False
                  for item in host.values():
                      if item is not None and (type(item) is not int or not 0 <= item <= (1 << 60)):
                          return False
                  tree = sample.get("tree")
                  if not isinstance(tree, dict) or set(tree) != tree_keys:
                      return False
                  for counters in tree.values():
                      if counters is not None and (
                          not isinstance(counters, list)
                          or len(counters) != 4
                          or any(type(item) is not int or not 0 <= item <= (1 << 60) for item in counters[:2])
                          or any(type(item) is not int or not 0 <= item <= 8192 for item in counters[2:])
                      ):
                          return False
                  if sample["status"] == "complete":
                      if (
                          sample.get("unknown_reason") is not None
                          or any(item is None for item in mount.values())
                          or any(item is None for item in host.values())
                          or any(item is None for item in tree.values())
                      ):
                          return False
                      complete_phases.add(sample["phase"])
                  elif sample.get("unknown_reason") is None:
                      return False

              reason = value.get("unknown_reason")
              if value["status"] == "complete":
                  valid_status = (
                      reason is None
                      and all(sample["status"] == "complete" for sample in samples)
                      and seen_phases == {
                          "initdb_end", "postgres_start_end", "restore_platform_start", "restore_platform_end",
                      }
                  )
              elif value["status"] == "partial":
                  valid_status = bool(samples) and reason is not None
              else:
                  valid_status = not samples and reason is not None
              if not valid_status:
                  return False
              try:
                  encoded = json.dumps(value, separators=(",", ":"), sort_keys=True).encode("ascii")
              except (TypeError, ValueError, UnicodeError):
                  return False
              return len(encoded) <= 8192

          def parse_bound_scratch_allocation_attribution(report, stderr_state, stderr_bytes):
              marker = b"SCRATCH_ALLOCATION_ATTRIBUTION_V1:"
              marker_count = stderr_bytes.count(marker) if stderr_state == "read" else 0
              if "scratch_allocation_attribution" not in report:
                  return (stderr_state in {"absent", "read"} and marker_count == 0), None
              attribution = report.get("scratch_allocation_attribution")
              if not valid_scratch_allocation_attribution(attribution) or marker_count != 1:
                  return False, None
              marker_start = stderr_bytes.index(marker) + len(marker)
              marker_end = stderr_bytes.find(b"\n", marker_start)
              marker_offset = marker_start - len(marker)
              marker_is_line_start = marker_offset == 0 or stderr_bytes[marker_offset - 1 : marker_offset] == b"\n"
              frame_bytes = stderr_bytes[marker_start:marker_end] if marker_end >= 0 else b""

              def reject_duplicate_keys(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError
                      result[key] = value
                  return result

              try:
                  frame = json.loads(frame_bytes.decode("ascii"), object_pairs_hook=reject_duplicate_keys)
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError):
                  return False, None
              canonical = json.dumps(attribution, sort_keys=True, separators=(",", ":")).encode("ascii")
              if (
                  not marker_is_line_start
                  or frame != attribution
                  or frame_bytes != canonical
                  or len(frame_bytes) > 8192
              ):
                  return False, None
              return True, attribution

          if report_state == "read":
              try:
                  report = json.loads(
                      report_bytes.decode("utf-8"),
                      object_pairs_hook=reject_duplicate_keys,
                  )
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError):
                  report_state = "invalid_json"
              else:
                  allowed = {"backup", "lock", "integrity", "configuration", "storage"}
                  if isinstance(report, dict) and report.get("ok") is False and report.get("status") == "failed" and report.get("error_class") in allowed:
                      report_error_class = report["error_class"]
                      report_state = "typed_failure"
                      diagnostic = report.get("restore_diagnostic")
                      scratch_unit = report.get("scratch_unit_diagnostic")
                      scratch_admission = report.get("scratch_admission_diagnostic")
                      backup_disk = report.get("backup_disk_diagnostic")
                      first_fault = report.get("scratch_first_fault")
                      scratch_host_guard = report.get("scratch_host_guard_diagnostic")
                      resource_attribution = report.get("scratch_resource_attribution")
                      if "scratch_resource_attribution" in report:
                          if valid_resource_attribution(resource_attribution):
                              scratch_resource_attribution = resource_attribution
                          else:
                              report_state = "unclassified_json"
                      phase_attribution = report.get("scratch_phase_attribution")
                      if "scratch_phase_attribution" in report:
                          if valid_phase_attribution(phase_attribution):
                              scratch_phase_attribution = phase_attribution
                          else:
                              report_state = "unclassified_json"
                      allocation_bound, scratch_allocation_attribution = parse_bound_scratch_allocation_attribution(
                          report, stderr_state, stderr_bytes
                      )
                      if not allocation_bound:
                          report_state = "unclassified_json"
                      if "scratch_cleanup_status" in report:
                          cleanup_status = report.get("scratch_cleanup_status")
                          if (
                              type(cleanup_status) is str
                              and cleanup_status in {"confirmed", "failed", "unknown"}
                          ):
                              scratch_cleanup_status = cleanup_status
                          else:
                              report_state = "unclassified_json"
                      fault_marker = b"SCRATCH_FIRST_FAULT_V1\n"
                      fault_marker_count = stderr_bytes.count(fault_marker) if stderr_state == "read" else 0
                      host_guard_marker = b"OLDS_PG_SCRATCH_HOST_GUARD_V1:"
                      host_guard_marker_count = stderr_bytes.count(host_guard_marker) if stderr_state == "read" else 0
                      first_fault_sites = {
                          "controller_entry", "controller_archive_identity", "controller_unit_setup",
                          "controller_synthetic_path_fixture",
                          "controller_host_guard", "controller_launch", "controller_unit_snapshot",
                          "controller_identity", "controller_start_token", "controller_active_poll",
                          "controller_worker_frame", "controller_completion_snapshot", "controller_done_token",
                          "controller_final_snapshot", "controller_cleanup", "worker_entry",
                          "worker_start_token", "worker_root_identity", "worker_mount_snapshot",
                          "worker_cgroup_snapshot", "worker_host_reserve", "worker_archive_open",
                          "worker_directory_setup", "worker_postgres_tools", "worker_initdb",
                          "worker_after_initdb_guard", "worker_role_setup", "worker_postgres_start",
                          "worker_after_postgres_start_guard", "worker_pg_restore_resource_guard",
                          "worker_restore", "worker_after_restore_guard", "worker_postgres_stop",
                          "worker_result_frame", "worker_done_token",
                      }
                      first_fault_kinds = {
                          "permission", "os_error", "timeout", "subprocess", "json_decode", "unicode",
                          "attribute", "index", "name", "type", "key", "value", "restore_guard_stop",
                          "backup_interrupted", "scratch_token_delivery", "runtime", "other",
                      }
                      verification_sites = {
                          "service_properties_shape", "service_resource_policy", "service_identity_state",
                          "service_cgroup_identity", "service_pid_identity", "process_cgroup_read",
                          "process_cgroup_parse", "process_cgroup_mismatch", "expected_executable_stat",
                          "proc_exe_stat", "proc_exe_mismatch", "backend_mount_identity",
                          "credential_visibility", "readonly_input_binds", "archive_exclusion",
                          "controller_expected_executable_resolve", "controller_snapshot_properties",
                          "controller_cgroup_snapshot", "controller_invocation_identity",
                          "controller_image_mount_identity", "controller_process_start_time",
                          "controller_second_snapshot_identity", "controller_start_deadline",
                          "controller_process_state", "controller_cgroup_identity_compare",
                          "controller_process_start_time_compare", "controller_completion_unit_state",
                          "controller_completion_identity",
                          "active_poll_host_guard", "active_poll_selector_wait",
                          "active_poll_stream_read", "active_poll_stream_unregister",
                          "active_poll_output_bound",
                          "worker_root_path_identity", "worker_root_mode_identity", "worker_mount_identity",
                          "worker_cgroup_identity", "worker_postgres_account_identity", "other",
                      }
                      active_poll_verification_sites = {
                          "active_poll_host_guard", "active_poll_selector_wait", "active_poll_stream_read",
                          "active_poll_stream_unregister", "active_poll_output_bound",
                      }
                      worker_identity_verification_sites = {
                          "worker_root_path_identity", "worker_root_mode_identity", "worker_mount_identity",
                          "worker_cgroup_identity", "worker_postgres_account_identity",
                      }
                      def valid_first_fault(value):
                          base = {"schema", "origin", "site", "exception_kind", "errno"}
                          allowed = {
                              frozenset(base), frozenset(base | {"disk_mount_failure_reason"}),
                              frozenset(base | {"disk_mount_failure_reason", "disk_mount_predicates"}),
                              frozenset(base | {"verification_site"}),
                              frozenset(base | {"verification_site", "disk_mount_failure_reason"}),
                              frozenset(base | {"verification_site", "disk_mount_failure_reason", "disk_mount_predicates"}),
                          }
                          if (
                              not isinstance(value, dict)
                              or frozenset(value) not in allowed
                              or type(value.get("schema")) is not int
                              or value.get("schema") != 1
                              or type(value.get("origin")) is not str
                              or value.get("origin") not in {"controller", "worker"}
                              or type(value.get("site")) is not str
                              or value.get("site") not in first_fault_sites
                              or not value["site"].startswith(value["origin"] + "_")
                              or type(value.get("exception_kind")) is not str
                              or value.get("exception_kind") not in first_fault_kinds
                          ):
                              return False
                          number = value.get("errno")
                          if number is not None and (type(number) is not int or not 1 <= number <= 4095):
                              return False
                          if value["exception_kind"] in {"permission", "os_error"}:
                              if number is None:
                                  return False
                          elif number is not None:
                              return False
                          if "verification_site" in value:
                              if (
                                  type(value["verification_site"]) is not str
                                  or value["verification_site"] not in verification_sites
                                  or (value["origin"] == "controller" and value["site"] not in {
                                      "controller_identity", "controller_completion_snapshot", "controller_final_snapshot",
                                      "controller_active_poll",
                                  })
                                  or (value["origin"] == "worker" and value["site"] not in {
                                      "worker_root_identity", "worker_mount_snapshot", "worker_cgroup_snapshot",
                                  })
                                  or (
                                      value["origin"] == "controller"
                                      and value["site"] == "controller_active_poll"
                                      and value["verification_site"] not in active_poll_verification_sites
                                  )
                                  or (
                                      value["origin"] == "controller"
                                      and value["site"] in {
                                          "controller_identity", "controller_completion_snapshot",
                                          "controller_final_snapshot",
                                      }
                                      and value["verification_site"] in active_poll_verification_sites
                                  )
                                  or (
                                      value["origin"] == "worker"
                                      and value["verification_site"] in active_poll_verification_sites
                                  )
                                  or (
                                      value["origin"] == "controller"
                                      and value["site"] in {
                                          "controller_identity", "controller_completion_snapshot",
                                          "controller_final_snapshot",
                                      }
                                      and value["verification_site"] in worker_identity_verification_sites
                                  )
                              ):
                                  return False
                          if "disk_mount_failure_reason" not in value:
                              return True
                          reasons = {
                              "mount_row_missing", "mount_metadata", "filesystem_source_root_options",
                              "filesystem_not_ext4", "source_noncanonical", "device_major_minor_invalid",
                              "sysfs_mount_unverified", "sysfs_device_unavailable", "sysfs_not_loop_device",
                              "sysfs_device_number_mismatch", "mount_root_not_global", "mountpoint_mismatch",
                              "mount_options_missing", "root_owner_mode", "root_uid_mismatch",
                              "root_gid_mismatch", "root_mode_mismatch", "statvfs_unavailable",
                              "statvfs_bound", "total_capacity_out_of_bounds", "free_below_stop",
                          }
                          if (
                              value["origin"] != "worker"
                              or value["site"] != "worker_mount_snapshot"
                              or value["exception_kind"] not in {"runtime", "os_error"}
                              or type(value["disk_mount_failure_reason"]) is not str
                              or value["disk_mount_failure_reason"] not in reasons
                          ):
                              return False
                          if "disk_mount_predicates" not in value:
                              return True
                          predicates = value["disk_mount_predicates"]
                          keys = {
                              "fs_ext4", "source_canonical", "device_major_minor_valid",
                              "sysfs_mount_verified", "sysfs_device_resolved", "sysfs_loop_device",
                              "sysfs_device_number_matches", "sysfs_backing_file_present", "root_expected",
                              "target_expected", "option_rw", "option_nosuid", "option_nodev", "option_noexec",
                          }
                          if (
                              not isinstance(predicates, dict)
                              or set(predicates) != keys
                              or any(type(item) is not bool for item in predicates.values())
                          ):
                              return False
                          reason = value["disk_mount_failure_reason"]
                          failed = {
                              "filesystem_not_ext4": not predicates["fs_ext4"],
                              "source_noncanonical": not predicates["source_canonical"],
                              "device_major_minor_invalid": not predicates["device_major_minor_valid"],
                              "sysfs_mount_unverified": not predicates["sysfs_mount_verified"],
                              "sysfs_device_unavailable": not predicates["sysfs_device_resolved"],
                              "sysfs_not_loop_device": not predicates["sysfs_loop_device"] or not predicates["sysfs_backing_file_present"],
                              "sysfs_device_number_mismatch": not predicates["sysfs_device_number_matches"],
                              "mount_root_not_global": not predicates["root_expected"],
                              "mountpoint_mismatch": not predicates["target_expected"],
                              "mount_options_missing": not all(predicates[key] for key in (
                                  "option_rw", "option_nosuid", "option_nodev", "option_noexec",
                              )),
                          }
                          if reason == "filesystem_source_root_options":
                              return any(not predicates[key] for key in (
                                  "fs_ext4", "source_canonical", "root_expected", "target_expected",
                                  "option_rw", "option_nosuid", "option_nodev", "option_noexec",
                              ))
                          return failed.get(reason) is True
                      def valid_controller_identity_failure_binding(first_fault, scratch_unit):
                          controller_identity_sites = {
                              "controller_identity", "controller_completion_snapshot", "controller_final_snapshot",
