name: Platform feature finalizer

on:
  push:
    branches:
      - fix/release-infra-audit-20260824-v2
    paths:
      - ".github/workflows/platform-feature-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/release-infra-audit-20260824-v2
          fetch-depth: 0

      - name: Apply final audit hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/apply_release_audit_final.py
          python3 platform/tests/test_platform_release_audit_hardening.py
          python3 -m py_compile platform/tests/test_platform_release_audit_hardening.py
          git diff --check

      - name: Remove transient patch machinery and push final feature tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f -- \
            .github/workflows/platform-production-ssh-enrollment.yml \
            .github/workflows/platform-feature-finalize.yml \
            .github/scripts/apply_release_audit_final.py
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(platform): pin production SSH and serialize live QA"
          git push origin HEAD:fix/release-infra-audit-20260824-v2
