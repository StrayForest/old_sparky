name: Platform load containment canary

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/platform-load-containment-canary.yml
      - platform/tools/platform_load_runtime.py
      - platform/tools/platform_load_namespace.py

permissions:
  contents: read

jobs:
  containment-canary:
    name: Probe containment and reclaim synthetic descendants
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed containment runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run capability probe and synthetic descendant canary
        shell: bash
        run: |
          set -euo pipefail
          cd platform
          env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import tempfile
          import time

          from tools.platform_load_runtime import probe_pid_namespace_capability, run_supervised

          probe = probe_pid_namespace_capability(timeout_seconds=5)
          if probe.get("available") is not True:
              raise SystemExit(f"containment capability unavailable: {probe}")
          if probe.get("protocol") != "stdio" or probe.get("unshare") != "/usr/bin/unshare":
              raise SystemExit("containment probe did not prove the exact stdio/system chain")

          synthetic = """
          import json, os, signal, time
          from pathlib import Path
          config = json.loads(Path(os.environ['PLATFORM_LOAD_WORKER_CONFIG']).read_text())
          report = Path(config['worker_report_path'])
          heartbeat = Path(config['heartbeat'])
          identities = Path(config['identities'])
          signal.signal(signal.SIGTERM, signal.SIG_IGN)

          def host_pid_and_starttime():
              nspid = None
              for line in Path('/proc/self/status').read_text(encoding='ascii').splitlines():
                  if line.startswith('NSpid:'):
                      values = line.split()[1:]
                      if values:
                          nspid = int(values[0])
                      break
              fields = Path('/proc/self/stat').read_text(encoding='ascii').rsplit(')', 1)[1].split()
              return nspid or os.getpid(), int(fields[19])

          def record(role):
              pid, starttime = host_pid_and_starttime()
              with identities.open('a', encoding='ascii') as handle:
                  handle.write(json.dumps({'role': role, 'pid': pid, 'starttime': starttime}) + '\\n')

          def nested_heartbeat():
              signal.signal(signal.SIGTERM, signal.SIG_IGN)
              record('nested-descendant')
              while True:
                  heartbeat.write_text(str(time.monotonic_ns()), encoding='ascii')
                  time.sleep(.01)

          record('worker-pid1')
          first = os.fork()
          if first == 0:
              os.setsid()
              record('setsid-intermediate')
              second = os.fork()
              if second != 0:
                  os._exit(0)
              record('double-fork-grandchild')
              nested = os.fork()
              if nested != 0:
                  os._exit(0)
              nested_heartbeat()
              os._exit(0)
          deadline = time.monotonic() + 3
          while not heartbeat.exists() and time.monotonic() < deadline:
              time.sleep(.01)
          if not heartbeat.exists() or not identities.exists():
              raise SystemExit('nested descendant did not start')
          report.write_text(json.dumps({
              'worker_report_schema': 2,
              'report_complete': True,
              'namespace_closed': False,
              'passed': False,
              'partial_work': True,
              'inflight_unknown': True,
          }) + '\\n')
          time.sleep(30)
          """
          with tempfile.TemporaryDirectory(prefix="platform-containment-canary-") as directory:
              root = Path(directory)
              worker = root / "synthetic_worker.py"
              worker.write_text(synthetic, encoding="utf-8")
              heartbeat = root / "heartbeat"
              identities = root / "identities.jsonl"
              result = run_supervised(
                  worker_command=("/usr/bin/python3", str(worker)),
                  report_path=root / "final.json",
                  worker_report_path=root / "child.json",
                  max_duration_seconds=2.0,
                  max_runner_minutes=0.1,
                  worker_config={"heartbeat": str(heartbeat), "identities": str(identities)},
                  term_grace_seconds=0.1,
                  poll_seconds=0.01,
              )
              if result.reason != "max_duration_seconds":
                  raise SystemExit(f"unexpected canary reason: {result.reason}")
              if result.namespace_closed is not True:
                  raise SystemExit("synthetic descendants did not reach namespace_closed=true")
              before = heartbeat.read_text(encoding="ascii")
              time.sleep(0.15)
              if heartbeat.read_text(encoding="ascii") != before:
                  raise SystemExit("synthetic descendant survived containment teardown")
              records = [
                  json.loads(line)
                  for line in identities.read_text(encoding="ascii").splitlines()
                  if line
              ]
              roles = {record.get("role") for record in records}
              required_roles = {
                  "worker-pid1",
                  "setsid-intermediate",
                  "double-fork-grandchild",
                  "nested-descendant",
              }
              if not required_roles.issubset(roles):
                  raise SystemExit(f"descendant identity chain incomplete: {roles}")
              for record in records:
                  pid = int(record["pid"])
                  expected_starttime = int(record["starttime"])
                  stat_path = Path(f"/proc/{pid}/stat")
                  if stat_path.exists():
                      fields = stat_path.read_text(encoding="ascii").rsplit(")", 1)[1].split()
                      if len(fields) > 19 and int(fields[19]) == expected_starttime:
                          raise SystemExit(f"captured descendant still alive: {record}")
              print(json.dumps({"probe": probe, "reason": result.reason, "namespace_closed": result.namespace_closed, "descendants": sorted(roles)}, sort_keys=True))
          PY
