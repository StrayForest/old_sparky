name: Platform security and build

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'baseline-runtime' && format('platform-baseline-runtime-v1:{0}:s{1}.{2}:a{3}.{4}:d{5}.{6}:r{7}.{8}', inputs.target_sha, inputs.source_security_run_id, inputs.source_security_run_attempt, inputs.autodeploy_run_id, inputs.autodeploy_run_attempt, inputs.production_deploy_run_id, inputs.production_deploy_run_attempt, github.run_id, github.run_attempt) || 'Platform security and build' }}

on:
  pull_request:
  push:
    branches: [dev]
  merge_group:
  workflow_dispatch:
    inputs:
      proof_mode:
        description: "Use the ordinary human CI route or the closed internal baseline-runtime proof lane"
        required: true
        default: standard
        type: choice
        options:
          - standard
          - baseline-runtime
      target_sha:
        description: "Exact target SHA (baseline-runtime only)"
        required: false
        type: string
      source_security_run_id:
        description: "Exact successful push security run ID (baseline-runtime only)"
        required: false
        type: string
      source_security_run_attempt:
        description: "Exact successful push security run attempt (baseline-runtime only)"
        required: false
        type: string
      autodeploy_run_id:
        description: "Exact successful auto-deploy run ID (baseline-runtime only)"
        required: false
        type: string
      autodeploy_run_attempt:
        description: "Exact successful auto-deploy run attempt (baseline-runtime only)"
        required: false
        type: string
      production_deploy_run_id:
        description: "Exact parent production workflow run ID (baseline-runtime only)"
        required: false
        type: string
      production_deploy_run_attempt:
        description: "Exact parent production workflow run attempt (baseline-runtime only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: platform-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classifier:
    name: CI route classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TESTED_SHA: ${{ github.sha }}
    outputs:
      class: ${{ steps.classify.outputs.class }}
      event: ${{ steps.classify.outputs.event }}
      deployable: ${{ steps.classify.outputs.deployable }}
      fallback: ${{ steps.classify.outputs.fallback }}
      runtime_sensitive: ${{ steps.classify.outputs.runtime_sensitive }}
      expected_gates: ${{ steps.classify.outputs.expected_gates }}
      target_sha: ${{ steps.classify.outputs.target_sha }}
      digest: ${{ steps.classify.outputs.digest }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout candidate history as data only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: candidate-data
          persist-credentials: false

      - name: Capture candidate changed files without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$GITHUB_EVENT_PATH" "$GITHUB_WORKSPACE/candidate-data" "$RUNNER_TEMP/platform-ci-changed-files.txt" <<'PY'
          import json
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          event_path, repo_root, output_path = sys.argv[1:]
          payload = json.loads(Path(event_path).read_text(encoding="utf-8"))
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          base = source_head = None
          if event == "push":
              base = payload.get("before")
              source_head = payload.get("after") or (payload.get("head_commit") or {}).get("id")
          elif event == "pull_request":
              pull = payload.get("pull_request") or {}
              base = (pull.get("base") or {}).get("sha")
              # The PR source head is only the changed-file diff endpoint.
              # TESTED_SHA remains github.sha, the synthetic merge commit.
              source_head = (pull.get("head") or {}).get("sha")
          sha_re = re.compile(r"^[0-9a-f]{40}$")
          if not isinstance(base, str) or not isinstance(source_head, str) or not sha_re.fullmatch(base) or not sha_re.fullmatch(source_head) or set(base) == {"0"}:
              Path(output_path).write_text("\x00\n", encoding="utf-8")
              raise SystemExit(0)
          try:
              result = subprocess.run(
                  ["git", "diff", "--name-only", "-z", base, source_head, "--"],
                  cwd=repo_root,
                  check=True,
                  capture_output=True,
              )
              raw = result.stdout.decode("utf-8", errors="strict")
          except (OSError, UnicodeError, subprocess.CalledProcessError):
              Path(output_path).write_text("\x00\n", encoding="utf-8")
              raise SystemExit(0)
          paths = raw.rstrip("\x00").split("\x00") if raw else []
          if any("\n" in path or "\r" in path for path in paths):
              Path(output_path).write_text("\x00\n", encoding="utf-8")
          else:
              Path(output_path).write_text("\n".join(paths) + ("\n" if paths else ""), encoding="utf-8")
          PY

      - name: Resolve immutable default-branch classifier source
        id: trusted_default
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BRANCH: dev
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          trusted_ref="$RUNNER_TEMP/platform-trusted-classifier-ref.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${TRUSTED_BRANCH}" \
            --output "$trusted_ref"
          /usr/bin/python3 - "$trusted_ref" "$GITHUB_OUTPUT" "$TRUSTED_BRANCH" <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branch = sys.argv[3]
          obj = payload.get("object") if isinstance(payload, dict) else None
          sha = obj.get("sha") if isinstance(obj, dict) else None
          if payload.get("ref") != f"refs/heads/{branch}" or not isinstance(obj, dict) or obj.get("type") != "commit":
              raise SystemExit("trusted default branch ref is not an immutable commit")
          if not isinstance(sha, str) or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("trusted default branch commit SHA is malformed")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"sha={sha}\n")
          PY
          rm -f -- "$trusted_ref"

      - name: Checkout trusted classifier source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.trusted_default.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Classify changed files with trusted source
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 platform/tools/platform_ci_classifier.py \
            --event "$GITHUB_EVENT_NAME" \
            --target-sha "$TESTED_SHA" \
            --branch "${GITHUB_REF_NAME:-}" \
            --event-file "$GITHUB_EVENT_PATH" \
            --files-file "$RUNNER_TEMP/platform-ci-changed-files.txt" \
            --output classifier-manifest.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish route manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-ci-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: classifier-manifest.json
          if-no-files-found: error
          retention-days: 14

  baseline-runtime-guard:
    name: Authenticate internal baseline runtime proof
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'baseline-runtime' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: read
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      SOURCE_SECURITY_RUN_ID: ${{ inputs.source_security_run_id }}
      SOURCE_SECURITY_RUN_ATTEMPT: ${{ inputs.source_security_run_attempt }}
      AUTODEPLOY_RUN_ID: ${{ inputs.autodeploy_run_id }}
      AUTODEPLOY_RUN_ATTEMPT: ${{ inputs.autodeploy_run_attempt }}
      PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
      PRODUCTION_DEPLOY_RUN_ATTEMPT: ${{ inputs.production_deploy_run_attempt }}
      PROOF_RUN_ID: ${{ github.run_id }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Validate exact current target and correlated source runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "StrayForest/old_sparky"
          test "$GITHUB_SERVER_URL" = "https://github.com"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/dev"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$GITHUB_SHA"
          for identity in "$SOURCE_SECURITY_RUN_ID" "$SOURCE_SECURITY_RUN_ATTEMPT" \
              "$AUTODEPLOY_RUN_ID" "$AUTODEPLOY_RUN_ATTEMPT" \
              "$PRODUCTION_DEPLOY_RUN_ID" "$PRODUCTION_DEPLOY_RUN_ATTEMPT" \
              "$PROOF_RUN_ID" "$PROOF_RUN_ATTEMPT"; do
            [[ "$identity" =~ ^[1-9][0-9]{0,31}$ ]]
          done
          metadata_dir="$(mktemp -d "$RUNNER_TEMP/platform-baseline-proof.XXXXXX")"
          chmod 700 "$metadata_dir"
          trap 'rm -rf -- "$metadata_dir"' EXIT
          api_headers=(
            --header "Authorization: Bearer $GH_TOKEN"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          fetch() {
            local url="$1" destination="$2"
            curl --fail-with-body --silent --show-error \
              --max-filesize 4194304 "${api_headers[@]}" "$url" --output "$destination"
            chmod 600 "$destination"
          }
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev" "$metadata_dir/dev.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/platform-security.yml" "$metadata_dir/security-workflow.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/platform-production-autodeploy.yml" "$metadata_dir/autodeploy-workflow.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/platform-production-deploy.yml" "$metadata_dir/deploy-workflow.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_SECURITY_RUN_ID}" "$metadata_dir/security-run.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${AUTODEPLOY_RUN_ID}" "$metadata_dir/autodeploy-run.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_DEPLOY_RUN_ID}" "$metadata_dir/deploy-run.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${PRODUCTION_DEPLOY_RUN_ID}/attempts/${PRODUCTION_DEPLOY_RUN_ATTEMPT}/jobs?per_page=100" "$metadata_dir/deploy-jobs.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_SECURITY_RUN_ID}/attempts/${SOURCE_SECURITY_RUN_ATTEMPT}/jobs?per_page=100" "$metadata_dir/security-jobs.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${AUTODEPLOY_RUN_ID}/attempts/${AUTODEPLOY_RUN_ATTEMPT}/jobs?per_page=100" "$metadata_dir/autodeploy-jobs.json"
          fetch "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/statuses?per_page=100&page=1" "$metadata_dir/security-statuses.json"
          /usr/bin/python3 - "$metadata_dir" "$TARGET_SHA" "$SOURCE_SECURITY_RUN_ID" "$SOURCE_SECURITY_RUN_ATTEMPT" "$AUTODEPLOY_RUN_ID" "$AUTODEPLOY_RUN_ATTEMPT" "$PRODUCTION_DEPLOY_RUN_ID" "$PRODUCTION_DEPLOY_RUN_ATTEMPT" "$PROOF_RUN_ID" "$PROOF_RUN_ATTEMPT" <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          import sys

          root = Path(sys.argv[1])
          target, security_id, security_attempt, auto_id, auto_attempt, parent_id, parent_attempt, proof_id, proof_attempt = sys.argv[2:]
          decimal = re.compile(r"[1-9][0-9]{0,31}\Z")
          sha_re = re.compile(r"[0-9a-f]{40}\Z")
          if not sha_re.fullmatch(target) or any(not decimal.fullmatch(value) for value in (security_id, security_attempt, auto_id, auto_attempt, parent_id, parent_attempt, proof_id, proof_attempt)):
              raise SystemExit("baseline proof identity is malformed")

          def read(name):
              path = root / name
              if path.stat().st_size > 4 * 1024 * 1024:
                  raise SystemExit("baseline proof API response exceeded its bound")
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError):
                  raise SystemExit("baseline proof API response is malformed") from None
              if not isinstance(value, dict):
                  raise SystemExit("baseline proof API response is malformed")
              return value

          def workflow(name, path, expected_name):
              value = read(name)
              if value.get("path") != path or value.get("name") != expected_name or type(value.get("id")) is not int or value["id"] <= 0:
                  raise SystemExit("baseline proof workflow identity mismatch")
              return value["id"]

          def run(name, workflow_id, run_id, attempt, *, event, branch, conclusion, allow_in_progress=False):
              value = read(name)
              if (
                  type(value.get("id")) is not int or str(value["id"]) != run_id
                  or type(value.get("workflow_id")) is not int or value["workflow_id"] != workflow_id
                  or value.get("run_attempt") != int(attempt)
                  or value.get("event") != event
                  or value.get("head_branch") != branch
                  or value.get("head_sha") != target
                  or value.get("path") != {
                      "security-run.json": ".github/workflows/platform-security.yml",
                      "autodeploy-run.json": ".github/workflows/platform-production-autodeploy.yml",
                      "deploy-run.json": ".github/workflows/platform-production-deploy.yml",
                  }[name]
                  or not isinstance(value.get("repository"), dict)
                  or value["repository"].get("full_name") != "StrayForest/old_sparky"
              ):
                  raise SystemExit("baseline proof run identity mismatch")
              if allow_in_progress:
                  if value.get("status") not in {"queued", "in_progress", "completed"}:
                      raise SystemExit("baseline proof parent state is invalid")
                  if value.get("status") == "completed" and value.get("conclusion") != "success":
                      raise SystemExit("baseline proof parent is not successful")
              elif value.get("status") != "completed" or value.get("conclusion") != conclusion:
                  raise SystemExit("baseline proof source run is not completed successfully")
              return value

          security_workflow_id = workflow("security-workflow.json", ".github/workflows/platform-security.yml", "Platform security and build")
          auto_workflow_id = workflow("autodeploy-workflow.json", ".github/workflows/platform-production-autodeploy.yml", "Platform production auto-deploy")
          deploy_workflow_id = workflow("deploy-workflow.json", ".github/workflows/platform-production-deploy.yml", "Platform production deploy")
          dev = read("dev.json")
          if (dev.get("name") != "dev" or not isinstance(dev.get("commit"), dict)
                  or dev["commit"].get("sha") != target):
              raise SystemExit("baseline proof target is not the exact current dev head")
          security = run("security-run.json", security_workflow_id, security_id, security_attempt, event="push", branch="dev", conclusion="success")
          auto = run("autodeploy-run.json", auto_workflow_id, auto_id, auto_attempt, event="workflow_run", branch="dev", conclusion="success")
          parent = run("deploy-run.json", deploy_workflow_id, parent_id, parent_attempt, event="workflow_dispatch", branch="dev", conclusion="success", allow_in_progress=True)
          expected_parent_title = f"Platform production deploy mode=baseline-reconcile target={target} source={security_id}.{security_attempt} auto={auto_id}.{auto_attempt}"
          if parent.get("name") != expected_parent_title or parent.get("display_title") != expected_parent_title:
              raise SystemExit("baseline proof parent mode marker mismatch")
          if parent.get("actor", {}).get("login") != "github-actions[bot]" or parent.get("status") != "in_progress":
              raise SystemExit("baseline proof parent is not the active trusted dispatcher")

          def jobs(name):
              payload = read(name)
              rows = payload.get("jobs")
              if not isinstance(rows, list) or len(rows) > 100 or payload.get("total_count") != len(rows):
                  raise SystemExit("baseline proof job list is incomplete")
              return rows

          def validate_source_security_status(status_rows, expected_url):
              if not isinstance(status_rows, list) or len(status_rows) >= 100:
                  raise SystemExit("baseline source status response is malformed or incomplete")
              status_ids = [item.get("id") for item in status_rows if isinstance(item, dict)]
              if (
                  len(status_ids) != len(status_rows)
                  or any(type(status_id) is not int or status_id <= 0 for status_id in status_ids)
                  or len(status_ids) != len(set(status_ids))
              ):
                  raise SystemExit("baseline source status identities are malformed or duplicated")

              context_rows = [item for item in status_rows if item.get("context") == "platform-security-build"]
              if not context_rows:
                  raise SystemExit("baseline source exact successful status is unavailable")
              now = datetime.now(timezone.utc)
              timestamped = []
              timestamp_re = re.compile(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\Z")
              for item in context_rows:
                  effective_raw = item.get("updated_at", item.get("created_at"))
                  if not isinstance(effective_raw, str) or timestamp_re.fullmatch(effective_raw) is None:
                      raise SystemExit("baseline source context status timestamp is malformed")
                  try:
                      effective = datetime.strptime(effective_raw, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
                  except ValueError:
                      raise SystemExit("baseline source context status timestamp is malformed") from None
                  if effective > now:
                      raise SystemExit("baseline source context status timestamp is in the future")
                  if "created_at" in item:
                      created_raw = item.get("created_at")
                      if not isinstance(created_raw, str) or timestamp_re.fullmatch(created_raw) is None:
                          raise SystemExit("baseline source context status timestamp is malformed")
                      try:
                          created = datetime.strptime(created_raw, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
                      except ValueError:
                          raise SystemExit("baseline source context status timestamp is malformed") from None
                      if created > now:
                          raise SystemExit("baseline source context status timestamp is in the future")
                  timestamped.append((effective, item))
              latest_timestamp = max(timestamp for timestamp, _ in timestamped)
              latest = [item for timestamp, item in timestamped if timestamp == latest_timestamp]
              if len(latest) != 1:
                  raise SystemExit("baseline source context status timestamp is ambiguous")
              selected = latest[0]
              creator = selected.get("creator")
              if (
                  selected.get("state") != "success"
                  or selected.get("target_url") != expected_url
                  or not isinstance(creator, dict)
                  or creator.get("login") != "github-actions[bot]"
                  or creator.get("type") != "Bot"
                  or creator.get("id") != 41898282
              ):
                  raise SystemExit("baseline source exact successful status is unavailable or superseded")

          def validate_source_security_jobs(source_jobs):
              required_source_jobs = {
                  "Backend DB-free contours", "Backend PostgreSQL and Redis integration",
                  "Backend privileged ephemeral contour", "Backend aggregate", "Python quality",
                  "Security gates", "web-quality", "Web hermetic", "Documentation consistency",
                  "Migration scenarios", "Verification contract", "status-final",
              }
              conditional_source_runtime_jobs = {
                  "Conditional release runtime fixture",
                  "Trusted dev immutable release runtime",
              }
              by_name = {}
              for item in source_jobs:
                  if not isinstance(item, dict) or not isinstance(item.get("name"), str):
                      raise SystemExit("baseline source job identity is malformed")
                  by_name.setdefault(item["name"], []).append(item)
              for name in required_source_jobs:
                  matches = by_name.get(name, [])
                  if len(matches) != 1 or matches[0].get("status") != "completed" or matches[0].get("conclusion") != "success":
                      raise SystemExit("baseline source required job is absent, duplicated, or unsuccessful")
              runtime_outcomes = []
              for name in conditional_source_runtime_jobs:
                  matches = by_name.get(name, [])
                  if len(matches) != 1 or matches[0].get("status") != "completed":
                      raise SystemExit("baseline source conditional runtime job identity is invalid")
                  runtime_outcomes.append(matches[0].get("conclusion"))
              if tuple(runtime_outcomes) not in {("success", "success"), ("skipped", "skipped")}:
                  raise SystemExit("baseline source conditional runtime jobs are incomplete or inconsistent")

          parent_jobs = jobs("deploy-jobs.json")
          dispatch_jobs = [item for item in parent_jobs if isinstance(item, dict) and item.get("name") == "Dispatch exact-target baseline runtime proof"]
          if len(dispatch_jobs) != 1 or dispatch_jobs[0].get("status") != "completed" or dispatch_jobs[0].get("conclusion") != "success":
              raise SystemExit("baseline proof parent dispatch job did not succeed exactly once")
          dispatch_steps = dispatch_jobs[0].get("steps")
          if not isinstance(dispatch_steps, list):
              raise SystemExit("baseline proof parent dispatch steps are unavailable")
          exact_steps = [item for item in dispatch_steps if isinstance(item, dict) and item.get("name") == "Dispatch exact-target baseline runtime proof"]
          if len(exact_steps) != 1 or exact_steps[0].get("status") != "completed" or exact_steps[0].get("conclusion") != "success":
              raise SystemExit("baseline proof parent dispatch step did not succeed exactly once")

          auto_jobs = jobs("autodeploy-jobs.json")
          auto_dispatch = [item for item in auto_jobs if isinstance(item, dict) and item.get("name") == "dispatch"]
          if len(auto_dispatch) != 1 or auto_dispatch[0].get("status") != "completed" or auto_dispatch[0].get("conclusion") != "success":
              raise SystemExit("baseline proof auto-deploy dispatch job did not succeed exactly once")
          auto_steps = auto_dispatch[0].get("steps")
          auto_dispatch_steps = [item for item in auto_steps if isinstance(item, dict) and item.get("name") == "Dispatch production deployment or baseline reconciliation"] if isinstance(auto_steps, list) else []
          if len(auto_dispatch_steps) != 1 or auto_dispatch_steps[0].get("status") != "completed" or auto_dispatch_steps[0].get("conclusion") != "success":
              raise SystemExit("baseline proof auto-deploy dispatch step did not succeed exactly once")

          source_jobs = jobs("security-jobs.json")
          validate_source_security_jobs(source_jobs)

          statuses_path = root / "security-statuses.json"
          try:
              if statuses_path.stat().st_size > 4 * 1024 * 1024:
                  raise SystemExit("baseline source status response exceeded its bound")
              status_rows = json.loads(statuses_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError):
              raise SystemExit("baseline source status response is malformed") from None
          expected_url = f"https://github.com/StrayForest/old_sparky/actions/runs/{security_id}/attempts/{security_attempt}"
          validate_source_security_status(status_rows, expected_url)
          print("Authenticated exact current dev target and correlated source, auto-deploy, and parent dispatch attempts.")
          PY

  status-start:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TESTED_SHA: ${{ github.sha }}
    steps:
      - name: Mark platform security build pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PROOF_MODE: ${{ inputs.proof_mode || 'standard' }}
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          SOURCE_SECURITY_RUN_ID: ${{ inputs.source_security_run_id }}
          SOURCE_SECURITY_RUN_ATTEMPT: ${{ inputs.source_security_run_attempt }}
          AUTODEPLOY_RUN_ID: ${{ inputs.autodeploy_run_id }}
          AUTODEPLOY_RUN_ATTEMPT: ${{ inputs.autodeploy_run_attempt }}
          PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          PRODUCTION_DEPLOY_RUN_ATTEMPT: ${{ inputs.production_deploy_run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$PROOF_MODE" in
              standard) context=platform-security-build ;;
              baseline-runtime)
                [[ "$TARGET_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] \
                  && test "$TARGET_SHA_INPUT" = "$TESTED_SHA" \
                  && test "$GITHUB_REF" = "refs/heads/dev" || {
                    echo "Refusing a baseline pending status without the exact current dev target." >&2
                    exit 1
                  }
                for identity in \
                    "$SOURCE_SECURITY_RUN_ID" "$SOURCE_SECURITY_RUN_ATTEMPT" \
                    "$AUTODEPLOY_RUN_ID" "$AUTODEPLOY_RUN_ATTEMPT" \
                    "$PRODUCTION_DEPLOY_RUN_ID" "$PRODUCTION_DEPLOY_RUN_ATTEMPT"; do
                  [[ "$identity" =~ ^[1-9][0-9]{0,31}$ ]] || {
                    echo "Refusing a baseline pending status with malformed correlation identity." >&2
                    exit 1
                  }
                done
                context=platform-baseline-runtime
                ;;
              *) echo "Refusing an unsupported workflow-dispatch mode." >&2; exit 1 ;;
            esac
          else
            context=platform-security-build
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" \
            --data "$(/usr/bin/python3 - "$context" "$run_url" <<'PY'
          import json
          import sys
          print(json.dumps({"state": "pending", "context": sys.argv[1], "description": "Platform security and build is running", "target_url": sys.argv[2]}))
          PY
            )"

