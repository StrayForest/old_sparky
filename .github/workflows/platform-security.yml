name: Platform security and build

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-security.yml"
      - ".github/workflows/platform-production-deploy.yml"
  push:
    branches: [dev]
    paths:
      - "platform/**"
      - ".github/workflows/platform-security.yml"
      - ".github/workflows/platform-production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: platform-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status-start:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark platform security build pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"platform-security-build\",\"description\":\"Platform security and build is running\",\"target_url\":\"${run_url}\"}"

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: platformdb_test
          POSTGRES_USER: platform_user
          POSTGRES_PASSWORD: platform_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U platform_user -d platformdb_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PLATFORM_ENVIRONMENT: test
      PLATFORM_DATABASE_URL: postgresql+asyncpg://platform_user:platform_password@127.0.0.1:5432/platformdb_test
      PLATFORM_DB_SCHEMA: platform
      PLATFORM_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      PLATFORM_REDIS_URL: redis://127.0.0.1:6379/15
      PLATFORM_CELERY_BROKER_URL: redis://127.0.0.1:6379/13
      PLATFORM_CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare production-like root checkout and identities
        run: |
          set -euo pipefail
          sudo groupadd --system oldsparky-platform
          sudo useradd --system --home-dir /opt/oldsparky --gid oldsparky-platform --shell /usr/sbin/nologin oldsparky
          sudo mkdir -p /opt/oldsparky
          sudo chown oldsparky:oldsparky-platform /opt/oldsparky
          sudo chmod 0755 /opt/oldsparky
          sudo rm -rf /root/old_sparky
          sudo mkdir -p /root/old_sparky
          sudo cp -a "$GITHUB_WORKSPACE/." /root/old_sparky/
          sudo chown -R root:root /root/old_sparky
      - name: Install pinned dependencies
        run: |
          sudo -EH python -m venv /root/old_sparky/platform/.venv_platform
          sudo -EH /root/old_sparky/platform/.venv_platform/bin/python -m pip install \
            -r /root/old_sparky/platform/requirements-platform.txt \
            -r /root/old_sparky/platform/requirements-quality.txt
      - name: Migrate isolated CI database
        run: >-
          sudo -EH bash -lc 'cd /root/old_sparky/platform &&
          .venv_platform/bin/python -m alembic upgrade head'
      - name: Unit and integration tests
        run: >-
          sudo -EH bash -lc 'cd /root/old_sparky/platform &&
          .venv_platform/bin/python -m unittest discover -s tests'
      - name: Static and dependency security gates
        run: |
          sudo -EH bash -lc '
            set -euo pipefail
            cd /root/old_sparky/platform
            .venv_platform/bin/python -m pip_audit -r requirements-platform.txt
            .venv_platform/bin/python -m ruff check apps/platform_api apps/platform_worker python_packages tools tests
            .venv_platform/bin/python -m bandit -q -r apps/platform_api apps/platform_worker python_packages tools -x tests -lll
            .venv_platform/bin/python tools/platform_secret_scan.py --root ..
          '

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/apps/platform_web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: platform/apps/platform_web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  smoke:
    name: Web smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/apps/platform_web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: platform/apps/platform_web/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        timeout-minutes: 12
        run: npx playwright install chromium

      - name: Run web smoke tests
        run: >-
          npm run test:smoke --
          --project=desktop
          --project=mobile-layout
          --grep-invert="Steam-only account is immediately usable and attaches optional email only after code confirmation|account email changes only after inline code confirmation|captain profile uses one full-width dream-slot hero picker"
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: platform-web-playwright-report
          path: platform/apps/platform_web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  status-final:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [status-start, backend, web, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Report platform security build result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Platform security or build failed"
          if [[ "$BACKEND_RESULT" == "success" && "$WEB_RESULT" == "success" && "$SMOKE_RESULT" == "success" ]]; then
            state=success
            description="Platform security and build passed"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"context\":\"platform-security-build\",\"description\":\"${description}\",\"target_url\":\"${run_url}\"}"
