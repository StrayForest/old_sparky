    name: Conditional release runtime fixture
    needs: [classifier, baseline-runtime-guard]
    if: ${{ !cancelled() && needs.classifier.result == 'success' && (needs.classifier.outputs.runtime_sensitive == 'true' || needs.classifier.outputs.fallback == 'true' || (github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'baseline-runtime')) && (github.event_name != 'workflow_dispatch' || inputs.proof_mode != 'baseline-runtime' || needs.baseline-runtime-guard.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PLATFORM_ENVIRONMENT: test
      PLATFORM_DATABASE_URL: postgresql+asyncpg://platform_user:platform_password@127.0.0.1:5432/platformdb_test
      PLATFORM_DB_SCHEMA: platform
      PLATFORM_SECRET_KEY: ci-only-release-runtime-test-secret
      PLATFORM_REDIS_URL: redis://127.0.0.1:6379/15
      PLATFORM_CELERY_BROKER_URL: redis://127.0.0.1:6379/13
      PLATFORM_CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/requirements-ci.lock.txt
      - name: Install canonical hash-locked Python CI environment
        run: platform/tools/platform_install_ci_python.sh
      - name: Provision fixed root-owned global verification lock
        run: |
          set -euo pipefail
          sudo -n "$GITHUB_WORKSPACE/platform/.venv_platform/bin/python" \
            "$GITHUB_WORKSPACE/platform/tools/platform_verification_lock.py" --provision
      - name: Run conditional canonical release runtime gate
        run: >-
          sudo -EH env XDG_RUNTIME_DIR= bash -lc "cd '$GITHUB_WORKSPACE/platform' &&
          .venv_platform/bin/python tools/platform_verify.py release-runtime"

  release-runtime-real:
    name: Trusted dev immutable release runtime
    needs: [classifier, baseline-runtime-guard]
    if: >-
      !cancelled() &&
      (
        (
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/dev'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'dev' &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      ) &&
      (github.event_name != 'workflow_dispatch' || inputs.proof_mode != 'baseline-runtime' || needs.baseline-runtime-guard.result == 'success') &&
      (needs.classifier.outputs.runtime_sensitive == 'true' ||
      needs.classifier.outputs.fallback == 'true' ||
      (inputs.proof_mode == 'baseline-runtime' && needs.baseline-runtime-guard.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck exact current dev SHA immediately before runtime build
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches/dev")"
          BRANCH_JSON="$branch_json" /usr/bin/python3 - "$TARGET_SHA" <<'PY'
          import json
          import os
          import sys
          try:
              payload = json.loads(os.environ["BRANCH_JSON"])
          except (KeyError, json.JSONDecodeError):
              raise SystemExit("current dev ref response is malformed") from None
          if payload.get("name") != "dev" or not isinstance(payload.get("commit"), dict) or payload["commit"].get("sha") != sys.argv[1]:
              raise SystemExit("target is no longer the exact current dev head")
          PY
      - name: Bind same-repository PR merge tree before runtime build
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - "$GITHUB_WORKSPACE" <<'PY'
          import os
          import re
          import subprocess
          import sys

          workspace = sys.argv[1]
          target = os.environ.get("TARGET_SHA", "")
          repository = os.environ.get("REPOSITORY", "")
          base_ref = os.environ.get("PR_BASE_REF", "")
          base_repository = os.environ.get("PR_BASE_REPOSITORY", "")
          base_sha = os.environ.get("PR_BASE_SHA", "")
          head_repository = os.environ.get("PR_HEAD_REPOSITORY", "")
          head_sha = os.environ.get("PR_HEAD_SHA", "")
          sha = re.compile(r"[0-9a-f]{40}")
          if (
              not sha.fullmatch(target)
              or not sha.fullmatch(base_sha)
              or not sha.fullmatch(head_sha)
              or not repository
              or base_ref != "dev"
              or base_repository != repository
              or head_repository != repository
          ):
              raise SystemExit("same-repository dev PR binding is invalid")
          try:
              checked_out = subprocess.run(
                  ["git", "-C", workspace, "rev-parse", "--verify", "HEAD"],
                  check=True, capture_output=True, text=True, timeout=5,
              ).stdout.strip()
              parents = subprocess.run(
                  ["git", "-C", workspace, "rev-list", "--parents", "-n", "1", target],
                  check=True, capture_output=True, text=True, timeout=5,
              ).stdout.split()
          except (OSError, subprocess.SubprocessError):
              raise SystemExit("same-repository dev PR tree is unavailable") from None
          if checked_out != target or parents != [target, base_sha, head_sha]:
              raise SystemExit("same-repository dev PR merge tree does not match the event")
          PY
      - name: Run canonical immutable release builder on trusted dev
        id: real-runtime-build
        timeout-minutes: 40
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          min_free_bytes=$((5 * 1024 * 1024 * 1024))
          failure_reason=step_failed
          release_root=""
          release_root_id=""
          artifact_sha256=""
          disk_before_bytes=""
          disk_after_bytes=""
          build_log=""
          marker_log=""
          size_projection_path=""
          public_projection_dir=""
          public_projection_dir_id=""
          public_projection_path=""
          projection_ready=0
          canonical_builder_rc=""
          builder_started=0
          diagnostic_parser="$GITHUB_WORKSPACE/platform/tools/platform_release_build_diagnostics.py"

          free_bytes() {
            local disk_path="${runner_temp:-${RUNNER_TEMP}}"
            local value
            value="$(df -B1 --output=avail -- "$disk_path" 2>/dev/null | awk 'NR == 2 {print $1}')"
            [[ "$value" =~ ^[0-9]+$ ]] || return 1
            printf '%s\n' "$value"
          }

          cleanup() {
            local workflow_rc=$?
            local canonical_rc="$canonical_builder_rc"
            local cleanup_rc=0
            local current_id=""
            local diagnostic_line=""
            local parser_rc=127
            local safe_diagnostic=""
            local sanitizer_rc=1
            local builder_run_ready=0
            local cleanup_stage=none
            local cleanup_predicate=none
            mark_cleanup_failure() {
              local stage="$1"
              local predicate="$2"
              cleanup_rc=1
              if [[ "$cleanup_stage" == "none" ]]; then
                cleanup_stage="$stage"
                cleanup_predicate="$predicate"
              fi
            }
            trap - EXIT
            set +e
            if (( builder_started == 1 )) && [[ -n "$canonical_rc" ]]; then
              builder_run_ready=1
              if [[ -n "$marker_log" ]] && sudo -n /usr/bin/test -f "$marker_log" 2>/dev/null; then
                diagnostic_line="$(sudo -n /usr/bin/python3 -I "$diagnostic_parser" --marker-log "$marker_log" 2>/dev/null)"
                parser_rc=$?
              else
                diagnostic_line="RELEASE_BUILD_DIAGNOSTIC schema=1 phase=unknown status=failed reason=build_failed cleanup=unknown reject_reason=missing"
                parser_rc=1
              fi
            fi
            if (( builder_run_ready == 1 )); then
              safe_diagnostic="$('/usr/bin/python3' -I - "$diagnostic_line" "$canonical_rc" "$parser_rc" <<'PY'
          import re
          import sys


          PHASES = {
              "canonical-preflight",
              "node-runtime",
              "source-stage",
              "web-dependencies",
              "live-qa-runtime",
              "python-wheelhouse",
              "dependency-baseline",
              "web-build",
              "release-metadata",
              "artifact-promote",
              "artifact-validate",
              "cleanup",
              "complete",
          }
          REASONS = {"ok", "build_failed", "cleanup_failed", "interrupted"}
          CLEANUP_STATES = {"not-run", "passed", "failed"}
          REQUIRED = {"schema", "phase", "status", "reason", "cleanup"}
          OPTIONAL = {"failed_phase", "source_sha", "artifact_sha256", "reject_reason"}
          REJECT_REASONS = {"oversized", "metadata", "control", "encoding", "marker", "sequence", "missing"}
          line, canonical_rc, parser_rc = sys.argv[1:]
          safe = {
              "phase": "unknown",
              "status": "failed",
              "reason": "build_failed",
              "cleanup": "unknown",
          }
          valid = False
          fields = {}
          if re.fullmatch(r"[0-9]+", canonical_rc) is None:
              canonical_display = "unknown"
          else:
              canonical_display = canonical_rc
          if re.fullmatch(r"[0-9]+", parser_rc) is None:
              parser_display = "1"
          else:
              parser_display = parser_rc
          parts = line.split()
          if parts and parts[0] == "RELEASE_BUILD_DIAGNOSTIC":
              valid = True
              for token in parts[1:]:
                  if "=" not in token:
                      valid = False
                      break
                  key, value = token.split("=", 1)
                  if key in fields or re.fullmatch(r"[a-z0-9_]+", key) is None:
                      valid = False
                      break
                  fields[key] = value
              valid = valid and set(fields) == REQUIRED | (set(fields) & OPTIONAL)
              valid = valid and fields.get("schema") == "1"
              valid = valid and fields.get("phase") in PHASES
              valid = valid and fields.get("status") in {"passed", "failed"}
              valid = valid and fields.get("reason") in REASONS
              valid = valid and fields.get("cleanup") in CLEANUP_STATES
              if valid:
                  phase = fields["phase"]
                  status = fields["status"]
                  reason = fields["reason"]
                  cleanup = fields["cleanup"]
                  failed_phase = fields.get("failed_phase")
                  source_sha = fields.get("source_sha")
                  artifact_sha = fields.get("artifact_sha256")
                  reject_reason = fields.get("reject_reason")
                  valid = failed_phase is None or failed_phase in PHASES
                  valid = valid and (reject_reason is None or reject_reason in REJECT_REASONS)
                  valid = valid and (
                      source_sha is None
                      or re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})", source_sha) is not None
                  )
                  valid = valid and (
                      artifact_sha is None
                      or re.fullmatch(r"[0-9a-f]{64}", artifact_sha) is not None
                  )
                  if status == "passed":
                      valid = valid and reason == "ok" and failed_phase is None and reject_reason is None
                      if phase == "complete":
                          valid = valid and cleanup == "passed" and source_sha is not None and artifact_sha is not None
                      elif phase == "cleanup":
                          valid = valid and cleanup == "passed" and source_sha is None and artifact_sha is None
                      else:
                          valid = valid and cleanup == "not-run" and source_sha is None and artifact_sha is None
                  else:
                      valid = valid and reason != "ok" and source_sha is None and artifact_sha is None
                      if phase == "complete":
                          valid = valid and cleanup in {"passed", "failed"} and failed_phase is not None
                      elif phase == "cleanup":
                          valid = valid and reason == "cleanup_failed" and cleanup == "failed"
                      elif phase == "unknown":
                          valid = valid and reject_reason is not None and cleanup == "unknown"
                      else:
                          valid = False
                  if valid:
                      safe.update({key: fields[key] for key in safe if fields.get(key)})
                      if reject_reason is not None:
                          safe["reject_reason"] = reject_reason
                      if failed_phase is not None:
                          safe["failed_phase"] = failed_phase
          if parser_rc != "0" and "reject_reason" not in safe:
              safe["reject_reason"] = "marker"
          consistency = "unknown"
          if valid and parser_rc == "0" and re.fullmatch(r"[0-9]+", canonical_rc):
              consistency = "match" if ((canonical_rc == "0") == (safe["status"] == "passed")) else "mismatch"
          sanitizer_rc = 0 if valid and consistency == "match" else 1
          print(
              "RELEASE_RUNTIME_BUILD_DIAGNOSTIC schema=1 "
              f"canonical_builder_rc={canonical_display} parser_rc={parser_display} "
              f"phase={safe['phase']} status={safe['status']} "
              f"reason={safe['reason']} cleanup={safe['cleanup']} consistency={consistency}"
              + (f" reject_reason={safe['reject_reason']}" if "reject_reason" in safe else "")
              + (f" failed_phase={safe['failed_phase']}" if "failed_phase" in safe else "")
          )
          raise SystemExit(sanitizer_rc)
          PY
              )"
              sanitizer_rc=$?
            else
              safe_diagnostic="RELEASE_RUNTIME_BUILD_DIAGNOSTIC schema=1 canonical_builder_rc=${canonical_rc:-unknown} parser_rc=127 phase=unknown status=failed reason=build_failed cleanup=unknown reject_reason=missing consistency=not-run"
            fi
            printf '%s\n' "$safe_diagnostic"
            if (( projection_ready == 1 && workflow_rc == 0 && canonical_rc == 0 \
              && parser_rc == 0 && sanitizer_rc == 0 )); then
              local runner_uid="$(id -u)"
              local runner_gid="$(id -g)"
              local output_metadata=""
              local output_dir_metadata=""
              local output_dir_id=""
              if [[ -z "$size_projection_path" ]]; then
                mark_cleanup_failure projection_copy source_file
              elif ! sudo -n /usr/bin/test -f "$size_projection_path" 2>/dev/null \
                || ! sudo -n /usr/bin/test ! -L "$size_projection_path" 2>/dev/null; then
                mark_cleanup_failure projection_copy source_file
              elif [[ "$(sudo -n /usr/bin/stat -c '%u:%g:%a:%h:%F' -- "$size_projection_path" 2>/dev/null)" \
                != "0:0:600:1:regular file" ]]; then
                mark_cleanup_failure projection_copy source_metadata
              elif [[ -z "$public_projection_path" || ! -f "$public_projection_path" \
                || -L "$public_projection_path" ]]; then
                mark_cleanup_failure projection_copy destination_file
              else
                output_dir_metadata="$(stat -c '%u:%g:%a:%h:%F' -- "$public_projection_dir" 2>/dev/null)"
                output_dir_id="$(stat -c '%d:%i' -- "$public_projection_dir" 2>/dev/null)"
                output_metadata="$(stat -c '%u:%g:%a:%h:%F' -- "$public_projection_path" 2>/dev/null)"
                if [[ ! -d "$public_projection_dir" || -L "$public_projection_dir" ]]; then
                  mark_cleanup_failure projection_copy directory_type
                elif [[ "$output_dir_metadata" != "${runner_uid}:${runner_gid}:700:2:directory" ]]; then
                  mark_cleanup_failure projection_copy directory_metadata
                elif [[ -z "$public_projection_dir_id" || "$output_dir_id" != "$public_projection_dir_id" ]]; then
                  mark_cleanup_failure projection_copy directory_identity
                elif [[ "$output_metadata" != "${runner_uid}:${runner_gid}:600:1:regular file" \
                  && "$output_metadata" != "${runner_uid}:${runner_gid}:600:1:regular empty file" ]]; then
                  mark_cleanup_failure projection_copy destination_metadata
                else
                  if ! sudo -n /usr/bin/install -o "$runner_uid" -g "$runner_gid" -m 0600 \
                    -- "$size_projection_path" "$public_projection_path" 2>/dev/null; then
                    mark_cleanup_failure projection_copy install_failed
                  fi
                  copied_bytes="$(stat -c '%s' -- "$public_projection_path" 2>/dev/null)"
                  if [[ ! "$copied_bytes" =~ ^[0-9]{1,5}$ ]] || (( copied_bytes > 8192 )); then
                    mark_cleanup_failure projection_copy copied_size
                  elif ! sudo -n /usr/bin/cmp -s -- "$size_projection_path" "$public_projection_path"; then
                    mark_cleanup_failure projection_copy content_mismatch
                  fi
                fi
              fi
            fi
            if [[ -n "$release_root" ]]; then
              if [[ -d "$release_root" && ! -L "$release_root" ]]; then
                current_id="$(sudo -n /usr/bin/stat -c '%d:%i' -- "$release_root" 2>/dev/null)"
                if [[ -n "$release_root_id" && "$current_id" == "$release_root_id" ]]; then
                  sudo -n /bin/rm -rf -- "$release_root" 2>/dev/null || mark_cleanup_failure release_root_remove remove_failed
                else
                  mark_cleanup_failure release_root_remove identity_mismatch
                fi
              elif [[ -e "$release_root" || -L "$release_root" ]]; then
                mark_cleanup_failure release_root_remove unexpected_entry
              fi
              [[ ! -e "$release_root" && ! -L "$release_root" ]] || mark_cleanup_failure release_root_remove residual_entry
            fi
            disk_after_bytes="$(free_bytes 2>/dev/null || true)"
            if [[ ! "$disk_after_bytes" =~ ^[0-9]+$ ]]; then
              mark_cleanup_failure disk_floor free_value_invalid
            elif (( disk_after_bytes < min_free_bytes )); then
              mark_cleanup_failure disk_floor minimum_not_met
            fi
            if (( cleanup_rc != 0 )); then
              if [[ "$cleanup_stage" == "disk_floor" ]]; then
                if [[ "$disk_after_bytes" =~ ^[0-9]{1,20}$ ]]; then
                  printf 'RELEASE_RUNTIME_BUILD schema=1 status=failed reason=cleanup stage=%s predicate=%s disk_after_bytes=%s min_free_bytes=%s\n' \
                    "$cleanup_stage" "$cleanup_predicate" "$disk_after_bytes" "$min_free_bytes"
                else
                  printf 'RELEASE_RUNTIME_BUILD schema=1 status=failed reason=cleanup stage=%s predicate=%s disk_after_bytes=unknown min_free_bytes=%s\n' \
                    "$cleanup_stage" "$cleanup_predicate" "$min_free_bytes"
                fi
              else
                printf 'RELEASE_RUNTIME_BUILD schema=1 status=failed reason=cleanup stage=%s predicate=%s\n' \
                  "$cleanup_stage" "$cleanup_predicate"
              fi
              exit 1
            fi
            if (( builder_run_ready == 1 && parser_rc != 0 )); then
              if [[ "$canonical_rc" =~ ^[1-9][0-9]*$ ]]; then
                printf 'RELEASE_RUNTIME_BUILD schema=1 status=failed reason=canonical_builder_failed diagnostic=diagnostic_parser canonical_builder_rc=%s\n' "$canonical_rc"
              else
                printf 'RELEASE_RUNTIME_BUILD schema=1 status=failed reason=diagnostic_parser\n'
              fi
              exit 1
            fi
            if (( builder_run_ready == 1 && sanitizer_rc != 0 )); then
              printf 'RELEASE_RUNTIME_BUILD schema=1 status=failed reason=diagnostic_sanitizer\n'
              exit 1
            fi
            if (( workflow_rc != 0 )); then
              printf 'RELEASE_RUNTIME_BUILD schema=1 status=failed reason=%s\n' "$failure_reason"
              exit "$workflow_rc"
            fi
            if (( builder_run_ready == 0 )); then
              printf 'RELEASE_RUNTIME_BUILD schema=1 status=failed reason=builder_not_started\n'
              exit 1
            fi
            if [[ -z "$public_projection_path" || ! -f "$public_projection_path" \
              || -L "$public_projection_path" ]]; then
              printf 'RELEASE_RUNTIME_BUILD schema=1 status=failed reason=size_projection_missing\n'
              exit 1
            fi
            printf 'projection_path=%s\n' "$public_projection_path" >>"$GITHUB_OUTPUT"
            printf 'RELEASE_RUNTIME_BUILD schema=1 status=passed source_sha=%s artifact_sha256=%s disk_before_bytes=%s disk_after_bytes=%s\n' \
              "$TARGET_SHA" "$artifact_sha256" "$disk_before_bytes" "$disk_after_bytes"
            exit 0
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { failure_reason=target_sha_invalid; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]] || { failure_reason=run_id_invalid; exit 1; }
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]] || { failure_reason=run_attempt_invalid; exit 1; }
          runner_temp="$(readlink -f -- "$RUNNER_TEMP")" || { failure_reason=temp_unavailable; exit 1; }
          [[ -d "$runner_temp" && ! -L "$RUNNER_TEMP" ]] || { failure_reason=temp_unavailable; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,31}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]] || {
            failure_reason=size_projection_temp_failed
            exit 1
          }
          public_projection_dir="$runner_temp/platform-release-size-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ ! -e "$public_projection_dir" && ! -L "$public_projection_dir" ]] || {
            failure_reason=size_projection_temp_failed
            exit 1
          }
          mkdir -m 0700 -- "$public_projection_dir" || { failure_reason=size_projection_temp_failed; exit 1; }
          public_projection_dir_id="$(stat -c '%d:%i' -- "$public_projection_dir" 2>/dev/null)" || {
            failure_reason=size_projection_temp_failed
            exit 1
          }
          [[ "$public_projection_dir_id" =~ ^[0-9]+:[0-9]+$ ]] || {
            failure_reason=size_projection_temp_failed
            exit 1
          }
          [[ "$(stat -c '%u:%g:%a:%h:%F' -- "$public_projection_dir" 2>/dev/null)" == "$(id -u):$(id -g):700:2:directory" ]] || {
            failure_reason=size_projection_temp_failed
            exit 1
          }
          printf 'projection_dir_id=%s\n' "$public_projection_dir_id" >>"$GITHUB_OUTPUT"
          public_projection_path="$public_projection_dir/measurement.json"
          : >"$public_projection_path"
          chmod 0600 "$public_projection_path" || { failure_reason=size_projection_temp_failed; exit 1; }
          [[ "$(stat -c '%u:%g:%a:%h:%F' -- "$public_projection_path" 2>/dev/null)" == "$(id -u):$(id -g):600:1:regular empty file" ]] || {
            failure_reason=size_projection_temp_failed
            exit 1
          }
          disk_before_bytes="$(free_bytes)" || { failure_reason=disk_probe_failed; exit 1; }
          (( disk_before_bytes >= min_free_bytes )) || { failure_reason=insufficient_disk; exit 1; }

          workspace_head="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD)" || {
            failure_reason=workspace_head_unavailable
            exit 1
          }
          [[ "$workspace_head" == "$TARGET_SHA" ]] || { failure_reason=workspace_sha_mismatch; exit 1; }
          [[ -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain=v1 --untracked-files=all)" ]] || {
            failure_reason=workspace_dirty
            exit 1
          }

          release_ref="gha-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_root="$(sudo -n /usr/bin/mktemp -d \
            "$runner_temp/platform-release-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX" 2>/dev/null)" || {
            failure_reason=temp_create_failed
            exit 1
          }
          case "$release_root" in
            "$runner_temp/platform-release-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."*) ;;
            *) failure_reason=temp_identity_failed; exit 1 ;;
          esac
          [[ "$(readlink -f -- "$release_root")" == "$release_root" ]] || {
            failure_reason=temp_identity_failed
            exit 1
          }
          [[ "$(sudo -n /usr/bin/stat -c '%u:%a' -- "$release_root" 2>/dev/null)" == "0:700" ]] || {
            failure_reason=temp_permissions_failed
            exit 1
          }
          release_root_id="$(sudo -n /usr/bin/stat -c '%d:%i' -- "$release_root" 2>/dev/null)" || {
            failure_reason=temp_identity_failed
            exit 1
          }

          build_root="$release_root/source"
          release_output="$build_root/platform/dist/releases"
          build_log="$release_root/canonical-builder.log"
          marker_log="$release_root/canonical-builder-phase.log"
          sudo -n /usr/bin/install -d -o root -g root -m 0700 "$build_root" 2>/dev/null
          sudo -n /bin/cp -a "$GITHUB_WORKSPACE/." "$build_root/" 2>/dev/null
          sudo -n /bin/chown -R root:root "$build_root" 2>/dev/null
          [[ "$(sudo -n /usr/bin/git -C "$build_root" rev-parse --verify HEAD 2>/dev/null)" == "$TARGET_SHA" ]] || {
            failure_reason=copied_sha_mismatch
            exit 1
          }
          sudo -n /usr/bin/env -i \
            HOME=/root \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            /usr/bin/python3 -m venv "$build_root/platform/.venv_platform" 2>/dev/null || {
            failure_reason=python_environment_failed
            exit 1
          }
          sudo -n /usr/bin/install -d -o root -g root -m 0755 "$release_output" 2>/dev/null || {
            failure_reason=release_output_failed
            exit 1
          }
          sudo -n /usr/bin/install -o root -g root -m 0600 /dev/null "$build_log" 2>/dev/null || {
            failure_reason=build_log_failed
            exit 1
          }
          sudo -n /usr/bin/install -o root -g root -m 0600 /dev/null "$marker_log" 2>/dev/null || {
            failure_reason=marker_log_failed
            exit 1
          }
          sudo -n /usr/bin/python3 -I "$build_root/platform/tools/platform_release_phase_telemetry.py" \
            --check --marker-log "$marker_log" >/dev/null 2>&1 || {
            failure_reason=marker_log_failed
            exit 1
          }

          builder_started=1
          set +e
          sudo -n /bin/bash -c \
            'build_log="$1"
             release_output="$2"
             builder="$3"
             release_ref="$4"
             marker_log="$5"
             exec >"$build_log" 2>&1
             exec /usr/bin/env -i \
               HOME=/root \
               LANG=C.UTF-8 \
               LC_ALL=C.UTF-8 \
               PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
               PLATFORM_RELEASE_OUTPUT_DIR="$release_output" \
               PLATFORM_RELEASE_PHASE_LOG="$marker_log" \
               PLATFORM_WEB_NEXT_COMPRESSION=true \
               "$builder" "$release_ref"' \
            _ "$build_log" "$release_output" \
            "$build_root/platform/tools/platform_build_release.sh" "$release_ref" "$marker_log"
          canonical_builder_rc=$?
          set -e
          [[ "$canonical_builder_rc" -eq 0 ]] || { failure_reason=canonical_builder_failed; exit "$canonical_builder_rc"; }

          archive_candidates="$(sudo -n /usr/bin/find "$release_output" -maxdepth 1 -type f \
            -name "${release_ref}-*.tar.gz" -print 2>/dev/null)" || {
            failure_reason=artifact_lookup_failed
            exit 1
          }
          [[ -n "$archive_candidates" && "$archive_candidates" != *$'\n'* ]] || {
            failure_reason=artifact_count_invalid
            exit 1
          }
          release_archive="$archive_candidates"
          release_checksum="${release_archive}.sha256"
          if ! sudo -n /usr/bin/test ! -L "$release_archive" 2>/dev/null \
            || ! sudo -n /usr/bin/test ! -L "$release_checksum" 2>/dev/null; then
            failure_reason=artifact_symlink
            exit 1
          fi
          if ! sudo -n /usr/bin/test -f "$release_archive" 2>/dev/null \
            || ! sudo -n /usr/bin/test -f "$release_checksum" 2>/dev/null; then
            failure_reason=artifact_missing
            exit 1
          fi
          archive_name="$(basename -- "$release_archive")"
          [[ "$archive_name" =~ ^([A-Za-z0-9][A-Za-z0-9._-]{0,179})\.tar\.gz$ ]] || {
            failure_reason=artifact_name_invalid
            exit 1
          }
          actual_slug="${BASH_REMATCH[1]}"
          [[ "$actual_slug" == "$release_ref-"* ]] || { failure_reason=artifact_ref_mismatch; exit 1; }

          sudo -n /usr/bin/python3 -I \
            "$build_root/platform/tools/platform_validate_release_artifact.py" \
            --artifact "$release_archive" \
            --checksum "$release_checksum" \
            --release-slug "$actual_slug" >/dev/null 2>&1 || {
            failure_reason=artifact_validation_failed
            exit 1
          }
          sudo -n /bin/bash -c \
            'cd -- "$1" && /usr/bin/sha256sum -c "$2" >/dev/null' \
            _ "$release_output" "$release_checksum" >/dev/null 2>&1 || {
            failure_reason=checksum_validation_failed
            exit 1
          }
          sudo -n /usr/bin/python3 -I - "$release_archive" "$actual_slug" "$TARGET_SHA" >/dev/null 2>&1 <<'PY'
          import json
          import re
          import sys
          import tarfile

          archive_path, expected_slug, expected_commit = sys.argv[1:]
          with tarfile.open(archive_path, mode="r:gz") as archive:
              member_name = f"{expected_slug}/RELEASE.json"
              members = [member for member in archive.getmembers() if member.name == member_name]
              if len(members) != 1 or not members[0].isreg() or members[0].size > 64 * 1024:
                  raise SystemExit("release provenance member is invalid")
              handle = archive.extractfile(members[0])
              if handle is None:
                  raise SystemExit("release provenance member is unavailable")
              payload = json.load(handle)
          if payload.get("release_slug") != expected_slug:
              raise SystemExit("release provenance slug mismatch")
          if payload.get("source_git_commit") != expected_commit:
              raise SystemExit("release provenance source mismatch")
          if payload.get("node_version") != "26.3.1":
              raise SystemExit("release provenance Node version mismatch")
          if payload.get("npm_version") != "11.16.0":
              raise SystemExit("release provenance npm version mismatch")
          if re.fullmatch(r"[0-9a-f]{40,64}", str(payload.get("source_git_commit"))) is None:
              raise SystemExit("release provenance source format is invalid")
          PY
          artifact_sha256="$(sudo -n /usr/bin/sha256sum "$release_archive" 2>/dev/null | awk '{print $1}')" || {
            failure_reason=artifact_digest_failed
            exit 1
          }
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]] || { failure_reason=artifact_digest_invalid; exit 1; }

          size_projection_path="$release_root/size-projection.json"
          sudo -n /usr/bin/install -o root -g root -m 0600 /dev/null "$size_projection_path" 2>/dev/null || {
            failure_reason=size_projection_prepare_failed
            exit 1
          }
          projection_args=(
            --measurement-root "$release_root"
            --release-slug "$actual_slug"
            --source-sha "$TARGET_SHA"
            --artifact-sha256 "$artifact_sha256"
            --event-type "$GITHUB_EVENT_NAME"
            --tested-sha "$GITHUB_SHA"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --repository "$GITHUB_REPOSITORY"
            --output "$size_projection_path"
          )
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            projection_args+=(
              --pr-head-sha "$PR_HEAD_SHA"
              --pr-base-sha "$PR_BASE_SHA"
              --pr-base-ref "$PR_BASE_REF"
              --pr-head-repository "$PR_HEAD_REPOSITORY"
              --pr-base-repository "$PR_BASE_REPOSITORY"
            )
          fi
          sudo -n /usr/bin/python3 -I \
            "$GITHUB_WORKSPACE/platform/tools/platform_release_artifact_size_projection.py" \
            "${projection_args[@]}" >/dev/null || {
            failure_reason=size_projection_failed
            exit 1
          }
          projection_ready=1

      - name: Upload evidence-only release size projection
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-release-size-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.real-runtime-build.outputs.projection_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove exact release size projection temporary directory
        if: ${{ always() }}
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROJECTION_DIR_ID: ${{ steps.real-runtime-build.outputs.projection_dir_id }}
        run: |
          set -euo pipefail
          [[ "$PROOF_RUN_ID" =~ ^[1-9][0-9]{0,31}$ && "$PROOF_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          runner_temp="$(readlink -f -- "$RUNNER_TEMP")"
          [[ -d "$runner_temp" && ! -L "$RUNNER_TEMP" ]]
          projection_dir="$runner_temp/platform-release-size-${PROOF_RUN_ID}-${PROOF_RUN_ATTEMPT}"
          if [[ -e "$projection_dir" || -L "$projection_dir" ]]; then
            [[ -d "$projection_dir" && ! -L "$projection_dir" ]]
            [[ "$PROJECTION_DIR_ID" =~ ^[0-9]+:[0-9]+$ ]]
            [[ "$(stat -c '%d:%i' -- "$projection_dir")" == "$PROJECTION_DIR_ID" ]]
            [[ "$(stat -c '%u:%g:%a:%h:%F' -- "$projection_dir")" == "$(id -u):$(id -g):700:2:directory" ]]
            projection_file="$projection_dir/measurement.json"
            [[ -f "$projection_file" && ! -L "$projection_file" ]]
            projection_file_metadata="$(stat -c '%u:%g:%a:%h:%F' -- "$projection_file")"
            [[ "$projection_file_metadata" == "$(id -u):$(id -g):600:1:regular file" \
              || "$projection_file_metadata" == "$(id -u):$(id -g):600:1:regular empty file" ]]
            rm -- "$projection_file"
            rmdir -- "$projection_dir"
          fi

  status-final:
    if: ${{ always() }}
    permissions:
      statuses: write
    needs: [classifier, baseline-runtime-guard, status-start, backend, python-quality, security, web-quality, web-hermetic, docs, migration, verification-contract, release-runtime, release-runtime-real]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report platform security build result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PROOF_MODE: ${{ inputs.proof_mode || 'standard' }}
          BASELINE_GUARD_RESULT: ${{ needs.baseline-runtime-guard.result }}
          TARGET_SHA_INPUT: ${{ inputs.target_sha }}
          SOURCE_SECURITY_RUN_ID: ${{ inputs.source_security_run_id }}
          SOURCE_SECURITY_RUN_ATTEMPT: ${{ inputs.source_security_run_attempt }}
          AUTODEPLOY_RUN_ID: ${{ inputs.autodeploy_run_id }}
          AUTODEPLOY_RUN_ATTEMPT: ${{ inputs.autodeploy_run_attempt }}
          PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          PRODUCTION_DEPLOY_RUN_ATTEMPT: ${{ inputs.production_deploy_run_attempt }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
          CLASSIFIER_RESULT: ${{ needs.classifier.result }}
          ROUTE_CLASS: ${{ needs.classifier.outputs.class }}
          ROUTE_EVENT: ${{ needs.classifier.outputs.event }}
          ROUTE_DEPLOYABLE: ${{ needs.classifier.outputs.deployable }}
          ROUTE_FALLBACK: ${{ needs.classifier.outputs.fallback }}
          ROUTE_RUNTIME_SENSITIVE: ${{ needs.classifier.outputs.runtime_sensitive }}
          ROUTE_TARGET_SHA: ${{ needs.classifier.outputs.target_sha }}
          ROUTE_DIGEST: ${{ needs.classifier.outputs.digest }}
          ROUTE_REASON: ${{ needs.classifier.outputs.reason }}
          EXPECTED_GATES: ${{ needs.classifier.outputs.expected_gates }}
          STATUS_START_RESULT: ${{ needs.status-start.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          PYTHON_QUALITY_RESULT: ${{ needs['python-quality'].result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WEB_QUALITY_RESULT: ${{ needs['web-quality'].result }}
          WEB_HERMETIC_RESULT: ${{ needs['web-hermetic'].result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          MIGRATION_RESULT: ${{ needs.migration.result }}
          VERIFICATION_CONTRACT_RESULT: ${{ needs['verification-contract'].result }}
          RELEASE_RUNTIME_RESULT: ${{ needs['release-runtime'].result }}
          RELEASE_RUNTIME_REAL_RESULT: ${{ needs['release-runtime-real'].result }}
          WORKFLOW_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          export SUMMARY_PATH="$GITHUB_WORKSPACE/platform-security-summary.json"
          passed=$(
            /usr/bin/python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected_by_class = {
              "docs-only": ["docs", "verification-contract"],
              "out-of-scope": ["verification-contract"],
              "full": [
                  "backend", "python-quality", "security", "migration", "docs",
                  "web-quality", "web-hermetic", "verification-contract",
              ],
          }
          # A full route can be CI-only. Keep the deployable authority bit
          # independent from gate coverage so candidate packaging can pass
          # every required check without authorizing production.
          route_class = os.environ.get("ROUTE_CLASS", "")
          route_event = os.environ.get("ROUTE_EVENT", "")
          event_name = os.environ.get("EVENT_NAME", "")
          proof_mode = os.environ.get("PROOF_MODE", "")
          baseline_mode = event_name == "workflow_dispatch" and proof_mode == "baseline-runtime"
          raw_runtime_sensitive = os.environ.get("ROUTE_RUNTIME_SENSITIVE", "")
          route_errors = []
          if event_name == "workflow_dispatch" and proof_mode not in {"standard", "baseline-runtime"}:
              route_errors.append("workflow-dispatch proof mode is missing or invalid")
          if baseline_mode and os.environ.get("BASELINE_GUARD_RESULT") != "success":
              route_errors.append("internal baseline proof authentication did not succeed")
          if raw_runtime_sensitive not in {"true", "false"}:
              route_errors.append("classifier runtime-sensitive output is missing or malformed")
          runtime_sensitive = raw_runtime_sensitive == "true"
          try:
              expected = json.loads(os.environ.get("EXPECTED_GATES") or "null")
          except (TypeError, json.JSONDecodeError):
              expected = None
          if route_class not in expected_by_class:
              route_errors.append("classifier route class is missing or invalid")
          elif expected != expected_by_class[route_class]:
              route_errors.append("classifier expected gates do not match its class")
          if route_event != event_name:
              route_errors.append("classifier event does not match the workflow event")
          tested_sha = os.environ.get("TESTED_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", tested_sha):
              route_errors.append("tested SHA is missing")
          route_target_sha = os.environ.get("ROUTE_TARGET_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", route_target_sha):
              route_errors.append("classifier target SHA is missing")
          elif route_target_sha != tested_sha:
              route_errors.append("classifier target SHA does not match the tested SHA")
          if baseline_mode:
              if os.environ.get("TARGET_SHA_INPUT", "") != tested_sha:
                  route_errors.append("internal baseline target does not match the tested SHA")
              if os.environ.get("WORKFLOW_REF", "") != "refs/heads/dev":
                  route_errors.append("internal baseline proof is not running on trusted dev")
          route_digest = os.environ.get("ROUTE_DIGEST", "")
          if not re.fullmatch(r"[0-9a-f]{64}", route_digest):
              route_errors.append("classifier digest is missing")
          if not os.environ.get("ROUTE_REASON", ""):
              route_errors.append("classifier reason is missing")
          if os.environ.get("ROUTE_DEPLOYABLE") not in {"true", "false"}:
              route_errors.append("classifier deployable output is missing")
          raw_fallback = os.environ.get("ROUTE_FALLBACK", "")
          if raw_fallback not in {"true", "false"}:
              route_errors.append("classifier fallback output is missing")
          published_event = os.environ.get("EVENT_NAME") in {"push", "workflow_dispatch"}
          if published_event and os.environ.get("STATUS_START_RESULT") != "success":
              route_errors.append("status-start did not succeed before status publication")
          results = {
              "backend": os.environ.get("BACKEND_RESULT", "missing"),
              "python-quality": os.environ.get("PYTHON_QUALITY_RESULT", "missing"),
              "security": os.environ.get("SECURITY_RESULT", "missing"),
              "web-quality": os.environ.get("WEB_QUALITY_RESULT", "missing"),
              "web-hermetic": os.environ.get("WEB_HERMETIC_RESULT", "missing"),
              "docs": os.environ.get("DOCS_RESULT", "missing"),
              "migration": os.environ.get("MIGRATION_RESULT", "missing"),
              "verification-contract": os.environ.get("VERIFICATION_CONTRACT_RESULT", "missing"),
          }
          required_expected = expected_by_class["full"] if baseline_mode else expected
          missing_or_failed = [
              gate for gate in required_expected if results.get(gate) != "success"
          ] if isinstance(required_expected, list) else ["classifier expected gates are malformed"]
          release_runtime_result = os.environ.get("RELEASE_RUNTIME_RESULT", "missing")
          real_runtime_result = os.environ.get("RELEASE_RUNTIME_REAL_RESULT", "skipped")
          requires_release_runtime = baseline_mode or runtime_sensitive or raw_fallback == "true"
          repository = os.environ.get("REPOSITORY", "")
          same_repository_dev_pr = (
              event_name == "pull_request"
              and os.environ.get("PR_BASE_REF") == "dev"
              and os.environ.get("PR_BASE_REPOSITORY") == repository
              and os.environ.get("PR_HEAD_REPOSITORY") == repository
              and bool(repository)
          )
          trusted_real_event = (
              (event_name == "push" and os.environ.get("WORKFLOW_REF") == "refs/heads/dev")
              or (
                  event_name == "workflow_dispatch"
                  and os.environ.get("WORKFLOW_REF") == "refs/heads/dev"
              )
              or same_repository_dev_pr
          )
          requires_real_release_runtime = requires_release_runtime and trusted_real_event
          if requires_release_runtime:
              if release_runtime_result != "success":
                  missing_or_failed.append("release-runtime")
          elif release_runtime_result != "skipped":
              route_errors.append("release-runtime must be skipped for a non-sensitive non-fallback route")
          if requires_real_release_runtime:
              if real_runtime_result != "success":
                  missing_or_failed.append("release-runtime-real")
          elif real_runtime_result not in {"", "skipped"}:
              route_errors.append("real release-runtime must be skipped outside trusted dev or same-repository dev PR routes")
          passed = (
              os.environ.get("CLASSIFIER_RESULT") == "success"
              and not route_errors
              and not missing_or_failed
          )
          summary = {
              "schema": 1,
              "tested_sha": os.environ.get("TESTED_SHA", ""),
              "event": os.environ.get("EVENT_NAME", ""),
              "proof_mode": proof_mode if baseline_mode else "standard",
              "proof_run_id": os.environ.get("PROOF_RUN_ID", ""),
              "proof_run_attempt": os.environ.get("PROOF_RUN_ATTEMPT", ""),
              "baseline_guard_result": os.environ.get("BASELINE_GUARD_RESULT", "missing"),
              "route_event": route_event,
              "class": os.environ.get("ROUTE_CLASS", ""),
              "reason": os.environ.get("ROUTE_REASON", ""),
              "deployable": os.environ.get("ROUTE_DEPLOYABLE", "") == "true",
              "fallback": os.environ.get("ROUTE_FALLBACK", "") == "true",
              "manifest_digest": os.environ.get("ROUTE_DIGEST", ""),
              "expected_gates": required_expected,
              "gate_results": results,
              "conditional_gate_results": {
                  "release-runtime": release_runtime_result,
                  "release-runtime-real": real_runtime_result,
              },
              "runtime_sensitive": runtime_sensitive,
              "requires_release_runtime": requires_release_runtime,
              "requires_real_release_runtime": requires_real_release_runtime,
              "missing_or_failed": missing_or_failed,
              "route_errors": route_errors,
              "status_start_result": os.environ.get("STATUS_START_RESULT", "missing"),
              "passed": passed,
          }
          Path(os.environ["SUMMARY_PATH"]).write_text(
              json.dumps(summary, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print("true" if passed else "false")
          PY
          )

          state=failure
          description="Platform security or build failed"
          if [[ "$passed" == "true" ]]; then
            state=success
            description="Platform security and build passed"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              case "$PROOF_MODE" in
                standard) status_context=platform-security-build ;;
                baseline-runtime) status_context=platform-baseline-runtime ;;
                *) echo "Refusing to publish an unsupported workflow-dispatch status." >&2; exit 1 ;;
              esac
            else
              status_context=platform-security-build
            fi
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$PROOF_MODE" != "baseline-runtime" ]]; then
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" \
                --data "$(/usr/bin/python3 - "$state" "$description" "$run_url" "$status_context" <<'PY'
          import json
          import sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": sys.argv[4],
              "description": sys.argv[2],
              "target_url": sys.argv[3],
          }))
          PY
                )"
            fi
          fi
          [[ "$state" == "success" ]] || exit 1

      - name: Write exact baseline proof correlation receipt
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'baseline-runtime' }}
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          SOURCE_SECURITY_RUN_ID: ${{ inputs.source_security_run_id }}
          SOURCE_SECURITY_RUN_ATTEMPT: ${{ inputs.source_security_run_attempt }}
          AUTODEPLOY_RUN_ID: ${{ inputs.autodeploy_run_id }}
          AUTODEPLOY_RUN_ATTEMPT: ${{ inputs.autodeploy_run_attempt }}
          PRODUCTION_DEPLOY_RUN_ID: ${{ inputs.production_deploy_run_id }}
          PRODUCTION_DEPLOY_RUN_ATTEMPT: ${{ inputs.production_deploy_run_attempt }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$GITHUB_WORKSPACE/platform-baseline-runtime-receipt.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          decimal = re.compile(r"[1-9][0-9]{0,31}\Z")
          sha = os.environ.get("TARGET_SHA", "")
          if re.fullmatch(r"[0-9a-f]{40}", sha) is None:
              raise SystemExit("baseline proof receipt target is malformed")
          identities = {
              key: os.environ.get(key, "")
              for key in (
                  "SOURCE_SECURITY_RUN_ID", "SOURCE_SECURITY_RUN_ATTEMPT",
                  "AUTODEPLOY_RUN_ID", "AUTODEPLOY_RUN_ATTEMPT",
                  "PRODUCTION_DEPLOY_RUN_ID", "PRODUCTION_DEPLOY_RUN_ATTEMPT",
              )
          }
          if any(decimal.fullmatch(value) is None for value in identities.values()):
              raise SystemExit("baseline proof receipt correlation is malformed")
          receipt = {
              "schema": 1,
              "proof_mode": "baseline-runtime",
              "target_sha": sha,
              "source_security_run_id": identities["SOURCE_SECURITY_RUN_ID"],
              "source_security_run_attempt": identities["SOURCE_SECURITY_RUN_ATTEMPT"],
              "autodeploy_run_id": identities["AUTODEPLOY_RUN_ID"],
              "autodeploy_run_attempt": identities["AUTODEPLOY_RUN_ATTEMPT"],
              "production_deploy_run_id": identities["PRODUCTION_DEPLOY_RUN_ID"],
              "production_deploy_run_attempt": identities["PRODUCTION_DEPLOY_RUN_ATTEMPT"],
              "proof_run_id": os.environ["GITHUB_RUN_ID"],
              "proof_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "required_gates": [
                  "backend", "python-quality", "security", "migration", "docs",
                  "web-quality", "web-hermetic", "verification-contract",
                  "release-runtime", "release-runtime-real",
              ],
          }
          for key in ("proof_run_id", "proof_run_attempt"):
              if decimal.fullmatch(receipt[key]) is None:
                  raise SystemExit("baseline proof receipt identity is malformed")
          Path(sys.argv[1]).write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Upload baseline proof correlation receipt
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'baseline-runtime' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-baseline-runtime-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-baseline-runtime-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish machine-readable CI summary
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-ci-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-security-summary.json
          if-no-files-found: error
          retention-days: 14

  dispatch-baseline-runtime-finalizer:
    name: Dispatch exact baseline proof finalizer
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.proof_mode == 'baseline-runtime' &&
      needs.status-final.result == 'success'
    needs: [status-final]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch the exact completed proof attempt to the terminal status finalizer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PROOF_MODE: ${{ inputs.proof_mode }}
          PROOF_TARGET_SHA: ${{ inputs.target_sha }}
          PROOF_RUN_ID: ${{ github.run_id }}
          PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$PROOF_MODE" = baseline-runtime
          test "$GITHUB_REF" = refs/heads/dev
          [[ "$PROOF_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] && test "$PROOF_TARGET_SHA" = "$GITHUB_SHA"
          [[ "$PROOF_RUN_ID" =~ ^[1-9][0-9]{0,31}$ ]]
          [[ "$PROOF_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,31}$ ]]
          test -n "$GH_TOKEN"
          payload="$(mktemp "$RUNNER_TEMP/platform-baseline-finalizer-dispatch.XXXXXX")"
          chmod 600 "$payload"
          trap 'rm -f -- "$payload"' EXIT
          /usr/bin/python3 - "$payload" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys

          run_id = os.environ["PROOF_RUN_ID"]
          attempt = os.environ["PROOF_RUN_ATTEMPT"]
          if re.fullmatch(r"[1-9][0-9]{0,31}", run_id) is None or re.fullmatch(r"[1-9][0-9]{0,31}", attempt) is None:
              raise SystemExit("proof finalizer identity is malformed")
          Path(sys.argv[1]).write_text(
              json.dumps({
                  "ref": "dev",
                  "inputs": {
                      "proof_run_id": run_id,
                      "proof_run_attempt": attempt,
                  },
              }, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="ascii",
          )
          PY
          response_code="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/platform-security-status-finalizer.yml/dispatches")"
          test "$response_code" = 204 || {
            echo "Exact baseline finalizer dispatch was not accepted." >&2
            exit 1
          }
