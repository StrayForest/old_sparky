          set -euo pipefail
          mkdir -p platform/ci-backend/verification-contract
          cd platform
          .venv_platform/bin/python tools/platform_verify.py verification-contract \
            --manifest ci-backend/verification-contract/manifest.json \
            --summary ci-backend/verification-contract/summary.json --quiet
      - name: Upload verification contract evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: platform-verification-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/ci-backend/verification-contract
          if-no-files-found: error
          retention-days: 14

