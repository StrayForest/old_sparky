name: Platform production storage diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact source SHA currently deployed on the production VPS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  collect:
    name: Collect read-only storage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Validate diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production storage diagnostics must run from dev." >&2; exit 1; }

          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "expected_sha must be a lowercase 40-character commit SHA." >&2; exit 1; }

      - name: Validate production SSH inputs
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured." >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured." >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured." >&2; exit 1; }

      - name: Configure pinned production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-storage-diagnostics-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Collect read-only storage evidence
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          umask 077
          remote_report="$RUNNER_TEMP/platform-production-storage-diagnostics.txt"
          ssh_error="$RUNNER_TEMP/platform-production-storage-diagnostics-ssh-error"
          : >"$remote_report"
          : >"$ssh_error"
          chmod 600 "$remote_report" "$ssh_error"
          if ! ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            bash -s -- "$EXPECTED_SHA" > "$remote_report" 2> "$ssh_error" <<'REMOTE'
          set -Eeuo pipefail

          expected_sha="$1"
          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          python_bin="$runtime/shared/venv/bin/python"
          summary_tool="$current/tools/platform_storage_evidence_summary.py"
          input_guard="$current/tools/platform_workflow_input_guard.py"

          test "$(id -u)" -eq 0 || { echo "Production diagnostics must run as root." >&2; exit 1; }
          test -f "$input_guard" && test ! -L "$input_guard" \
            || { echo "Workflow input guard is missing or unsafe." >&2; exit 1; }
          /usr/bin/python3 -I "$input_guard" sha --value "$expected_sha" >/dev/null \
            || { echo "expected_sha is invalid." >&2; exit 1; }
          test -L "$current" || { echo "Current release symlink is missing." >&2; exit 1; }
          test -x "$python_bin" || { echo "Shared Python runtime is missing." >&2; exit 1; }
          test -f "$summary_tool" && test ! -L "$summary_tool" \
            || { echo "Storage evidence summary helper is missing or unsafe." >&2; exit 1; }

          active_sha="$(/usr/bin/python3 -I - "$current/RELEASE.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(payload.get("source_git_commit") or "")
          PY
          )"
          test "$active_sha" = "$expected_sha" \
            || { echo "active release SHA differs from expected_sha." >&2; exit 1; }

          current_id="$(basename "$(readlink -f "$current")")"
          [[ "$current_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,179}$ ]] \
            || { echo "active release identifier is invalid." >&2; exit 1; }
          printf '{"schema":1,"kind":"platform_storage_diagnostics","active_release_id":"%s","active_source_sha":"%s"}\n' \
            "$current_id" "$active_sha"

          echo '=== retained_load_lock ==='
          retained_load_lock=/run/lock/oldsparky-retained-load-matrix.lock
          exec 9>"$retained_load_lock"
          if flock -n 9; then
            lock_state=unlocked
            flock -u 9
          else
            lock_state=held
          fi
          exec 9>&-
          printf 'state=%s\n' "$lock_state" \
            | /usr/bin/python3 -I "$summary_tool" --mode lock

          echo '=== filesystem_usage ==='
          emit_disk_usage() {
            local category="$1"
            local path="$2"
            local bytes_output inode_output
            bytes_output="$(df -B1 --output=size,used,avail,pcent -- "$path" 2>/dev/null)" \
              || { echo "disk usage producer failed." >&2; exit 1; }
            printf '%s\n' "$bytes_output" \
              | /usr/bin/python3 -I "$summary_tool" --mode df --category "$category"
            inode_output="$(df --output=iused,iavail,ipcent -- "$path" 2>/dev/null)" \
              || { echo "inode usage producer failed." >&2; exit 1; }
            printf '%s\n' "$inode_output" \
              | /usr/bin/python3 -I "$summary_tool" --mode inode --category "$category"
          }
          emit_disk_usage root /
          emit_disk_usage tmp /tmp
          emit_disk_usage var_tmp /var/tmp
          emit_disk_usage platform_runtime /opt/oldsparky/platform
          emit_disk_usage logs /var/log

          echo '=== journal_usage ==='
          journal_usage="$(journalctl --disk-usage --no-pager 2>/dev/null)" \
            || { echo "journal usage producer failed." >&2; exit 1; }
          printf '%s\n' "$journal_usage" \
            | /usr/bin/python3 -I "$summary_tool" --mode journal

          echo '=== service_sandbox ==='
          for service in deadlock-api deadlock-worker deadlock-web; do
            service_output="$(systemctl show "$service" \
              --property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,NRestarts,MemoryCurrent,MemoryPeak,MemoryMax,TasksCurrent,TasksMax,CPUUsageNSec \
              --no-pager 2>/dev/null)" \
              || { echo "service state producer failed." >&2; exit 1; }
            printf '%s\n' "$service_output" \
              | /usr/bin/python3 -I "$summary_tool" --mode service --service "$service"
          done

          echo '=== known_category_usage ==='
          emit_category_size() {
            local category="$1"
            local path="$2"
            local size_output
            if [[ -e "$path" && ! -L "$path" ]]; then
              size_output="$(timeout 90s du -x -s -B1 -- "$path" 2>/dev/null)" \
                || { echo "category size producer failed." >&2; exit 1; }
            else
              size_output='0'
            fi
            printf '%s\n' "$size_output" \
              | /usr/bin/python3 -I "$summary_tool" --mode du --category "$category"
          }
          emit_category_size source_release_artifacts "$runtime/dist/releases"
          emit_category_size browser_test_artifacts "$runtime/apps/platform_web"
          emit_category_size preprod_screenshots "$runtime/shared/preprod-screenshots"
          emit_category_size live_qa_runtime /var/lib/oldsparky-liveqa
          emit_category_size backups "$runtime/shared/backups"

          echo '=== storage_retention_dry_run ==='
          retention_file="$(mktemp)"
          trap 'rm -f -- "$retention_file"' EXIT
          "$python_bin" "$current/tools/platform_storage_maintenance.py" --json \
            >"$retention_file" 2>/dev/null \
            || { echo "storage retention producer failed." >&2; exit 1; }
          /usr/bin/python3 -I "$summary_tool" --mode retention <"$retention_file" \
            || { echo "storage retention summary failed." >&2; exit 1; }
          REMOTE
          then
            echo "Production storage diagnostics collection failed." >&2
            exit 1
          fi
          cp "$remote_report" "$RUNNER_TEMP/platform-production-storage-diagnostics-artifact.txt"
          chmod 600 "$RUNNER_TEMP/platform-production-storage-diagnostics-artifact.txt"
          rm -f -- "$remote_report"
          test ! -e "$remote_report"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-storage-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- "$RUNNER_TEMP/platform-production-storage-diagnostics.txt"
          test ! -e "$RUNNER_TEMP/platform-production-storage-diagnostics.txt"
          rm -f -- "$RUNNER_TEMP/platform-production-storage-diagnostics-ssh-error"
          test ! -e "$RUNNER_TEMP/platform-production-storage-diagnostics-ssh-error"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Upload storage diagnostic evidence
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-production-storage-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-production-storage-diagnostics-artifact.txt
          if-no-files-found: error
          retention-days: 14
