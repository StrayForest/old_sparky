name: Platform production storage diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact source SHA currently deployed on the production VPS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  collect:
    name: Collect read-only storage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Validate diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production storage diagnostics must run from dev." >&2; exit 1; }

          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "expected_sha must be a lowercase 40-character commit SHA." >&2; exit 1; }

      - name: Validate production SSH inputs
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured." >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured." >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured." >&2; exit 1; }

      - name: Configure pinned production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-storage-diagnostics-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null \
              && awk -v host="$PROD_SSH_HOST" 'NR == 1 && NF == 3 && $1 == host && $2 == "ssh-ed25519" { valid=1; next } { invalid=1 } END { exit !(NR == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Collect read-only storage evidence
        id: collect_storage
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          umask 077
          remote_report="$RUNNER_TEMP/platform-production-storage-diagnostics.txt"
          ssh_error="$RUNNER_TEMP/platform-production-storage-diagnostics-ssh-error"
          artifact_report="$RUNNER_TEMP/platform-production-storage-diagnostics-artifact.txt"
          : >"$remote_report"
          : >"$ssh_error"
          chmod 600 "$remote_report" "$ssh_error"
          set +e
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            bash -s -- "$EXPECTED_SHA" > "$remote_report" 2> "$ssh_error" <<'REMOTE'
          set -Eeuo pipefail
          CURRENT_STAGE=identity
          trap 'diagnostic_rc=$?; trap - ERR; printf "{\"schema\":1,\"kind\":\"collection_failure\",\"status\":\"failed\",\"stage\":\"%s\",\"outcome\":\"producer_failed\",\"exit_code\":%d}\n" "$CURRENT_STAGE" "$diagnostic_rc"; exit "$diagnostic_rc"' ERR
          report_failure() {
            local failed_stage="$1"
            local outcome="$2"
            local exit_code="$3"
            printf '{"schema":1,"kind":"collection_failure","status":"failed","stage":"%s","outcome":"%s","exit_code":%d}\n' \
              "$failed_stage" "$outcome" "$exit_code"
            exit "$exit_code"
          }

          expected_sha="$1"
          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          python_bin="$runtime/shared/venv/bin/python"
          summary_tool="$current/tools/platform_storage_evidence_summary.py"
          backup_tool="$current/tools/platform_backup_restore_drill.py"
          input_guard="$current/tools/platform_workflow_input_guard.py"
          backup_file=""
          timer_file=""
          timer_dir=""
          retention_file=""
          cleanup_private_files() {
            [[ -z "$backup_file" ]] || rm -f -- "$backup_file"
            [[ -z "$timer_file" ]] || rm -f -- "$timer_file"
            [[ -z "$timer_dir" ]] || rmdir -- "$timer_dir" 2>/dev/null || true
            [[ -z "$retention_file" ]] || rm -f -- "$retention_file"
          }
          trap cleanup_private_files EXIT

          test "$(id -u)" -eq 0 || report_failure identity privilege_required 1
          test -f "$input_guard" && test ! -L "$input_guard" \
            || report_failure identity input_guard_unavailable 1
          /usr/bin/python3 -I "$input_guard" sha --value "$expected_sha" >/dev/null \
            || report_failure identity input_invalid 1
          test -L "$current" || report_failure identity current_pointer_unavailable 1
          test -x "$python_bin" || report_failure identity python_unavailable 1
          test -f "$summary_tool" && test ! -L "$summary_tool" \
            || report_failure identity summary_helper_unavailable 1
          test -f "$backup_tool" && test ! -L "$backup_tool" \
            || report_failure identity backup_check_unavailable 1

          release_identity="$(/usr/bin/python3 -I - "$runtime" "$expected_sha" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          runtime = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          sha_re = re.compile(r"[0-9a-f]{40}\Z")
          slug_re = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,179}\Z")

          def pairs_no_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError
                  result[key] = value
              return result

          def stable_release(pointer):
              before = pointer.lstat()
              if not stat.S_ISLNK(before.st_mode):
                  raise ValueError
              link_text = os.readlink(pointer)
              target = pointer.resolve(strict=True)
              releases = (runtime / "releases").resolve(strict=True)
              if target.parent != releases or not slug_re.fullmatch(target.name):
                  raise ValueError
              release_file = target / "RELEASE.json"
              named = release_file.lstat()
              if (
                  not stat.S_ISREG(named.st_mode)
                  or named.st_uid != os.geteuid()
                  or named.st_nlink != 1
                  or named.st_size <= 0
                  or named.st_size > 65536
              ):
                  raise ValueError
              descriptor = os.open(
                  release_file,
                  os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | os.O_NOFOLLOW,
              )
              try:
                  opened = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(opened.st_mode)
                      or opened.st_uid != os.geteuid()
                      or opened.st_nlink != 1
                      or (opened.st_dev, opened.st_ino, opened.st_size)
                      != (named.st_dev, named.st_ino, named.st_size)
                  ):
                      raise ValueError
                  chunks = []
                  remaining = 65537
                  while remaining:
                      chunk = os.read(descriptor, min(8192, remaining))
                      if not chunk:
                          break
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  raw = b"".join(chunks)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              after_named = release_file.lstat()
              pointer_after = pointer.lstat()
              if (
                  len(raw) != named.st_size
                  or (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns)
                  != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)
                  or (named.st_dev, named.st_ino, named.st_size, named.st_mtime_ns)
                  != (after_named.st_dev, after_named.st_ino, after_named.st_size, after_named.st_mtime_ns)
                  or (before.st_dev, before.st_ino, before.st_mtime_ns)
                  != (pointer_after.st_dev, pointer_after.st_ino, pointer_after.st_mtime_ns)
                  or os.readlink(pointer) != link_text
              ):
                  raise ValueError
              payload = json.loads(raw, object_pairs_hook=pairs_no_duplicates)
              if (
                  not isinstance(payload, dict)
                  or payload.get("release_slug") != target.name
                  or not isinstance(payload.get("source_git_commit"), str)
                  or not sha_re.fullmatch(payload["source_git_commit"])
              ):
                  raise ValueError
              return target.name, payload["source_git_commit"]

          try:
              if not sha_re.fullmatch(expected_sha):
                  raise ValueError
              current_id, active_sha = stable_release(runtime / "current")
              previous_id, previous_sha = stable_release(runtime / "previous")
              if active_sha != expected_sha or current_id == previous_id:
                  raise ValueError
              print("\t".join((current_id, active_sha, previous_id, previous_sha)))
          except Exception:
              raise SystemExit(2)
          PY
          )" \
            || report_failure identity release_identity_unavailable 1
          IFS=$'\t' read -r current_id active_sha previous_id previous_sha <<<"$release_identity"
          [[ "$current_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,179}$ && \
             "$previous_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,179}$ && \
             "$active_sha" =~ ^[0-9a-f]{40}$ && "$previous_sha" =~ ^[0-9a-f]{40}$ ]] \
            || report_failure identity release_identity_invalid 1
          printf '{"schema":1,"kind":"platform_storage_diagnostics","active_release_id":"%s","active_source_sha":"%s","previous_release_id":"%s","previous_source_sha":"%s"}\n' \
            "$current_id" "$active_sha" "$previous_id" "$previous_sha"

          CURRENT_STAGE=retained_load_lock
          retained_load_lock=/run/lock/oldsparky-retained-load-matrix.lock
          lock_state="$(/usr/bin/python3 -I - "$retained_load_lock" 2>/dev/null <<'PY'
          import errno
          import fcntl
          import os
          from pathlib import Path
          import stat
          import sys

          lock_path = Path(sys.argv[1])
          lock_root = Path("/run/lock")
          if (
              os.geteuid() != 0
              or lock_path.parent != lock_root
              or not hasattr(os, "O_NOFOLLOW")
          ):
              raise SystemExit(2)
          try:
              root_info = lock_root.lstat()
              root_resolved = lock_root.resolve(strict=True)
              named = lock_path.lstat()
          except OSError:
              raise SystemExit(2)
          root_mode = stat.S_IMODE(root_info.st_mode)
          if (
              root_resolved != lock_root
              or stat.S_ISLNK(root_info.st_mode)
              or not stat.S_ISDIR(root_info.st_mode)
              or root_info.st_uid != 0
              or (root_mode & 0o022 and not root_mode & 0o1000)
              or not stat.S_ISREG(named.st_mode)
              or named.st_uid != 0
              or named.st_gid != 0
              or named.st_nlink != 1
              or stat.S_IMODE(named.st_mode) != 0o600
          ):
              raise SystemExit(2)
          descriptor = os.open(
              lock_path,
              os.O_RDWR | getattr(os, "O_CLOEXEC", 0) | os.O_NOFOLLOW,
          )
          try:
              opened = os.fstat(descriptor)
              current = lock_path.lstat()
              if (
                  not stat.S_ISREG(opened.st_mode)
                  or opened.st_uid != 0
                  or opened.st_gid != 0
                  or opened.st_nlink != 1
                  or stat.S_IMODE(opened.st_mode) != 0o600
                  or not stat.S_ISREG(current.st_mode)
                  or current.st_uid != 0
                  or current.st_gid != 0
                  or current.st_nlink != 1
                  or stat.S_IMODE(current.st_mode) != 0o600
                  or (opened.st_dev, opened.st_ino) != (current.st_dev, current.st_ino)
                  or (named.st_dev, named.st_ino) != (current.st_dev, current.st_ino)
              ):
                  raise SystemExit(2)
              try:
                  fcntl.flock(descriptor, fcntl.LOCK_EX | fcntl.LOCK_NB)
              except OSError as exc:
                  if exc.errno in {errno.EACCES, errno.EAGAIN}:
                      print("state=held")
                      raise SystemExit(0)
                  raise
              fcntl.flock(descriptor, fcntl.LOCK_UN)
              print("state=unlocked")
          finally:
              os.close(descriptor)
          PY
          )"
          printf '%s\n' "$lock_state" \
            | /usr/bin/python3 -I "$summary_tool" --mode lock

          CURRENT_STAGE=filesystem_usage
          emit_disk_usage() {
            local category="$1"
            local path="$2"
            local bytes_output inode_output
            bytes_output="$(df -B1 --output=size,used,avail,pcent -- "$path" 2>/dev/null)" \
              || { producer_rc=$?; report_failure filesystem_usage disk_producer_failed "$producer_rc"; }
            printf '%s\n' "$bytes_output" \
              | /usr/bin/python3 -I "$summary_tool" --mode df --category "$category"
            inode_output="$(df --output=iused,iavail,ipcent -- "$path" 2>/dev/null)" \
              || { producer_rc=$?; report_failure filesystem_usage inode_producer_failed "$producer_rc"; }
            printf '%s\n' "$inode_output" \
              | /usr/bin/python3 -I "$summary_tool" --mode inode --category "$category"
          }
          emit_disk_usage root /
          emit_disk_usage tmp /tmp
          emit_disk_usage var_tmp /var/tmp
          emit_disk_usage platform_runtime /opt/oldsparky/platform
          emit_disk_usage logs /var/log

          CURRENT_STAGE=journal_usage
          journal_usage="$(journalctl --disk-usage --no-pager 2>/dev/null)" \
            || { producer_rc=$?; report_failure journal_usage producer_failed "$producer_rc"; }
          printf '%s\n' "$journal_usage" \
            | /usr/bin/python3 -I "$summary_tool" --mode journal

          CURRENT_STAGE=service_state
          for service in deadlock-api deadlock-worker deadlock-web; do
            service_output="$(systemctl show "$service" \
              --property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,NRestarts,MemoryCurrent,MemoryPeak,MemoryMax,TasksCurrent,TasksMax,CPUUsageNSec \
              --no-pager 2>/dev/null)" \
              || { producer_rc=$?; report_failure service_state producer_failed "$producer_rc"; }
            printf '%s\n' "$service_output" \
              | /usr/bin/python3 -I "$summary_tool" --mode service --service "$service"
          done

          CURRENT_STAGE=maintenance_timer_state
          timer_dir="$(mktemp -d)"
          chmod 700 "$timer_dir"
          timer_file="$timer_dir/systemctl-show.out"
          (set -o noclobber; : >"$timer_file") \
            || report_failure maintenance_timer_state output_unavailable 2
          chmod 600 "$timer_file"
          if (ulimit -f 16; timeout --foreground 5s systemctl show deadlock-maintenance.timer \
            --property=LoadState,ActiveState,SubState,UnitFileState,LastTriggerUSec,NextElapseUSecRealtime,FragmentPath,DropInPaths \
            --no-pager >"$timer_file" 2>/dev/null) 2>/dev/null; then
            timer_rc=0
          else
            timer_rc=$?
          fi
          timer_size="$(stat -c '%s' -- "$timer_file" 2>/dev/null)" \
            || report_failure maintenance_timer_state output_unavailable 2
          [[ "$timer_size" =~ ^[0-9]{1,5}$ ]] && (( timer_size <= 16384 )) \
            || report_failure maintenance_timer_state output_limit 2
          (( timer_rc == 0 )) \
            || report_failure maintenance_timer_state producer_failed "$timer_rc"
          timer_summary="$(/usr/bin/python3 -I - "$current" 3<"$timer_file" <<'PY'
          import datetime as dt
          import hashlib
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          from zoneinfo import ZoneInfo

          expected_keys = {
              "LoadState", "ActiveState", "SubState", "UnitFileState",
              "LastTriggerUSec", "NextElapseUSecRealtime", "FragmentPath", "DropInPaths",
          }
          raw = os.read(3, 16385)
          if len(raw) > 16384:
              raise SystemExit(2)
          try:
              lines = raw.decode("utf-8", "strict").splitlines()
              values = {}
              for line in lines:
                  key, separator, value = line.partition("=")
                  if not separator or key not in expected_keys or key in values:
                      raise ValueError
                  values[key] = value
              if set(values) != expected_keys:
                  raise ValueError

              enum_values = {
                  "LoadState": {"loaded", "not-found", "error", "bad-setting", "merged", "masked"},
                  "ActiveState": {"active", "reloading", "inactive", "failed", "activating", "deactivating"},
                  "SubState": {"dead", "waiting", "running", "elapsed", "failed", "start", "stop"},
                  "UnitFileState": {
                      "enabled", "enabled-runtime", "linked", "linked-runtime", "static",
                      "indirect", "disabled", "masked", "masked-runtime", "alias",
                      "generated", "transient", "bad", "not-found",
                  },
              }
              for key, allowed in enum_values.items():
                  if values[key] not in allowed:
                      raise ValueError

              def parse_time(value):
                  if value in {"", "n/a"}:
                      return None
                  match = re.fullmatch(
                      r"(?:(Mon|Tue|Wed|Thu|Fri|Sat|Sun) )?"
                      r"([0-9]{4})-([0-9]{2})-([0-9]{2}) ([0-9]{2}):([0-9]{2}):([0-9]{2}) "
                      r"(UTC|GMT|EET|EEST)",
                      value,
                  )
                  if not match:
                      raise ValueError
                  weekday, year, month, day, hour, minute, second, zone_name = match.groups()
                  local = dt.datetime(
                      int(year), int(month), int(day), int(hour), int(minute), int(second)
                  )
                  if weekday and local.strftime("%a") != weekday:
                      raise ValueError
                  zone = ZoneInfo("Europe/Helsinki") if zone_name in {"EET", "EEST"} else dt.UTC
                  aware = local.replace(tzinfo=zone)
                  if aware.strftime("%Z") != zone_name:
                      raise ValueError
                  return aware.astimezone(dt.UTC).isoformat(timespec="seconds").replace("+00:00", "Z")

              last_trigger = parse_time(values["LastTriggerUSec"])
              next_trigger = parse_time(values["NextElapseUSecRealtime"])
              if last_trigger is None:
                  last_state = "not_triggered"
              else:
                  last_state = "present"
              if next_trigger is None:
                  next_state = "unavailable"
              else:
                  next_state = "present"

              expected_fragment = Path("/etc/systemd/system/deadlock-maintenance.timer")
              if values["FragmentPath"] != str(expected_fragment):
                  raise ValueError
              current = Path(sys.argv[1])
              source_file = current / "deploy/systemd/deadlock-maintenance.timer"

              def stable_digest(path):
                  named = path.lstat()
                  if (
                  not stat.S_ISREG(named.st_mode)
                  or named.st_uid != os.geteuid()
                      or named.st_nlink != 1
                      or named.st_size <= 0
                      or named.st_size > 16384
                  ):
                      raise ValueError
                  descriptor = os.open(
                      path,
                      os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | os.O_NOFOLLOW,
                  )
                  digest = hashlib.sha256()
                  try:
                      opened = os.fstat(descriptor)
                      if (
                          not stat.S_ISREG(opened.st_mode)
                          or opened.st_uid != os.geteuid()
                          or opened.st_nlink != 1
                          or (opened.st_dev, opened.st_ino, opened.st_size)
                          != (named.st_dev, named.st_ino, named.st_size)
                      ):
                          raise ValueError
                      total = 0
                      while True:
                          chunk = os.read(descriptor, 4096)
                          if not chunk:
                              break
                          total += len(chunk)
                          if total > 16384:
                              raise ValueError
                          digest.update(chunk)
                      after = os.fstat(descriptor)
                  finally:
                      os.close(descriptor)
                  after_named = path.lstat()
                  if (
                      total != named.st_size
                      or (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns)
                      != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)
                      or (named.st_dev, named.st_ino, named.st_size, named.st_mtime_ns)
                      != (after_named.st_dev, after_named.st_ino, after_named.st_size, after_named.st_mtime_ns)
                  ):
                      raise ValueError
                  return digest.hexdigest()

              source_digest = stable_digest(source_file)
              installed_digest = stable_digest(expected_fragment)
              dropins = values["DropInPaths"].split() if values["DropInPaths"] else []
              if len(dropins) > 8 or any(not item.startswith("/") or len(item) > 256 for item in dropins):
                  raise ValueError
              result = {
                  "schema": 1,
                  "kind": "maintenance_timer_state",
                  "status": "ok",
                  "load_state": values["LoadState"],
                  "active_state": values["ActiveState"],
                  "sub_state": values["SubState"],
                  "unit_file_state": values["UnitFileState"],
                  "last_trigger_state": last_state,
                  "last_trigger_utc": last_trigger,
                  "next_trigger_state": next_state,
                  "next_trigger_utc": next_trigger,
                  "unit_source_match": source_digest == installed_digest,
                  "source_sha256": source_digest,
                  "installed_sha256": installed_digest,
                  "dropin_count": len(dropins),
                  "dropin_identity": "none" if not dropins else "unexpected_present",
              }
              import json
              print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          except Exception:
              raise SystemExit(2)
          PY
          )" \
            || report_failure maintenance_timer_state summary_contract 2
          rm -f -- "$timer_file"
          timer_file=""
          printf '%s\n' "$timer_summary"

          CURRENT_STAGE=category_usage
          emit_category_size() {
            local category="$1"
            local path="$2"
            local size_output
            if [[ -e "$path" && ! -L "$path" ]]; then
              size_output="$(timeout 90s du -x -s -B1 -- "$path" 2>/dev/null)" \
                || { producer_rc=$?; report_failure category_usage producer_failed "$producer_rc"; }
            else
              size_output='0'
            fi
            printf '%s\n' "$size_output" \
              | /usr/bin/python3 -I "$summary_tool" --mode du --category "$category"
          }
          emit_category_size source_release_artifacts "$runtime/dist/releases"
          emit_category_size browser_test_artifacts "$runtime/apps/platform_web"
          emit_category_size preprod_screenshots "$runtime/shared/preprod-screenshots"
          emit_category_size live_qa_runtime /var/lib/oldsparky-liveqa
          emit_category_size backups "$runtime/shared/backups"

          CURRENT_STAGE=backup_check
          backup_file="$(mktemp)"
          chmod 600 "$backup_file"
          if timeout --foreground 180s "$python_bin" "$backup_tool" \
            --output-dir "$runtime/shared/backups" --check-latest --max-age-hours 24 --json \
            >"$backup_file" 2>/dev/null; then
            backup_rc=0
          else
            backup_rc=$?
          fi
          backup_summary="$(/usr/bin/python3 -I "$summary_tool" --mode backup --phase check \
            <"$backup_file" 2>/dev/null)" \
            || report_failure backup_check summary_contract "$(( backup_rc != 0 ? backup_rc : 2 ))"
          printf '%s\n' "$backup_summary"
          backup_assessment="$(/usr/bin/python3 -I - "$backup_summary" <<'PY'
          import json
          import sys

          try:
              report = json.loads(sys.argv[1])
              age = report.get("age_hours")
              valid_age = (
                  isinstance(age, (int, float))
                  and not isinstance(age, bool)
                  and 0 <= age <= 24
              )
              complete = (
                  report.get("kind") == "backup_evidence"
                  and report.get("phase") == "check"
                  and report.get("status") == "ok"
                  and report.get("restore_verified") is True
                  and report.get("alembic_revision_verified") is True
                  and report.get("checksum_present") is True
                  and valid_age
              )
              print("ok" if complete else "incomplete")
          except Exception:
              print("invalid")
          PY
          )"
          rm -f -- "$backup_file"
          backup_file=""
          if (( backup_rc != 0 )); then
            report_failure backup_check producer_failed "$backup_rc"
          elif [[ "$backup_assessment" != ok ]]; then
            report_failure backup_check verification_incomplete 1
          fi

          CURRENT_STAGE=retention_tempfile
          retention_file="$(mktemp)"
          CURRENT_STAGE=retention_dry_run
          if "$python_bin" "$current/tools/platform_storage_maintenance.py" --json \
            >"$retention_file" 2>/dev/null; then
            retention_rc=0
          else
            retention_rc=$?
          fi
          CURRENT_STAGE=retention_summary
          set +e
          retention_summary="$(/usr/bin/python3 -I "$summary_tool" --mode retention \
            <"$retention_file")"
          summary_rc=$?
          set -e
          if [[ -n "$retention_summary" ]]; then
            printf '%s\n' "$retention_summary"
          fi
          if (( summary_rc != 0 )); then
            CURRENT_STAGE=retention_summary
            failure_code=$(( retention_rc != 0 ? retention_rc : summary_rc ))
            printf '{"schema":1,"kind":"collection_failure","status":"failed","stage":"%s","outcome":"summary_contract","exit_code":%d}\n' \
              "$CURRENT_STAGE" "$failure_code"
            exit "$failure_code"
          fi
          retention_classification="$(/usr/bin/python3 -I - "$retention_file" 2>/dev/null <<'PY'
          import json
          from pathlib import Path
          import sys

          allowed_errors = {"backup", "configuration", "integrity", "lock", "storage"}
          try:
              raw = Path(sys.argv[1]).read_bytes()
              if not raw or len(raw) > 256 * 1024:
                  raise ValueError
              payload = json.loads(raw)
              if not isinstance(payload, dict):
                  raise ValueError
              mode = payload.get("mode")
              error_class = payload.get("error_class")
              report_ok = payload.get("ok")
              disk = payload.get("disk_after")
              limits = payload.get("limits")
              def number(value, maximum=10**18):
                  return (
                      value
                      if isinstance(value, (int, float))
                      and not isinstance(value, bool)
                      and 0 <= value <= maximum
                      else None
                  )
              minimum_free = number(limits.get("minimum_free_bytes"), 10**18) if isinstance(limits, dict) else None
              maximum_used = number(limits.get("maximum_used_percent"), 100) if isinstance(limits, dict) else None
              free_bytes = number(disk.get("free_bytes"), 10**18) if isinstance(disk, dict) else None
              used_percent = number(disk.get("used_percent"), 100) if isinstance(disk, dict) else None
              has_thresholds = None not in {
                  minimum_free, maximum_used, free_bytes, used_percent
              }
              if mode == "dry-run" and isinstance(report_ok, bool) and has_thresholds:
                  threshold_failed = (
                      free_bytes < minimum_free or used_percent > maximum_used
                  )
                  if report_ok == threshold_failed:
                      status = "failed"
                      error = "inconsistent_result"
                  elif not report_ok and threshold_failed:
                      status = "unhealthy"
                      error = "disk_threshold"
                  else:
                      status = "ok"
                      error = "none"
              elif (
                  report_ok is False
                  and payload.get("status") == "failed"
                  and isinstance(error_class, str)
                  and error_class in allowed_errors
              ):
                  status = "failed"
                  error = error_class
              else:
                  raise ValueError
              result = {
                  "schema": 1,
                  "kind": "storage_retention_result",
                  "status": status,
                  "error_class": error,
                  "minimum_free_bytes": minimum_free,
                  "maximum_used_percent": maximum_used,
                  "free_bytes": free_bytes,
                  "used_percent": used_percent,
              }
              print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          except Exception:
              raise SystemExit(2)
          PY
          )"
          printf '%s\n' "$retention_classification"
          retention_status="$(printf '%s\n' "$retention_classification" \
            | /usr/bin/python3 -I -c 'import json,sys; value=json.load(sys.stdin); print(value.get("status", "invalid"))')"
          if [[ "$retention_status" == unhealthy ]]; then
            CURRENT_STAGE=retention_threshold
            failure_code=$(( retention_rc != 0 ? retention_rc : 1 ))
            printf '{"schema":1,"kind":"collection_failure","status":"failed","stage":"%s","outcome":"threshold","exit_code":%d}\n' \
              "$CURRENT_STAGE" "$failure_code"
            exit "$failure_code"
          elif [[ "$retention_status" == failed ]]; then
            CURRENT_STAGE=retention_tool
            failure_code=$(( retention_rc != 0 ? retention_rc : 1 ))
            printf '{"schema":1,"kind":"collection_failure","status":"failed","stage":"%s","outcome":"bounded_error_class","exit_code":%d}\n' \
              "$CURRENT_STAGE" "$failure_code"
            exit "$failure_code"
          elif [[ "$retention_status" != ok || "$retention_rc" != 0 ]]; then
            CURRENT_STAGE=retention_dry_run
            failure_code=$(( retention_rc != 0 ? retention_rc : 2 ))
            printf '{"schema":1,"kind":"collection_failure","status":"failed","stage":"%s","outcome":"inconsistent_result","exit_code":%d}\n' \
              "$CURRENT_STAGE" "$failure_code"
            exit "$failure_code"
          fi
          CURRENT_STAGE=identity_recheck
          test -L "$current" && test -L "$runtime/previous" \
            && test "$(readlink -f "$current")" = "$runtime/releases/$current_id" \
            && test "$(readlink -f "$runtime/previous")" = "$runtime/releases/$previous_id" \
            || report_failure identity_recheck release_pointer_changed 1
          printf '{"schema":1,"kind":"collection_status","status":"ok","stage":"complete","exit_code":0}\n'
          REMOTE
          remote_exit_code=$?
          set -e
          if (( remote_exit_code == 0 )); then
            printf '{"schema":1,"kind":"collection_transport","status":"ok","stage":"complete","outcome":"none","exit_code":0}\n' \
              >>"$remote_report"
          elif (( remote_exit_code == 255 )); then
            printf '{"schema":1,"kind":"collection_transport","status":"failed","stage":"ssh_transport","outcome":"transport_failed","exit_code":%d}\n' \
              "$remote_exit_code" >>"$remote_report"
          else
            printf '{"schema":1,"kind":"collection_transport","status":"failed","stage":"remote_exit","outcome":"nonzero_exit","exit_code":%d}\n' \
              "$remote_exit_code" >>"$remote_report"
          fi
          chmod 600 "$remote_report"
          cp -- "$remote_report" "$artifact_report"
          chmod 600 "$artifact_report"
          printf 'remote_exit_code=%s\n' "$remote_exit_code" >>"$GITHUB_OUTPUT"
          printf 'report_ready=true\n' >>"$GITHUB_OUTPUT"
          if (( remote_exit_code == 255 )); then
            echo "Remote diagnostics transport failed (exit 255)." >&2
          elif (( remote_exit_code != 0 )); then
            echo "Remote diagnostics failed at a bounded stage (exit ${remote_exit_code})." >&2
          fi
          rm -f -- "$remote_report"
          test ! -e "$remote_report"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-storage-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- "$RUNNER_TEMP/platform-production-storage-diagnostics.txt"
          test ! -e "$RUNNER_TEMP/platform-production-storage-diagnostics.txt"
          rm -f -- "$RUNNER_TEMP/platform-production-storage-diagnostics-ssh-error"
          test ! -e "$RUNNER_TEMP/platform-production-storage-diagnostics-ssh-error"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Upload storage diagnostic evidence
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' && steps.collect_storage.outputs.report_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-production-storage-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-production-storage-diagnostics-artifact.txt
          if-no-files-found: error
          retention-days: 14

      - name: Preserve remote collection failure status
        if: ${{ always() && steps.collect_storage.outputs.remote_exit_code != '' && steps.collect_storage.outputs.remote_exit_code != '0' }}
        shell: bash
        env:
          REMOTE_EXIT_CODE: ${{ steps.collect_storage.outputs.remote_exit_code }}
        run: |
          set -euo pipefail
          [[ "$REMOTE_EXIT_CODE" =~ ^[1-9][0-9]{0,2}$ ]] \
            || { echo "Remote diagnostic exit status was not a bounded integer." >&2; exit 2; }
          echo "Remote storage diagnostics returned exit $REMOTE_EXIT_CODE after evidence upload." >&2
          exit "$REMOTE_EXIT_CODE"
