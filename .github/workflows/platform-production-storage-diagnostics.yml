name: Platform production storage diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact source SHA currently deployed on the production VPS"
        required: true
        type: string
      backup_failure_run_id:
        description: "Optional exact failed backup workflow run ID for a closed receipt projection"
        required: false
        type: string
        default: ""
      backup_failure_run_attempt:
        description: "Exact attempt of the failed backup workflow run"
        required: false
        type: string
        default: ""
      backup_failure_source_sha:
        description: "Exact source SHA bound to the failed backup receipt"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: platform-production-deploy
  cancel-in-progress: false

jobs:
  collect:
    name: Collect read-only storage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      BACKUP_FAILURE_RUN_ID: ${{ inputs.backup_failure_run_id }}
      BACKUP_FAILURE_RUN_ATTEMPT: ${{ inputs.backup_failure_run_attempt }}
      BACKUP_FAILURE_SOURCE_SHA: ${{ inputs.backup_failure_source_sha }}
    steps:
      - name: Validate diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" \
            || { echo "Production storage diagnostics must run from dev." >&2; exit 1; }

          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "expected_sha must be a lowercase 40-character commit SHA." >&2; exit 1; }
          if [[ -z "$BACKUP_FAILURE_RUN_ID" && -z "$BACKUP_FAILURE_RUN_ATTEMPT" && -z "$BACKUP_FAILURE_SOURCE_SHA" ]]; then
            :
          elif [[ "$BACKUP_FAILURE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ \
              && "$BACKUP_FAILURE_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ \
              && "$BACKUP_FAILURE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            :
          else
            echo "Backup failure receipt binding must be supplied as one exact run/attempt/source tuple." >&2
            exit 1
          fi

      - name: Validate production SSH inputs
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" || { echo "PROD_SSH_HOST is not configured." >&2; exit 1; }
          test -n "${PROD_SSH_USER:-}" || { echo "PROD_SSH_USER is not configured." >&2; exit 1; }
          test -n "${PROD_SSH_KEY:-}" || { echo "PROD_SSH_KEY is not configured." >&2; exit 1; }

      - name: Configure pinned production SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-storage-diagnostics-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"; rm -f -- "$ssh_scan"; ssh_scan_ok=0
          for ssh_attempt in 1 2; do
            ssh_scan_attempt="$ssh_scan.$ssh_attempt"; rm -f -- "$ssh_scan_attempt"; install -m 600 /dev/null "$ssh_scan_attempt"
            ssh_scan_rc=0
            if timeout --foreground 4s ssh-keyscan -T 3 -t ed25519 "$PROD_SSH_HOST" >"$ssh_scan_attempt" 2>/dev/null; then
              :
            else
              ssh_scan_rc=$?
            fi
            if (( ssh_scan_rc == 0 )) \
              && awk -v host="$PROD_SSH_HOST" '/^[[:space:]]*($|#)/ { next } { records++; if (NF == 3 && $1 == host && $2 == "ssh-ed25519") { valid=1; next } { invalid=1 } } END { exit !(records == 1 && valid == 1 && !invalid) }' "$ssh_scan_attempt" \
              && test "$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"; then
              mv -- "$ssh_scan_attempt" "$ssh_scan"; ssh_scan_ok=1; printf 'Production SSH host-key acquisition attempt %s/2 succeeded\n' "$ssh_attempt"; break
            fi
            ssh_scan_line_count="$(awk 'END {print NR + 0}' "$ssh_scan_attempt")"
            read -r ssh_scan_record_count ssh_scan_host_token_valid ssh_scan_key_type_valid < <(
              awk -v host="$PROD_SSH_HOST" '
                /^[[:space:]]*($|#)/ { next }
                {
                  records++
                  if (NF != 3 || $1 != host) host_invalid=1
                  if (NF != 3 || $2 != "ssh-ed25519") type_invalid=1
                }
                END { printf "%d %d %d\n", records + 0, (records == 1 && !host_invalid), (records == 1 && !type_invalid) }
              ' "$ssh_scan_attempt"
            )
            ssh_scan_fingerprint_match=0
            if (( ssh_scan_record_count == 1 )); then
              ssh_scan_fingerprint="$(ssh-keygen -lf "$ssh_scan_attempt" -E sha256 2>/dev/null | awk 'NR == 1 {print $2}' || true)"
              if [[ "$ssh_scan_fingerprint" == "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y" ]]; then
                ssh_scan_fingerprint_match=1
              fi
            fi
            printf 'SSH_KEYSCAN_DIAGNOSTIC rc=%s lines=%s records=%s host_token_valid=%s key_type_valid=%s fingerprint_match=%s\n' \
              "$ssh_scan_rc" "$ssh_scan_line_count" "$ssh_scan_record_count" "$ssh_scan_host_token_valid" "$ssh_scan_key_type_valid" "$ssh_scan_fingerprint_match" >&2
            rm -f -- "$ssh_scan_attempt"; printf 'Production SSH host-key acquisition attempt %s/2 failed\n' "$ssh_attempt" >&2; (( ssh_attempt == 2 )) || sleep 0.5
          done
          test "$ssh_scan_ok" = 1 || { echo "Production SSH host-key acquisition failed after 2 bounded attempts" >&2; exit 1; }
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          printf '%s\n' "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Collect read-only storage evidence
        id: collect_storage
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          BACKUP_FAILURE_RUN_ID: ${{ inputs.backup_failure_run_id }}
          BACKUP_FAILURE_RUN_ATTEMPT: ${{ inputs.backup_failure_run_attempt }}
          BACKUP_FAILURE_SOURCE_SHA: ${{ inputs.backup_failure_source_sha }}
        run: |
          set -euo pipefail
          umask 077
          remote_report="$RUNNER_TEMP/platform-production-storage-diagnostics.txt"
          ssh_error="$RUNNER_TEMP/platform-production-storage-diagnostics-ssh-error"
          artifact_report="$RUNNER_TEMP/platform-production-storage-diagnostics-artifact.txt"
          backup_failure_helper="$RUNNER_TEMP/platform-production-backup-failure-helper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.py"
          backup_failure_receipt="$RUNNER_TEMP/platform-production-backup-failure-receipt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          printf 'BACKUP_FAILURE_HELPER_PATH=%s\n' "$backup_failure_helper" >> "$GITHUB_ENV"
          printf 'BACKUP_FAILURE_RECEIPT_PATH=%s\n' "$backup_failure_receipt" >> "$GITHUB_ENV"
          : >"$remote_report"
          : >"$ssh_error"
          chmod 600 "$remote_report" "$ssh_error"
          ulimit -f 2048
          if [[ -n "$BACKUP_FAILURE_RUN_ID" ]]; then
            install -m 600 /dev/null "$backup_failure_helper"
            cat > "$backup_failure_helper" <<'BACKUP_FAILURE_HELPER'
          #!/usr/bin/env python3
          """Project one bounded backup-failure receipt into closed diagnostic values.

          This dependency-free source is embedded verbatim in the production storage
          diagnostics workflow. Tests check that copy and exercise this implementation
          with synthetic receipts; it is not installed on production hosts.
          """

          from __future__ import annotations

          import json
          import re
          import sys

          MAX_BYTES = 64 * 1024
          MAX_MEMORY_BYTES = 1 << 30
          MAX_RSS_BYTES = 1 << 40


          class ReceiptError(ValueError):
              pass


          def _no_duplicate_keys(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      raise ReceiptError
                  result[key] = value
              return result


          def _integer(value: object, *, maximum: int = 10**18, nullable: bool = False) -> bool:
              return (nullable and value is None) or (type(value) is int and 0 <= value <= maximum)


          def project_receipt(raw: bytes, run_id: str, attempt: str, source_sha: str) -> dict[str, object]:
              if (
                  re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is None
                  or re.fullmatch(r"[1-9][0-9]{0,5}", attempt) is None
                  or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None
                  or not 1 <= len(raw) <= MAX_BYTES
              ):
                  raise ReceiptError
              try:
                  payload = json.loads(raw.decode("ascii"), object_pairs_hook=_no_duplicate_keys)
              except (UnicodeDecodeError, json.JSONDecodeError, ReceiptError) as exc:
                  raise ReceiptError from exc
              if not isinstance(payload, dict):
                  raise ReceiptError
              required = {
                  "schema", "event", "run_id", "attempt", "operation", "source_sha",
                  "bundle_sha256", "stage", "public_summary_error",
                  "public_summary_normalizer_diagnostic", "exit_code", "report_state",
                  "report_error_class", "restore_diagnostic", "scratch_unit_diagnostic",
                  "scratch_admission_diagnostic", "backup_disk_diagnostic",
                  "scratch_host_guard_diagnostic", "scratch_first_fault",
                  "scratch_resource_attribution", "scratch_phase_attribution",
                  "scratch_cleanup_status", "report_bytes", "report_sha256", "stderr_state",
                  "stderr_exception_class", "stderr_bytes", "stderr_sha256",
              }
              if set(payload) not in (required, required | {"scratch_allocation_attribution"}):
                  raise ReceiptError
              if (
                  type(payload.get("schema")) is not int or payload["schema"] != 1
                  or payload.get("event") != "platform_backup_failure"
                  or payload.get("run_id") != run_id
                  or payload.get("attempt") != attempt
                  or payload.get("source_sha") != source_sha
                  or payload.get("operation") != "create"
              ):
                  raise ReceiptError

              def enum(value: object, choices: set[str]) -> str:
                  if not isinstance(value, str) or value not in choices:
                      raise ReceiptError
                  return value

              stage = enum(payload["stage"], {
                  "preflight", "helper_bundle_validation", "backup_create",
                  "backup_verify_existing", "summary_validation", "public_summary",
                  "private_capture_cleanup", "helper_cleanup", "report_cleanup", "complete",
              })
              report_state = enum(payload["report_state"], {
                  "absent", "unsafe", "changed", "read", "invalid_json", "typed_failure",
                  "success_payload", "unclassified_json",
              })
              report_error = enum(payload["report_error_class"], {
                  "none", "backup", "lock", "integrity", "configuration", "storage",
              })
              if type(payload["exit_code"]) is not int or not 1 <= payload["exit_code"] <= 999:
                  raise ReceiptError

              projected: dict[str, object] = {
                  "schema": 1,
                  "kind": "backup_failure_diagnostic",
                  "status": "available",
                  "run_id": run_id,
                  "attempt": attempt,
                  "source_sha": source_sha,
                  "operation": "create",
                  "stage": stage,
                  "report_state": report_state,
                  "report_error_class": report_error,
                  "exit_code": payload["exit_code"],
                  "backup_disk_diagnostic": None, "restore_diagnostic": None,
                  "scratch_admission_diagnostic": None,
              }
              # The remaining writer-owned diagnostic values are bounded by the 64 KiB
              # receipt and discarded. Never copy or serialize those private structures.
              for field in (
                  "restore_diagnostic", "scratch_unit_diagnostic", "scratch_admission_diagnostic",
                  "backup_disk_diagnostic", "scratch_host_guard_diagnostic", "scratch_first_fault",
                  "scratch_resource_attribution", "scratch_phase_attribution", "scratch_cleanup_status",
              ):
                  value = payload[field]
                  if value is not None and not isinstance(value, dict):
                      raise ReceiptError

              disk = payload["backup_disk_diagnostic"]
              if disk is not None:
                  if set(disk) != {"schema", "phase", "guard_reason", "free_bytes", "required_free_bytes"}:
                      raise ReceiptError
                  if (
                      type(disk["schema"]) is not int or disk["schema"] != 1
                      or disk["phase"] not in {
                          "backup_admission",
                          "scratch_image_admission",
                          "scratch_image_postallocation",
                          "pg_dump_pre_spawn",
                          "pg_dump_post_start",
                          "pg_dump_monitor",
                          "pg_dump_post_exit",
                      }
                      or disk["guard_reason"] not in {"disk_floor", "disk_unavailable", "child_unstopped", "command_start_failed", "command_failed"}
                      or not _integer(disk["free_bytes"], nullable=True)
                      or not _integer(disk["required_free_bytes"], nullable=True)
                  ):
                      raise ReceiptError
                  if disk["guard_reason"] == "disk_floor" and (
                      type(disk["free_bytes"]) is not int or type(disk["required_free_bytes"]) is not int
                      or disk["free_bytes"] >= disk["required_free_bytes"]
                  ):
                      raise ReceiptError
                  projected["backup_disk_diagnostic"] = {
                      "phase": disk["phase"], "guard_reason": disk["guard_reason"],
                      "free_bytes": disk["free_bytes"], "required_free_bytes": disk["required_free_bytes"],
                  }

              admission = payload["scratch_admission_diagnostic"]
              if admission is not None:
                  keys = {
                      "schema", "phase", "guard_reason", "available_bytes", "required_bytes",
                      "helper_rss_bytes", "direct_parent_rss_bytes", "observed_pair_rss_bytes",
                      "observed_process_count",
                  }
                  if set(admission) != keys:
                      raise ReceiptError
                  helper_rss = admission["helper_rss_bytes"]
                  parent_rss = admission["direct_parent_rss_bytes"]
                  count = admission["observed_process_count"]
                  pair = admission["observed_pair_rss_bytes"]
                  if (
                      type(admission["schema"]) is not int or admission["schema"] != 1
                      or admission["phase"] != "pre_create_admission"
                      or admission["guard_reason"] != "memory_reserve"
                      or not _integer(admission["available_bytes"], maximum=MAX_MEMORY_BYTES - 1)
                      or type(admission["required_bytes"]) is not int or admission["required_bytes"] != MAX_MEMORY_BYTES
                      or any(not _integer(value, maximum=MAX_RSS_BYTES, nullable=True) for value in (helper_rss, parent_rss))
                      or type(count) is not int or count != sum(value is not None for value in (helper_rss, parent_rss))
                      or count not in {0, 1, 2}
                      or (count == 2 and (type(pair) is not int or pair != helper_rss + parent_rss or pair > 2 * MAX_RSS_BYTES))
                      or (count < 2 and pair is not None)
                  ):
                      raise ReceiptError
                  projected["scratch_admission_diagnostic"] = {
                      "phase": admission["phase"], "guard_reason": admission["guard_reason"],
                      "available_bytes": admission["available_bytes"], "required_bytes": admission["required_bytes"],
                      "observed_process_count": count,
                  }

              restore = payload["restore_diagnostic"]
              if restore is not None:
                  keys = {
                      "schema", "restore_stage", "guard_reason", "free_bytes", "required_free_bytes",
                      "temporary_database_created", "drop_outcome", "temporary_database_absent",
                      "archive_sha256", "archive_size_bytes",
                  }
                  stages = {
                      "pre_create_admission", "create_database", "extension_setup", "schema_setup",
                      "restore_platform", "restore_public", "validate_table_count", "validate_connectivity",
                      "validate_revision", "validate_extensions", "drop_database",
                  }
                  drops = {"not_required", "drop_failed", "database_present", "absence_unconfirmed", "confirmed_absent"}
                  if set(restore) != keys or (
                      type(restore["schema"]) is not int or restore["schema"] != 1
                      or restore["restore_stage"] not in stages
                      or restore["guard_reason"] not in {"none", "disk_floor", "disk_unavailable", "child_unstopped", "command_start_failed", "command_failed"}
                      or restore["drop_outcome"] not in drops
                      or any(value is not None and type(value) is not bool for value in (restore["temporary_database_created"], restore["temporary_database_absent"]))
                      or not _integer(restore["free_bytes"], nullable=True)
                      or not _integer(restore["required_free_bytes"], nullable=True)
                      or not isinstance(restore["archive_sha256"], str)
                      or re.fullmatch(r"[0-9a-f]{64}", restore["archive_sha256"]) is None
                      or not _integer(restore["archive_size_bytes"])
                  ):
                      raise ReceiptError
                  projected["restore_diagnostic"] = {
                      "restore_stage": restore["restore_stage"], "guard_reason": restore["guard_reason"],
                      "free_bytes": restore["free_bytes"], "required_free_bytes": restore["required_free_bytes"],
                      "temporary_database_created": restore["temporary_database_created"],
                      "drop_outcome": restore["drop_outcome"],
                      "temporary_database_absent": restore["temporary_database_absent"],
                      "archive_size_bytes": restore["archive_size_bytes"],
                  }
              return projected


          def main(argv: list[str] | None = None) -> int:
              args = sys.argv[1:] if argv is None else argv
              if len(args) != 3:
                  print("{\"state\":\"unavailable\",\"reason\":\"invalid_binding\"}")
                  return 0
              run_id, attempt, source_sha = args
              raw = sys.stdin.buffer.read(MAX_BYTES + 1)
              try:
                  result = project_receipt(raw, run_id, attempt, source_sha)
              except (ReceiptError, ValueError, TypeError):
                  result = {
                      "schema": 1,
                      "kind": "backup_failure_diagnostic",
                      "status": "unavailable",
                      "run_id": run_id,
                      "attempt": attempt,
                      "source_sha": source_sha,
                      "reason": "receipt_contract",
                  }
              print(json.dumps(result, sort_keys=True, separators=(",", ":")))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          BACKUP_FAILURE_HELPER
            chmod 600 "$backup_failure_helper"
            test "$(stat -c '%u:%a:%h' "$backup_failure_helper")" = "$(id -u):600:1"
          fi
          set +e
          ssh \
            -F "$SSH_DIR/config" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o ConnectTimeout=10 \
            -i "$SSH_DIR/id_ed25519" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            bash -s -- "$EXPECTED_SHA" "${BACKUP_FAILURE_RUN_ID:--}" \
              "${BACKUP_FAILURE_RUN_ATTEMPT:--}" "${BACKUP_FAILURE_SOURCE_SHA:--}" > "$remote_report" 2> "$ssh_error" <<'REMOTE'
          set -Eeuo pipefail
          CURRENT_STAGE=identity
          trap 'diagnostic_rc=$?; trap - ERR; printf "{\"schema\":1,\"kind\":\"collection_failure\",\"status\":\"failed\",\"stage\":\"%s\",\"outcome\":\"producer_failed\",\"exit_code\":%d}\n" "$CURRENT_STAGE" "$diagnostic_rc"; exit "$diagnostic_rc"' ERR
          report_failure() {
            local failed_stage="$1"
            local outcome="$2"
            local exit_code="$3"
            printf '{"schema":1,"kind":"collection_failure","status":"failed","stage":"%s","outcome":"%s","exit_code":%d}\n' \
              "$failed_stage" "$outcome" "$exit_code"
            exit "$exit_code"
          }

          expected_sha="$1"
          backup_failure_run_id="$2"
          backup_failure_run_attempt="$3"
          backup_failure_source_sha="$4"
          if [[ "$backup_failure_run_id" == - && "$backup_failure_run_attempt" == - \
              && "$backup_failure_source_sha" == - ]]; then
            backup_failure_run_id=""
            backup_failure_run_attempt=""
            backup_failure_source_sha=""
          elif [[ "$backup_failure_run_id" == - || "$backup_failure_run_attempt" == - \
              || "$backup_failure_source_sha" == - ]]; then
            report_failure identity invalid_backup_failure_binding 1
          fi
          runtime=/opt/oldsparky/platform
          current="$runtime/current"
          python_bin="$runtime/shared/venv/bin/python"
          summary_tool="$current/tools/platform_storage_evidence_summary.py"
          backup_tool="$current/tools/platform_backup_restore_drill.py"
          input_guard="$current/tools/platform_workflow_input_guard.py"
          backup_file=""
          timer_file=""
          timer_dir=""
          retention_file=""
          retention_preview_file=""
          liveqa_preview_file=""
          cleanup_private_files() {
            [[ -z "$backup_file" ]] || rm -f -- "$backup_file"
            [[ -z "$timer_file" ]] || rm -f -- "$timer_file"
            [[ -z "$timer_dir" ]] || rmdir -- "$timer_dir" 2>/dev/null || true
            [[ -z "$retention_file" ]] || rm -f -- "$retention_file"
            [[ -z "$retention_preview_file" ]] || rm -f -- "$retention_preview_file"
            [[ -z "$liveqa_preview_file" ]] || rm -f -- "$liveqa_preview_file"
          }
          trap cleanup_private_files EXIT

          test "$(id -u)" -eq 0 || report_failure identity privilege_required 1
          test -f "$input_guard" && test ! -L "$input_guard" \
            || report_failure identity input_guard_unavailable 1
          /usr/bin/python3 -I "$input_guard" sha --value "$expected_sha" >/dev/null \
            || report_failure identity input_invalid 1
          test -L "$current" || report_failure identity current_pointer_unavailable 1
          test -x "$python_bin" || report_failure identity python_unavailable 1
          test -f "$summary_tool" && test ! -L "$summary_tool" \
            || report_failure identity summary_helper_unavailable 1
          test -f "$backup_tool" && test ! -L "$backup_tool" \
            || report_failure identity backup_check_unavailable 1

          release_identity="$(/usr/bin/python3 -I - "$runtime" "$expected_sha" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          runtime = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          sha_re = re.compile(r"[0-9a-f]{40}\Z")
          slug_re = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,179}\Z")

          def pairs_no_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError
                  result[key] = value
              return result

          def stable_release(pointer):
              before = pointer.lstat()
              if not stat.S_ISLNK(before.st_mode):
                  raise ValueError
              link_text = os.readlink(pointer)
              target = pointer.resolve(strict=True)
              releases = (runtime / "releases").resolve(strict=True)
              if target.parent != releases or not slug_re.fullmatch(target.name):
                  raise ValueError
              release_file = target / "RELEASE.json"
              named = release_file.lstat()
              if (
                  not stat.S_ISREG(named.st_mode)
                  or named.st_uid != os.geteuid()
                  or named.st_nlink != 1
                  or named.st_size <= 0
                  or named.st_size > 65536
              ):
                  raise ValueError
              descriptor = os.open(
                  release_file,
                  os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | os.O_NOFOLLOW,
              )
              try:
                  opened = os.fstat(descriptor)
                  if (
                      not stat.S_ISREG(opened.st_mode)
                      or opened.st_uid != os.geteuid()
                      or opened.st_nlink != 1
                      or (opened.st_dev, opened.st_ino, opened.st_size)
                      != (named.st_dev, named.st_ino, named.st_size)
                  ):
                      raise ValueError
                  chunks = []
                  remaining = 65537
                  while remaining:
                      chunk = os.read(descriptor, min(8192, remaining))
                      if not chunk:
                          break
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  raw = b"".join(chunks)
                  after = os.fstat(descriptor)
              finally:
                  os.close(descriptor)
              after_named = release_file.lstat()
              pointer_after = pointer.lstat()
              if (
                  len(raw) != named.st_size
                  or (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mtime_ns)
                  != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)
                  or (named.st_dev, named.st_ino, named.st_size, named.st_mtime_ns)
