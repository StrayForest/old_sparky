                  count = os.write(report_fd, view)
                  if count <= 0:
                      raise SystemExit("sanitized diagnostics stream write failed")
                  view = view[count:]
              os.ftruncate(report_fd, len(encoded))
              os.fsync(report_fd)
              finished = os.fstat(report_fd)
              named_after = os.lstat(report_path)
              if (
                  identity(finished) != identity(opened) or identity(named_after) != identity(opened)
                  or finished.st_size != len(encoded) or named_after.st_size != len(encoded)
              ):
                  raise SystemExit("sanitized diagnostics stream identity changed")
          finally:
              os.close(report_fd)
          SANITIZE_BACKUP_FAILURE
          fi
          if (( remote_exit_code == 0 )); then
            printf '{"schema":1,"kind":"collection_transport","status":"ok","stage":"complete","outcome":"none","exit_code":0}\n' \
              >>"$remote_report"
          elif (( remote_exit_code == 255 )); then
            printf '{"schema":1,"kind":"collection_transport","status":"failed","stage":"ssh_transport","outcome":"transport_failed","exit_code":%d}\n' \
              "$remote_exit_code" >>"$remote_report"
          else
            printf '{"schema":1,"kind":"collection_transport","status":"failed","stage":"remote_exit","outcome":"nonzero_exit","exit_code":%d}\n' \
              "$remote_exit_code" >>"$remote_report"
          fi
          chmod 600 "$remote_report"
          cp -- "$remote_report" "$artifact_report"
          chmod 600 "$artifact_report"
          printf 'remote_exit_code=%s\n' "$remote_exit_code" >>"$GITHUB_OUTPUT"
          printf 'report_ready=true\n' >>"$GITHUB_OUTPUT"
          if (( remote_exit_code == 255 )); then
            echo "Remote diagnostics transport failed (exit 255)." >&2
          elif (( remote_exit_code != 0 )); then
            echo "Remote diagnostics failed at a bounded stage (exit ${remote_exit_code})." >&2
          fi
          rm -f -- "$remote_report"
          test ! -e "$remote_report"

      - name: Remove production SSH material
        id: cleanup_ssh
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/platform-production-storage-diagnostics-ssh"
          if [[ -e "$ssh_dir" || -L "$ssh_dir" ]]; then
            test -d "$ssh_dir" && test ! -L "$ssh_dir"
            rm -f -- \
              "$ssh_dir/id_ed25519" \
              "$ssh_dir/known_hosts" \
              "$ssh_dir/known_hosts.scan" \
              "$ssh_dir/known_hosts.scan.1" \
              "$ssh_dir/known_hosts.scan.2" \
              "$ssh_dir/config" \
              "$ssh_dir/control.sock" \
              "$ssh_dir/control-master" \
              "$ssh_dir/control-master.sock"
            test ! -e "$ssh_dir/id_ed25519"
            test ! -e "$ssh_dir/known_hosts"
            test ! -e "$ssh_dir/known_hosts.scan"
            test ! -e "$ssh_dir/config"
            test ! -e "$ssh_dir/control.sock"
            test ! -e "$ssh_dir/control-master"
            test ! -e "$ssh_dir/control-master.sock"
            rmdir -- "$ssh_dir"
          fi
          test ! -e "$ssh_dir" && test ! -L "$ssh_dir"
          rm -f -- "$RUNNER_TEMP/platform-production-storage-diagnostics.txt"
          test ! -e "$RUNNER_TEMP/platform-production-storage-diagnostics.txt"
          rm -f -- "$RUNNER_TEMP/platform-production-storage-diagnostics-ssh-error"
          test ! -e "$RUNNER_TEMP/platform-production-storage-diagnostics-ssh-error"
          /usr/bin/python3 -I - "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'CLEANUP_BACKUP_FAILURE_FILES'
          import os
          import re
          import stat
          import sys

          runner_temp, run_id, attempt = sys.argv[1:]
          if re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is None or re.fullmatch(r"[1-9][0-9]{0,5}", attempt) is None:
              raise SystemExit("backup failure cleanup binding is invalid")
          names = (
              f"platform-production-backup-failure-helper-{run_id}-{attempt}.py",
              f"platform-production-backup-failure-receipt-{run_id}-{attempt}.json",
          )
          directory_fd = os.open(runner_temp, os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC | os.O_NOFOLLOW)
          try:
              for name in names:
                  try:
                      named = os.stat(name, dir_fd=directory_fd, follow_symlinks=False)
                  except FileNotFoundError:
                      continue
                  if (
                      not stat.S_ISREG(named.st_mode)
                      or named.st_uid != os.geteuid()
                      or stat.S_IMODE(named.st_mode) != 0o600
                      or named.st_nlink != 1
                  ):
                      raise SystemExit("backup failure temporary file identity is invalid")
                  descriptor = os.open(name, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW, dir_fd=directory_fd)
                  try:
                      opened = os.fstat(descriptor)
                      identity = lambda value: (
                          value.st_dev, value.st_ino, value.st_mode, value.st_uid,
                          value.st_gid, value.st_nlink, value.st_size,
                          value.st_mtime_ns, value.st_ctime_ns,
                      )
                      current = os.stat(name, dir_fd=directory_fd, follow_symlinks=False)
                      if identity(opened) != identity(named) or identity(current) != identity(opened):
                          raise SystemExit("backup failure temporary file changed during cleanup")
                      os.unlink(name, dir_fd=directory_fd)
                      try:
                          os.stat(name, dir_fd=directory_fd, follow_symlinks=False)
                      except FileNotFoundError:
                          pass
                      else:
                          raise SystemExit("backup failure temporary file remains after cleanup")
                  finally:
                      os.close(descriptor)
          finally:
              os.close(directory_fd)
          CLEANUP_BACKUP_FAILURE_FILES
          printf '%s\n' 'BACKUP_FAILURE_HELPER_PATH=' >> "$GITHUB_ENV"
          printf '%s\n' 'BACKUP_FAILURE_RECEIPT_PATH=' >> "$GITHUB_ENV"
          printf '%s\n' 'SSH_DIR=' >> "$GITHUB_ENV"
          unset SSH_DIR
          test -z "${SSH_DIR:-}"

      - name: Upload storage diagnostic evidence
        if: ${{ always() && steps.cleanup_ssh.outcome == 'success' && steps.collect_storage.outputs.report_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-production-storage-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-production-storage-diagnostics-artifact.txt
          if-no-files-found: error
          retention-days: 14

      - name: Preserve remote collection failure status
        if: ${{ always() && steps.collect_storage.outputs.remote_exit_code != '' && steps.collect_storage.outputs.remote_exit_code != '0' }}
        shell: bash
        env:
          REMOTE_EXIT_CODE: ${{ steps.collect_storage.outputs.remote_exit_code }}
        run: |
          set -euo pipefail
          [[ "$REMOTE_EXIT_CODE" =~ ^[1-9][0-9]{0,2}$ ]] \
            || { echo "Remote diagnostic exit status was not a bounded integer." >&2; exit 2; }
          echo "Remote storage diagnostics returned exit $REMOTE_EXIT_CODE after evidence upload." >&2
          exit "$REMOTE_EXIT_CODE"
