name: Platform production distributed Ready Check SSE

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN-PRODUCTION-DISTRIBUTED-READY-CHECK-SSE to create temporary production QA data"
        required: true
        type: string
      control_email:
        description: "Existing account used only for exact retained-load cleanup provenance"
        required: true
        default: "aleksei.lisitsin1@gmail.com"
        type: string
      scenario:
        description: "Five external shards; capacity stages are intentionally explicit"
        required: true
        default: "sanity-20"
        type: choice
        options:
          - sanity-20
          - sanity-100
          - capacity-5000
          - capacity-7500
          - capacity-10000
      duration:
        description: "Seconds to hold each stream after the Ready Check event (1-900)"
        required: true
        default: "60"
        type: string
      open_timeout:
        description: "Bounded public SSE handshake timeout in seconds (0.5-60)"
        required: true
        default: "5"
        type: string
      barrier_timeout:
        description: "Maximum seconds to wait for all external shards (60-3600)"
        required: true
        default: "1800"
        type: string

permissions:
  contents: read

concurrency:
  group: platform-production-distributed-ready-check-sse
  cancel-in-progress: false

jobs:
  validate:
    name: Validate distributed public Ready Check parameters
    runs-on: ubuntu-latest
    outputs:
      connections_per_shard: ${{ steps.parameters.outputs.connections_per_shard }}
      total_connections: ${{ steps.parameters.outputs.total_connections }}
      capacity_limit: ${{ steps.parameters.outputs.capacity_limit }}
    steps:
      - name: Validate explicit production distributed-load confirmation
        id: parameters
        shell: bash
        env:
          QA_CONFIRMATION: ${{ inputs.confirmation }}
          QA_SCENARIO: ${{ inputs.scenario }}
          QA_CONTROL_EMAIL: ${{ inputs.control_email }}
          QA_DURATION: ${{ inputs.duration }}
          QA_OPEN_TIMEOUT: ${{ inputs.open_timeout }}
          QA_BARRIER_TIMEOUT: ${{ inputs.barrier_timeout }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" || {
            echo "Distributed public load must run from the reviewed dev branch." >&2
            exit 1
          }
          test "$QA_CONFIRMATION" = "RUN-PRODUCTION-DISTRIBUTED-READY-CHECK-SSE" || {
            echo "Refusing production load without exact confirmation." >&2
            exit 1
          }
          [[ "$QA_CONTROL_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+$ ]] || {
            echo "control_email is invalid." >&2
            exit 1
          }
          case "$QA_SCENARIO" in
            sanity-20) connections_per_shard=20; capacity_limit=100 ;;
            sanity-100) connections_per_shard=100; capacity_limit=500 ;;
            capacity-5000) connections_per_shard=1000; capacity_limit=5000 ;;
            capacity-7500) connections_per_shard=1500; capacity_limit=7500 ;;
            capacity-10000) connections_per_shard=2000; capacity_limit=10000 ;;
            *) echo "Unsupported distributed scenario." >&2; exit 1 ;;
          esac
          /usr/bin/python3 - "$QA_DURATION" "$QA_OPEN_TIMEOUT" "$QA_BARRIER_TIMEOUT" <<'PY'
          import sys

          duration, open_timeout, barrier_timeout = map(float, sys.argv[1:])
          if not 1 <= duration <= 900:
              raise SystemExit("duration must be between 1 and 900 seconds")
          if not 0.5 <= open_timeout <= 60:
              raise SystemExit("open_timeout must be between 0.5 and 60 seconds")
          if not 60 <= barrier_timeout <= 3600:
              raise SystemExit("barrier_timeout must be between 60 and 3600 seconds")
          PY
          echo "connections_per_shard=$connections_per_shard" >> "$GITHUB_OUTPUT"
          echo "total_connections=$((5 * connections_per_shard))" >> "$GITHUB_OUTPUT"
          echo "capacity_limit=$capacity_limit" >> "$GITHUB_OUTPUT"
          echo "Distributed scenario=$QA_SCENARIO target=$((5 * connections_per_shard)) aggregate_open_rate=25 shard_open_rate=5"

  prepare:
    name: Prepare one shared Ready Check fixture on origin
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      QA_CONFIRMATION: ${{ inputs.confirmation }}
      CONTROL_EMAIL: ${{ inputs.control_email }}
      TARGET_SHA: ${{ github.sha }}
      CONNECTIONS_PER_SHARD: ${{ needs.validate.outputs.connections_per_shard }}
      CAPACITY_LIMIT: ${{ needs.validate.outputs.capacity_limit }}
      QA_DURATION: ${{ inputs.duration }}
      QA_OPEN_TIMEOUT: ${{ inputs.open_timeout }}
      QA_BARRIER_TIMEOUT: ${{ inputs.barrier_timeout }}
    steps:
      - name: Validate production SSH inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_HOST:-}" && test -n "${PROD_SSH_USER:-}" && test -n "${PROD_SSH_KEY:-}" || {
            echo "Production SSH is not configured." >&2
            exit 1
          }
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/distributed-ready-check-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test "$(wc -l < "$ssh_scan" | tr -d ' ')" = "1"
          test "$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"
      - name: Start origin-only fixture coordinator
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            bash -s -- "$QA_CONFIRMATION" "$TARGET_SHA" "$CONTROL_EMAIL" "$GITHUB_RUN_ID" \
              5 "$CONNECTIONS_PER_SHARD" "$QA_DURATION" "$QA_OPEN_TIMEOUT" \
              "$CAPACITY_LIMIT" "$QA_BARRIER_TIMEOUT" start <<'REMOTE'
          set -Eeuo pipefail
          sudo -n -- /root/old_sparky/platform/tools/platform_production_distributed_ready_check_qa.sh "$@"
          REMOTE

  shard:
    name: Public SSE shard ${{ matrix.shard }}
    needs: [validate, prepare]
    if: ${{ always() && needs.prepare.result == 'success' && needs.validate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SHARD: ${{ matrix.shard }}
      TARGET_SHA: ${{ github.sha }}
      CONNECTIONS_PER_SHARD: ${{ needs.validate.outputs.connections_per_shard }}
      QA_DURATION: ${{ inputs.duration }}
      QA_OPEN_TIMEOUT: ${{ inputs.open_timeout }}
    steps:
      - name: Checkout exact generator source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up generator Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned generator dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input 'httpx==0.28.1'
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/distributed-ready-check-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test "$(wc -l < "$ssh_scan" | tr -d ' ')" = "1"
          test "$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"
      - name: Run external public shard
        id: shard-run
        shell: bash
        run: |
          set -euo pipefail
          nofile_hard="$(ulimit -Hn)"
          if [[ "$nofile_hard" =~ ^[0-9]+$ ]] && (( nofile_hard >= 65535 )); then
            ulimit -n 65535
          fi
          manifest="$RUNNER_TEMP/distributed-ready-check-shard-$SHARD.json"
          report="$RUNNER_TEMP/distributed-ready-check-shard-$SHARD-report.json"
          trap 'rm -f -- "$manifest"' EXIT
          ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            sudo -n -- /root/old_sparky/platform/tools/platform_distributed_ready_check_files.py \
              --action read-file --run-id "$GITHUB_RUN_ID" --shard "$SHARD" --kind manifest \
            > "$manifest"
          chmod 600 "$manifest"
          set +e
          python platform/tools/platform_distributed_ready_check_sse.py \
            --role shard \
            --run-id "$GITHUB_RUN_ID" \
            --target-sha "$TARGET_SHA" \
            --origin https://old-sparky.com \
            --request-origin https://old-sparky.com \
            --shard "$SHARD" \
            --connections-per-shard "$CONNECTIONS_PER_SHARD" \
            --duration "$QA_DURATION" \
            --open-timeout "$QA_OPEN_TIMEOUT" \
            --agenda-rate 5 \
            --open-rate 5 \
            --manifest "$manifest" \
            --ssh-config "$SSH_DIR/config" \
            --ssh-host "$PROD_SSH_HOST" \
            --ssh-user "$PROD_SSH_USER" \
            --ssh-identity "$SSH_DIR/id_ed25519" \
            --report-path "$report"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: platform-distributed-ready-check-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/distributed-ready-check-shard-${{ matrix.shard }}-report.json
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    name: Aggregate distributed public evidence
    needs: [validate, shard]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      TARGET_SHA: ${{ github.sha }}
      CONTROL_EMAIL: ${{ inputs.control_email }}
      TOTAL_CONNECTIONS: ${{ needs.validate.outputs.total_connections }}
    steps:
      - name: Download all shard reports
        uses: actions/download-artifact@v6
        with:
          pattern: platform-distributed-ready-check-shard-*
          path: ${{ runner.temp }}/distributed-ready-check-reports
          merge-multiple: true
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/distributed-ready-check-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test "$(wc -l < "$ssh_scan" | tr -d ' ')" = "1"
          test "$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"
      - name: Export coordinator and origin evidence
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/distributed-ready-check-final"
          install -d -m 700 "$out"
          for spec in "summary:matrix-summary.json" "report:distributed-report.json" "qa-log:qa-command.log"; do
            kind="${spec%%:*}"
            name="${spec#*:}"
            set +e
            ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
              sudo -n -- /root/old_sparky/platform/tools/platform_distributed_ready_check_files.py \
                --action read-file --run-id "$GITHUB_RUN_ID" --kind "$kind" \
              > "$out/$name"
            status=$?
            set -e
            if (( status != 0 )); then rm -f -- "$out/$name"; fi
          done
      - name: Validate and summarize distributed evidence
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP/distributed-ready-check-final/matrix-summary.json" \
            "$RUNNER_TEMP/distributed-ready-check-final/distributed-report.json" \
            "$RUNNER_TEMP/distributed-ready-check-reports" "$TOTAL_CONNECTIONS" \
            "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/distributed-ready-check-final/aggregate.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          summary_path, detail_path, reports_dir, total_raw, step_summary, aggregate_path = sys.argv[1:]
          total = int(total_raw)
          try:
              summary = json.loads(Path(summary_path).read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              summary = {"passed": False, "distributed": {}}
          reports = []
          for path in sorted(Path(reports_dir).glob("distributed-ready-check-shard-*-report.json")):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if isinstance(payload, dict):
                  reports.append(payload)
          distributed = summary.get("distributed") if isinstance(summary.get("distributed"), dict) else {}
          ips = [str((row.get("egress") or {}).get("ip") or "") for row in reports]
          sse_rows = [row.get("sse") or {} for row in reports]
          connect_samples = [value for row in sse_rows for value in row.get("connect_latency_samples_ms", [])]
          event_samples = [value for row in sse_rows for value in row.get("event_latency_samples_ms", [])]

          def pct(values, p):
              if not values:
                  return None
              values = sorted(float(value) for value in values)
              rank = (len(values) - 1) * p / 100
              lower = int(rank)
              upper = min(lower + 1, len(values) - 1)
              return round(values[lower] + (values[upper] - values[lower]) * (rank - lower), 2)

          aggregate = {
              "target_connections": total,
              "shards": len(reports),
              "attempted": sum(int(row.get("attempted") or 0) for row in sse_rows),
              "connected": sum(int(row.get("connected") or 0) for row in sse_rows),
              "events_received": sum(int(row.get("events") or 0) for row in sse_rows),
              "error_1200": sum(int(row.get("error_1200") or 0) for row in sse_rows),
              "cloudflare_5xx": sum(int(row.get("cloudflare_5xx") or 0) for row in sse_rows),
              "rejected_429": sum(int(row.get("rejected_429") or 0) for row in sse_rows),
              "errors": sum(int(row.get("errors") or 0) for row in sse_rows),
              "handshake_timeouts": sum(int(row.get("handshake_timeouts") or 0) for row in sse_rows),
              "unexpected_disconnects": sum(int(row.get("unexpected_disconnects") or 0) for row in sse_rows),
              "egress_ips": ips,
              "independent_egress": len(ips) == len(set(ips)) == 5 and all(ips),
              "opening_rate_per_second": sum(int(row.get("attempted") or 0) for row in sse_rows) / max(0.001, max((float(row.get("opening_finished_at") or 0) for row in sse_rows), default=0) - min((float(row.get("opening_started_at") or 0) for row in sse_rows), default=0)),
              "connect_latency_ms": {"p50": pct(connect_samples, 50), "p95": pct(connect_samples, 95), "p99": pct(connect_samples, 99), "max": max(connect_samples, default=None)},
              "event_latency_ms": {"p50": pct(event_samples, 50), "p95": pct(event_samples, 95), "p99": pct(event_samples, 99), "max": max(event_samples, default=None)},
              "coordinator_passed": summary.get("passed") is True,
          }
          Path(aggregate_path).write_text(json.dumps({"coordinator": distributed, "external": aggregate}, indent=2) + "\n", encoding="utf-8")
          with Path(step_summary).open("a", encoding="utf-8") as handle:
              handle.write("### Distributed public Ready Check SSE\n\n")
              handle.write(f"- Coordinator result: **{'PASS' if summary.get('passed') is True else 'FAIL'}**\n")
              handle.write(f"- External shards: **{len(reports)}/5**; egress IPs independent: **{aggregate['independent_egress']}**\n")
              handle.write(f"- SSE: **{aggregate['connected']}/{total}** connected; events: **{aggregate['events_received']}**; Error 1200: **{aggregate['error_1200']}**; Cloudflare 5xx: **{aggregate['cloudflare_5xx']}**; 429: **{aggregate['rejected_429']}**; handshake timeouts: **{aggregate['handshake_timeouts']}**\n")
              handle.write(f"- Actual aggregate opening rate: **{aggregate['opening_rate_per_second']:.2f}/s** (configured 25/s); connect p95/p99: **{aggregate['connect_latency_ms']['p95']} / {aggregate['connect_latency_ms']['p99']} ms**; event p95/p99: **{aggregate['event_latency_ms']['p95']} / {aggregate['event_latency_ms']['p99']} ms**\n\n")
              handle.write("| Shard | Egress IP | Colo | Agenda | Connected | Event | Error 1200 | CF 5xx | 429 | Unexpected disconnects |\n|---:|---|---|---:|---:|---:|---:|---:|---:|---:|\n")
              for row in reports:
                  sse = row.get("sse") or {}
                  agenda = row.get("agenda") or {}
                  egress = row.get("egress") or {}
                  handle.write(f"| {row.get('shard')} | `{egress.get('ip', '-')}` | `{egress.get('colo', '-')}` | {agenda.get('successful', 0)}/{agenda.get('attempted', 0)} | {sse.get('connected', 0)}/{sse.get('attempted', 0)} | {sse.get('events', 0)} | {sse.get('error_1200', 0)} | {sse.get('cloudflare_5xx', 0)} | {sse.get('rejected_429', 0)} | {sse.get('unexpected_disconnects', 0)} |\n")
          if not (
              summary.get("passed") is True
              and aggregate["shards"] == 5
              and aggregate["independent_egress"]
              and aggregate["connected"] == total
              and aggregate["events_received"] == total
              and aggregate["error_1200"] == 0
              and aggregate["cloudflare_5xx"] == 0
              and aggregate["rejected_429"] == 0
              and aggregate["errors"] == 0
              and aggregate["handshake_timeouts"] == 0
              and aggregate["unexpected_disconnects"] == 0
          ):
              raise SystemExit("distributed public Ready Check strict gate failed")
      - name: Publish aggregate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: platform-production-distributed-ready-check-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/distributed-ready-check-final/*.json
            ${{ runner.temp }}/distributed-ready-check-final/distributed-report.json
            ${{ runner.temp }}/distributed-ready-check-final/qa-command.log
            ${{ runner.temp }}/distributed-ready-check-reports/*.json
          if-no-files-found: warn
          retention-days: 14

  cleanup:
    name: Cleanup exact distributed Ready Check fixture
    needs: [validate, shard, aggregate]
    if: ${{ always() && needs.validate.result == 'success' && needs.aggregate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      TARGET_SHA: ${{ github.sha }}
      CONTROL_EMAIL: ${{ inputs.control_email }}
    steps:
      - name: Configure pinned production SSH
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/distributed-ready-check-cleanup-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          ssh_scan="$ssh_dir/known_hosts.scan"
          ssh-keyscan -T 10 -t ed25519 "$PROD_SSH_HOST" > "$ssh_scan"
          test "$(wc -l < "$ssh_scan" | tr -d ' ')" = "1"
          test "$(ssh-keygen -lf "$ssh_scan" -E sha256 | awk 'NR == 1 {print $2}')" = "SHA256:1SvoVPU2QXAxj3TlwX3DO/7wGPdl3WcKXPIM87xSQ+Y"
          install -m 600 "$ssh_scan" "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *'
            printf '%s\n' '  StrictHostKeyChecking yes'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 600 "$ssh_dir/config"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"
      - name: Run exact retained-load cleanup
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$SSH_DIR/config" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i "$SSH_DIR/id_ed25519" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            sudo -n -- /root/old_sparky/platform/tools/platform_production_retained_load_cleanup_qa.sh \
              DELETE-PRODUCTION-RETAINED-LOAD "$TARGET_SHA" "$GITHUB_RUN_ID" "$CONTROL_EMAIL" "$GITHUB_RUN_ID"
