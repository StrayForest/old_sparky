map $http_upgrade $platform_connection_upgrade {
    default upgrade;
    "" close;
}

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;
limit_req_zone $binary_remote_addr zone=platform_csp_reports:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=platform_media_uploads:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=platform_media_connections:1m;

log_format platform_json escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"cf_ray":"$http_cf_ray",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"host":"$host",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"bytes":$body_bytes_sent}';

# Generated and updated by platform_update_cloudflare_ips.py. The file must
# contain only validated Cloudflare set_real_ip_from directives.
include /etc/nginx/cloudflare-real-ip.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name old-sparky.com;
    return 301 https://old-sparky.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name old-sparky.com;
    server_tokens off;

    if ($host != old-sparky.com) {
        return 444;
    }

    ssl_certificate /opt/oldsparky/platform/shared/tls/old-sparky.com-origin.pem;
    ssl_certificate_key /opt/oldsparky/platform/shared/tls/old-sparky.com-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:platform_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/platform-access.log platform_json;
    error_log /var/log/nginx/platform-error.log warn;

    client_max_body_size 6m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    include /etc/nginx/snippets/deadlock-platform-security-headers.conf;

    location = /api/v1/health/live {
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        auth_basic off;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/health/ready {
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        auth_basic off;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/api/v1/tournaments/[^/]+/bracket/events$ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/security/csp-report {
        client_max_body_size 32k;
        limit_req zone=platform_csp_reports burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_cache off;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Expand/contract fallback for the two retained local legacy uploads.
    # New prepared media is returned as direct cdn.old-sparky.com URLs.
    location /api/v1/uploads/ {
        alias /opt/oldsparky/platform/shared/uploads/;
        try_files $uri =404;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Legacy-Media "1" always;
    }

    location ~ ^/api/v1/(?:profiles/me/(?:avatar|banner)|tournaments/[^/]+/banner)$ {
        client_max_body_size 6m;
        limit_req zone=platform_media_uploads burst=10 nodelay;
        limit_conn platform_media_connections 2;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_cache off;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_redirect off;
        proxy_cache off;
        proxy_no_cache 1;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /_next/static/ {
        alias /opt/oldsparky/platform/current/apps/platform_web/.next/static/;
        try_files $uri =404;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        alias /opt/oldsparky/platform/current/apps/platform_web/public/assets/;
        try_files $uri =404;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $platform_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_redirect off;
        proxy_cache off;
        proxy_no_cache 1;
        include /etc/nginx/snippets/deadlock-platform-security-headers.conf;
        add_header Cache-Control "private, no-store" always;
    }
}
