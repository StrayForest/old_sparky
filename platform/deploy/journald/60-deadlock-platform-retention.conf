[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=256M
SystemKeepFree=5G
SystemMaxFileSize=32M
SystemMaxFiles=12
RuntimeMaxUse=64M
RuntimeMaxFileSize=16M
RuntimeMaxFiles=4
MaxRetentionSec=30day
RateLimitIntervalSec=30s
RateLimitBurst=5000
# Journald is the canonical service log. Avoid forwarding every API/worker
# record into the duplicate /var/log/syslog stream.
ForwardToSyslog=no
